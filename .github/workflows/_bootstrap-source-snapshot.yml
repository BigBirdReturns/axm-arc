name: Materialize authenticated answer transport

on:
  push:
    branches:
      - feature/asoiaf-answer-desk-transport-v1
    paths:
      - .github/workflows/_bootstrap-source-snapshot.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.repository == 'BigBirdReturns/axm-arc'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact carrier head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Materialize exact permanent transport surfaces
        shell: bash
        run: |
          set -euo pipefail
          cat .github/materialize/asoiaf-answer-transport/part-*.b64 \
            | base64 --decode > "$RUNNER_TEMP/asoiaf-answer-transport-payload.tgz"
          printf '%s  %s\n' \
            'fee1ba7abf19b56384ca08016cbf8ef8dce5400e7c1ff375cca9a17616406b30' \
            "$RUNNER_TEMP/asoiaf-answer-transport-payload.tgz" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/asoiaf-answer-transport-payload.tgz"
          rm -rf .github/materialize/asoiaf-answer-transport
          rm .github/workflows/_bootstrap-source-snapshot.yml

          cat > "$RUNNER_TEMP/expected-paths" <<'EOF'
          .github/materialize/asoiaf-answer-transport/part-00.b64
          .github/materialize/asoiaf-answer-transport/part-01.b64
          .github/materialize/asoiaf-answer-transport/part-02.b64
          .github/materialize/asoiaf-answer-transport/part-03.b64
          .github/materialize/asoiaf-answer-transport/part-04.b64
          .github/materialize/asoiaf-answer-transport/part-05.b64
          .github/workflows/_bootstrap-source-snapshot.yml
          .github/workflows/asoiaf-answer-desk-transport.yml
          docs/ASOIAF_ANSWER_DESK_TRANSPORT.md
          package.json
          tests/fixtures/emit-asoiaf-answer-desk-transport-input.ts
          tests/narrative/canon/asoiaf-answer-desk-transport.test.ts
          tools/asoiaf-answer-desk-transport.ts
          tools/lib/asoiaf-answer-desk-transport.ts
          EOF

          git diff --check
          git add -A
          git diff --cached --name-only | sort > "$RUNNER_TEMP/actual-paths"
          sort "$RUNNER_TEMP/expected-paths" -o "$RUNNER_TEMP/expected-paths"
          diff -u "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/actual-paths"

      - name: Commit exact permanent transport surfaces
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BigBirdReturns transport qualification'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Authenticate external ASOIAF answer transport'
          git push origin HEAD:feature/asoiaf-answer-desk-transport-v1
