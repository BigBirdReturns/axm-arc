name: Publish authenticated answer transport workflow blob

on:
  pull_request:
    branches:
      - feature/asoiaf-answer-desk-exchange-v1
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/_bootstrap-source-snapshot.yml

permissions:
  contents: write

concurrency:
  group: publish-authenticated-answer-transport-workflow-blob
  cancel-in-progress: true

jobs:
  publish_blob:
    if: >-
      github.repository == 'BigBirdReturns/axm-arc'
      && github.event.pull_request.head.ref == 'feature/asoiaf-answer-desk-transport-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact ordinary-code head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Recover and publish exact permanent workflow blob
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          test -z "$(git status --porcelain)"

          carrier='358477507871ae9b756e02b72c2495a6563b4b20'
          carrier_prefix='.github/materialize/asoiaf-answer-transport/part-'
          : > "$RUNNER_TEMP/transport-payload.b64"
          for suffix in 00 01 02 03 04 05; do
            git show "${carrier}:${carrier_prefix}${suffix}.b64" \
              >> "$RUNNER_TEMP/transport-payload.b64"
          done
          base64 --decode "$RUNNER_TEMP/transport-payload.b64" \
            > "$RUNNER_TEMP/transport-payload.tgz"
          printf '%s  %s\n' \
            'fee1ba7abf19b56384ca08016cbf8ef8dce5400e7c1ff375cca9a17616406b30' \
            "$RUNNER_TEMP/transport-payload.tgz" \
            | sha256sum --check --strict

          mkdir -p "$RUNNER_TEMP/workflow"
          tar -xzf "$RUNNER_TEMP/transport-payload.tgz" \
            -C "$RUNNER_TEMP/workflow" \
            .github/workflows/asoiaf-answer-desk-transport.yml
          workflow="$RUNNER_TEMP/workflow/.github/workflows/asoiaf-answer-desk-transport.yml"
          printf '%s  %s\n' \
            '8faca041de3d2009ac82fe3009abb3aaf0da8829f7f31333a49ea18bbcf5792c' \
            "$workflow" \
            | sha256sum --check --strict

          WORKFLOW_PATH="$workflow" node <<'NODE'
          const fs = require('node:fs');
          const path = process.env.WORKFLOW_PATH;
          const repository = process.env.REPOSITORY;
          const token = process.env.GH_TOKEN;
          if (!path || !repository || !token) throw new Error('missing workflow publication environment');
          const response = await fetch(`https://api.github.com/repos/${repository}/git/blobs`, {
            method: 'POST',
            headers: {
              Accept: 'application/vnd.github+json',
              Authorization: `Bearer ${token}`,
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'axm-arc-transport-workflow-publisher',
            },
            body: JSON.stringify({
              content: fs.readFileSync(path).toString('base64'),
              encoding: 'base64',
            }),
          });
          const body = await response.json();
          if (!response.ok || typeof body.sha !== 'string') {
            throw new Error(`blob publication failed: ${response.status} ${JSON.stringify(body)}`);
          }
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/transport-workflow-blob-sha.txt`, `${body.sha}\n`);
          console.log(`TRANSPORT_WORKFLOW_BLOB_SHA=${body.sha}`);
          NODE

          blob_sha="$(cat "$RUNNER_TEMP/transport-workflow-blob-sha.txt")"
          test "${#blob_sha}" -eq 40
          echo "blob_sha=$blob_sha" >> "$GITHUB_OUTPUT"
          {
            echo '## Authenticated answer transport workflow blob'
            echo
            echo "- Candidate head: \`${{ github.event.pull_request.head.sha }}\`"
            echo "- Workflow blob: \`$blob_sha\`"
            echo '- Workflow content digest: `sha256:8faca041de3d2009ac82fe3009abb3aaf0da8829f7f31333a49ea18bbcf5792c`'
          } >> "$GITHUB_STEP_SUMMARY"
