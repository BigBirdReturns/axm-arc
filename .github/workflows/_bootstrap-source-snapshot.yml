name: Materialize final authenticated answer transport fixture

on:
  pull_request:
    branches:
      - feature/asoiaf-answer-desk-exchange-v1
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/_bootstrap-source-snapshot.yml

permissions:
  contents: write

concurrency:
  group: materialize-final-authenticated-answer-transport-fixture
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.repository == 'BigBirdReturns/axm-arc'
      && github.event.pull_request.head.ref == 'feature/asoiaf-answer-desk-transport-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact carrier head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Materialize exact fixture and remove temporary carriers
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          test -z "$(git status --porcelain)"

          carrier='.github/materialize/asoiaf-answer-transport-fixture/part-00.b64'
          test -f "$carrier"
          base64 --decode "$carrier" > "$RUNNER_TEMP/transport-fixture-update.tgz"
          printf '%s  %s\n' \
            'b91074c0b8e3ed0edcbba171de3a2a0372c690d597e101158dc600a19b9d9820' \
            "$RUNNER_TEMP/transport-fixture-update.tgz" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/transport-fixture-update.tgz"

          rm -rf .github/materialize/asoiaf-answer-transport-fixture
          rm -rf .github/transport-workflow-payload

          cat > "$RUNNER_TEMP/expected-paths" <<'EOF'
          .github/materialize/asoiaf-answer-transport-fixture/part-00.b64
          .github/transport-workflow-payload/chunks/part-00.b64
          .github/transport-workflow-payload/chunks/part-01.b64
          .github/transport-workflow-payload/chunks/part-02.b64
          .github/transport-workflow-payload/chunks/part-03.b64
          .github/transport-workflow-payload/workflow.yml.gz.b64
          tests/fixtures/emit-asoiaf-answer-desk-transport-input.ts
          EOF

          git diff --check
          git add -A \
            .github/materialize/asoiaf-answer-transport-fixture \
            .github/transport-workflow-payload \
            tests/fixtures/emit-asoiaf-answer-desk-transport-input.ts
          git diff --cached --name-only | sort > "$RUNNER_TEMP/actual-paths"
          sort "$RUNNER_TEMP/expected-paths" -o "$RUNNER_TEMP/expected-paths"
          diff -u "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/actual-paths"

      - name: Commit exact final ordinary surfaces
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BigBirdReturns transport qualification'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Finalize authenticated ASOIAF transport fixture'
          git push origin HEAD:feature/asoiaf-answer-desk-transport-v1
