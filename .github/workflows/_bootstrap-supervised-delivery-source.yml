name: Materialize permanent supervised delivery surfaces

on:
  push:
    branches:
      - feature/asoiaf-answer-desk-supervised-delivery-v1
    paths:
      - '.github/workflows/_bootstrap-supervised-delivery-source.yml'
  pull_request:
    branches:
      - integration/asoiaf-answer-desk-supervised-transport-v1
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.github/workflows/_bootstrap-supervised-delivery-source.yml'

permissions:
  contents: write

concurrency:
  group: materialize-permanent-supervised-delivery-surfaces
  cancel-in-progress: true

jobs:
  materialize:
    if: >-
      github.repository == 'BigBirdReturns/axm-arc'
      && github.event.pull_request.head.ref == 'feature/asoiaf-answer-desk-supervised-delivery-v1'
      || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact carrier head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Materialize exact ordinary surfaces and remove temporary carriers
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          carrier='.github/materialize/asoiaf-answer-supervised-delivery/part-00.b64'
          test -f "$carrier"
          printf '%s  %s\n' \
            '6fccc952899c22081590a8d96e3f9941a7b91c10d189eb0903c90d0cdbae56f0' \
            "$carrier" \
            | sha256sum --check --strict
          base64 --decode "$carrier" > "$RUNNER_TEMP/supervised-delivery-surfaces.tgz"
          printf '%s  %s\n' \
            '41e96026361b7e9acc73318fdc2290a61a5e20c02d3a7f1e78d49dac9de56a60' \
            "$RUNNER_TEMP/supervised-delivery-surfaces.tgz" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/supervised-delivery-surfaces.tgz"

          rm -rf .github/materialize/asoiaf-answer-supervised-delivery
          rm .github/workflows/_bootstrap-supervised-delivery-source.yml

          grep -q '"asoiaf:answer-supervised-delivery"' package.json
          grep -q '^# ASOIAF supervised answer-desk delivery$' docs/ASOIAF_ANSWER_DESK_SUPERVISED_DELIVERY.md
          grep -q 'ASOIAF supervised answer-desk delivery' tools/asoiaf-answer-desk-supervised-delivery.ts
          test -z "$(grep -R 'STEP ' tests/fixtures/emit-asoiaf-answer-desk-supervised-delivery-input.ts || true)"

          cat > "$RUNNER_TEMP/expected-paths" <<'EOF'
          .github/materialize/asoiaf-answer-supervised-delivery/part-00.b64
          .github/workflows/_bootstrap-supervised-delivery-source.yml
          docs/ASOIAF_ANSWER_DESK_SUPERVISED_DELIVERY.md
          package.json
          tests/fixtures/emit-asoiaf-answer-desk-supervised-delivery-input.ts
          tests/narrative/canon/asoiaf-answer-desk-supervised-delivery.test.ts
          tools/asoiaf-answer-desk-supervised-delivery.ts
          tools/lib/asoiaf-answer-desk-supervised-delivery.ts
          EOF

          git diff --check
          git add -A
          git diff --cached --name-only | sort > "$RUNNER_TEMP/actual-paths"
          sort "$RUNNER_TEMP/expected-paths" -o "$RUNNER_TEMP/expected-paths"
          diff -u "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/actual-paths"

      - name: Commit exact ordinary surfaces
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BigBirdReturns supervised delivery qualification'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Bind supervised intents to authenticated remote delivery'
          git push origin HEAD:feature/asoiaf-answer-desk-supervised-delivery-v1
