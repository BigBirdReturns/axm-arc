name: Inspect failed PR258 recovery publication

on:
  push:
    branches:
      - feature/asoiaf-answer-desk-supervised-delivery-v1
    paths:
      - '.github/workflows/_bootstrap-supervised-delivery-source.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: inspect-failed-pr258-recovery-publication
  cancel-in-progress: false

jobs:
  inspect:
    if: github.repository == 'BigBirdReturns/axm-arc' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_SHA: 58476b1809bebf4c403046349c41b3b433946b8f
      TARGET_PATH: .github/workflows/_diagnose-supervised-delivery-payload.yml
    steps:
      - name: Resolve the exact push-triggered publication run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pr258-recovery-publication-inspection"
          mkdir -p "$out/logs"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&event=push&per_page=100" \
            > "$out/runs.json"
          jq -r --arg path "$TARGET_PATH" \
            '.workflow_runs[] | select(.path == $path) | [.id,.name,.status,.conclusion,.event,.head_sha,.html_url] | @tsv' \
            "$out/runs.json" > "$out/matching-runs.tsv"
          test "$(wc -l < "$out/matching-runs.tsv" | tr -d ' ')" = '1'
          run_id="$(cut -f1 "$out/matching-runs.tsv")"
          printf '%s\n' "$run_id" > "$out/observed-run-id.txt"
          printf '%s\n' "$run_id" > "$RUNNER_TEMP/observed-run-id.txt"

          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100" \
            > "$out/jobs.json"
          jq -r '.jobs[] | [.id,.name,.status,.conclusion] | @tsv' "$out/jobs.json" \
            > "$out/jobs.tsv"

          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed \
            > "$out/failed.log" 2>&1 || true
          while IFS=$'\t' read -r job_id _; do
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/$GITHUB_REPOSITORY/actions/jobs/$job_id/logs" \
              > "$out/logs/$job_id.log" 2>&1 || true
          done < "$out/jobs.tsv"

          find "$out" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $out/#  #" > "$out/SHA256SUMS"

      - name: Upload bounded publication inspection
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr258-recovery-publication-inspection-${{ github.run_id }}
          path: ${{ runner.temp }}/pr258-recovery-publication-inspection
          if-no-files-found: error
          retention-days: 2
          compression-level: 6
          overwrite: false

      - name: Report exact inspection custody
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$(cat "$RUNNER_TEMP/observed-run-id.txt")"
          gh pr comment 258 --repo "$GITHUB_REPOSITORY" --body "Observed the failed push-triggered recovery publication as workflow run \`$run_id\` for exact construction head \`$TARGET_SHA\`. Job metadata and failed logs are retained in diagnostic artifact \`$ARTIFACT_ID\`. This observer issued no source, branch, implementation, or qualification mutation."
