name: Materialize ASOIAF answer transport operations surfaces

on:
  push:
    branches:
      - feature/asoiaf-answer-desk-transport-operations-v1
    paths:
      - '.github/workflows/_bootstrap-transport-operations-source.yml'

permissions:
  contents: write

concurrency:
  group: materialize-asoiaf-answer-transport-operations
  cancel-in-progress: true

jobs:
  materialize:
    if: github.repository == 'BigBirdReturns/axm-arc'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact carrier head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Verify and materialize exact ordinary surfaces
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          test -z "$(git status --porcelain)"

          carrier_root='.github/materialize/asoiaf-answer-desk-transport-operations'
          printf '%s  %s\n' \
            '181139dfbe118cd35651108d490f3f9852a52691559dbad1de86036e9a81d943' "$carrier_root/part-00.b64" \
            '997b2e1f1d112a30020a0a6402bf16ef9f4f6e706ac2d003745741a153cea561' "$carrier_root/part-01.b64" \
            '11503d99a678bfd3bc20b57cb4f85901697a1c3d885521ec3b8791158acf67f5' "$carrier_root/part-02.b64" \
            '1adefa3085b8d34d3f18982a77fdc070c48deb2651c6b137319d35bd820546de' "$carrier_root/part-03.b64" \
            '15b3584ac35e7b83b11c77fb785a636ec853d6716d82f014e17e6cc15e86e4cf' "$carrier_root/part-04.b64" \
            'ce0d7d7756c24d307fe0b2162d8f52f288a4beb5e538b311d1204bf863501df7' "$carrier_root/part-05.b64" \
            '3b3c0eded417325a81d2195654285a0c94140cc4fa1f737b524350dea308f517' "$carrier_root/part-06.b64" \
            | sha256sum --check --strict

          cat "$carrier_root"/part-0{0,1,2,3,4,5,6}.b64 \
            > "$RUNNER_TEMP/asoiaf-answer-transport-operations.b64"
          base64 --decode "$RUNNER_TEMP/asoiaf-answer-transport-operations.b64" \
            > "$RUNNER_TEMP/asoiaf-answer-transport-operations.tgz"
          printf '%s  %s\n' \
            '6d41ab77256f24bd51cf38f9192acb087853788448b9fd3640efd4ea8e4930c5' \
            "$RUNNER_TEMP/asoiaf-answer-transport-operations.tgz" \
            | sha256sum --check --strict

          tar -xzf "$RUNNER_TEMP/asoiaf-answer-transport-operations.tgz"
          rm -rf "$carrier_root"
          test ! -e '.github/workflows/asoiaf-answer-desk-transport-operations.yml'

          cat > "$RUNNER_TEMP/expected-paths" <<'EOF'
          .github/materialize/asoiaf-answer-desk-transport-operations/part-00.b64
          .github/materialize/asoiaf-answer-desk-transport-operations/part-01.b64
          .github/materialize/asoiaf-answer-desk-transport-operations/part-02.b64
          .github/materialize/asoiaf-answer-desk-transport-operations/part-03.b64
          .github/materialize/asoiaf-answer-desk-transport-operations/part-04.b64
          .github/materialize/asoiaf-answer-desk-transport-operations/part-05.b64
          .github/materialize/asoiaf-answer-desk-transport-operations/part-06.b64
          docs/ASOIAF_ANSWER_DESK_TRANSPORT_OPERATIONS.md
          package.json
          tests/fixtures/emit-asoiaf-answer-desk-transport-operations-input.ts
          tests/narrative/canon/asoiaf-answer-desk-transport-operations.test.ts
          tools/asoiaf-answer-desk-transport-operations.ts
          tools/lib/asoiaf-answer-desk-transport-operations.ts
          EOF

          git diff --check
          git add -A
          git diff --cached --name-only | sort > "$RUNNER_TEMP/actual-paths"
          sort "$RUNNER_TEMP/expected-paths" -o "$RUNNER_TEMP/expected-paths"
          diff -u "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/actual-paths"

      - name: Commit exact ordinary surfaces
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BigBirdReturns transport operations qualification'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Materialize ASOIAF transport operations surfaces'
          git push origin HEAD:feature/asoiaf-answer-desk-transport-operations-v1
