name: Inspect retained PR258 supervised delivery payload v10

on:
  push:
    branches:
      - feature/asoiaf-answer-desk-supervised-delivery-v1
    paths:
      - '.github/workflows/_diagnose-supervised-delivery-payload.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  inspect:
    if: github.repository == 'BigBirdReturns/axm-arc'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact retained payload head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Measure, decode, and classify retained payload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/pr258-retained-payload-v10"
          mkdir -p "$root"
          printf '%s\n' "$GITHUB_SHA" > "$root/candidate-sha.txt"

          ROOT="$root" python3 <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['ROOT'])
          source = Path('.github/materialize/asoiaf-answer-supervised-delivery')
          parts = []
          encoded_parts = []
          for index in range(5):
              path = source / f'part-{index:02d}.b64'
              if not path.is_file():
                  raise SystemExit(f'missing retained payload part: {path}')
              raw = path.read_text().replace('\r', '').replace('\n', '')
              parts.append({
                  'index': index,
                  'path': str(path),
                  'characters': len(raw),
                  'sha256': hashlib.sha256(raw.encode()).hexdigest(),
                  'gitBlobSha1': os.popen(f"git hash-object '{path}'").read().strip(),
              })
              encoded_parts.append(raw)

          encoded = ''.join(encoded_parts)
          decoded = base64.b64decode(encoded, validate=True)
          payload = root / 'payload.bin'
          payload.write_bytes(decoded)
          report = {
              'format': 'axm-pr258-retained-payload-inspection/1',
              'candidateSha': os.environ.get('GITHUB_SHA'),
              'parts': parts,
              'base64Characters': len(encoded),
              'base64Sha256': hashlib.sha256(encoded.encode()).hexdigest(),
              'decodedBytes': len(decoded),
              'decodedSha256': hashlib.sha256(decoded).hexdigest(),
              'decodedGitBlobSha1': os.popen(f"git hash-object '{payload}'").read().strip(),
              'prefixHex': decoded[:16].hex(),
          }
          (root / 'inspection.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY

          file "$root/payload.bin" | tee "$root/file.txt"
          if gzip -t "$root/payload.bin" 2>"$root/gzip-error.txt"; then
            printf '%s\n' true > "$root/gzip-valid.txt"
            tar -tzf "$root/payload.bin" > "$root/archive-paths.txt" 2>"$root/tar-error.txt" || true
          else
            printf '%s\n' false > "$root/gzip-valid.txt"
          fi
          if unzip -t "$root/payload.bin" > "$root/unzip.txt" 2>&1; then
            printf '%s\n' true > "$root/zip-valid.txt"
          else
            printf '%s\n' false > "$root/zip-valid.txt"
          fi

          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum \
            | sed "s#  $root/#  #" > "$root/SHA256SUMS"

      - name: Upload retained payload inspection
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr258-retained-payload-inspection-v10
          path: ${{ runner.temp }}/pr258-retained-payload-v10
          if-no-files-found: error
          retention-days: 3
          compression-level: 6

      - name: Publish exact retained payload report
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/pr258-retained-payload-v10"
          report="$(jq -c . "$root/inspection.json")"
          gzip_valid="$(cat "$root/gzip-valid.txt")"
          zip_valid="$(cat "$root/zip-valid.txt")"
          paths='none'
          if test -s "$root/archive-paths.txt"; then
            paths="$(paste -sd ',' "$root/archive-paths.txt")"
          fi
          gh pr comment 258 --repo "$GITHUB_REPOSITORY" --body \
            "PR258_RETAINED_PAYLOAD_INSPECTION_V10\n\nExact head: \`$GITHUB_SHA\`\n\nInspection: \`$report\`\n\nGzip valid: \`$gzip_valid\`\nZip valid: \`$zip_valid\`\nArchive paths: \`$paths\`\nArtifact: \`${ARTIFACT_ID:-not-issued}\`.\n\nThis inspection changes no implementation or qualification authority."
