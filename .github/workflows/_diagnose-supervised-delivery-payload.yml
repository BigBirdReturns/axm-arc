name: Diagnose ASOIAF supervised delivery payload

on:
  push:
    branches:
      - feature/asoiaf-answer-desk-supervised-delivery-v1
    paths:
      - '.github/workflows/_diagnose-supervised-delivery-payload.yml'
  pull_request:
    branches:
      - integration/asoiaf-answer-desk-supervised-transport-v1
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.github/workflows/_diagnose-supervised-delivery-payload.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          show-progress: false

      - name: Retain exact fragment bytes and geometry
        shell: bash
        run: |
          set -euo pipefail
          root='.github/materialize/asoiaf-answer-supervised-delivery'
          out="$RUNNER_TEMP/supervised-delivery-payload-diagnostic"
          mkdir -p "$out/fragments"
          cp "$root"/part-*.b64 "$out/fragments/"
          git rev-parse HEAD > "$out/candidate-sha.txt"

          ROOT="$root" OUT="$out" python3 <<'PY'
          import base64
          import hashlib
          import itertools
          import json
          import os
          import pathlib
          import re

          root = pathlib.Path(os.environ['ROOT'])
          out = pathlib.Path(os.environ['OUT'])
          entries = []
          fragments = []
          for path in sorted(root.glob('part-*.b64')):
              raw = path.read_bytes()
              compact = re.sub(rb'\s+', b'', raw)
              fragments.append((path.name, raw, compact))
              illegal = [
                  {'offset': index, 'byte': value}
                  for index, value in enumerate(compact)
                  if value not in b'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='
              ]
              entries.append({
                  'name': path.name,
                  'rawBytes': len(raw),
                  'compactBytes': len(compact),
                  'compactModulo4': len(compact) % 4,
                  'rawSha256': hashlib.sha256(raw).hexdigest(),
                  'compactSha256': hashlib.sha256(compact).hexdigest(),
                  'prefix': compact[:96].decode('ascii', errors='replace'),
                  'suffix': compact[-96:].decode('ascii', errors='replace'),
                  'paddingOffsets': [i for i, value in enumerate(compact) if value == ord('=')],
                  'illegal': illegal[:20],
              })

          concatenated = b''.join(fragment[2] for fragment in fragments)
          report = {
              'format': 'axm-supervised-delivery-payload-diagnostic/2',
              'candidateSha': (out / 'candidate-sha.txt').read_text().strip(),
              'fragments': entries,
              'orderedCompactBytes': len(concatenated),
              'orderedCompactModulo4': len(concatenated) % 4,
              'orderedCompactSha256': hashlib.sha256(concatenated).hexdigest(),
              'expectedCarrierSha256': '6fccc952899c22081590a8d96e3f9941a7b91c10d189eb0903c90d0cdbae56f0',
              'expectedArchiveSha256': '41e96026361b7e9acc73318fdc2290a61a5e20c02d3a7f1e78d49dac9de56a60',
          }

          candidates = []
          for label, payload in [
              ('ordered-compact', concatenated),
              ('ordered-compact-without-padding', concatenated.replace(b'=', b'')),
          ]:
              for padding in range(4):
                  candidate = payload + (b'=' * padding)
                  try:
                      decoded = base64.b64decode(candidate, validate=False)
                  except Exception as error:
                      candidates.append({'label': label, 'padding': padding, 'error': str(error)})
                      continue
                  candidates.append({
                      'label': label,
                      'padding': padding,
                      'decodedBytes': len(decoded),
                      'decodedSha256': hashlib.sha256(decoded).hexdigest(),
                      'gzipHeader': decoded[:3].hex(),
                  })
          report['decodeCandidates'] = candidates
          (out / 'report.json').write_text(json.dumps(report, indent=2) + '\n')
          (out / 'ordered-compact.b64').write_bytes(concatenated)
          PY

          cat "$out/report.json"

      - name: Upload payload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: supervised-delivery-payload-diagnostic-v2
          path: ${{ runner.temp }}/supervised-delivery-payload-diagnostic
          if-no-files-found: error
          retention-days: 2
