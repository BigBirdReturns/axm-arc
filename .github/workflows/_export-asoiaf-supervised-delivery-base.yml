name: Resolve ASOIAF supervised delivery tree identities

on:
  push:
    branches:
      - feature/asoiaf-answer-desk-supervised-delivery-v1
    paths:
      - '.github/workflows/_export-asoiaf-supervised-delivery-base.yml'
  pull_request:
    branches:
      - integration/asoiaf-answer-desk-supervised-transport-v1
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.github/workflows/_export-asoiaf-supervised-delivery-base.yml'

permissions:
  contents: read

jobs:
  resolve:
    if: github.repository == 'BigBirdReturns/axm-arc'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact construction head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Resolve exact commit and tree identities
        shell: bash
        run: |
          set -euo pipefail
          base_ref='origin/integration/asoiaf-answer-desk-supervised-transport-v1'
          candidate_sha="$(git rev-parse HEAD)"
          candidate_tree="$(git rev-parse 'HEAD^{tree}')"
          base_sha="$(git rev-parse "$base_ref^{commit}")"
          base_tree="$(git rev-parse "$base_ref^{tree}")"
          printf '%s\n' \
            "CANDIDATE_SHA=$candidate_sha" \
            "CANDIDATE_TREE=$candidate_tree" \
            "BASE_SHA=$base_sha" \
            "BASE_TREE=$base_tree" \
            | tee "$RUNNER_TEMP/supervised-delivery-tree-identities.txt"

      - name: Upload exact tree identities
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-supervised-delivery-tree-identities
          path: ${{ runner.temp }}/supervised-delivery-tree-identities.txt
          if-no-files-found: error
          retention-days: 2
