name: Export ASOIAF supervised delivery base

on:
  push:
    branches:
      - feature/asoiaf-answer-desk-supervised-delivery-v1
    paths:
      - '.github/workflows/_export-asoiaf-supervised-delivery-base.yml'
  pull_request:
    branches:
      - integration/asoiaf-answer-desk-supervised-transport-v1
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.github/workflows/_export-asoiaf-supervised-delivery-base.yml'

permissions:
  contents: read

jobs:
  export:
    if: github.repository == 'BigBirdReturns/axm-arc'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact construction head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Retain source floor, history, and dependency tree
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/asoiaf-supervised-delivery-base"
          mkdir -p "$root"
          git rev-parse HEAD > "$root/candidate-sha.txt"
          git rev-parse 'origin/integration/asoiaf-answer-desk-supervised-transport-v1^{commit}' \
            > "$root/base-sha.txt"
          git log --all --reverse --date=iso-strict \
            --format='%H%x09%P%x09%aI%x09%s' \
            > "$root/history.tsv"
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.github/materialize/asoiaf-answer-supervised-delivery \
            --exclude=.github/workflows/_bootstrap-supervised-delivery-source.yml \
            --exclude=.github/workflows/_diagnose-supervised-delivery-payload.yml \
            --exclude=.github/workflows/_materialize-asoiaf-answer-desk-supervised-delivery.yml \
            --exclude=.github/workflows/_export-asoiaf-supervised-delivery-base.yml \
            -czf "$root/source.tar.gz" .
          tar -czf "$root/node_modules.tar.gz" node_modules
          sha256sum "$root/source.tar.gz" "$root/node_modules.tar.gz" \
            > "$root/SHA256SUMS"

      - name: Upload exact source floor and dependency tree
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-supervised-delivery-development-floor
          path: ${{ runner.temp }}/asoiaf-supervised-delivery-base
          if-no-files-found: error
          retention-days: 2
          compression-level: 1
