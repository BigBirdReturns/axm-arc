name: Materialize ASOIAF remote supervisor surfaces

on:
  push:
    branches:
      - feature/asoiaf-answer-desk-remote-supervisor-v1
    paths:
      - '.github/workflows/_materialize-asoiaf-answer-desk-remote-supervisor.yml'

permissions:
  contents: write

concurrency:
  group: materialize-asoiaf-answer-desk-remote-supervisor
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'BigBirdReturns/axm-arc'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact materializer head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Reconstruct and verify exact ordinary surfaces
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const shas = [
            'db0827f26c2d82d6ac0814eae6b6e3188754b491',
            '962a6d95c228ba794266362b9a0fe765957a93e4',
            '86c0394065df6d11a995b771dc724ed3343598fd',
            '8a59007f7099a248f7fe147c6f8f2c3589219984',
            'a970bca7314db52fcb8c5d407e87e35b808ea511',
            '3cbdaae798eda61c86ad05ae88e147ffa397d6e6',
            '3f5062db2b212c5fd56c504735e323d67e30faa5',
            'c9d1a6e72944d78647073357137df429c0ebb5d5',
            'ddfdfc6b1cfe21a71f7bbfa18da095c2241dd74a',
            '89516589108f05dda17cc5458ab11496ac5e73eb',
            '6f514bb319ec4d6314423f1ec427e03b2b0fe8fb',
            '0903023e938419ad9b91903bba0f256d704f9898',
          ];
          const token = process.env.GH_TOKEN;
          const repository = process.env.REPOSITORY;
          const target = path.join(process.env.RUNNER_TEMP, 'remote-supervisor-surfaces.b64');
          if (!token || !repository) throw new Error('missing GitHub materialization environment');

          (async () => {
            const chunks = [];
            for (const sha of shas) {
              const response = await fetch(`https://api.github.com/repos/${repository}/git/blobs/${sha}`, {
                headers: {
                  Accept: 'application/vnd.github+json',
                  Authorization: `Bearer ${token}`,
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'axm-arc-remote-supervisor-materializer',
                },
              });
              const body = await response.json();
              if (!response.ok || body.sha !== sha || body.encoding !== 'base64') {
                throw new Error(`blob retrieval failed for ${sha}: ${response.status} ${JSON.stringify(body)}`);
              }
              chunks.push(Buffer.from(String(body.content).replace(/\n/g, ''), 'base64'));
            }
            fs.writeFileSync(target, Buffer.concat(chunks));
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

          printf '%s  %s\n' \
            '2f938a03ce9bc23c218cc51be053453ff3c378f09644e5086ce44729367ef714' \
            "$RUNNER_TEMP/remote-supervisor-surfaces.b64" \
            | sha256sum --check --strict
          base64 --decode "$RUNNER_TEMP/remote-supervisor-surfaces.b64" \
            > "$RUNNER_TEMP/remote-supervisor-surfaces.tgz"
          printf '%s  %s\n' \
            'ffba0ebcb155d1f2b39f730cfac520a147491948bffda1351fe33944c57ad490' \
            "$RUNNER_TEMP/remote-supervisor-surfaces.tgz" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/remote-supervisor-surfaces.tgz"
          git diff --check

          cat > "$RUNNER_TEMP/expected-paths" <<'EOF'
          docs/ASOIAF_ANSWER_DESK_REMOTE_SUPERVISOR.md
          package.json
          tests/fixtures/emit-asoiaf-answer-desk-remote-supervisor-input.ts
          tests/narrative/canon/asoiaf-answer-desk-remote-supervisor.test.ts
          tools/asoiaf-answer-desk-remote-supervisor.ts
          tools/lib/asoiaf-answer-desk-remote-supervisor.ts
          EOF
          git add \
            docs/ASOIAF_ANSWER_DESK_REMOTE_SUPERVISOR.md \
            package.json \
            tests/fixtures/emit-asoiaf-answer-desk-remote-supervisor-input.ts \
            tests/narrative/canon/asoiaf-answer-desk-remote-supervisor.test.ts \
            tools/asoiaf-answer-desk-remote-supervisor.ts \
            tools/lib/asoiaf-answer-desk-remote-supervisor.ts
          git diff --cached --name-only | sort > "$RUNNER_TEMP/actual-paths"
          sort "$RUNNER_TEMP/expected-paths" -o "$RUNNER_TEMP/expected-paths"
          diff -u "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/actual-paths"

      - name: Commit exact ordinary surfaces
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BigBirdReturns remote supervisor qualification'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Add ASOIAF remote supervisor implementation'
          git push origin HEAD:feature/asoiaf-answer-desk-remote-supervisor-v1
