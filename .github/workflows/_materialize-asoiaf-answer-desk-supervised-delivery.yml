name: Materialize ASOIAF supervised delivery surfaces
# Retriggered after diagnostic stabilization; branch writes remain frozen until completion.

on:
  push:
    branches:
      - feature/asoiaf-answer-desk-supervised-delivery-v1
    paths:
      - '.github/workflows/_materialize-asoiaf-answer-desk-supervised-delivery.yml'
  pull_request:
    branches:
      - integration/asoiaf-answer-desk-supervised-transport-v1
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.github/workflows/_materialize-asoiaf-answer-desk-supervised-delivery.yml'

permissions:
  contents: write

concurrency:
  group: materialize-asoiaf-answer-desk-supervised-delivery
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'BigBirdReturns/axm-arc'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact carrier head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Reconstruct and verify exact ordinary surfaces
        shell: bash
        run: |
          set -euo pipefail
          payload_root='.github/materialize/asoiaf-answer-supervised-delivery'
          printf '%s  %s\n' \
            '64d285c030afa4621024c6cd428e8a262ca9bdd9cc6a4f9e2cde1544886d27e9' "$payload_root/part-00.b64" \
            'c17d5f08a7e98d4e3baefe6c7fa011dad6e059776677c25dfd7bf83c6313887b' "$payload_root/part-01.b64" \
            '5cc0a7a31447a3d02676ed2b3be3929fb77a606d5235f066bf42e5816808c78b' "$payload_root/part-02.b64" \
            'f31f133748c7dd663990d2b3856d085dfb98ec2dcdc83ab483031ebdacbf703b' "$payload_root/part-03.b64" \
            'b5300b6b1e12e8e7e7249dfc5b1cb003554e53cc10ff08299bd5e4aae2a922f9' "$payload_root/part-04.b64" \
            | sha256sum --check --strict
          for part in 00 01 02 03 04; do
            base64 --decode "$payload_root/part-$part.b64" \
              > "$RUNNER_TEMP/part-$part.bin"
          done
          cat "$RUNNER_TEMP"/part-{00,01,02,03,04}.bin \
            > "$RUNNER_TEMP/supervised-delivery-surfaces.tgz"
          printf '%s  %s\n' \
            '41e96026361b7e9acc73318fdc2290a61a5e20c02d3a7f1e78d49dac9de56a60' \
            "$RUNNER_TEMP/supervised-delivery-surfaces.tgz" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/supervised-delivery-surfaces.tgz"
          for target in \
            docs/ASOIAF_ANSWER_DESK_SUPERVISED_DELIVERY.md \
            package.json \
            tests/fixtures/emit-asoiaf-answer-desk-supervised-delivery-input.ts \
            tests/narrative/canon/asoiaf-answer-desk-supervised-delivery.test.ts \
            tools/asoiaf-answer-desk-supervised-delivery.ts \
            tools/lib/asoiaf-answer-desk-supervised-delivery.ts; do
            test -f "$target"
          done
          grep -q 'asoiaf:answer-supervised-delivery' package.json
          git diff --check

          rm -rf "$payload_root"
          cat > "$RUNNER_TEMP/expected-paths" <<'EOF'
          .github/materialize/asoiaf-answer-supervised-delivery/part-00.b64
          .github/materialize/asoiaf-answer-supervised-delivery/part-01.b64
          .github/materialize/asoiaf-answer-supervised-delivery/part-02.b64
          .github/materialize/asoiaf-answer-supervised-delivery/part-03.b64
          .github/materialize/asoiaf-answer-supervised-delivery/part-04.b64
          docs/ASOIAF_ANSWER_DESK_SUPERVISED_DELIVERY.md
          package.json
          tests/fixtures/emit-asoiaf-answer-desk-supervised-delivery-input.ts
          tests/narrative/canon/asoiaf-answer-desk-supervised-delivery.test.ts
          tools/asoiaf-answer-desk-supervised-delivery.ts
          tools/lib/asoiaf-answer-desk-supervised-delivery.ts
          EOF
          git add -A \
            "$payload_root" \
            docs/ASOIAF_ANSWER_DESK_SUPERVISED_DELIVERY.md \
            package.json \
            tests/fixtures/emit-asoiaf-answer-desk-supervised-delivery-input.ts \
            tests/narrative/canon/asoiaf-answer-desk-supervised-delivery.test.ts \
            tools/asoiaf-answer-desk-supervised-delivery.ts \
            tools/lib/asoiaf-answer-desk-supervised-delivery.ts
          git diff --cached --name-only | sort > "$RUNNER_TEMP/actual-paths"
          sort "$RUNNER_TEMP/expected-paths" -o "$RUNNER_TEMP/expected-paths"
          diff -u "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/actual-paths"

      - name: Commit exact ordinary surfaces
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BigBirdReturns supervised delivery qualification'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Add ASOIAF supervised delivery implementation'
          git push origin HEAD:feature/asoiaf-answer-desk-supervised-delivery-v1
