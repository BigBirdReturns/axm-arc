name: Publish carrier-free ASOIAF supervised delivery

on:
  push:
    branches:
      - feature/asoiaf-answer-desk-supervised-delivery-v1
    paths:
      - '.github/workflows/_materialize-asoiaf-answer-desk-supervised-delivery.yml'
  pull_request:
    branches:
      - integration/asoiaf-answer-desk-supervised-transport-v1
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.github/workflows/_materialize-asoiaf-answer-desk-supervised-delivery.yml'

permissions:
  contents: write

concurrency:
  group: publish-carrier-free-asoiaf-supervised-delivery
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'BigBirdReturns/axm-arc'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact construction head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Reconstruct and verify exact publication archive
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"

          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');

          const chunks = [
            {
              sha: 'f0e9c1a6afe75498512c31e50b5dc539c8f7a2c7',
              bytes: 24000,
              digest: '6e90519ca5aac9e44858997b132a5954ada6214cdff374071832eda8430241e9',
            },
            {
              sha: '903c7498030db950e4b4737ae67db9ddf4a18d2d',
              bytes: 6760,
              digest: '54ba211b3eb08cdce2fe88dae0be63ace82d4f952eed5a8281ca2295983a657c',
            },
          ];
          const expectedBytes = 30760;
          const expectedDigest = '7cd7797a664dd546a9ee83772ae7c012b550ef87ae44b8dfb5eff3c774a2c243';
          const token = process.env.GH_TOKEN;
          const repository = process.env.REPOSITORY;
          const target = path.join(process.env.RUNNER_TEMP, 'asoiaf-supervised-delivery-surfaces.tar.gz');
          if (!token || !repository) throw new Error('missing GitHub publication environment');

          (async () => {
            const buffers = [];
            for (const chunk of chunks) {
              const response = await fetch(`https://api.github.com/repos/${repository}/git/blobs/${chunk.sha}`, {
                headers: {
                  Accept: 'application/vnd.github+json',
                  Authorization: `Bearer ${token}`,
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'axm-arc-supervised-delivery-publisher',
                },
              });
              const body = await response.json();
              if (!response.ok || body.sha !== chunk.sha || body.encoding !== 'base64') {
                throw new Error(`publication chunk retrieval failed for ${chunk.sha}: ${response.status} ${JSON.stringify(body)}`);
              }
              const buffer = Buffer.from(String(body.content).replace(/\n/g, ''), 'base64');
              const digest = crypto.createHash('sha256').update(buffer).digest('hex');
              if (buffer.length !== chunk.bytes || digest !== chunk.digest) {
                throw new Error(`publication chunk verification failed for ${chunk.sha}: ${buffer.length} ${digest}`);
              }
              buffers.push(buffer);
            }
            const archive = Buffer.concat(buffers);
            const digest = crypto.createHash('sha256').update(archive).digest('hex');
            if (archive.length !== expectedBytes || digest !== expectedDigest) {
              throw new Error(`publication archive verification failed: ${archive.length} ${digest}`);
            }
            fs.writeFileSync(target, archive);
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

          printf '%s  %s\n' \
            '7cd7797a664dd546a9ee83772ae7c012b550ef87ae44b8dfb5eff3c774a2c243' \
            "$RUNNER_TEMP/asoiaf-supervised-delivery-surfaces.tar.gz" \
            | sha256sum --check --strict
          tar -tzf "$RUNNER_TEMP/asoiaf-supervised-delivery-surfaces.tar.gz" \
            | sort > "$RUNNER_TEMP/archive-paths.txt"
          cat > "$RUNNER_TEMP/expected-archive-paths.txt" <<'EOF'
          .github/workflows/asoiaf-answer-desk-supervised-delivery.yml
          docs/ASOIAF_ANSWER_DESK_SUPERVISED_DELIVERY.md
          package.json
          tests/fixtures/emit-asoiaf-answer-desk-supervised-delivery-input.ts
          tests/narrative/canon/asoiaf-answer-desk-supervised-delivery.test.ts
          tools/asoiaf-answer-desk-supervised-delivery.ts
          tools/lib/asoiaf-answer-desk-supervised-delivery.ts
          EOF
          sort "$RUNNER_TEMP/expected-archive-paths.txt" -o "$RUNNER_TEMP/expected-archive-paths.txt"
          diff -u "$RUNNER_TEMP/expected-archive-paths.txt" "$RUNNER_TEMP/archive-paths.txt"
          tar -xzf "$RUNNER_TEMP/asoiaf-supervised-delivery-surfaces.tar.gz"

          printf '%s  %s\n' \
            'f3a0006ac78ee22f2eaacff0015c771c896e30439ee8afb639e3b0b81ccc2c47' '.github/workflows/asoiaf-answer-desk-supervised-delivery.yml' \
            'bfed202e169ad657b79d355b9b041ab87f36c4bda9ac679321ffe6ff40d6edbf' 'docs/ASOIAF_ANSWER_DESK_SUPERVISED_DELIVERY.md' \
            '47d35b8410b0b5f96db9df88fcdb1e5d8168cbbbe3ccdf8720fbcba847ee6c85' 'package.json' \
            '194a19cc7afa35621e9f55c64d418693d1170cf4d3c752934b5f30c970d44ac9' 'tests/fixtures/emit-asoiaf-answer-desk-supervised-delivery-input.ts' \
            '68e0836d636c969e5e4ff690d0d65d066fcec7d8722d73af22698cd42610c626' 'tests/narrative/canon/asoiaf-answer-desk-supervised-delivery.test.ts' \
            '4175416ade8c20eddce586864aa3073f7e906cb1d454a29f381bf520aa763a36' 'tools/asoiaf-answer-desk-supervised-delivery.ts' \
            '4996a9cd978825ef03570ae5161e552321ecc5727cc2dbe290b5243cdd88ee11' 'tools/lib/asoiaf-answer-desk-supervised-delivery.ts' \
            | sha256sum --check --strict

      - name: Remove every construction carrier and verify the final diff
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/materialize/asoiaf-answer-supervised-delivery
          rm -f \
            .github/workflows/_bootstrap-supervised-delivery-source.yml \
            .github/workflows/_diagnose-supervised-delivery-payload.yml \
            .github/workflows/_export-asoiaf-supervised-delivery-base.yml \
            .github/workflows/_materialize-asoiaf-answer-desk-supervised-delivery.yml

          cat > "$RUNNER_TEMP/expected-commit-paths.txt" <<'EOF'
          .github/materialize/asoiaf-answer-supervised-delivery/part-00.b64
          .github/materialize/asoiaf-answer-supervised-delivery/part-01.b64
          .github/materialize/asoiaf-answer-supervised-delivery/part-02.b64
          .github/materialize/asoiaf-answer-supervised-delivery/part-03.b64
          .github/materialize/asoiaf-answer-supervised-delivery/part-04.b64
          .github/workflows/_bootstrap-supervised-delivery-source.yml
          .github/workflows/_diagnose-supervised-delivery-payload.yml
          .github/workflows/_export-asoiaf-supervised-delivery-base.yml
          .github/workflows/_materialize-asoiaf-answer-desk-supervised-delivery.yml
          .github/workflows/asoiaf-answer-desk-supervised-delivery.yml
          docs/ASOIAF_ANSWER_DESK_SUPERVISED_DELIVERY.md
          package.json
          tests/fixtures/emit-asoiaf-answer-desk-supervised-delivery-input.ts
          tests/narrative/canon/asoiaf-answer-desk-supervised-delivery.test.ts
          tools/asoiaf-answer-desk-supervised-delivery.ts
          tools/lib/asoiaf-answer-desk-supervised-delivery.ts
          EOF

          git add -A
          git diff --cached --name-only | sort > "$RUNNER_TEMP/actual-commit-paths.txt"
          sort "$RUNNER_TEMP/expected-commit-paths.txt" -o "$RUNNER_TEMP/expected-commit-paths.txt"
          diff -u "$RUNNER_TEMP/expected-commit-paths.txt" "$RUNNER_TEMP/actual-commit-paths.txt"

          base_sha='52287c5406594ad6e1d1add7d0aef36274179a3e'
          cat > "$RUNNER_TEMP/expected-final-paths.txt" <<'EOF'
          .github/workflows/asoiaf-answer-desk-supervised-delivery.yml
          docs/ASOIAF_ANSWER_DESK_SUPERVISED_DELIVERY.md
          package.json
          tests/fixtures/emit-asoiaf-answer-desk-supervised-delivery-input.ts
          tests/narrative/canon/asoiaf-answer-desk-supervised-delivery.test.ts
          tools/asoiaf-answer-desk-supervised-delivery.ts
          tools/lib/asoiaf-answer-desk-supervised-delivery.ts
          EOF
          git diff --name-only "$base_sha" -- | sort > "$RUNNER_TEMP/actual-final-paths.txt"
          sort "$RUNNER_TEMP/expected-final-paths.txt" -o "$RUNNER_TEMP/expected-final-paths.txt"
          diff -u "$RUNNER_TEMP/expected-final-paths.txt" "$RUNNER_TEMP/actual-final-paths.txt"
          git diff --check "$base_sha" --

      - name: Commit and publish exact carrier-free surfaces
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BigBirdReturns supervised delivery qualification'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Add certificate-authenticated ASOIAF supervised delivery'
          git push origin HEAD:feature/asoiaf-answer-desk-supervised-delivery-v1
