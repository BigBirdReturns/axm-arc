name: TEMP assemble authenticated broker service core

on:
  push:
    branches:
      - feature/asoiaf-answer-credential-broker-service-v1
    paths:
      - '.construction/asoiaf-answer-credential-broker-service/READY'

permissions:
  contents: write

jobs:
  assemble:
    if: github.repository == 'BigBirdReturns/axm-arc'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out construction branch
        uses: actions/checkout@v4
        with:
          ref: feature/asoiaf-answer-credential-broker-service-v1
          fetch-depth: 1

      - name: Assemble exact core and remove construction carrier
        shell: bash
        run: |
          set -euo pipefail
          construction='.construction/asoiaf-answer-credential-broker-service'
          target='tools/lib/asoiaf-answer-credential-broker-service.ts'
          expected="$(tr -d '\r\n' < "$construction/READY")"
          mkdir -p "$(dirname "$target")"
          cat "$construction"/core-*.part > "$target"
          actual="$(sha256sum "$target" | awk '{print $1}')"
          test "$actual" = "$expected"
          rm -rf "$construction"
          rm -f '.github/workflows/_temp-assemble-broker-service-core.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Assemble authenticated local credential broker service core'
          git push origin HEAD:feature/asoiaf-answer-credential-broker-service-v1
