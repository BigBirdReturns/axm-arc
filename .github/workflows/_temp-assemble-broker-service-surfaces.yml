name: TEMP assemble authenticated broker service surfaces

on:
  push:
    branches:
      - feature/asoiaf-answer-credential-broker-service-v1
    paths:
      - '.construction/asoiaf-answer-credential-broker-service-surfaces/SURFACES.json'
      - '.github/workflows/_temp-assemble-broker-service-surfaces.yml'
  pull_request:
    branches:
      - feature/asoiaf-answer-credential-provider-host-v1
    paths:
      - '.construction/asoiaf-answer-credential-broker-service-surfaces/**'
      - '.github/workflows/_temp-assemble-broker-service-surfaces.yml'

permissions:
  contents: write

jobs:
  assemble:
    if: github.repository == 'BigBirdReturns/axm-arc'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out construction branch
        uses: actions/checkout@v4
        with:
          ref: feature/asoiaf-answer-credential-broker-service-v1
          fetch-depth: 1

      - name: Assemble non-workflow surfaces and verify permanent workflow bytes
        shell: bash
        run: |
          set -euo pipefail
          construction='.construction/asoiaf-answer-credential-broker-service-surfaces'
          manifest="$construction/SURFACES.json"
          test "$(jq -r .format "$manifest")" = 'axm-bounded-surface-assembly/1'
          assemble() {
            local key="$1"
            local prefix="$2"
            local target expected chunks actual
            target="$(jq -r --arg key "$key" '.surfaces[$key].target' "$manifest")"
            expected="$(jq -r --arg key "$key" '.surfaces[$key].sha256' "$manifest")"
            chunks="$(jq -r --arg key "$key" '.surfaces[$key].chunks' "$manifest")"
            test "$(find "$construction" -maxdepth 1 -type f -name "$prefix-*.part" | wc -l | tr -d ' ')" = "$chunks"
            mkdir -p "$(dirname "$target")"
            cat "$construction"/"$prefix"-*.part > "$target"
            actual="$(sha256sum "$target" | awk '{print $1}')"
            test "$actual" = "$expected"
          }
          assemble docs docs
          assemble fixture fixture
          assemble test test

          workflow_candidate="$RUNNER_TEMP/asoiaf-answer-credential-broker-service.yml"
          cat "$construction"/workflow-*.part > "$workflow_candidate"
          test "$(sha256sum "$workflow_candidate" | awk '{print $1}')" = "$(jq -r '.surfaces.workflow.sha256' "$manifest")"

          rm -rf "$construction"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Assemble authenticated broker service non-workflow surfaces'
          git push origin HEAD:feature/asoiaf-answer-credential-broker-service-v1
