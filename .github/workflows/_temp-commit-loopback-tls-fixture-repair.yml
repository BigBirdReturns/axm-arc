name: TEMP commit loopback TLS fixture repair

on:
  push:
    branches:
      - feature/asoiaf-answer-credential-broker-loopback-tls-v1
    paths:
      - '.github/workflows/_temp-commit-loopback-tls-fixture-repair.yml'

permissions:
  contents: write

concurrency:
  group: temp-commit-loopback-tls-fixture-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'BigBirdReturns/axm-arc'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out latest feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/asoiaf-answer-credential-broker-loopback-tls-v1
          fetch-depth: 0

      - name: Commit bounded service-request schedules and remove carriers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          target = Path('tests/fixtures/emit-asoiaf-answer-credential-broker-loopback-tls-input.ts')
          text = target.read_text(encoding='utf-8')
          replacements = {
              'maxRequestLifetimeMilliseconds: 1_200_000,':
                  'maxRequestLifetimeMilliseconds: 900_000,',
              'issuedAt: base + 380_000,\n  expiresAt: base + 1_500_000,':
                  'issuedAt: base + 380_000,\n  expiresAt: base + 1_200_000,',
              'issuedAt: base + 400_000,\n  expiresAt: base + 1_500_000,':
                  'issuedAt: base + 400_000,\n  expiresAt: base + 1_250_000,',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count == 1:
                  text = text.replace(old, new, 1)
              elif count == 0 and new in text:
                  pass
              else:
                  raise SystemExit(f'unexpected fixture schedule state for {old!r}: {count}')
          target.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/fixtures/emit-asoiaf-answer-credential-broker-loopback-tls-input.ts
          for carrier in \
            .github/workflows/_temp-repair-loopback-tls-fixture.yml \
            .github/workflows/_temp-commit-loopback-tls-fixture-repair.yml; do
            if git ls-files --error-unmatch "$carrier" >/dev/null 2>&1; then
              git rm "$carrier"
            fi
          done
          git diff --cached --check
          git commit -m 'Bound loopback TLS fixture request lifetimes'
          git push origin HEAD:feature/asoiaf-answer-credential-broker-loopback-tls-v1
