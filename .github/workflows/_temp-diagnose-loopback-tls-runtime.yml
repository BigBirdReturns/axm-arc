name: TEMP diagnose loopback TLS runtime

on:
  push:
    branches:
      - feature/asoiaf-answer-credential-broker-loopback-tls-v1
    paths:
      - '.github/workflows/_temp-diagnose-loopback-tls-runtime.yml'

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: temp-diagnose-loopback-tls-runtime
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.repository == 'BigBirdReturns/axm-arc'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/asoiaf-answer-credential-broker-loopback-tls-v1
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run standalone fixture and publish diagnostic ledger
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          fixture="$RUNNER_TEMP/fixture"
          estate="$RUNNER_TEMP/estate"
          material="$RUNNER_TEMP/material"
          mkdir -p "$fixture" "$material"
          started="$(date +%s)"
          timeout 150s npx vite-node \
            tests/fixtures/emit-asoiaf-answer-credential-broker-loopback-tls-input.ts \
            "$fixture" "$estate" "$material" \
            > "$RUNNER_TEMP/fixture.stdout" \
            2> "$RUNNER_TEMP/fixture.stderr"
          status=$?
          completed="$(date +%s)"
          {
            echo 'TEMP_LOOPBACK_TLS_RUNTIME_DIAGNOSTIC_V1'
            echo
            echo "Exact head: \`$(git rev-parse HEAD)\`"
            echo "Fixture exit: \`$status\`; elapsed seconds: \`$((completed-started))\`."
            echo
            echo 'Last fixture stderr:'
            echo '```text'
            tail -n 120 "$RUNNER_TEMP/fixture.stderr" || true
            echo '```'
            echo
            echo 'Retained public output files:'
            echo '```text'
            find "$fixture" -maxdepth 2 -type f -printf '%P\n' | sort | tail -n 160 || true
            echo '```'
            echo
            echo 'Listener runtime files:'
            echo '```text'
            if [ -d "$estate/answer-credential-broker-loopback-tls" ]; then
              find "$estate/answer-credential-broker-loopback-tls" \
                -maxdepth 3 -type f -printf '%P\n' | sort
            fi
            echo '```'
            if [ -f "$estate/answer-credential-broker-loopback-tls/.listener-lock" ]; then
              echo
              echo 'Retained listener lock:'
              echo '```json'
              cat "$estate/answer-credential-broker-loopback-tls/.listener-lock"
              echo '```'
            fi
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment 282 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          exit 0
