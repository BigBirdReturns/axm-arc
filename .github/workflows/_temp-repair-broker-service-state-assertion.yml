name: TEMP repair broker service state assertion

on:
  push:
    branches:
      - feature/asoiaf-answer-credential-broker-service-v1
    paths:
      - '.github/workflows/_temp-repair-broker-service-state-assertion.yml'
  pull_request:
    branches:
      - feature/asoiaf-answer-credential-provider-host-v1
    paths:
      - '.github/workflows/_temp-repair-broker-service-state-assertion.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'BigBirdReturns/axm-arc'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/asoiaf-answer-credential-broker-service-v1
          fetch-depth: 1

      - name: Remove non-causal state-drift assertion
        shell: bash
        run: |
          set -euo pipefail
          target='tests/narrative/canon/asoiaf-answer-credential-broker-service.test.ts'
          test "$(grep -c '      \"service-state-invalid\",' "$target")" = '1'
          sed -i '/      "service-state-invalid",/d' "$target"
          test "$(grep -c '      \"service-state-invalid\",' "$target" || true)" = '0'
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git commit -m 'Repair broker service tamper assertion causality'
          git push origin HEAD:feature/asoiaf-answer-credential-broker-service-v1
