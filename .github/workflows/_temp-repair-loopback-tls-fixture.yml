name: TEMP repair loopback TLS fixture lifetimes

on:
  push:
    branches:
      - feature/asoiaf-answer-credential-broker-loopback-tls-v1
    paths:
      - '.github/workflows/_temp-repair-loopback-tls-fixture.yml'

permissions:
  contents: write

concurrency:
  group: temp-repair-loopback-tls-fixture
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'BigBirdReturns/axm-arc'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/asoiaf-answer-credential-broker-loopback-tls-v1
          fetch-depth: 0

      - name: Repair bounded service-request lifetimes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          target = Path('tests/fixtures/emit-asoiaf-answer-credential-broker-loopback-tls-input.ts')
          text = target.read_text(encoding='utf-8')
          replacements = {
              'maxRequestLifetimeMilliseconds: 1_200_000,':
                  'maxRequestLifetimeMilliseconds: 900_000,',
              'issuedAt: base + 380_000,\n  expiresAt: base + 1_500_000,':
                  'issuedAt: base + 380_000,\n  expiresAt: base + 1_200_000,',
              'issuedAt: base + 400_000,\n  expiresAt: base + 1_500_000,':
                  'issuedAt: base + 400_000,\n  expiresAt: base + 1_250_000,',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one fixture lifetime target: {old!r}')
              text = text.replace(old, new, 1)
          target.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Qualify repaired fixture
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm test -- tests/narrative/canon/asoiaf-answer-credential-broker-loopback-tls.test.ts

      - name: Commit carrier-free repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/fixtures/emit-asoiaf-answer-credential-broker-loopback-tls-input.ts
          git rm .github/workflows/_temp-repair-loopback-tls-fixture.yml
          git diff --cached --check
          git commit -m 'Bound loopback TLS fixture request lifetimes'
          git push origin HEAD:feature/asoiaf-answer-credential-broker-loopback-tls-v1
