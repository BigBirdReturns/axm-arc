name: TEMP repair loopback TLS shutdown custody

on:
  push:
    branches:
      - feature/asoiaf-answer-credential-broker-loopback-tls-v1
    paths:
      - '.github/workflows/_temp-repair-loopback-tls-shutdown.yml'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: temp-repair-loopback-tls-shutdown
  cancel-in-progress: true

jobs:
  repair:
    if: github.repository == 'BigBirdReturns/axm-arc'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out latest feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/asoiaf-answer-credential-broker-loopback-tls-v1
          fetch-depth: 0

      - name: Repair deterministic TLS socket ownership and exact assertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          core_path = Path('tools/lib/asoiaf-answer-credential-broker-loopback-tls.ts')
          text = core_path.read_text(encoding='utf-8')
          replacements = [
            (
              '  let rejectedConnections = 0;\n  let stopReason =',
              '  let rejectedConnections = 0;\n  const sockets = new Set<tls.TLSSocket>();\n  let stopReason =',
            ),
            (
              '  }, (socket) => {\n    servedConnections += 1;\n    if (!accepting || !socket.authorized) {',
              '  }, (socket) => {\n    servedConnections += 1;\n    sockets.add(socket);\n    socket.once("close", () => sockets.delete(socket));\n    if (!accepting || !socket.authorized) {',
            ),
            (
              '      socket.end(rejectionResponse(\n        accepting\n          ? "loopback TLS peer is not authorized"\n          : "loopback TLS listener is not ready",\n      ));',
              '      socket.end(rejectionResponse(\n        accepting\n          ? "loopback TLS peer is not authorized"\n          : "loopback TLS listener is not ready",\n      ), () => socket.destroy());',
            ),
            (
              '      socket.end(rejectionResponse(\n        "loopback TLS peer certificate differs from retained client custody",\n      ));',
              '      socket.end(rejectionResponse(\n        "loopback TLS peer certificate differs from retained client custody",\n      ), () => socket.destroy());',
            ),
            (
              '      socket.end(response, () => {\n        if (servedRequests >= maxRequests && server.listening) {',
              '      socket.end(response, () => {\n        socket.destroy();\n        if (servedRequests >= maxRequests && server.listening) {',
            ),
            (
              '      else if (!handled && buffer.length === 0) {\n        rejectedConnections += 1;\n      }',
              '      else if (!handled && buffer.length === 0) {\n        rejectedConnections += 1;\n        socket.destroy();\n      }',
            ),
            (
              '  } catch (error) {\n    await new Promise<void>((resolve) => server.close(() => resolve()));\n    throw error;\n  }',
              '  } catch (error) {\n    if (fs.existsSync(paths.lock)) {\n      try {\n        removeOwnLock(paths, session.sessionId);\n      } catch {\n        fs.rmSync(paths.lock, { force: true });\n      }\n    }\n    await new Promise<void>((resolve) => {\n      server.once("close", resolve);\n      server.close();\n      for (const socket of sockets) socket.destroy();\n    });\n    throw error;\n  }',
            ),
            (
              '  server.on("close", () => {\n    try {\n      accepting = false;',
              '  server.on("close", () => {\n    try {\n      accepting = false;\n      for (const socket of sockets) socket.destroy();',
            ),
            (
              '      await new Promise<void>((resolve, reject) => {\n        server.close((error) => error ? reject(error) : resolve());\n      });\n      await closed;',
              '      server.close();\n      for (const socket of sockets) socket.destroy();\n      await closed;',
            ),
          ]
          for old, new in replacements:
              if new in text:
                  continue
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one repair target, found {count}: {old[:90]!r}')
              text = text.replace(old, new, 1)
          core_path.write_text(text, encoding='utf-8')

          test_path = Path('tests/narrative/canon/asoiaf-answer-credential-broker-loopback-tls.test.ts')
          test = test_path.read_text(encoding='utf-8')
          old = 'availability.observation.serverCertificateFingerprint'
          new = 'availability.observation.expectedServerCertificateFingerprint'
          if old in test:
              if test.count(old) != 1:
                  raise SystemExit('unexpected server certificate assertion multiplicity')
              test = test.replace(old, new, 1)
          elif new not in test:
              raise SystemExit('server certificate availability assertion is absent')
          test_path.write_text(test, encoding='utf-8')
          PY
          git diff --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Qualify and publish repair result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          npm run typecheck > "$RUNNER_TEMP/typecheck.log" 2>&1
          typecheck_status=$?
          npm test -- tests/narrative/canon/asoiaf-answer-credential-broker-loopback-tls.test.ts \
            > "$RUNNER_TEMP/focused.log" 2>&1
          focused_status=$?
          set -e
          {
            echo 'TEMP_LOOPBACK_TLS_SHUTDOWN_REPAIR_V2'
            echo
            echo "Exact checkout: \`$(git rev-parse HEAD)\`."
            echo "TypeScript status: \`$typecheck_status\`; focused status: \`$focused_status\`."
            echo
            echo 'Focused tail:'
            echo '```text'
            tail -n 100 "$RUNNER_TEMP/focused.log"
            echo '```'
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment 282 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          test "$typecheck_status" = 0
          test "$focused_status" = 0

      - name: Commit carrier-free shutdown repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/lib/asoiaf-answer-credential-broker-loopback-tls.ts \
            tests/narrative/canon/asoiaf-answer-credential-broker-loopback-tls.test.ts
          for carrier in \
            .github/workflows/_temp-diagnose-loopback-tls-runtime.yml \
            .github/workflows/_temp-repair-loopback-tls-shutdown.yml; do
            if git ls-files --error-unmatch "$carrier" >/dev/null 2>&1; then
              git rm "$carrier"
            fi
          done
          git diff --cached --check
          git commit -m 'Close loopback TLS sockets before listener settlement'
          git push origin HEAD:feature/asoiaf-answer-credential-broker-loopback-tls-v1
