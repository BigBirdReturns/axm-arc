name: TEMP repair loopback TLS Windows fixture runners

on:
  push:
    branches:
      - feature/asoiaf-answer-credential-broker-loopback-tls-v1
    paths:
      - '.github/workflows/_temp-repair-loopback-tls-windows-npx.yml'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: temp-repair-loopback-tls-windows-npx
  cancel-in-progress: true

jobs:
  repair:
    if: github.repository == 'BigBirdReturns/axm-arc'
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Check out latest feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/asoiaf-answer-credential-broker-loopback-tls-v1
          fetch-depth: 0

      - name: Invoke every fixture and registered operator through Node
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          test_path = Path('tests/narrative/canon/asoiaf-answer-credential-broker-loopback-tls.test.ts')
          test = test_path.read_text(encoding='utf-8')
          test = test.replace(
              'const npx = process.platform === "win32" ? "npx.cmd" : "npx";\n',
              '',
          )
          declaration = (
              'const viteNode = path.join(\n'
              '  process.cwd(),\n'
              '  "node_modules",\n'
              '  "vite-node",\n'
              '  "vite-node.mjs",\n'
              ');\n'
          )
          anchor = 'const roots: string[] = [];\n'
          if declaration not in test:
              if test.count(anchor) != 1:
                  raise SystemExit('cannot locate outer Vite Node declaration anchor')
              test = test.replace(anchor, anchor + declaration, 1)
          outer_replacement = '  execFileSync(process.execPath, [\n    viteNode,'
          if outer_replacement not in test:
              candidates = [
                  '  execFileSync("npx", [\n    "vite-node",',
                  '  execFileSync(npx, [\n    "vite-node",',
              ]
              matched = [entry for entry in candidates if entry in test]
              if len(matched) != 1:
                  raise SystemExit('cannot locate exactly one outer fixture runner')
              test = test.replace(matched[0], outer_replacement, 1)
          if 'execFileSync("npx"' in test or 'execFileSync(npx' in test or 'npx.cmd' in test:
              raise SystemExit('outer test retains a shell shim')
          test_path.write_text(test, encoding='utf-8')

          fixture_path = Path('tests/fixtures/emit-asoiaf-answer-credential-broker-loopback-tls-input.ts')
          fixture = fixture_path.read_text(encoding='utf-8')
          npm_declaration = 'const npm = process.platform === "win32" ? "npm.cmd" : "npm";\n'
          fixture_declaration = (
              'const viteNode = path.join(\n'
              '  process.cwd(),\n'
              '  "node_modules",\n'
              '  "vite-node",\n'
              '  "vite-node.mjs",\n'
              ');\n'
          )
          if fixture_declaration not in fixture:
              if fixture.count(npm_declaration) != 1:
                  raise SystemExit('cannot locate fixture runner declaration anchor')
              fixture = fixture.replace(npm_declaration, fixture_declaration, 1)
          else:
              fixture = fixture.replace(npm_declaration, '', 1)

          nested_old = 'run("npx", [\n  "vite-node",\n  "tests/fixtures/'
          nested_new = 'run(process.execPath, [\n  viteNode,\n  "tests/fixtures/'
          nested_count = fixture.count(nested_old)
          if nested_count == 2:
              fixture = fixture.replace(nested_old, nested_new)
          elif nested_count != 0:
              raise SystemExit(f'unexpected nested fixture runner count: {nested_count}')
          if fixture.count(nested_new) != 2:
              raise SystemExit('both direct nested fixture runners are required')

          start = fixture.find('function runNpm(')
          end = fixture.find('\nfunction runOpenSsl(', start)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('cannot locate positional runNpm helper boundary')
          replacement = '''const packageScripts = (JSON.parse(
            fs.readFileSync(path.join(process.cwd(), "package.json"), "utf8"),
          ) as { scripts?: Record<string, string> }).scripts ?? {};

          function runNpm(
            script: string,
            args: string[],
            receipt?: string,
          ): string {
            const definition = packageScripts[script] ?? "";
            const match = /^vite-node\\s+(.+?)\\s+--$/.exec(definition);
            if (!match) {
              throw new Error(`operator ${script} is not a registered Vite Node command`);
            }
            return run(process.execPath, [
              viteNode,
              match[1]!,
              ...args,
            ], receipt);
          }
          '''
          fixture = fixture[:start] + replacement + fixture[end:]
          forbidden = [
              'npm.cmd',
              'run(npm,',
              'run("npx",',
              'execFileSync("npx"',
              'execFileSync(npx',
          ]
          present = [entry for entry in forbidden if entry in fixture]
          if present:
              raise SystemExit(f'fixture retains shell shims: {present}')
          if fixture.count('run(process.execPath, [') < 3:
              raise SystemExit('fixture lacks direct Node process execution')
          fixture_path.write_text(fixture, encoding='utf-8')
          '@ | python -
          git diff --check
          Select-String -Path tests/fixtures/emit-asoiaf-answer-credential-broker-loopback-tls-input.ts `
            -Pattern 'viteNode|packageScripts|function runNpm|process.execPath' `
            | ForEach-Object { $_.Line }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Qualify exact Windows lifecycle and publish result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $typecheckLog = Join-Path $env:RUNNER_TEMP 'windows-typecheck.log'
          $focusedLog = Join-Path $env:RUNNER_TEMP 'windows-focused.log'
          & npm run typecheck 2>&1 | Tee-Object -FilePath $typecheckLog
          $typecheck = $LASTEXITCODE
          & npm test -- tests/narrative/canon/asoiaf-answer-credential-broker-loopback-tls.test.ts 2>&1 |
            Tee-Object -FilePath $focusedLog
          $focused = $LASTEXITCODE
          $tail = Get-Content $focusedLog -Tail 120
          $body = @(
            'TEMP_LOOPBACK_TLS_WINDOWS_FIXTURE_REPAIR_V7'
            ''
            "Exact checkout: ``$(git rev-parse HEAD)``."
            "TypeScript status: ``$typecheck``; focused status: ``$focused``."
            ''
            'Focused tail:'
            '```text'
            $tail
            '```'
          ) -join "`n"
          $comment = Join-Path $env:RUNNER_TEMP 'comment.md'
          $body | Set-Content -LiteralPath $comment -Encoding utf8
          gh pr comment 282 --repo $env:GITHUB_REPOSITORY --body-file $comment
          if ($typecheck -ne 0 -or $focused -ne 0) { exit 1 }

      - name: Commit carrier-free Windows repair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add `
            tests/narrative/canon/asoiaf-answer-credential-broker-loopback-tls.test.ts `
            tests/fixtures/emit-asoiaf-answer-credential-broker-loopback-tls-input.ts
          git rm .github/workflows/_temp-repair-loopback-tls-windows-npx.yml
          git diff --cached --check
          git commit -m 'Invoke loopback TLS operators through Node on Windows'
          git push origin HEAD:feature/asoiaf-answer-credential-broker-loopback-tls-v1
