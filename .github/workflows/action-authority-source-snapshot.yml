name: Action authority source snapshot

on:
  pull_request:
  push:
    branches:
      - feature/action-runtime-authority-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: action-authority-source-snapshot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/upload-artifact@v4
        with:
          name: axm-arc-action-authority-source
          path: |
            .
            !.git
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
