name: Apply and qualify ASOIAF structured observation admission v1

on:
  push:
    branches:
      - feature/asoiaf-external-reconciliation-packets-v1
    paths:
      - '.github/workflows/apply-and-qualify-asoiaf-structured-observation-admission-v1.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: apply-and-qualify-asoiaf-structured-observation-admission-v1
  cancel-in-progress: false

jobs:
  apply_qualify_and_seal:
    if: github.repository == 'BigBirdReturns/axm-arc' && github.ref_name == 'feature/asoiaf-external-reconciliation-packets-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact reconciliation parent
        uses: actions/checkout@v4
        with:
          ref: feature/asoiaf-external-reconciliation-packets-v1
          fetch-depth: 0
          show-progress: false

      - name: Bind exact admission transaction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = 'feature/asoiaf-external-reconciliation-packets-v1'
          test -z "$(git status --porcelain)"
          test -f tools/lib/asoiaf-structured-observation-admission.ts
          test -f tests/narrative/canon/asoiaf-structured-observation-admission.test.ts

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply admission gate to reconciliation bridge
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee "$RUNNER_TEMP/patch.log"
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(
                      f'{path}: expected {expected} occurrences, found {count}: {old[:180]!r}'
                  )
              target.write_text(text.replace(old, new), encoding='utf-8')

          bridge = 'tools/lib/asoiaf-structured-acquisition-reconciliation.ts'
          tests = 'tests/narrative/canon/asoiaf-structured-acquisition-reconciliation.test.ts'
          workflow = '.github/workflows/asoiaf-structured-acquisition-reconciliation.yml'
          docs = Path('docs/ASOIAF_STRUCTURED_ACQUISITION_RECONCILIATION.md')

          replace_exact(
              bridge,
              '''import {
            collectorContentId,
            sha256,
          } from "./asoiaf-external-estate.js";
          ''',
              '''import {
            collectorContentId,
            sha256,
          } from "./asoiaf-external-estate.js";
          import {
            assertAsoiafStructuredObservationAdmitted,
            validateAsoiafStructuredObservationAdmission,
            type AsoiafStructuredObservationAdmission,
          } from "./asoiaf-structured-observation-admission.js";
          ''',
          )

          replace_exact(
              bridge,
              '''  adapterReceiptUri: string;
            observation: AsoiafExternalReviewedObservation;
          }
          ''',
              '''  adapterReceiptUri: string;
            observation: AsoiafExternalReviewedObservation;
            admission: AsoiafStructuredObservationAdmission;
          }
          ''',
          )

          replace_exact(
              bridge,
              '''  normalizedContentDigest: `sha256:${string}`;
            collectorReceiptUri: string;
          ''',
              '''  normalizedContentDigest: `sha256:${string}`;
            admissionId: string;
            admissionFingerprint: `sha256:${string}`;
            admissionOutcome: AsoiafStructuredObservationAdmission["outcome"];
            admissionReason: AsoiafStructuredObservationAdmission["reason"];
            admissionReviewedBy: string;
            admissionReviewedAt: string;
            admissionQuestionLaneIds: string[];
            collectorReceiptUri: string;
          ''',
          )

          replace_exact(
              bridge,
              '''  const { plan, acquisitionReceipt, adapterReceipt, observation } = input;
            const source = getAsoiafExternalSource(plan.sourceId);
          ''',
              '''  const {
              plan,
              acquisitionReceipt,
              adapterReceipt,
              observation,
              admission,
            } = input;
            const source = getAsoiafExternalSource(plan.sourceId);
          ''',
          )

          replace_exact(
              bridge,
              '''  if (!validDigest(observation.contentDigest) || observation.responseBytes <= 0) {
              findings.push(finding("normalized-observation-custody", observation.observationId, "reviewed observation lacks a positive normalized digest and byte count"));
            }
            if (
              !safeRelativeUri(input.acquisitionReceiptUri)
          ''',
              '''  if (!validDigest(observation.contentDigest) || observation.responseBytes <= 0) {
              findings.push(finding("normalized-observation-custody", observation.observationId, "reviewed observation lacks a positive normalized digest and byte count"));
            }
            for (const admissionFinding of validateAsoiafStructuredObservationAdmission(admission)) {
              findings.push(
                finding(
                  `admission-${admissionFinding.code}`,
                  admissionFinding.subjectId,
                  admissionFinding.detail,
                ),
              );
            }
            if (admission.outcome !== "admit-to-review") {
              findings.push(
                finding(
                  "observation-not-admitted",
                  admission.admissionId,
                  `structured observation disposition is ${admission.outcome}`,
                ),
              );
            }
            if (
              admission.sourceId !== plan.sourceId
              || admission.adapterId !== plan.adapterId
              || admission.requestId !== plan.requestId
              || admission.planFingerprint !== plan.planFingerprint
              || admission.acquisitionReceiptId !== acquisitionReceipt.receiptId
              || admission.acquisitionReceiptFingerprint !== acquisitionReceipt.receiptFingerprint
              || admission.adapterReceiptFingerprint !== adapterReceipt.receiptFingerprint
              || admission.observationId !== observation.observationId
              || admission.candidateId !== observation.collectorCandidateId
              || admission.normalizedContentDigest !== observation.contentDigest
              || admission.reviewedBy !== observation.reviewerId
            ) {
              findings.push(
                finding(
                  "admission-custody-parity",
                  admission.admissionId,
                  "admission disposition differs from the signed plan, receipts, reviewed observation, candidate, digest, or reviewer",
                ),
              );
            }
            if (
              !safeRelativeUri(input.acquisitionReceiptUri)
          ''',
          )

          replace_exact(
              bridge,
              '''  const { plan, acquisitionReceipt, adapterReceipt, observation } = input;
            const core = {
          ''',
              '''  const {
              plan,
              acquisitionReceipt,
              adapterReceipt,
              observation,
              admission,
            } = input;
            assertAsoiafStructuredObservationAdmitted(admission);
            const core = {
          ''',
          )

          replace_exact(
              bridge,
              '''    normalizedCandidateId: observation.collectorCandidateId,
              normalizedContentDigest: observation.contentDigest,
              collectorReceiptUri: observation.receiptUri,
          ''',
              '''    normalizedCandidateId: observation.collectorCandidateId,
              normalizedContentDigest: observation.contentDigest,
              admissionId: admission.admissionId,
              admissionFingerprint: admission.admissionFingerprint,
              admissionOutcome: admission.outcome,
              admissionReason: admission.reason,
              admissionReviewedBy: admission.reviewedBy,
              admissionReviewedAt: admission.reviewedAt,
              admissionQuestionLaneIds: [...admission.questionLaneIds],
              collectorReceiptUri: observation.receiptUri,
          ''',
          )

          replace_exact(
              bridge,
              '''    || !validDigest(binding.sourceResponseDigest)
              || !validDigest(binding.normalizedContentDigest)
          ''',
              '''    || !validDigest(binding.sourceResponseDigest)
              || !validDigest(binding.normalizedContentDigest)
              || !validDigest(binding.admissionFingerprint)
          ''',
          )

          replace_exact(
              bridge,
              '''    binding.rawResponseRetained !== false
              || binding.authorityRole !== "supporting-only"
              || binding.graphEffect !== "none"
              || binding.canonEffect !== "none"
          ''',
              '''    binding.rawResponseRetained !== false
              || binding.authorityRole !== "supporting-only"
              || binding.admissionOutcome !== "admit-to-review"
              || (
                binding.admissionReason !== "exact-identity-and-question-match"
                && binding.admissionReason !== "bounded-relevant-metadata"
              )
              || binding.admissionQuestionLaneIds.length === 0
              || binding.graphEffect !== "none"
              || binding.canonEffect !== "none"
          ''',
          )

          replace_exact(
              bridge,
              '''    adapterReceiptFingerprint: binding.adapterReceiptFingerprint,
              adapterReceiptUri: binding.adapterReceiptUri,
            } as AsoiafExternalReviewedObservation;
          ''',
              '''    adapterReceiptFingerprint: binding.adapterReceiptFingerprint,
              adapterReceiptUri: binding.adapterReceiptUri,
              structuredAdmissionId: binding.admissionId,
              structuredAdmissionFingerprint: binding.admissionFingerprint,
              structuredAdmissionOutcome: binding.admissionOutcome,
              structuredAdmissionReason: binding.admissionReason,
              structuredAdmissionReviewedBy: binding.admissionReviewedBy,
              structuredAdmissionReviewedAt: binding.admissionReviewedAt,
              structuredAdmissionQuestionLaneIds: binding.admissionQuestionLaneIds,
            } as AsoiafExternalReviewedObservation;
          ''',
          )

          replace_exact(
              bridge,
              '''      acquisitionRawResponseRetained: false,
                normalizedObservationDigest: binding.normalizedContentDigest,
          ''',
              '''      acquisitionRawResponseRetained: false,
                normalizedObservationDigest: binding.normalizedContentDigest,
                structuredAdmissionId: binding.admissionId,
                structuredAdmissionFingerprint: binding.admissionFingerprint,
                structuredAdmissionOutcome: binding.admissionOutcome,
                structuredAdmissionReason: binding.admissionReason,
                structuredAdmissionReviewedBy: binding.admissionReviewedBy,
                structuredAdmissionReviewedAt: binding.admissionReviewedAt,
                structuredAdmissionQuestionLaneIds: binding.admissionQuestionLaneIds,
          ''',
          )

          replace_exact(
              bridge,
              '''    || observation.adapterReceiptFingerprint !== binding.adapterReceiptFingerprint
          ''',
              '''    || observation.adapterReceiptFingerprint !== binding.adapterReceiptFingerprint
              || observation.structuredAdmissionId !== binding.admissionId
              || observation.structuredAdmissionFingerprint !== binding.admissionFingerprint
              || observation.structuredAdmissionOutcome !== "admit-to-review"
          ''',
          )

          replace_exact(
              bridge,
              '''      || claim.normalized.normalizedObservationDigest !== binding.normalizedContentDigest
              || claim.normalized.acquisitionRawResponseRetained !== false
          ''',
              '''      || claim.normalized.normalizedObservationDigest !== binding.normalizedContentDigest
              || claim.normalized.acquisitionRawResponseRetained !== false
              || claim.normalized.structuredAdmissionId !== binding.admissionId
              || claim.normalized.structuredAdmissionFingerprint !== binding.admissionFingerprint
              || claim.normalized.structuredAdmissionOutcome !== "admit-to-review"
          ''',
          )

          replace_exact(
              tests,
              '''} from "../../../tools/lib/asoiaf-structured-acquisition-reconciliation.js";
          ''',
              '''} from "../../../tools/lib/asoiaf-structured-acquisition-reconciliation.js";
          import {
            buildAsoiafStructuredObservationAdmission,
            type AsoiafStructuredObservationAdmission,
          } from "../../../tools/lib/asoiaf-structured-observation-admission.js";
          ''',
          )

          replace_exact(
              tests,
              '''function reviewInput(input?: {
            outcome?: "observed" | "cache-hit";
            adapter?: AsoiafStructuredAdapterReceipt;
            observation?: AsoiafExternalReviewedObservation;
            acquisitionReceiptUri?: string;
          }): AsoiafStructuredAcquisitionReviewInput {
            const adapter = input?.adapter ?? adapterReceipt();
            return {
              plan: signedPlan(),
              acquisitionReceipt: acquisitionReceipt({
                outcome: input?.outcome,
                adapter,
              }),
              acquisitionReceiptUri:
                input?.acquisitionReceiptUri
                ?? "structured-acquisition-receipts/acquisition-Q285779.json",
              adapterReceipt: adapter,
              adapterReceiptUri: "structured-adapter-receipts/wikidata-varys-Q285779.json",
              observation: input?.observation ?? reviewedObservation(),
            };
          }
          ''',
              '''function reviewInput(input?: {
            outcome?: "observed" | "cache-hit";
            adapter?: AsoiafStructuredAdapterReceipt;
            observation?: AsoiafExternalReviewedObservation;
            acquisitionReceiptUri?: string;
            admission?: AsoiafStructuredObservationAdmission;
          }): AsoiafStructuredAcquisitionReviewInput {
            const adapter = input?.adapter ?? adapterReceipt();
            const plan = signedPlan();
            const acquisition = acquisitionReceipt({
              outcome: input?.outcome,
              adapter,
            });
            const observation = input?.observation ?? reviewedObservation();
            const admission = input?.admission ?? buildAsoiafStructuredObservationAdmission({
              sourceId: SOURCE_ID,
              adapterId: ADAPTER_ID,
              requestId: REQUEST_ID,
              planFingerprint: plan.planFingerprint,
              acquisitionReceiptId: acquisition.receiptId,
              acquisitionReceiptFingerprint: acquisition.receiptFingerprint,
              adapterReceiptFingerprint: adapter.receiptFingerprint,
              observationId: observation.observationId,
              candidateId: observation.collectorCandidateId,
              normalizedContentDigest: observation.contentDigest,
              questionLaneIds: ["entity-resolution"],
              evidence: [
                {
                  field: "upstream-record",
                  value: SOURCE_RECORD_ID,
                  effect: "supports-admission",
                  note: "The exact Wikidata record identity matches the selected structured entity-resolution fixture.",
                },
                {
                  field: "title",
                  value: "Varys",
                  effect: "supports-admission",
                  note: "The reviewed label and record identity serve the bounded Varys entity-resolution question.",
                },
              ],
              outcome: "admit-to-review",
              reason: "exact-identity-and-question-match",
              rationale:
                "The exact upstream record identity and reviewed label match the selected Varys entity-resolution question, while the structured record remains supporting-only evidence.",
              reviewedBy: REVIEWER,
              reviewedAt: REVIEWED_AT,
              authorityRole: "admission-only",
              graphEffect: "none",
              canonEffect: "none",
            });
            return {
              plan,
              acquisitionReceipt: acquisition,
              acquisitionReceiptUri:
                input?.acquisitionReceiptUri
                ?? "structured-acquisition-receipts/acquisition-Q285779.json",
              adapterReceipt: adapter,
              adapterReceiptUri: "structured-adapter-receipts/wikidata-varys-Q285779.json",
              observation,
              admission,
            };
          }
          ''',
          )

          replace_exact(
              tests,
              '''        normalizedContentDigest: NORMALIZED_DIGEST,
                rawResponseRetained: false,
          ''',
              '''        normalizedContentDigest: NORMALIZED_DIGEST,
                admissionOutcome: "admit-to-review",
                admissionReason: "exact-identity-and-question-match",
                admissionReviewedBy: REVIEWER,
                admissionQuestionLaneIds: ["entity-resolution"],
                rawResponseRetained: false,
          ''',
          )

          replace_exact(
              tests,
              '''        acquisitionRawResponseRetained: false,
              }),
          ''',
              '''        acquisitionRawResponseRetained: false,
                structuredAdmissionOutcome: "admit-to-review",
                structuredAdmissionReason: "exact-identity-and-question-match",
              }),
          ''',
          )

          replace_exact(
              tests,
              '''  it("refuses structured reference evidence that attempts primary adjudicating authority", () => {
          ''',
              '''  it("refuses an off-topic or deferred observation before claim construction", () => {
              const admitted = reviewInput();
              const rejected = buildAsoiafStructuredObservationAdmission({
                sourceId: admitted.plan.sourceId,
                adapterId: admitted.plan.adapterId,
                requestId: admitted.plan.requestId,
                planFingerprint: admitted.plan.planFingerprint,
                acquisitionReceiptId: admitted.acquisitionReceipt.receiptId,
                acquisitionReceiptFingerprint: admitted.acquisitionReceipt.receiptFingerprint,
                adapterReceiptFingerprint: admitted.adapterReceipt.receiptFingerprint,
                observationId: admitted.observation.observationId,
                candidateId: admitted.observation.collectorCandidateId,
                normalizedContentDigest: admitted.observation.contentDigest,
                questionLaneIds: ["entity-resolution"],
                evidence: [
                  {
                    field: "container",
                    value: "Unrelated reference work",
                    effect: "supports-rejection",
                    note: "The retained container identifies a lexical collision outside the selected ASOIAF question.",
                  },
                ],
                outcome: "reject-off-topic",
                reason: "off-topic-query-collision",
                rationale:
                  "The exact retained work identity does not serve the selected ASOIAF question, so the observation remains intake-only and cannot enter supporting claim construction.",
                reviewedBy: REVIEWER,
                reviewedAt: REVIEWED_AT,
                authorityRole: "admission-only",
                graphEffect: "none",
                canonEffect: "none",
              });
              const rejectedInput = { ...admitted, admission: rejected };
              expect(
                validateAsoiafStructuredAcquisitionReviewInput(rejectedInput).map(
                  (entry) => entry.code,
                ),
              ).toContain("observation-not-admitted");
              expect(() =>
                buildAsoiafStructuredAcquisitionReviewPacket({
                  ...rejectedInput,
                  packetId: "external-review:wikidata:off-topic-refusal",
                  continuityId,
                  claims: [claim()],
                }),
              ).toThrow(/reject-off-topic/);
            });

            it("refuses structured reference evidence that attempts primary adjudicating authority", () => {
          ''',
          )

          replace_exact(
              workflow,
              '''      - 'tools/lib/asoiaf-structured-acquisition-reconciliation.ts'
                - 'tests/narrative/canon/asoiaf-structured-acquisition-reconciliation.test.ts'
          ''',
              '''      - 'tools/lib/asoiaf-structured-acquisition-reconciliation.ts'
                - 'tools/lib/asoiaf-structured-observation-admission.ts'
                - 'tests/narrative/canon/asoiaf-structured-acquisition-reconciliation.test.ts'
                - 'tests/narrative/canon/asoiaf-structured-observation-admission.test.ts'
          ''',
              expected=2,
          )

          replace_exact(
              workflow,
              '''          npm test -- \\
                tests/narrative/canon/asoiaf-structured-acquisition-reconciliation.test.ts \\
                tests/narrative/canon/asoiaf-external-reconciliation-packets.test.ts \\
          ''',
              '''          npm test -- \\
                tests/narrative/canon/asoiaf-structured-observation-admission.test.ts \\
                tests/narrative/canon/asoiaf-structured-acquisition-reconciliation.test.ts \\
                tests/narrative/canon/asoiaf-external-reconciliation-packets.test.ts \\
          ''',
          )

          replace_exact(
              workflow,
              '''            'reviewedObservationParity=required' \\
                'rightsReview=named-required' \\
          ''',
              '''            'reviewedObservationParity=required' \\
                'semanticAdmission=fingerprinted-required' \\
                'admissionOutcomes=admit-reject-defer' \\
                'workIdentityEvidence=retained-required' \\
                'questionRelevanceEvidence=retained-required' \\
                'rightsReview=named-required' \\
          ''',
          )

          appendix = '''

          ## Structured observation admission

          Successful acquisition and valid normalized custody are necessary but insufficient for claim construction. Every structured observation now requires one fingerprinted admission disposition before the acquisition-to-review bridge can build a packet:

          ```text
          admit-to-review
          reject-off-topic
          defer-insufficient-identity
          ```

          The named reviewer binds the exact plan, acquisition receipt, adapter receipt, observation, candidate, normalized digest, question lanes, work-identity evidence, relevance evidence, outcome, reason, rationale, reviewer, and review time. An admitted observation must carry evidence that supports admission and must use either `exact-identity-and-question-match` or `bounded-relevant-metadata`. A lexical collision, continuity mismatch, or unsupported question lane is retained as a rejection. An observation lacking durable work identity or sufficient question relevance is retained as a defer.

          Rejection and defer are terminal for packet construction. They preserve the observation and acquisition ledger but cannot create a reviewed claim, evidence bundle, reconciliation proposal, graph effect, or canon effect. The bridge binds the admission identity and fingerprint into the reviewed observation, every supporting evidence record, and the packet verification surface. A stale, mismatched, differently reviewed, or non-admitted disposition invalidates construction.

          This gate was operationalized after the live canary returned a mechanically valid Crossref record whose title overlapped “A Song of Ice and Fire” but whose DOI, container, and publisher identified an unrelated work. The acquisition remained valid and the observation remained intake-only. The explicit disposition prevents HTTP success, lexical overlap, normalized metadata, or a human narrative gloss from silently becoming semantic relevance.
          '''
          docs.write_text(docs.read_text(encoding='utf-8').rstrip() + appendix + '\n', encoding='utf-8')

          for required in (
              'admission: AsoiafStructuredObservationAdmission;',
              'admissionFingerprint: `sha256:${string}`;',
              'validateAsoiafStructuredObservationAdmission(admission)',
              'assertAsoiafStructuredObservationAdmitted(admission)',
              'structuredAdmissionOutcome: binding.admissionOutcome',
              'observation-not-admitted',
          ):
              if required not in Path(bridge).read_text(encoding='utf-8'):
                  raise SystemExit(f'missing admission bridge repair marker: {required}')
          print('STRUCTURED_OBSERVATION_ADMISSION_GATE_APPLIED')
          PY
          git diff --check

      - name: Strict TypeScript
        id: typecheck
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/typecheck.log"

      - name: Focused admission and reconciliation qualification
        id: focused
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test -- \
            tests/narrative/canon/asoiaf-structured-observation-admission.test.ts \
            tests/narrative/canon/asoiaf-structured-acquisition-reconciliation.test.ts \
            tests/narrative/canon/asoiaf-external-reconciliation-packets.test.ts \
            2>&1 | tee "$RUNNER_TEMP/focused-tests.log"

      - name: Complete Arc regression
        id: regression
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/full-tests.log"

      - name: Production build
        id: build
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Commit exact qualified admission gate
        id: candidate
        if: steps.patch.outcome == 'success' && steps.typecheck.outcome == 'success' && steps.focused.outcome == 'success' && steps.regression.outcome == 'success' && steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-and-qualify-asoiaf-structured-observation-admission-v1.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Require structured observation admission before review'
          final_sha="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          git push origin HEAD:feature/asoiaf-external-reconciliation-packets-v1
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"

      - name: Retain exact admission qualification diagnostics
        if: always()
        env:
          FINAL_SHA: ${{ steps.candidate.outputs.final_sha }}
          PATCH: ${{ steps.patch.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          REGRESSION: ${{ steps.regression.outcome }}
          BUILD: ${{ steps.build.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          root='asoiaf-structured-observation-admission-qualification'
          mkdir -p "$root"
          cp "$RUNNER_TEMP"/*.log "$root/" 2>/dev/null || true
          printf '%s\n' "$GITHUB_SHA" > "$root/trigger-sha.txt"
          printf '%s\n' "${FINAL_SHA:-not-issued}" > "$root/candidate-sha.txt"
          printf '%s\n' \
            "patch=$PATCH" \
            "typecheck=$TYPECHECK" \
            "focused=$FOCUSED" \
            "regression=$REGRESSION" \
            "build=$BUILD" \
            > "$root/outcomes.txt"
          printf '%s\n' \
            'admissionFormat=axm-asoiaf-structured-observation-admission/1' \
            'outcomes=admit-reject-defer' \
            'namedReviewer=required' \
            'questionLane=required' \
            'identityEvidence=required' \
            'relevanceEvidence=required' \
            'rejectAndDeferPacketConstruction=false' \
            'admissionAuthority=admission-only' \
            'structuredAuthority=supporting-only-after-admission' \
            'graphEffect=none-before-compile' \
            'canonEffect=none-before-compile' \
            > "$root/admission-boundary.txt"
          git status --short > "$root/worktree-status.txt"
          git diff --stat > "$root/worktree-diff-stat.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" \
            > "$root/SHA256SUMS"

      - name: Upload admission qualification diagnostics
        if: always()
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-structured-observation-admission-qualification
          path: asoiaf-structured-observation-admission-qualification
          if-no-files-found: error
          retention-days: 30

      - name: Post bounded admission result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.candidate.outputs.final_sha }}
          ARTIFACT_ID: ${{ steps.upload.outputs['artifact-id'] }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs['artifact-digest'] }}
          PATCH: ${{ steps.patch.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          REGRESSION: ${{ steps.regression.outcome }}
          BUILD: ${{ steps.build.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FINAL_SHA:-}" ]; then
            gh pr comment 232 --repo "$GITHUB_REPOSITORY" --body \
              "Structured observation admission is qualified on candidate \`${FINAL_SHA}\`. Strict TypeScript, the focused admission and reconciliation suites, the complete Arc regression, and production build passed. Artifact \`${ARTIFACT_ID}\` has ZIP digest \`${ARTIFACT_DIGEST}\`. The bridge now requires a fingerprinted named-review disposition of \`admit-to-review\`, \`reject-off-topic\`, or \`defer-insufficient-identity\`; only admitted observations may construct supporting claims, while rejection and defer preserve custody with \`graphEffect=none\` and \`canonEffect=none\`."
          else
            gh pr comment 232 --repo "$GITHUB_REPOSITORY" --body \
              "Structured observation admission did not issue a candidate. Patch \`${PATCH}\`, TypeScript \`${TYPECHECK}\`, focused suite \`${FOCUSED}\`, regression \`${REGRESSION}\`, build \`${BUILD}\`. Artifact \`${ARTIFACT_ID}\` has ZIP digest \`${ARTIFACT_DIGEST}\`. No admission authority or reconciliation change is claimed."
            exit 1
          fi