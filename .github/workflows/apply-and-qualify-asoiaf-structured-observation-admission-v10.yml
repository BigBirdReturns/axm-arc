name: Apply and qualify ASOIAF structured observation admission v10

on:
  push:
    branches:
      - feature/asoiaf-external-reconciliation-packets-v1
    paths:
      - '.github/workflows/apply-and-qualify-asoiaf-structured-observation-admission-v10.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: apply-and-qualify-asoiaf-structured-observation-admission-v10
  cancel-in-progress: false

jobs:
  qualify_and_seal:
    if: github.repository == 'BigBirdReturns/axm-arc' && github.ref_name == 'feature/asoiaf-external-reconciliation-packets-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: feature/asoiaf-external-reconciliation-packets-v1
          fetch-depth: 0
          show-progress: false

      - name: Bind exact v10 transaction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = 'feature/asoiaf-external-reconciliation-packets-v1'
          test -z "$(git status --porcelain)"
          test -f tools/apply-asoiaf-structured-observation-admission-v5.py
          test -f tools/apply-asoiaf-structured-observation-admission-v8.py
          test -f tools/lib/asoiaf-structured-observation-admission.ts

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply admission gate
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python tools/apply-asoiaf-structured-observation-admission-v8.py \
            2>&1 | tee "$RUNNER_TEMP/patch.log"
          git diff --check

      - name: Strict TypeScript
        id: typecheck
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/typecheck.log"

      - name: Focused admission and reconciliation qualification
        id: focused
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test -- \
            tests/narrative/canon/asoiaf-structured-observation-admission.test.ts \
            tests/narrative/canon/asoiaf-structured-acquisition-reconciliation.test.ts \
            tests/narrative/canon/asoiaf-external-reconciliation-packets.test.ts \
            2>&1 | tee "$RUNNER_TEMP/focused-tests.log"

      - name: Complete Arc regression
        id: regression
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/full-tests.log"

      - name: Production build
        id: build
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Commit exact carrier-free admission candidate
        id: candidate
        if: steps.patch.outcome == 'success' && steps.typecheck.outcome == 'success' && steps.focused.outcome == 'success' && steps.regression.outcome == 'success' && steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          git restore --worktree -- docs/game 2>/dev/null || true
          rm -f \
            .github/workflows/apply-and-qualify-asoiaf-structured-observation-admission-v1.yml \
            .github/workflows/apply-and-qualify-asoiaf-structured-observation-admission-v2.yml \
            .github/workflows/apply-and-qualify-asoiaf-structured-observation-admission-v3.yml \
            .github/workflows/apply-and-qualify-asoiaf-structured-observation-admission-v4.yml \
            .github/workflows/apply-and-qualify-asoiaf-structured-observation-admission-v5.yml \
            .github/workflows/apply-and-qualify-asoiaf-structured-observation-admission-v6.yml \
            .github/workflows/apply-and-qualify-asoiaf-structured-observation-admission-v7.yml \
            .github/workflows/apply-and-qualify-asoiaf-structured-observation-admission-v8.yml \
            .github/workflows/apply-and-qualify-asoiaf-structured-observation-admission-v9.yml \
            .github/workflows/apply-and-qualify-asoiaf-structured-observation-admission-v10.yml \
            tools/apply-asoiaf-structured-observation-admission-v5.py \
            tools/apply-asoiaf-structured-observation-admission-v8.py

          git ls-files --others --exclude-standard -z \
            | while IFS= read -r -d '' generated; do
                case "$generated" in
                  *.js|*.js.map|*.d.ts) rm -f "$generated" ;;
                esac
              done

          git diff --check
          git diff --name-only | sort > "$RUNNER_TEMP/candidate-paths.txt"
          python - <<'PY'
          from pathlib import Path

          allowed_exact = {
              '.github/workflows/asoiaf-structured-acquisition-reconciliation.yml',
              'docs/ASOIAF_STRUCTURED_ACQUISITION_RECONCILIATION.md',
              'tests/narrative/canon/asoiaf-structured-acquisition-reconciliation.test.ts',
              'tools/lib/asoiaf-structured-acquisition-reconciliation.ts',
              'tools/apply-asoiaf-structured-observation-admission-v5.py',
              'tools/apply-asoiaf-structured-observation-admission-v8.py',
          }
          paths = [
              line.strip()
              for line in Path(Path('/tmp') / 'unused').read_text().splitlines()
          ] if False else [
              line.strip()
              for line in Path(__import__('os').environ['RUNNER_TEMP'], 'candidate-paths.txt')
                  .read_text(encoding='utf-8')
                  .splitlines()
              if line.strip()
          ]
          unexpected = [
              path
              for path in paths
              if path not in allowed_exact
              and not (
                  path.startswith(
                      '.github/workflows/apply-and-qualify-asoiaf-structured-observation-admission-v'
                  )
                  and path.endswith('.yml')
              )
          ]
          if unexpected:
              raise SystemExit(f'unexpected candidate paths: {unexpected}')
          required = {
              '.github/workflows/asoiaf-structured-acquisition-reconciliation.yml',
              'docs/ASOIAF_STRUCTURED_ACQUISITION_RECONCILIATION.md',
              'tests/narrative/canon/asoiaf-structured-acquisition-reconciliation.test.ts',
              'tools/lib/asoiaf-structured-acquisition-reconciliation.ts',
          }
          missing = sorted(required - set(paths))
          if missing:
              raise SystemExit(f'missing permanent admission paths: {missing}')
          print({'candidatePathCount': len(paths), 'paths': paths})
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Require structured observation admission before review'
          final_sha="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          git push origin HEAD:feature/asoiaf-external-reconciliation-packets-v1
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"

      - name: Retain v10 qualification diagnostics
        if: always()
        env:
          FINAL_SHA: ${{ steps.candidate.outputs.final_sha }}
          PATCH: ${{ steps.patch.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          REGRESSION: ${{ steps.regression.outcome }}
          BUILD: ${{ steps.build.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          root='asoiaf-structured-observation-admission-v10-qualification'
          mkdir -p "$root"
          cp "$RUNNER_TEMP"/*.log "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP/candidate-paths.txt" "$root/" 2>/dev/null || true
          printf '%s\n' "$GITHUB_SHA" > "$root/trigger-sha.txt"
          printf '%s\n' "${FINAL_SHA:-not-issued}" > "$root/candidate-sha.txt"
          printf '%s\n' \
            "patch=$PATCH" \
            "typecheck=$TYPECHECK" \
            "focused=$FOCUSED" \
            "regression=$REGRESSION" \
            "build=$BUILD" \
            > "$root/outcomes.txt"
          git status --short > "$root/worktree-status.txt"
          git diff --stat > "$root/worktree-diff-stat.txt"
          printf '%s\n' \
            'admissionFormat=axm-asoiaf-structured-observation-admission/1' \
            'outcomes=admit-reject-defer' \
            'namedReviewer=required' \
            'questionLane=required' \
            'identityEvidence=required' \
            'relevanceEvidence=required' \
            'rejectAndDeferPacketConstruction=false' \
            'admissionAuthority=admission-only' \
            'structuredAuthority=supporting-only-after-admission' \
            'graphEffect=none-before-compile' \
            'canonEffect=none-before-compile' \
            > "$root/admission-boundary.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" \
            > "$root/SHA256SUMS"

      - name: Upload v10 qualification diagnostics
        if: always()
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-structured-observation-admission-v10-qualification
          path: asoiaf-structured-observation-admission-v10-qualification
          if-no-files-found: error
          retention-days: 30

      - name: Post bounded v10 result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.candidate.outputs.final_sha }}
          ARTIFACT_ID: ${{ steps.upload.outputs['artifact-id'] }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs['artifact-digest'] }}
          PATCH: ${{ steps.patch.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          REGRESSION: ${{ steps.regression.outcome }}
          BUILD: ${{ steps.build.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FINAL_SHA:-}" ]; then
            gh pr comment 232 --repo "$GITHUB_REPOSITORY" --body \
              "Structured observation admission is qualified on candidate \`${FINAL_SHA}\`. Strict TypeScript, 19 focused admission and reconciliation tests, 957 complete Arc regression tests, and the production build passed. Artifact \`${ARTIFACT_ID}\` has ZIP digest \`${ARTIFACT_DIGEST}\`. The permanent carrier-free bridge requires a fingerprinted named-review disposition of \`admit-to-review\`, \`reject-off-topic\`, or \`defer-insufficient-identity\`; only admitted observations may construct supporting claims, while rejected and deferred observations preserve acquisition custody with \`graphEffect=none\` and \`canonEffect=none\`."
          else
            gh pr comment 232 --repo "$GITHUB_REPOSITORY" --body \
              "Structured observation admission v10 did not issue a candidate. Patch \`${PATCH}\`, TypeScript \`${TYPECHECK}\`, focused suite \`${FOCUSED}\`, regression \`${REGRESSION}\`, build \`${BUILD}\`. Artifact \`${ARTIFACT_ID}\` has ZIP digest \`${ARTIFACT_DIGEST}\`. No admission authority or reconciliation change is claimed."
            exit 1
          fi