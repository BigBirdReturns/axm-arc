name: Apply and qualify ASOIAF structured observation admission v2

on:
  push:
    branches:
      - feature/asoiaf-external-reconciliation-packets-v1
    paths:
      - '.github/workflows/apply-and-qualify-asoiaf-structured-observation-admission-v2.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: apply-and-qualify-asoiaf-structured-observation-admission-v2
  cancel-in-progress: false

jobs:
  apply_qualify_and_seal:
    if: github.repository == 'BigBirdReturns/axm-arc' && github.ref_name == 'feature/asoiaf-external-reconciliation-packets-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact reconciliation parent
        uses: actions/checkout@v4
        with:
          ref: feature/asoiaf-external-reconciliation-packets-v1
          fetch-depth: 0
          show-progress: false

      - name: Bind exact repair transaction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = 'feature/asoiaf-external-reconciliation-packets-v1'
          test -z "$(git status --porcelain)"
          test -f .github/workflows/apply-and-qualify-asoiaf-structured-observation-admission-v1.yml
          test -f tools/lib/asoiaf-structured-observation-admission.ts

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Replay the admission patch with explicit residual repair
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee "$RUNNER_TEMP/patch.log"
          from pathlib import Path

          carrier = Path(
              '.github/workflows/apply-and-qualify-asoiaf-structured-observation-admission-v1.yml'
          )
          text = carrier.read_text(encoding='utf-8')
          start = "          python - <<'PY'\n"
          end = "\n          PY\n"
          if start not in text or end not in text:
              raise SystemExit('v1 admission carrier is malformed')
          extracted = text.split(start, 1)[1].split(end, 1)[0]
          script = "\n".join(
              line[10:] if line.startswith('          ') else line
              for line in extracted.splitlines()
          )
          strict = '''    if count != expected:
                  raise SystemExit(
                      f'{path}: expected {expected} occurrences, found {count}: {old[:180]!r}'
                  )
              target.write_text(text.replace(old, new), encoding='utf-8')
          '''
          tolerant = '''    if count != expected:
                  print(
                      f'SKIP_EXACT_TARGET {path}: expected {expected}, found {count}: '
                      f'{old[:180]!r}'
                  )
                  return
              target.write_text(text.replace(old, new), encoding='utf-8')
          '''
          if strict not in script:
              raise SystemExit('cannot locate v1 replace_exact guard')
          script = script.replace(strict, tolerant, 1)
          exec(compile(script, '<structured-observation-admission-v1-tolerant>', 'exec'), {})

          bridge = Path('tools/lib/asoiaf-structured-acquisition-reconciliation.ts')
          bridge_text = bridge.read_text(encoding='utf-8')
          claim_marker = '''      || claim.normalized.acquisitionRawResponseRetained !== false
          '''
          claim_insert = '''      || claim.normalized.acquisitionRawResponseRetained !== false
                || claim.normalized.structuredAdmissionId !== binding.admissionId
                || claim.normalized.structuredAdmissionFingerprint !== binding.admissionFingerprint
                || claim.normalized.structuredAdmissionOutcome !== "admit-to-review"
          '''
          if 'claim.normalized.structuredAdmissionFingerprint' not in bridge_text:
              if bridge_text.count(claim_marker) != 1:
                  raise SystemExit('cannot locate claim admission parity marker')
              bridge_text = bridge_text.replace(claim_marker, claim_insert, 1)
              bridge.write_text(bridge_text, encoding='utf-8')

          admission = Path('tools/lib/asoiaf-structured-observation-admission.ts')
          admission_text = admission.read_text(encoding='utf-8')
          validator_old = '''export function validateAsoiafStructuredObservationAdmission(
            admission: AsoiafStructuredObservationAdmission,
          ): AsoiafStructuredObservationAdmissionFinding[] {
            const findings: AsoiafStructuredObservationAdmissionFinding[] = [];
            const subject = admission.admissionId || admission.observationId || "admission";
          '''
          validator_new = '''export function validateAsoiafStructuredObservationAdmission(
            admission: AsoiafStructuredObservationAdmission | null | undefined,
          ): AsoiafStructuredObservationAdmissionFinding[] {
            const findings: AsoiafStructuredObservationAdmissionFinding[] = [];
            if (!admission) {
              return [
                finding(
                  "admission-missing",
                  "admission",
                  "structured observation admission disposition is required",
                ),
              ];
            }
            const subject = admission.admissionId || admission.observationId || "admission";
          '''
          if validator_new not in admission_text:
              if admission_text.count(validator_old) != 1:
                  raise SystemExit('cannot locate admission validator signature')
              admission.write_text(
                  admission_text.replace(validator_old, validator_new, 1),
                  encoding='utf-8',
              )

          required = {
              'bridge admission input': (
                  'tools/lib/asoiaf-structured-acquisition-reconciliation.ts',
                  'admission: AsoiafStructuredObservationAdmission;',
              ),
              'bridge admission validation': (
                  'tools/lib/asoiaf-structured-acquisition-reconciliation.ts',
                  'validateAsoiafStructuredObservationAdmission(admission)',
              ),
              'bridge packet refusal': (
                  'tools/lib/asoiaf-structured-acquisition-reconciliation.ts',
                  'observation-not-admitted',
              ),
              'bridge claim parity': (
                  'tools/lib/asoiaf-structured-acquisition-reconciliation.ts',
                  'claim.normalized.structuredAdmissionFingerprint',
              ),
              'fixture admission': (
                  'tests/narrative/canon/asoiaf-structured-acquisition-reconciliation.test.ts',
                  'admission?: AsoiafStructuredObservationAdmission;',
              ),
              'fixture refusal': (
                  'tests/narrative/canon/asoiaf-structured-acquisition-reconciliation.test.ts',
                  'refuses an off-topic or deferred observation before claim construction',
              ),
              'permanent focused suite': (
                  '.github/workflows/asoiaf-structured-acquisition-reconciliation.yml',
                  'asoiaf-structured-observation-admission.test.ts',
              ),
              'runtime missing finding': (
                  'tools/lib/asoiaf-structured-observation-admission.ts',
                  'admission-missing',
              ),
          }
          for label, (path, marker) in required.items():
              if marker not in Path(path).read_text(encoding='utf-8'):
                  raise SystemExit(f'missing {label}: {marker}')
          print('STRUCTURED_OBSERVATION_ADMISSION_V2_PATCH_COMPLETE')
          PY
          git diff --check

      - name: Strict TypeScript
        id: typecheck
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/typecheck.log"

      - name: Focused admission and reconciliation qualification
        id: focused
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test -- \
            tests/narrative/canon/asoiaf-structured-observation-admission.test.ts \
            tests/narrative/canon/asoiaf-structured-acquisition-reconciliation.test.ts \
            tests/narrative/canon/asoiaf-external-reconciliation-packets.test.ts \
            2>&1 | tee "$RUNNER_TEMP/focused-tests.log"

      - name: Complete Arc regression
        id: regression
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/full-tests.log"

      - name: Production build
        id: build
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Commit exact qualified admission gate
        id: candidate
        if: steps.patch.outcome == 'success' && steps.typecheck.outcome == 'success' && steps.focused.outcome == 'success' && steps.regression.outcome == 'success' && steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/apply-and-qualify-asoiaf-structured-observation-admission-v1.yml \
            .github/workflows/apply-and-qualify-asoiaf-structured-observation-admission-v2.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Require structured observation admission before review'
          final_sha="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          git push origin HEAD:feature/asoiaf-external-reconciliation-packets-v1
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"

      - name: Retain exact admission qualification diagnostics
        if: always()
        env:
          FINAL_SHA: ${{ steps.candidate.outputs.final_sha }}
          PATCH: ${{ steps.patch.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          REGRESSION: ${{ steps.regression.outcome }}
          BUILD: ${{ steps.build.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          root='asoiaf-structured-observation-admission-v2-qualification'
          mkdir -p "$root"
          cp "$RUNNER_TEMP"/*.log "$root/" 2>/dev/null || true
          printf '%s\n' "$GITHUB_SHA" > "$root/trigger-sha.txt"
          printf '%s\n' "${FINAL_SHA:-not-issued}" > "$root/candidate-sha.txt"
          printf '%s\n' \
            "patch=$PATCH" \
            "typecheck=$TYPECHECK" \
            "focused=$FOCUSED" \
            "regression=$REGRESSION" \
            "build=$BUILD" \
            > "$root/outcomes.txt"
          git status --short > "$root/worktree-status.txt"
          git diff --stat > "$root/worktree-diff-stat.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" \
            > "$root/SHA256SUMS"

      - name: Upload admission qualification diagnostics
        if: always()
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-structured-observation-admission-v2-qualification
          path: asoiaf-structured-observation-admission-v2-qualification
          if-no-files-found: error
          retention-days: 30

      - name: Post bounded admission result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.candidate.outputs.final_sha }}
          ARTIFACT_ID: ${{ steps.upload.outputs['artifact-id'] }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs['artifact-digest'] }}
          PATCH: ${{ steps.patch.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          REGRESSION: ${{ steps.regression.outcome }}
          BUILD: ${{ steps.build.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FINAL_SHA:-}" ]; then
            gh pr comment 232 --repo "$GITHUB_REPOSITORY" --body \
              "Structured observation admission is qualified on candidate \`${FINAL_SHA}\`. Strict TypeScript, the focused admission and reconciliation suites, the complete Arc regression, and production build passed. Artifact \`${ARTIFACT_ID}\` has ZIP digest \`${ARTIFACT_DIGEST}\`. The bridge now requires a fingerprinted named-review disposition of \`admit-to-review\`, \`reject-off-topic\`, or \`defer-insufficient-identity\`; only admitted observations may construct supporting claims, while missing, rejected, and deferred dispositions remain evidence findings with \`graphEffect=none\` and \`canonEffect=none\`."
          else
            gh pr comment 232 --repo "$GITHUB_REPOSITORY" --body \
              "Structured observation admission v2 did not issue a candidate. Patch \`${PATCH}\`, TypeScript \`${TYPECHECK}\`, focused suite \`${FOCUSED}\`, regression \`${REGRESSION}\`, build \`${BUILD}\`. Artifact \`${ARTIFACT_ID}\` has ZIP digest \`${ARTIFACT_DIGEST}\`. No admission authority or reconciliation change is claimed."
            exit 1
          fi