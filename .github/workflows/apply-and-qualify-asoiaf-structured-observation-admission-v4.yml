name: Apply and qualify ASOIAF structured observation admission v4

on:
  push:
    branches:
      - feature/asoiaf-external-reconciliation-packets-v1
    paths:
      - '.github/workflows/apply-and-qualify-asoiaf-structured-observation-admission-v4.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: apply-and-qualify-asoiaf-structured-observation-admission-v4
  cancel-in-progress: false

jobs:
  apply_qualify_and_seal:
    if: github.repository == 'BigBirdReturns/axm-arc' && github.ref_name == 'feature/asoiaf-external-reconciliation-packets-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact reconciliation parent
        uses: actions/checkout@v4
        with:
          ref: feature/asoiaf-external-reconciliation-packets-v1
          fetch-depth: 0
          show-progress: false

      - name: Bind exact direct-integration transaction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = 'feature/asoiaf-external-reconciliation-packets-v1'
          test -z "$(git status --porcelain)"
          test -f .github/workflows/apply-and-qualify-asoiaf-structured-observation-admission-v3.yml
          test -f tools/lib/asoiaf-structured-observation-admission.ts
          test -f tests/narrative/canon/asoiaf-structured-observation-admission.test.ts

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Integrate the proven source patch and structural workflow edits
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee "$RUNNER_TEMP/patch.log"
          from pathlib import Path

          carrier = Path(
              '.github/workflows/apply-and-qualify-asoiaf-structured-observation-admission-v3.yml'
          )
          carrier_text = carrier.read_text(encoding='utf-8')
          start = "          python - <<'PY'\n"
          end = "\n          PY\n"
          if start not in carrier_text or end not in carrier_text:
              raise SystemExit('v3 direct-integration carrier is malformed')
          extracted = carrier_text.split(start, 1)[1].split(end, 1)[0]
          script = "\n".join(
              line[10:] if line.startswith('          ') else line
              for line in extracted.splitlines()
          )
          workflow_marker = "\nworkflow_path = Path(workflow)\n"
          if workflow_marker not in script:
              raise SystemExit('cannot isolate the proven source and fixture patch')
          source_patch = script.split(workflow_marker, 1)[0]
          exec(compile(source_patch, '<structured-observation-admission-v3-source-patch>', 'exec'), {})

          workflow = Path('.github/workflows/asoiaf-structured-acquisition-reconciliation.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          output: list[str] = []
          for index, line in enumerate(lines):
              output.append(line)
              following = lines[index + 1] if index + 1 < len(lines) else ''
              if (
                  line == "      - 'tools/lib/asoiaf-structured-acquisition-reconciliation.ts'"
                  and following != "      - 'tools/lib/asoiaf-structured-observation-admission.ts'"
              ):
                  output.append("      - 'tools/lib/asoiaf-structured-observation-admission.ts'")
              if (
                  line == "      - 'tests/narrative/canon/asoiaf-structured-acquisition-reconciliation.test.ts'"
                  and following != "      - 'tests/narrative/canon/asoiaf-structured-observation-admission.test.ts'"
              ):
                  output.append("      - 'tests/narrative/canon/asoiaf-structured-observation-admission.test.ts'")
              if (
                  line == '          npm test -- \\'
                  and following == '            tests/narrative/canon/asoiaf-structured-acquisition-reconciliation.test.ts \\'
              ):
                  output.append('            tests/narrative/canon/asoiaf-structured-observation-admission.test.ts \\')
              if (
                  "'reviewedObservationParity=required'" in line
                  and not any(
                      'semanticAdmission=fingerprinted-required' in candidate
                      for candidate in lines[index + 1:index + 6]
                  )
              ):
                  indent = line[: len(line) - len(line.lstrip())]
                  output.extend([
                      f"{indent}'semanticAdmission=fingerprinted-required' \\",
                      f"{indent}'admissionOutcomes=admit-reject-defer' \\",
                      f"{indent}'workIdentityEvidence=retained-required' \\",
                      f"{indent}'questionRelevanceEvidence=retained-required' \\",
                  ])
          workflow.write_text('\n'.join(output) + '\n', encoding='utf-8')

          docs = Path('docs/ASOIAF_STRUCTURED_ACQUISITION_RECONCILIATION.md')
          if '## Structured observation admission' not in docs.read_text(encoding='utf-8'):
              docs.write_text(
                  docs.read_text(encoding='utf-8').rstrip()
                  + '''

## Structured observation admission

Successful acquisition and valid normalized custody are necessary but insufficient for claim construction. Every structured observation requires one fingerprinted named-review disposition before the acquisition-to-review bridge can build a packet: `admit-to-review`, `reject-off-topic`, or `defer-insufficient-identity`.

The disposition binds the exact source, adapter, request, plan fingerprint, acquisition receipt, adapter receipt, observation, candidate, normalized digest, question lanes, work-identity evidence, relevance evidence, outcome, reason, rationale, reviewer, and review time. Admission requires evidence supporting exact identity and question relevance. A lexical collision, continuity mismatch, or unsupported lane remains a rejection. Missing durable identity or relevance remains a defer.

Rejection and defer preserve the acquisition and collector ledgers but cannot construct a reviewed claim, evidence bundle, reconciliation proposal, graph effect, or canon effect. Admitted observations remain supporting-only. The bridge carries the admission identity and fingerprint into the reviewed observation, every normalized evidence record, and packet verification.

This gate was operationalized after the live canary returned a mechanically valid Crossref record whose title overlapped “A Song of Ice and Fire” while its DOI, container, and publisher identified an unrelated work. HTTP success, lexical overlap, and normalized metadata therefore remain insufficient for semantic admission.
''',
                  encoding='utf-8',
              )

          required = {
              'tools/lib/asoiaf-structured-acquisition-reconciliation.ts': [
                  'admission: AsoiafStructuredObservationAdmission;',
                  'validateAsoiafStructuredObservationAdmission(admission)',
                  'observation-not-admitted',
                  'assertAsoiafStructuredObservationAdmitted(admission)',
                  'claim.normalized.structuredAdmissionFingerprint',
              ],
              'tests/narrative/canon/asoiaf-structured-acquisition-reconciliation.test.ts': [
                  'admission?: AsoiafStructuredObservationAdmission;',
                  'refuses an off-topic observation before claim construction',
                  'structuredAdmissionOutcome: "admit-to-review"',
              ],
              '.github/workflows/asoiaf-structured-acquisition-reconciliation.yml': [
                  'asoiaf-structured-observation-admission.test.ts',
                  'semanticAdmission=fingerprinted-required',
                  'admissionOutcomes=admit-reject-defer',
              ],
              'docs/ASOIAF_STRUCTURED_ACQUISITION_RECONCILIATION.md': [
                  '## Structured observation admission',
              ],
          }
          for path, markers in required.items():
              content = Path(path).read_text(encoding='utf-8')
              for marker in markers:
                  if marker not in content:
                      raise SystemExit(f'{path}: missing permanent admission marker {marker!r}')
          print('STRUCTURED_OBSERVATION_ADMISSION_V4_INTEGRATION_COMPLETE')
          PY
          git diff --check

      - name: Strict TypeScript
        id: typecheck
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/typecheck.log"

      - name: Focused admission and reconciliation qualification
        id: focused
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test -- \
            tests/narrative/canon/asoiaf-structured-observation-admission.test.ts \
            tests/narrative/canon/asoiaf-structured-acquisition-reconciliation.test.ts \
            tests/narrative/canon/asoiaf-external-reconciliation-packets.test.ts \
            2>&1 | tee "$RUNNER_TEMP/focused-tests.log"

      - name: Complete Arc regression
        id: regression
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/full-tests.log"

      - name: Production build
        id: build
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Commit exact qualified admission gate
        id: candidate
        if: steps.patch.outcome == 'success' && steps.typecheck.outcome == 'success' && steps.focused.outcome == 'success' && steps.regression.outcome == 'success' && steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/apply-and-qualify-asoiaf-structured-observation-admission-v1.yml \
            .github/workflows/apply-and-qualify-asoiaf-structured-observation-admission-v2.yml \
            .github/workflows/apply-and-qualify-asoiaf-structured-observation-admission-v3.yml \
            .github/workflows/apply-and-qualify-asoiaf-structured-observation-admission-v4.yml
          git ls-files --others --exclude-standard -z \
            | while IFS= read -r -d '' generated; do
                case "$generated" in
                  *.js|*.js.map|*.d.ts) rm -f "$generated" ;;
                esac
              done
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Require structured observation admission before review'
          final_sha="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          git push origin HEAD:feature/asoiaf-external-reconciliation-packets-v1
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"

      - name: Retain exact admission qualification diagnostics
        if: always()
        env:
          FINAL_SHA: ${{ steps.candidate.outputs.final_sha }}
          PATCH: ${{ steps.patch.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          REGRESSION: ${{ steps.regression.outcome }}
          BUILD: ${{ steps.build.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          root='asoiaf-structured-observation-admission-v4-qualification'
          mkdir -p "$root"
          cp "$RUNNER_TEMP"/*.log "$root/" 2>/dev/null || true
          printf '%s\n' "$GITHUB_SHA" > "$root/trigger-sha.txt"
          printf '%s\n' "${FINAL_SHA:-not-issued}" > "$root/candidate-sha.txt"
          printf '%s\n' \
            "patch=$PATCH" \
            "typecheck=$TYPECHECK" \
            "focused=$FOCUSED" \
            "regression=$REGRESSION" \
            "build=$BUILD" \
            > "$root/outcomes.txt"
          git status --short > "$root/worktree-status.txt"
          git diff --stat > "$root/worktree-diff-stat.txt"
          printf '%s\n' \
            'admissionFormat=axm-asoiaf-structured-observation-admission/1' \
            'outcomes=admit-reject-defer' \
            'namedReviewer=required' \
            'questionLane=required' \
            'identityEvidence=required' \
            'relevanceEvidence=required' \
            'rejectAndDeferPacketConstruction=false' \
            'admissionAuthority=admission-only' \
            'structuredAuthority=supporting-only-after-admission' \
            'graphEffect=none-before-compile' \
            'canonEffect=none-before-compile' \
            > "$root/admission-boundary.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" \
            > "$root/SHA256SUMS"

      - name: Upload admission qualification diagnostics
        if: always()
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-structured-observation-admission-v4-qualification
          path: asoiaf-structured-observation-admission-v4-qualification
          if-no-files-found: error
          retention-days: 30

      - name: Post bounded admission result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.candidate.outputs.final_sha }}
          ARTIFACT_ID: ${{ steps.upload.outputs['artifact-id'] }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs['artifact-digest'] }}
          PATCH: ${{ steps.patch.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          REGRESSION: ${{ steps.regression.outcome }}
          BUILD: ${{ steps.build.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FINAL_SHA:-}" ]; then
            gh pr comment 232 --repo "$GITHUB_REPOSITORY" --body \
              "Structured observation admission is qualified on candidate \`${FINAL_SHA}\`. Strict TypeScript, the focused admission and reconciliation suites, the complete Arc regression, and production build passed. Artifact \`${ARTIFACT_ID}\` has ZIP digest \`${ARTIFACT_DIGEST}\`. The permanent bridge now requires a fingerprinted named-review disposition of \`admit-to-review\`, \`reject-off-topic\`, or \`defer-insufficient-identity\`; only admitted observations may construct supporting claims, while rejected and deferred observations preserve acquisition custody with \`graphEffect=none\` and \`canonEffect=none\`."
          else
            gh pr comment 232 --repo "$GITHUB_REPOSITORY" --body \
              "Structured observation admission v4 did not issue a candidate. Patch \`${PATCH}\`, TypeScript \`${TYPECHECK}\`, focused suite \`${FOCUSED}\`, regression \`${REGRESSION}\`, build \`${BUILD}\`. Artifact \`${ARTIFACT_ID}\` has ZIP digest \`${ARTIFACT_DIGEST}\`. No admission authority or reconciliation change is claimed."
            exit 1
          fi