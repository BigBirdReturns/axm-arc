name: Apply and qualify ASOIAF structured public acquisition v4

on:
  push:
    branches:
      - feature/asoiaf-structured-public-acquisition-v1
    paths:
      - '.github/workflows/apply-and-qualify-asoiaf-structured-public-acquisition-v4.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: apply-and-qualify-asoiaf-structured-public-acquisition-v4
  cancel-in-progress: false

jobs:
  apply_and_qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out current structured-acquisition branch
        uses: actions/checkout@v4
        with:
          ref: feature/asoiaf-structured-public-acquisition-v1
          fetch-depth: 0
          show-progress: false

      - name: Apply complete acquisition and request-plan identity reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          carrier = Path(
              '.github/workflows/repair-and-seal-asoiaf-structured-public-acquisition.yml'
          )
          text = carrier.read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          if start_marker not in text or end_marker not in text:
              raise SystemExit('structured-acquisition v1 repair carrier is malformed')
          extracted = text.split(start_marker, 1)[1].split(end_marker, 1)[0]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in extracted.splitlines()
          )
          exec(compile(script, '<structured-acquisition-repair>', 'exec'), {})

          def ensure(path: str, old: str, new: str) -> None:
              target = Path(path)
              value = target.read_text()
              if new in value:
                  return
              count = value.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{path}: expected one v4 repair target, found {count}: {old[:160]!r}'
                  )
              target.write_text(value.replace(old, new, 1))

          adapter = 'tools/lib/asoiaf-structured-public-adapters.ts'
          acquisition = 'tools/lib/asoiaf-structured-public-acquisition.ts'
          ensure(
              adapter,
              '''  adapterId: AsoiafStructuredAdapterId;
  sourceId: AsoiafStructuredAdapterSourceId;
  method: "GET";''',
              '''  adapterId: AsoiafStructuredAdapterId;
  sourceId: AsoiafStructuredAdapterSourceId;
  requestId: string;
  method: "GET";''',
          )
          ensure(
              adapter,
              '''    adapterId: input.adapterId,
    sourceId,
    method: "GET" as const,''',
              '''    adapterId: input.adapterId,
    sourceId,
    requestId: input.requestId,
    method: "GET" as const,''',
          )
          ensure(
              acquisition,
              '''        completedAt: retrievedAt,
        outcome: "cache-hit",
        requestCount: 0,
        cacheHit: true,
        receiptUri: replay.receiptUri,''',
              '''        completedAt: retrievedAt,
        outcome: "cache-replay",
        requestCount: 0,
        cacheHit: true,
        receiptUri: replay.receiptUri,''',
          )
          PY
          git diff --check

      - name: Commit repair candidate before qualification
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-and-seal-asoiaf-structured-public-acquisition.yml
          rm -f .github/workflows/repair-and-seal-asoiaf-structured-public-acquisition-v2.yml
          rm -f .github/workflows/repair-and-seal-asoiaf-structured-public-acquisition-v3.yml
          rm -f .github/workflows/apply-and-qualify-asoiaf-structured-public-acquisition-v4.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply structured acquisition policy and receipt repair candidate'
          git push origin HEAD:feature/asoiaf-structured-public-acquisition-v1
          echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Strict TypeScript
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/typecheck.log"

      - name: Focused synthetic acquisition qualification
        id: focused
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test -- tests/narrative/canon/asoiaf-structured-public-acquisition.test.ts \
            2>&1 | tee "$RUNNER_TEMP/focused-tests.log"

      - name: Complete Arc regression
        id: regression
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/full-tests.log"

      - name: Production build
        id: build
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Publish failed qualification diagnostics
        if: steps.typecheck.outcome != 'success' || steps.focused.outcome != 'success' || steps.regression.outcome != 'success' || steps.build.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          REGRESSION: ${{ steps.regression.outcome }}
          BUILD: ${{ steps.build.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/failure-comment.md"
          {
            printf 'Structured acquisition repair candidate `%s` was applied to the parent branch, but qualification did not close.\n\n' "$CANDIDATE_SHA"
            printf 'TypeScript: `%s`; focused suite: `%s`; complete regression: `%s`; build: `%s`.\n\n' "$TYPECHECK" "$FOCUSED" "$REGRESSION" "$BUILD"
            for log in typecheck focused-tests full-tests build; do
              printf '### %s tail\n\n```text\n' "$log"
              tail -n 80 "$RUNNER_TEMP/$log.log" 2>/dev/null || true
              printf '\n```\n\n'
            done
            printf 'The candidate remains graph and canon inert. The next transaction is a bounded repair against these exact diagnostics.\n'
          } > "$body"
          gh pr comment 239 --repo BigBirdReturns/axm-arc --body-file "$body"
          exit 1

      - name: Build exact qualification artifact
        if: steps.typecheck.outcome == 'success' && steps.focused.outcome == 'success' && steps.regression.outcome == 'success' && steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          root='asoiaf-structured-public-acquisition-qualification'
          mkdir -p "$root"
          cp "$RUNNER_TEMP"/*.log "$root/"
          printf '%s\n' '${{ steps.candidate.outputs.candidate_sha }}' \
            > "$root/candidate-sha.txt"
          printf '%s\n' \
            'networkAcquisition=qualified-synthetic-runtime' \
            'liveNetworkInCI=false' \
            'requestIdentity=signed-plan-field' \
            'registeredEndpointsOnly=true' \
            'adapterSourceBinding=required' \
            'credentialBearingHeaders=false' \
            'robotsRequired=true' \
            'hostDelayFloorMilliseconds=1500' \
            'retryAfterHonored=true' \
            'crossOriginRedirects=false' \
            'responseSizeBounded=true' \
            'rawResponseDigest=raw-bytes-sha256' \
            'rawResponseRetained=false' \
            'normalizedRetention=rights-controlled' \
            'cacheReplay=zero-network-valid-receipt' \
            'batchPacer=shared' \
            'collectorAttemptParity=required' \
            'graphEffect=none' \
            'canonEffect=none' \
            > "$root/structured-acquisition-boundary.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" \
            > "$root/SHA256SUMS"

      - name: Upload exact qualification
        if: steps.typecheck.outcome == 'success' && steps.focused.outcome == 'success' && steps.regression.outcome == 'success' && steps.build.outcome == 'success'
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-structured-public-acquisition-qualification
          path: asoiaf-structured-public-acquisition-qualification
          if-no-files-found: error
          retention-days: 30

      - name: Post durable qualification receipt
        if: steps.typecheck.outcome == 'success' && steps.focused.outcome == 'success' && steps.regression.outcome == 'success' && steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/qualification-comment.md"
          cat > "$body" <<EOF
          Structured public acquisition qualification is closed on candidate \`${CANDIDATE_SHA}\`. Strict TypeScript, the focused synthetic acquisition suite, the complete Arc regression suite, and the production build passed. Qualification artifact \`${ARTIFACT_ID}\` has ZIP digest \`${ARTIFACT_DIGEST}\`.

          The qualified runtime binds durable request identity into the signed plan; confines every plan to its registered adapter, atlas source, HTTPS host and path, and credential-free header surface; evaluates robots policy; shares the source host-delay floor across robots, data, retries, redirects, and batch boundaries; honors \`Retry-After\`; refuses cross-origin or unregistered redirects; bounds response size and JSON media; binds the adapter to the raw response byte SHA-256; retains no raw response; preserves collector attempt parity; and issues a new valid zero-network receipt for cache replay. Acquisition remains \`graphEffect=none\` and \`canonEffect=none\`.

          The evidence tier is structured acquisition, normalization, and custody qualification over deterministic synthetic runtimes. It does not certify the truth of an ASOIAF proposition and does not permit endpoint availability or normalized reference data to bypass reviewed reconciliation. The control question remains whether every record can identify its signed plan, robots and pacing law, exact raw response, retained fields and rights rule, collector observation, candidate, receipt, and later reviewer transaction.
          EOF
          gh pr comment 239 --repo BigBirdReturns/axm-arc --body-file "$body"
