name: Apply Arc parity publication

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: arc-parity-publication
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'agent/local-first-product-parity'
    runs-on: ubuntu-latest
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: agent/local-first-product-parity
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Reconstruct authenticated parity patch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PAYLOAD_SHA256: b9b6865738c70f4778c654e98b5862fd35f843e9aef99c06afed54aac3c30d07
          EXPECTED_PATCH_SHA256: 01c1f7159e6f84b3730537d5ecf79f8789cf9dc8e3bcd1e44724e43c80288825
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/133/comments?per_page=100" \
            | jq -r 'sort_by(.id) | .[].body' \
            | tr -d '\r\n' \
            > "${RUNNER_TEMP}/arc-comments.b64"

          cat .github/parity/arc-payload.part00 "${RUNNER_TEMP}/arc-comments.b64" \
            > "${RUNNER_TEMP}/arc-parity.patch.gz.b64"

          test "$(sha256sum "${RUNNER_TEMP}/arc-parity.patch.gz.b64" | cut -d' ' -f1)" = "${EXPECTED_PAYLOAD_SHA256}"
          base64 --decode "${RUNNER_TEMP}/arc-parity.patch.gz.b64" > "${RUNNER_TEMP}/arc-parity.patch.gz"
          gzip -dc "${RUNNER_TEMP}/arc-parity.patch.gz" > "${RUNNER_TEMP}/arc-parity.patch"
          test "$(sha256sum "${RUNNER_TEMP}/arc-parity.patch" | cut -d' ' -f1)" = "${EXPECTED_PATCH_SHA256}"
          git apply --check "${RUNNER_TEMP}/arc-parity.patch"
          git apply --index "${RUNNER_TEMP}/arc-parity.patch"

      - name: Remove publication machinery
        run: |
          rm -f .github/parity/arc-payload.part00
          rmdir .github/parity 2>/dev/null || true
          rm -f .github/workflows/apply-arc-parity.yml
          git add -A

      - name: Install dependencies
        run: npm ci

      - name: Verify complete Arc product parity
        run: |
          find src tests \( -name "*.js" -o -name "*.js.map" -o -name "*.d.ts" \) -delete
          rm -f tsconfig.tsbuildinfo
          npm run typecheck
          npm test
          npm run build
          git diff --cached --check

      - name: Publish reviewed source commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete Arc local-first product parity"
          git push origin HEAD:agent/local-first-product-parity
