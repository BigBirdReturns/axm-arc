name: Apply Arc source-authority cleanup

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'agent/arc-source-authority-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/arc-source-authority-cleanup
          fetch-depth: 0
          show-progress: false
      - name: Reconstruct and apply the exact cleanup patch
        run: |
          set -euo pipefail
          if [ -f docs/WAKING_TOWER_DESIGN_AUTHORITY.md ]; then
            echo 'Arc source-authority cleanup is already applied.'
            exit 0
          fi
          cat .github/patches/arc-source-authority-cleanup.patch.gz.b64.part00 \
              .github/patches/arc-source-authority-cleanup.patch.gz.b64.part01 \
            | base64 -d | gzip -d > "$RUNNER_TEMP/arc-source-authority-cleanup.patch"
          echo '525baa3cad9e4359ffbbc9adb94edef87d81fdd794ac0f77620f2e073a705b23  '"$RUNNER_TEMP/arc-source-authority-cleanup.patch" | sha256sum -c -
          git apply --index --verbose "$RUNNER_TEMP/arc-source-authority-cleanup.patch"
          git diff --cached --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: |
          mkdir -p arc-cleanup-receipt
          set -o pipefail
          npm run typecheck | tee arc-cleanup-receipt/typecheck.log
      - name: Focused Workshop, Godscar, and authority contracts
        run: |
          set -o pipefail
          npm test -- tests/game/workshop.test.ts tests/game/godscar-guided.test.ts tests/game/product-parity.test.ts | tee arc-cleanup-receipt/focused-tests.log
      - name: Complete Arc suite
        run: |
          set -o pipefail
          npm test | tee arc-cleanup-receipt/vitest.log
      - name: Production build
        run: |
          set -o pipefail
          npm run build | tee arc-cleanup-receipt/build.log
      - name: Record validated source boundary
        run: |
          git rev-parse HEAD > arc-cleanup-receipt/validated-parent-sha.txt
          git diff --cached --stat > arc-cleanup-receipt/change-stat.txt
          printf '%s\n' 'Workshop selected-Arc custody' 'Nested Godscar guided-render safety' 'Waking Tower design authority' > arc-cleanup-receipt/boundaries.txt
      - name: Commit only after every validator passes
        run: |
          if git diff --cached --quiet; then
            echo 'Validated branch already contains the cleanup.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Close Arc source-authority gaps"
          git push origin HEAD:agent/arc-source-authority-cleanup
      - name: Upload validation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arc-source-authority-cleanup-receipt
          path: arc-cleanup-receipt
          if-no-files-found: warn
          retention-days: 7
