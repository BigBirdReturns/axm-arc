name: Apply bounded JSON integration

# One-shot publication workflow. It commits the permanent portable-run binding
# and removes every temporary diagnostic/publication workflow from the candidate.
on:
  push:
    branches: [release/import-canonicalization-hardening]
    paths:
      - '.github/workflows/apply-bounded-json.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-bounded-json-integration
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Route portable-run parsing through the bounded authority
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/engine/portable-run.ts')
          text = path.read_text()
          import_line = 'import { parseBoundedJson, validateBoundedJsonValue } from "./bounded-json.js";\n'
          if import_line not in text:
              anchor = 'import { orderedKeys } from "./determinism.js";\n'
              if text.count(anchor) != 1:
                  raise SystemExit(f'portable-run import anchor count: {text.count(anchor)}')
              text = text.replace(anchor, anchor + import_line)

          old = '''export function isPortableRunV3(input: unknown): boolean {
  try {
    const value = typeof input === "string" ? JSON.parse(input) as unknown : input;
    return !!value && typeof value === "object" && !Array.isArray(value)
      && (value as Record<string, unknown>)["format"] === PORTABLE_RUN_FORMAT;
  } catch {
    return false;
  }
}'''
          new = '''export function isPortableRunV3(input: unknown): boolean {
  try {
    const value = typeof input === "string" ? parseBoundedJson(input) : input;
    if (typeof input !== "string") validateBoundedJsonValue(input);
    return !!value && typeof value === "object" && !Array.isArray(value)
      && (value as Record<string, unknown>)["format"] === PORTABLE_RUN_FORMAT;
  } catch {
    return false;
  }
}'''
          if old in text:
              text = text.replace(old, new)
          elif new not in text:
              raise SystemExit('isPortableRunV3 no longer matches either accepted form')

          old = '''function parseInput(input: unknown): Record<string, unknown> {
  let value = input;
  if (typeof input === "string") {
    try {
      value = JSON.parse(input) as unknown;
    } catch {
      throw new Error("Portable run is not valid JSON.");
    }
  }
  return plainObject(value, "Portable run");
}'''
          new = '''function parseInput(input: unknown): Record<string, unknown> {
  let value = input;
  try {
    if (typeof input === "string") value = parseBoundedJson(input);
    else validateBoundedJsonValue(input);
  } catch (error) {
    throw new Error(`Portable run is not valid bounded JSON: ${error instanceof Error ? error.message : String(error)}`);
  }
  return plainObject(value, "Portable run");
}'''
          if old in text:
              text = text.replace(old, new)
          elif new not in text:
              raise SystemExit('parseInput no longer matches either accepted form')

          old = '''function serializedGameVersion(game: string): number {
  let raw: unknown;
  try {
    raw = JSON.parse(game) as unknown;
  } catch {
    throw new Error("Portable run engine.game is not valid JSON.");
  }
  const object = plainObject(raw, "Portable run serialized game");'''
          new = '''function serializedGameVersion(game: string): number {
  let raw: unknown;
  try {
    raw = parseBoundedJson(game, { maxBytes: 12 * 1024 * 1024 });
  } catch (error) {
    throw new Error(`Portable run engine.game is not valid bounded JSON: ${error instanceof Error ? error.message : String(error)}`);
  }
  const object = plainObject(raw, "Portable run serialized game");'''
          if old in text:
              text = text.replace(old, new)
          elif new not in text:
              raise SystemExit('serializedGameVersion no longer matches either accepted form')

          path.write_text(text)
          PY
          git diff --check
      - run: npm ci --no-audit --no-fund
      - name: Exact hardening qualification
        run: |
          set -euo pipefail
          npm run typecheck
          npm test -- tests/engine/bounded-json.test.ts tests/engine/bounded-json-fuzz.test.ts tests/engine/portable-run.test.ts tests/engine/save.test.ts tests/engine/cart1-conformance-vectors.test.ts
          npm test
          npm run build
          if git ls-files -- docs/game | grep -q .; then
            git restore --source=HEAD --staged --worktree -- docs/game
          fi
          git clean -fdx -- docs/game
          git diff --check
      - name: Publish permanent integration and remove carriers
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/engine/portable-run.ts tests/engine/cart1-conformance-vectors.test.ts
          git rm .github/workflows/apply-bounded-json.yml
          git rm .github/workflows/diagnose-import-hardening-tsc.yml
          git rm .github/workflows/tsc-diagnostic-pr.yml
          rm -rf diagnostics
          git add -A diagnostics 2>/dev/null || true
          git commit -m 'Bound all save and portable-run JSON before validation'
          git push origin HEAD:release/import-canonicalization-hardening
