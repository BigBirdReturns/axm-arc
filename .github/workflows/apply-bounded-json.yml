name: Apply bounded JSON integration

# One-shot publication workflow. Remove after the portable-run integration lands.
# Triggered again after the Arc reproducibility baseline merged.
on:
  push:
    branches: [release/import-canonicalization-hardening]
    paths:
      - '.github/workflows/apply-bounded-json.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-bounded-json-integration
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Route portable-run parsing through the bounded authority
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}: {old!r}')
              target.write_text(text.replace(old, new))

          replace_once(
              'src/engine/portable-run.ts',
              'import { orderedKeys } from "./determinism.js";\n',
              'import { orderedKeys } from "./determinism.js";\nimport { parseBoundedJson, validateBoundedJsonValue } from "./bounded-json.js";\n',
          )
          replace_once(
              'src/engine/portable-run.ts',
              '''export function isPortableRunV3(input: unknown): boolean {
  try {
    const value = typeof input === "string" ? JSON.parse(input) as unknown : input;
    return !!value && typeof value === "object" && !Array.isArray(value)
      && (value as Record<string, unknown>)["format"] === PORTABLE_RUN_FORMAT;
  } catch {
    return false;
  }
}''',
              '''export function isPortableRunV3(input: unknown): boolean {
  try {
    const value = typeof input === "string" ? parseBoundedJson(input) : input;
    if (typeof input !== "string") validateBoundedJsonValue(input);
    return !!value && typeof value === "object" && !Array.isArray(value)
      && (value as Record<string, unknown>)["format"] === PORTABLE_RUN_FORMAT;
  } catch {
    return false;
  }
}''',
          )
          replace_once(
              'src/engine/portable-run.ts',
              '''function parseInput(input: unknown): Record<string, unknown> {
  let value = input;
  if (typeof input === "string") {
    try {
      value = JSON.parse(input) as unknown;
    } catch {
      throw new Error("Portable run is not valid JSON.");
    }
  }
  return plainObject(value, "Portable run");
}''',
              '''function parseInput(input: unknown): Record<string, unknown> {
  let value = input;
  try {
    if (typeof input === "string") value = parseBoundedJson(input);
    else validateBoundedJsonValue(input);
  } catch (error) {
    throw new Error(`Portable run is not valid bounded JSON: ${error instanceof Error ? error.message : String(error)}`);
  }
  return plainObject(value, "Portable run");
}''',
          )
          replace_once(
              'src/engine/portable-run.ts',
              '''function serializedGameVersion(game: string): number {
  let raw: unknown;
  try {
    raw = JSON.parse(game) as unknown;
  } catch {
    throw new Error("Portable run engine.game is not valid JSON.");
  }
  const object = plainObject(raw, "Portable run serialized game");''',
              '''function serializedGameVersion(game: string): number {
  let raw: unknown;
  try {
    raw = parseBoundedJson(game, { maxBytes: 12 * 1024 * 1024 });
  } catch (error) {
    throw new Error(`Portable run engine.game is not valid bounded JSON: ${error instanceof Error ? error.message : String(error)}`);
  }
  const object = plainObject(raw, "Portable run serialized game");''',
          )
          PY
          git diff --check
      - run: npm ci --no-audit --no-fund
      - name: Exact hardening qualification
        run: |
          set -euo pipefail
          npm run typecheck
          npm test -- tests/engine/bounded-json.test.ts tests/engine/portable-run.test.ts tests/engine/save.test.ts
          npm test
          npm run build
          git restore --source=HEAD --staged --worktree -- docs/game 2>/dev/null || true
          git clean -fdx -- docs/game 2>/dev/null || true
          git diff --check
      - name: Publish permanent integration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/engine/portable-run.ts
          git commit -m 'Bound all portable-run JSON inputs before validation'
          git push origin HEAD:release/import-canonicalization-hardening
