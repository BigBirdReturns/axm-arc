name: Apply packet-harvest content

on:
  push:
    branches:
      - feature/burn-protocol-packet-set-harvest-v1
    paths:
      - '.packet-harvest/**'
      - '.github/workflows/apply-packet-harvest-content.yml'

permissions:
  contents: write

concurrency:
  group: apply-packet-harvest-content
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out bootstrap commit
        uses: actions/checkout@v4
        with:
          ref: feature/burn-protocol-packet-set-harvest-v1
          fetch-depth: 0

      - name: Materialize reviewed content and remove bootstrap carrier
        shell: bash
        run: |
          set -euo pipefail
          cat .packet-harvest/payload.* | base64 -d > "$RUNNER_TEMP/packet-harvest-content.tgz"
          tar -xzf "$RUNNER_TEMP/packet-harvest-content.tgz"
          rm -rf .packet-harvest
          rm .github/workflows/apply-packet-harvest-content.yml

      - name: Commit exact materialized tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Discover approved Burn packet sets in autonomous custody'
          git push origin HEAD:feature/burn-protocol-packet-set-harvest-v1
