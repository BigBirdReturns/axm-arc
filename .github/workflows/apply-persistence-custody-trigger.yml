name: Finalize persistence custody

# Registered and explicitly re-triggered after the complete application script landed.
on:
  push:
    branches: [release/persistence-custody-v1]
    paths:
      - '.github/workflows/apply-persistence-custody-trigger.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-persistence-custody
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact persistence bindings
        run: |
          set -euo pipefail
          python tools/apply-persistence-custody-v1.py
          git diff --check
      - run: npm ci --no-audit --no-fund
      - name: Qualify the complete persistence candidate
        run: |
          set -euo pipefail
          npm run typecheck
          npm test -- tests/game/persistence-custody-v1.test.ts tests/game/raid-night.test.ts tests/game/ledger.test.ts tests/i18n/i18n.test.ts
          npm test
          npm run build
          if git ls-files -- docs/game | grep -q .; then
            git restore --source=HEAD --staged --worktree -- docs/game
          fi
          git clean -fdx -- docs/game
          git diff --check
      - name: Publish permanent candidate and remove carriers
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/lib/ledger.ts src/game/lib/raid-night.ts src/game/components/RaidNightScreen.tsx src/i18n/messages.ts
          git rm .github/workflows/apply-persistence-custody-trigger.yml
          git rm .github/workflows/apply-persistence-custody-v1.yml
          git rm tools/apply-persistence-custody-v1.py
          git commit -m 'Surface and recover every load-bearing browser write'
          git push origin HEAD:release/persistence-custody-v1
