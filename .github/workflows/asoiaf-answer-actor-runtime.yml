name: ASOIAF actor runtime and durable mailbox

on:
  push:
    branches: [feature/asoiaf-answer-actor-runtime-v1]
    paths: &runtime_paths
      - '.github/workflows/asoiaf-answer-actor-runtime.yml'
      - 'docs/ASOIAF_ANSWER_ACTOR_RUNTIME.md'
      - 'package.json'
      - 'tests/fixtures/emit-asoiaf-answer-actor-runtime-input.ts'
      - 'tests/narrative/canon/asoiaf-answer-actor-runtime.test.ts'
      - 'tools/asoiaf-answer-actor-runtime.ts'
      - 'tools/lib/asoiaf-answer-actor-runtime.ts'
  pull_request:
    branches: [feature/asoiaf-answer-credential-provider-host-integrated-v1]
    paths: *runtime_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asoiaf-answer-actor-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    if: github.repository == 'BigBirdReturns/axm-arc'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      BASE_SHA: 4e514b30972e006373714f73804da199025a338d
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Bind exact ancestry, floor, and seven surfaces
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          test "$(git show -s --format=%P HEAD)" = "$BASE_SHA"
          test -z "$(git status --porcelain)"
          printf '%s\n' "$candidate" > "$RUNNER_TEMP/candidate-sha.txt"
          printf '%s\n' "$BASE_SHA" > "$RUNNER_TEMP/base-sha.txt"
          echo "CANDIDATE_SHA=$candidate" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/expected.txt" <<'PATHS'
          .github/workflows/asoiaf-answer-actor-runtime.yml
          docs/ASOIAF_ANSWER_ACTOR_RUNTIME.md
          package.json
          tests/fixtures/emit-asoiaf-answer-actor-runtime-input.ts
          tests/narrative/canon/asoiaf-answer-actor-runtime.test.ts
          tools/asoiaf-answer-actor-runtime.ts
          tools/lib/asoiaf-answer-actor-runtime.ts
          PATHS
          sed -i 's/^          //' "$RUNNER_TEMP/expected.txt"
          sort -o "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/expected.txt"
          git diff --name-only "$BASE_SHA" "$candidate" | sort > "$RUNNER_TEMP/actual.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"
          git diff --check "$BASE_SHA" "$candidate"
          for path in \
            tools/lib/asoiaf-answer-desk-supervised-delivery.ts \
            tools/lib/asoiaf-answer-desk-transport-enrollment.ts \
            tools/lib/asoiaf-answer-credential-deployment.ts \
            tools/lib/asoiaf-answer-credential-broker.ts \
            tools/lib/asoiaf-answer-credential-provider-host.ts; do
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$BASE_SHA:$path")"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and verify operator
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run --silent asoiaf:answer-actor-runtime -- help | tee "$RUNNER_TEMP/help.txt"
          grep -q 'ASOIAF actor runtime and durable mailbox' "$RUNNER_TEMP/help.txt"
          for command in slot accept prepare result prepare-return record-return retire status verify paths; do
            grep -q "$command" "$RUNNER_TEMP/help.txt"
          done

      - name: Strict TypeScript
        id: typecheck
        shell: bash
        run: |
          set -euo pipefail
          find src tests tools \( -name '*.js' -o -name '*.js.map' -o -name '*.d.ts' \) -delete
          rm -f tsconfig.tsbuildinfo
          npm run typecheck | tee "$RUNNER_TEMP/typecheck.log"

      - name: Focused runtime seam
        id: focused
        shell: bash
        run: |
          set -euo pipefail
          npm test -- \
            tests/narrative/canon/asoiaf-answer-actor-runtime.test.ts \
            tests/narrative/canon/asoiaf-answer-credential-provider-host.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-supervised-delivery.test.ts \
            | tee "$RUNNER_TEMP/focused-tests.log"

      - name: Complete certificate-bound lifecycle
        id: lifecycle
        shell: bash
        run: |
          set -euo pipefail
          receipts="$RUNNER_TEMP/receipts"
          estate="$RUNNER_TEMP/estate"
          node node_modules/vite-node/vite-node.mjs \
            tests/fixtures/emit-asoiaf-answer-desk-supervised-delivery-input.ts \
            --run-qualification "$receipts/parent-supervised-delivery" "$estate" \
            | tee "$RUNNER_TEMP/parent-delivery.log"
          node node_modules/vite-node/vite-node.mjs \
            tests/fixtures/emit-asoiaf-answer-credential-provider-host-input.ts \
            "$receipts/parent-provider-host" "$estate" \
            | tee "$RUNNER_TEMP/parent-provider.log"
          node node_modules/vite-node/vite-node.mjs \
            tests/fixtures/emit-asoiaf-answer-actor-runtime-input.ts \
            "$receipts" "$estate" --parents-ready \
            | tee "$RUNNER_TEMP/lifecycle.log"
          jq -e '.ok and .counts == {errors:0,warnings:0,notices:1}' "$receipts/runtime-verification.json" > /dev/null
          jq -e '.runtimeCounts == {slots:3,acceptances:2,executionIntents:2,results:2,returnIntents:2,returnReceipts:1,retirements:2,stranded:1,stateEntries:2}' "$receipts/runtime-verification.json" > /dev/null
          jq -e '.state.entries | map(.status) | sort == ["returned","stranded"]' "$receipts/runtime-status.json" > /dev/null
          jq -e '.stranded[0].successorMayInherit == false' "$receipts/close-emergency-retirement-first.json" > /dev/null
          jq -e '.message | contains("successor or alternate runtime slot")' "$receipts/successor-return-refusal.json" > /dev/null
          jq -e '.message | contains("scheduled runtime slot retirement requires")' "$receipts/close-scheduled-retirement-refusal.json" > /dev/null
          test -z "$(git status --porcelain)"

      - name: Complete Arc regression
        id: regression
        shell: bash
        run: |
          set -euo pipefail
          find src tests tools \( -name '*.js' -o -name '*.js.map' -o -name '*.d.ts' \) -delete
          rm -f tsconfig.tsbuildinfo
          npm test | tee "$RUNNER_TEMP/full-tests.log"

      - name: Production build
        id: build
        shell: bash
        run: |
          set -euo pipefail
          npm run build | tee "$RUNNER_TEMP/build.log"
          git ls-files --others --exclude-standard -z | while IFS= read -r -d '' generated; do
            case "$generated" in *.js|*.js.map|*.d.ts) rm -f "$generated" ;; esac
          done
          test -z "$(git status --porcelain)"

      - name: Retain qualification custody
        if: always()
        id: retain
        env:
          TYPECHECK: ${{ steps.typecheck.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          LIFECYCLE: ${{ steps.lifecycle.outcome }}
          REGRESSION: ${{ steps.regression.outcome }}
          BUILD: ${{ steps.build.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          root='asoiaf-answer-actor-runtime-qualification'
          receipts="$RUNNER_TEMP/receipts"
          estate="$RUNNER_TEMP/estate"
          mkdir -p "$root/logs" "$root/receipts"
          for file in help.txt typecheck.log focused-tests.log parent-delivery.log parent-provider.log lifecycle.log full-tests.log build.log; do
            test -f "$RUNNER_TEMP/$file" && cp "$RUNNER_TEMP/$file" "$root/logs/" || true
          done
          if test -d "$receipts"; then
            find "$receipts" -maxdepth 1 -type f \( \
              -name '*-first.json' -o -name '*-replay.json' -o -name '*-refusal.json' -o \
              -name 'runtime-status.json' -o -name 'runtime-verification.json' -o \
              -name 'runtime-paths.json' -o -name 'expected.json' \) \
              -exec cp {} "$root/receipts/" \;
          fi
          test -d "$estate/answer-actor-runtime" && cp -R "$estate/answer-actor-runtime" "$root/estate" || true
          cp "$RUNNER_TEMP/candidate-sha.txt" "$root/candidate-sha.txt"
          cp "$RUNNER_TEMP/base-sha.txt" "$root/base-sha.txt"
          cp "$RUNNER_TEMP/actual.txt" "$root/permanent-paths.txt"
          sha256sum \
            .github/workflows/asoiaf-answer-actor-runtime.yml \
            docs/ASOIAF_ANSWER_ACTOR_RUNTIME.md package.json \
            tests/fixtures/emit-asoiaf-answer-actor-runtime-input.ts \
            tests/narrative/canon/asoiaf-answer-actor-runtime.test.ts \
            tools/asoiaf-answer-actor-runtime.ts tools/lib/asoiaf-answer-actor-runtime.ts \
            > "$root/permanent-surface-sha256s.txt"
          printf '{"typecheck":"%s","focused":"%s","lifecycle":"%s","regression":"%s","build":"%s"}\n' \
            "$TYPECHECK" "$FOCUSED" "$LIFECYCLE" "$REGRESSION" "$BUILD" > "$root/outcomes.json"
          printf '%s\n' \
            'evidenceTier=exact-head-certificate-bound-actor-runtime' \
            'taskInputCustody=digest-only' 'taskOutputCustody=digest-only' \
            'durableReturnIntent=true' 'successorMayReturnPredecessorWork=false' \
            'scheduledRetirementRequiresReceipts=true' 'emergencyStrandingSuccessorMayInherit=false' \
            'certificateRetained=false' 'privateKeyRetained=false' \
            'rawProviderSelectorRetained=false' 'providerSecretRetained=false' \
            'schedulingAuthority=none' 'settlementAuthority=none' 'taskAuthority=none' \
            'graphEffect=none' 'canonEffect=none' 'answerEffect=none' \
            > "$root/qualification-boundary.txt"
          if find "$root" -type f \( -iname '*.key' -o -iname '*.crt' -o -iname '*.cer' -o \
            -iname '*.pem' -o -iname '*.csr' -o -iname '*.p12' -o -iname '*.pfx' \) \
            -print -quit | grep -q .; then exit 1; fi
          find "$root" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum \
            | sed "s#  $root/#  #" > "$root/SHA256SUMS"
          (cd "$root" && sha256sum -c SHA256SUMS)

      - name: Upload qualification
        if: always()
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-answer-actor-runtime-qualification
          path: asoiaf-answer-actor-runtime-qualification
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish summary
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        shell: bash
        run: |
          {
            echo '## ASOIAF actor runtime and durable mailbox qualification'
            echo
            echo "- Candidate: \`$CANDIDATE_SHA\`"
            echo "- Parent: \`$BASE_SHA\`"
            echo "- Artifact: \`${ARTIFACT_ID:-not-issued}\`"
            echo "- Artifact digest: \`${ARTIFACT_DIGEST:-not-issued}\`"
            echo '- Slots: three; assignments: two; exact return acknowledgements: one'
            echo '- Emergency-stranded assignments: one; successor inheritance: forbidden'
            echo '- Raw input, output, certificates, private keys, selectors, and provider secrets: not retained'
          } >> "$GITHUB_STEP_SUMMARY"
