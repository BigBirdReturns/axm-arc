name: ASOIAF credential broker loopback mutual TLS

on:
  push:
    branches:
      - feature/asoiaf-answer-credential-broker-loopback-tls-v1
    paths:
      - '.github/workflows/asoiaf-answer-credential-broker-loopback-tls.yml'
      - 'docs/ASOIAF_ANSWER_CREDENTIAL_BROKER_LOOPBACK_TLS.md'
      - 'package.json'
      - 'tests/fixtures/emit-asoiaf-answer-credential-broker-loopback-tls-input.ts'
      - 'tests/narrative/canon/asoiaf-answer-credential-broker-loopback-tls.test.ts'
      - 'tools/asoiaf-answer-credential-broker-loopback-tls.ts'
      - 'tools/lib/asoiaf-answer-credential-broker-loopback-tls.ts'
  pull_request:
    branches:
      - feature/asoiaf-answer-credential-broker-service-v1
    paths:
      - '.github/workflows/asoiaf-answer-credential-broker-loopback-tls.yml'
      - 'docs/ASOIAF_ANSWER_CREDENTIAL_BROKER_LOOPBACK_TLS.md'
      - 'package.json'
      - 'tests/fixtures/emit-asoiaf-answer-credential-broker-loopback-tls-input.ts'
      - 'tests/narrative/canon/asoiaf-answer-credential-broker-loopback-tls.test.ts'
      - 'tools/asoiaf-answer-credential-broker-loopback-tls.ts'
      - 'tools/lib/asoiaf-answer-credential-broker-loopback-tls.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asoiaf-answer-credential-broker-loopback-tls-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-qualify:
    if: github.repository == 'BigBirdReturns/axm-arc'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out exact loopback TLS candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          show-progress: false

      - name: Bind exact Linux candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          echo "CANDIDATE_SHA=$candidate_sha" >> "$GITHUB_ENV"
          printf '%s\n' "$candidate_sha"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify permanent operator registration
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent asoiaf:answer-credential-broker-loopback-tls -- help \
            | tee "$RUNNER_TEMP/listener-help.txt"
          grep -q 'ASOIAF credential broker loopback mutual-TLS listener' "$RUNNER_TEMP/listener-help.txt"
          for command in policy prepare serve invoke probe status verify paths; do
            grep -q "$command" "$RUNNER_TEMP/listener-help.txt"
          done

      - name: Strict TypeScript
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck | tee "$RUNNER_TEMP/typecheck.log"

      - name: Focused listener, service, provider, broker, deployment, transport, and answer-stack qualification
        shell: bash
        run: |
          set -euo pipefail
          npm test -- \
            tests/narrative/canon/asoiaf-answer-credential-broker-loopback-tls.test.ts \
            tests/narrative/canon/asoiaf-answer-credential-broker-service.test.ts \
            tests/narrative/canon/asoiaf-answer-credential-provider-host.test.ts \
            tests/narrative/canon/asoiaf-answer-credential-broker.test.ts \
            tests/narrative/canon/asoiaf-answer-credential-deployment.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-transport-enrollment.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-transport-operations.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-transport.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-exchange.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-worker.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-estate.test.ts \
            tests/narrative/canon/asoiaf-answer-work-lease.test.ts \
            tests/narrative/canon/asoiaf-answer-work-order.test.ts \
            tests/narrative/canon/asoiaf-reviewed-answer-packet.test.ts \
            tests/narrative/canon/asoiaf-research-question-dossier.test.ts \
            tests/narrative/canon/asoiaf-external-reconciliation-packets.test.ts \
            | tee "$RUNNER_TEMP/focused-tests.log"

      - name: Exercise real loopback mutual-TLS lifecycle
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/loopback-tls-fixture"
          estate="$RUNNER_TEMP/loopback-tls-estate"
          material="$RUNNER_TEMP/loopback-tls-material"
          mkdir -p "$fixture" "$material"
          npx vite-node tests/fixtures/emit-asoiaf-answer-credential-broker-loopback-tls-input.ts \
            "$fixture" "$estate" "$material" \
            | tee "$RUNNER_TEMP/fixture-emission.json"

          rm -rf "$material"

          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          const temp = process.env.RUNNER_TEMP;
          const fixture = path.join(temp, 'loopback-tls-fixture');
          const estate = path.join(temp, 'loopback-tls-estate');
          const read = (name) => JSON.parse(fs.readFileSync(path.join(fixture, name), 'utf8'));
          const expected = read('expected.json');
          const listenerVerification = read('listener-verification.json');
          const serviceVerification = read('service-verification.json');
          const providerVerification = read('provider-verification.json');
          const brokerVerification = read('broker-verification.json');
          const operationsVerification = read('transport-operations-verification.json');
          const availability = read('listener-availability.json');
          const unauthorized = read('unauthorized-client-response.json');
          const first = read('loopback-possession-execute-first-response.json');
          const replay = read('loopback-possession-execute-replay-response.json');
          const listenerPaths = read('listener-paths.json');

          assert.deepEqual(expected.listenerCounts, {
            policies: 1,
            sessions: 3,
            ready: 3,
            stopped: 2,
            recovered: 1,
            activeSessions: 0,
            preparedSessions: 0,
          });
          assert.deepEqual(expected.serviceCounts, {
            policies: 1,
            requests: 2,
            receipts: 2,
            pendingRequests: 0,
          });
          assert.deepEqual(expected.providerCounts, {
            profiles: 1,
            invocations: 1,
            results: 1,
          });
          assert.deepEqual(expected.brokerCounts, {
            policies: 1,
            bindings: 1,
            invocations: 1,
            proofs: 1,
            transportResults: 0,
          });
          assert.deepEqual(expected.transportOperationsCounts, {
            certificates: 2,
            endpoints: 1,
            availability: 1,
          });
          for (const verification of [
            listenerVerification,
            serviceVerification,
            providerVerification,
            brokerVerification,
            operationsVerification,
          ]) {
            assert.equal(verification.ok, true);
            assert.deepEqual(
              (verification.findings ?? []).filter((entry) => entry.severity === 'error'),
              [],
            );
          }
          assert.equal(availability.observation.outcome, 'available');
          assert.equal(unauthorized.ok, false);
          assert.equal(expected.unauthorizedClientRejected, true);
          assert.equal(first.ok, true);
          assert.equal(first.result.requestReplayed, false);
          assert.equal(first.result.receiptReplayed, false);
          assert.equal(replay.ok, true);
          assert.equal(replay.result.requestReplayed, true);
          assert.equal(replay.result.receiptReplayed, true);
          assert.equal(first.result.request.requestId, replay.result.request.requestId);
          assert.equal(first.result.receipt.receiptId, replay.result.receipt.receiptId);
          assert.equal(expected.executeReplay.requestReplayed, true);
          assert.equal(expected.executeReplay.receiptReplayed, true);
          assert.equal(fs.existsSync(path.join(temp, 'loopback-tls-material')), false);
          assert.equal(fs.existsSync(listenerPaths.lock), false);
          assert.equal(fs.existsSync(path.join(estate, '.transaction-lock')), false);
          NODE

      - name: Complete Arc regression
        shell: bash
        run: |
          set -euo pipefail
          npm test | tee "$RUNNER_TEMP/full-tests.log"

      - name: Production build
        shell: bash
        run: |
          set -euo pipefail
          npm run build | tee "$RUNNER_TEMP/build.log"

      - name: Assemble Linux loopback TLS qualification custody
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/loopback-tls-linux-qualification"
          fixture="$RUNNER_TEMP/loopback-tls-fixture"
          mkdir -p "$root/logs" "$root/fixture"
          for file in listener-help.txt typecheck.log focused-tests.log full-tests.log build.log fixture-emission.json; do
            cp "$RUNNER_TEMP/$file" "$root/logs/" 2>/dev/null || true
          done
          for file in \
            expected.json \
            listener-policy-first.json \
            listener-policy-replay.json \
            server-certificate-admission.json \
            client-certificate-admission.json \
            endpoint-lease.json \
            listener-session-one-first.json \
            listener-session-one-replay.json \
            listener-one-ready.json \
            listener-one-summary.json \
            listener-availability.json \
            unauthorized-client-response.json \
            loopback-possession-prepare-request.json \
            loopback-possession-prepare-response.json \
            loopback-possession-execute-request.json \
            loopback-possession-execute-first-response.json \
            loopback-possession-execute-replay-response.json \
            possession-broker-admission.json \
            listener-session-two-first.json \
            listener-session-two-replay.json \
            listener-two-ready.json \
            listener-two-pre-crash-summary.json \
            listener-session-three-first.json \
            listener-session-three-replay.json \
            listener-three-ready.json \
            listener-three-summary.json \
            listener-status.json \
            listener-verification.json \
            listener-paths.json \
            service-status.json \
            service-verification.json \
            provider-status.json \
            provider-verification.json \
            broker-status.json \
            broker-verification.json \
            transport-operations-status.json \
            transport-operations-verification.json; do
            cp "$fixture/$file" "$root/fixture/" 2>/dev/null || true
          done
          cp -R "$RUNNER_TEMP/loopback-tls-estate" "$root/estate" 2>/dev/null || true
          printf '%s\n' "$CANDIDATE_SHA" > "$root/candidate-sha.txt"
          printf '%s\n' \
            'platform=linux-loopback-mutual-tls' \
            'listenerPolicies=1' \
            'listenerSessions=3' \
            'readyReceipts=3' \
            'stoppedReceipts=2' \
            'recoveredReceipts=1' \
            'signedServiceRequests=2' \
            'terminalServiceReceipts=2' \
            'exactReplay=true' \
            'wrongClientRejected=true' \
            'pinnedAvailability=true' \
            'certificateRetained=false' \
            'privateKeyRetained=false' \
            'rawRequestBodyRetained=false' \
            'rawResponseBodyRetained=false' \
            'taskAuthority=none' \
            'graphEffect=none' \
            'canonEffect=none' \
            'answerEffect=none' \
            > "$root/qualification-boundary.txt"
          if find "$root" -type f \
            \( -iname '*.key' -o -iname '*.crt' -o -iname '*.pem' -o -iname '*.csr' -o -iname '*.p12' -o -iname '*.pfx' \) \
            | grep -q .; then
            echo 'Linux loopback TLS artifact contains a forbidden credential path' >&2
            exit 1
          fi
          patterns="$RUNNER_TEMP/loopback-tls-linux-secret-patterns.txt"
          cat > "$patterns" <<'PATTERNS'
          BEGIN (RSA |EC |ENCRYPTED )?PRIVATE KEY
          BEGIN CERTIFICATE( REQUEST)?
          "(clientPrivateKeyPem|credentialPrivateKeyPem|deviceAgentPrivateKeyPem|serverPrivateKey|clientPrivateKey|credentialCertificateThumbprint|deviceAgentCertificateThumbprint|requestBodyBase64|responseBodyBase64|payload)"[[:space:]]*:
          provider(Pin|Password|Token|Secret|Session)[[:space:]]*["=:]
          pkcs11:[^[:space:]"']+
          PATTERNS
          if grep -RIEq \
            --exclude='full-tests.log' \
            --exclude='focused-tests.log' \
            --exclude='build.log' \
            --exclude='typecheck.log' \
            -f "$patterns" \
            "$root"; then
            echo 'Linux loopback TLS artifact contains forbidden credential, payload, or raw-body content' >&2
            exit 1
          fi
          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" > "$root/SHA256SUMS"
          (cd "$root" && sha256sum -c SHA256SUMS)

      - name: Upload Linux loopback TLS qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-answer-credential-broker-loopback-tls-linux
          path: ${{ runner.temp }}/loopback-tls-linux-qualification
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  windows-qualify:
    if: github.repository == 'BigBirdReturns/axm-arc'
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - name: Check out exact loopback TLS candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          show-progress: false

      - name: Bind exact Windows candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = (git rev-parse HEAD).Trim()
          if (git status --porcelain) { throw 'candidate worktree is not clean' }
          "CANDIDATE_SHA=$candidate" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify OpenSSL availability
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $openssl = Get-Command openssl -ErrorAction Stop
          & $openssl.Source version | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'windows-openssl.txt')

      - name: Strict TypeScript on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run typecheck | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'windows-typecheck.log')

      - name: Exercise loopback mutual-TLS lifecycle on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm test -- tests/narrative/canon/asoiaf-answer-credential-broker-loopback-tls.test.ts `
            | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'windows-focused-tests.log')

      - name: Assemble Windows public qualification receipt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'loopback-tls-windows-qualification'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP 'windows-openssl.txt') $root
          Copy-Item (Join-Path $env:RUNNER_TEMP 'windows-typecheck.log') $root
          Copy-Item (Join-Path $env:RUNNER_TEMP 'windows-focused-tests.log') $root
          Set-Content -LiteralPath (Join-Path $root 'candidate-sha.txt') -Value $env:CANDIDATE_SHA -Encoding utf8
          @(
            'platform=windows-2025-loopback-mutual-tls'
            'opensslAvailable=true'
            'strictTypeScript=passed'
            'focusedLifecycle=passed'
            'certificateRetained=false'
            'privateKeyRetained=false'
            'rawRequestBodyRetained=false'
            'rawResponseBodyRetained=false'
            'taskAuthority=none'
            'graphEffect=none'
            'canonEffect=none'
            'answerEffect=none'
          ) | Set-Content -LiteralPath (Join-Path $root 'qualification-boundary.txt') -Encoding utf8
          $forbidden = Get-ChildItem -Recurse -File $root | Where-Object {
            $_.Extension -match '^\.(key|crt|pem|csr|p12|pfx)$'
          }
          if ($forbidden) { throw 'Windows qualification retained a forbidden credential path' }
          $files = Get-ChildItem -Recurse -File $root | Where-Object { $_.Name -ne 'SHA256SUMS' } | Sort-Object FullName
          $lines = foreach ($file in $files) {
            $relative = [IO.Path]::GetRelativePath($root, $file.FullName).Replace('\', '/')
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            "$hash  $relative"
          }
          $lines | Set-Content -LiteralPath (Join-Path $root 'SHA256SUMS') -Encoding utf8

      - name: Upload Windows loopback TLS qualification
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-answer-credential-broker-loopback-tls-windows
          path: ${{ runner.temp }}/loopback-tls-windows-qualification
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  combine:
    if: always() && github.repository == 'BigBirdReturns/axm-arc'
    needs:
      - linux-qualify
      - windows-qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require successful platform qualifications
        shell: bash
        run: |
          set -euo pipefail
          test '${{ needs.linux-qualify.result }}' = 'success'
          test '${{ needs.windows-qualify.result }}' = 'success'

      - name: Download platform receipts
        uses: actions/download-artifact@v4
        with:
          pattern: asoiaf-answer-credential-broker-loopback-tls-*
          path: ${{ runner.temp }}/platforms

      - name: Verify and combine exact platform custody
        shell: bash
        run: |
          set -euo pipefail
          linux="$RUNNER_TEMP/platforms/asoiaf-answer-credential-broker-loopback-tls-linux"
          windows="$RUNNER_TEMP/platforms/asoiaf-answer-credential-broker-loopback-tls-windows"
          test -d "$linux"
          test -d "$windows"
          (cd "$linux" && sha256sum -c SHA256SUMS)
          (cd "$windows" && sha256sum -c SHA256SUMS)
          linux_sha="$(tr -d '\r\n' < "$linux/candidate-sha.txt")"
          windows_sha="$(tr -d '\r\n' < "$windows/candidate-sha.txt")"
          test -n "$linux_sha"
          test "$linux_sha" = "$windows_sha"

          root="$RUNNER_TEMP/asoiaf-answer-credential-broker-loopback-tls-qualification"
          mkdir -p "$root/linux" "$root/windows"
          cp -R "$linux"/. "$root/linux/"
          cp -R "$windows"/. "$root/windows/"
          printf '%s\n' "$linux_sha" > "$root/candidate-sha.txt"
          printf '%s\n' \
            'linuxQualification=passed' \
            'windowsQualification=passed' \
            'candidateParity=passed' \
            'mutualTlsRequired=true' \
            'literalLoopbackOnly=true' \
            'wrongClientRejected=true' \
            'exactReplay=true' \
            'restartRecovery=bind-before-recover' \
            'certificateRetained=false' \
            'privateKeyRetained=false' \
            'rawRequestBodyRetained=false' \
            'rawResponseBodyRetained=false' \
            'taskAuthority=none' \
            'graphEffect=none' \
            'canonEffect=none' \
            'answerEffect=none' \
            > "$root/qualification-boundary.txt"
          if find "$root" -type f \
            \( -iname '*.key' -o -iname '*.crt' -o -iname '*.pem' -o -iname '*.csr' -o -iname '*.p12' -o -iname '*.pfx' \) \
            | grep -q .; then
            echo 'Combined loopback TLS artifact contains a forbidden credential path' >&2
            exit 1
          fi
          patterns="$RUNNER_TEMP/loopback-tls-combined-secret-patterns.txt"
          cat > "$patterns" <<'PATTERNS'
          BEGIN (RSA |EC |ENCRYPTED )?PRIVATE KEY
          BEGIN CERTIFICATE( REQUEST)?
          "(clientPrivateKeyPem|credentialPrivateKeyPem|deviceAgentPrivateKeyPem|serverPrivateKey|clientPrivateKey|credentialCertificateThumbprint|deviceAgentCertificateThumbprint|requestBodyBase64|responseBodyBase64|payload)"[[:space:]]*:
          provider(Pin|Password|Token|Secret|Session)[[:space:]]*["=:]
          pkcs11:[^[:space:]"']+
          PATTERNS
          if grep -RIEq \
            --exclude='full-tests.log' \
            --exclude='focused-tests.log' \
            --exclude='windows-focused-tests.log' \
            --exclude='build.log' \
            --exclude='typecheck.log' \
            --exclude='windows-typecheck.log' \
            -f "$patterns" \
            "$root"; then
            echo 'Combined loopback TLS artifact contains forbidden credential, payload, or raw-body content' >&2
            exit 1
          fi
          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" > "$root/SHA256SUMS"
          (cd "$root" && sha256sum -c SHA256SUMS)

      - name: Upload combined loopback TLS qualification
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-answer-credential-broker-loopback-tls-qualification
          path: ${{ runner.temp }}/asoiaf-answer-credential-broker-loopback-tls-qualification
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish exact qualification summary
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs['artifact-id'] }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs['artifact-digest'] }}
        run: |
          set -euo pipefail
          {
            echo '## ASOIAF credential broker loopback mutual-TLS qualification'
            echo
            echo "- Candidate: \`$(cat "$RUNNER_TEMP/asoiaf-answer-credential-broker-loopback-tls-qualification/candidate-sha.txt")\`"
            echo "- Artifact: \`${ARTIFACT_ID:-not-issued}\`"
            echo "- Artifact digest: \`${ARTIFACT_DIGEST:-not-issued}\`"
            echo '- Linux and Windows lifecycle qualification passed on the same exact candidate.'
            echo '- Listener policy, mutual-TLS peer custody, exact replay, availability, and bind-before-recover restart custody passed.'
          } >> "$GITHUB_STEP_SUMMARY"
