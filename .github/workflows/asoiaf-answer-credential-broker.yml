name: ASOIAF integrated answer credential broker
# Exact-head qualification for the broker lifted above enrolled supervised delivery.

on:
  push:
    branches:
      - feature/asoiaf-answer-credential-broker-integrated-v1
    paths:
      - '.github/workflows/asoiaf-answer-credential-broker.yml'
      - 'docs/ASOIAF_ANSWER_CREDENTIAL_BROKER.md'
      - 'package.json'
      - 'tests/fixtures/emit-asoiaf-answer-credential-broker-input.ts'
      - 'tests/narrative/canon/asoiaf-answer-credential-broker.test.ts'
      - 'tools/asoiaf-answer-credential-broker.ts'
      - 'tools/lib/asoiaf-answer-credential-broker.ts'
  pull_request:
    branches:
      - feature/asoiaf-answer-credential-deployment-integrated-v1
    paths:
      - '.github/workflows/asoiaf-answer-credential-broker.yml'
      - 'docs/ASOIAF_ANSWER_CREDENTIAL_BROKER.md'
      - 'package.json'
      - 'tests/fixtures/emit-asoiaf-answer-credential-broker-input.ts'
      - 'tests/narrative/canon/asoiaf-answer-credential-broker.test.ts'
      - 'tools/asoiaf-answer-credential-broker.ts'
      - 'tools/lib/asoiaf-answer-credential-broker.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asoiaf-integrated-answer-credential-broker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    if: github.repository == 'BigBirdReturns/axm-arc'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BASE_SHA: 6b99481c934f809d0744f1f8ee9f578c35d2f8e5
      SOURCE_SHA: 3ff77ac9d30da7eeba67bf1feb916da173d2f90a
    steps:
      - name: Check out exact integrated broker candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Bind exact parent, source, and seven-surface diff
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          test "$(git show -s --format=%P HEAD)" = "$BASE_SHA"
          test -z "$(git status --porcelain)"
          git cat-file -e "$BASE_SHA^{commit}"
          git fetch --force --no-tags origin \
            '+refs/heads/feature/asoiaf-answer-credential-broker-v1:refs/remotes/origin/feature/asoiaf-answer-credential-broker-v1'
          test "$(git rev-parse refs/remotes/origin/feature/asoiaf-answer-credential-broker-v1)" = "$SOURCE_SHA"

          printf '%s\n' "$candidate_sha" > "$RUNNER_TEMP/candidate-sha.txt"
          printf '%s\n' "$BASE_SHA" > "$RUNNER_TEMP/base-sha.txt"
          printf '%s\n' "$SOURCE_SHA" > "$RUNNER_TEMP/source-sha.txt"
          echo "CANDIDATE_SHA=$candidate_sha" >> "$GITHUB_ENV"

          cat > "$RUNNER_TEMP/expected-paths.txt" <<'PATHS'
          .github/workflows/asoiaf-answer-credential-broker.yml
          docs/ASOIAF_ANSWER_CREDENTIAL_BROKER.md
          package.json
          tests/fixtures/emit-asoiaf-answer-credential-broker-input.ts
          tests/narrative/canon/asoiaf-answer-credential-broker.test.ts
          tools/asoiaf-answer-credential-broker.ts
          tools/lib/asoiaf-answer-credential-broker.ts
          PATHS
          sed -i 's/^          //' "$RUNNER_TEMP/expected-paths.txt"
          sort -o "$RUNNER_TEMP/expected-paths.txt" "$RUNNER_TEMP/expected-paths.txt"
          git diff --name-only "$BASE_SHA" "$candidate_sha" | sort \
            > "$RUNNER_TEMP/actual-paths.txt"
          diff -u "$RUNNER_TEMP/expected-paths.txt" "$RUNNER_TEMP/actual-paths.txt"
          git diff --check "$BASE_SHA" "$candidate_sha"

      - name: Verify byte-identical broker implementation and inherited integrated floor
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            docs/ASOIAF_ANSWER_CREDENTIAL_BROKER.md \
            tests/fixtures/emit-asoiaf-answer-credential-broker-input.ts \
            tests/narrative/canon/asoiaf-answer-credential-broker.test.ts \
            tools/asoiaf-answer-credential-broker.ts \
            tools/lib/asoiaf-answer-credential-broker.ts; do
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$SOURCE_SHA:$path")"
          done
          for path in \
            tools/lib/asoiaf-answer-desk-supervised-delivery.ts \
            tools/lib/asoiaf-answer-desk-transport-enrollment.ts \
            tools/lib/asoiaf-answer-credential-deployment.ts; do
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$BASE_SHA:$path")"
          done
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          for (const name of [
            'asoiaf:answer-supervised-delivery',
            'asoiaf:answer-transport-enrollment',
            'asoiaf:answer-credential-deployment',
            'asoiaf:answer-credential-broker',
          ]) {
            if (typeof pkg.scripts?.[name] !== 'string') {
              throw new Error(`missing operator ${name}`);
            }
          }
          NODE

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify permanent operator registration
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent asoiaf:answer-credential-broker -- help \
            | tee "$RUNNER_TEMP/broker-help.txt"
          grep -q 'ASOIAF device-local credential broker' "$RUNNER_TEMP/broker-help.txt"
          for command in policy bind invoke admit-proof admit-transport verify; do
            grep -q "$command" "$RUNNER_TEMP/broker-help.txt"
          done
          npm run --silent asoiaf:answer-supervised-delivery -- help \
            > "$RUNNER_TEMP/supervised-help.txt"
          npm run --silent asoiaf:answer-transport-enrollment -- help \
            > "$RUNNER_TEMP/enrollment-help.txt"
          npm run --silent asoiaf:answer-credential-deployment -- help \
            > "$RUNNER_TEMP/deployment-help.txt"

      - name: Strict TypeScript
        id: typecheck
        shell: bash
        run: |
          set -euo pipefail
          find src tests tools \( -name '*.js' -o -name '*.js.map' -o -name '*.d.ts' \) -delete
          rm -f tsconfig.tsbuildinfo
          npm run typecheck | tee "$RUNNER_TEMP/typecheck.log"

      - name: Focused integrated broker qualification
        id: focused
        shell: bash
        run: |
          set -euo pipefail
          npm test -- \
            tests/narrative/canon/asoiaf-answer-credential-broker.test.ts \
            tests/narrative/canon/asoiaf-answer-credential-deployment.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-transport-enrollment.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-supervised-delivery.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-supervisor.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-transport-operations.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-transport.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-exchange.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-worker.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-estate.test.ts \
            tests/narrative/canon/asoiaf-answer-work-lease.test.ts \
            tests/narrative/canon/asoiaf-answer-work-order.test.ts \
            tests/narrative/canon/asoiaf-reviewed-answer-packet.test.ts \
            tests/narrative/canon/asoiaf-research-question-dossier.test.ts \
            tests/narrative/canon/asoiaf-external-reconciliation-packets.test.ts \
            | tee "$RUNNER_TEMP/focused-tests.log"

      - name: Exercise governed integrated deployment and broker lifecycle
        id: lifecycle
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/credential-broker-fixture"
          estate="$RUNNER_TEMP/credential-broker-estate"
          mkdir -p "$fixture"
          npx vite-node tests/fixtures/emit-asoiaf-answer-credential-broker-input.ts \
            "$fixture" "$estate" \
            | tee "$RUNNER_TEMP/fixture-emission.json"

          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          const temp = process.env.RUNNER_TEMP;
          const fixture = path.join(temp, 'credential-broker-fixture');
          const estate = path.join(temp, 'credential-broker-estate');
          const read = (name) => JSON.parse(
            fs.readFileSync(path.join(fixture, name), 'utf8'),
          );
          const expected = read('expected.json');
          const deploymentVerification = read('deployment-verification.json');
          const brokerVerification = read('broker-verification.json');
          const brokerStatus = read('broker-status.json');
          const possessionFirst = read('possession-invocation-first.json');
          const possessionReplay = read('possession-invocation-replay.json');
          const proofFirst = read('possession-proof-first.json');
          const proofReplay = read('possession-proof-replay.json');
          const transportInvocationFirst = read('transport-invocation-first.json');
          const transportInvocationReplay = read('transport-invocation-replay.json');
          const transportFirst = read('transport-result-first.json');
          const transportReplay = read('transport-result-replay.json');

          assert.equal(deploymentVerification.ok, true);
          assert.deepEqual(
            deploymentVerification.findings.filter((entry) => entry.severity === 'error'),
            [],
          );
          assert.equal(brokerVerification.ok, true);
          assert.deepEqual(brokerVerification.findings, []);
          assert.equal(brokerStatus.ok, true);
          assert.deepEqual(brokerStatus.counts, {
            policies: 1,
            bindings: 1,
            invocations: 2,
            proofs: 1,
            transportResults: 1,
            stateEntries: 1,
          });
          assert.deepEqual(expected.counts, brokerStatus.counts);
          assert.equal(brokerStatus.state.stateId, expected.stateId);
          assert.equal(
            brokerStatus.state.stateFingerprint,
            expected.stateFingerprint,
          );
          assert.equal(possessionFirst.replayed, false);
          assert.equal(possessionReplay.replayed, true);
          assert.equal(proofFirst.replayed, false);
          assert.equal(proofReplay.replayed, true);
          assert.equal(transportInvocationFirst.replayed, false);
          assert.equal(transportInvocationReplay.replayed, true);
          assert.equal(transportFirst.replayed, false);
          assert.equal(transportReplay.replayed, true);
          assert.equal(proofFirst.proof.signatureVerified, true);
          assert.equal(transportFirst.result.deviceAgentSignatureVerified, true);
          assert.equal(transportFirst.result.statement.networkAttempted, true);
          assert.equal(transportFirst.result.statement.rawResponseRetained, false);
          assert.equal(transportFirst.result.statement.privateKeyRetained, false);
          assert.equal(transportFirst.result.statement.rawProviderHandleRetained, false);
          assert.equal(transportFirst.result.statement.providerSecretRetained, false);
          assert.equal(
            fs.existsSync(path.join(fixture, 'ephemeral-material')),
            false,
          );
          assert.equal(
            fs.existsSync(path.join(estate, '.transaction-lock')),
            false,
          );
          NODE
          test -z "$(git status --porcelain)"

      - name: Complete Arc regression
        id: regression
        shell: bash
        run: |
          set -euo pipefail
          find src tests tools \( -name '*.js' -o -name '*.js.map' -o -name '*.d.ts' \) -delete
          rm -f tsconfig.tsbuildinfo
          npm test | tee "$RUNNER_TEMP/full-tests.log"

      - name: Production build
        id: build
        shell: bash
        run: |
          set -euo pipefail
          npm run build | tee "$RUNNER_TEMP/build.log"
          git ls-files --others --exclude-standard -z \
            | while IFS= read -r -d '' generated; do
                case "$generated" in
                  *.js|*.js.map|*.d.ts) rm -f "$generated" ;;
                esac
            done
          test -z "$(git status --porcelain)"

      - name: Retain exact integrated broker qualification
        if: always()
        id: retain
        env:
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          FOCUSED_OUTCOME: ${{ steps.focused.outcome }}
          LIFECYCLE_OUTCOME: ${{ steps.lifecycle.outcome }}
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          root='asoiaf-integrated-answer-credential-broker-qualification'
          mkdir -p "$root/logs" "$root/fixture"
          for retained in \
            broker-help.txt supervised-help.txt enrollment-help.txt deployment-help.txt \
            typecheck.log focused-tests.log full-tests.log build.log fixture-emission.json; do
            if test -f "$RUNNER_TEMP/$retained"; then
              cp "$RUNNER_TEMP/$retained" "$root/logs/"
            fi
          done
          fixture="$RUNNER_TEMP/credential-broker-fixture"
          for retained in \
            expected.json deployment-verification.json broker-policy-result.json \
            broker-binding-result.json possession-invocation-first.json \
            possession-invocation-replay.json possession-proof-first.json \
            possession-proof-replay.json transport-invocation-first.json \
            transport-invocation-replay.json transport-result-statement.json \
            transport-result-first.json transport-result-replay.json broker-status.json \
            broker-verification.json broker-paths.json; do
            if test -f "$fixture/$retained"; then
              cp "$fixture/$retained" "$root/fixture/"
            fi
          done
          cp -R "$RUNNER_TEMP/credential-broker-estate" "$root/estate" 2>/dev/null || true
          cp "$RUNNER_TEMP/candidate-sha.txt" "$root/candidate-sha.txt"
          cp "$RUNNER_TEMP/base-sha.txt" "$root/base-sha.txt"
          cp "$RUNNER_TEMP/source-sha.txt" "$root/source-sha.txt"
          cp "$RUNNER_TEMP/actual-paths.txt" "$root/permanent-paths.txt"
          sha256sum \
            .github/workflows/asoiaf-answer-credential-broker.yml \
            docs/ASOIAF_ANSWER_CREDENTIAL_BROKER.md \
            package.json \
            tests/fixtures/emit-asoiaf-answer-credential-broker-input.ts \
            tests/narrative/canon/asoiaf-answer-credential-broker.test.ts \
            tools/asoiaf-answer-credential-broker.ts \
            tools/lib/asoiaf-answer-credential-broker.ts \
            > "$root/permanent-surface-sha256s.txt"
          printf '%s\n' \
            'evidenceTier=exact-head-integrated-device-local-credential-broker' \
            'brokerImplementation=byte-identical-to-terminal-pr265' \
            'integrationParent=6b99481c934f809d0744f1f8ee9f578c35d2f8e5' \
            'credentialSource=active-qualified-deployment' \
            'brokerEndpoint=local-only' \
            'providerInvocation=content-addressed' \
            'possessionProof=credential-key-signature' \
            'transportAttestation=device-agent-signature' \
            'rawResponseRetained=false' \
            'certificateRetained=false' \
            'privateKeyRetained=false' \
            'privateKeyPathRetained=false' \
            'rawProviderHandleRetained=false' \
            'providerSecretRetained=false' \
            'transportRegistrationAuthority=none' \
            'taskAuthority=none' \
            'graphEffect=none' \
            'canonEffect=none' \
            'answerEffect=none' \
            > "$root/qualification-boundary.txt"
          cat > "$root/outcomes.json" <<EOF
          {"typecheck":"$TYPECHECK_OUTCOME","focused":"$FOCUSED_OUTCOME","lifecycle":"$LIFECYCLE_OUTCOME","regression":"$REGRESSION_OUTCOME","build":"$BUILD_OUTCOME"}
          EOF
          sed -i 's/^          //' "$root/outcomes.json"

          if find "$root" -type f \
            \( -iname '*.key' -o -iname '*.crt' -o -iname '*.pem' -o \
               -iname '*.csr' -o -iname '*.p12' -o -iname '*.pfx' \) \
            -print -quit | grep -q .; then
            echo 'integrated broker artifact retained a forbidden credential-material path' >&2
            exit 1
          fi
          artifact_patterns="$RUNNER_TEMP/integrated-broker-artifact-patterns.txt"
          cat > "$artifact_patterns" <<'PATTERNS'
          -----BEGIN (RSA |EC |ENCRYPTED )?PRIVATE KEY-----
          -----BEGIN CERTIFICATE( REQUEST)?-----
          provider(Pin|Password|Token|Secret|Session)[[:space:]]*["=:]
          pkcs11:[^[:space:]"']+
          PATTERNS
          sed -i 's/^          //' "$artifact_patterns"
          if grep -RIEq \
            --exclude='full-tests.log' \
            --exclude='focused-tests.log' \
            --exclude='build.log' \
            --exclude='typecheck.log' \
            -f "$artifact_patterns" \
            "$root"; then
            echo 'integrated broker artifact retained forbidden key, certificate, or provider-secret content' >&2
            exit 1
          fi
          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" \
            > "$root/SHA256SUMS"
          (cd "$root" && sha256sum -c SHA256SUMS)

      - name: Upload integrated broker qualification
        if: always()
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-integrated-answer-credential-broker-qualification
          path: asoiaf-integrated-answer-credential-broker-qualification
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish exact qualification summary
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        shell: bash
        run: |
          {
            echo '## ASOIAF integrated answer credential broker qualification'
            echo
            echo "- Candidate: \`$CANDIDATE_SHA\`"
            echo "- Parent: \`$BASE_SHA\`"
            echo "- Byte-identical broker source: \`$SOURCE_SHA\`"
            echo "- Artifact: \`${ARTIFACT_ID:-not-issued}\`"
            echo "- Artifact digest: \`${ARTIFACT_DIGEST:-not-issued}\`"
            echo '- Active deployment binding: exact-state only'
            echo '- Private key, certificate, raw provider handle, and provider secrets: not retained'
            echo '- Enrollment, deployment, transport registration, scheduling, task, graph, canon, and answer authority: none'
          } >> "$GITHUB_STEP_SUMMARY"
