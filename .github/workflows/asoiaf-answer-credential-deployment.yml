name: ASOIAF answer credential deployment

on:
  push:
    branches:
      - feature/asoiaf-answer-credential-deployment-v1
    paths:
      - '.github/workflows/asoiaf-answer-credential-deployment.yml'
      - 'docs/ASOIAF_ANSWER_TRANSPORT_CREDENTIAL_DEPLOYMENT.md'
      - 'package.json'
      - 'tests/fixtures/emit-asoiaf-answer-credential-deployment-input.ts'
      - 'tests/narrative/canon/asoiaf-answer-credential-deployment.test.ts'
      - 'tools/asoiaf-answer-credential-deployment.ts'
      - 'tools/lib/asoiaf-answer-credential-deployment.ts'
  pull_request:
    branches:
      - feature/asoiaf-answer-desk-transport-enrollment-v1
    paths:
      - '.github/workflows/asoiaf-answer-credential-deployment.yml'
      - 'docs/ASOIAF_ANSWER_TRANSPORT_CREDENTIAL_DEPLOYMENT.md'
      - 'package.json'
      - 'tests/fixtures/emit-asoiaf-answer-credential-deployment-input.ts'
      - 'tests/narrative/canon/asoiaf-answer-credential-deployment.test.ts'
      - 'tools/asoiaf-answer-credential-deployment.ts'
      - 'tools/lib/asoiaf-answer-credential-deployment.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asoiaf-answer-credential-deployment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    if: github.repository == 'BigBirdReturns/axm-arc'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact credential-deployment candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Bind exact candidate and seven-surface diff
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          echo "CANDIDATE_SHA=$candidate_sha" >> "$GITHUB_ENV"
          git fetch --no-tags origin feature/asoiaf-answer-desk-transport-enrollment-v1
          cat > "$RUNNER_TEMP/expected-paths.txt" <<'PATHS'
          .github/workflows/asoiaf-answer-credential-deployment.yml
          docs/ASOIAF_ANSWER_TRANSPORT_CREDENTIAL_DEPLOYMENT.md
          package.json
          tests/fixtures/emit-asoiaf-answer-credential-deployment-input.ts
          tests/narrative/canon/asoiaf-answer-credential-deployment.test.ts
          tools/asoiaf-answer-credential-deployment.ts
          tools/lib/asoiaf-answer-credential-deployment.ts
          PATHS
          git diff --name-only origin/feature/asoiaf-answer-desk-transport-enrollment-v1...HEAD \
            | sort > "$RUNNER_TEMP/actual-paths.txt"
          diff -u "$RUNNER_TEMP/expected-paths.txt" "$RUNNER_TEMP/actual-paths.txt"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify permanent operator registration
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent asoiaf:answer-credential-deployment -- help \
            > "$RUNNER_TEMP/deployment-help.txt"
          grep -q 'ASOIAF device-bound answer transport credential deployment' \
            "$RUNNER_TEMP/deployment-help.txt"
          for command in \
            register-device register-key plan \
            prepare-installation admit-installation \
            prepare-activation admit-activation \
            prepare-rollback rollback status verify paths; do
            grep -q "$command" "$RUNNER_TEMP/deployment-help.txt"
          done

      - name: Strict TypeScript
        id: typecheck
        shell: bash
        run: npm run typecheck | tee "$RUNNER_TEMP/typecheck.log"

      - name: Focused deployment and inherited stack qualification
        id: focused
        shell: bash
        run: |
          set -euo pipefail
          npm test -- \
            tests/narrative/canon/asoiaf-answer-credential-deployment.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-transport-enrollment.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-transport-operations.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-transport.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-exchange.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-worker.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-estate.test.ts \
            tests/narrative/canon/asoiaf-answer-work-lease.test.ts \
            tests/narrative/canon/asoiaf-answer-work-order.test.ts \
            tests/narrative/canon/asoiaf-reviewed-answer-packet.test.ts \
            tests/narrative/canon/asoiaf-research-question-dossier.test.ts \
            tests/narrative/canon/asoiaf-external-reconciliation-packets.test.ts \
            | tee "$RUNNER_TEMP/focused-tests.log"

      - name: Exercise device-bound installation, activation, rollback, and exact replay
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/deployment-fixture"
          material="$RUNNER_TEMP/deployment-material"
          estate="$RUNNER_TEMP/deployment-estate"
          mkdir -p "$fixture" "$material"
          npx vite-node tests/fixtures/emit-asoiaf-answer-credential-deployment-input.ts \
            "$fixture" "$estate" "$material" \
            > "$RUNNER_TEMP/fixture-emission.json"

          deploy() {
            npx vite-node tools/asoiaf-answer-credential-deployment.ts -- "$@"
          }
          replay() {
            local label="$1"
            shift
            deploy "$@" --out "$RUNNER_TEMP/${label}-first.json" > /dev/null
            deploy "$@" --out "$RUNNER_TEMP/${label}-replay.json" > /dev/null
            jq -e '.replayed == false' "$RUNNER_TEMP/${label}-first.json" > /dev/null
            jq -e '.replayed == true' "$RUNNER_TEMP/${label}-replay.json" > /dev/null
          }

          replay device register-device --input "$fixture/device-input.json"
          replay initial-key register-key --input "$fixture/initial-key-input.json"
          replay initial-plan plan --input "$fixture/initial-plan-input.json"
          deploy prepare-installation --input "$fixture/initial-installation-input.json" \
            --out "$RUNNER_TEMP/initial-installation-statement.json" > /dev/null
          replay initial-installation admit-installation \
            --input "$fixture/initial-installation-input.json"
          deploy prepare-activation --input "$fixture/initial-activation-input.json" \
            --out "$RUNNER_TEMP/initial-activation-statement.json" > /dev/null
          replay initial-activation admit-activation \
            --input "$fixture/initial-activation-input.json"

          replay successor-key register-key --input "$fixture/successor-key-input.json"
          replay successor-plan plan --input "$fixture/successor-plan-input.json"
          deploy prepare-installation --input "$fixture/successor-installation-input.json" \
            --out "$RUNNER_TEMP/successor-installation-statement.json" > /dev/null
          replay successor-installation admit-installation \
            --input "$fixture/successor-installation-input.json"
          deploy prepare-activation --input "$fixture/successor-activation-input.json" \
            --out "$RUNNER_TEMP/successor-activation-statement.json" > /dev/null
          replay successor-activation admit-activation \
            --input "$fixture/successor-activation-input.json"

          deploy prepare-rollback --input "$fixture/rollback-input.json" \
            --out "$RUNNER_TEMP/rollback-statement.json" > /dev/null
          replay rollback rollback --input "$fixture/rollback-input.json"
          deploy status --root "$estate" --out "$RUNNER_TEMP/deployment-status.json" > /dev/null
          deploy verify --root "$estate" --out "$RUNNER_TEMP/deployment-verification.json" > /dev/null
          deploy paths --root "$estate" --out "$RUNNER_TEMP/deployment-paths.json" > /dev/null

          jq -e '
            .ok == true and
            .counts == {
              devices: 1,
              keys: 2,
              plans: 2,
              installations: 2,
              activations: 2,
              rollbacks: 1,
              activeServices: 1
            }
          ' "$RUNNER_TEMP/deployment-status.json" > /dev/null
          jq -e '
            .ok == true and
            (.findings | length) == 0 and
            .counts == {errors: 0, warnings: 0, notices: 0}
          ' "$RUNNER_TEMP/deployment-verification.json" > /dev/null

          find "$estate" -type f -print0 \
            | while IFS= read -r -d '' retained; do
                case "$(basename "$retained")" in
                  *.key|*.pem|*.crt|*.cer|*.csr|*.p12|*.pfx)
                    echo "forbidden credential material path: $retained" >&2
                    exit 1
                    ;;
                esac
              done
          secret_patterns="$RUNNER_TEMP/credential-secret-patterns.txt"
          cat > "$secret_patterns" <<'PATTERNS'
          -----BEGIN (RSA |EC |ENCRYPTED )?PRIVATE KEY-----
          -----BEGIN CERTIFICATE( REQUEST)?-----
          pkcs11:[^[:space:]"']+
          provider(Pin|Password|Token|Secret|Session)[[:space:]]*[":=]
          PATTERNS
          if grep -RIEq --binary-files=without-match \
            -f "$secret_patterns" "$estate"; then
            echo 'forbidden credential or provider secret material retained' >&2
            exit 1
          fi
          rm -rf "$material" "$fixture"
          test -z "$(git status --porcelain)"

      - name: Complete Arc regression
        id: regression
        shell: bash
        run: npm test | tee "$RUNNER_TEMP/full-tests.log"

      - name: Production build
        id: build
        shell: bash
        run: |
          set -euo pipefail
          npm run build | tee "$RUNNER_TEMP/build.log"
          git ls-files --others --exclude-standard -z \
            | while IFS= read -r -d '' generated; do
                case "$generated" in
                  *.js|*.js.map|*.d.ts) rm -f "$generated" ;;
                esac
              done
          test -z "$(git status --porcelain)"

      - name: Retain exact credential-deployment qualification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root='asoiaf-answer-credential-deployment-qualification'
          mkdir -p "$root"
          for retained in \
            deployment-help.txt typecheck.log focused-tests.log full-tests.log build.log \
            fixture-emission.json \
            device-first.json device-replay.json \
            initial-key-first.json initial-key-replay.json \
            initial-plan-first.json initial-plan-replay.json \
            initial-installation-statement.json initial-installation-first.json initial-installation-replay.json \
            initial-activation-statement.json initial-activation-first.json initial-activation-replay.json \
            successor-key-first.json successor-key-replay.json \
            successor-plan-first.json successor-plan-replay.json \
            successor-installation-statement.json successor-installation-first.json successor-installation-replay.json \
            successor-activation-statement.json successor-activation-first.json successor-activation-replay.json \
            rollback-statement.json rollback-first.json rollback-replay.json \
            deployment-status.json deployment-verification.json deployment-paths.json; do
            cp "$RUNNER_TEMP/$retained" "$root/" 2>/dev/null || true
          done
          cp -R "$RUNNER_TEMP/deployment-estate" "$root/estate" 2>/dev/null || true
          printf '%s\n' "$CANDIDATE_SHA" > "$root/candidate-sha.txt"
          printf '%s\n' \
            'evidenceTier=exact-head-device-bound-credential-deployment' \
            'enrollmentAuthority=none' \
            'certificateIssuance=external-governed-input' \
            'privateKeyExportable=false' \
            'rawProviderHandleRetained=false' \
            'installationProof=device-agent-signature' \
            'activationProof=credential-key-plus-device-agent' \
            'successorContinuity=exact-predecessor' \
            'rollback=bounded-append-only' \
            'stateProjection=deterministic' \
            'runtimeAdmissionAuthority=none' \
            'transportAuthority=none' \
            'graphEffect=none' \
            'canonEffect=none' \
            'answerEffect=none' \
            > "$root/qualification-boundary.txt"

          if find "$root" -type f \
            \( -iname '*.key' -o -iname '*.pem' -o -iname '*.crt' -o \
               -iname '*.cer' -o -iname '*.csr' -o -iname '*.p12' -o \
               -iname '*.pfx' \) -print -quit | grep -q .; then
            echo 'credential material path entered qualification artifact' >&2
            exit 1
          fi
          artifact_patterns="$RUNNER_TEMP/credential-artifact-secret-patterns.txt"
          cat > "$artifact_patterns" <<'PATTERNS'
          -----BEGIN (RSA |EC |ENCRYPTED )?PRIVATE KEY-----
          -----BEGIN CERTIFICATE( REQUEST)?-----
          pkcs11:[^[:space:]"']+
          provider(Pin|Password|Token|Secret|Session)[[:space:]]*[":=]
          PATTERNS
          if grep -RIEq --binary-files=without-match \
            -f "$artifact_patterns" "$root"; then
            echo 'credential or provider secret material entered qualification artifact' >&2
            exit 1
          fi
          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" \
            > "$root/SHA256SUMS"
          (cd "$root" && sha256sum -c SHA256SUMS)

      - name: Upload credential-deployment qualification
        if: always()
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-answer-credential-deployment-qualification
          path: asoiaf-answer-credential-deployment-qualification
          if-no-files-found: error
          retention-days: 30

      - name: Publish exact qualification summary
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs['artifact-id'] }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs['artifact-digest'] }}
        shell: bash
        run: |
          {
            echo '## ASOIAF answer credential deployment qualification'
            echo
            echo "- Candidate: \`$CANDIDATE_SHA\`"
            echo "- Artifact: \`${ARTIFACT_ID:-not-issued}\`"
            echo "- Artifact digest: \`${ARTIFACT_DIGEST:-not-issued}\`"
            echo '- Device-bound key references: two'
            echo '- Installations and activations: two each'
            echo '- Successor rollback: one exact predecessor restoration'
            echo '- Secret material retained: none'
          } >> "$GITHUB_STEP_SUMMARY"
