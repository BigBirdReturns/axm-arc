name: ASOIAF answer credential deployment

on:
  push:
    branches:
      - feature/asoiaf-answer-credential-deployment-v1
    paths:
      - '.github/workflows/asoiaf-answer-credential-deployment.yml'
      - 'docs/ASOIAF_ANSWER_TRANSPORT_CREDENTIAL_DEPLOYMENT.md'
      - 'package.json'
      - 'tests/fixtures/emit-asoiaf-answer-credential-deployment-input.ts'
      - 'tests/narrative/canon/asoiaf-answer-credential-deployment.test.ts'
      - 'tools/asoiaf-answer-credential-deployment.ts'
      - 'tools/lib/asoiaf-answer-credential-deployment.ts'
  pull_request:
    branches:
      - feature/asoiaf-answer-desk-transport-enrollment-v1
    paths:
      - '.github/workflows/asoiaf-answer-credential-deployment.yml'
      - 'docs/ASOIAF_ANSWER_TRANSPORT_CREDENTIAL_DEPLOYMENT.md'
      - 'package.json'
      - 'tests/fixtures/emit-asoiaf-answer-credential-deployment-input.ts'
      - 'tests/narrative/canon/asoiaf-answer-credential-deployment.test.ts'
      - 'tools/asoiaf-answer-credential-deployment.ts'
      - 'tools/lib/asoiaf-answer-credential-deployment.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asoiaf-answer-credential-deployment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    if: github.repository == 'BigBirdReturns/axm-arc'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact credential-deployment candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Bind exact candidate and seven-surface diff
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          echo "CANDIDATE_SHA=$candidate_sha" >> "$GITHUB_ENV"
          git fetch --no-tags origin feature/asoiaf-answer-desk-transport-enrollment-v1
          cat > "$RUNNER_TEMP/expected-paths.txt" <<'PATHS'
          .github/workflows/asoiaf-answer-credential-deployment.yml
          docs/ASOIAF_ANSWER_TRANSPORT_CREDENTIAL_DEPLOYMENT.md
          package.json
          tests/fixtures/emit-asoiaf-answer-credential-deployment-input.ts
          tests/narrative/canon/asoiaf-answer-credential-deployment.test.ts
          tools/asoiaf-answer-credential-deployment.ts
          tools/lib/asoiaf-answer-credential-deployment.ts
          PATHS
          git diff --name-only origin/feature/asoiaf-answer-desk-transport-enrollment-v1...HEAD \
            | sort > "$RUNNER_TEMP/actual-paths.txt"
          diff -u "$RUNNER_TEMP/expected-paths.txt" "$RUNNER_TEMP/actual-paths.txt"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify permanent operator registration
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent asoiaf:answer-credential-deployment -- help \
            > "$RUNNER_TEMP/deployment-help.txt"
          grep -q 'ASOIAF device-bound answer transport credential deployment' \
            "$RUNNER_TEMP/deployment-help.txt"
          for command in \
            register-device register-key plan \
            prepare-installation admit-installation \
            prepare-activation admit-activation \
            prepare-rollback rollback status verify paths; do
            grep -q "$command" "$RUNNER_TEMP/deployment-help.txt"
          done

      - name: Strict TypeScript
        id: typecheck
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck | tee "$RUNNER_TEMP/typecheck.log"

      - name: Focused deployment, enrollment, transport, exchange, worker, desk, and answer qualification
        id: focused
        shell: bash
        run: |
          set -euo pipefail
          npm test -- \
            tests/narrative/canon/asoiaf-answer-credential-deployment.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-transport-enrollment.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-transport-operations.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-transport.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-exchange.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-worker.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-estate.test.ts \
            tests/narrative/canon/asoiaf-answer-work-lease.test.ts \
            tests/narrative/canon/asoiaf-answer-work-order.test.ts \
            tests/narrative/canon/asoiaf-reviewed-answer-packet.test.ts \
            tests/narrative/canon/asoiaf-research-question-dossier.test.ts \
            tests/narrative/canon/asoiaf-external-reconciliation-packets.test.ts \
            | tee "$RUNNER_TEMP/focused-tests.log"

      - name: Exercise device-bound installation, successor activation, rollback, and exact replay
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/deployment-fixture"
          material="$RUNNER_TEMP/deployment-material"
          estate="$RUNNER_TEMP/deployment-estate"
          mkdir -p "$fixture" "$material"

          npx vite-node tests/fixtures/emit-asoiaf-answer-credential-deployment-input.ts \
            "$fixture" "$estate" "$material" \
            > "$RUNNER_TEMP/fixture-emission.json"

          deploy() {
            npx vite-node tools/asoiaf-answer-credential-deployment.ts -- "$@"
          }

          deploy register-device \
            --input "$fixture/device-input.json" \
            --out "$RUNNER_TEMP/device-first.json" > /dev/null
          deploy register-device \
            --input "$fixture/device-input.json" \
            --out "$RUNNER_TEMP/device-replay.json" > /dev/null
          deploy register-key \
            --input "$fixture/initial-key-input.json" \
            --out "$RUNNER_TEMP/initial-key-first.json" > /dev/null
          deploy register-key \
            --input "$fixture/initial-key-input.json" \
            --out "$RUNNER_TEMP/initial-key-replay.json" > /dev/null
          deploy plan \
            --input "$fixture/initial-plan-input.json" \
            --out "$RUNNER_TEMP/initial-plan-first.json" > /dev/null
          deploy plan \
            --input "$fixture/initial-plan-input.json" \
            --out "$RUNNER_TEMP/initial-plan-replay.json" > /dev/null
          deploy prepare-installation \
            --input "$fixture/initial-installation-input.json" \
            --out "$RUNNER_TEMP/initial-installation-statement.json" > /dev/null
          deploy admit-installation \
            --input "$fixture/initial-installation-input.json" \
            --out "$RUNNER_TEMP/initial-installation-first.json" > /dev/null
          deploy admit-installation \
            --input "$fixture/initial-installation-input.json" \
            --out "$RUNNER_TEMP/initial-installation-replay.json" > /dev/null
          deploy prepare-activation \
            --input "$fixture/initial-activation-input.json" \
            --out "$RUNNER_TEMP/initial-activation-statement.json" > /dev/null
          deploy admit-activation \
            --input "$fixture/initial-activation-input.json" \
            --out "$RUNNER_TEMP/initial-activation-first.json" > /dev/null
          deploy admit-activation \
            --input "$fixture/initial-activation-input.json" \
            --out "$RUNNER_TEMP/initial-activation-replay.json" > /dev/null

          deploy register-key \
            --input "$fixture/successor-key-input.json" \
            --out "$RUNNER_TEMP/successor-key-first.json" > /dev/null
          deploy register-key \
            --input "$fixture/successor-key-input.json" \
            --out "$RUNNER_TEMP/successor-key-replay.json" > /dev/null
          deploy plan \
            --input "$fixture/successor-plan-input.json" \
            --out "$RUNNER_TEMP/successor-plan-first.json" > /dev/null
          deploy plan \
            --input "$fixture/successor-plan-input.json" \
            --out "$RUNNER_TEMP/successor-plan-replay.json" > /dev/null
          deploy prepare-installation \
            --input "$fixture/successor-installation-input.json" \
            --out "$RUNNER_TEMP/successor-installation-statement.json" > /dev/null
          deploy admit-installation \
            --input "$fixture/successor-installation-input.json" \
            --out "$RUNNER_TEMP/successor-installation-first.json" > /dev/null
          deploy admit-installation \
            --input "$fixture/successor-installation-input.json" \
            --out "$RUNNER_TEMP/successor-installation-replay.json" > /dev/null
          deploy prepare-activation \
            --input "$fixture/successor-activation-input.json" \
            --out "$RUNNER_TEMP/successor-activation-statement.json" > /dev/null
          deploy admit-activation \
            --input "$fixture/successor-activation-input.json" \
            --out "$RUNNER_TEMP/successor-activation-first.json" > /dev/null
          deploy admit-activation \
            --input "$fixture/successor-activation-input.json" \
            --out "$RUNNER_TEMP/successor-activation-replay.json" > /dev/null

          deploy prepare-rollback \
            --input "$fixture/rollback-input.json" \
            --out "$RUNNER_TEMP/rollback-statement.json" > /dev/null
          deploy rollback \
            --input "$fixture/rollback-input.json" \
            --out "$RUNNER_TEMP/rollback-first.json" > /dev/null
          deploy rollback \
            --input "$fixture/rollback-input.json" \
            --out "$RUNNER_TEMP/rollback-replay.json" > /dev/null
          deploy status --root "$estate" \
            --out "$RUNNER_TEMP/deployment-status.json" > /dev/null
          deploy verify --root "$estate" \
            --out "$RUNNER_TEMP/deployment-verification.json" > /dev/null
          deploy paths --root "$estate" \
            --out "$RUNNER_TEMP/deployment-paths.json" > /dev/null

          FIXTURE="$fixture" node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          const temp = process.env.RUNNER_TEMP;
          const fixture = process.env.FIXTURE;
          const read = (name) => JSON.parse(
            fs.readFileSync(path.join(temp, name), 'utf8'),
          );
          const expected = JSON.parse(
            fs.readFileSync(path.join(fixture, 'expected.json'), 'utf8'),
          );

          const device = read('device-first.json');
          const deviceReplay = read('device-replay.json');
          const initialKey = read('initial-key-first.json');
          const initialPlan = read('initial-plan-first.json');
          const initialInstallation = read('initial-installation-first.json');
          const initialActivation = read('initial-activation-first.json');
          const successorKey = read('successor-key-first.json');
          const successorPlan = read('successor-plan-first.json');
          const successorInstallation = read('successor-installation-first.json');
          const successorActivation = read('successor-activation-first.json');
          const rollback = read('rollback-first.json');
          const status = read('deployment-status.json');
          const verification = read('deployment-verification.json');

          assert.equal(device.device.deviceId, expected.deviceId);
          assert.equal(device.replayed, false);
          assert.equal(deviceReplay.replayed, true);
          assert.equal(initialKey.keyReference.keyReferenceId, expected.initialKeyReferenceId);
          assert.equal(initialPlan.plan.planId, expected.initialPlanId);
          assert.equal(initialInstallation.installation.installationId, expected.initialInstallationId);
          assert.equal(initialActivation.activation.activationId, expected.initialActivationId);
          assert.equal(successorKey.keyReference.keyReferenceId, expected.successorKeyReferenceId);
          assert.equal(successorPlan.plan.planId, expected.successorPlanId);
          assert.equal(successorInstallation.installation.installationId, expected.successorInstallationId);
          assert.equal(successorActivation.activation.activationId, expected.successorActivationId);
          assert.equal(rollback.rollback.rollbackId, expected.rollbackId);

          for (const name of [
            'initial-key-replay.json',
            'initial-plan-replay.json',
            'initial-installation-replay.json',
            'initial-activation-replay.json',
            'successor-key-replay.json',
            'successor-plan-replay.json',
            'successor-installation-replay.json',
            'successor-activation-replay.json',
            'rollback-replay.json',
          ]) {
            assert.equal(read(name).replayed, true, name);
          }

          assert.equal(status.ok, true);
          assert.deepEqual(status.counts, {
            devices: 1,
            keys: 2,
            plans: 2,
            installations: 2,
            activations: 2,
            rollbacks: 1,
            activeServices: 1,
          });
          const service = status.state.entries[0];
          for (const [key, value] of Object.entries(expected.finalServiceState)) {
            assert.deepEqual(service[key], value, key);
          }
          assert.equal(verification.ok, true);
          assert.deepEqual(verification.findings, []);
          assert.deepEqual(verification.counts, {
            errors: 0,
            warnings: 0,
            notices: 0,
          });
          NODE

          find "$estate" -type f -print0 \
            | while IFS= read -r -d '' retained; do
                case "$(basename "$retained")" in
                  *.key|*.pem|*.crt|*.cer|*.csr|*.p12|*.pfx)
                    echo "forbidden credential material path: $retained" >&2
                    exit 1
                    ;;
                esac
              done
          if grep -RIEq --binary-files=without-match \
            '-----BEGIN (RSA |EC |ENCRYPTED )?PRIVATE KEY-----|-----BEGIN CERTIFICATE( REQUEST)?-----|pkcs11:[^[:space:]"'"']+|provider(Pin|Password|Token|Secret|Session)[[:space:]]*[":=]' \
            "$estate"; then
            echo 'forbidden credential or provider secret material retained' >&2
            exit 1
          fi

          rm -rf "$material" "$fixture"
          test -z "$(git status --porcelain)"

      - name: Complete Arc regression
        id: regression
        shell: bash
        run: |
          set -euo pipefail
          npm test | tee "$RUNNER_TEMP/full-tests.log"

      - name: Production build
        id: build
        shell: bash
        run: |
          set -euo pipefail
          npm run build | tee "$RUNNER_TEMP/build.log"
          git ls-files --others --exclude-standard -z \
            | while IFS= read -r -d '' generated; do
                case "$generated" in
                  *.js|*.js.map|*.d.ts) rm -f "$generated" ;;
                esac
              done
          test -z "$(git status --porcelain)"

      - name: Retain exact credential-deployment qualification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root='asoiaf-answer-credential-deployment-qualification'
          mkdir -p "$root"
          for retained in \
            deployment-help.txt typecheck.log focused-tests.log full-tests.log build.log \
            device-first.json device-replay.json \
            initial-key-first.json initial-key-replay.json \
            initial-plan-first.json initial-plan-replay.json \
            initial-installation-statement.json initial-installation-first.json initial-installation-replay.json \
            initial-activation-statement.json initial-activation-first.json initial-activation-replay.json \
            successor-key-first.json successor-key-replay.json \
            successor-plan-first.json successor-plan-replay.json \
            successor-installation-statement.json successor-installation-first.json successor-installation-replay.json \
            successor-activation-statement.json successor-activation-first.json successor-activation-replay.json \
            rollback-statement.json rollback-first.json rollback-replay.json \
            deployment-status.json deployment-verification.json deployment-paths.json; do
            cp "$RUNNER_TEMP/$retained" "$root/" 2>/dev/null || true
          done
          cp -R "$RUNNER_TEMP/deployment-estate" "$root/estate" 2>/dev/null || true
          printf '%s\n' "$CANDIDATE_SHA" > "$root/candidate-sha.txt"
          printf '%s\n' \
            'evidenceTier=exact-head-device-bound-credential-deployment' \
            'enrollmentAuthority=none' \
            'certificateIssuance=external-governed-input' \
            'privateKeyExportable=false' \
            'rawProviderHandleRetained=false' \
            'installationProof=device-agent-signature' \
            'activationProof=credential-key-plus-device-agent' \
            'successorContinuity=exact-predecessor' \
            'rollback=bounded-append-only' \
            'stateProjection=deterministic' \
            'runtimeAdmissionAuthority=none' \
            'transportAuthority=none' \
            'graphEffect=none' \
            'canonEffect=none' \
            'answerEffect=none' \
            > "$root/qualification-boundary.txt"

          if find "$root" -type f \
            \( -iname '*.key' -o -iname '*.pem' -o -iname '*.crt' -o \
               -iname '*.cer' -o -iname '*.csr' -o -iname '*.p12' -o \
               -iname '*.pfx' \) -print -quit | grep -q .; then
            echo 'credential material path entered qualification artifact' >&2
            exit 1
          fi
          if grep -RIEq --binary-files=without-match \
            '-----BEGIN (RSA |EC |ENCRYPTED )?PRIVATE KEY-----|-----BEGIN CERTIFICATE( REQUEST)?-----|pkcs11:[^[:space:]"'"']+|provider(Pin|Password|Token|Secret|Session)[[:space:]]*[":=]' \
            "$root"; then
            echo 'credential or provider secret material entered qualification artifact' >&2
            exit 1
          fi
          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" \
            > "$root/SHA256SUMS"
          (
            cd "$root"
            sha256sum -c SHA256SUMS
          )

      - name: Upload credential-deployment qualification
        if: always()
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-answer-credential-deployment-qualification
          path: asoiaf-answer-credential-deployment-qualification
          if-no-files-found: error
          retention-days: 30

      - name: Publish exact qualification summary
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs['artifact-id'] }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs['artifact-digest'] }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## ASOIAF answer credential deployment qualification'
            echo
            echo "- Candidate: \`$CANDIDATE_SHA\`"
            echo "- Artifact: \`${ARTIFACT_ID:-not-issued}\`"
            echo "- Artifact digest: \`${ARTIFACT_DIGEST:-not-issued}\`"
            echo '- Device-bound key references: two'
            echo '- Installations and activations: two each'
            echo '- Successor rollback: one exact predecessor restoration'
            echo '- Secret material retained: none'
          } >> "$GITHUB_STEP_SUMMARY"
