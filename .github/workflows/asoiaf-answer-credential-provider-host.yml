name: ASOIAF integrated answer credential provider host

on:
  push:
    branches:
      - feature/asoiaf-answer-credential-provider-host-integrated-v1
    paths:
      - '.github/workflows/asoiaf-answer-credential-provider-host.yml'
      - 'docs/ASOIAF_ANSWER_CREDENTIAL_PROVIDER_HOST.md'
      - 'package.json'
      - 'tests/fixtures/emit-asoiaf-answer-credential-provider-host-input.ts'
      - 'tests/narrative/canon/asoiaf-answer-credential-provider-host.test.ts'
      - 'tools/asoiaf-answer-credential-provider-host.ts'
      - 'tools/lib/asoiaf-answer-credential-provider-host.ts'
  pull_request:
    branches:
      - feature/asoiaf-answer-credential-broker-integrated-v1
    paths:
      - '.github/workflows/asoiaf-answer-credential-provider-host.yml'
      - 'docs/ASOIAF_ANSWER_CREDENTIAL_PROVIDER_HOST.md'
      - 'package.json'
      - 'tests/fixtures/emit-asoiaf-answer-credential-provider-host-input.ts'
      - 'tests/narrative/canon/asoiaf-answer-credential-provider-host.test.ts'
      - 'tools/asoiaf-answer-credential-provider-host.ts'
      - 'tools/lib/asoiaf-answer-credential-provider-host.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asoiaf-integrated-answer-credential-provider-host-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_SHA: 5c9f0461283bdcde5d3f8ae141e55c5423c768d4
  SOURCE_SHA: 543dca183cf4d89f5c6e935b229e571f4c1c9b5b

jobs:
  linux-qualify:
    if: github.repository == 'BigBirdReturns/axm-arc'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out exact integrated provider-host candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Bind exact parent, terminal source, and permanent surfaces
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          test "$(git show -s --format=%P HEAD)" = "$BASE_SHA"
          test -z "$(git status --porcelain)"
          git fetch --force --no-tags origin \
            '+refs/heads/feature/asoiaf-answer-credential-provider-host-v1:refs/remotes/origin/feature/asoiaf-answer-credential-provider-host-v1'
          test "$(git rev-parse refs/remotes/origin/feature/asoiaf-answer-credential-provider-host-v1)" = "$SOURCE_SHA"
          printf '%s\n' "$candidate" > "$RUNNER_TEMP/candidate-sha.txt"
          printf '%s\n' "$BASE_SHA" > "$RUNNER_TEMP/base-sha.txt"
          printf '%s\n' "$SOURCE_SHA" > "$RUNNER_TEMP/source-sha.txt"
          echo "CANDIDATE_SHA=$candidate" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/expected-paths.txt" <<'PATHS'
          .github/workflows/asoiaf-answer-credential-provider-host.yml
          docs/ASOIAF_ANSWER_CREDENTIAL_PROVIDER_HOST.md
          package.json
          tests/fixtures/emit-asoiaf-answer-credential-provider-host-input.ts
          tests/narrative/canon/asoiaf-answer-credential-provider-host.test.ts
          tools/asoiaf-answer-credential-provider-host.ts
          tools/lib/asoiaf-answer-credential-provider-host.ts
          PATHS
          sed -i 's/^          //' "$RUNNER_TEMP/expected-paths.txt"
          sort -o "$RUNNER_TEMP/expected-paths.txt" "$RUNNER_TEMP/expected-paths.txt"
          git diff --name-only "$BASE_SHA" "$candidate" | sort > "$RUNNER_TEMP/actual-paths.txt"
          diff -u "$RUNNER_TEMP/expected-paths.txt" "$RUNNER_TEMP/actual-paths.txt"
          git diff --check "$BASE_SHA" "$candidate"

      - name: Verify imported provider and inherited integrated floor
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            docs/ASOIAF_ANSWER_CREDENTIAL_PROVIDER_HOST.md \
            tests/fixtures/emit-asoiaf-answer-credential-provider-host-input.ts \
            tests/narrative/canon/asoiaf-answer-credential-provider-host.test.ts \
            tools/asoiaf-answer-credential-provider-host.ts \
            tools/lib/asoiaf-answer-credential-provider-host.ts; do
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$SOURCE_SHA:$path")"
          done
          for path in \
            tools/lib/asoiaf-answer-desk-supervised-delivery.ts \
            tools/lib/asoiaf-answer-desk-transport-enrollment.ts \
            tools/lib/asoiaf-answer-credential-deployment.ts \
            tools/lib/asoiaf-answer-credential-broker.ts; do
            test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$BASE_SHA:$path")"
          done
          node <<'NODE'
          const pkg = require('./package.json');
          for (const name of [
            'asoiaf:answer-supervised-delivery',
            'asoiaf:answer-transport-enrollment',
            'asoiaf:answer-credential-deployment',
            'asoiaf:answer-credential-broker',
            'asoiaf:answer-credential-provider-host',
          ]) {
            if (typeof pkg.scripts?.[name] !== 'string') throw new Error(`missing ${name}`);
          }
          NODE

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify permanent operators
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent asoiaf:answer-credential-provider-host -- help | tee "$RUNNER_TEMP/provider-help.txt"
          grep -q 'ASOIAF device-local credential provider host' "$RUNNER_TEMP/provider-help.txt"
          for command in profile prepare synthetic-proof synthetic-transport windows-transport status verify paths powershell; do
            grep -q "$command" "$RUNNER_TEMP/provider-help.txt"
          done
          for operator in answer-credential-broker answer-credential-deployment answer-transport-enrollment answer-supervised-delivery; do
            npm run --silent "asoiaf:$operator" -- help > "$RUNNER_TEMP/$operator-help.txt"
          done

      - name: Strict TypeScript
        id: typecheck
        shell: bash
        run: |
          set -euo pipefail
          find src tests tools \( -name '*.js' -o -name '*.js.map' -o -name '*.d.ts' \) -delete
          rm -f tsconfig.tsbuildinfo
          npm run typecheck | tee "$RUNNER_TEMP/typecheck.log"

      - name: Focused integrated provider qualification
        id: focused
        shell: bash
        run: |
          set -euo pipefail
          npm test -- \
            tests/narrative/canon/asoiaf-answer-credential-provider-host.test.ts \
            tests/narrative/canon/asoiaf-answer-credential-broker.test.ts \
            tests/narrative/canon/asoiaf-answer-credential-deployment.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-transport-enrollment.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-supervised-delivery.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-supervisor.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-transport-operations.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-transport.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-exchange.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-worker.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-estate.test.ts \
            tests/narrative/canon/asoiaf-answer-work-lease.test.ts \
            tests/narrative/canon/asoiaf-answer-work-order.test.ts \
            tests/narrative/canon/asoiaf-reviewed-answer-packet.test.ts \
            tests/narrative/canon/asoiaf-research-question-dossier.test.ts \
            tests/narrative/canon/asoiaf-external-reconciliation-packets.test.ts \
            | tee "$RUNNER_TEMP/focused-tests.log"

      - name: Exercise complete integrated synthetic provider lifecycle
        id: lifecycle
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/provider-host-fixture"
          estate="$RUNNER_TEMP/provider-host-estate"
          mkdir -p "$fixture"
          npx vite-node tests/fixtures/emit-asoiaf-answer-credential-provider-host-input.ts \
            "$fixture" "$estate" | tee "$RUNNER_TEMP/fixture-emission.json"
          jq -e '.ok == true and (.findings | length) == 0' "$fixture/provider-verification.json" > /dev/null
          jq -e '.ok == true and (.findings | length) == 0' "$fixture/broker-verification.json" > /dev/null
          jq -e '.ok == true and ([.findings[] | select(.severity == "error")] | length) == 0' \
            "$fixture/deployment-verification.json" > /dev/null
          jq -e '.counts == {profiles:1, invocations:2, results:2, stateEntries:1}' \
            "$fixture/provider-status.json" > /dev/null
          for pair in \
            provider-profile possession-provider-prepare possession-provider-result \
            possession-broker-admission transport-provider-prepare transport-provider-result \
            transport-broker-admission; do
            jq -e '.replayed == false' "$fixture/${pair}-first.json" > /dev/null
            jq -e '.replayed == true' "$fixture/${pair}-replay.json" > /dev/null
          done
          jq -e '.result.output.kind == "possession-proof"' "$fixture/possession-provider-result-first.json" > /dev/null
          jq -e '
            .result.output.kind == "transport-result" and
            .result.output.statement.rawResponseRetained == false and
            .result.privateKeyRetained == false and
            .result.rawProviderSelectorRetained == false and
            .result.providerSecretRetained == false
          ' "$fixture/transport-provider-result-first.json" > /dev/null
          test ! -e "$fixture/ephemeral-material"
          test ! -e "$estate/.transaction-lock"
          test -z "$(git status --porcelain)"

      - name: Complete Arc regression
        id: regression
        shell: bash
        run: |
          set -euo pipefail
          find src tests tools \( -name '*.js' -o -name '*.js.map' -o -name '*.d.ts' \) -delete
          rm -f tsconfig.tsbuildinfo
          npm test | tee "$RUNNER_TEMP/full-tests.log"

      - name: Production build
        id: build
        shell: bash
        run: |
          set -euo pipefail
          npm run build | tee "$RUNNER_TEMP/build.log"
          git ls-files --others --exclude-standard -z | while IFS= read -r -d '' generated; do
            case "$generated" in *.js|*.js.map|*.d.ts) rm -f "$generated" ;; esac
          done
          test -z "$(git status --porcelain)"

      - name: Assemble Linux qualification
        if: always()
        id: retain
        env:
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          FOCUSED_OUTCOME: ${{ steps.focused.outcome }}
          LIFECYCLE_OUTCOME: ${{ steps.lifecycle.outcome }}
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/provider-linux"
          mkdir -p "$root/logs" "$root/fixture"
          for file in "$RUNNER_TEMP"/*.txt "$RUNNER_TEMP"/*.log "$RUNNER_TEMP"/fixture-emission.json; do
            test -f "$file" && cp "$file" "$root/logs/" || true
          done
          fixture="$RUNNER_TEMP/provider-host-fixture"
          test -d "$fixture" && find "$fixture" -maxdepth 1 -type f -name '*.json' -exec cp {} "$root/fixture/" \; || true
          cp -R "$RUNNER_TEMP/provider-host-estate" "$root/estate" 2>/dev/null || true
          cp "$RUNNER_TEMP/candidate-sha.txt" "$root/candidate-sha.txt"
          cp "$RUNNER_TEMP/base-sha.txt" "$root/base-sha.txt"
          cp "$RUNNER_TEMP/source-sha.txt" "$root/source-sha.txt"
          cp "$RUNNER_TEMP/actual-paths.txt" "$root/permanent-paths.txt"
          sha256sum \
            .github/workflows/asoiaf-answer-credential-provider-host.yml \
            docs/ASOIAF_ANSWER_CREDENTIAL_PROVIDER_HOST.md package.json \
            tests/fixtures/emit-asoiaf-answer-credential-provider-host-input.ts \
            tests/narrative/canon/asoiaf-answer-credential-provider-host.test.ts \
            tools/asoiaf-answer-credential-provider-host.ts \
            tools/lib/asoiaf-answer-credential-provider-host.ts \
            > "$root/permanent-surface-sha256s.txt"
          cat > "$root/outcomes.json" <<EOF
          {"typecheck":"$TYPECHECK_OUTCOME","focused":"$FOCUSED_OUTCOME","lifecycle":"$LIFECYCLE_OUTCOME","regression":"$REGRESSION_OUTCOME","build":"$BUILD_OUTCOME"}
          EOF
          sed -i 's/^          //' "$root/outcomes.json"
          printf '%s\n' \
            'providerImplementation=byte-identical-to-terminal-pr270' \
            'integrationParent=5c9f0461283bdcde5d3f8ae141e55c5423c768d4' \
            'linuxSyntheticLifecycle=passed' 'certificateRetained=false' \
            'privateKeyRetained=false' 'rawProviderSelectorRetained=false' \
            'providerSecretRetained=false' 'rawResponseRetained=false' \
            'transportRegistrationAuthority=none' 'taskAuthority=none' \
            'graphEffect=none' 'canonEffect=none' 'answerEffect=none' \
            > "$root/qualification-boundary.txt"
          if find "$root" -type f \( -iname '*.key' -o -iname '*.crt' -o -iname '*.cer' -o \
            -iname '*.pem' -o -iname '*.csr' -o -iname '*.p12' -o -iname '*.pfx' \) \
            -print -quit | grep -q .; then exit 1; fi
          patterns="$RUNNER_TEMP/provider-patterns.txt"
          cat > "$patterns" <<'PATTERNS'
          -----BEGIN (RSA |EC |ENCRYPTED )?PRIVATE KEY-----
          -----BEGIN CERTIFICATE( REQUEST)?-----
          provider(Pin|Password|Token|Secret|Session)[[:space:]]*["=:]
          pkcs11:[^[:space:]"']+
          PATTERNS
          sed -i 's/^          //' "$patterns"
          if grep -RIEq --exclude='full-tests.log' --exclude='focused-tests.log' \
            --exclude='build.log' --exclude='typecheck.log' -f "$patterns" "$root"; then exit 1; fi
          find "$root" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum \
            | sed "s#  $root/#  #" > "$root/SHA256SUMS"
          (cd "$root" && sha256sum -c SHA256SUMS)

      - name: Upload Linux qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-integrated-answer-credential-provider-host-linux
          path: ${{ runner.temp }}/provider-linux
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  windows-cng:
    if: github.repository == 'BigBirdReturns/axm-arc'
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Check out exact integrated provider-host candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Bind exact Windows candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = (git rev-parse HEAD).Trim()
          if ((git show -s --format=%P HEAD).Trim() -ne $env:BASE_SHA) { throw 'wrong candidate parent' }
          if (git status --porcelain) { throw 'candidate worktree is not clean' }
          "CANDIDATE_SHA=$candidate" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Emit, parse, and inspect Windows CNG adapter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptPath = Join-Path $env:RUNNER_TEMP 'provider.ps1'
          npm run --silent asoiaf:answer-credential-provider-host -- powershell --out $scriptPath
          $text = Get-Content -Raw $scriptPath
          [void][scriptblock]::Create($text)
          if ($text -match 'Export(?:Pkcs8|RSAPrivateKey|ECPrivateKey|Parameters)') { throw 'key export operation' }
          if ($text -notmatch 'Cert:\\CurrentUser\\My\\') { throw 'wrong certificate store' }

      - name: Prove non-exportable Windows CNG signing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptPath = Join-Path $env:RUNNER_TEMP 'provider.ps1'
          $cert = New-SelfSignedCertificate -Subject 'CN=ASOIAF Integrated Provider Qualification' `
            -CertStoreLocation 'Cert:\CurrentUser\My' -KeyAlgorithm RSA -KeyLength 2048 `
            -KeyExportPolicy NonExportable -NotAfter (Get-Date).AddHours(2)
          try {
            $message = [Text.Encoding]::UTF8.GetBytes('asoiaf-integrated-provider-host')
            $input = Join-Path $env:RUNNER_TEMP 'sign.json'
            @{command='sign';thumbprint=$cert.Thumbprint;messageBase64=[Convert]::ToBase64String($message)} `
              | ConvertTo-Json | Set-Content $input -Encoding utf8
            $result = & $scriptPath -InputPath $input | ConvertFrom-Json
            $signature = [Convert]::FromBase64String([string]$result.signatureBase64)
            $public = [System.Security.Cryptography.X509Certificates.RSACertificateExtensions]::GetRSAPublicKey($cert)
            try {
              $verified = $public.VerifyData($message,$signature,[Security.Cryptography.HashAlgorithmName]::SHA256,[Security.Cryptography.RSASignaturePadding]::Pkcs1)
            } finally { $public.Dispose() }
            if (-not $verified) { throw 'signature verification failed' }
            $private = [System.Security.Cryptography.X509Certificates.RSACertificateExtensions]::GetRSAPrivateKey($cert)
            try {
              $blocked = $false
              try { [void]$private.ExportPkcs8PrivateKey() } catch { $blocked = $true }
            } finally { $private.Dispose() }
            if (-not $blocked) { throw 'private-key export permitted' }
            @{
              format='axm-asoiaf-integrated-provider-windows-cng/1'
              candidateSha=$env:CANDIDATE_SHA;baseSha=$env:BASE_SHA;sourceSha=$env:SOURCE_SHA
              algorithm=[string]$result.algorithm
              certificateFingerprint=[string]$result.certificateFingerprint
              signatureVerified=$verified;privateKeyExportBlocked=$blocked
              certificateRetained=$false;privateKeyRetained=$false;rawSelectorRetained=$false
              authority='none';graphEffect='none';canonEffect='none';answerEffect='none'
            } | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $env:RUNNER_TEMP 'windows.json') -Encoding utf8
          } finally {
            Remove-Item -LiteralPath ("Cert:\CurrentUser\My\" + $cert.Thumbprint) -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Windows receipt
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-integrated-answer-credential-provider-host-windows
          path: ${{ runner.temp }}/windows.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  combine:
    if: always() && needs.linux-qualify.result == 'success' && needs.windows-cng.result == 'success'
    needs: [linux-qualify, windows-cng]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: receipts

      - name: Reconcile cross-platform qualification
        shell: bash
        run: |
          set -euo pipefail
          root='asoiaf-integrated-answer-credential-provider-host-qualification'
          mkdir -p "$root/linux" "$root/windows"
          cp -R receipts/asoiaf-integrated-answer-credential-provider-host-linux/. "$root/linux/"
          cp receipts/asoiaf-integrated-answer-credential-provider-host-windows/windows.json "$root/windows/"
          candidate="$(tr -d '\r\n' < "$root/linux/candidate-sha.txt")"
          parent="$(tr -d '\r\n' < "$root/linux/base-sha.txt")"
          source="$(tr -d '\r\n' < "$root/linux/source-sha.txt")"
          test "$candidate" = "$(jq -r .candidateSha "$root/windows/windows.json")"
          test "$parent" = "$(jq -r .baseSha "$root/windows/windows.json")"
          test "$source" = "$(jq -r .sourceSha "$root/windows/windows.json")"
          printf '%s\n' "$candidate" > "$root/candidate-sha.txt"
          printf '%s\n' "$parent" > "$root/base-sha.txt"
          printf '%s\n' "$source" > "$root/source-sha.txt"
          cp "$root/linux/permanent-paths.txt" "$root/permanent-paths.txt"
          cp "$root/linux/permanent-surface-sha256s.txt" "$root/permanent-surface-sha256s.txt"
          cp "$root/linux/outcomes.json" "$root/outcomes.json"
          printf '%s\n' 'linuxSyntheticLifecycle=passed' 'windowsCngSigning=passed' \
            'privateKeyRetained=false' 'certificateRetained=false' \
            'rawProviderSelectorRetained=false' 'providerSecretRetained=false' \
            'rawResponseRetained=false' 'transportRegistrationAuthority=none' \
            'taskAuthority=none' 'graphEffect=none' 'canonEffect=none' 'answerEffect=none' \
            > "$root/qualification-boundary.txt"
          if find "$root" -type f \( -iname '*.key' -o -iname '*.crt' -o -iname '*.cer' -o \
            -iname '*.pem' -o -iname '*.csr' -o -iname '*.p12' -o -iname '*.pfx' \) \
            -print -quit | grep -q .; then exit 1; fi
          patterns="$RUNNER_TEMP/provider-patterns.txt"
          cat > "$patterns" <<'PATTERNS'
          -----BEGIN (RSA |EC |ENCRYPTED )?PRIVATE KEY-----
          -----BEGIN CERTIFICATE( REQUEST)?-----
          provider(Pin|Password|Token|Secret|Session)[[:space:]]*["=:]
          pkcs11:[^[:space:]"']+
          PATTERNS
          sed -i 's/^          //' "$patterns"
          if grep -RIEq --exclude='full-tests.log' --exclude='focused-tests.log' \
            --exclude='build.log' --exclude='typecheck.log' -f "$patterns" "$root"; then exit 1; fi
          find "$root" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum \
            | sed "s#  $root/#  #" > "$root/SHA256SUMS"
          (cd "$root" && sha256sum -c SHA256SUMS)

      - name: Upload combined qualification
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-integrated-answer-credential-provider-host-qualification
          path: asoiaf-integrated-answer-credential-provider-host-qualification
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish exact qualification summary
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs['artifact-id'] }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs['artifact-digest'] }}
        shell: bash
        run: |
          root='asoiaf-integrated-answer-credential-provider-host-qualification'
          {
            echo '## ASOIAF integrated credential provider host qualification'
            echo
            echo "- Candidate: \`$(cat "$root/candidate-sha.txt")\`"
            echo "- Parent: \`$(cat "$root/base-sha.txt")\`"
            echo "- Source: \`$(cat "$root/source-sha.txt")\`"
            echo "- Artifact: \`$ARTIFACT_ID\`"
            echo "- Artifact digest: \`$ARTIFACT_DIGEST\`"
            echo '- Linux lifecycle and Windows non-exportable CNG signing: passed'
            echo '- Credential and task authority: none'
          } >> "$GITHUB_STEP_SUMMARY"
