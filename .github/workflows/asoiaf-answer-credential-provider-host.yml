name: ASOIAF answer credential provider host

on:
  push:
    branches:
      - feature/asoiaf-answer-credential-provider-host-v1
    paths:
      - '.github/workflows/asoiaf-answer-credential-provider-host.yml'
      - 'docs/ASOIAF_ANSWER_CREDENTIAL_PROVIDER_HOST.md'
      - 'package.json'
      - 'tests/fixtures/emit-asoiaf-answer-credential-provider-host-input.ts'
      - 'tests/narrative/canon/asoiaf-answer-credential-provider-host.test.ts'
      - 'tools/asoiaf-answer-credential-provider-host.ts'
      - 'tools/lib/asoiaf-answer-credential-provider-host.ts'
  pull_request:
    branches:
      - feature/asoiaf-answer-credential-broker-v1
    paths:
      - '.github/workflows/asoiaf-answer-credential-provider-host.yml'
      - 'docs/ASOIAF_ANSWER_CREDENTIAL_PROVIDER_HOST.md'
      - 'package.json'
      - 'tests/fixtures/emit-asoiaf-answer-credential-provider-host-input.ts'
      - 'tests/narrative/canon/asoiaf-answer-credential-provider-host.test.ts'
      - 'tools/asoiaf-answer-credential-provider-host.ts'
      - 'tools/lib/asoiaf-answer-credential-provider-host.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asoiaf-answer-credential-provider-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-qualify:
    if: github.repository == 'BigBirdReturns/axm-arc'
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    steps:
      - name: Check out exact provider-host candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          show-progress: false

      - name: Bind exact Linux candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          echo "CANDIDATE_SHA=$candidate_sha" >> "$GITHUB_ENV"
          printf '%s\n' "$candidate_sha"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify permanent operator registration
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent asoiaf:answer-credential-provider-host -- help \
            | tee "$RUNNER_TEMP/provider-help.txt"
          grep -q 'ASOIAF device-local credential provider host' "$RUNNER_TEMP/provider-help.txt"
          grep -q 'synthetic-proof' "$RUNNER_TEMP/provider-help.txt"
          grep -q 'windows-transport' "$RUNNER_TEMP/provider-help.txt"
          grep -q 'verify' "$RUNNER_TEMP/provider-help.txt"

      - name: Strict TypeScript
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck | tee "$RUNNER_TEMP/typecheck.log"

      - name: Focused provider, broker, deployment, enrollment, transport, and answer-stack qualification
        shell: bash
        run: |
          set -euo pipefail
          npm test -- \
            tests/narrative/canon/asoiaf-answer-credential-provider-host.test.ts \
            tests/narrative/canon/asoiaf-answer-credential-broker.test.ts \
            tests/narrative/canon/asoiaf-answer-credential-deployment.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-transport-enrollment.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-transport-operations.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-transport.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-exchange.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-worker.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-estate.test.ts \
            tests/narrative/canon/asoiaf-answer-work-lease.test.ts \
            tests/narrative/canon/asoiaf-answer-work-order.test.ts \
            tests/narrative/canon/asoiaf-reviewed-answer-packet.test.ts \
            tests/narrative/canon/asoiaf-research-question-dossier.test.ts \
            tests/narrative/canon/asoiaf-external-reconciliation-packets.test.ts \
            | tee "$RUNNER_TEMP/focused-tests.log"

      - name: Exercise complete synthetic provider-host lifecycle
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/provider-host-fixture"
          estate="$RUNNER_TEMP/provider-host-estate"
          mkdir -p "$fixture"
          npx vite-node tests/fixtures/emit-asoiaf-answer-credential-provider-host-input.ts \
            "$fixture" "$estate" \
            | tee "$RUNNER_TEMP/fixture-emission.json"

          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          const temp = process.env.RUNNER_TEMP;
          const fixture = path.join(temp, 'provider-host-fixture');
          const estate = path.join(temp, 'provider-host-estate');
          const read = (name) => JSON.parse(fs.readFileSync(path.join(fixture, name), 'utf8'));
          const expected = read('expected.json');
          const providerVerification = read('provider-verification.json');
          const brokerVerification = read('broker-verification.json');
          const providerStatus = read('provider-status.json');
          const profileFirst = read('provider-profile-first.json');
          const profileReplay = read('provider-profile-replay.json');
          const possessionPrepareFirst = read('possession-provider-prepare-first.json');
          const possessionPrepareReplay = read('possession-provider-prepare-replay.json');
          const possessionFirst = read('possession-provider-result-first.json');
          const possessionReplay = read('possession-provider-result-replay.json');
          const proofFirst = read('possession-broker-admission-first.json');
          const proofReplay = read('possession-broker-admission-replay.json');
          const transportPrepareFirst = read('transport-provider-prepare-first.json');
          const transportPrepareReplay = read('transport-provider-prepare-replay.json');
          const transportFirst = read('transport-provider-result-first.json');
          const transportReplay = read('transport-provider-result-replay.json');
          const admissionFirst = read('transport-broker-admission-first.json');
          const admissionReplay = read('transport-broker-admission-replay.json');

          assert.equal(providerVerification.ok, true);
          assert.deepEqual(providerVerification.findings, []);
          assert.equal(brokerVerification.ok, true);
          assert.deepEqual(brokerVerification.findings, []);
          assert.deepEqual(providerStatus.counts, {
            profiles: 1,
            invocations: 2,
            results: 2,
            stateEntries: 1,
          });
          assert.deepEqual(expected.providerCounts, providerStatus.counts);
          assert.equal(profileFirst.replayed, false);
          assert.equal(profileReplay.replayed, true);
          assert.equal(possessionPrepareFirst.replayed, false);
          assert.equal(possessionPrepareReplay.replayed, true);
          assert.equal(possessionFirst.replayed, false);
          assert.equal(possessionReplay.replayed, true);
          assert.equal(proofFirst.replayed, false);
          assert.equal(proofReplay.replayed, true);
          assert.equal(transportPrepareFirst.replayed, false);
          assert.equal(transportPrepareReplay.replayed, true);
          assert.equal(transportFirst.replayed, false);
          assert.equal(transportReplay.replayed, true);
          assert.equal(admissionFirst.replayed, false);
          assert.equal(admissionReplay.replayed, true);
          assert.equal(possessionFirst.result.output.kind, 'possession-proof');
          assert.equal(transportFirst.result.output.kind, 'transport-result');
          assert.equal(transportFirst.result.output.statement.rawResponseRetained, false);
          assert.equal(transportFirst.result.privateKeyRetained, false);
          assert.equal(transportFirst.result.rawProviderSelectorRetained, false);
          assert.equal(transportFirst.result.providerSecretRetained, false);
          assert.equal(fs.existsSync(path.join(fixture, 'ephemeral-material')), false);
          assert.equal(fs.existsSync(path.join(estate, '.transaction-lock')), false);
          NODE

      - name: Complete Arc regression
        shell: bash
        run: |
          set -euo pipefail
          npm test | tee "$RUNNER_TEMP/full-tests.log"

      - name: Production build
        shell: bash
        run: |
          set -euo pipefail
          npm run build | tee "$RUNNER_TEMP/build.log"

      - name: Assemble Linux qualification custody
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/provider-host-linux-qualification"
          mkdir -p "$root/logs" "$root/fixture"
          cp "$RUNNER_TEMP/provider-help.txt" "$root/logs/"
          cp "$RUNNER_TEMP/typecheck.log" "$root/logs/"
          cp "$RUNNER_TEMP/focused-tests.log" "$root/logs/"
          cp "$RUNNER_TEMP/full-tests.log" "$root/logs/"
          cp "$RUNNER_TEMP/build.log" "$root/logs/"
          cp "$RUNNER_TEMP/fixture-emission.json" "$root/fixture/"
          fixture="$RUNNER_TEMP/provider-host-fixture"
          for file in \
            expected.json \
            deployment-verification.json \
            broker-verification.json \
            provider-profile-first.json \
            provider-profile-replay.json \
            possession-provider-prepare-first.json \
            possession-provider-prepare-replay.json \
            possession-provider-result-first.json \
            possession-provider-result-replay.json \
            possession-broker-admission-first.json \
            possession-broker-admission-replay.json \
            transport-provider-prepare-first.json \
            transport-provider-prepare-replay.json \
            transport-provider-result-first.json \
            transport-provider-result-replay.json \
            transport-broker-admission-first.json \
            transport-broker-admission-replay.json \
            provider-status.json \
            provider-verification.json \
            provider-paths.json \
            broker-status.json; do
            cp "$fixture/$file" "$root/fixture/"
          done
          cp -R "$RUNNER_TEMP/provider-host-estate" "$root/estate"
          printf '%s\n' "$CANDIDATE_SHA" > "$root/candidate-sha.txt"
          printf '%s\n' \
            'platform=linux-synthetic-qualification' \
            'profiles=1' \
            'providerInvocations=2' \
            'providerResults=2' \
            'brokerProofs=1' \
            'brokerTransportResults=1' \
            'certificateRetained=false' \
            'privateKeyRetained=false' \
            'rawProviderSelectorRetained=false' \
            'providerSecretRetained=false' \
            'rawResponseRetained=false' \
            'authority=none' \
            'graphEffect=none' \
            'canonEffect=none' \
            'answerEffect=none' \
            > "$root/qualification-boundary.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" > "$root/SHA256SUMS"
          (cd "$root" && sha256sum -c SHA256SUMS)

      - name: Upload Linux qualification custody
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-answer-credential-provider-host-linux
          path: ${{ runner.temp }}/provider-host-linux-qualification
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  windows-cng:
    if: github.repository == 'BigBirdReturns/axm-arc'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact provider-host candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          show-progress: false

      - name: Bind exact Windows candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = (git rev-parse HEAD).Trim()
          if (git status --porcelain) { throw 'candidate worktree is not clean' }
          "CANDIDATE_SHA=$candidate" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Emit and parse permanent Windows CNG adapter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptPath = Join-Path $env:RUNNER_TEMP 'asoiaf-provider-host.ps1'
          npm run --silent asoiaf:answer-credential-provider-host -- powershell --out $scriptPath
          $scriptText = Get-Content -Raw -LiteralPath $scriptPath
          [void][scriptblock]::Create($scriptText)
          if ($scriptText -match 'Export(?:Pkcs8|RSAPrivateKey|ECPrivateKey|Parameters)') {
            throw 'Windows provider adapter contains a key export operation'
          }
          if ($scriptText -notmatch 'Cert:\\CurrentUser\\My\\') {
            throw 'Windows provider adapter does not bind CurrentUser certificate storage'
          }

      - name: Sign with one non-exportable Windows CNG certificate key
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptPath = Join-Path $env:RUNNER_TEMP 'asoiaf-provider-host.ps1'
          $subject = 'CN=ASOIAF Provider Host Qualification'
          $certificate = New-SelfSignedCertificate `
            -Subject $subject `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -KeyExportPolicy NonExportable `
            -NotAfter (Get-Date).AddHours(2)
          try {
            $message = [Text.Encoding]::UTF8.GetBytes('asoiaf-provider-host-windows-cng-qualification')
            $inputPath = Join-Path $env:RUNNER_TEMP 'windows-sign-input.json'
            @{
              command = 'sign'
              thumbprint = $certificate.Thumbprint
              messageBase64 = [Convert]::ToBase64String($message)
            } | ConvertTo-Json | Set-Content -LiteralPath $inputPath -Encoding utf8
            $result = & $scriptPath -InputPath $inputPath | ConvertFrom-Json
            if ($result.algorithm -ne 'rsa-sha256') { throw 'unexpected Windows CNG signature algorithm' }
            $signature = [Convert]::FromBase64String([string]$result.signatureBase64)
            $public = $certificate.GetRSAPublicKey()
            try {
              $verified = $public.VerifyData(
                $message,
                $signature,
                [Security.Cryptography.HashAlgorithmName]::SHA256,
                [Security.Cryptography.RSASignaturePadding]::Pkcs1
              )
            } finally {
              $public.Dispose()
            }
            if (-not $verified) { throw 'Windows CNG signature did not verify' }
            $private = $certificate.GetRSAPrivateKey()
            try {
              $exportBlocked = $false
              try {
                [void]$private.ExportPkcs8PrivateKey()
              } catch {
                $exportBlocked = $true
              }
            } finally {
              $private.Dispose()
            }
            if (-not $exportBlocked) { throw 'qualification key unexpectedly permitted private-key export' }
            @{
              format = 'axm-asoiaf-answer-provider-windows-cng-qualification/1'
              candidateSha = $env:CANDIDATE_SHA
              algorithm = [string]$result.algorithm
              certificateFingerprint = [string]$result.certificateFingerprint
              signatureDigest = 'sha256:' + [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($signature)).ToLowerInvariant()
              signatureVerified = $verified
              privateKeyExportBlocked = $exportBlocked
              certificateRetained = $false
              privateKeyRetained = $false
              rawSelectorRetained = $false
              authority = 'none'
              graphEffect = 'none'
              canonEffect = 'none'
              answerEffect = 'none'
            } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'windows-cng-receipt.json') -Encoding utf8
          } finally {
            Remove-Item -LiteralPath ("Cert:\CurrentUser\My\" + $certificate.Thumbprint) -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Windows CNG public receipt
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-answer-credential-provider-host-windows
          path: ${{ runner.temp }}/windows-cng-receipt.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  combine:
    if: always() && needs.linux-qualify.result == 'success' && needs.windows-cng.result == 'success'
    needs:
      - linux-qualify
      - windows-cng
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download platform receipts
        uses: actions/download-artifact@v4
        with:
          path: platform-receipts

      - name: Build combined qualification artifact
        shell: bash
        run: |
          set -euo pipefail
          root='asoiaf-answer-credential-provider-host-qualification'
          mkdir -p "$root/linux" "$root/windows"
          cp -R platform-receipts/asoiaf-answer-credential-provider-host-linux/. "$root/linux/"
          cp platform-receipts/asoiaf-answer-credential-provider-host-windows/windows-cng-receipt.json "$root/windows/"
          linux_sha="$(tr -d '\r\n' < "$root/linux/candidate-sha.txt")"
          windows_sha="$(jq -r .candidateSha "$root/windows/windows-cng-receipt.json")"
          test "$linux_sha" = "$windows_sha"
          printf '%s\n' "$linux_sha" > "$root/candidate-sha.txt"
          printf '%s\n' \
            'linuxSyntheticLifecycle=passed' \
            'windowsCngNonExportableSigning=passed' \
            'windowsMutualTlsAdapter=parsed-and-pinned' \
            'privateKeyRetained=false' \
            'certificateRetained=false' \
            'rawProviderSelectorRetained=false' \
            'providerSecretRetained=false' \
            'rawResponseRetained=false' \
            'authority=none' \
            'graphEffect=none' \
            'canonEffect=none' \
            'answerEffect=none' \
            > "$root/qualification-boundary.txt"
          if find "$root" -type f \
            \( -iname '*.key' -o -iname '*.crt' -o -iname '*.pem' -o -iname '*.csr' -o -iname '*.p12' -o -iname '*.pfx' \) \
            | grep -q .; then
            echo 'combined provider artifact contains a forbidden credential path' >&2
            exit 1
          fi
          if grep -RIEq \
            --exclude='full-tests.log' \
            --exclude='focused-tests.log' \
            --exclude='build.log' \
            --exclude='typecheck.log' \
            'BEGIN (RSA |EC |ENCRYPTED )?PRIVATE KEY|BEGIN CERTIFICATE( REQUEST)?|provider(Pin|Password|Token|Secret|Session)[[:space:]]*[":=]|pkcs11:[^[:space:]"'"']+' \
            "$root"; then
            echo 'combined provider artifact contains forbidden secret material' >&2
            exit 1
          fi
          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" > "$root/SHA256SUMS"
          (cd "$root" && sha256sum -c SHA256SUMS)

      - name: Upload combined provider-host qualification
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-answer-credential-provider-host-qualification
          path: asoiaf-answer-credential-provider-host-qualification
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish exact qualification summary
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs['artifact-id'] }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs['artifact-digest'] }}
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(cat asoiaf-answer-credential-provider-host-qualification/candidate-sha.txt)"
          {
            echo '## ASOIAF credential provider host qualification'
            echo
            echo "- Candidate: \`$candidate\`"
            echo "- Artifact: \`${ARTIFACT_ID}\`"
            echo "- Artifact digest: \`${ARTIFACT_DIGEST}\`"
            echo '- Linux synthetic provider and broker admission: passed'
            echo '- Windows CNG non-exportable signing: passed'
            echo '- Private key, certificate, raw selector, provider secret, and raw response retention: false'
          } >> "$GITHUB_STEP_SUMMARY"
