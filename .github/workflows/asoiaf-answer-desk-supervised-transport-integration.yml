name: ASOIAF supervised transport integration

on:
  push:
    branches:
      - integration/asoiaf-answer-desk-supervised-transport-v1
    paths:
      - '.github/workflows/asoiaf-answer-desk-supervised-transport-integration.yml'
      - 'docs/ASOIAF_ANSWER_DESK_SUPERVISOR.md'
      - 'package.json'
      - 'tests/fixtures/emit-asoiaf-answer-desk-supervisor-input.ts'
      - 'tests/narrative/canon/asoiaf-answer-desk-supervisor.test.ts'
      - 'tools/asoiaf-answer-desk-supervisor.ts'
      - 'tools/lib/asoiaf-answer-desk-supervisor.ts'
      - '.github/workflows/asoiaf-answer-desk-transport-operations.yml'
      - 'docs/ASOIAF_ANSWER_DESK_TRANSPORT_OPERATIONS.md'
      - 'tests/fixtures/emit-asoiaf-answer-desk-transport-operations-input.ts'
      - 'tests/narrative/canon/asoiaf-answer-desk-transport-operations.test.ts'
      - 'tools/asoiaf-answer-desk-transport-operations.ts'
      - 'tools/lib/asoiaf-answer-desk-transport-operations.ts'
  pull_request:
    branches:
      - feature/asoiaf-answer-desk-transport-operations-v1
    paths:
      - '.github/workflows/asoiaf-answer-desk-supervised-transport-integration.yml'
      - 'docs/ASOIAF_ANSWER_DESK_SUPERVISOR.md'
      - 'package.json'
      - 'tests/fixtures/emit-asoiaf-answer-desk-supervisor-input.ts'
      - 'tests/narrative/canon/asoiaf-answer-desk-supervisor.test.ts'
      - 'tools/asoiaf-answer-desk-supervisor.ts'
      - 'tools/lib/asoiaf-answer-desk-supervisor.ts'
      - '.github/workflows/asoiaf-answer-desk-transport-operations.yml'
      - 'docs/ASOIAF_ANSWER_DESK_TRANSPORT_OPERATIONS.md'
      - 'tests/fixtures/emit-asoiaf-answer-desk-transport-operations-input.ts'
      - 'tests/narrative/canon/asoiaf-answer-desk-transport-operations.test.ts'
      - 'tools/asoiaf-answer-desk-transport-operations.ts'
      - 'tools/lib/asoiaf-answer-desk-transport-operations.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asoiaf-supervised-transport-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    if: github.repository == 'BigBirdReturns/axm-arc'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact integration candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Verify exact two-parent integration lineage
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          parent_line="$(git show -s --format=%P HEAD)"
          test "$parent_line" = '1f362e121f29aaa48e73c6c2e96d453e0466c74f 9da2a1b777073a5ee3bafaec118add6ddb5ab347'
          git merge-base --is-ancestor 1f362e121f29aaa48e73c6c2e96d453e0466c74f HEAD
          git merge-base --is-ancestor 9da2a1b777073a5ee3bafaec118add6ddb5ab347 HEAD
          test -z "$(git status --porcelain)"
          printf '%s\n' "$candidate_sha" > "$RUNNER_TEMP/candidate-sha.txt"
          printf '%s\n' "$parent_line" > "$RUNNER_TEMP/parent-shas.txt"
          echo "CANDIDATE_SHA=$candidate_sha" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify exact imported supervisor surfaces and operator registrations
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object docs/ASOIAF_ANSWER_DESK_SUPERVISOR.md)" = '5d0a35b5a6c1eee827af6a39f401b6b0c0848a00'
          test "$(git hash-object tests/fixtures/emit-asoiaf-answer-desk-supervisor-input.ts)" = '30d1bd705a7940b908d591183c5ff1eb202e29af'
          test "$(git hash-object tests/narrative/canon/asoiaf-answer-desk-supervisor.test.ts)" = '588d459a2c6d11ba5a64385786fa4413464185cf'
          test "$(git hash-object tools/asoiaf-answer-desk-supervisor.ts)" = '76ca1df8bb003f9d0c81715138d35fc336d10517'
          test "$(git hash-object tools/lib/asoiaf-answer-desk-supervisor.ts)" = 'dfadd458cf689a751ba753b9aa377378d1e791c0'
          npm run --silent asoiaf:answer-supervisor -- help | tee "$RUNNER_TEMP/supervisor-help.txt"
          npm run --silent asoiaf:answer-transport-operations -- help | tee "$RUNNER_TEMP/operations-help.txt"
          grep -q 'ASOIAF persistent answer desk supervisor' "$RUNNER_TEMP/supervisor-help.txt"
          grep -q 'ASOIAF answer-desk transport operations' "$RUNNER_TEMP/operations-help.txt"

      - name: Strict TypeScript
        shell: bash
        run: |
          set -euo pipefail
          find src tests tools \( -name '*.js' -o -name '*.js.map' -o -name '*.d.ts' \) -delete
          rm -f tsconfig.tsbuildinfo
          npm run typecheck | tee "$RUNNER_TEMP/typecheck.log"

      - name: Focused joint supervisor and transport-operations qualification
        shell: bash
        run: |
          set -euo pipefail
          npm test -- \
            tests/narrative/canon/asoiaf-answer-desk-supervisor.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-transport-operations.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-transport.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-exchange.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-worker.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-estate.test.ts \
            tests/narrative/canon/asoiaf-answer-work-lease.test.ts \
            tests/narrative/canon/asoiaf-answer-work-order.test.ts \
            tests/narrative/canon/asoiaf-reviewed-answer-packet.test.ts \
            tests/narrative/canon/asoiaf-research-question-dossier.test.ts \
            tests/narrative/canon/asoiaf-external-reconciliation-packets.test.ts \
            | tee "$RUNNER_TEMP/focused-tests.log"

      - name: Complete Arc regression
        shell: bash
        run: |
          set -euo pipefail
          find src tests tools \( -name '*.js' -o -name '*.js.map' -o -name '*.d.ts' \) -delete
          rm -f tsconfig.tsbuildinfo
          npm test | tee "$RUNNER_TEMP/full-tests.log"

      - name: Production build
        shell: bash
        run: |
          set -euo pipefail
          npm run build | tee "$RUNNER_TEMP/build.log"

      - name: Retain exact integration qualification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root='asoiaf-supervised-transport-integration-qualification'
          mkdir -p "$root"
          for file in \
            candidate-sha.txt parent-shas.txt supervisor-help.txt operations-help.txt \
            typecheck.log focused-tests.log full-tests.log build.log; do
            if test -f "$RUNNER_TEMP/$file"; then
              cp "$RUNNER_TEMP/$file" "$root/"
            fi
          done
          git diff --name-status 1f362e121f29aaa48e73c6c2e96d453e0466c74f..HEAD \
            > "$root/operations-parent-diff.txt"
          git diff --name-status 9da2a1b777073a5ee3bafaec118add6ddb5ab347..HEAD \
            > "$root/supervisor-parent-diff.txt"
          printf '%s\n' \
            'integrationBehavior=new-authority-none' \
            'supervisorImplementation=byte-identical' \
            'transportOperationsImplementation=inherited-qualified-head' \
            'networkDispatchBySupervisor=false' \
            'authority=none' \
            'graphEffect=none' \
            'canonEffect=none' \
            'answerEffect=none' \
            > "$root/integration-boundary.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" \
            > "$root/SHA256SUMS"

      - name: Upload integration qualification
        if: always()
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-supervised-transport-integration-qualification
          path: asoiaf-supervised-transport-integration-qualification
          if-no-files-found: error
          retention-days: 30

      - name: Publish exact qualification summary
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## ASOIAF supervised transport integration qualification'
            echo
            echo "- Candidate: \`$CANDIDATE_SHA\`"
            echo "- Parents: \`1f362e121f29aaa48e73c6c2e96d453e0466c74f\`, \`9da2a1b777073a5ee3bafaec118add6ddb5ab347\`"
            echo "- Artifact: \`${ARTIFACT_ID:-not-issued}\`"
            echo "- Artifact digest: \`${ARTIFACT_DIGEST:-not-issued}\`"
            echo '- Integration effect: both qualified planes coexist; no scheduler-to-network authority is introduced.'
          } >> "$GITHUB_STEP_SUMMARY"
