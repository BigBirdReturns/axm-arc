name: ASOIAF answer desk transport operations

on:
  push:
    branches:
      - feature/asoiaf-answer-desk-transport-operations-v1
    paths:
      - '.github/workflows/asoiaf-answer-desk-transport-operations.yml'
      - 'docs/ASOIAF_ANSWER_DESK_TRANSPORT_OPERATIONS.md'
      - 'package.json'
      - 'tests/fixtures/asoiaf-answer-desk-fixture.ts'
      - 'tests/fixtures/emit-asoiaf-answer-desk-transport-input.ts'
      - 'tests/fixtures/emit-asoiaf-answer-desk-transport-operations-input.ts'
      - 'tests/narrative/canon/asoiaf-answer-desk-transport-operations.test.ts'
      - 'tests/narrative/canon/asoiaf-answer-desk-transport.test.ts'
      - 'tools/asoiaf-answer-desk-transport-operations.ts'
      - 'tools/lib/asoiaf-answer-desk-transport-operations.ts'
      - 'tools/asoiaf-answer-desk-transport.ts'
      - 'tools/lib/asoiaf-answer-desk-transport.ts'
      - 'tools/asoiaf-answer-desk-exchange.ts'
      - 'tools/lib/asoiaf-answer-desk-exchange.ts'
      - 'tools/asoiaf-answer-desk-worker.ts'
      - 'tools/lib/asoiaf-answer-desk-worker.ts'
      - 'tools/asoiaf-answer-desk-estate.ts'
      - 'tools/lib/asoiaf-answer-desk-estate.ts'
      - 'tools/lib/asoiaf-answer-work-lease.ts'
      - 'tools/lib/asoiaf-answer-work-order.ts'
  pull_request:
    branches:
      - feature/asoiaf-answer-desk-transport-v1
    paths:
      - '.github/workflows/asoiaf-answer-desk-transport-operations.yml'
      - 'docs/ASOIAF_ANSWER_DESK_TRANSPORT_OPERATIONS.md'
      - 'package.json'
      - 'tests/fixtures/asoiaf-answer-desk-fixture.ts'
      - 'tests/fixtures/emit-asoiaf-answer-desk-transport-input.ts'
      - 'tests/fixtures/emit-asoiaf-answer-desk-transport-operations-input.ts'
      - 'tests/narrative/canon/asoiaf-answer-desk-transport-operations.test.ts'
      - 'tests/narrative/canon/asoiaf-answer-desk-transport.test.ts'
      - 'tools/asoiaf-answer-desk-transport-operations.ts'
      - 'tools/lib/asoiaf-answer-desk-transport-operations.ts'
      - 'tools/asoiaf-answer-desk-transport.ts'
      - 'tools/lib/asoiaf-answer-desk-transport.ts'
      - 'tools/asoiaf-answer-desk-exchange.ts'
      - 'tools/lib/asoiaf-answer-desk-exchange.ts'
      - 'tools/asoiaf-answer-desk-worker.ts'
      - 'tools/lib/asoiaf-answer-desk-worker.ts'
      - 'tools/asoiaf-answer-desk-estate.ts'
      - 'tools/lib/asoiaf-answer-desk-estate.ts'
      - 'tools/lib/asoiaf-answer-work-lease.ts'
      - 'tools/lib/asoiaf-answer-work-order.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asoiaf-answer-desk-transport-operations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    if: github.repository == 'BigBirdReturns/axm-arc'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact operations candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          show-progress: false

      - name: Record exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          printf '%s\n' "$candidate_sha"
          echo "CANDIDATE_SHA=$candidate_sha" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify permanent operations operator registration
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent asoiaf:answer-transport-operations -- help \
            | tee "$RUNNER_TEMP/operations-help.txt"
          grep -q 'ASOIAF answer-desk transport operations' "$RUNNER_TEMP/operations-help.txt"
          for command in \
            admit-certificate retire-certificate advertise probe resolve \
            issue admit status verify paths; do
            grep -q "$command" "$RUNNER_TEMP/operations-help.txt"
          done

      - name: Strict TypeScript
        id: typecheck
        shell: bash
        run: |
          set -euo pipefail
          find src tests tools \( -name '*.js' -o -name '*.js.map' -o -name '*.d.ts' \) -delete
          rm -f tsconfig.tsbuildinfo
          npm run typecheck | tee "$RUNNER_TEMP/typecheck.log"

      - name: Focused operations and complete answer-desk stack qualification
        id: focused
        shell: bash
        run: |
          set -euo pipefail
          npm test -- \
            tests/narrative/canon/asoiaf-answer-desk-transport-operations.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-transport.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-exchange.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-worker.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-estate.test.ts \
            tests/narrative/canon/asoiaf-answer-work-lease.test.ts \
            tests/narrative/canon/asoiaf-answer-work-order.test.ts \
            tests/narrative/canon/asoiaf-reviewed-answer-packet.test.ts \
            tests/narrative/canon/asoiaf-research-question-dossier.test.ts \
            tests/narrative/canon/asoiaf-external-reconciliation-packets.test.ts \
            | tee "$RUNNER_TEMP/focused-tests.log"

      - name: Exercise certificate rotation, pinned rendezvous, dispatch, and offline replay
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          find src tests tools \( -name '*.js' -o -name '*.js.map' -o -name '*.d.ts' \) -delete
          rm -f tsconfig.tsbuildinfo
          node node_modules/vite-node/vite-node.mjs \
            tests/fixtures/emit-asoiaf-answer-desk-transport-operations-input.ts \
            --emit-qualification-shell \
            "$RUNNER_TEMP/asoiaf-answer-desk-transport-operations-qualification.sh"
          bash "$RUNNER_TEMP/asoiaf-answer-desk-transport-operations-qualification.sh" \
            | tee "$RUNNER_TEMP/operations-smoke.log"

      - name: Complete Arc regression
        id: regression
        shell: bash
        run: |
          set -euo pipefail
          find src tests tools \( -name '*.js' -o -name '*.js.map' -o -name '*.d.ts' \) -delete
          rm -f tsconfig.tsbuildinfo
          npm test | tee "$RUNNER_TEMP/full-tests.log"

      - name: Production build
        id: build
        shell: bash
        run: |
          set -euo pipefail
          npm run build | tee "$RUNNER_TEMP/build.log"

      - name: Retain exact operations qualification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root='asoiaf-answer-desk-transport-operations-qualification'
          mkdir -p "$root/logs" "$root/receipts"

          for file in \
            operations-help.txt typecheck.log focused-tests.log operations-smoke.log \
            full-tests.log build.log; do
            if test -f "$RUNNER_TEMP/$file"; then
              cp "$RUNNER_TEMP/$file" "$root/logs/"
            fi
          done

          find "$RUNNER_TEMP" -maxdepth 1 -type f \
            \( -name '*.json' -o -name '*.stdout' -o -name '*.stderr' \) \
            -print0 \
            | sort -z \
            | while IFS= read -r -d '' file; do
                cp "$file" "$root/receipts/$(basename "$file")"
              done

          if test -f "$RUNNER_TEMP/answer-transport-operations-fixture/expected.json"; then
            cp "$RUNNER_TEMP/answer-transport-operations-fixture/expected.json" \
              "$root/receipts/expected.json"
          fi
          if test -d "$RUNNER_TEMP/answer-desk"; then
            cp -R "$RUNNER_TEMP/answer-desk" "$root/estate"
          fi

          printf '%s\n' "$CANDIDATE_SHA" > "$root/candidate-sha.txt"
          printf '%s\n' \
            'certificateIssuanceAuthority=none' \
            'certificateBytesRetained=false' \
            'privateKeyBytesRetained=false' \
            'clientCertificateAdmissions=3' \
            'serverCertificateAdmissions=1' \
            'certificateRetirements=1' \
            'lowerTransportRevocations=1' \
            'endpointLeases=1' \
            'availabilityObservations=2' \
            'selectedRendezvous=2' \
            'liveDispatches=4' \
            'offlineDispatchReplays=2' \
            'automaticInvocations=1' \
            'automaticResults=1' \
            'workOrders=3' \
            'leases=3' \
            'settlements=3' \
            'automaticFailover=false' \
            'sourceTextIncluded=false' \
            'privateTextIncluded=false' \
            'authority=none' \
            'graphEffect=none' \
            'canonEffect=none' \
            'answerEffect=none' \
            > "$root/qualification-boundary.txt"

          if find "$root" -type f \
            \( -name '*.key' -o -name '*.crt' -o -name '*.pem' -o -name '*.csr' \) \
            | grep -q .; then
            echo 'qualification artifact contains certificate or private-key paths' >&2
            exit 1
          fi
          if grep -R -I -E \
            -- '-----BEGIN (CERTIFICATE|PRIVATE KEY|RSA PRIVATE KEY|EC PRIVATE KEY|CERTIFICATE REQUEST)-----' \
            "$root"; then
            echo 'qualification artifact contains certificate, CSR, or private-key PEM material' >&2
            exit 1
          fi

          ROOT="$root" node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.env.ROOT;
          if (!root) throw new Error('qualification root is required');
          const receipts = path.join(root, 'receipts');
          const read = (name) => JSON.parse(fs.readFileSync(path.join(receipts, name), 'utf8'));
          const required = [
            'operations-status.json',
            'operations-verification.json',
            'transport-status.json',
            'exchange-status.json',
            'worker-status.json',
            'desk-status.json',
          ];
          for (const name of required) {
            if (!fs.existsSync(path.join(receipts, name))) {
              throw new Error(`qualification receipt missing ${name}`);
            }
          }
          const operations = read('operations-status.json');
          const verification = read('operations-verification.json');
          const transport = read('transport-status.json');
          const exchange = read('exchange-status.json');
          const worker = read('worker-status.json');
          const desk = read('desk-status.json');
          const summary = {
            format: 'axm-asoiaf-answer-transport-operations-qualification-summary/1',
            candidateSha: fs.readFileSync(path.join(root, 'candidate-sha.txt'), 'utf8').trim(),
            operations: operations.counts,
            operationsVerification: verification.counts,
            transport: transport.counts,
            exchange: exchange.counts,
            worker: worker.counts,
            desk: desk.counts,
            nextAvailableItemId: desk.state.nextAvailableItemId,
            availableItemIds: desk.state.availableItemIds,
          };
          if (verification.ok !== true || verification.counts.errors !== 0 || verification.counts.warnings !== 0) {
            throw new Error('operations verifier did not return a clean terminal result');
          }
          if (desk.state.nextAvailableItemId !== null || desk.state.availableItemIds.length !== 0) {
            throw new Error('answer desk retained available work after operations qualification');
          }
          fs.writeFileSync(path.join(root, 'qualification-summary.json'), `${JSON.stringify(summary, null, 2)}\n`);
          NODE

          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" \
            > "$root/SHA256SUMS"

      - name: Upload operations qualification
        if: always()
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-answer-desk-transport-operations-qualification
          path: asoiaf-answer-desk-transport-operations-qualification
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
          overwrite: false

      - name: Publish exact qualification summary
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## ASOIAF answer desk transport operations qualification'
            echo
            echo "- Candidate: \`$CANDIDATE_SHA\`"
            echo "- Artifact: \`${ARTIFACT_ID:-not-issued}\`"
            echo "- Artifact digest: \`${ARTIFACT_DIGEST:-not-issued}\`"
            echo '- Certificate lifecycle: four admitted leaves, exact successor replay, one predecessor retirement, and one lower transport revocation.'
            echo '- Availability: one pinned endpoint, two real mutual-TLS observations, and two deterministic client-specific rendezvous records.'
            echo '- Dispatch: four live remote transitions and two local replays after transport-process loss.'
            echo '- Authority: certificate and endpoint operations retained no task, graph, canon, or answer authority and no certificate or key material.'
          } >> "$GITHUB_STEP_SUMMARY"
