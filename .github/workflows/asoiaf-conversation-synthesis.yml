name: ASOIAF conversation synthesis

on:
  pull_request:
    paths:
      - 'src/narrative/canon/recall/**'
      - 'src/narrative/canon/asoiaf/recall/**'
      - 'src/narrative/canon/index.ts'
      - 'tests/narrative/canon/asoiaf-conversation-synthesis.test.ts'
      - 'docs/ASOIAF_CONVERSATION_SYNTHESIS.md'
      - '.github/workflows/asoiaf-conversation-synthesis.yml'
  push:
    branches:
      - feature/asoiaf-conversation-synthesis-v1
    paths:
      - 'src/narrative/canon/recall/**'
      - 'src/narrative/canon/asoiaf/recall/**'
      - 'src/narrative/canon/index.ts'
      - 'tests/narrative/canon/asoiaf-conversation-synthesis.test.ts'
      - 'docs/ASOIAF_CONVERSATION_SYNTHESIS.md'
      - '.github/workflows/asoiaf-conversation-synthesis.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          show-progress: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Strict TypeScript
        run: npm run typecheck | tee "$RUNNER_TEMP/typecheck.log"

      - name: Focused conversation-synthesis qualification
        run: |
          set -euo pipefail
          npm test -- tests/narrative/canon/asoiaf-conversation-synthesis.test.ts \
            | tee "$RUNNER_TEMP/focused-tests.log"

      - name: Complete Arc regression
        run: npm test | tee "$RUNNER_TEMP/full-tests.log"

      - name: Production build
        run: npm run build | tee "$RUNNER_TEMP/build.log"

      - name: Retain exact qualification receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root='asoiaf-conversation-synthesis-qualification'
          mkdir -p "$root"
          cp "$RUNNER_TEMP"/*.log "$root/" 2>/dev/null || true
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' \
            > "$root/candidate-sha.txt"
          printf '%s\n' \
            'authority=none' \
            'compilationEligible=false' \
            'generatedBy=conversation-synthesis' \
            'knowledgeCutoff=2026-08' \
            'conversationSourceHints=CHAT-HOTD-VARYS-RHLLOR,CHAT-ASOIAF-ENDGAME-BIBLE' \
            'modelRecallCandidateCount=726' \
            'conversationCandidateCount=79' \
            'combinedCandidateCount=805' \
            > "$root/authority-boundary.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" \
            > "$root/SHA256SUMS"

      - name: Upload qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-conversation-synthesis-qualification
          path: asoiaf-conversation-synthesis-qualification
          if-no-files-found: error
          retention-days: 30
