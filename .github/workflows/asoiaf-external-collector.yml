name: ASOIAF external collector

on:
  pull_request:
    paths:
      - 'tools/lib/asoiaf-external-*.ts'
      - 'tools/asoiaf-external-collector.ts'
      - 'tests/narrative/canon/asoiaf-external-collector.test.ts'
      - 'docs/ASOIAF_EXTERNAL_COLLECTOR.md'
      - 'package.json'
      - '.github/workflows/asoiaf-external-collector.yml'
  push:
    branches:
      - feature/asoiaf-external-collector-v1
    paths:
      - 'tools/lib/asoiaf-external-*.ts'
      - 'tools/asoiaf-external-collector.ts'
      - 'tests/narrative/canon/asoiaf-external-collector.test.ts'
      - 'docs/ASOIAF_EXTERNAL_COLLECTOR.md'
      - 'package.json'
      - '.github/workflows/asoiaf-external-collector.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact collector candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          show-progress: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Strict TypeScript
        run: npm run typecheck | tee "$RUNNER_TEMP/typecheck.log"

      - name: Focused collector qualification
        run: |
          set -euo pipefail
          npm test -- tests/narrative/canon/asoiaf-external-collector.test.ts \
            | tee "$RUNNER_TEMP/focused-tests.log"

      - name: Collector CLI smoke estate
        shell: bash
        run: |
          set -euo pipefail
          estate="$RUNNER_TEMP/collector-estate"
          npm run asoiaf:external:collector -- init --root "$estate" \
            | tee "$RUNNER_TEMP/collector-init.log"
          npm run asoiaf:external:collector -- status --root "$estate" \
            | tee "$RUNNER_TEMP/collector-status.log"
          npm run asoiaf:external:collector -- verify --root "$estate" \
            | tee "$RUNNER_TEMP/collector-verify.log"
          npm run asoiaf:external:collector -- receipt --root "$estate" \
            --out "$RUNNER_TEMP/asoiaf-external-collector-receipt.json" \
            | tee "$RUNNER_TEMP/collector-receipt.log"
          test "$(jq -r '.sourceCount' "$RUNNER_TEMP/collector-status.log" | tail -1)" = '219' || \
            grep -q '"sourceCount": 219' "$RUNNER_TEMP/collector-status.log"
          grep -q '"ok": true' "$RUNNER_TEMP/collector-verify.log"

      - name: Complete Arc regression
        run: npm test | tee "$RUNNER_TEMP/full-tests.log"

      - name: Production build
        run: npm run build | tee "$RUNNER_TEMP/build.log"

      - name: Retain exact collector qualification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root='asoiaf-external-collector-qualification'
          mkdir -p "$root"
          cp "$RUNNER_TEMP"/*.log "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP/asoiaf-external-collector-receipt.json" "$root/" 2>/dev/null || true
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' \
            > "$root/candidate-sha.txt"
          printf '%s\n' \
            'sourceLedgerRows=219' \
            'graphEffect=none' \
            'canonEffect=none' \
            'promotionStatus=intake-only' \
            'networkConcurrency=1' \
            'hostDelayMs=1500' \
            'retryAfter=true' \
            'localPayloadRetention=false' \
            'publicCredit=cc-by,cc-by-sa' \
            > "$root/collector-boundary.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" \
            > "$root/SHA256SUMS"

      - name: Upload collector qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-external-collector-qualification
          path: asoiaf-external-collector-qualification
          if-no-files-found: error
          retention-days: 30
