name: ASOIAF external reconciliation packets

on:
  pull_request:
    paths:
      - 'src/narrative/canon/asoiaf/external/reconciliation-packets.ts'
      - 'src/narrative/canon/asoiaf/external/index.ts'
      - 'tests/narrative/canon/asoiaf-external-reconciliation-packets.test.ts'
      - 'docs/ASOIAF_EXTERNAL_RECONCILIATION_PACKETS.md'
      - '.github/workflows/asoiaf-external-reconciliation-packets.yml'
  push:
    branches:
      - feature/asoiaf-external-reconciliation-packets-v1
    paths:
      - 'src/narrative/canon/asoiaf/external/reconciliation-packets.ts'
      - 'src/narrative/canon/asoiaf/external/index.ts'
      - 'tests/narrative/canon/asoiaf-external-reconciliation-packets.test.ts'
      - 'docs/ASOIAF_EXTERNAL_RECONCILIATION_PACKETS.md'
      - '.github/workflows/asoiaf-external-reconciliation-packets.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact packet candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          show-progress: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Strict TypeScript
        run: npm run typecheck | tee "$RUNNER_TEMP/typecheck.log"

      - name: Focused packet qualification
        run: |
          set -euo pipefail
          npm test -- tests/narrative/canon/asoiaf-external-reconciliation-packets.test.ts \
            | tee "$RUNNER_TEMP/focused-tests.log"

      - name: Complete Arc regression
        run: npm test | tee "$RUNNER_TEMP/full-tests.log"

      - name: Production build
        run: npm run build | tee "$RUNNER_TEMP/build.log"

      - name: Retain exact packet qualification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root='asoiaf-external-reconciliation-packets-qualification'
          mkdir -p "$root"
          cp "$RUNNER_TEMP"/*.log "$root/" 2>/dev/null || true
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' \
            > "$root/candidate-sha.txt"
          printf '%s\n' \
            'collectorPromotionStatus=reviewed-required' \
            'graphEffect=none-before-compile' \
            'canonEffect=none-before-compile' \
            'rightsReview=named-required' \
            'exactLocator=required' \
            'decisionReviewer=same-as-observation-reviewer' \
            'communityStanding=supporting-only' \
            'discussionStanding=provenance-only' \
            'analogueStanding=constraint-only' \
            'decisionActions=confirm,correct,split,merge,reject,defer' \
            > "$root/packet-boundary.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" \
            > "$root/SHA256SUMS"

      - name: Upload packet qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-external-reconciliation-packets-qualification
          path: asoiaf-external-reconciliation-packets-qualification
          if-no-files-found: error
          retention-days: 30
