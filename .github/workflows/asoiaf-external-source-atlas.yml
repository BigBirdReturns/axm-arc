name: ASOIAF external source atlas

on:
  pull_request:
    paths:
      - 'src/narrative/canon/asoiaf/external/**'
      - 'src/narrative/canon/index.ts'
      - 'tests/narrative/canon/asoiaf-external-*.test.ts'
      - 'tools/emit-asoiaf-external-atlas.ts'
      - 'docs/ASOIAF_EXTERNAL_SOURCE_ATLAS.md'
      - '.github/workflows/asoiaf-external-source-atlas.yml'
  push:
    branches:
      - feature/asoiaf-external-source-atlas-v1
    paths:
      - 'src/narrative/canon/asoiaf/external/**'
      - 'src/narrative/canon/index.ts'
      - 'tests/narrative/canon/asoiaf-external-*.test.ts'
      - 'tools/emit-asoiaf-external-atlas.ts'
      - 'docs/ASOIAF_EXTERNAL_SOURCE_ATLAS.md'
      - '.github/workflows/asoiaf-external-source-atlas.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          show-progress: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Strict TypeScript
        run: npm run typecheck | tee "$RUNNER_TEMP/typecheck.log"

      - name: Focused atlas qualification
        run: |
          set -euo pipefail
          npm test -- \
            tests/narrative/canon/asoiaf-external-source-atlas.test.ts \
            tests/narrative/canon/asoiaf-external-provenance.test.ts \
            | tee "$RUNNER_TEMP/focused-tests.log"

      - name: Emit deterministic atlas receipt
        run: |
          set -euo pipefail
          npx vite-node tools/emit-asoiaf-external-atlas.ts \
            "$RUNNER_TEMP/asoiaf-external-source-atlas-receipt.json" \
            | tee "$RUNNER_TEMP/emit-receipt.log"

      - name: Complete Arc regression
        run: npm test | tee "$RUNNER_TEMP/full-tests.log"

      - name: Production build
        run: npm run build | tee "$RUNNER_TEMP/build.log"

      - name: Retain exact qualification receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root='asoiaf-external-source-atlas-qualification'
          mkdir -p "$root"
          cp "$RUNNER_TEMP"/*.log "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP/asoiaf-external-source-atlas-receipt.json" "$root/" 2>/dev/null || true
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' \
            > "$root/candidate-sha.txt"
          printf '%s\n' \
            'authority=source-specific' \
            'graphEffect=none' \
            'canonEffect=none' \
            'promotion=separate-human-reviewed-reconciliation' \
            'sourceCount=219' \
            'laneCount=45' \
            'workOrderCount=219' \
            'sourceLaneEdgeCount=510' \
            'heldCandidateCount=805' \
            'lineage=BigBirdReturns/clifford-number,BigBirdReturns/undercast' \
            > "$root/authority-boundary.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" \
            > "$root/SHA256SUMS"

      - name: Upload qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-external-source-atlas-qualification
          path: asoiaf-external-source-atlas-qualification
          if-no-files-found: error
          retention-days: 30
