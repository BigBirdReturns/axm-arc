name: ASOIAF external source health

on:
  schedule:
    - cron: '23 11 * * 1'
  pull_request:
    paths:
      - 'tools/lib/asoiaf-external-source-health.ts'
      - 'tools/asoiaf-external-source-health.ts'
      - 'tests/narrative/canon/asoiaf-external-source-health.test.ts'
      - 'docs/ASOIAF_EXTERNAL_SOURCE_HEALTH.md'
      - '.github/workflows/asoiaf-external-source-health.yml'
  push:
    branches:
      - feature/asoiaf-external-source-health-v1
    paths:
      - 'tools/lib/asoiaf-external-source-health.ts'
      - 'tools/asoiaf-external-source-health.ts'
      - 'tests/narrative/canon/asoiaf-external-source-health.test.ts'
      - 'docs/ASOIAF_EXTERNAL_SOURCE_HEALTH.md'
      - '.github/workflows/asoiaf-external-source-health.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact health candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          show-progress: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Strict TypeScript
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck | tee "$RUNNER_TEMP/typecheck.log"

      - name: Focused source-health qualification
        shell: bash
        run: |
          set -euo pipefail
          npm test -- tests/narrative/canon/asoiaf-external-source-health.test.ts \
            | tee "$RUNNER_TEMP/focused-tests.log"

      - name: Read-only health smoke estate
        shell: bash
        run: |
          set -euo pipefail
          estate="$RUNNER_TEMP/source-health-estate"
          npx vite-node tools/asoiaf-external-source-health.ts -- \
            init --root "$estate" --at 2026-08-04T00:00:00.000Z \
            | tee "$RUNNER_TEMP/health-init.log"
          npx vite-node tools/asoiaf-external-source-health.ts -- \
            report --root "$estate" --at 2026-08-04T00:00:00.000Z --limit 40 \
            | tee "$RUNNER_TEMP/health-report.log"
          npx vite-node tools/asoiaf-external-source-health.ts -- \
            verify --root "$estate" --at 2026-08-04T00:00:00.000Z \
            | tee "$RUNNER_TEMP/health-verify.log"
          npx vite-node tools/asoiaf-external-source-health.ts -- \
            receipt --root "$estate" --at 2026-08-04T00:00:00.000Z \
            --out "$RUNNER_TEMP/asoiaf-external-source-health-receipt.json" \
            | tee "$RUNNER_TEMP/health-receipt.log"
          grep -q '"ok": true' "$RUNNER_TEMP/health-verify.log"
          test "$(jq -r '.sourceCount' "$estate/SOURCE-HEALTH.json")" = '219'
          cp "$estate/SOURCE-HEALTH.json" "$RUNNER_TEMP/"
          cp "$estate/SOURCE-HEALTH.md" "$RUNNER_TEMP/"
          cp "$estate/refresh-plan.json" "$RUNNER_TEMP/"

      - name: Complete Arc regression
        shell: bash
        run: |
          set -euo pipefail
          npm test | tee "$RUNNER_TEMP/full-tests.log"

      - name: Production build
        shell: bash
        run: |
          set -euo pipefail
          npm run build | tee "$RUNNER_TEMP/build.log"

      - name: Retain exact source-health qualification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root='asoiaf-external-source-health-qualification'
          mkdir -p "$root"
          cp "$RUNNER_TEMP"/*.log "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP/SOURCE-HEALTH.json" "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP/SOURCE-HEALTH.md" "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP/refresh-plan.json" "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP/asoiaf-external-source-health-receipt.json" "$root/" 2>/dev/null || true
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' \
            > "$root/candidate-sha.txt"
          printf '%s\n' \
            'sourceLedgerRows=219' \
            'repositoryPermission=contents-read' \
            'repositoryMutation=false' \
            'graphEffect=none' \
            'canonEffect=none' \
            'routeObservation=append-only' \
            'rightsReview=named-queue' \
            'cacheParity=required' \
            'creditParity=required' \
            > "$root/source-health-boundary.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" \
            > "$root/SHA256SUMS"

      - name: Upload source-health qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-external-source-health-qualification
          path: asoiaf-external-source-health-qualification
          if-no-files-found: error
          retention-days: 30
