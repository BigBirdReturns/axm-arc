name: Trace private ASOIAF v4.1 archive lineage

on:
  push:
    branches:
      - "recovery/asoiaf-private-v4.1-lineage-v1"
    paths:
      - ".recovery/ASOIAF_PRIVATE_V4_1_LINEAGE_READY"

permissions:
  actions: read
  contents: write

concurrency:
  group: axm-arc-asoiaf-private-v4-1-lineage-v1
  cancel-in-progress: false

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch all reachable branch, tag, and pull-request lineage
        shell: bash
        run: |
          set -euo pipefail
          test -f .recovery/ASOIAF_PRIVATE_V4_1_LINEAGE_READY
          git fetch --quiet origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*' \
            '+refs/pull/*/head:refs/remotes/pull/*/head' || true
          root="$RUNNER_TEMP/asoiaf-private-v4.1-lineage-v1"
          mkdir -p "$root/logs"
          printf 'LINEAGE_ROOT=%s\n' "$root" >> "$GITHUB_ENV"

      - name: Search exact strings across reachable Git history
        shell: bash
        run: |
          set -euo pipefail
          root="$LINEAGE_ROOT"
          : > "$root/git-string-lineage.txt"
          for needle in \
            'asoiaf-private-world-estate-v4.1.tar.zst' \
            '48428ec5630971e75d0f9e0075b4d7fecacdfd2e61efc516ed01c3aaa17fb9d7' \
            'asoiaf-fourth-generation-dragon-frontier-renewal-v1.tar.zst' \
            'a3df744e910e8d1e20606e773024911182378b3e91e5eab9fca04f991f5a3b02'; do
            printf '### %s\n' "$needle" >> "$root/git-string-lineage.txt"
            git log --all --date=iso-strict --format='commit=%H date=%aI subject=%s' -S "$needle" --name-status -- . \
              >> "$root/git-string-lineage.txt" 2>/dev/null || true
          done
          git rev-list --all --objects > "$root/reachable-objects.txt"
          python - "$root/reachable-objects.txt" "$root/git-blob-matches.json" <<'PY'
          from __future__ import annotations
          import hashlib,json,pathlib,subprocess,sys
          targets={
            'privateWorldEstateV4_1':{'filename':'asoiaf-private-world-estate-v4.1.tar.zst','bytes':244_436_743,'sha256':'48428ec5630971e75d0f9e0075b4d7fecacdfd2e61efc516ed01c3aaa17fb9d7'},
            'fourthGenerationDragonFrontier':{'filename':'asoiaf-fourth-generation-dragon-frontier-renewal-v1.tar.zst','bytes':249_906,'sha256':'a3df744e910e8d1e20606e773024911182378b3e91e5eab9fca04f991f5a3b02'},
          }
          rows=[]
          for line in pathlib.Path(sys.argv[1]).read_text().splitlines():
              oid,*rest=line.split(' ',1);name=rest[0] if rest else ''
              filename_match=any(pathlib.PurePosixPath(name).name==t['filename'] for t in targets.values())
              try:
                  kind=subprocess.check_output(['git','cat-file','-t',oid],text=True,stderr=subprocess.DEVNULL).strip()
                  if kind!='blob':continue
                  size=int(subprocess.check_output(['git','cat-file','-s',oid],text=True,stderr=subprocess.DEVNULL).strip())
              except Exception:continue
              candidates=[(target_id,t) for target_id,t in targets.items() if filename_match or size==t['bytes']]
              if not candidates:continue
              digest=None
              for target_id,target in candidates:
                  if size==target['bytes']:
                      data=subprocess.check_output(['git','cat-file','blob',oid])
                      digest=hashlib.sha256(data).hexdigest()
                  rows.append({'target':target_id,'object':oid,'path':name or None,'bytes':size,'sha256':digest,'exact':size==target['bytes'] and digest==target['sha256']})
          pathlib.Path(sys.argv[2]).write_text(json.dumps(rows,indent=2)+'\n')
          PY

      - name: Inventory all retained and expired Actions artifacts and runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$LINEAGE_ROOT"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | {id,name,size_in_bytes,expired,created_at,updated_at,expires_at,workflow_run}' \
            > "$root/artifacts.ndjson"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | {id,name,path,event,status,conclusion,head_branch,head_sha,run_number,run_attempt,created_at,updated_at,html_url}' \
            > "$root/runs.ndjson"
          python - "$root/artifacts.ndjson" "$root/runs.ndjson" "$root/relevant-runs.tsv" "$root/artifact-lineage.json" <<'PY'
          from __future__ import annotations
          import json,pathlib,re,sys
          targets={
            'privateWorldEstateV4_1':{'filename':'asoiaf-private-world-estate-v4.1.tar.zst','bytes':244_436_743,'sha256':'48428ec5630971e75d0f9e0075b4d7fecacdfd2e61efc516ed01c3aaa17fb9d7'},
            'fourthGenerationDragonFrontier':{'filename':'asoiaf-fourth-generation-dragon-frontier-renewal-v1.tar.zst','bytes':249_906,'sha256':'a3df744e910e8d1e20606e773024911182378b3e91e5eab9fca04f991f5a3b02'},
          }
          artifacts=[json.loads(line) for line in pathlib.Path(sys.argv[1]).read_text().splitlines() if line.strip()]
          runs=[json.loads(line) for line in pathlib.Path(sys.argv[2]).read_text().splitlines() if line.strip()]
          artifact_rows=[];run_ids=set()
          for artifact in artifacts:
              name=artifact.get('name','');size=int(artifact.get('size_in_bytes') or 0);run=(artifact.get('workflow_run') or {}).get('id')
              reasons=[]
              for target_id,target in targets.items():
                  if target['filename'].lower() in name.lower():reasons.append(f'{target_id}:filename')
                  if abs(size-target['bytes'])<=8_000_000:reasons.append(f'{target_id}:size-near')
              if re.search(r'(asoiaf|dragon|estate|world|private|archive|source|export|corpus|continuation|frontier)',name,re.I):reasons.append('semantic-name')
              if reasons:
                  artifact_rows.append({**artifact,'reasons':reasons})
                  if run:run_ids.add(int(run))
          relevant=[]
          for run in runs:
              hay=' '.join(str(run.get(key) or '') for key in ('name','path','head_branch'))
              reasons=[]
              if int(run.get('id') or 0) in run_ids:reasons.append('artifact-linked')
              if re.search(r'(asoiaf|dragon|estate|world|private|archive|source|export|corpus|continuation|frontier)',hay,re.I):reasons.append('semantic-run')
              if reasons:relevant.append({**run,'reasons':reasons})
          relevant.sort(key=lambda row:row.get('created_at',''),reverse=True)
          with pathlib.Path(sys.argv[3]).open('w') as fh:
              for run in relevant[:400]:fh.write(f"{run['id']}\t{run.get('name','')}\t{run.get('path','')}\t{run.get('head_branch','')}\t{run.get('run_attempt',1)}\n")
          pathlib.Path(sys.argv[4]).write_text(json.dumps({'artifacts':artifact_rows,'relevantRuns':relevant},indent=2)+'\n')
          PY

      - name: Scan bounded workflow logs for exact archive lineage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$LINEAGE_ROOT"
          : > "$root/log-download-ledger.tsv"
          count=0
          while IFS=$'\t' read -r run name path branch attempt; do
            [ -n "$run" ] || continue
            count=$((count+1))
            if [ "$count" -gt 260 ]; then break; fi
            target="$root/logs/run-$run.zip"
            http="$(curl -L --silent --show-error --output "$target" --write-out '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run/logs" || true)"
            if [ "$http" = '200' ] && [ -s "$target" ]; then
              printf '%s\tPASS\t%s\t%s\t%s\n' "$run" "$(wc -c < "$target")" "$name" "$path" >> "$root/log-download-ledger.tsv"
            else
              rm -f "$target"
              printf '%s\tFAIL\t%s\t%s\t%s\n' "$run" "$http" "$name" "$path" >> "$root/log-download-ledger.tsv"
            fi
          done < "$root/relevant-runs.tsv"
          python - <<'PY'
          from __future__ import annotations
          import hashlib,json,os,pathlib,re,zipfile
          root=pathlib.Path(os.environ['LINEAGE_ROOT'])
          needles={
            'private_filename':'asoiaf-private-world-estate-v4.1.tar.zst',
            'private_sha256':'48428ec5630971e75d0f9e0075b4d7fecacdfd2e61efc516ed01c3aaa17fb9d7',
            'frontier_filename':'asoiaf-fourth-generation-dragon-frontier-renewal-v1.tar.zst',
            'frontier_sha256':'a3df744e910e8d1e20606e773024911182378b3e91e5eab9fca04f991f5a3b02',
          }
          matches=[];errors=[];scanned=0
          for path in sorted((root/'logs').glob('run-*.zip')):
              run=int(path.stem.split('-')[-1])
              try:
                  with zipfile.ZipFile(path) as archive:
                      for member in archive.infolist():
                          if member.is_dir():continue
                          data=archive.read(member);scanned+=1
                          text=data.decode('utf-8','replace')
                          for key,needle in needles.items():
                              positions=[m.start() for m in re.finditer(re.escape(needle),text,re.I)]
                              for position in positions[:20]:
                                  start=max(0,position-500);end=min(len(text),position+len(needle)+500)
                                  excerpt=re.sub(r'(?i)(authorization: bearer|token=|gh_token=|github_token=)[^\s]+',r'\1<redacted>',text[start:end])
                                  matches.append({'runId':run,'logMember':member.filename,'needle':key,'position':position,'contextSha256':hashlib.sha256(excerpt.encode()).hexdigest(),'context':excerpt})
              except Exception as exc:errors.append({'runId':run,'error':repr(exc)})
          (root/'log-lineage.json').write_text(json.dumps({'scannedLogMembers':scanned,'matches':matches,'errors':errors},indent=2)+'\n')
          for path in (root/'logs').glob('*'):path.unlink(missing_ok=True)
          PY
          test ! -n "$(find "$LINEAGE_ROOT/logs" -type f -print -quit)"

      - name: Reconcile lineage without rerunning historical side effects
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import json,os,pathlib,re
          root=pathlib.Path(os.environ['LINEAGE_ROOT'])
          git_blobs=json.loads((root/'git-blob-matches.json').read_text())
          artifacts=json.loads((root/'artifact-lineage.json').read_text())
          logs=json.loads((root/'log-lineage.json').read_text())
          exact_blobs=[row for row in git_blobs if row.get('exact')]
          target_evidence={'privateWorldEstateV4_1':[],'fourthGenerationDragonFrontier':[]}
          for row in exact_blobs:target_evidence[row['target']].append({'class':'exact-git-blob',**row})
          for row in artifacts.get('artifacts',[]):
              for reason in row.get('reasons',[]):
                  target=reason.split(':',1)[0]
                  if target in target_evidence:target_evidence[target].append({'class':'artifact-metadata','reason':reason,**row})
          for row in logs.get('matches',[]):
              target='privateWorldEstateV4_1' if row['needle'].startswith('private_') else 'fourthGenerationDragonFrontier'
              target_evidence[target].append({'class':'workflow-log-lineage',**row})
          rerun_candidates=[]
          for run in artifacts.get('relevantRuns',[]):
              evidence=[]
              for target,items in target_evidence.items():
                  if any(item.get('runId')==run.get('id') or (item.get('workflow_run') or {}).get('id')==run.get('id') for item in items):evidence.append(target)
              if not evidence:continue
              hay=' '.join(str(run.get(key) or '') for key in ('name','path','head_branch')).lower()
              safe=bool(re.search(r'(export|archive|receipt|locator|recovery|source)',hay)) and not bool(re.search(r'(deploy|publish|merge|release|production)',hay))
              rerun_candidates.append({'runId':run.get('id'),'name':run.get('name'),'path':run.get('path'),'headBranch':run.get('head_branch'),'runAttempt':run.get('run_attempt'),'evidenceTargets':evidence,'rerunSafetyClass':'candidate-readonly-or-export' if safe else 'manual-review-required'})
          result={target:'exact_git_blob' if any(item['class']=='exact-git-blob' for item in items) else 'lineage_found' if items else 'not_found' for target,items in target_evidence.items()}
          receipt={'format':'axm-asoiaf-private-v4.1-lineage/1','result':'LINEAGE_FOUND' if any(value!='not_found' for value in result.values()) else 'NOT_FOUND','targetResults':result,'targetEvidence':target_evidence,'rerunCandidates':rerun_candidates,'historicalRunsRerun':False,'reasonHistoricalRunsNotRerun':'The locator records evidence first; historical workflows may have write, publication, or deployment side effects and are not replayed without a read-only classification.','privatePayloadRetained':False,'privatePayloadCommitted':False,'canonEffect':'none','graphEffect':'none'}
          out=pathlib.Path('recovery/asoiaf-private-v4.1-lineage-v1');out.mkdir(parents=True,exist_ok=True)
          (out/'LINEAGE_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n')
          report=['# ASOIAF private v4.1 lineage','',f"Terminal: `{receipt['result']}`",'']
          for target,value in result.items():report.append(f'- `{target}`: `{value}`')
          report += ['',f"Rerun candidates: `{len(rerun_candidates)}`",'', 'No historical run was replayed and no private payload was retained or committed.']
          (out/'REPORT.md').write_text('\n'.join(report)+'\n')
          PY
          git diff --check

      - name: Publish lineage receipt
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .recovery
          rm -f .github/workflows/asoiaf-private-v4.1-lineage-v1.yml
          git add -A
          git diff --cached --check
          git config user.name 'BigBirdReturns'
          git config user.email '219768509+BigBirdReturns@users.noreply.github.com'
          git commit -m 'Record private ASOIAF v4.1 archive lineage'
          sha="$(git rev-parse HEAD)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          printf 'published_sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Retain lineage execution receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="$LINEAGE_ROOT"
          printf '%s\n' \
            "candidate=${{ github.sha }}" \
            "published=${{ steps.publish.outputs.published_sha }}" > "$root/terminal.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum | sed "s#  $root/#  #" > "$root/SHA256SUMS" || true

      - name: Upload lineage execution receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axm-arc-asoiaf-private-v4.1-lineage-v1
          path: ${{ runner.temp }}/asoiaf-private-v4.1-lineage-v1
          if-no-files-found: warn
          retention-days: 30
