name: ASOIAF research question dossier

on:
  pull_request:
    paths:
      - 'tools/lib/asoiaf-research-question-dossier.ts'
      - 'tools/asoiaf-research-question-dossier.ts'
      - 'tests/narrative/canon/asoiaf-research-question-dossier.test.ts'
      - 'docs/ASOIAF_RESEARCH_QUESTION_DOSSIER.md'
      - 'package.json'
      - '.github/workflows/asoiaf-research-question-dossier.yml'
  push:
    branches:
      - feature/asoiaf-research-question-dossier-v1
    paths:
      - 'tools/lib/asoiaf-research-question-dossier.ts'
      - 'tools/asoiaf-research-question-dossier.ts'
      - 'tests/narrative/canon/asoiaf-research-question-dossier.test.ts'
      - 'docs/ASOIAF_RESEARCH_QUESTION_DOSSIER.md'
      - 'package.json'
      - '.github/workflows/asoiaf-research-question-dossier.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out exact research-dossier candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          show-progress: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Strict TypeScript
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck | tee "$RUNNER_TEMP/typecheck.log"

      - name: Focused research-dossier qualification
        shell: bash
        run: |
          set -euo pipefail
          npm test -- tests/narrative/canon/asoiaf-research-question-dossier.test.ts \
            | tee "$RUNNER_TEMP/focused-tests.log"

      - name: Text-free operator smoke
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/research-dossier-smoke"
          mkdir -p "$root"
          question='Who is Varys?'

          npm run --silent asoiaf:research-dossier -- route \
            --question "$question" \
            --continuity book-main \
            --lane entity-resolution \
            | tee "$root/route.json"
          test "$(jq -r '.laneIds[0]' "$root/route.json")" = 'entity-resolution'

          cat > "$root/input.json" <<'JSON'
          {
            "questionText": "Who is Varys?",
            "createdBy": "qualification:operator-smoke",
            "createdAt": "2026-08-04T20:30:00.000Z",
            "laneIds": ["entity-resolution"],
            "continuityIds": ["book-main"],
            "gaps": [
              {
                "kind": "private-source-missing",
                "laneId": "entity-resolution",
                "continuityId": "book-main",
                "sourceId": "local-agot",
                "detail": "No holder-controlled edition was mounted in the synthetic operator smoke."
              }
            ]
          }
          JSON

          npm run --silent asoiaf:research-dossier -- build \
            --input "$root/input.json" \
            --out "$root/dossier.json" \
            | tee "$root/build.json"
          npm run --silent asoiaf:research-dossier -- verify \
            --file "$root/dossier.json" \
            | tee "$root/verify.json"

          test "$(jq -r '.ok' "$root/verify.json")" = 'true'
          test "$(jq -r '.question.questionTextRetained' "$root/dossier.json")" = 'false'
          test "$(jq -r '.answerReady' "$root/dossier.json")" = 'false'
          test "$(jq -r '.authority' "$root/dossier.json")" = 'none'
          grep -q '"search-private-edition"' "$root/dossier.json"
          grep -q '"close-gap"' "$root/dossier.json"
          ! grep -Fq "$question" "$root/dossier.json"
          cp "$root/dossier.json" "$RUNNER_TEMP/research-dossier-smoke.json"

      - name: Complete Arc regression
        shell: bash
        run: |
          set -euo pipefail
          npm test | tee "$RUNNER_TEMP/full-tests.log"

      - name: Production build
        shell: bash
        run: |
          set -euo pipefail
          npm run build | tee "$RUNNER_TEMP/build.log"

      - name: Retain exact research-dossier qualification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root='asoiaf-research-question-dossier-qualification'
          mkdir -p "$root"
          cp "$RUNNER_TEMP"/*.log "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP/research-dossier-smoke.json" "$root/" 2>/dev/null || true
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' \
            > "$root/candidate-sha.txt"
          printf '%s\n' \
            'liveNetworkInCI=false' \
            'privateTextReadInCI=false' \
            'questionTextRetained=false' \
            'routeAuthority=none' \
            'privateSearchStanding=navigation-only' \
            'structuredAdmissionStanding=supporting-provenance-constraint-reject-defer' \
            'recallAuthority=none' \
            'gaps=explicit' \
            'evidenceReady=false' \
            'answerReady=false' \
            'graphEffect=none' \
            'canonEffect=none' \
            'answerEffect=none' \
            > "$root/research-dossier-boundary.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" \
            > "$root/SHA256SUMS"

      - name: Upload research-dossier qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-research-question-dossier-qualification
          path: asoiaf-research-question-dossier-qualification
          if-no-files-found: error
          retention-days: 30