name: ASOIAF reviewed answer packet

on:
  pull_request:
    paths:
      - 'tools/lib/asoiaf-reviewed-answer-packet.ts'
      - 'tools/asoiaf-reviewed-answer-packet.ts'
      - 'tests/narrative/canon/asoiaf-reviewed-answer-packet.test.ts'
      - 'tests/fixtures/emit-asoiaf-reviewed-answer-packet-input.ts'
      - 'docs/ASOIAF_REVIEWED_ANSWER_PACKET.md'
      - 'package.json'
      - '.github/workflows/asoiaf-reviewed-answer-packet.yml'
  push:
    branches:
      - feature/asoiaf-reviewed-answer-packet-v1
    paths:
      - 'tools/lib/asoiaf-reviewed-answer-packet.ts'
      - 'tools/asoiaf-reviewed-answer-packet.ts'
      - 'tests/narrative/canon/asoiaf-reviewed-answer-packet.test.ts'
      - 'tests/fixtures/emit-asoiaf-reviewed-answer-packet-input.ts'
      - 'docs/ASOIAF_REVIEWED_ANSWER_PACKET.md'
      - 'package.json'
      - '.github/workflows/asoiaf-reviewed-answer-packet.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out exact reviewed-answer candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          show-progress: false

      - name: Record exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          test -z "$(git status --porcelain)"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Strict TypeScript
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck | tee "$RUNNER_TEMP/typecheck.log"

      - name: Focused answer, dossier, and reconciliation qualification
        shell: bash
        run: |
          set -euo pipefail
          npm test -- \
            tests/narrative/canon/asoiaf-reviewed-answer-packet.test.ts \
            tests/narrative/canon/asoiaf-research-question-dossier.test.ts \
            tests/narrative/canon/asoiaf-external-reconciliation-packets.test.ts \
            | tee "$RUNNER_TEMP/focused-tests.log"

      - name: Build, verify, and render through the operator
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/reviewed-answer-smoke"
          mkdir -p "$root"
          question='What does the exact holder-controlled AGOT evidence establish for this bounded candidate?'

          npx vite-node tests/fixtures/emit-asoiaf-reviewed-answer-packet-input.ts \
            "$root/input.json" \
            | tee "$root/fixture.log"
          npm run --silent asoiaf:reviewed-answer -- build \
            --input "$root/input.json" \
            --out "$root/packet.json" \
            | tee "$root/build.log"
          npm run --silent asoiaf:reviewed-answer -- verify \
            --file "$root/packet.json" \
            | tee "$root/verify.json"
          npm run --silent asoiaf:reviewed-answer -- render \
            --file "$root/packet.json" \
            --out "$root/rendered.txt" \
            | tee "$root/render.json"

          test "$(jq -r '.ok' "$root/verify.json")" = 'true'
          test "$(jq -r '.answerReady' "$root/packet.json")" = 'true'
          test "$(jq -r '.scope' "$root/packet.json")" = 'bounded-complete'
          test "$(jq -r '.renderAuthority' "$root/packet.json")" = 'reviewed-text-only'
          test "$(jq -r '.acquisitionAuthority' "$root/packet.json")" = 'none'
          test "$(jq -r '.reconciliationAuthority' "$root/packet.json")" = 'none'
          test "$(jq -r '.graphEffect' "$root/packet.json")" = 'none'
          test "$(jq -r '.canonEffect' "$root/packet.json")" = 'none'
          test "$(jq -r '.answerEffect' "$root/packet.json")" = 'render-reviewed-packet'
          test "$(jq '.claims | length' "$root/packet.json")" = '1'
          test "$(jq '.transactions | length' "$root/packet.json")" = '1'
          test "$(jq '.limitations | length' "$root/packet.json")" = '0'
          grep -Fq '[local-agot:external-locator:qualification:agot-answer]' \
            "$root/rendered.txt"
          ! grep -Fq "$question" "$root/packet.json"
          test -z "$(git status --porcelain)"

          cp "$root/input.json" "$RUNNER_TEMP/reviewed-answer-input.json"
          cp "$root/packet.json" "$RUNNER_TEMP/reviewed-answer-packet.json"
          cp "$root/rendered.txt" "$RUNNER_TEMP/reviewed-answer-rendered.txt"
          cp "$root/fixture.log" "$RUNNER_TEMP/fixture.log"
          cp "$root/build.log" "$RUNNER_TEMP/operator-build.log"
          cp "$root/verify.json" "$RUNNER_TEMP/operator-verify.json"
          cp "$root/render.json" "$RUNNER_TEMP/operator-render.json"

      - name: Complete Arc regression
        shell: bash
        run: |
          set -euo pipefail
          npm test | tee "$RUNNER_TEMP/full-tests.log"

      - name: Production build
        shell: bash
        run: |
          set -euo pipefail
          npm run build | tee "$RUNNER_TEMP/build.log"

      - name: Retain exact reviewed-answer qualification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root='asoiaf-reviewed-answer-packet-qualification'
          mkdir -p "$root"
          cp "$RUNNER_TEMP"/*.log "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP"/*.json "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP/reviewed-answer-rendered.txt" "$root/" 2>/dev/null || true
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' \
            > "$root/candidate-sha.txt"
          printf '%s\n' \
            'liveNetworkInCI=false' \
            'privateSourceTextReadInCI=false' \
            'dossierAuthority=none' \
            'transactionAdmission=passed-reconciliation-custody' \
            'globalWorkOrderCompletion=not-required' \
            'claimDecision=exact-nondeferred-required' \
            'promotedPrimaryEvidence=required' \
            'exactLocator=required' \
            'dossierCandidateParity=required' \
            'unresolvedGap=closure-or-limitation' \
            'rejectedDeferredReference=limitation-required' \
            'answerReady=reviewed-packet-only' \
            'renderAuthority=reviewed-text-only' \
            'acquisitionAuthority=none' \
            'reconciliationAuthority=none' \
            'graphEffect=none' \
            'canonEffect=none' \
            'answerEffect=render-reviewed-packet' \
            > "$root/reviewed-answer-boundary.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" \
            > "$root/SHA256SUMS"

      - name: Upload reviewed-answer qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-reviewed-answer-packet-qualification
          path: asoiaf-reviewed-answer-packet-qualification
          if-no-files-found: error
          retention-days: 30