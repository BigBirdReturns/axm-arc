name: ASOIAF structured acquisition reconciliation

on:
  pull_request:
    paths:
      - 'tools/lib/asoiaf-structured-acquisition-reconciliation.ts'
      - 'tools/lib/asoiaf-structured-observation-admission.ts'
      - 'tests/narrative/canon/asoiaf-structured-acquisition-reconciliation.test.ts'
      - 'tests/narrative/canon/asoiaf-structured-observation-admission.test.ts'
      - 'src/narrative/canon/asoiaf/external/reconciliation-packets.ts'
      - 'tests/narrative/canon/asoiaf-external-reconciliation-packets.test.ts'
      - 'docs/ASOIAF_STRUCTURED_ACQUISITION_RECONCILIATION.md'
      - '.github/workflows/asoiaf-structured-acquisition-reconciliation.yml'
  push:
    branches:
      - feature/asoiaf-external-reconciliation-packets-v1
    paths:
      - 'tools/lib/asoiaf-structured-acquisition-reconciliation.ts'
      - 'tools/lib/asoiaf-structured-observation-admission.ts'
      - 'tests/narrative/canon/asoiaf-structured-acquisition-reconciliation.test.ts'
      - 'tests/narrative/canon/asoiaf-structured-observation-admission.test.ts'
      - 'src/narrative/canon/asoiaf/external/reconciliation-packets.ts'
      - 'tests/narrative/canon/asoiaf-external-reconciliation-packets.test.ts'
      - 'docs/ASOIAF_STRUCTURED_ACQUISITION_RECONCILIATION.md'
      - '.github/workflows/asoiaf-structured-acquisition-reconciliation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact acquisition-reconciliation candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          show-progress: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Strict TypeScript
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck | tee "$RUNNER_TEMP/typecheck.log"

      - name: Focused acquisition-to-review qualification
        shell: bash
        run: |
          set -euo pipefail
          npm test -- \
            tests/narrative/canon/asoiaf-structured-observation-admission.test.ts \
            tests/narrative/canon/asoiaf-structured-acquisition-reconciliation.test.ts \
            tests/narrative/canon/asoiaf-external-reconciliation-packets.test.ts \
            | tee "$RUNNER_TEMP/focused-tests.log"

      - name: Complete Arc regression
        shell: bash
        run: |
          set -euo pipefail
          npm test | tee "$RUNNER_TEMP/full-tests.log"

      - name: Production build
        shell: bash
        run: |
          set -euo pipefail
          npm run build | tee "$RUNNER_TEMP/build.log"

      - name: Retain exact acquisition-reconciliation qualification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root='asoiaf-structured-acquisition-reconciliation-qualification'
          mkdir -p "$root"
          cp "$RUNNER_TEMP"/*.log "$root/" 2>/dev/null || true
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' \
            > "$root/candidate-sha.txt"
          printf '%s\n' \
            'liveNetworkInCI=false' \
            'signedRequestPlan=required' \
            'registeredEndpoint=required' \
            'credentialBearingHeaders=false' \
            'acquisitionReceiptIdentity=content-addressed' \
            'adapterReceiptFingerprint=required' \
            'rawResponseDigest=required' \
            'rawResponseBytes=required' \
            'rawResponseRetained=false' \
            'normalizedObservationDigest=separate' \
            'reviewedObservationParity=required' \
            'semanticAdmission=fingerprinted-required' \
            'admissionOutcomes=admit-reject-defer' \
            'admissionAuthority=admission-only' \
            'workIdentityEvidence=retained-required' \
            'questionRelevanceEvidence=retained-required' \
            'rightsReview=named-required' \
            'cacheReplay=zero-request-only' \
            'structuredAuthority=supporting-only' \
            'graphEffect=none-before-compile' \
            'canonEffect=none-before-compile' \
            > "$root/acquisition-reconciliation-boundary.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" \
            > "$root/SHA256SUMS"

      - name: Upload acquisition-reconciliation qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-structured-acquisition-reconciliation-qualification
          path: asoiaf-structured-acquisition-reconciliation-qualification
          if-no-files-found: error
          retention-days: 30