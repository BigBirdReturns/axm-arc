name: ASOIAF structured public acquisition

on:
  pull_request:
    paths:
      - 'tools/lib/asoiaf-structured-public-acquisition.ts'
      - 'tools/asoiaf-structured-public-acquisition.ts'
      - 'tools/lib/asoiaf-structured-public-adapters.ts'
      - 'tests/narrative/canon/asoiaf-structured-public-acquisition.test.ts'
      - 'docs/ASOIAF_STRUCTURED_PUBLIC_ACQUISITION.md'
      - 'package.json'
      - '.github/workflows/asoiaf-structured-public-acquisition.yml'
  push:
    branches:
      - feature/asoiaf-structured-public-acquisition-v1
    paths:
      - 'tools/lib/asoiaf-structured-public-acquisition.ts'
      - 'tools/asoiaf-structured-public-acquisition.ts'
      - 'tools/lib/asoiaf-structured-public-adapters.ts'
      - 'tests/narrative/canon/asoiaf-structured-public-acquisition.test.ts'
      - 'docs/ASOIAF_STRUCTURED_PUBLIC_ACQUISITION.md'
      - 'package.json'
      - '.github/workflows/asoiaf-structured-public-acquisition.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact structured-acquisition candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          show-progress: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Strict TypeScript
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck | tee "$RUNNER_TEMP/typecheck.log"

      - name: Focused synthetic acquisition qualification
        shell: bash
        run: |
          set -euo pipefail
          npm test -- tests/narrative/canon/asoiaf-structured-public-acquisition.test.ts \
            | tee "$RUNNER_TEMP/focused-tests.log"

      - name: Operator validation smoke without network access
        shell: bash
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/request-plan.json"
          estate="$RUNNER_TEMP/acquisition-estate"
          npm run --silent asoiaf:structured-adapter -- plan \
            --adapter awoiaf-mediawiki \
            --request-id awoiaf:varys \
            --title Varys \
            > "$plan"
          npm run --silent asoiaf:structured-acquisition -- validate \
            --plan "$plan" \
            | tee "$RUNNER_TEMP/validate.log"
          npm run --silent asoiaf:structured-acquisition -- status \
            --root "$estate" \
            | tee "$RUNNER_TEMP/status.log"
          npm run --silent asoiaf:structured-acquisition -- verify \
            --root "$estate" \
            | tee "$RUNNER_TEMP/verify.log"
          grep -q '"ok": true' "$RUNNER_TEMP/validate.log"
          grep -q '"ok": true' "$RUNNER_TEMP/verify.log"

      - name: Complete Arc regression
        shell: bash
        run: |
          set -euo pipefail
          npm test | tee "$RUNNER_TEMP/full-tests.log"

      - name: Production build
        shell: bash
        run: |
          set -euo pipefail
          npm run build | tee "$RUNNER_TEMP/build.log"

      - name: Retain exact structured-acquisition qualification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root='asoiaf-structured-public-acquisition-qualification'
          mkdir -p "$root"
          cp "$RUNNER_TEMP"/*.log "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP/request-plan.json" "$root/" 2>/dev/null || true
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' \
            > "$root/candidate-sha.txt"
          printf '%s\n' \
            'networkAcquisition=qualified-synthetic-runtime' \
            'liveNetworkInCI=false' \
            'registeredEndpointsOnly=true' \
            'credentialBearingHeaders=false' \
            'robotsRequired=true' \
            'hostDelayFloorMilliseconds=1500' \
            'retryAfterHonored=true' \
            'crossOriginRedirects=false' \
            'responseSizeBounded=true' \
            'rawResponseDigest=raw-bytes-sha256' \
            'rawResponseRetained=false' \
            'normalizedRetention=rights-controlled' \
            'cacheReplay=zero-network' \
            'batchPacer=shared' \
            'graphEffect=none' \
            'canonEffect=none' \
            > "$root/structured-acquisition-boundary.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" \
            > "$root/SHA256SUMS"

      - name: Upload structured-acquisition qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-structured-public-acquisition-qualification
          path: asoiaf-structured-public-acquisition-qualification
          if-no-files-found: error
          retention-days: 30