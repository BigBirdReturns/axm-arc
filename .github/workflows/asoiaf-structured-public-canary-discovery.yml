name: Discover exact ASOIAF live canary runs

on:
  push:
    branches:
      - feature/asoiaf-structured-public-canary-v1
    paths:
      - '.github/workflows/asoiaf-structured-public-canary-discovery.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write

jobs:
  discover:
    if: github.repository == 'BigBirdReturns/axm-arc' && github.ref_name == 'feature/asoiaf-structured-public-canary-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_SHA: 06d3adfd0374036ec15f7b8eb7b2510248c482c1
      TARGET_BRANCH: feature/asoiaf-structured-public-canary-v1
    steps:
      - name: Query repository Actions custody
        id: query
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/canary-discovery"
          mkdir -p "$root"
          gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/runs" \
            -f per_page=100 \
            > "$root/repository-runs.json"
          jq \
            --arg sha "$TARGET_SHA" \
            '.workflow_runs
             | map(select(.head_sha == $sha))
             | sort_by(.created_at)
             | map({
                 id,
                 name,
                 event,
                 status,
                 conclusion,
                 workflow_id,
                 run_number,
                 run_attempt,
                 head_branch,
                 head_sha,
                 path,
                 html_url,
                 created_at,
                 updated_at
               })' \
            "$root/repository-runs.json" \
            > "$root/target-runs.json"
          count="$(jq 'length' "$root/target-runs.json")"
          echo "target_count=$count" >> "$GITHUB_OUTPUT"

          printf '[]\n' > "$root/target-artifacts.json"
          while IFS= read -r run_id; do
            test -n "$run_id" || continue
            gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
              -f per_page=100 \
              > "$root/artifacts-$run_id.json"
            jq --argjson runId "$run_id" \
              '[.artifacts[] | {
                  runId: $runId,
                  id,
                  name,
                  size_in_bytes,
                  expired,
                  digest,
                  created_at,
                  expires_at,
                  archive_download_url
                }]' \
              "$root/artifacts-$run_id.json" \
              > "$root/artifacts-$run_id-array.json"
            jq -s '.[0] + .[1]' \
              "$root/target-artifacts.json" \
              "$root/artifacts-$run_id-array.json" \
              > "$root/target-artifacts-next.json"
            mv "$root/target-artifacts-next.json" "$root/target-artifacts.json"
          done < <(jq -r '.[].id' "$root/target-runs.json")

          jq -r '
            if length == 0 then
              "No Actions run was returned for the exact target SHA."
            else
              map(
                "- run `\(.id)`, workflow `\(.name)`, event `\(.event)`, status `\(.status)`, conclusion `\(.conclusion)`, run number `\(.run_number)`, URL \(.html_url)"
              ) | join("\n")
            end
          ' "$root/target-runs.json" > "$root/runs.md"
          jq -r '
            if length == 0 then
              "No artifacts were returned for the target runs."
            else
              map(
                "- run `\(.runId)`, artifact `\(.id)`, name `\(.name)`, bytes `\(.size_in_bytes)`, digest `\(.digest // "none")`, expired `\(.expired)`"
              ) | join("\n")
            end
          ' "$root/target-artifacts.json" > "$root/artifacts.md"

      - name: Post exact run and artifact inventory
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/canary-discovery"
          body="$root/discovery-comment.md"
          cat > "$body" <<EOF
          GitHub Actions custody discovery for exact live-canary SHA \`${TARGET_SHA}\` returned:

          $(cat "$root/runs.md")

          Associated artifact inventory:

          $(cat "$root/artifacts.md")

          This discovery transaction queried only the repository Actions API. It issued zero source-endpoint requests and makes no acquisition, source-quality, graph, or canon claim.
          EOF
          gh pr comment 242 --repo "$GITHUB_REPOSITORY" --body-file "$body"

      - name: Upload discovery diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-structured-public-canary-discovery
          path: ${{ runner.temp }}/canary-discovery
          if-no-files-found: error
          retention-days: 30