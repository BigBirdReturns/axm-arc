name: Recover ASOIAF structured public live canary custody v2

on:
  push:
    branches:
      - feature/asoiaf-structured-public-canary-v1
    paths:
      - '.github/workflows/asoiaf-structured-public-canary-recovery-v2.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: asoiaf-structured-public-canary-recovery-v2
  cancel-in-progress: false

jobs:
  recover:
    if: github.repository == 'BigBirdReturns/axm-arc' && github.ref_name == 'feature/asoiaf-structured-public-canary-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_SHA: 06d3adfd0374036ec15f7b8eb7b2510248c482c1
      TARGET_BRANCH: feature/asoiaf-structured-public-canary-v1
      TARGET_WORKFLOW_NAME: ASOIAF structured public live canary
      TARGET_ARTIFACT: asoiaf-structured-public-live-canary
    steps:
      - name: Check out exact recovery candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          show-progress: false

      - name: Bind no-source-network recovery boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = "$TARGET_BRANCH"
          test "$TARGET_SHA" != "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

      - name: Resolve exact successful origin run and artifact
        id: origin
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/recovery-v2"
          mkdir -p "$root"

          gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/runs" \
            -f branch="$TARGET_BRANCH" \
            -f event=push \
            -f per_page=100 \
            > "$root/repository-runs.json"

          jq -c \
            --arg sha "$TARGET_SHA" \
            --arg name "$TARGET_WORKFLOW_NAME" \
            '.workflow_runs
             | map(select(
                 .head_sha == $sha
                 and .name == $name
                 and .status == "completed"
                 and .conclusion == "success"
               ))
             | sort_by(.run_number)
             | last // empty' \
            "$root/repository-runs.json" \
            > "$root/origin-run.json"
          test -s "$root/origin-run.json"

          run_id="$(jq -r '.id' "$root/origin-run.json")"
          run_url="$(jq -r '.html_url' "$root/origin-run.json")"
          run_number="$(jq -r '.run_number' "$root/origin-run.json")"
          test "$run_id" != 'null'

          gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
            -f per_page=100 \
            > "$root/origin-artifacts.json"
          jq -c \
            --arg name "$TARGET_ARTIFACT" \
            '.artifacts
             | map(select(.name == $name and .expired == false))
             | sort_by(.created_at)
             | last // empty' \
            "$root/origin-artifacts.json" \
            > "$root/origin-artifact.json"
          test -s "$root/origin-artifact.json"

          artifact_id="$(jq -r '.id' "$root/origin-artifact.json")"
          artifact_digest="$(jq -r '.digest' "$root/origin-artifact.json")"
          artifact_size="$(jq -r '.size_in_bytes' "$root/origin-artifact.json")"
          test "$artifact_id" != 'null'
          test "$artifact_digest" != 'null'
          test -n "$artifact_digest"

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
          echo "run_number=$run_number" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$artifact_digest" >> "$GITHUB_OUTPUT"
          echo "artifact_size=$artifact_size" >> "$GITHUB_OUTPUT"

      - name: Post immediate origin resolution receipt
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGIN_RUN_ID: ${{ steps.origin.outputs.run_id }}
          ORIGIN_RUN_URL: ${{ steps.origin.outputs.run_url }}
          ORIGIN_RUN_NUMBER: ${{ steps.origin.outputs.run_number }}
          ORIGIN_ARTIFACT_ID: ${{ steps.origin.outputs.artifact_id }}
          ORIGIN_ARTIFACT_DIGEST: ${{ steps.origin.outputs.artifact_digest }}
          ORIGIN_ARTIFACT_SIZE: ${{ steps.origin.outputs.artifact_size }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr comment 242 --repo "$GITHUB_REPOSITORY" --body \
            "Recovered the exact final-head canary origin without issuing another source request: workflow run \`${ORIGIN_RUN_ID}\` (run ${ORIGIN_RUN_NUMBER}) executed \`${TARGET_SHA}\`; artifact \`${ORIGIN_ARTIFACT_ID}\` is ${ORIGIN_ARTIFACT_SIZE} bytes with ZIP digest \`${ORIGIN_ARTIFACT_DIGEST}\`. Artifact unpacking and source-level reconciliation now proceed under this fixed origin receipt."

      - name: Download and verify origin artifact
        id: unpack
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGIN_RUN_ID: ${{ steps.origin.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/recovery-v2"
          recovered="$root/recovered"
          mkdir -p "$recovered"
          gh run download "$ORIGIN_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$TARGET_ARTIFACT" \
            --dir "$recovered"

          sums="$(find "$recovered" -type f -name SHA256SUMS -print -quit)"
          summary="$(find "$recovered" -type f -name canary-summary.json -print -quit)"
          candidate="$(find "$recovered" -type f -name candidate-sha.txt -print -quit)"
          test -n "$sums"
          test -n "$summary"
          test -n "$candidate"
          artifact_root="$(dirname "$sums")"
          test "$(tr -d '\r\n' < "$candidate")" = "$TARGET_SHA"
          (
            cd "$artifact_root"
            sha256sum -c SHA256SUMS
          ) | tee "$root/origin-sha256-verification.log"
          test "$(jq -r '.receiptCount' "$summary")" = '4'
          test "$(jq -r '.rawResponseRetainedCount' "$summary")" = '0'
          test "$(jq -r '.graphEffectCount' "$summary")" = '0'
          test "$(jq -r '.canonEffectCount' "$summary")" = '0'
          printf '%s\n' "$artifact_root" > "$root/artifact-root.txt"
          echo "artifact_root=$artifact_root" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain)"

      - name: Build exact source and observation matrix
        id: reconcile
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/recovery-v2"
          artifact_root="$(cat "$root/artifact-root.txt")"
          receipts="$artifact_root/estate/structured-acquisition-receipts"
          observations="$artifact_root/estate/observations.ndjson"
          gaps="$artifact_root/estate/gaps.ndjson"
          attempts="$artifact_root/estate/attempts.ndjson"

          test "$(find "$receipts" -maxdepth 1 -type f -name '*.json' | wc -l)" = '4'
          jq -s '
            sort_by(.sourceId, .requestId)
            | map({
                adapterId,
                sourceId,
                requestId,
                requestedUrl,
                finalUrl,
                robotsUrl,
                robotsStatus,
                robotsDigest,
                httpStatus,
                responseMediaType,
                responseBytes,
                sourceResponseDigest,
                requestCount,
                waitedMilliseconds,
                redirectCount,
                adapterReceiptFingerprint,
                committedRecordCount,
                observationIds,
                candidateIds,
                gapId,
                outcome,
                rawResponseRetained,
                graphEffect,
                canonEffect,
                receiptId,
                receiptFingerprint
              })
          ' "$receipts"/*.json > "$root/source-outcome-matrix.json"

          if [ -s "$observations" ]; then
            jq -s '
              map({
                observationId,
                candidateId,
                sourceId,
                sourceRecordId,
                retrievedAt,
                contentDigest,
                recordType,
                title,
                summary,
                mediaType,
                responseBytes,
                retention,
                cacheUri,
                sourceUri,
                graphEffect,
                canonEffect,
                promotionStatus
              })
            ' "$observations" > "$root/retained-observations.json"
          else
            printf '[]\n' > "$root/retained-observations.json"
          fi
          if [ -s "$gaps" ]; then jq -s '.' "$gaps" > "$root/terminal-gaps.json"; else printf '[]\n' > "$root/terminal-gaps.json"; fi
          if [ -s "$attempts" ]; then jq -s '.' "$attempts" > "$root/collector-attempts.json"; else printf '[]\n' > "$root/collector-attempts.json"; fi

          jq -r 'map(select(.outcome == "observed") | .sourceId) | join(",")' "$root/source-outcome-matrix.json" > "$root/observed-source-ids.txt"
          jq -r 'map(select(.outcome == "blocked-robots") | .sourceId) | join(",")' "$root/source-outcome-matrix.json" > "$root/robots-source-ids.txt"
          jq -r 'map(select(.outcome == "blocked-credential") | .sourceId) | join(",")' "$root/source-outcome-matrix.json" > "$root/credential-source-ids.txt"
          jq -r 'map("\(.sourceId)|\(.sourceRecordId)|\(.title // "untitled")") | join(";")' "$root/retained-observations.json" > "$root/retained-observation-summary.txt"
          test -z "$(git status --porcelain)"

      - name: Assemble recovered custody package
        id: assemble
        env:
          ORIGIN_RUN_ID: ${{ steps.origin.outputs.run_id }}
          ORIGIN_ARTIFACT_ID: ${{ steps.origin.outputs.artifact_id }}
          ORIGIN_ARTIFACT_DIGEST: ${{ steps.origin.outputs.artifact_digest }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/recovery-v2"
          artifact_root="$(cat "$root/artifact-root.txt")"
          output="$RUNNER_TEMP/asoiaf-structured-public-live-canary-recovered-v2"
          mkdir -p "$output/origin-artifact"
          cp -R "$artifact_root"/. "$output/origin-artifact/"
          cp \
            "$root/origin-run.json" \
            "$root/origin-artifact.json" \
            "$root/origin-sha256-verification.log" \
            "$root/source-outcome-matrix.json" \
            "$root/retained-observations.json" \
            "$root/terminal-gaps.json" \
            "$root/collector-attempts.json" \
            "$root/observed-source-ids.txt" \
            "$root/robots-source-ids.txt" \
            "$root/credential-source-ids.txt" \
            "$root/retained-observation-summary.txt" \
            "$output/"
          jq -n \
            --arg format 'axm-asoiaf-structured-public-live-canary-recovery/2' \
            --arg targetSha "$TARGET_SHA" \
            --arg originRunId "$ORIGIN_RUN_ID" \
            --arg originArtifactId "$ORIGIN_ARTIFACT_ID" \
            --arg originArtifactDigest "$ORIGIN_ARTIFACT_DIGEST" \
            --slurpfile outcomes "$root/source-outcome-matrix.json" \
            --slurpfile observations "$root/retained-observations.json" \
            --slurpfile gaps "$root/terminal-gaps.json" \
            '{
              format: $format,
              targetSha: $targetSha,
              originRunId: $originRunId,
              originArtifactId: $originArtifactId,
              originArtifactDigest: $originArtifactDigest,
              sourceOutcomes: $outcomes[0],
              retainedObservations: $observations[0],
              terminalGaps: $gaps[0],
              sourceEndpointRequestsDuringRecovery: 0,
              rawResponseRetained: false,
              graphEffect: "none",
              canonEffect: "none",
              authority: "none"
            }' > "$output/recovery-receipt.json"
          printf '%s\n' "$GITHUB_SHA" > "$output/recovery-candidate-sha.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$output/recovery-workflow-run-id.txt"
          find "$output" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $output/#  #" \
            > "$output/SHA256SUMS"
          test -z "$(git status --porcelain)"

      - name: Upload recovered custody package
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-structured-public-live-canary-recovered-v2
          path: ${{ runner.temp }}/asoiaf-structured-public-live-canary-recovered-v2
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Post reconciled canary receipt
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGIN_RUN_ID: ${{ steps.origin.outputs.run_id }}
          ORIGIN_ARTIFACT_ID: ${{ steps.origin.outputs.artifact_id }}
          ORIGIN_ARTIFACT_DIGEST: ${{ steps.origin.outputs.artifact_digest }}
          RECOVERY_ARTIFACT_ID: ${{ steps.upload.outputs['artifact-id'] }}
          RECOVERY_ARTIFACT_DIGEST: ${{ steps.upload.outputs['artifact-digest'] }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/recovery-v2"
          matrix="$root/source-outcome-matrix.json"
          observed="$(cat "$root/observed-source-ids.txt")"
          robots="$(cat "$root/robots-source-ids.txt")"
          credential="$(cat "$root/credential-source-ids.txt")"
          retained="$(cat "$root/retained-observation-summary.txt")"
          requests="$(jq '[.[].requestCount] | add' "$matrix")"
          waited="$(jq '[.[].waitedMilliseconds] | add' "$matrix")"
          bytes="$(jq '[.[].responseBytes] | add' "$matrix")"
          body="$RUNNER_TEMP/canary-recovery-v2-comment.md"
          cat > "$body" <<EOF
          The final-head live canary is now fully reconciled from exact origin run \`${ORIGIN_RUN_ID}\` and artifact \`${ORIGIN_ARTIFACT_ID}\` with ZIP digest \`${ORIGIN_ARTIFACT_DIGEST}\`. The origin artifact's internal \`SHA256SUMS\` passed, and recovery issued zero requests to the four source endpoints.

          Source outcomes are: observed \`${observed}\`; robots-blocked \`${robots}\`; credential-policy-blocked \`${credential}\`. Across all plans, the qualified actor recorded ${requests} requests, ${waited} milliseconds of enforced wait, and ${bytes} raw response bytes by digest only. The retained normalized observation is \`${retained}\`.

          Recovery artifact \`${RECOVERY_ARTIFACT_ID}\` has ZIP digest \`${RECOVERY_ARTIFACT_DIGEST}\` and contains the complete origin custody package, source outcome matrix, normalized observation, terminal gaps, collector attempts, and a second content-addressed recovery receipt. Both the origin and recovery ledgers retain \`rawResponseRetained=false\`, \`graphEffect=none\`, \`canonEffect=none\`, and \`authority=none\`.

          The control question is whether the single retained observation and the three bounded refusals can be reviewed from their exact plans, policy decisions, response identities, normalized custody, attempts, and receipts without treating accessibility or refusal as canon evidence.
          EOF
          gh pr comment 242 --repo "$GITHUB_REPOSITORY" --body-file "$body"

      - name: Post recovery failure receipt
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGIN_OUTCOME: ${{ steps.origin.outcome }}
          UNPACK_OUTCOME: ${{ steps.unpack.outcome }}
          RECONCILE_OUTCOME: ${{ steps.reconcile.outcome }}
          ASSEMBLE_OUTCOME: ${{ steps.assemble.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        shell: bash
        run: |
          gh pr comment 242 --repo "$GITHUB_REPOSITORY" --body \
            "Canary recovery v2 failed in workflow run \`${GITHUB_RUN_ID}\` without issuing a source-endpoint request. Step outcomes: origin \`${ORIGIN_OUTCOME}\`, unpack \`${UNPACK_OUTCOME}\`, reconcile \`${RECONCILE_OUTCOME}\`, assemble \`${ASSEMBLE_OUTCOME}\`, upload \`${UPLOAD_OUTCOME}\`. No recovered artifact or source-level claim is issued from this failed transaction."