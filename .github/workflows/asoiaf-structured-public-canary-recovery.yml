name: Recover ASOIAF structured public live canary custody

on:
  push:
    branches:
      - feature/asoiaf-structured-public-canary-v1
    paths:
      - '.github/workflows/asoiaf-structured-public-canary-recovery.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: asoiaf-structured-public-canary-recovery-v1
  cancel-in-progress: false

jobs:
  recover:
    if: github.repository == 'BigBirdReturns/axm-arc' && github.ref_name == 'feature/asoiaf-structured-public-canary-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_SHA: 06d3adfd0374036ec15f7b8eb7b2510248c482c1
      TARGET_BRANCH: feature/asoiaf-structured-public-canary-v1
      TARGET_WORKFLOW: asoiaf-structured-public-live-canary.yml
      TARGET_ARTIFACT: asoiaf-structured-public-live-canary
    steps:
      - name: Check out exact recovery transaction
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          show-progress: false

      - name: Bind no-network recovery boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = "$TARGET_BRANCH"
          test -z "$(git status --porcelain)"
          test "$TARGET_SHA" != "$GITHUB_SHA"

      - name: Resolve exact origin run and artifact through GitHub custody API
        id: origin
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/canary-recovery"
          mkdir -p "$root"

          gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW/runs?event=push&per_page=100" \
            > "$root/workflow-runs.json"
          jq -c \
            --arg sha "$TARGET_SHA" \
            --arg branch "$TARGET_BRANCH" \
            '.workflow_runs
             | map(select(
                 .head_sha == $sha
                 and .head_branch == $branch
                 and .status == "completed"
                 and .conclusion == "success"
               ))
             | sort_by(.run_number)
             | last // empty' \
            "$root/workflow-runs.json" \
            > "$root/origin-run.json"
          test -s "$root/origin-run.json"

          run_id="$(jq -r '.id' "$root/origin-run.json")"
          run_url="$(jq -r '.html_url' "$root/origin-run.json")"
          run_number="$(jq -r '.run_number' "$root/origin-run.json")"
          test "$run_id" != 'null'

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" \
            > "$root/origin-artifacts.json"
          jq -c \
            --arg name "$TARGET_ARTIFACT" \
            '.artifacts
             | map(select(.name == $name and .expired == false))
             | sort_by(.created_at)
             | last // empty' \
            "$root/origin-artifacts.json" \
            > "$root/origin-artifact.json"
          test -s "$root/origin-artifact.json"

          artifact_id="$(jq -r '.id' "$root/origin-artifact.json")"
          artifact_digest="$(jq -r '.digest' "$root/origin-artifact.json")"
          artifact_size="$(jq -r '.size_in_bytes' "$root/origin-artifact.json")"
          test "$artifact_id" != 'null'
          test "$artifact_digest" != 'null'
          test "$artifact_digest" != ''

          printf '%s\n' "$run_id" > "$root/origin-run-id.txt"
          printf '%s\n' "$run_url" > "$root/origin-run-url.txt"
          printf '%s\n' "$artifact_id" > "$root/origin-artifact-id.txt"
          printf '%s\n' "$artifact_digest" > "$root/origin-artifact-digest.txt"
          printf '%s\n' "$artifact_size" > "$root/origin-artifact-size.txt"

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
          echo "run_number=$run_number" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$artifact_digest" >> "$GITHUB_OUTPUT"
          echo "artifact_size=$artifact_size" >> "$GITHUB_OUTPUT"

      - name: Download and verify the exact final-head canary artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGIN_RUN_ID: ${{ steps.origin.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/canary-recovery"
          recovered="$root/recovered"
          mkdir -p "$recovered"
          gh run download "$ORIGIN_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$TARGET_ARTIFACT" \
            --dir "$recovered"

          summary="$(find "$recovered" -type f -name canary-summary.json -print -quit)"
          candidate="$(find "$recovered" -type f -name candidate-sha.txt -print -quit)"
          sums="$(find "$recovered" -type f -name SHA256SUMS -print -quit)"
          test -n "$summary"
          test -n "$candidate"
          test -n "$sums"
          test "$(tr -d '\r\n' < "$candidate")" = "$TARGET_SHA"
          artifact_root="$(dirname "$sums")"
          (
            cd "$artifact_root"
            sha256sum -c SHA256SUMS
          ) | tee "$root/origin-sha256-verification.log"

          printf '%s\n' "$artifact_root" > "$root/artifact-root.txt"
          test "$(jq -r '.receiptCount' "$summary")" = '4'
          test "$(jq -r '.rawResponseRetainedCount' "$summary")" = '0'
          test "$(jq -r '.graphEffectCount' "$summary")" = '0'
          test "$(jq -r '.canonEffectCount' "$summary")" = '0'
          test -z "$(git status --porcelain)"

      - name: Reconcile source-specific outcomes and retained observations
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/canary-recovery"
          artifact_root="$(cat "$root/artifact-root.txt")"
          receipts="$artifact_root/estate/structured-acquisition-receipts"
          observations="$artifact_root/estate/observations.ndjson"
          gaps="$artifact_root/estate/gaps.ndjson"
          attempts="$artifact_root/estate/attempts.ndjson"

          test -d "$receipts"
          test "$(find "$receipts" -maxdepth 1 -type f -name '*.json' | wc -l)" = '4'
          jq -s '
            sort_by(.sourceId, .requestId)
            | map({
                adapterId,
                sourceId,
                requestId,
                requestedUrl,
                finalUrl,
                robotsUrl,
                robotsStatus,
                robotsDigest,
                httpStatus,
                responseMediaType,
                responseBytes,
                sourceResponseDigest,
                requestCount,
                waitedMilliseconds,
                redirectCount,
                adapterReceiptFingerprint,
                committedRecordCount,
                observationIds,
                candidateIds,
                gapId,
                outcome,
                rawResponseRetained,
                graphEffect,
                canonEffect,
                receiptId,
                receiptFingerprint
              })
          ' "$receipts"/*.json > "$root/source-outcome-matrix.json"

          if [ -s "$observations" ]; then
            jq -s '
              map({
                observationId,
                candidateId,
                sourceId,
                sourceRecordId,
                retrievedAt,
                contentDigest,
                recordType,
                title,
                summary,
                mediaType,
                responseBytes,
                retention,
                cacheUri,
                sourceUri,
                graphEffect,
                canonEffect,
                promotionStatus
              })
            ' "$observations" > "$root/retained-observations.json"
          else
            printf '[]\n' > "$root/retained-observations.json"
          fi

          if [ -s "$gaps" ]; then
            jq -s '.' "$gaps" > "$root/terminal-gaps.json"
          else
            printf '[]\n' > "$root/terminal-gaps.json"
          fi
          if [ -s "$attempts" ]; then
            jq -s '.' "$attempts" > "$root/collector-attempts.json"
          else
            printf '[]\n' > "$root/collector-attempts.json"
          fi

          jq -n \
            --arg format 'axm-asoiaf-structured-public-live-canary-recovery/1' \
            --arg targetSha "$TARGET_SHA" \
            --arg originRunId "$(cat "$root/origin-run-id.txt")" \
            --arg originRunUrl "$(cat "$root/origin-run-url.txt")" \
            --arg originArtifactId "$(cat "$root/origin-artifact-id.txt")" \
            --arg originArtifactDigest "$(cat "$root/origin-artifact-digest.txt")" \
            --slurpfile matrix "$root/source-outcome-matrix.json" \
            --slurpfile observations "$root/retained-observations.json" \
            --slurpfile gaps "$root/terminal-gaps.json" \
            '{
              format: $format,
              targetSha: $targetSha,
              originRunId: $originRunId,
              originRunUrl: $originRunUrl,
              originArtifactId: $originArtifactId,
              originArtifactDigest: $originArtifactDigest,
              sourceOutcomes: $matrix[0],
              retainedObservations: $observations[0],
              terminalGaps: $gaps[0],
              rawResponseRetained: false,
              graphEffect: "none",
              canonEffect: "none",
              authority: "none"
            }' > "$root/recovery-receipt.json"

          jq -r '
            ["| Source | Adapter | Outcome | Robots | HTTP | Requests | Bytes | Records | Gap |",
             "|---|---|---:|---:|---:|---:|---:|---:|---|"]
            + map(
                "| `\(.sourceId)` | `\(.adapterId)` | `\(.outcome)` | `\(.robotsStatus)` | \(.httpStatus // "none") | \(.requestCount) | \(.responseBytes) | \(.committedRecordCount) | `\(.gapId // "none")` |"
              )
            | .[]
          ' "$root/source-outcome-matrix.json" > "$root/source-outcome-matrix.md"
          test -z "$(git status --porcelain)"

      - name: Assemble recovered custody package
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/canary-recovery"
          output="$RUNNER_TEMP/asoiaf-structured-public-live-canary-recovered"
          mkdir -p "$output/origin-artifact"
          cp \
            "$root/origin-run.json" \
            "$root/origin-artifact.json" \
            "$root/origin-run-id.txt" \
            "$root/origin-run-url.txt" \
            "$root/origin-artifact-id.txt" \
            "$root/origin-artifact-digest.txt" \
            "$root/origin-artifact-size.txt" \
            "$root/origin-sha256-verification.log" \
            "$root/source-outcome-matrix.json" \
            "$root/source-outcome-matrix.md" \
            "$root/retained-observations.json" \
            "$root/terminal-gaps.json" \
            "$root/collector-attempts.json" \
            "$root/recovery-receipt.json" \
            "$output/"
          artifact_root="$(cat "$root/artifact-root.txt")"
          cp -R "$artifact_root"/. "$output/origin-artifact/"
          printf '%s\n' "$GITHUB_SHA" > "$output/recovery-candidate-sha.txt"
          printf '%s\n' "$GITHUB_RUN_ID" > "$output/recovery-workflow-run-id.txt"
          printf '%s\n' \
            'networkTargets=github-actions-api-only' \
            'sourceEndpointRequests=0' \
            'originArtifactVerified=true' \
            'rawResponseRetained=false' \
            'repositoryMutation=false' \
            'graphEffect=none' \
            'canonEffect=none' \
            'authority=none' \
            > "$output/recovery-boundary.txt"
          find "$output" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $output/#  #" \
            > "$output/SHA256SUMS"
          test -z "$(git status --porcelain)"

      - name: Upload recovered canary custody
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-structured-public-live-canary-recovered
          path: ${{ runner.temp }}/asoiaf-structured-public-live-canary-recovered
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Post exact recovered receipt
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGIN_RUN_ID: ${{ steps.origin.outputs.run_id }}
          ORIGIN_RUN_URL: ${{ steps.origin.outputs.run_url }}
          ORIGIN_ARTIFACT_ID: ${{ steps.origin.outputs.artifact_id }}
          ORIGIN_ARTIFACT_DIGEST: ${{ steps.origin.outputs.artifact_digest }}
          ORIGIN_ARTIFACT_SIZE: ${{ steps.origin.outputs.artifact_size }}
          RECOVERY_ARTIFACT_ID: ${{ steps.upload.outputs['artifact-id'] }}
          RECOVERY_ARTIFACT_DIGEST: ${{ steps.upload.outputs['artifact-digest'] }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/canary-recovery"
          matrix="$root/source-outcome-matrix.json"
          observations="$root/retained-observations.json"
          body="$RUNNER_TEMP/recovered-canary-comment.md"

          observed="$(jq -r 'map(select(.outcome == "observed") | "`\(.sourceId)`") | join(", ")' "$matrix")"
          robots="$(jq -r 'map(select(.outcome == "blocked-robots") | "`\(.sourceId)`") | join(", ")' "$matrix")"
          credential="$(jq -r 'map(select(.outcome == "blocked-credential") | "`\(.sourceId)`") | join(", ")' "$matrix")"
          retained="$(jq -r 'map("`\(.sourceId)` / `\(.sourceRecordId)` / \(.title // "untitled")") | join("; ")' "$observations")"
          request_count="$(jq '[.[].requestCount] | add' "$matrix")"
          waited="$(jq '[.[].waitedMilliseconds] | add' "$matrix")"
          response_bytes="$(jq '[.[].responseBytes] | add' "$matrix")"

          cat > "$body" <<EOF
          The final-head live canary custody has been recovered and verified without issuing another source request. Origin workflow run \`${ORIGIN_RUN_ID}\` executed exact candidate \`${TARGET_SHA}\`; origin artifact \`${ORIGIN_ARTIFACT_ID}\` is ${ORIGIN_ARTIFACT_SIZE} bytes with ZIP digest \`${ORIGIN_ARTIFACT_DIGEST}\`. Its internal \`SHA256SUMS\` passed in full.

          The source ledger records one observed acquisition from ${observed}, robots refusals from ${robots}, and a credential-policy refusal from ${credential}. Across the four signed plans, the actor made ${request_count} requests, enforced ${waited} milliseconds of wait, and bound ${response_bytes} raw response bytes by SHA-256 without retaining the bodies. The retained normalized observation is ${retained}.

          The recovery package preserves the complete origin artifact, exact source-outcome matrix, terminal gaps, collector attempts, retained observations, origin run and artifact metadata, and a second content-addressed receipt. Recovery artifact \`${RECOVERY_ARTIFACT_ID}\` has ZIP digest \`${RECOVERY_ARTIFACT_DIGEST}\`. This transaction used only the GitHub Actions custody API, made zero requests to the four source endpoints, changed no collector or repository record, and retained \`graphEffect=none\`, \`canonEffect=none\`, and \`authority=none\`.

          The control question is whether the single retained observation and all three bounded refusals can now be reviewed from their exact plans, policy decisions, response identities, normalized custody, attempts, and receipts without treating either accessibility or refusal as canon evidence.
          EOF
          gh pr comment 242 --repo "$GITHUB_REPOSITORY" --body-file "$body"