name: Refresh exact axm-canon export custody v2

on:
  push:
    branches:
      - "recovery/axm-canon-export-refresh-v2"
    paths:
      - ".recovery/AXM_CANON_EXPORT_REFRESH_V2_READY"

permissions:
  actions: write
  contents: write

concurrency:
  group: axm-arc-axm-canon-export-refresh-v2
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install archive dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends zstd
          fi
          zstd --version

      - name: Re-run retained source exports and download fresh artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f .recovery/AXM_CANON_EXPORT_REFRESH_V2_READY
          root="$RUNNER_TEMP/axm-canon-export-refresh-v2"
          mkdir -p "$root/downloads"
          printf '%s\n' 31487125477 31488623085 > "$root/source-runs.txt"
          : > "$root/rerun-ledger.tsv"
          while IFS= read -r run; do
            before="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '.run_attempt' 2>/dev/null || printf '0')"
            http="$(curl --silent --show-error --output "$root/rerun-$run.json" --write-out '%{http_code}' \
              --request POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$run/rerun" || true)"
            printf '%s\t%s\t%s\n' "$run" "$before" "$http" >> "$root/rerun-ledger.tsv"
          done < "$root/source-runs.txt"

          while IFS= read -r run; do
            before="$(awk -F '\t' -v run="$run" '$1==run{print $2}' "$root/rerun-ledger.tsv")"
            ready=false
            for attempt in $(seq 1 360); do
              payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" 2>/dev/null || true)"
              current="$(jq -r '.run_attempt // 0' <<<"$payload")"
              status="$(jq -r '.status // "missing"' <<<"$payload")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$payload")"
              if [ "$current" -gt "$before" ] && [ "$status" = 'completed' ]; then
                printf '%s\t%s\t%s\t%s\n' "$run" "$current" "$status" "$conclusion" >> "$root/completion-ledger.tsv"
                ready=true
                break
              fi
              sleep 15
            done
            if [ "$ready" != true ]; then
              printf '%s\tTIMEOUT\n' "$run" >> "$root/completion-ledger.tsv"
            fi
          done < "$root/source-runs.txt"

          : > "$root/artifact-ledger.tsv"
          while IFS= read -r run; do
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired == false) | [.id,.name,.size_in_bytes,.created_at] | @tsv' \
              > "$root/run-$run-artifacts.tsv" || true
            while IFS=$'\t' read -r id name bytes created; do
              [ -n "$id" ] || continue
              target="$root/downloads/run-${run}-artifact-${id}.zip"
              http="$(curl -L --silent --show-error --output "$target" --write-out '%{http_code}' \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" || true)"
              if [ "$http" = '200' ] && [ -s "$target" ]; then
                printf '%s\t%s\t%s\t%s\tPASS\t%s\t%s\n' "$run" "$id" "$name" "$created" "$(wc -c < "$target")" "$(sha256sum "$target" | cut -d' ' -f1)" >> "$root/artifact-ledger.tsv"
              else
                rm -f "$target"
                printf '%s\t%s\t%s\t%s\tFAIL\t%s\t-\n' "$run" "$id" "$name" "$created" "$http" >> "$root/artifact-ledger.tsv"
              fi
            done < "$root/run-$run-artifacts.tsv"
          done < "$root/source-runs.txt"
          test -n "$(find "$root/downloads" -type f -name '*.zip' -print -quit)"
          printf 'REFRESH_ROOT=%s\n' "$root" >> "$GITHUB_ENV"

      - name: Expand every retained artifact into content-addressed Git custody
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import gzip
          import hashlib
          import io
          import json
          import os
          import pathlib
          import shutil
          import subprocess
          import tarfile
          import zipfile

          root=pathlib.Path(os.environ['REFRESH_ROOT'])
          output=pathlib.Path('recovery/axm-canon-export-refresh-v2')
          payload_root=output/'payloads'
          if output.exists():
              shutil.rmtree(output)
          payload_root.mkdir(parents=True)
          queue=[]
          for path in sorted((root/'downloads').glob('*.zip')):
              queue.append((path.name,path.name,path.read_bytes(),0))
          seen=set(); rows=[]; total=0
          max_total=8_000_000_000
          max_objects=200_000

          def sha(data:bytes)->str:
              return hashlib.sha256(data).hexdigest()
          def safe(name:str)->pathlib.PurePosixPath:
              path=pathlib.PurePosixPath(name)
              if path.is_absolute() or '..' in path.parts:
                  raise ValueError(f'unsafe path: {name}')
              return path
          def retain(label:str,name:str,data:bytes,depth:int)->None:
              digest=sha(data)
              leaf=safe(name).name or 'payload.bin'
              target=payload_root/digest[:2]/digest[2:18]/leaf
              target.parent.mkdir(parents=True,exist_ok=True)
              if not target.exists():
                  target.write_bytes(data)
              rows.append({'label':label,'name':name,'bytes':len(data),'sha256':digest,'depth':depth,'retainedPath':target.as_posix()})

          while queue:
              origin,name,data,depth=queue.pop(0)
              digest=sha(data)
              if digest in seen:
                  continue
              seen.add(digest);total+=len(data)
              if total>max_total or len(seen)>max_objects:
                  raise SystemExit('expansion limit exceeded')
              label=f'{origin}:{name}'
              retain(label,name,data,depth)
              if depth>=7:
                  continue
              try:
                  if data.startswith(b'PK\x03\x04'):
                      with zipfile.ZipFile(io.BytesIO(data)) as archive:
                          for member in archive.infolist():
                              if member.is_dir():
                                  continue
                              safe(member.filename)
                              if member.file_size>2_000_000_000:
                                  raise SystemExit('oversized zip member')
                              queue.append((label,member.filename,archive.read(member),depth+1))
                      continue
                  if data.startswith(b'\x1f\x8b'):
                      queue.append((label,name.removesuffix('.gz'),gzip.decompress(data),depth+1))
                      continue
                  if data.startswith(b'\x28\xb5\x2f\xfd'):
                      source=root/'nested.zst';target=root/'nested.out'
                      source.write_bytes(data)
                      subprocess.run(['zstd','-d','-f',str(source),'-o',str(target)],check=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
                      queue.append((label,name.removesuffix('.zst'),target.read_bytes(),depth+1))
                      source.unlink(missing_ok=True);target.unlink(missing_ok=True)
                      continue
                  if len(data)>=512:
                      try:
                          with tarfile.open(fileobj=io.BytesIO(data),mode='r:*') as archive:
                              members=archive.getmembers()
                              for member in members:
                                  safe(member.name)
                                  if member.isfile() and not member.issym() and not member.islnk():
                                      source=archive.extractfile(member)
                                      if source is not None:
                                          queue.append((label,member.name,source.read(),depth+1))
                      except tarfile.TarError:
                          pass
              except (OSError,ValueError,zipfile.BadZipFile,gzip.BadGzipFile):
                  pass

          rows.sort(key=lambda row:(row['sha256'],row['label']))
          receipt={
              'format':'axm-arc-axm-canon-export-refresh/2',
              'result':'PASS',
              'sourceRuns':[31487125477,31488623085],
              'downloadLedger':(root/'artifact-ledger.tsv').read_text().splitlines(),
              'objectCount':len(seen),
              'expandedBytes':total,
              'objects':rows,
              'authority':'transport-and-source-export-specific',
              'canonEffect':'none',
              'graphEffect':'none',
          }
          (output/'REFRESH_RECEIPT.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
          git diff --check

      - name: Publish refreshed export custody
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .recovery
          rm -f .github/workflows/axm-canon-export-refresh-v2.yml
          git add -A
          git diff --cached --check
          git config user.name 'BigBirdReturns'
          git config user.email '219768509+BigBirdReturns@users.noreply.github.com'
          git commit -m 'Refresh exact axm-canon export custody v2'
          sha="$(git rev-parse HEAD)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          printf 'published_sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Re-trigger all-custody public-corpus recovery
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/public-corpus-recovery-trigger"
          git clone --quiet --depth 1 --single-branch --branch recovery/axm-canon-public-corpus-v1 \
            "https://x-access-token:${GH_TOKEN}@github.com/$GITHUB_REPOSITORY.git" "$target"
          cd "$target"
          trigger=.recovery/AXM_CANON_PUBLIC_CORPUS_V2_READY
          test -f "$trigger"
          printf '%s\n' \
            "refresh-v2-commit=${{ steps.publish.outputs.published_sha }}" \
            "refresh-v2-run=$GITHUB_RUN_ID" \
            "refresh-v2-attempt=$GITHUB_RUN_ATTEMPT" >> "$trigger"
          git config user.name 'BigBirdReturns'
          git config user.email '219768509+BigBirdReturns@users.noreply.github.com'
          git add "$trigger"
          git commit -m 'Retry public corpus recovery with refreshed exports v2'
          git push origin HEAD:recovery/axm-canon-public-corpus-v1

      - name: Retain refresh terminal
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="$REFRESH_ROOT"
          printf '%s\n' \
            "candidate=${{ github.sha }}" \
            "published=${{ steps.publish.outputs.published_sha }}" > "$root/terminal.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum | sed "s#  $root/#  #" > "$root/SHA256SUMS" || true

      - name: Upload refresh terminal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axm-arc-axm-canon-export-refresh-v2
          path: ${{ runner.temp }}/axm-canon-export-refresh-v2
          if-no-files-found: warn
          retention-days: 30
