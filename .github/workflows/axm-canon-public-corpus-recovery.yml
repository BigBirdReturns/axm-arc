name: Recover axm-canon public corpus from retained AXM artifacts

on:
  push:
    branches:
      - "recovery/axm-canon-public-corpus-v1"
    paths:
      - ".recovery/AXM_CANON_PUBLIC_CORPUS_V1_READY"

permissions:
  contents: write
  actions: read

concurrency:
  group: axm-arc-axm-canon-public-corpus-recovery-v1
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install archive dependencies
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends zstd
          fi
          zstd --version

      - name: Download retained source and dependency artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f .recovery/AXM_CANON_PUBLIC_CORPUS_V1_READY
          root="$RUNNER_TEMP/axm-canon-public-corpus-recovery"
          downloads="$root/downloads"
          mkdir -p "$downloads"
          printf '%s\n' 9099542397 9100108672 > "$root/requested-artifact-ids.txt"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.id,.name,.size_in_bytes,.created_at] | @tsv' \
            > "$root/available-artifacts.tsv"
          awk -F '\t' 'BEGIN{IGNORECASE=1} $2 ~ /(asoiaf|canon|carrier|source|migration|export|estate)/ {print $1}' \
            "$root/available-artifacts.tsv" | head -n 40 >> "$root/requested-artifact-ids.txt"
          sort -u "$root/requested-artifact-ids.txt" -o "$root/requested-artifact-ids.txt"
          : > "$root/download-ledger.tsv"
          while IFS= read -r id; do
            [ -n "$id" ] || continue
            target="$downloads/artifact-$id.zip"
            http="$(curl -L --silent --show-error \
              --output "$target" --write-out '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" || true)"
            if [ "$http" = '200' ] && [ -s "$target" ]; then
              printf '%s\t%s\t%s\t%s\n' "$id" PASS "$(wc -c < "$target")" "$(sha256sum "$target" | cut -d' ' -f1)" >> "$root/download-ledger.tsv"
            else
              rm -f "$target"
              printf '%s\tFAIL\t%s\t-\n' "$id" "$http" >> "$root/download-ledger.tsv"
            fi
          done < "$root/requested-artifact-ids.txt"
          test -n "$(find "$downloads" -type f -name '*.zip' -print -quit)"
          printf 'RECOVERY_ROOT=%s\n' "$root" >> "$GITHUB_ENV"

      - name: Expand artifact custody and resolve exact public corpus
        shell: bash
        env:
          AXM_CANON_BRANCH: asoiaf/public-corpus-v1-carrier
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import hashlib
          import io
          import json
          import os
          import pathlib
          import shutil
          import subprocess
          import tarfile
          import urllib.parse
          import urllib.request
          import zipfile

          ROOT = pathlib.Path(os.environ['RECOVERY_ROOT'])
          EXPANDED = ROOT / 'expanded'
          OUTPUT = pathlib.Path('recovery/public-corpus-v1')
          EXPECTED_B64_BYTES = 826356
          EXPECTED_B64_SHA = 'd4151d244b0541be1dbb1a1ef5a5ed7c4c808ba11d0ad494450acc58b11e6eaa'
          EXPECTED_ZST_BYTES = 619766
          EXPECTED_ZST_SHA = 'a545ed4384238f329f6fa6e6be2dd25150ac3377837defd3e06d26eabdea2476'
          EXPECTED_TAR_BYTES = 8017920
          EXPECTED_TAR_SHA = '9b66aff01f12ae3e6f018fd1c5ccd1d9b1fd96810da4343b3d11e3f69bfaab84'
          MAX_FILES = 100_000
          MAX_TOTAL = 4_000_000_000

          def sha256(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def safe_rel(name: str) -> pathlib.PurePosixPath:
              path = pathlib.PurePosixPath(name)
              if path.is_absolute() or '..' in path.parts:
                  raise ValueError(f'unsafe path: {name}')
              return path

          def write_expanded(origin: str, name: str, data: bytes) -> pathlib.Path:
              digest = sha256((origin + '\0' + name).encode() + data)
              suffix = pathlib.PurePosixPath(name).name or 'payload.bin'
              target = EXPANDED / digest[:2] / digest[2:18] / suffix
              target.parent.mkdir(parents=True, exist_ok=True)
              if not target.exists():
                  target.write_bytes(data)
              return target

          queue: list[tuple[str, str, bytes, int]] = []
          for path in sorted((ROOT / 'downloads').glob('*.zip')):
              queue.append((path.name, path.name, path.read_bytes(), 0))

          EXPANDED.mkdir(parents=True, exist_ok=True)
          observed: list[dict[str, object]] = []
          all_payloads: list[tuple[str, bytes]] = []
          total = 0
          while queue:
              origin, name, data, depth = queue.pop(0)
              total += len(data)
              if total > MAX_TOTAL or len(observed) > MAX_FILES:
                  raise SystemExit('artifact expansion limit exceeded')
              label = f'{origin}:{name}'
              observed.append({'label': label, 'bytes': len(data), 'sha256': sha256(data), 'depth': depth})
              all_payloads.append((label, data))
              write_expanded(origin, name, data)
              if depth >= 5:
                  continue
              try:
                  if data.startswith(b'PK\x03\x04'):
                      with zipfile.ZipFile(io.BytesIO(data)) as archive:
                          for member in archive.infolist():
                              if member.is_dir():
                                  continue
                              safe_rel(member.filename)
                              if member.file_size > 1_000_000_000:
                                  raise SystemExit('oversized zip member')
                              queue.append((label, member.filename, archive.read(member), depth + 1))
                      continue
                  if data.startswith(b'\x1f\x8b'):
                      queue.append((label, name.removesuffix('.gz'), gzip.decompress(data), depth + 1))
                      continue
                  if data.startswith(b'\x28\xb5\x2f\xfd'):
                      source = ROOT / 'tmp-input.zst'
                      target = ROOT / 'tmp-output'
                      source.write_bytes(data)
                      subprocess.run(['zstd', '-d', '-f', str(source), '-o', str(target)], check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                      queue.append((label, name.removesuffix('.zst'), target.read_bytes(), depth + 1))
                      source.unlink(missing_ok=True)
                      target.unlink(missing_ok=True)
                      continue
                  if len(data) >= 512:
                      try:
                          with tarfile.open(fileobj=io.BytesIO(data), mode='r:*') as archive:
                              members = archive.getmembers()
                              if members:
                                  for member in members:
                                      safe_rel(member.name)
                                      if not member.isfile() or member.issym() or member.islnk():
                                          continue
                                      source = archive.extractfile(member)
                                      if source is not None:
                                          queue.append((label, member.name, source.read(), depth + 1))
                      except tarfile.TarError:
                          pass
              except (OSError, ValueError, zipfile.BadZipFile, gzip.BadGzipFile):
                  pass

          (ROOT / 'expanded-inventory.json').write_text(json.dumps(observed, indent=2) + '\n')

          recovered: tuple[str, bytes] | None = None
          for label, data in all_payloads:
              if len(data) == EXPECTED_ZST_BYTES and sha256(data) == EXPECTED_ZST_SHA:
                  recovered = (label + ':compressed', data)
                  break
              canonical = b''.join(data.split())
              if len(canonical) == EXPECTED_B64_BYTES and sha256(canonical) == EXPECTED_B64_SHA:
                  try:
                      decoded = base64.b64decode(canonical, validate=True)
                  except Exception:
                      continue
                  if len(decoded) == EXPECTED_ZST_BYTES and sha256(decoded) == EXPECTED_ZST_SHA:
                      recovered = (label + ':base64', decoded)
                      break

          branch = urllib.parse.quote(os.environ['AXM_CANON_BRANCH'], safe='')
          base = 'https://raw.githubusercontent.com/BigBirdReturns/axm-canon/' + branch + '/carrier/'
          manifests: dict[str, bytes] = {}
          for name in ('FILES.txt', 'FILES.SHA256SUMS', 'TRANSPORT.json'):
              try:
                  with urllib.request.urlopen(base + name, timeout=30) as response:
                      manifests[name] = response.read()
              except Exception:
                  pass

          if recovered is not None:
              label, compressed = recovered
              zst = ROOT / 'carrier.tar.zst'
              tar_path = ROOT / 'carrier.tar'
              zst.write_bytes(compressed)
              subprocess.run(['zstd', '-d', '-f', str(zst), '-o', str(tar_path)], check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              tar_bytes = tar_path.read_bytes()
              if len(tar_bytes) != EXPECTED_TAR_BYTES or sha256(tar_bytes) != EXPECTED_TAR_SHA:
                  raise SystemExit('carrier digest passed but tar digest failed')
              files_root = OUTPUT / 'files'
              if OUTPUT.exists():
                  shutil.rmtree(OUTPUT)
              files_root.mkdir(parents=True)
              inventory = []
              with tarfile.open(tar_path, 'r:') as archive:
                  members = archive.getmembers()
                  if len(members) != 32:
                      raise SystemExit(f'expected 32 files, observed {len(members)}')
                  for member in members:
                      path = safe_rel(member.name)
                      if not member.isfile() or member.issym() or member.islnk():
                          raise SystemExit(f'non-regular carrier member: {member.name}')
                      source = archive.extractfile(member)
                      if source is None:
                          raise SystemExit(f'unreadable carrier member: {member.name}')
                      data = source.read()
                      target = files_root.joinpath(*path.parts)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(data)
                      target.chmod(member.mode & 0o777)
                      inventory.append({'path': member.name, 'bytes': len(data), 'sha256': sha256(data), 'mode': oct(member.mode & 0o777)})
              canonical = base64.b64encode(compressed)
              chunks_root = OUTPUT / 'carrier'
              chunks_root.mkdir(parents=True)
              for index, start in enumerate(range(0, len(canonical), 65536), 1):
                  (chunks_root / f'chunk-{index:03d}.b64').write_bytes(canonical[start:start+65536] + b'\n')
              for name, data in manifests.items():
                  (chunks_root / name).write_bytes(data)
              mechanism = {'class': 'exact-carrier-recovery', 'source': label, 'carrierArchiveReconstructed': True}
          else:
              if 'FILES.txt' not in manifests or 'FILES.SHA256SUMS' not in manifests:
                  raise SystemExit('exact carrier absent and axm-canon per-file manifests unavailable')
              expected_paths = manifests['FILES.txt'].decode().splitlines()
              expected: dict[str, str] = {}
              for line in manifests['FILES.SHA256SUMS'].decode().splitlines():
                  digest, path = line.split('  ', 1)
                  expected[path] = digest
              if sorted(expected_paths) != sorted(expected) or len(expected) != 32:
                  raise SystemExit('axm-canon file manifests are not an exact 32-file pair')
              by_digest: dict[str, tuple[str, bytes]] = {}
              wanted = set(expected.values())
              for label, data in all_payloads:
                  digest = sha256(data)
                  if digest in wanted and digest not in by_digest:
                      by_digest[digest] = (label, data)
              missing = {path: digest for path, digest in expected.items() if digest not in by_digest}
              if missing:
                  (ROOT / 'missing-file-digests.json').write_text(json.dumps(missing, indent=2) + '\n')
                  raise SystemExit(f'{len(missing)} exact public-corpus file digests remain unresolved')
              if OUTPUT.exists():
                  shutil.rmtree(OUTPUT)
              files_root = OUTPUT / 'files'
              files_root.mkdir(parents=True)
              inventory = []
              for path, digest in expected.items():
                  label, data = by_digest[digest]
                  target = files_root.joinpath(*safe_rel(path).parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  target.chmod(0o644)
                  inventory.append({'path': path, 'bytes': len(data), 'sha256': digest, 'mode': '0o644', 'source': label})
              chunks_root = OUTPUT / 'carrier'
              chunks_root.mkdir(parents=True)
              for name, data in manifests.items():
                  (chunks_root / name).write_bytes(data)
              mechanism = {'class': 'exact-file-digest-recovery', 'source': 'retained-axm-artifacts', 'carrierArchiveReconstructed': False}

          inventory.sort(key=lambda row: row['path'])
          receipt = {
              'format': 'axm-arc-axm-canon-public-corpus-recovery/1',
              'result': 'PASS',
              'mechanism': mechanism,
              'artifactDownloads': (ROOT / 'download-ledger.tsv').read_text().splitlines(),
              'expandedObjectCount': len(observed),
              'files': inventory,
              'expectedCarrier': {
                  'canonicalBase64Sha256': EXPECTED_B64_SHA,
                  'compressedSha256': EXPECTED_ZST_SHA,
                  'tarSha256': EXPECTED_TAR_SHA,
              },
              'authority': 'transport-and-file-specific',
              'canonEffect': 'none',
              'graphEffect': 'none',
          }
          (OUTPUT / 'RECOVERY_RECEIPT.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY

      - name: Verify recovered file inventory and commit staging surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import pathlib

          root = pathlib.Path('recovery/public-corpus-v1')
          receipt = json.loads((root / 'RECOVERY_RECEIPT.json').read_text())
          for row in receipt['files']:
              path = root / 'files' / row['path']
              if not path.is_file():
                  raise SystemExit(f'missing staged file: {row["path"]}')
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != row['sha256']:
                  raise SystemExit(f'digest mismatch: {row["path"]}')
          if len(receipt['files']) != 32:
              raise SystemExit('recovery did not stage exactly 32 files')
          PY
          rm -rf .recovery
          rm -f .github/workflows/axm-canon-public-corpus-recovery.yml
          git add -A
          git diff --cached --check
          git config user.name 'BigBirdReturns'
          git config user.email '219768509+BigBirdReturns@users.noreply.github.com'
          git commit -m 'Recover exact axm-canon public corpus staging surface'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Retain recovery diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          root="$RECOVERY_ROOT"
          find "$root" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum | sed "s#  $root/#  #" > "$root/SHA256SUMS" || true

      - name: Upload recovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axm-arc-axm-canon-public-corpus-recovery-v1
          path: ${{ runner.temp }}/axm-canon-public-corpus-recovery
          if-no-files-found: warn
          retention-days: 30
