name: Bootstrap ASOIAF credential deployment after enrollment

on:
  push:
    branches:
      - observer/asoiaf-deployment-bootstrap-v1
    paths:
      - '.github/workflows/bootstrap-asoiaf-credential-deployment.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: bootstrap-asoiaf-deployment-after-enrollment-v1
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.repository == 'BigBirdReturns/axm-arc'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ENROLLMENT_PR: '260'
      PAYLOAD_ISSUE: '261'
      RECEIPT_MARKER: ASOIAF_ENROLLMENT_TERMINAL_RECEIPT_V1
      ENROLLMENT_BRANCH: feature/asoiaf-answer-desk-transport-enrollment-v1
      DEPLOYMENT_BRANCH: feature/asoiaf-answer-credential-deployment-v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          show-progress: false

      - name: Wait for terminal enrollment custody
        id: enrollment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 120); do
            gh api "repos/$GITHUB_REPOSITORY/pulls/$ENROLLMENT_PR" > "$RUNNER_TEMP/pr.json"
            gh api "repos/$GITHUB_REPOSITORY/issues/$ENROLLMENT_PR/comments?per_page=100" > "$RUNNER_TEMP/comments.json"
            gh api "repos/$GITHUB_REPOSITORY/issues/$PAYLOAD_ISSUE" > "$RUNNER_TEMP/payload-issue.json"
            head_sha="$(jq -r .head.sha "$RUNNER_TEMP/pr.json")"
            if \
              test "$(jq -r .state "$RUNNER_TEMP/pr.json")" = open \
              && test "$(jq -r .draft "$RUNNER_TEMP/pr.json")" = true \
              && test "$(jq -r .merged "$RUNNER_TEMP/pr.json")" = false \
              && test "$(jq -r .head.ref "$RUNNER_TEMP/pr.json")" = "$ENROLLMENT_BRANCH" \
              && test "$(jq -r .state "$RUNNER_TEMP/payload-issue.json")" = closed \
              && jq -e --arg marker "$RECEIPT_MARKER" '[.[] | select((.body // "") | contains($marker))] | length > 0' "$RUNNER_TEMP/comments.json" >/dev/null; then
              ready=true
              break
            fi
            sleep 15
          done
          if test "$ready" != true; then
            gh pr comment "$ENROLLMENT_PR" --repo "$GITHUB_REPOSITORY" --body \
              'Credential-deployment bootstrap timed out before the enrollment terminal receipt and payload-issue closure were both present. No deployment branch was created.'
            exit 1
          fi
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Create the exact enrollment-based deployment branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.enrollment.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEPLOYMENT_BRANCH" --jq .object.sha 2>/dev/null || true)"
          if test -n "$existing"; then
            test "$existing" = "$HEAD_SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/heads/$DEPLOYMENT_BRANCH" \
              -f sha="$HEAD_SHA" >/dev/null
          fi
          gh pr comment "$ENROLLMENT_PR" --repo "$GITHUB_REPOSITORY" --body \
            "Credential-deployment branch \`$DEPLOYMENT_BRANCH\` now points exactly at terminal enrollment head \`$HEAD_SHA\`. No deployment implementation or authority was added by this bootstrap."

      - name: Remove the disposable bootstrap branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/observer/asoiaf-deployment-bootstrap-v1"
