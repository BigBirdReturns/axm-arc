name: Bootstrap ASOIAF external source atlas

on:
  push:
    branches:
      - feature/asoiaf-external-source-atlas-v1
    paths:
      - 'tools/asoiaf-external-source-atlas-stage.b64'
      - '.github/workflows/bootstrap-asoiaf-external-source-atlas.yml'
  pull_request:
    branches:
      - feature/asoiaf-conversation-synthesis-v1
    paths:
      - 'tools/asoiaf-external-source-atlas-stage.b64'
      - '.github/workflows/bootstrap-asoiaf-external-source-atlas.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: asoiaf-external-source-atlas-bootstrap
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact atlas branch
        uses: actions/checkout@v4
        with:
          ref: feature/asoiaf-external-source-atlas-v1
          fetch-depth: 0

      - name: Detect staged payload
        id: staged
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f tools/asoiaf-external-source-atlas-stage.b64 ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'External source atlas payload already materialized.'
          fi

      - name: Decode and verify external source atlas
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          encoded=tools/asoiaf-external-source-atlas-stage.b64
          normalized="$RUNNER_TEMP/asoiaf-external-source-atlas-stage.normalized.b64"
          tr -d '\r\n' < "$encoded" > "$normalized"
          normalized_bytes="$(wc -c < "$normalized" | tr -d ' ')"
          normalized_sha="$(sha256sum "$normalized" | cut -d' ' -f1)"
          echo "normalized base64 bytes: $normalized_bytes"
          echo "normalized base64 sha256: $normalized_sha"
          payload="$RUNNER_TEMP/asoiaf-external-source-atlas-stage.tar.gz"
          base64 --decode "$normalized" > "$payload"
          payload_bytes="$(wc -c < "$payload" | tr -d ' ')"
          payload_sha="$(sha256sum "$payload" | cut -d' ' -f1)"
          echo "decoded payload bytes: $payload_bytes"
          echo "decoded payload sha256: $payload_sha"
          test "$payload_sha" = 'd1bcb5e09accf3b174c73e1da9e8a7af31e87fc95f65277d616d2b056d24c7bb'
          tar -tzf "$payload" >/dev/null
          tar -xzf "$payload" -C .

      - name: Replace transport with source atlas implementation
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/asoiaf-external-source-atlas-stage.b64
          rmdir tools 2>/dev/null || true
          rm -f .github/workflows/asoiaf-external-source-atlas.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No materialized changes were produced.' >&2
            exit 1
          fi
          git commit -m 'Add ASOIAF external source atlas and harvest router'
          git push origin HEAD:feature/asoiaf-external-source-atlas-v1
