name: Bootstrap ASOIAF model-recall estate

on:
  push:
    branches:
      - feature/asoiaf-model-recall-estate-v1
    paths:
      - 'tools/asoiaf-recall-stage.b64.part-*'
      - '.github/workflows/bootstrap-asoiaf-model-recall.yml'
  pull_request:
    branches:
      - feature/canon-constraint-bible-v1
    paths:
      - 'tools/asoiaf-recall-stage.b64.part-*'
      - '.github/workflows/bootstrap-asoiaf-model-recall.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: asoiaf-model-recall-bootstrap
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact recall branch
        uses: actions/checkout@v4
        with:
          ref: feature/asoiaf-model-recall-estate-v1
          fetch-depth: 0

      - name: Detect staged payload
        id: staged
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(tools/asoiaf-recall-stage.b64.part-*)
          if (( ${#parts[@]} == 0 )); then
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'The staged payload has already been materialized.'
          else
            echo 'present=true' >> "$GITHUB_OUTPUT"
            printf 'Detected %s transport parts.\n' "${#parts[@]}"
          fi

      - name: Decode and verify recall estate
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/asoiaf-model-recall-stage.tar.xz"
          cat tools/asoiaf-recall-stage.b64.part-* \
            | tr -d '\r\n' \
            | sed 's/---11---//g' \
            | base64 --decode \
            > "$payload"
          printf '%s  %s\n' \
            'ca4a5258f26bf0b263066ac5caf729779f52b71874a9b1f527682980f91ed730' \
            "$payload" \
            | sha256sum -c -
          tar -xJf "$payload" -C .

      - name: Replace transport parts with the recall estate
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/asoiaf-recall-stage.b64.part-*
          rmdir tools 2>/dev/null || true
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No materialized changes were produced.' >&2
            exit 1
          fi
          git commit -m 'Add ASOIAF model-recall bootstrap estate'
          git push origin HEAD:feature/asoiaf-model-recall-estate-v1
