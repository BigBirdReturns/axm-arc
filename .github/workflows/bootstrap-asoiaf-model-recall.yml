name: Bootstrap ASOIAF model-recall estate

on:
  push:
    branches:
      - feature/asoiaf-model-recall-estate-v1
    paths:
      - 'tools/asoiaf-recall-stage.b64.part-*'
      - '.github/workflows/bootstrap-asoiaf-model-recall.yml'
  pull_request:
    branches:
      - feature/canon-constraint-bible-v1
    paths:
      - 'tools/asoiaf-recall-stage.b64.part-*'
      - '.github/workflows/bootstrap-asoiaf-model-recall.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: asoiaf-model-recall-bootstrap
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact recall branch
        uses: actions/checkout@v4
        with:
          ref: feature/asoiaf-model-recall-estate-v1
          fetch-depth: 0

      - name: Detect staged payload
        id: staged
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f tools/asoiaf-recall-stage.b64.part-00 ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
            echo 'The staged recall payload is present.'
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'The staged payload has already been materialized.'
          fi

      - name: Decode and verify recall estate
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          parts=(
            tools/asoiaf-recall-stage.b64.part-00
            tools/asoiaf-recall-stage.b64.part-01
            tools/asoiaf-recall-stage.b64.part-02
            tools/asoiaf-recall-stage.b64.part-03
            tools/asoiaf-recall-stage.b64.part-04
            tools/asoiaf-recall-stage.b64.part-05
            tools/asoiaf-recall-stage.b64.part-06a
            tools/asoiaf-recall-stage.b64.part-06b
            tools/asoiaf-recall-stage.b64.part-07
            tools/asoiaf-recall-stage.b64.part-08
            tools/asoiaf-recall-stage.b64.part-09
            tools/asoiaf-recall-stage.b64.part-10
            tools/asoiaf-recall-stage.b64.part-11
            tools/asoiaf-recall-stage.b64.part-12
          )
          declare -A expected_sha=(
            [part-00]='b2b543139f32b897d716241e398e3ef6990ed2f8ec1f5f03083f2cd0f8c94c18'
            [part-01]='aef43b8ee7e1eef74c3e4f709ad83bf53a5420bfc5eec193765c979902de832b'
            [part-02]='b61783ded2362e763f449472e1915c0a6cada7be76c98d27eb43af9147526ee1'
            [part-03]='b7850fc4618ea8b785e96768960450003fbd105a5eee927b23f5f5c8a72b7506'
            [part-04]='a3cfb70c5f56858806d2308b6af99a0613e3562c9ef8feb91b31c906e4dc0b77'
            [part-05]='1b1e6396bf05c22e87ee6f47ad189bf91f799c7077f020e6427fc3349b98bbcc'
            [part-06a]='51fb428def28e7d1f121224bd56477d97da59082b82841efaaa6e07ab6440bb7'
            [part-06b]='00769bdf08a1b131266c112027b9c5b79650e1ea14f57e0bf71397759e6186fd'
            [part-07]='f5f5fdde03163d2524bc7bc5c2c86559b4317b1ea0b651997c519486536ed820'
            [part-08]='abfd5346440161b61c4a63d633b0e7e76bf60c68371ddb7dafabe5d0f0998046'
            [part-09]='9fae55f6f76d168119fd417ed945b1b1a0af4218bc6f4d69853b43d97269a6a0'
            [part-10]='2be6ed1813f0ce520555adf8d2cbfb49dd65db002e73abad9419eb872cc32674'
            [part-11]='f08f0dd548fe0f71d1bb2db0a64b2f6aade88d68a19664adead2fd1e768ef69c'
            [part-12]='9801d6f04268fa04503f405ff3a8292d5b21b2229d1a75dba918b3ef277b46c0'
          )
          declare -A expected_bytes=(
            [part-00]=8000 [part-01]=8000 [part-02]=8000 [part-03]=8000
            [part-04]=8000 [part-05]=8000 [part-06a]=4000 [part-06b]=4000
            [part-07]=8000 [part-08]=8000 [part-09]=8000 [part-10]=8000
            [part-11]=8000 [part-12]=3856
          )

          encoded="$RUNNER_TEMP/asoiaf-model-recall-stage.b64"
          : > "$encoded"
          for source in "${parts[@]}"; do
            test -f "$source"
            key="${source##*.}"
            normalized="$RUNNER_TEMP/$key.normalized"
            python - "$source" "${expected_bytes[$key]}" "${expected_sha[$key]}" "$normalized" <<'PY'
          import hashlib
          import pathlib
          import string
          import sys

          source = pathlib.Path(sys.argv[1])
          expected_bytes = int(sys.argv[2])
          expected_sha = sys.argv[3]
          output = pathlib.Path(sys.argv[4])
          value = source.read_text(encoding="utf-8").replace("\r", "").replace("\n", "")
          value = value.replace("---11---", "")

          def digest(candidate: str) -> str:
              return hashlib.sha256(candidate.encode("ascii")).hexdigest()

          repaired = value
          action = "exact"
          if len(repaired) == expected_bytes and digest(repaired) == expected_sha:
              pass
          elif len(repaired) == expected_bytes - 1:
              alphabet = string.ascii_uppercase + string.ascii_lowercase + string.digits + "+/="
              found = None
              for index in range(expected_bytes):
                  prefix = repaired[:index]
                  suffix = repaired[index:]
                  for character in alphabet:
                      candidate = prefix + character + suffix
                      if digest(candidate) == expected_sha:
                          found = candidate
                          action = f"inserted {character!r} at offset {index}"
                          break
                  if found is not None:
                      break
              if found is None:
                  raise SystemExit(f"{source}: one-byte repair did not satisfy {expected_sha}")
              repaired = found
          elif len(repaired) == expected_bytes + 1:
              found = None
              for index in range(len(repaired)):
                  candidate = repaired[:index] + repaired[index + 1:]
                  if digest(candidate) == expected_sha:
                      found = candidate
                      action = f"removed byte at offset {index}"
                      break
              if found is None:
                  raise SystemExit(f"{source}: one-byte removal did not satisfy {expected_sha}")
              repaired = found
          else:
              raise SystemExit(
                  f"{source}: received {len(repaired)} bytes, expected {expected_bytes}; bounded repair refused"
              )

          if len(repaired) != expected_bytes or digest(repaired) != expected_sha:
              raise SystemExit(f"{source}: normalized payload still failed exact identity")
          output.write_text(repaired, encoding="ascii")
          print(f"{source.name}: {action}; bytes={len(repaired)} sha256={expected_sha}")
          PY
            cat "$normalized" >> "$encoded"
          done

          test "$(wc -c < "$encoded" | tr -d ' ')" = '99856'
          payload="$RUNNER_TEMP/asoiaf-model-recall-stage.tar.xz"
          base64 --decode "$encoded" > "$payload"
          printf '%s  %s\n' \
            'ca4a5258f26bf0b263066ac5caf729779f52b71874a9b1f527682980f91ed730' \
            "$payload" \
            | sha256sum -c -
          tar -xJf "$payload" -C .

      - name: Replace transport parts with the recall estate
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/asoiaf-recall-stage.b64.part-*
          rmdir tools 2>/dev/null || true
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No materialized changes were produced.' >&2
            exit 1
          fi
          git commit -m 'Add ASOIAF model-recall bootstrap estate'
          git push origin HEAD:feature/asoiaf-model-recall-estate-v1
