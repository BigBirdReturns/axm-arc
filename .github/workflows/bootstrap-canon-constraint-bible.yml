name: Bootstrap canon constraint bible

on:
  push:
    branches:
      - feature/canon-constraint-bible-v1
    paths:
      - tools/canon-stage.b64.part-*
      - .github/workflows/bootstrap-canon-constraint-bible.yml
  pull_request:
    branches:
      - qualify/narrative-rails-baseline-v1
    paths:
      - tools/canon-stage.b64.part-*
      - .github/workflows/bootstrap-canon-constraint-bible.yml

permissions:
  contents: write

concurrency:
  group: canon-constraint-bible-bootstrap
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact branch
        uses: actions/checkout@v4
        with:
          ref: feature/canon-constraint-bible-v1
          fetch-depth: 0

      - name: Decode and verify the staged source tree
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/canon-stage.tar.gz"
          cat tools/canon-stage.b64.part-* | tr -d '\r\n' | base64 --decode > "$payload"
          printf '%s  %s\n' \
            '7884a2aedc33c587a08e77c415bb7ed54707a91104baedeef853d286f7b0f0ca' \
            "$payload" \
            | sha256sum -c -
          tar -xzf "$payload" -C .

      - name: Replace the transport carrier with the implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/canon-stage.b64.part-*
          rmdir tools 2>/dev/null || true
          rm -f .github/workflows/bootstrap-canon-constraint-bible.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No materialized changes were produced.' >&2
            exit 1
          fi
          git commit -m 'Add deterministic canon constraint bible'
          git push origin HEAD:feature/canon-constraint-bible-v1
