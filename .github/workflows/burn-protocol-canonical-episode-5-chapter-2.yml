name: Burn Protocol canonical through Episode 5 Chapter 2

on:
  pull_request:
    paths:
      - '.github/workflows/burn-protocol-canonical-episode-5-chapter-2.yml'
      - 'src/canonical-story/**'
      - 'src/burn-protocol/**'
      - 'src/source-planes/registry.ts'
      - 'tests/canonical-story/**'
      - 'tests/source-planes/registry.test.ts'
      - 'tools/build-burn-protocol-*.ts'
      - 'docs/BURN_PROTOCOL_CANONICAL_EPISODE_5_CHAPTER_2.md'
  push:
    branches: [feature/burn-protocol-canonical-story-episode-5-chapter-2-v1]
    paths:
      - '.github/workflows/burn-protocol-canonical-episode-5-chapter-2.yml'
      - 'src/canonical-story/**'
      - 'src/burn-protocol/**'
      - 'src/source-planes/registry.ts'
      - 'tests/canonical-story/**'
      - 'tests/source-planes/registry.test.ts'
      - 'tools/build-burn-protocol-*.ts'
      - 'docs/BURN_PROTOCOL_CANONICAL_EPISODE_5_CHAPTER_2.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          show-progress: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck and focused contracts
        run: |
          set -euo pipefail
          npm run typecheck | tee "$RUNNER_TEMP/typecheck.log"
          npm test -- \
            tests/canonical-story/burn-protocol-episode-5-chapter-1.test.ts \
            tests/canonical-story/burn-protocol-episode-5-chapter-2.test.ts \
            tests/source-planes/registry.test.ts \
            | tee "$RUNNER_TEMP/focused-tests.log"

      - name: Build deterministic publication twice
        run: |
          set -euo pipefail
          publication_a="$RUNNER_TEMP/publication-a"
          publication_b="$RUNNER_TEMP/publication-b"
          npx vite-node tools/build-burn-protocol-episode-5-chapter-2.ts "$publication_a" \
            | tee "$RUNNER_TEMP/publication-a.log"
          npx vite-node tools/build-burn-protocol-episode-5-chapter-2.ts "$publication_b" \
            | tee "$RUNNER_TEMP/publication-b.log"
          diff -ru "$publication_a" "$publication_b"
          (cd "$publication_a" && sha256sum -c SHA256SUMS)
          printf 'BURN_THROUGH_EPISODE_5_CHAPTER_2_PUBLICATION=%s\n' "$publication_a" >> "$GITHUB_ENV"

      - name: Assert Episode 5 Chapter 2 publication law
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.env.BURN_THROUGH_EPISODE_5_CHAPTER_2_PUBLICATION;
          const prefix = 'burn-protocol-through-episode-05-chapter-02';
          const arc = JSON.parse(fs.readFileSync(path.join(root, `${prefix}.arc.json`), 'utf8'));
          const source = JSON.parse(fs.readFileSync(path.join(root, `${prefix}.burn.json`), 'utf8'));
          const coverage = JSON.parse(fs.readFileSync(path.join(root, `${prefix}.coverage.json`), 'utf8'));
          const episode5 = source.canonicalStory.episodes[4];
          const chapter2 = episode5.chapters[1];
          const fail = (message) => { throw new Error(message); };
          if (arc.meta.id !== 'burn-protocol' || arc.challenges.length !== 0 || arc.roles.length !== 0) fail('Arc authority drift.');
          if (episode5.title !== 'Nursery World' || episode5.complete !== false || episode5.nextChapterId !== 'E05-C3') fail('Episode 5 extent drift.');
          if (chapter2.title !== 'The Mother' || chapter2.openingPanelId !== 'E05-C2-P21'
              || chapter2.terminalPanelId !== 'E05-C2-P40' || chapter2.nextPanelId !== 'E05-C3-P41') fail('A05C2 identity drift.');
          if (chapter2.panels.length !== 20 || chapter2.plates.length !== 4) fail('A05C2 media extent drift.');
          if (coverage.episodes !== 5 || coverage.chapters !== 14 || coverage.panels !== 280 || coverage.plates !== 56) fail('Combined extent drift.');
          if (coverage.unresolvedTextPanels !== 280 || coverage.unresolvedPlateMappings !== 56
              || coverage.choiceNodes !== 0 || coverage.productionReady !== false) fail('Expression or readiness drift.');
          if (JSON.stringify(coverage.continuationPanelIds) !== JSON.stringify(['E05-C3-P41'])) fail('Continuation drift.');
          if (coverage.sourceRequiredAssets.length !== 1 || coverage.sourceRequiredAssets[0].id !== 'asset:E03-C2-P31') fail('Inherited custody refusal drift.');
          NODE

      - name: Complete regression and build
        run: |
          set -euo pipefail
          npm test | tee "$RUNNER_TEMP/full-tests.log"
          npm run build | tee "$RUNNER_TEMP/build.log"

      - name: Retain qualification
        if: always()
        run: |
          set -euo pipefail
          root="burn-protocol-canonical-through-episode-5-chapter-2-qualification"
          mkdir -p "$root"
          cp -R "${BURN_THROUGH_EPISODE_5_CHAPTER_2_PUBLICATION:-$RUNNER_TEMP/publication-a}" "$root/publication" 2>/dev/null || true
          cp "$RUNNER_TEMP"/*.log "$root/" 2>/dev/null || true
          printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" > "$root/arc-candidate-sha.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" \
            > "$root/SHA256SUMS"

      - name: Upload qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: burn-protocol-canonical-through-episode-5-chapter-2-qualification
          path: burn-protocol-canonical-through-episode-5-chapter-2-qualification
          if-no-files-found: error
          retention-days: 30
