name: Burn Protocol canonical through Chapter 2

on:
  pull_request:
    paths:
      - '.github/workflows/burn-protocol-canonical-story.yml'
      - 'src/canonical-story/**'
      - 'src/burn-protocol/**'
      - 'src/source-planes/registry.ts'
      - 'tests/canonical-story/**'
      - 'tests/source-planes/registry.test.ts'
      - 'tools/build-burn-protocol-chapter-1.ts'
      - 'tools/build-burn-protocol-chapter-2.ts'
  push:
    branches: [feature/burn-protocol-canonical-story-chapter-2-v1]
    paths:
      - '.github/workflows/burn-protocol-canonical-story.yml'
      - 'src/canonical-story/**'
      - 'src/burn-protocol/**'
      - 'src/source-planes/registry.ts'
      - 'tests/canonical-story/**'
      - 'tests/source-planes/registry.test.ts'
      - 'tools/build-burn-protocol-chapter-1.ts'
      - 'tools/build-burn-protocol-chapter-2.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify-through-chapter-2:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          show-progress: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck and focused canonical-story contracts
        run: |
          set -euo pipefail
          npm run typecheck | tee "$RUNNER_TEMP/typecheck.log"
          npm test -- \
            tests/canonical-story/burn-protocol-chapter-1.test.ts \
            tests/canonical-story/burn-protocol-chapter-2.test.ts \
            tests/source-planes/registry.test.ts \
            | tee "$RUNNER_TEMP/focused-tests.log"

      - name: Rebuild the two-chapter publication twice
        run: |
          set -euo pipefail
          publication_a="$RUNNER_TEMP/publication-a"
          publication_b="$RUNNER_TEMP/publication-b"
          npx vite-node tools/build-burn-protocol-chapter-2.ts "$publication_a" \
            | tee "$RUNNER_TEMP/publication-a.log"
          npx vite-node tools/build-burn-protocol-chapter-2.ts "$publication_b" \
            | tee "$RUNNER_TEMP/publication-b.log"
          diff -ru "$publication_a" "$publication_b"
          (cd "$publication_a" && sha256sum -c SHA256SUMS)
          printf 'BURN_THROUGH_CHAPTER_2_PUBLICATION=%s\n' "$publication_a" >> "$GITHUB_ENV"

      - name: Assert corpus-native cross-chapter law
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.env.BURN_THROUGH_CHAPTER_2_PUBLICATION;
          const prefix = 'burn-protocol-episode-01-through-chapter-02';
          const arc = JSON.parse(fs.readFileSync(path.join(root, `${prefix}.arc.json`), 'utf8'));
          const source = JSON.parse(fs.readFileSync(path.join(root, `${prefix}.burn.json`), 'utf8'));
          const coverage = JSON.parse(fs.readFileSync(path.join(root, `${prefix}.coverage.json`), 'utf8'));
          const [chapter1, chapter2] = source.canonicalStory.episodes[0].chapters;
          const fail = (message) => { throw new Error(message); };
          if (arc.meta.id !== 'burn-protocol') fail('Stable series identity drift.');
          if (arc.challenges.length !== 0) fail('Canonical story Arc contains simulation challenges.');
          if (arc.roles.length !== 0) fail('Canonical story Arc contains simulation roles.');
          if (source.canonicalStory.authority.choicePolicy !== 'none') fail('Canonical path admits choices.');
          if (source.canonicalStory.episodes[0].chapters.length !== 2) fail('Two chapters were not assembled.');
          if (chapter1.panels.length !== 18 || chapter2.panels.length !== 20) fail('Panel extent drift.');
          if (chapter1.plates.length !== 4 || chapter2.plates.length !== 4) fail('Plate extent drift.');
          if (chapter1.nextPanelId !== chapter2.openingPanelId) fail('P18 to P19 chapter seam drift.');
          if (chapter2.previousPanelId !== chapter1.terminalPanelId) fail('Reverse chapter seam drift.');
          if (chapter2.terminalPanelId !== 'E01-C2-P38') fail('Chapter 2 terminal drift.');
          if (chapter2.nextPanelId !== 'E01-C3-P39') fail('Chapter 3 continuation drift.');
          if (coverage.panels !== 38 || coverage.plates !== 8) fail('Coverage extent drift.');
          if (coverage.unresolvedTextPanels !== 38) fail('Unavailable source text was silently promoted.');
          if (coverage.unresolvedPlateMappings !== 8) fail('Unavailable plate maps were silently inferred.');
          if (coverage.choiceNodes !== 0) fail('Coverage contains choice nodes.');
          if (JSON.stringify(coverage.continuationPanelIds) !== JSON.stringify(['E01-C3-P39'])) {
            fail('Internal P19 seam was misclassified as an unpublished continuation.');
          }
          NODE

      - name: Complete Arc regression and production build
        run: |
          set -euo pipefail
          npm test | tee "$RUNNER_TEMP/full-tests.log"
          npm run build | tee "$RUNNER_TEMP/build.log"

      - name: Retain through-Chapter-2 qualification
        if: always()
        run: |
          set -euo pipefail
          root="burn-protocol-canonical-through-chapter-2-qualification"
          mkdir -p "$root"
          cp -R "${BURN_THROUGH_CHAPTER_2_PUBLICATION:-$RUNNER_TEMP/publication-a}" "$root/publication" 2>/dev/null || true
          cp "$RUNNER_TEMP"/typecheck.log "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP"/focused-tests.log "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP"/publication-a.log "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP"/publication-b.log "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP"/full-tests.log "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP"/build.log "$root/" 2>/dev/null || true
          printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" > "$root/arc-candidate-sha.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" \
            > "$root/SHA256SUMS"

      - name: Upload through-Chapter-2 qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: burn-protocol-canonical-through-chapter-2-qualification
          path: burn-protocol-canonical-through-chapter-2-qualification
          if-no-files-found: error
          retention-days: 30
