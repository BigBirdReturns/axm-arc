name: Burn Protocol canonical through Episode 3 Chapter 2

on:
  pull_request:
    paths:
      - '.github/workflows/burn-protocol-canonical-story.yml'
      - 'src/canonical-story/**'
      - 'src/burn-protocol/**'
      - 'src/source-planes/registry.ts'
      - 'tests/canonical-story/**'
      - 'tests/source-planes/registry.test.ts'
      - 'tools/build-burn-protocol-*.ts'
  push:
    branches: [feature/burn-protocol-canonical-story-episode-3-chapter-2-v1]
    paths:
      - '.github/workflows/burn-protocol-canonical-story.yml'
      - 'src/canonical-story/**'
      - 'src/burn-protocol/**'
      - 'src/source-planes/registry.ts'
      - 'tests/canonical-story/**'
      - 'tests/source-planes/registry.test.ts'
      - 'tools/build-burn-protocol-*.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify-through-episode-3-chapter-2:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          show-progress: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck and focused canonical-story contracts
        run: |
          set -euo pipefail
          npm run typecheck | tee "$RUNNER_TEMP/typecheck.log"
          npm test -- \
            tests/canonical-story/burn-protocol-episode-2.test.ts \
            tests/canonical-story/burn-protocol-episode-3-chapter-1.test.ts \
            tests/canonical-story/burn-protocol-episode-3-chapter-2.test.ts \
            tests/source-planes/registry.test.ts \
            | tee "$RUNNER_TEMP/focused-tests.log"

      - name: Rebuild the through-Episode-3-Chapter-2 publication twice
        run: |
          set -euo pipefail
          publication_a="$RUNNER_TEMP/publication-a"
          publication_b="$RUNNER_TEMP/publication-b"
          npx vite-node tools/build-burn-protocol-episode-3-chapter-2.ts "$publication_a" \
            | tee "$RUNNER_TEMP/publication-a.log"
          npx vite-node tools/build-burn-protocol-episode-3-chapter-2.ts "$publication_b" \
            | tee "$RUNNER_TEMP/publication-b.log"
          diff -ru "$publication_a" "$publication_b"
          (cd "$publication_a" && sha256sum -c SHA256SUMS)
          printf 'BURN_THROUGH_EPISODE_3_CHAPTER_2_PUBLICATION=%s\n' "$publication_a" >> "$GITHUB_ENV"

      - name: Assert corpus-native series law through Lockout
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.env.BURN_THROUGH_EPISODE_3_CHAPTER_2_PUBLICATION;
          const prefix = 'burn-protocol-through-episode-03-chapter-02';
          const arc = JSON.parse(fs.readFileSync(path.join(root, `${prefix}.arc.json`), 'utf8'));
          const source = JSON.parse(fs.readFileSync(path.join(root, `${prefix}.burn.json`), 'utf8'));
          const coverage = JSON.parse(fs.readFileSync(path.join(root, `${prefix}.coverage.json`), 'utf8'));
          const [episode1, episode2, episode3] = source.canonicalStory.episodes;
          const e2Terminal = episode2.chapters.at(-1);
          const [headquarters, lockout] = episode3.chapters;
          const fail = (message) => { throw new Error(message); };
          if (arc.meta.id !== 'burn-protocol') fail('Stable series identity drift.');
          if (arc.challenges.length !== 0 || arc.roles.length !== 0) fail('Simulation law entered the canonical story.');
          if (source.canonicalStory.authority.choicePolicy !== 'none') fail('Canonical path admits choices.');
          if (source.canonicalStory.episodes.length !== 3) fail('Episode 3 was not assembled.');
          if (!episode1.complete || !episode2.complete) fail('Prior episode completion drift.');
          if (episode3.complete || episode3.nextChapterId !== 'E03-C3') fail('Episode 3 extent drift.');
          if (episode3.chapters.length !== 2) fail('Two Episode 3 chapters were not assembled.');
          if (headquarters.id !== 'E03-C1' || headquarters.title !== 'Headquarters') fail('Headquarters identity drift.');
          if (lockout.id !== 'E03-C2' || lockout.title !== 'Lockout') fail('Lockout identity drift.');
          if (headquarters.panels.length !== 20 || lockout.panels.length !== 20) fail('Episode 3 panel extent drift.');
          if (headquarters.plates.length !== 4 || lockout.plates.length !== 4) fail('Episode 3 plate extent drift.');
          if (e2Terminal.nextPanelId !== headquarters.openingPanelId) fail('E02 to E03 forward seam drift.');
          if (headquarters.previousPanelId !== e2Terminal.terminalPanelId) fail('E03 to E02 reverse seam drift.');
          if (headquarters.nextPanelId !== lockout.openingPanelId) fail('Headquarters to Lockout forward seam drift.');
          if (lockout.previousPanelId !== headquarters.terminalPanelId) fail('Lockout to Headquarters reverse seam drift.');
          if (lockout.terminalPanelId !== 'E03-C2-P40') fail('Lockout terminal drift.');
          if (lockout.nextPanelId !== 'E03-C3-P41') fail('Episode 3 Chapter 3 continuation drift.');
          if (coverage.episodes !== 3 || coverage.chapters !== 8 || coverage.panels !== 160) fail('Series extent drift.');
          if (coverage.plates !== 32) fail('Plate coverage drift.');
          if (coverage.unresolvedTextPanels !== 160 || coverage.unresolvedPlateMappings !== 32) {
            fail('Unavailable expression was silently promoted.');
          }
          if (coverage.choiceNodes !== 0) fail('Coverage contains choice nodes.');
          if (JSON.stringify(coverage.incompleteEpisodeIds) !== JSON.stringify(['E03'])) {
            fail('Episode completion classification drift.');
          }
          if (JSON.stringify(coverage.continuationPanelIds) !== JSON.stringify(['E03-C3-P41'])) {
            fail('Internal seams were misclassified as unpublished continuations.');
          }
          if (!Array.isArray(coverage.sourceRequiredAssets) || coverage.sourceRequiredAssets.length !== 1) {
            fail('The exact unresolved asset ledger was not preserved.');
          }
          const p31 = lockout.panels.find((panel) => panel.id === 'E03-C2-P31');
          if (!p31 || p31.asset.status !== 'source-required' || 'sha256' in p31.asset) {
            fail('E03-C2-P31 acquired fabricated asset custody.');
          }
          if (p31.asset.expectedBytes !== 156208) fail('E03-C2-P31 expected byte count drift.');
          if (JSON.stringify(source.estate.canonicalSourceReceiptIds) !== JSON.stringify([
            'episode-01-source', 'episode-02-source', 'episode-03-source',
          ])) fail('Canonical episode source custody drift.');
          if (JSON.stringify(source.estate.compiledSourceReceiptIds) !== JSON.stringify([
            'episode-01-compiled', 'episode-02-compiled',
          ])) fail('Compiled source custody was fabricated or drifted.');
          NODE

      - name: Complete Arc regression and production build
        run: |
          set -euo pipefail
          npm test | tee "$RUNNER_TEMP/full-tests.log"
          npm run build | tee "$RUNNER_TEMP/build.log"

      - name: Retain through-Episode-3-Chapter-2 qualification
        if: always()
        run: |
          set -euo pipefail
          root="burn-protocol-canonical-through-episode-3-chapter-2-qualification"
          mkdir -p "$root"
          cp -R "${BURN_THROUGH_EPISODE_3_CHAPTER_2_PUBLICATION:-$RUNNER_TEMP/publication-a}" "$root/publication" 2>/dev/null || true
          cp "$RUNNER_TEMP"/typecheck.log "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP"/focused-tests.log "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP"/publication-a.log "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP"/publication-b.log "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP"/full-tests.log "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP"/build.log "$root/" 2>/dev/null || true
          printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" > "$root/arc-candidate-sha.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" \
            > "$root/SHA256SUMS"

      - name: Upload through-Episode-3-Chapter-2 qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: burn-protocol-canonical-through-episode-3-chapter-2-qualification
          path: burn-protocol-canonical-through-episode-3-chapter-2-qualification
          if-no-files-found: error
          retention-days: 30
