name: Burn Protocol canonical through Episode 3

on:
  pull_request:
    paths:
      - '.github/workflows/burn-protocol-canonical-story.yml'
      - 'src/canonical-story/**'
      - 'src/burn-protocol/**'
      - 'src/source-planes/registry.ts'
      - 'tests/canonical-story/**'
      - 'tests/source-planes/registry.test.ts'
      - 'tools/build-burn-protocol-*.ts'
  push:
    branches: [feature/burn-protocol-canonical-story-episode-3-v1]
    paths:
      - '.github/workflows/burn-protocol-canonical-story.yml'
      - 'src/canonical-story/**'
      - 'src/burn-protocol/**'
      - 'src/source-planes/registry.ts'
      - 'tests/canonical-story/**'
      - 'tests/source-planes/registry.test.ts'
      - 'tools/build-burn-protocol-*.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify-through-episode-3:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          show-progress: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck and focused canonical-story contracts
        run: |
          set -euo pipefail
          npm run typecheck | tee "$RUNNER_TEMP/typecheck.log"
          npm test -- \
            tests/canonical-story/burn-protocol-episode-3-chapter-1.test.ts \
            tests/canonical-story/burn-protocol-episode-3-chapter-2.test.ts \
            tests/canonical-story/burn-protocol-episode-3.test.ts \
            tests/source-planes/registry.test.ts \
            | tee "$RUNNER_TEMP/focused-tests.log"

      - name: Rebuild the complete Episode 3 publication twice
        run: |
          set -euo pipefail
          publication_a="$RUNNER_TEMP/publication-a"
          publication_b="$RUNNER_TEMP/publication-b"
          npx vite-node tools/build-burn-protocol-episode-3.ts "$publication_a" \
            | tee "$RUNNER_TEMP/publication-a.log"
          npx vite-node tools/build-burn-protocol-episode-3.ts "$publication_b" \
            | tee "$RUNNER_TEMP/publication-b.log"
          diff -ru "$publication_a" "$publication_b"
          (cd "$publication_a" && sha256sum -c SHA256SUMS)
          printf 'BURN_THROUGH_EPISODE_3_PUBLICATION=%s\n' "$publication_a" >> "$GITHUB_ENV"

      - name: Assert corpus-native series law through Prime Incident
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.env.BURN_THROUGH_EPISODE_3_PUBLICATION;
          const prefix = 'burn-protocol-through-episode-03';
          const arc = JSON.parse(fs.readFileSync(path.join(root, `${prefix}.arc.json`), 'utf8'));
          const source = JSON.parse(fs.readFileSync(path.join(root, `${prefix}.burn.json`), 'utf8'));
          const coverage = JSON.parse(fs.readFileSync(path.join(root, `${prefix}.coverage.json`), 'utf8'));
          const [episode1, episode2, episode3] = source.canonicalStory.episodes;
          const [headquarters, lockout, primeIncident] = episode3.chapters;
          const fail = (message) => { throw new Error(message); };
          if (arc.meta.id !== 'burn-protocol') fail('Stable series identity drift.');
          if (arc.challenges.length !== 0 || arc.roles.length !== 0) fail('Simulation law entered the canonical story.');
          if (source.canonicalStory.authority.choicePolicy !== 'none') fail('Canonical path admits choices.');
          if (source.canonicalStory.episodes.length !== 3) fail('Episode extent drift.');
          if (![episode1, episode2, episode3].every((episode) => episode.complete)) fail('Episode completion drift.');
          if (![episode1, episode2, episode3].every((episode) => episode.nextChapterId === null)) fail('Completed episode retained an unpublished chapter pointer.');
          if (episode3.title !== 'The Omega Thread' || episode3.chapters.length !== 3) fail('Episode 3 structure drift.');
          if (headquarters.title !== 'Headquarters' || lockout.title !== 'Lockout' || primeIncident.title !== 'Prime Incident') {
            fail('Episode 3 chapter identity drift.');
          }
          if (![headquarters, lockout, primeIncident].every((chapter) => chapter.panels.length === 20)) fail('Episode 3 panel extent drift.');
          if (![headquarters, lockout, primeIncident].every((chapter) => chapter.plates.length === 4)) fail('Episode 3 plate extent drift.');
          if (headquarters.nextPanelId !== lockout.openingPanelId || lockout.previousPanelId !== headquarters.terminalPanelId) {
            fail('Headquarters to Lockout seam drift.');
          }
          if (lockout.nextPanelId !== primeIncident.openingPanelId || primeIncident.previousPanelId !== lockout.terminalPanelId) {
            fail('Lockout to Prime Incident seam drift.');
          }
          if (primeIncident.terminalPanelId !== 'E03-C3-P60' || primeIncident.nextPanelId !== 'E04-C1-P01') {
            fail('Episode 3 terminal or Episode 4 continuation drift.');
          }
          if (coverage.episodes !== 3 || coverage.chapters !== 9 || coverage.panels !== 180 || coverage.plates !== 36) {
            fail('Complete series extent drift.');
          }
          if (coverage.unresolvedTextPanels !== 180 || coverage.unresolvedPlateMappings !== 36) {
            fail('Unavailable expression was silently promoted.');
          }
          if (coverage.choiceNodes !== 0 || coverage.productionReady !== false) fail('Canonical authority or readiness drift.');
          if (JSON.stringify(coverage.incompleteEpisodeIds) !== JSON.stringify([])) fail('Complete Episode 3 reported incomplete.');
          if (JSON.stringify(coverage.continuationPanelIds) !== JSON.stringify(['E04-C1-P01'])) {
            fail('Internal seams were misclassified as external continuations.');
          }
          if (!Array.isArray(coverage.sourceRequiredAssets) || coverage.sourceRequiredAssets.length !== 1
              || coverage.sourceRequiredAssets[0].id !== 'asset:E03-C2-P31') {
            fail('The inherited P31 custody gap was lost or multiplied.');
          }
          const p31 = lockout.panels.find((panel) => panel.id === 'E03-C2-P31');
          if (!p31 || p31.asset.status !== 'source-required' || 'sha256' in p31.asset) {
            fail('E03-C2-P31 acquired fabricated custody.');
          }
          if (source.canonicalStory.sourceReceipts.some((receipt) => receipt.id === 'a03c3-lettering')) {
            fail('Unreceipted A03C3 lettering source was invented.');
          }
          if (source.canonicalStory.sourceReceipts.some((receipt) => receipt.id === 'episode-03-compiled')) {
            fail('Unreceipted compiled Episode 3 source was invented.');
          }
          if (JSON.stringify(source.estate.canonicalSourceReceiptIds) !== JSON.stringify([
            'episode-01-source', 'episode-02-source', 'episode-03-source',
          ])) fail('Canonical source custody drift.');
          if (JSON.stringify(source.estate.compiledSourceReceiptIds) !== JSON.stringify([
            'episode-01-compiled', 'episode-02-compiled',
          ])) fail('Compiled source custody was fabricated or drifted.');
          NODE

      - name: Complete Arc regression and production build
        run: |
          set -euo pipefail
          npm test | tee "$RUNNER_TEMP/full-tests.log"
          npm run build | tee "$RUNNER_TEMP/build.log"

      - name: Retain Episode 3 qualification
        if: always()
        run: |
          set -euo pipefail
          root="burn-protocol-canonical-through-episode-3-qualification"
          mkdir -p "$root"
          cp -R "${BURN_THROUGH_EPISODE_3_PUBLICATION:-$RUNNER_TEMP/publication-a}" "$root/publication" 2>/dev/null || true
          cp "$RUNNER_TEMP"/typecheck.log "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP"/focused-tests.log "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP"/publication-a.log "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP"/publication-b.log "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP"/full-tests.log "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP"/build.log "$root/" 2>/dev/null || true
          printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" > "$root/arc-candidate-sha.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" \
            > "$root/SHA256SUMS"

      - name: Upload Episode 3 qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: burn-protocol-canonical-through-episode-3-qualification
          path: burn-protocol-canonical-through-episode-3-qualification
          if-no-files-found: error
          retention-days: 30
