name: Burn Protocol canonical Episode 1

on:
  pull_request:
    paths:
      - '.github/workflows/burn-protocol-canonical-story.yml'
      - 'src/canonical-story/**'
      - 'src/burn-protocol/**'
      - 'src/source-planes/registry.ts'
      - 'tests/canonical-story/**'
      - 'tests/source-planes/registry.test.ts'
      - 'tools/build-burn-protocol-chapter-1.ts'
      - 'tools/build-burn-protocol-chapter-2.ts'
      - 'tools/build-burn-protocol-episode-1.ts'
  push:
    branches: [feature/burn-protocol-canonical-story-chapter-3-v1]
    paths:
      - '.github/workflows/burn-protocol-canonical-story.yml'
      - 'src/canonical-story/**'
      - 'src/burn-protocol/**'
      - 'src/source-planes/registry.ts'
      - 'tests/canonical-story/**'
      - 'tests/source-planes/registry.test.ts'
      - 'tools/build-burn-protocol-chapter-1.ts'
      - 'tools/build-burn-protocol-chapter-2.ts'
      - 'tools/build-burn-protocol-episode-1.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify-episode-1:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          show-progress: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck and focused canonical-story contracts
        run: |
          set -euo pipefail
          npm run typecheck | tee "$RUNNER_TEMP/typecheck.log"
          npm test -- \
            tests/canonical-story/burn-protocol-chapter-1.test.ts \
            tests/canonical-story/burn-protocol-chapter-2.test.ts \
            tests/canonical-story/burn-protocol-chapter-3.test.ts \
            tests/source-planes/registry.test.ts \
            | tee "$RUNNER_TEMP/focused-tests.log"

      - name: Rebuild the complete Episode 1 publication twice
        run: |
          set -euo pipefail
          publication_a="$RUNNER_TEMP/publication-a"
          publication_b="$RUNNER_TEMP/publication-b"
          npx vite-node tools/build-burn-protocol-episode-1.ts "$publication_a" \
            | tee "$RUNNER_TEMP/publication-a.log"
          npx vite-node tools/build-burn-protocol-episode-1.ts "$publication_b" \
            | tee "$RUNNER_TEMP/publication-b.log"
          diff -ru "$publication_a" "$publication_b"
          (cd "$publication_a" && sha256sum -c SHA256SUMS)
          printf 'BURN_EPISODE_1_PUBLICATION=%s\n' "$publication_a" >> "$GITHUB_ENV"

      - name: Assert corpus-native Episode 1 law
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.env.BURN_EPISODE_1_PUBLICATION;
          const prefix = 'burn-protocol-episode-01';
          const arc = JSON.parse(fs.readFileSync(path.join(root, `${prefix}.arc.json`), 'utf8'));
          const source = JSON.parse(fs.readFileSync(path.join(root, `${prefix}.burn.json`), 'utf8'));
          const coverage = JSON.parse(fs.readFileSync(path.join(root, `${prefix}.coverage.json`), 'utf8'));
          const episode = source.canonicalStory.episodes[0];
          const [chapter1, chapter2, chapter3] = episode.chapters;
          const fail = (message) => { throw new Error(message); };
          if (arc.meta.id !== 'burn-protocol') fail('Stable series identity drift.');
          if (arc.challenges.length !== 0) fail('Canonical story Arc contains simulation challenges.');
          if (arc.roles.length !== 0) fail('Canonical story Arc contains simulation roles.');
          if (source.canonicalStory.authority.choicePolicy !== 'none') fail('Canonical path admits choices.');
          if (!episode.complete || episode.nextChapterId !== null) fail('Episode 1 was not closed correctly.');
          if (episode.chapters.length !== 3) fail('Three chapters were not assembled.');
          if (chapter1.panels.length !== 18 || chapter2.panels.length !== 20 || chapter3.panels.length !== 22) {
            fail('Panel extent drift.');
          }
          if (chapter1.plates.length !== 4 || chapter2.plates.length !== 4 || chapter3.plates.length !== 4) {
            fail('Plate extent drift.');
          }
          if (chapter1.nextPanelId !== chapter2.openingPanelId || chapter2.previousPanelId !== chapter1.terminalPanelId) {
            fail('P18 to P19 chapter seam drift.');
          }
          if (chapter2.nextPanelId !== chapter3.openingPanelId || chapter3.previousPanelId !== chapter2.terminalPanelId) {
            fail('P38 to P39 chapter seam drift.');
          }
          if (chapter3.terminalPanelId !== 'E01-C3-P60') fail('Episode 1 terminal drift.');
          if (chapter3.nextPanelId !== 'E02-C1-P01') fail('Episode 2 continuation drift.');
          if (coverage.panels !== 60 || coverage.plates !== 12) fail('Coverage extent drift.');
          if (coverage.unresolvedTextPanels !== 60) fail('Unavailable source text was silently promoted.');
          if (coverage.unresolvedPlateMappings !== 12) fail('Unavailable plate maps were silently inferred.');
          if (coverage.choiceNodes !== 0) fail('Coverage contains choice nodes.');
          if (coverage.incompleteEpisodeIds.length !== 0) fail('Completed Episode 1 remains classified incomplete.');
          if (JSON.stringify(coverage.continuationPanelIds) !== JSON.stringify(['E02-C1-P01'])) {
            fail('Internal chapter seams were misclassified as unpublished continuations.');
          }
          NODE

      - name: Complete Arc regression and production build
        run: |
          set -euo pipefail
          npm test | tee "$RUNNER_TEMP/full-tests.log"
          npm run build | tee "$RUNNER_TEMP/build.log"

      - name: Retain Episode 1 qualification
        if: always()
        run: |
          set -euo pipefail
          root="burn-protocol-canonical-episode-1-qualification"
          mkdir -p "$root"
          cp -R "${BURN_EPISODE_1_PUBLICATION:-$RUNNER_TEMP/publication-a}" "$root/publication" 2>/dev/null || true
          cp "$RUNNER_TEMP"/typecheck.log "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP"/focused-tests.log "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP"/publication-a.log "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP"/publication-b.log "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP"/full-tests.log "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP"/build.log "$root/" 2>/dev/null || true
          printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" > "$root/arc-candidate-sha.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" \
            > "$root/SHA256SUMS"

      - name: Upload Episode 1 qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: burn-protocol-canonical-episode-1-qualification
          path: burn-protocol-canonical-episode-1-qualification
          if-no-files-found: error
          retention-days: 30
