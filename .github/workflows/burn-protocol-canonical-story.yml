name: Burn Protocol canonical through Episode 2

on:
  pull_request:
    paths:
      - '.github/workflows/burn-protocol-canonical-story.yml'
      - 'src/canonical-story/**'
      - 'src/burn-protocol/**'
      - 'src/source-planes/registry.ts'
      - 'tests/canonical-story/**'
      - 'tests/source-planes/registry.test.ts'
      - 'tools/build-burn-protocol-chapter-1.ts'
      - 'tools/build-burn-protocol-chapter-2.ts'
      - 'tools/build-burn-protocol-episode-1.ts'
      - 'tools/build-burn-protocol-episode-2.ts'
  push:
    branches: [feature/burn-protocol-canonical-story-episode-2-v1]
    paths:
      - '.github/workflows/burn-protocol-canonical-story.yml'
      - 'src/canonical-story/**'
      - 'src/burn-protocol/**'
      - 'src/source-planes/registry.ts'
      - 'tests/canonical-story/**'
      - 'tests/source-planes/registry.test.ts'
      - 'tools/build-burn-protocol-chapter-1.ts'
      - 'tools/build-burn-protocol-chapter-2.ts'
      - 'tools/build-burn-protocol-episode-1.ts'
      - 'tools/build-burn-protocol-episode-2.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify-through-episode-2:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          show-progress: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck and focused canonical-story contracts
        run: |
          set -euo pipefail
          npm run typecheck | tee "$RUNNER_TEMP/typecheck.log"
          npm test -- \
            tests/canonical-story/burn-protocol-chapter-1.test.ts \
            tests/canonical-story/burn-protocol-chapter-2.test.ts \
            tests/canonical-story/burn-protocol-chapter-3.test.ts \
            tests/canonical-story/burn-protocol-episode-2.test.ts \
            tests/source-planes/registry.test.ts \
            | tee "$RUNNER_TEMP/focused-tests.log"

      - name: Rebuild the through-Episode-2 publication twice
        run: |
          set -euo pipefail
          publication_a="$RUNNER_TEMP/publication-a"
          publication_b="$RUNNER_TEMP/publication-b"
          npx vite-node tools/build-burn-protocol-episode-2.ts "$publication_a" \
            | tee "$RUNNER_TEMP/publication-a.log"
          npx vite-node tools/build-burn-protocol-episode-2.ts "$publication_b" \
            | tee "$RUNNER_TEMP/publication-b.log"
          diff -ru "$publication_a" "$publication_b"
          (cd "$publication_a" && sha256sum -c SHA256SUMS)
          printf 'BURN_THROUGH_EPISODE_2_PUBLICATION=%s\n' "$publication_a" >> "$GITHUB_ENV"

      - name: Assert corpus-native series law through Episode 2
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.env.BURN_THROUGH_EPISODE_2_PUBLICATION;
          const prefix = 'burn-protocol-through-episode-02';
          const arc = JSON.parse(fs.readFileSync(path.join(root, `${prefix}.arc.json`), 'utf8'));
          const source = JSON.parse(fs.readFileSync(path.join(root, `${prefix}.burn.json`), 'utf8'));
          const coverage = JSON.parse(fs.readFileSync(path.join(root, `${prefix}.coverage.json`), 'utf8'));
          const [episode1, episode2] = source.canonicalStory.episodes;
          const fail = (message) => { throw new Error(message); };
          if (arc.meta.id !== 'burn-protocol') fail('Stable series identity drift.');
          if (arc.challenges.length !== 0) fail('Canonical story Arc contains simulation challenges.');
          if (arc.roles.length !== 0) fail('Canonical story Arc contains simulation roles.');
          if (source.canonicalStory.authority.choicePolicy !== 'none') fail('Canonical path admits choices.');
          if (source.canonicalStory.episodes.length !== 2) fail('Two episodes were not assembled.');
          if (!episode1.complete || !episode2.complete) fail('Published episodes are not complete.');
          if (episode1.chapters.length !== 3 || episode2.chapters.length !== 3) fail('Chapter extent drift.');
          if (episode1.chapters.at(-1).nextPanelId !== episode2.chapters[0].openingPanelId) {
            fail('E01 to E02 forward seam drift.');
          }
          if (episode2.chapters[0].previousPanelId !== episode1.chapters.at(-1).terminalPanelId) {
            fail('E02 to E01 reverse seam drift.');
          }
          if (episode2.chapters[0].nextPanelId !== episode2.chapters[1].openingPanelId) {
            fail('E02 C1 to C2 seam drift.');
          }
          if (episode2.chapters[1].nextPanelId !== episode2.chapters[2].openingPanelId) {
            fail('E02 C2 to C3 seam drift.');
          }
          if (episode2.chapters[2].terminalPanelId !== 'E02-C3-P60') fail('Episode 2 terminal drift.');
          if (episode2.chapters[2].nextPanelId !== 'E03-C1-P01') fail('Episode 3 continuation drift.');
          if (coverage.panels !== 120 || coverage.chapters !== 6) fail('Panel or chapter coverage drift.');
          if (coverage.plates !== 23 || coverage.expectedPlateAssets !== 24) fail('Honest plate coverage drift.');
          if (!coverage.assetLedgerGap || coverage.assetLedgerGap.id !== 'A02C3-plate-04') {
            fail('The unresolved A02C3 plate receipt was hidden.');
          }
          if (coverage.unresolvedTextPanels !== 120) fail('Unavailable source text was silently promoted.');
          if (coverage.unresolvedPlateMappings !== 23) fail('Unavailable plate maps were silently inferred.');
          if (coverage.choiceNodes !== 0) fail('Coverage contains choice nodes.');
          if (coverage.incompleteEpisodeIds.length !== 0) fail('A complete episode remains classified incomplete.');
          if (JSON.stringify(coverage.continuationPanelIds) !== JSON.stringify(['E03-C1-P01'])) {
            fail('Internal episode or chapter seams were misclassified as unpublished continuations.');
          }
          if (JSON.stringify(source.estate.canonicalSourceReceiptIds) !== JSON.stringify(['episode-01-source', 'episode-02-source'])) {
            fail('Canonical episode-source custody drift.');
          }
          NODE

      - name: Complete Arc regression and production build
        run: |
          set -euo pipefail
          npm test | tee "$RUNNER_TEMP/full-tests.log"
          npm run build | tee "$RUNNER_TEMP/build.log"

      - name: Retain through-Episode-2 qualification
        if: always()
        run: |
          set -euo pipefail
          root="burn-protocol-canonical-through-episode-2-qualification"
          mkdir -p "$root"
          cp -R "${BURN_THROUGH_EPISODE_2_PUBLICATION:-$RUNNER_TEMP/publication-a}" "$root/publication" 2>/dev/null || true
          cp "$RUNNER_TEMP"/typecheck.log "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP"/focused-tests.log "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP"/publication-a.log "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP"/publication-b.log "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP"/full-tests.log "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP"/build.log "$root/" 2>/dev/null || true
          printf '%s\n' "${{ github.event.pull_request.head.sha || github.sha }}" > "$root/arc-candidate-sha.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" \
            > "$root/SHA256SUMS"

      - name: Upload through-Episode-2 qualification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: burn-protocol-canonical-through-episode-2-qualification
          path: burn-protocol-canonical-through-episode-2-qualification
          if-no-files-found: error
          retention-days: 30
