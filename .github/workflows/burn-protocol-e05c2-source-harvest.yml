name: Burn Protocol Episode 5 Chapter 2 source frontier

on:
  schedule:
    - cron: "37 */12 * * *"
  workflow_dispatch:
    inputs:
      repositories:
        description: Comma-separated explicit required repository anchors.
        required: false
        default: BigBirdReturns/axm-arc,BigBirdReturns/axm-world
        type: string
      owners:
        description: Comma-separated GitHub accounts whose public repository estates should be enumerated.
        required: false
        default: BigBirdReturns
        type: string
      optional_repositories:
        description: Comma-separated best-effort private or restricted repositories.
        required: false
        default: BigBirdReturns/axm-chat,BigBirdReturns/spectra-genesis,BigBirdReturns/axm-bloodstream,BigBirdReturns/chatgpt-web
        type: string
      approved_packet_set_sha256s:
        description: Optional comma-separated independently approved E05C2 packet-set SHA-256 identities.
        required: false
        default: ""
        type: string
      max_owner_repositories:
        description: Maximum public repositories enumerated per owner.
        required: false
        default: "100"
        type: string
      max_remote_items:
        description: Maximum recent artifacts and releases inspected per resolved repository.
        required: false
        default: "100"
        type: string
      require_source:
        description: Fail after retaining the audit receipt when E05C2 source remains absent.
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - ".github/workflows/burn-protocol-e05c2-source-harvest.yml"
      - "docs/BURN_PROTOCOL_EPISODE_5_CHAPTER_2_FRONTIER.md"
      - "tools/burn-protocol-source-frontier/contracts/e05c2-source-intake.contract.json"
      - "tools/burn-protocol-source-frontier/test_e05c2_frontier.py"
      - "tools/burn-protocol-source-frontier/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/burn-protocol-e05c2-source-harvest.yml"
      - "docs/BURN_PROTOCOL_EPISODE_5_CHAPTER_2_FRONTIER.md"
      - "tools/burn-protocol-source-frontier/contracts/e05c2-source-intake.contract.json"
      - "tools/burn-protocol-source-frontier/test_e05c2_frontier.py"
      - "tools/burn-protocol-source-frontier/**"

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: burn-protocol-e05c2-source-harvest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    name: E05C2 source-frontier qualification (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile recovery and custody tooling
        shell: bash
        run: python -m compileall -q tools/burn-protocol-source-frontier

      - name: Exercise E05C2 contract and workflow law
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tools/burn-protocol-source-frontier/test_e05c2_frontier.py \
            -v 2>&1 | tee e05c2-source-frontier-tests.log

      - name: Retain exact qualification receipt
        shell: bash
        env:
          QUALIFICATION_ROOT: burn-protocol-e05c2-source-frontier-qualification-${{ matrix.os }}
          QUALIFICATION_OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import shutil
          import subprocess
          from pathlib import Path

          root = Path(os.environ["QUALIFICATION_ROOT"])
          root.mkdir(parents=True, exist_ok=True)
          files = [
              Path(".github/workflows/burn-protocol-e05c2-source-harvest.yml"),
              Path("docs/BURN_PROTOCOL_EPISODE_5_CHAPTER_2_FRONTIER.md"),
              Path("tools/burn-protocol-source-frontier/contracts/e05c2-source-intake.contract.json"),
              Path("tools/burn-protocol-source-frontier/test_e05c2_frontier.py"),
              Path("e05c2-source-frontier-tests.log"),
          ]
          for source in files:
              target = root / source
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)

          log = Path("e05c2-source-frontier-tests.log").read_text(encoding="utf-8")
          match = re.search(r"Ran (\d+) tests? in", log)
          if match is None or "OK" not in log:
              raise SystemExit("qualification log does not contain a complete passing receipt")

          receipt = {
              "format": "burn-protocol-e05c2-source-frontier-qualification/1",
              "status": "pass",
              "candidate": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "runner": os.environ["QUALIFICATION_OS"],
              "tests": int(match.group(1)),
              "frontier": "E05-C2-P21",
              "authority": {
                  "humanWorkstationRequired": False,
                  "parentAdmission": "exact-byte-count-and-sha256-only",
                  "packetSetAdmission": "external-sha256-pin-only",
                  "canonicalInference": "none",
              },
          }
          (root / "QUALIFICATION_RECEIPT.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          lines = []
          for path in sorted(root.rglob("*")):
              if path.is_file() and path.name != "SHA256SUMS":
                  lines.append(
                      f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(root).as_posix()}"
                  )
          (root / "SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload E05C2 source-frontier qualification
        uses: actions/upload-artifact@v4
        with:
          name: burn-protocol-e05c2-source-frontier-qualification-${{ matrix.os }}
          path: burn-protocol-e05c2-source-frontier-qualification-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true

  harvest:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    name: resolve public and private custody, then recover E05C2
    runs-on: ubuntu-24.04
    env:
      HARVEST_REPOSITORIES: ${{ inputs.repositories || vars.BURN_SOURCE_REPOSITORIES || 'BigBirdReturns/axm-arc,BigBirdReturns/axm-world' }}
      HARVEST_OWNERS: ${{ inputs.owners || vars.BURN_SOURCE_OWNERS || 'BigBirdReturns' }}
      HARVEST_OPTIONAL_REPOSITORIES: ${{ inputs.optional_repositories || vars.BURN_SOURCE_OPTIONAL_REPOSITORIES || 'BigBirdReturns/axm-chat,BigBirdReturns/spectra-genesis,BigBirdReturns/axm-bloodstream,BigBirdReturns/chatgpt-web' }}
      HARVEST_APPROVED_PACKET_SET_SHA256S: ${{ inputs.approved_packet_set_sha256s || vars.BURN_APPROVED_E05C2_PACKET_SET_SHA256S || '' }}
      HARVEST_MAX_OWNER_REPOSITORIES: ${{ inputs.max_owner_repositories || '100' }}
      HARVEST_MAX_REMOTE_ITEMS: ${{ inputs.max_remote_items || '100' }}
      HARVEST_REQUIRE_SOURCE: ${{ inputs.require_source && 'true' || 'false' }}
      GITHUB_TOKEN: ${{ secrets.BURN_SOURCE_TOKEN || github.token }}
    steps:
      - name: Check out landed custody authority
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve owner scope and sweep E05C2 custody
        id: harvest
        shell: bash
        run: |
          set -uo pipefail
          scope_args=(
            --output burn-e05c2-owner-scope.json
            --max-owner-repositories "$HARVEST_MAX_OWNER_REPOSITORIES"
          )
          IFS=',' read -ra owners <<< "$HARVEST_OWNERS"
          for raw in "${owners[@]}"; do
            owner="$(printf '%s' "$raw" | xargs)"
            if [ -n "$owner" ]; then scope_args+=(--owner "$owner"); fi
          done
          IFS=',' read -ra anchors <<< "$HARVEST_REPOSITORIES"
          for raw in "${anchors[@]}"; do
            repository="$(printf '%s' "$raw" | xargs)"
            if [ -n "$repository" ]; then scope_args+=(--repository "$repository"); fi
          done

          mkdir -p burn-protocol-e05c2-source-harvest
          set +e
          python tools/burn-protocol-source-frontier/resolve_owner_scope.py "${scope_args[@]}" \
            2>&1 | tee e05c2-owner-scope.log
          scope_code=${PIPESTATUS[0]}
          set -e

          code=2
          if [ "$scope_code" -eq 0 ]; then
            python - <<'PY' > e05c2-required-repositories.txt
          import json
          from pathlib import Path
          scope = json.loads(Path("burn-e05c2-owner-scope.json").read_text(encoding="utf-8"))
          for repository in scope["repositories"]:
              print(repository)
          PY

            args=(
              --output burn-protocol-e05c2-source-harvest
              --contract tools/burn-protocol-source-frontier/contracts/e05c2-source-intake.contract.json
              --max-remote-items "$HARVEST_MAX_REMOTE_ITEMS"
            )
            while IFS= read -r repository; do
              if [ -n "$repository" ]; then args+=(--repository "$repository"); fi
            done < e05c2-required-repositories.txt
            IFS=',' read -ra optional_repositories <<< "$HARVEST_OPTIONAL_REPOSITORIES"
            for raw in "${optional_repositories[@]}"; do
              repository="$(printf '%s' "$raw" | xargs)"
              if [ -n "$repository" ]; then args+=(--optional-repository "$repository"); fi
            done
            IFS=',' read -ra packet_sets <<< "$HARVEST_APPROVED_PACKET_SET_SHA256S"
            for raw in "${packet_sets[@]}"; do
              digest="$(printf '%s' "$raw" | xargs)"
              if [ -n "$digest" ]; then args+=(--approved-packet-set-sha256 "$digest"); fi
            done
            if [ "$HARVEST_REQUIRE_SOURCE" = "true" ]; then args+=(--require-source); fi

            rmdir burn-protocol-e05c2-source-harvest
            set +e
            python tools/burn-protocol-source-frontier/harvest.py "${args[@]}" \
              2>&1 | tee e05c2-source-harvest.log
            code=${PIPESTATUS[0]}
            set -e
          fi

          if [ ! -d burn-protocol-e05c2-source-harvest ]; then
            mkdir -p burn-protocol-e05c2-source-harvest
          fi
          python - "$code" "$scope_code" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path("burn-protocol-e05c2-source-harvest")
          receipt_path = root / "HARVEST_RECEIPT.json"
          try:
              receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              receipt = {
                  "format": "burn-protocol-autonomous-source-harvest/1",
                  "status": "harvest-error",
                  "exitCode": int(sys.argv[1]),
              }
          receipt["frontier"] = "E05-C2-P21"
          receipt["scopeResolution"] = {
              "status": "pass" if int(sys.argv[2]) == 0 else "failed",
              "exitCode": int(sys.argv[2]),
          }
          receipt["authority"] = {
              "humanWorkstationRequired": False,
              "parentAdmission": "exact-byte-count-and-sha256-only",
              "packetSetAdmission": "external-sha256-pin-only",
              "canonicalInference": "none",
          }
          receipt_path.write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          cp e05c2-owner-scope.log burn-protocol-e05c2-source-harvest/
          if [ -f burn-e05c2-owner-scope.json ]; then
            cp burn-e05c2-owner-scope.json burn-protocol-e05c2-source-harvest/
          fi
          if [ -f e05c2-source-harvest.log ]; then
            cp e05c2-source-harvest.log burn-protocol-e05c2-source-harvest/
          fi
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path("burn-protocol-e05c2-source-harvest")
          lines = []
          for path in sorted(root.rglob("*")):
              if path.is_file() and path.name != "SHA256SUMS":
                  lines.append(
                      f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(root).as_posix()}"
                  )
          (root / "SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Upload authoritative E05C2 custody audit
        id: upload-harvest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: burn-protocol-e05c2-source-harvest
          path: burn-protocol-e05c2-source-harvest
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true

      - name: Publish E05C2 audit ledger
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HARVEST_ARTIFACT_ID: ${{ steps.upload-harvest.outputs.artifact-id }}
          HARVEST_ARTIFACT_URL: ${{ steps.upload-harvest.outputs.artifact-url }}
          HARVEST_ARTIFACT_DIGEST: ${{ steps.upload-harvest.outputs.artifact-digest }}
          HARVEST_EXIT_CODE: ${{ steps.harvest.outputs.exit_code }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          receipt = json.loads(
              Path("burn-protocol-e05c2-source-harvest/HARVEST_RECEIPT.json")
              .read_text(encoding="utf-8")
          )
          summary = receipt.get("summary") if isinstance(receipt.get("summary"), dict) else {}
          status = str(receipt.get("status") or "harvest-error")
          body = "\n".join([
              f"## Episode 5 Chapter 2 Burn source sweep · `{status}`",
              "",
              "```text",
              f"run ID                     {os.environ['GITHUB_RUN_ID']}",
              f"run attempt                {os.environ.get('GITHUB_RUN_ATTEMPT', '1')}",
              f"event                      {os.environ['GITHUB_EVENT_NAME']}",
              f"exact candidate            {os.environ['GITHUB_SHA']}",
              f"exit code                  {os.environ.get('HARVEST_EXIT_CODE') or 'unavailable'}",
              f"checked candidates         {summary.get('candidates', 0)}",
              f"downloaded bytes           {summary.get('downloadedBytes', 0)}",
              f"required discovery errors  {summary.get('discoveryErrors', 0)}",
              f"optional discovery errors  {summary.get('optionalDiscoveryErrors', 0)}",
              f"transport failures         {summary.get('transportFailures', 0)}",
              f"packet-set candidates      {summary.get('packetSetCandidates', 0)}",
              f"approved packet sets       {summary.get('approvedPacketSets', 0)}",
              f"found identity             {receipt.get('foundIdentity') or 'none'}",
              f"found packet set           {receipt.get('foundPacketSetSha256') or 'none'}",
              f"artifact ID                {os.environ.get('HARVEST_ARTIFACT_ID') or 'unavailable'}",
              f"artifact digest            {os.environ.get('HARVEST_ARTIFACT_DIGEST') or 'unavailable'}",
              "frontier                   E05-C2-P21",
              "workstation action         none",
              "```",
              "",
              f"Run: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "",
              f"Artifact: {os.environ.get('HARVEST_ARTIFACT_URL') or 'unavailable'}",
              "",
          ])
          request = urllib.request.Request(
              f"{os.environ['GITHUB_API_URL'].rstrip('/')}/repos/{os.environ['GITHUB_REPOSITORY']}/issues/212/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Content-Type": "application/json",
                  "User-Agent": "burn-protocol-e05c2-source-harvester/1",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status not in {200, 201}:
                  raise RuntimeError(f"Unexpected issue-comment status: {response.status}")
          PY

      - name: Preserve custody failure semantics
        if: always()
        shell: bash
        env:
          HARVEST_EXIT_CODE: ${{ steps.harvest.outputs.exit_code }}
        run: |
          case "${HARVEST_EXIT_CODE:-2}" in
            0|3) exit 0 ;;
            4)
              if [ "$HARVEST_REQUIRE_SOURCE" = "true" ]; then exit 4; fi
              exit 0
              ;;
            *) exit "${HARVEST_EXIT_CODE:-2}" ;;
          esac
