name: Burn Protocol source frontier recovery

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/burn-protocol-source-frontier.yml"
      - "docs/BURN_PROTOCOL_SOURCE_FRONTIER_RECOVERY.md"
      - "tools/burn-protocol-source-frontier/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/burn-protocol-source-frontier.yml"
      - "docs/BURN_PROTOCOL_SOURCE_FRONTIER_RECOVERY.md"
      - "tools/burn-protocol-source-frontier/**"

permissions:
  contents: read

jobs:
  self-test:
    name: fail-closed recovery self-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
    env:
      QUALIFICATION_ROOT: burn-protocol-source-frontier-qualification-${{ matrix.os }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile recovery tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$QUALIFICATION_ROOT"
          python -m py_compile \
            tools/burn-protocol-source-frontier/recover.py \
            tools/burn-protocol-source-frontier/test_recover.py \
            2>&1 | tee "$QUALIFICATION_ROOT/compile.log"

      - name: Exercise exact-parent, handoff, determinism, and refusal law
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover \
            -s tools/burn-protocol-source-frontier \
            -p "test_*.py" \
            -v \
            2>&1 | tee "$QUALIFICATION_ROOT/self-test.log"

      - name: Retain exact qualification receipt
        shell: bash
        env:
          QUALIFICATION_OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import platform
          import re
          import shutil
          from pathlib import Path

          root = Path(os.environ["QUALIFICATION_ROOT"])
          authority_root = root / "authority"
          paths = [
              Path(".github/workflows/burn-protocol-source-frontier.yml"),
              Path("docs/BURN_PROTOCOL_SOURCE_FRONTIER_RECOVERY.md"),
              Path("tools/burn-protocol-source-frontier/contracts/e04c2-source-intake.contract.json"),
              Path("tools/burn-protocol-source-frontier/recover.py"),
              Path("tools/burn-protocol-source-frontier/test_recover.py"),
          ]
          for source in paths:
              destination = authority_root / source
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, destination)

          contract = json.loads(paths[2].read_text(encoding="utf-8"))
          self_test = (root / "self-test.log").read_text(encoding="utf-8")
          match = re.search(r"Ran (\d+) tests? in", self_test)
          if match is None or "OK" not in self_test:
              raise SystemExit("self-test log does not contain a complete passing receipt")

          receipt = {
              "format": "burn-protocol-source-frontier-qualification/1",
              "status": "pass",
              "candidate": os.environ["GITHUB_SHA"],
              "runner": os.environ["QUALIFICATION_OS"],
              "python": platform.python_version(),
              "tests": int(match.group(1)),
              "frontier": contract["evidenceBoundary"]["continuationPanelId"],
              "parent": contract["parent"],
              "requiredClassifications": contract["selection"]["requiredClassifications"],
              "authority": {
                  "sourceBytesInRepository": False,
                  "canonicalTextInference": "forbidden",
                  "assetCustody": "exact-parent-manifest-and-byte-verification-only",
              },
          }
          (root / "QUALIFICATION_RECEIPT.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
              newline="\n",
          )

          ledger = []
          for path in sorted(root.rglob("*")):
              if path.is_file() and path.name != "SHA256SUMS":
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  ledger.append(f"{digest}  {path.relative_to(root).as_posix()}")
          (root / "SHA256SUMS").write_text(
              "\n".join(ledger) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY

      - name: Upload source-frontier qualification
        uses: actions/upload-artifact@v4
        with:
          name: burn-protocol-source-frontier-qualification-${{ matrix.os }}
          path: ${{ env.QUALIFICATION_ROOT }}
          if-no-files-found: error
          retention-days: 30
