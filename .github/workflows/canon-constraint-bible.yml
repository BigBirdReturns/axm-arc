name: Canon constraint bible

on:
  pull_request:
    paths:
      - "src/narrative/canon/**"
      - "src/narrative/index.ts"
      - "tests/narrative/canon/**"
      - "docs/RFC_CANON_CONSTRAINT_BIBLE.md"
      - "docs/ASOIAF_CANON_PILOT.md"
      - ".github/workflows/canon-constraint-bible.yml"
  push:
    branches:
      - "feature/canon-constraint-bible-v1"
    paths:
      - "src/narrative/canon/**"
      - "src/narrative/index.ts"
      - "tests/narrative/canon/**"
      - "docs/RFC_CANON_CONSTRAINT_BIBLE.md"
      - "docs/ASOIAF_CANON_PILOT.md"
      - ".github/workflows/canon-constraint-bible.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Focused canon qualification
        run: npm test -- tests/narrative/canon/canon-bible.test.ts

      - name: Complete Arc regression
        run: npm test

      - name: Production build
        run: npm run build
