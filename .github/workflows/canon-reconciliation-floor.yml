name: Canon reconciliation floor

on:
  pull_request:
    branches:
      - feature/asoiaf-model-recall-estate-v1
    paths:
      - "src/narrative/canon/reconcile/**"
      - "src/narrative/canon/asoiaf/reconcile/**"
      - "src/narrative/canon/index.ts"
      - "tests/narrative/canon/reconciliation-floor.test.ts"
      - "docs/RFC_CANON_RECONCILIATION_FLOOR.md"
      - ".github/workflows/canon-reconciliation-floor.yml"
  push:
    branches:
      - feature/asoiaf-reconciliation-floor-v1
    paths:
      - "src/narrative/canon/reconcile/**"
      - "src/narrative/canon/asoiaf/reconcile/**"
      - "src/narrative/canon/index.ts"
      - "tests/narrative/canon/reconciliation-floor.test.ts"
      - "docs/RFC_CANON_RECONCILIATION_FLOOR.md"
      - ".github/workflows/canon-reconciliation-floor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          show-progress: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Strict TypeScript
        run: npm run typecheck | tee "$RUNNER_TEMP/typecheck.log"

      - name: Focused reconciliation qualification
        shell: bash
        run: |
          set -euo pipefail
          npm test -- tests/narrative/canon/reconciliation-floor.test.ts \
            | tee "$RUNNER_TEMP/focused-tests.log"

      - name: Complete Arc regression
        run: npm test | tee "$RUNNER_TEMP/full-tests.log"

      - name: Production build
        run: npm run build | tee "$RUNNER_TEMP/build.log"

      - name: Retain exact qualification receipt
        shell: bash
        run: |
          set -euo pipefail
          root='canon-reconciliation-floor-qualification'
          mkdir -p "$root"
          cp "$RUNNER_TEMP"/*.log "$root/" 2>/dev/null || true
          git rev-parse HEAD > "$root/candidate-sha.txt"
          printf '%s\n' \
            'recallAuthority=none' \
            'promotionRequiresExactSource=true' \
            'promotionRequiresBoundedLocator=true' \
            'promotionRequiresHumanReview=true' \
            'transactionRollback=whole-transaction' \
            > "$root/authority-boundary.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" \
            > "$root/SHA256SUMS"

      - name: Upload qualification
        uses: actions/upload-artifact@v4
        with:
          name: canon-reconciliation-floor-qualification
          path: canon-reconciliation-floor-qualification
          if-no-files-found: error
          retention-days: 30
