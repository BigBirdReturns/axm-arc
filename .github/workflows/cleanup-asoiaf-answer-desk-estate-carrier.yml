name: Remove persistent answer desk repair carrier

on:
  push:
    branches:
      - feature/asoiaf-answer-desk-estate-v1
    paths:
      - '.github/workflows/cleanup-asoiaf-answer-desk-estate-carrier.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: cleanup-asoiaf-answer-desk-estate-carrier
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'BigBirdReturns/axm-arc' && github.ref_name == 'feature/asoiaf-answer-desk-estate-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: feature/asoiaf-answer-desk-estate-v1
          fetch-depth: 0
          show-progress: false

      - name: Remove only disposable workflow carriers
        id: cleanup
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch \
            .github/workflows/repair-and-qualify-asoiaf-answer-desk-estate-v1.yml \
            .github/workflows/cleanup-asoiaf-answer-desk-estate-carrier.yml
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          test "$(git diff --cached --name-only | grep -Ev '^\.github/workflows/(repair-and-qualify-asoiaf-answer-desk-estate-v1|cleanup-asoiaf-answer-desk-estate-carrier)\.yml$' | wc -l)" = '0'
          git commit -m 'Remove persistent answer desk workflow carriers'
          git push origin HEAD:feature/asoiaf-answer-desk-estate-v1

      - name: Post explicit cleanup failure
        if: steps.cleanup.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment 251 --repo "$GITHUB_REPOSITORY" --body \
            "The bounded workflow-carrier cleanup failed on exact head \`${GITHUB_SHA}\`. No implementation file was changed or pushed. Connector cleanup remains required for \`.github/workflows/repair-and-qualify-asoiaf-answer-desk-estate-v1.yml\` and this cleanup workflow." 
          exit 1