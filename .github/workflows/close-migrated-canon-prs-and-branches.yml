name: Close migrated canon PRs and collapse branches

on:
  pull_request:
    branches:
      - cleanup/axm-canon-published-collapse-v1
    paths:
      - '.axm-canon-published-collapse-trigger'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: close-migrated-canon-prs-and-branches
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_REPO: BigBirdReturns/axm-arc
      DEST_REPO: BigBirdReturns/axm-canon
      DEST_COMMIT: fec0ddc9a5697d465ac46e55b7e3cb7647221952
      DEST_TREE: 7a4ecfa77dc3816a0b57328c762f632c1a42eae1
      DEST_TAG: migration-v1
      MANIFEST_SHA256: a3a3e62c66f14243126c9ff4ca49a9d96a13aad2b4409ebeac54d9569121a521
      TERMINAL_RECEIPT_SHA256: c53b958254c17a3f1b83198260e62cf8d816a3a1f8a1205dcb85beb075cf4182
      ROLLBACK_BUNDLE_SHA256: 3f458e8b3686bdae4a0d7557e124f000b710a3a8edd30058edfddf297e756ffa
      CANON_RUN: '31525320455'
      ASOIAF_RUN: '31525320485'
      RECEIPT_COMMENT_ID: '5257576194'
      BASE_BRANCH: cleanup/axm-canon-published-collapse-v1
      TRIGGER_BRANCH: cleanup/axm-canon-published-collapse-v1-trigger
    steps:
      - name: Check out inert cleanup carrier
        uses: actions/checkout@v4
        with:
          ref: cleanup/axm-canon-published-collapse-v1
          fetch-depth: 1
          show-progress: false

      - name: Verify trigger geometry
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test '${{ github.event.pull_request.base.ref }}' = "$BASE_BRANCH"
          test '${{ github.event.pull_request.head.ref }}' = "$TRIGGER_BRANCH"
          test -z "$(git status --porcelain)"

      - name: Close migrated PRs and remove admitted duplicate refs
        id: cleanup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          API = 'https://api.github.com'
          TOKEN = os.environ['GH_TOKEN']
          SOURCE_REPO = os.environ['SOURCE_REPO']
          DEST_REPO = os.environ['DEST_REPO']
          DEST_COMMIT = os.environ['DEST_COMMIT']
          DEST_TREE = os.environ['DEST_TREE']
          DEST_TAG = os.environ['DEST_TAG']
          MANIFEST_SHA256 = os.environ['MANIFEST_SHA256']
          RECEIPT_SHA = os.environ['TERMINAL_RECEIPT_SHA256']
          ROLLBACK_SHA = os.environ['ROLLBACK_BUNDLE_SHA256']
          CANON_RUN = int(os.environ['CANON_RUN'])
          ASOIAF_RUN = int(os.environ['ASOIAF_RUN'])
          RECEIPT_COMMENT_ID = int(os.environ['RECEIPT_COMMENT_ID'])
          BASE_BRANCH = os.environ['BASE_BRANCH']
          TRIGGER_BRANCH = os.environ['TRIGGER_BRANCH']
          RUN_ID = int(os.environ['GITHUB_RUN_ID'])
          RUN_ATTEMPT = int(os.environ['GITHUB_RUN_ATTEMPT'])
          SERVER = os.environ['GITHUB_SERVER_URL']
          ACTION_REPO = os.environ['GITHUB_REPOSITORY']

          CLOSE_PRS = [221, 224, 225, 226, 229, 231, 232, 233, 234, 236, 238, 239, 242, 243, 248]
          PROTECTED_PRS = [245, 247, 249, 282, 294, 298, 300]
          EXPECTED_LINEAGE = {
              221: '89b412f1b635267478661500e2d0cfdb31f13429',
              224: '2f9f94473272f4a4b26473ff78cb10a31a09ba3b',
              225: '8098cea50fe79ec0bd8ae4d8b277813263ad500e',
              226: '46d0ddf43b2bc4e498b8ea1bdde86a69bfeb7e4e',
              229: 'e8b317b8a9c843a25d53511bd3e7aeed8fbc6761',
              231: 'fc1547347c36bb5f3cbba879b3560dd53aa12e5f',
              232: 'b0f85019ab35d542697918bf5c2298275029cdeb',
              233: 'cc5447aec51717497fe48eb0083c4d68a49c6ee6',
              234: 'ddc0f5cbc0232273764f6489f1389a14a6afa925',
              236: 'e2eeb50210fc45c1b6561e68e47dfa84b30018f0',
              238: '777b7230f6cbc0555a5e286ac07c8d0f94671543',
              239: 'd1e15c97dd5b51d521ab277378cefe29b29d3daf',
              242: '0b502bbeaf4e0e91c5075243f019e5975d860e9e',
              243: '747bb7400675dd4f0855c3fe29a19b4008ef5552',
              247: '9675ed92f9c244cf4661bc13128629efbacf1307',
              248: 'a424521e3a7a1c9f7c7f707298f179758daf3d27',
          }

          def request(method: str, path: str, payload=None, *, allow_404=False):
              url = path if path.startswith('http') else API + '/' + path.lstrip('/')
              data = None
              headers = {
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {TOKEN}',
                  'User-Agent': 'axm-canon-source-cleanup-v1',
                  'X-GitHub-Api-Version': '2022-11-28',
              }
              if payload is not None:
                  data = json.dumps(payload, separators=(',', ':')).encode('utf-8')
                  headers['Content-Type'] = 'application/json'
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      body = response.read()
                      if not body:
                          return None
                      return json.loads(body.decode('utf-8'))
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', errors='replace')
                  if allow_404 and exc.code == 404:
                      return None
                  raise RuntimeError(f'{method} {url} failed: {exc.code} {body}') from exc

          def paginate(path: str):
              rows = []
              page = 1
              separator = '&' if '?' in path else '?'
              while True:
                  batch = request('GET', f'{path}{separator}per_page=100&page={page}')
                  if not isinstance(batch, list):
                      raise RuntimeError(f'pagination endpoint did not return a list: {path}')
                  rows.extend(batch)
                  if len(batch) < 100:
                      return rows
                  page += 1
                  if page > 100:
                      raise RuntimeError(f'pagination ceiling exceeded: {path}')

          def content_bytes(repo: str, path: str, ref: str) -> bytes:
              encoded = urllib.parse.quote(path, safe='/')
              query = urllib.parse.urlencode({'ref': ref})
              row = request('GET', f'repos/{repo}/contents/{encoded}?{query}')
              if row.get('encoding') != 'base64':
                  raise RuntimeError(f'content response is not base64: {repo}/{path}')
              return base64.b64decode(row['content'])

          def canonical_bytes(value) -> bytes:
              return json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode('utf-8')

          def sha256(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def snapshot_pr(number: int):
              row = request('GET', f'repos/{SOURCE_REPO}/pulls/{number}')
              return {
                  'number': number,
                  'state': row['state'],
                  'merged': bool(row.get('merged_at')),
                  'head_sha': row['head']['sha'],
                  'head_ref': row['head']['ref'],
                  'base_ref': row['base']['ref'],
              }

          # Destination admission. Read every identity from the live API.
          main_ref = request('GET', f'repos/{DEST_REPO}/git/ref/heads/main')
          if main_ref['object']['sha'] != DEST_COMMIT:
              raise RuntimeError('destination main differs')
          commit = request('GET', f'repos/{DEST_REPO}/git/commits/{DEST_COMMIT}')
          if commit['tree']['sha'] != DEST_TREE:
              raise RuntimeError('destination tree differs')
          tag_ref = request('GET', f'repos/{DEST_REPO}/git/ref/tags/{DEST_TAG}')
          if tag_ref['object']['type'] != 'tag':
              raise RuntimeError('migration-v1 is not annotated')
          tag = request('GET', f"repos/{DEST_REPO}/git/tags/{tag_ref['object']['sha']}")
          if tag['object']['type'] != 'commit' or tag['object']['sha'] != DEST_COMMIT:
              raise RuntimeError('migration-v1 target differs')
          manifest = content_bytes(DEST_REPO, 'migration/MIGRATION_MANIFEST.json', DEST_COMMIT)
          if sha256(manifest) != MANIFEST_SHA256:
              raise RuntimeError('migration manifest digest differs')
          destination_branches = paginate(f'repos/{DEST_REPO}/branches?')
          if [(row['name'], row['commit']['sha']) for row in destination_branches] != [('main', DEST_COMMIT)]:
              raise RuntimeError(f'destination has unexpected branches: {destination_branches}')

          for run_id, expected_name in (
              (CANON_RUN, 'AXM Canon qualification'),
              (ASOIAF_RUN, 'ASOIAF canon estate qualification'),
          ):
              run = request('GET', f'repos/{DEST_REPO}/actions/runs/{run_id}')
              if run['head_sha'] != DEST_COMMIT or run['conclusion'] != 'success':
                  raise RuntimeError(f'destination workflow {run_id} is not exact success')
              if run['name'] != expected_name:
                  raise RuntimeError(f'destination workflow {run_id} name differs: {run["name"]}')

          receipt_comment = request('GET', f'repos/BigBirdReturns/estate/issues/comments/{RECEIPT_COMMENT_ID}')
          if RECEIPT_SHA not in receipt_comment.get('body', ''):
              raise RuntimeError('terminal receipt comment does not bind expected receipt')

          source_heads = json.loads(content_bytes(DEST_REPO, 'migration/SOURCE_HEADS.json', DEST_COMMIT))
          observed_lineage = {int(key): value for key, value in source_heads['qualifiedLineage'].items()}
          if observed_lineage != EXPECTED_LINEAGE:
              raise RuntimeError('published qualifiedLineage differs from cleanup contract')

          protected_before = {number: snapshot_pr(number) for number in PROTECTED_PRS}

          comment_body = f'''## Migrated to `BigBirdReturns/axm-canon`

This work is published. Closing as migrated, not abandoned.

```text
destination repository   BigBirdReturns/axm-canon
destination commit       {DEST_COMMIT}
destination tree         {DEST_TREE}
annotated tag            {DEST_TAG}
migration manifest       sha256:{MANIFEST_SHA256}
terminal receipt         sha256:{RECEIPT_SHA}
```

The live GitHub commit, tree, tag, and manifest digest were read back and matched exactly. Canon qualification and ASOIAF canon estate qualification both passed on that head. This pull request's head SHA is recorded in `migration/SOURCE_HEADS.json` in the destination repository, so its content is recoverable from published history.

Rollback custody is retained as the migration kit bundle `sha256:{ROLLBACK_SHA}`.
'''

          closures = []
          for number in CLOSE_PRS:
              pr = request('GET', f'repos/{SOURCE_REPO}/pulls/{number}')
              expected = EXPECTED_LINEAGE[number]
              if pr['head']['sha'] != expected:
                  raise RuntimeError(f'PR #{number} head drift: {pr["head"]["sha"]} != {expected}')
              if pr.get('merged_at') is not None:
                  raise RuntimeError(f'PR #{number} unexpectedly merged')
              comments = paginate(f'repos/{SOURCE_REPO}/issues/{number}/comments?')
              existing = next((row for row in comments if RECEIPT_SHA in row.get('body', '')), None)
              posted = existing
              if posted is None:
                  posted = request('POST', f'repos/{SOURCE_REPO}/issues/{number}/comments', {'body': comment_body})
              prior_state = pr['state']
              if prior_state == 'open':
                  request('PATCH', f'repos/{SOURCE_REPO}/pulls/{number}', {'state': 'closed'})
              final = request('GET', f'repos/{SOURCE_REPO}/pulls/{number}')
              if final['state'] != 'closed' or final.get('merged_at') is not None:
                  raise RuntimeError(f'PR #{number} did not close unmerged')
              if final['head']['sha'] != expected:
                  raise RuntimeError(f'PR #{number} head moved during closure')
              closures.append({
                  'number': number,
                  'head_sha': expected,
                  'head_ref': final['head']['ref'],
                  'prior_state': prior_state,
                  'final_state': final['state'],
                  'merged': False,
                  'comment_id': posted['id'],
                  'comment_reused': existing is not None,
              })

          allowed_shas = set(EXPECTED_LINEAGE.values())

          def is_migrated_name(name: str) -> bool:
              lowered = name.casefold()
              return (
                  'asoiaf' in lowered
                  or name == 'feature/canon-constraint-bible-v1'
                  or name.startswith('migration/axm-canon')
              )

          protected_names = {'main', 'cleanup/axm-canon-extraction-v1', BASE_BRANCH, TRIGGER_BRANCH}
          branches_before = paginate(f'repos/{SOURCE_REPO}/branches?')
          candidates = [
              row for row in branches_before
              if row['commit']['sha'] in allowed_shas
              and is_migrated_name(row['name'])
              and row['name'] not in protected_names
          ]

          deleted = []
          held = []
          for row in sorted(candidates, key=lambda item: item['name']):
              name = row['name']
              if row.get('protected'):
                  held.append({'branch': name, 'head_sha': row['commit']['sha'], 'reason': 'protected'})
                  continue
              query = urllib.parse.urlencode({'state': 'open', 'head': f'BigBirdReturns:{name}'})
              open_pulls = request('GET', f'repos/{SOURCE_REPO}/pulls?{query}&per_page=100')
              if open_pulls:
                  held.append({
                      'branch': name,
                      'head_sha': row['commit']['sha'],
                      'reason': 'open-pull-request',
                      'pull_requests': [item['number'] for item in open_pulls],
                  })
                  continue
              encoded_ref = urllib.parse.quote(name, safe='')
              request('DELETE', f'repos/{SOURCE_REPO}/git/refs/heads/{encoded_ref}')
              if request('GET', f'repos/{SOURCE_REPO}/git/ref/heads/{encoded_ref}', allow_404=True) is not None:
                  raise RuntimeError(f'branch survived deletion: {name}')
              deleted.append({'branch': name, 'head_sha': row['commit']['sha']})

          branches_after = paginate(f'repos/{SOURCE_REPO}/branches?')
          remaining = [
              {'branch': row['name'], 'head_sha': row['commit']['sha']}
              for row in branches_after
              if row['commit']['sha'] in allowed_shas
              and is_migrated_name(row['name'])
              and row['name'] not in protected_names
          ]
          held_names = {row['branch'] for row in held}
          unexplained_remaining = [row for row in remaining if row['branch'] not in held_names]
          if unexplained_remaining:
              raise RuntimeError(f'unexplained migrated branches remain: {unexplained_remaining}')

          protected_after = {number: snapshot_pr(number) for number in PROTECTED_PRS}
          if protected_before != protected_after:
              raise RuntimeError(f'protected PR state changed: before={protected_before} after={protected_after}')
          if not protected_after[247]['merged']:
              raise RuntimeError('PR #247 lost merged standing')

          status = 'PASS_SOURCE_PR_AND_BRANCH_CLEANUP'
          if held:
              status = 'PASS_SOURCE_PR_CLEANUP_HOLD_BRANCHES'

          root = Path('axm-canon-source-cleanup-receipt')
          root.mkdir(parents=True, exist_ok=True)
          (root / 'PR_CLOSURES.json').write_text(
              json.dumps(closures, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n'
          )
          (root / 'DELETED_BRANCHES.json').write_text(
              json.dumps(deleted, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n'
          )
          (root / 'HELD_BRANCHES.json').write_text(
              json.dumps(held, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n'
          )
          (root / 'PROTECTED_PRS.json').write_text(
              json.dumps(protected_after, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n'
          )

          receipt = {
              'format': 'axm-canon-source-cleanup/1',
              'status': status,
              'source_repository': SOURCE_REPO,
              'destination_repository': DEST_REPO,
              'destination_commit': DEST_COMMIT,
              'destination_tree': DEST_TREE,
              'destination_tag': DEST_TAG,
              'migration_manifest_sha256': MANIFEST_SHA256,
              'terminal_migration_receipt_sha256': RECEIPT_SHA,
              'rollback_bundle_sha256': ROLLBACK_SHA,
              'destination_workflow_runs': [CANON_RUN, ASOIAF_RUN],
              'source_heads_sha256': sha256(content_bytes(DEST_REPO, 'migration/SOURCE_HEADS.json', DEST_COMMIT)),
              'closed_pull_requests': closures,
              'deleted_branches': deleted,
              'held_branches': held,
              'remaining_migrated_branches': remaining,
              'protected_pull_requests': protected_after,
              'action_run': {
                  'repository': ACTION_REPO,
                  'run_id': RUN_ID,
                  'run_attempt': RUN_ATTEMPT,
                  'url': f'{SERVER}/{ACTION_REPO}/actions/runs/{RUN_ID}',
              },
              'authority': {
                  'merge_authorized': False,
                  'source_history_rewrite_authorized': False,
                  'tier_bench_cleanup_authorized': False,
                  'canon_source_pr_closure_authorized': True,
                  'exact_lineage_branch_deletion_authorized': True,
              },
              'generated_unix_seconds': int(time.time()),
          }
          receipt['receipt_sha256'] = sha256(canonical_bytes(receipt))
          (root / 'CLEANUP_RECEIPT.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n'
          )
          summary = f'''# axm-canon source cleanup receipt

```text
status                 {status}
closed pull requests   {len(closures)}
deleted branches       {len(deleted)}
held branches          {len(held)}
destination commit     {DEST_COMMIT}
terminal receipt       sha256:{RECEIPT_SHA}
cleanup receipt        sha256:{receipt['receipt_sha256']}
```

Only exact migrated lore heads from the published `qualifiedLineage` were eligible. PRs #245, #247, #249, #282, #294, #298, and #300 were read before and after and remained unchanged.
'''
          (root / 'README.md').write_text(summary, encoding='utf-8', newline='\n')
          checksum_lines = []
          for path in sorted(root.iterdir()):
              if path.is_file() and path.name != 'SHA256SUMS':
                  checksum_lines.append(f'{sha256(path.read_bytes())}  {path.name}')
          (root / 'SHA256SUMS').write_text('\n'.join(checksum_lines) + '\n', encoding='utf-8', newline='\n')

          marker = f'AXM_CANON_SOURCE_CLEANUP_RECEIPT sha256:{receipt["receipt_sha256"]}'
          existing_300 = paginate(f'repos/{SOURCE_REPO}/issues/300/comments?')
          if not any(marker in row.get('body', '') for row in existing_300):
              request('POST', f'repos/{SOURCE_REPO}/issues/300/comments', {
                  'body': f'''## Published canon source cleanup

```text
closed migrated PRs   {len(closures)}
deleted lineage refs  {len(deleted)}
held refs             {len(held)}
action run            {RUN_ID}
cleanup receipt       sha256:{receipt['receipt_sha256']}
```

{marker}

The cleanup was bounded to exact heads admitted by `BigBirdReturns/axm-canon@{DEST_COMMIT}`. PRs #245 and #247 and the Tier Bench line beginning with #249 were not modified. PR #300 remains the unmerged source tombstone.
'''
              })

          output_path = Path(os.environ['GITHUB_OUTPUT'])
          with output_path.open('a', encoding='utf-8', newline='\n') as handle:
              handle.write(f'status={status}\n')
              handle.write(f'receipt_sha256={receipt["receipt_sha256"]}\n')
              handle.write(f'closed_count={len(closures)}\n')
              handle.write(f'deleted_count={len(deleted)}\n')
              handle.write(f'held_count={len(held)}\n')
          print(json.dumps({
              'status': status,
              'receipt_sha256': receipt['receipt_sha256'],
              'closed_count': len(closures),
              'deleted_count': len(deleted),
              'held_count': len(held),
          }, indent=2, sort_keys=True))
          PY

      - name: Upload cleanup receipt
        uses: actions/upload-artifact@v4
        with:
          name: axm-canon-source-cleanup-receipt
          path: axm-canon-source-cleanup-receipt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Close and remove the disposable carrier
        if: success() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT_SHA: ${{ steps.cleanup.outputs.receipt_sha256 }}
          CLOSED_COUNT: ${{ steps.cleanup.outputs.closed_count }}
          DELETED_COUNT: ${{ steps.cleanup.outputs.deleted_count }}
          HELD_COUNT: ${{ steps.cleanup.outputs.held_count }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ['GH_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          pr = int(os.environ['GITHUB_EVENT_PATH'] and json.load(open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8'))['pull_request']['number'])
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json',
              'User-Agent': 'axm-canon-source-cleanup-carrier-v1',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def call(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request('https://api.github.com/' + path, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=45) as response:
                  return response.read()

          body = f'''The exact post-publication cleanup completed.

```text
closed migrated PRs   {os.environ['CLOSED_COUNT']}
deleted lineage refs  {os.environ['DELETED_COUNT']}
held refs             {os.environ['HELD_COUNT']}
cleanup receipt       sha256:{os.environ['RECEIPT_SHA']}
run                    {os.environ['GITHUB_RUN_ID']}
```

This disposable carrier is closed unmerged and both carrier refs are deleted. The retained Actions artifact preserves the cleanup receipt.'''
          call('POST', f'repos/{repo}/issues/{pr}/comments', {'body': body})
          call('PATCH', f'repos/{repo}/pulls/{pr}', {'state': 'closed'})
          for branch in (os.environ['TRIGGER_BRANCH'], os.environ['BASE_BRANCH']):
              encoded = urllib.parse.quote(branch, safe='')
              call('DELETE', f'repos/{repo}/git/refs/heads/{encoded}')
          PY
