name: Creator recovery kit

# Cleanly based on the accepted bounded-JSON and cart1 baseline.
on:
  pull_request:
    paths:
      - 'creator-kit/**'
      - 'tools/creator-kit-cli.ts'
      - 'tools/build-creator-recovery-kit.ts'
      - 'vite.creator-kit.config.ts'
      - 'tests/clean-room/creator-recovery-kit.test.ts'
      - 'docs/CART1_CANONICALIZATION.md'
      - 'docs/IMPORT_RESOURCE_LIMITS.md'
      - 'docs/conformance/cart1-v1-vectors.json'
      - 'docs/GODSCAR_POCKET_FORMAT.md'
      - 'docs/DARK_TOMB_POCKET_FORMAT.md'
      - 'docs/COMMON_SHIP_POCKET_FORMAT.md'
      - 'src/engine/**'
      - 'src/source-planes/**'
      - 'src/sim/cartridge-conformance.ts'
      - 'cartridges/clean-room/**'
      - 'package.json'
      - '.github/workflows/creator-recovery-kit.yml'
  push:
    branches: [main]
    paths:
      - 'creator-kit/**'
      - 'tools/creator-kit-cli.ts'
      - 'tools/build-creator-recovery-kit.ts'
      - 'vite.creator-kit.config.ts'
      - 'tests/clean-room/creator-recovery-kit.test.ts'
      - 'docs/CART1_CANONICALIZATION.md'
      - 'docs/IMPORT_RESOURCE_LIMITS.md'
      - 'docs/conformance/cart1-v1-vectors.json'
      - 'docs/GODSCAR_POCKET_FORMAT.md'
      - 'docs/DARK_TOMB_POCKET_FORMAT.md'
      - 'docs/COMMON_SHIP_POCKET_FORMAT.md'
      - 'src/engine/**'
      - 'src/source-planes/**'
      - 'src/sim/cartridge-conformance.ts'
      - 'cartridges/clean-room/**'
      - 'package.json'
      - '.github/workflows/creator-recovery-kit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  creator-kit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Exact candidate identity
        run: |
          set -euo pipefail
          mkdir -p creator-kit-diagnostics
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          git rev-parse HEAD | tee creator-kit-diagnostics/candidate-sha.txt
      - name: TypeScript
        run: npm run typecheck 2>&1 | tee creator-kit-diagnostics/typecheck.log
      - name: Focused creator contracts
        run: npm test -- tests/clean-room/creator-recovery-kit.test.ts tests/clean-room/orchard-at-low-tide.test.ts tests/engine/bounded-json.test.ts tests/engine/cart1-conformance-vectors.test.ts 2>&1 | tee creator-kit-diagnostics/focused-tests.log
      - name: Build twice and require byte-identical public kits
        run: |
          set -euo pipefail
          rm -rf creator-kit/first creator-kit/second creator-kit/RODOH_Creator_Recovery_Kit.zip
          npm run build:creator-recovery-kit 2>&1 | tee creator-kit-build-first.log
          cp -a creator-kit/release creator-kit/first
          rm -rf creator-kit/dist creator-kit/release
          npm run build:creator-recovery-kit 2>&1 | tee creator-kit-build-second.log
          cp -a creator-kit/release creator-kit/second
          first="$(cd creator-kit/first && find . -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          second="$(cd creator-kit/second && find . -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          printf '%s\n' "$first" > creator-kit/first-tree.sha256
          printf '%s\n' "$second" > creator-kit/second-tree.sha256
          test "$first" = "$second"
      - name: Execute the standalone dependency-free CLI
        run: |
          set -euo pipefail
          CLI=creator-kit/release/bin/rodoh-cartridge.mjs
          ORCHARD=creator-kit/release/examples/orchard-at-low-tide/orchard-at-low-tide.arc.json
          CHANGED=creator-kit/release/examples/orchard-at-low-tide/orchard-at-low-tide.changed.run.json
          INVALID=creator-kit/release/examples/orchard-at-low-tide/orchard-at-low-tide.invalid.arc.json
          node "$CLI" validate --file "$ORCHARD" | tee creator-kit/validation-receipt.json
          node "$CLI" digest --file "$ORCHARD" | tee creator-kit/digest-receipt.json
          node "$CLI" inspect --file "$ORCHARD" | tee creator-kit/inspection-receipt.json
          node "$CLI" simulate --file "$ORCHARD" --seeds 16 --max-cycles 80 | tee creator-kit/simulation-receipt.json
          node "$CLI" verify-run --file "$CHANGED" | tee creator-kit/run-receipt.json
          if node "$CLI" validate --file "$INVALID" > creator-kit/invalid.stdout 2> creator-kit/invalid.stderr; then
            echo 'Malformed companion unexpectedly validated.' >&2
            exit 1
          fi
      - name: Complete Arc regression and production build
        run: |
          npm test 2>&1 | tee creator-kit-diagnostics/full-tests.log
          npm run build 2>&1 | tee creator-kit-diagnostics/build.log
      - name: Pack public creator recovery kit
        run: |
          set -euo pipefail
          (
            cd creator-kit/release
            zip -X -r ../RODOH_Creator_Recovery_Kit.zip .
          )
          sha256sum creator-kit/RODOH_Creator_Recovery_Kit.zip > creator-kit/RODOH_Creator_Recovery_Kit.zip.sha256
      - name: Preserve clean source tree
        run: |
          git restore --source=HEAD --staged --worktree -- docs/game 2>/dev/null || true
          git clean -fdx -- docs/game creator-kit/dist creator-kit/release creator-kit/first creator-kit/second
          # Receipts, diagnostics, and the ZIP are intentional untracked upload artifacts.
          # The release gate requires every tracked source byte to remain unchanged.
          git diff --check
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Upload creator recovery kit and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rodoh-creator-recovery-kit
          path: |
            creator-kit/RODOH_Creator_Recovery_Kit.zip
            creator-kit/RODOH_Creator_Recovery_Kit.zip.sha256
            creator-kit/*-receipt.json
            creator-kit/*-tree.sha256
            creator-kit/invalid.stderr
            creator-kit-build-first.log
            creator-kit-build-second.log
            creator-kit-diagnostics
          if-no-files-found: warn
          retention-days: 30
