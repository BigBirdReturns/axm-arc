name: Publish rebuilt ASOIAF supervised delivery v3

on:
  push:
    branches:
      - diagnostic/asoiaf-supervised-delivery-rebuild-v1
    paths:
      - '.github/workflows/diagnose-asoiaf-supervised-delivery-rebuild-v2.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: write

concurrency:
  group: publish-rebuilt-asoiaf-supervised-delivery-v3
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'BigBirdReturns/axm-arc'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: '258'
      BASE_BRANCH: integration/asoiaf-answer-desk-supervised-transport-v1
      BASE_SHA: 52287c5406594ad6e1d1add7d0aef36274179a3e
      TARGET_BRANCH: feature/asoiaf-answer-desk-supervised-delivery-v1
      PAYLOAD_ISSUE: '263'
      ARCHIVE_SHA256: e808c4d0d2097669509b084fbace88ff187a545dccd73e5f786fdd100cc9e9e7
      RECEIPT_ROOT: ${{ runner.temp }}/asoiaf-supervised-delivery-rebuild-publication-v3
    steps:
      - name: Check out exact qualified integration parent
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          show-progress: false

      - name: Reconstruct, verify, and publish exact seven-surface candidate
        id: publish
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RECEIPT_ROOT"
          printf '%s\n' reconstruct > "$RECEIPT_ROOT/stage.txt"
          printf '%s\n' "$GITHUB_SHA" > "$RECEIPT_ROOT/publisher-sha.txt"
          printf '%s\n' "$BASE_SHA" > "$RECEIPT_ROOT/base-sha.txt"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/issues/$PAYLOAD_ISSUE/comments?per_page=100" \
            --slurp > "$RUNNER_TEMP/payload-pages.json"

          PAGES="$RUNNER_TEMP/payload-pages.json" \
          ARCHIVE="$RUNNER_TEMP/pr258-rebuild-payload.zip" \
          REPORT="$RECEIPT_ROOT/reconstruction.json" \
          python3 <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path

          segment_expected = {
              0: (8000, '3474c910238c8bf3bd6c3280113c6c37b88181b618448697b494907caa9e59ab'),
              1: (8000, '8fd37cabd7cd4d0cde394edca69a298bfaf48e1fee6e5966afeee038448e8d92'),
              2: (7496, '16745cdda29ab3e64a2c88b773afb3f780bfedfbcb7cc62b2681066e33a5272d'),
          }
          part_expected = {
              0: (2000, '1cd6c52e40cd1486ade8381dc104220bd3cfea3ac98f11e3a5bbb674f3e42f54'),
              1: (2000, '72c053a96a6fb2a6d7c136c39e1275482a7b22b91e26af0c479fd9beb5e0b8ab'),
              2: (2000, '4b6236752712c5234775cdabbe19e03f1630ffbc875735679fd46a4d6c49c11c'),
              3: (2000, '30a1e585c2303972a629e3064e00c4f75122c2a3463dc2211a99df5bf564d90c'),
          }
          pages = json.loads(Path(os.environ['PAGES']).read_text(encoding='utf-8'))
          comments = [comment for page in pages for comment in page]
          segments = {}
          parts = {}
          selected = []
          for comment in comments:
              body = str(comment.get('body') or '').replace('\r\n', '\n').strip()
              lines = body.split('\n')
              marker = lines[0] if lines else ''
              if marker not in {
                  'AXM_SUPERVISED_DELIVERY_REBUILD_PAYLOAD_V1',
                  'AXM_SUPERVISED_DELIVERY_REBUILD_SEGMENT0_PART_V1',
              }:
                  continue
              headers = {}
              payload_lines = []
              in_payload = False
              for line in lines[1:]:
                  if not in_payload and line == '':
                      in_payload = True
                      continue
                  if in_payload:
                      payload_lines.append(line)
                  elif '=' in line:
                      key, value = line.split('=', 1)
                      headers[key] = value
              payload = ''.join(payload_lines).strip()
              digest = hashlib.sha256(payload.encode('ascii')).hexdigest() if payload else None
              try:
                  total = int(headers.get('total', '-1'))
                  declared_length = int(headers.get('length', '-1'))
              except ValueError:
                  continue
              if marker == 'AXM_SUPERVISED_DELIVERY_REBUILD_PAYLOAD_V1':
                  try:
                      sequence = int(headers.get('sequence', '-1'))
                  except ValueError:
                      continue
                  if sequence not in segment_expected or total != 3:
                      continue
                  expected_length, expected_digest = segment_expected[sequence]
                  if (
                      declared_length == expected_length
                      and len(payload) == expected_length
                      and headers.get('sha256') == expected_digest
                      and digest == expected_digest
                  ):
                      segments[sequence] = payload
                      selected.append(comment.get('id'))
              else:
                  try:
                      part = int(headers.get('part', '-1'))
                  except ValueError:
                      continue
                  if part not in part_expected or total != 4:
                      continue
                  expected_length, expected_digest = part_expected[part]
                  if (
                      declared_length == expected_length
                      and len(payload) == expected_length
                      and headers.get('sha256') == expected_digest
                      and digest == expected_digest
                  ):
                      parts[part] = payload
                      selected.append(comment.get('id'))
          if sorted(parts) != [0, 1, 2, 3]:
              raise SystemExit(f'exact sequence-00 parts present: {sorted(parts)}')
          repaired_zero = ''.join(parts[index] for index in range(4))
          if len(repaired_zero) != segment_expected[0][0]:
              raise SystemExit('repaired sequence 00 length mismatch')
          if hashlib.sha256(repaired_zero.encode('ascii')).hexdigest() != segment_expected[0][1]:
              raise SystemExit('repaired sequence 00 digest mismatch')
          segments[0] = repaired_zero
          if sorted(segments) != [0, 1, 2]:
              raise SystemExit(f'exact segments present: {sorted(segments)}')
          encoded = ''.join(segments[index] for index in range(3))
          if len(encoded) != 23496:
              raise SystemExit(f'base64 characters {len(encoded)} != 23496')
          decoded = base64.b64decode(encoded, validate=True)
          if len(decoded) != 17620:
              raise SystemExit(f'archive bytes {len(decoded)} != 17620')
          digest = hashlib.sha256(decoded).hexdigest()
          if digest != os.environ['ARCHIVE_SHA256']:
              raise SystemExit(f'archive digest {digest} != {os.environ["ARCHIVE_SHA256"]}')
          Path(os.environ['ARCHIVE']).write_bytes(decoded)
          Path(os.environ['REPORT']).write_text(json.dumps({
              'format': 'axm-asoiaf-supervised-delivery-rebuild-publication/3',
              'selectedCommentIds': selected,
              'base64Characters': len(encoded),
              'archiveBytes': len(decoded),
              'archiveSha256': f'sha256:{digest}',
          }, indent=2) + '\n', encoding='utf-8')
          PY

          unzip -t "$RUNNER_TEMP/pr258-rebuild-payload.zip" \
            | tee "$RECEIPT_ROOT/archive-integrity.log"
          unpack="$RUNNER_TEMP/pr258-rebuild"
          mkdir -p "$unpack"
          unzip -q "$RUNNER_TEMP/pr258-rebuild-payload.zip" -d "$unpack"
          (cd "$unpack" && sha256sum --check --strict SHA256SUMS) \
            | tee "$RECEIPT_ROOT/archive-sha256-verification.log"

          cp "$unpack/source/package.json" package.json
          mkdir -p tools/lib tools tests/narrative/canon tests/fixtures docs .github/workflows
          cp "$unpack/source/tools/lib/asoiaf-answer-desk-supervised-delivery.ts" \
            tools/lib/asoiaf-answer-desk-supervised-delivery.ts
          cp "$unpack/source/tools/asoiaf-answer-desk-supervised-delivery.ts" \
            tools/asoiaf-answer-desk-supervised-delivery.ts
          cp "$unpack/source/tests/narrative/canon/asoiaf-answer-desk-supervised-delivery.test.ts" \
            tests/narrative/canon/asoiaf-answer-desk-supervised-delivery.test.ts

          fetch_blob() {
            local sha="$1"
            local target="$2"
            local response="$RUNNER_TEMP/blob-$sha.json"
            mkdir -p "$(dirname "$target")"
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$sha" > "$response"
            test "$(jq -r .sha "$response")" = "$sha"
            test "$(jq -r .encoding "$response")" = base64
            jq -r .content "$response" | tr -d '\n' | base64 --decode > "$target"
            test "$(git hash-object "$target")" = "$sha"
          }
          fetch_blob 75294b57f4c8597bf6ba86d74aaf200c9c8871bd \
            .github/workflows/asoiaf-answer-desk-supervised-delivery.yml
          fetch_blob 271b02152394a3e1870229ce55d02d1fb511da93 \
            docs/ASOIAF_ANSWER_DESK_SUPERVISED_DELIVERY.md
          fetch_blob 84029c4217698a0a19f3c347f8046688d66e01b0 \
            tests/fixtures/emit-asoiaf-answer-desk-supervised-delivery-input.ts

          cat > "$RECEIPT_ROOT/permanent-surfaces.tsv" <<'EOF'
          .github/workflows/asoiaf-answer-desk-supervised-delivery.yml	75294b57f4c8597bf6ba86d74aaf200c9c8871bd	3e66d0233d758e611100b11dff0e9a95d0161b02733da9e2f36f8539a0919072
          docs/ASOIAF_ANSWER_DESK_SUPERVISED_DELIVERY.md	271b02152394a3e1870229ce55d02d1fb511da93	aa42b9ebd6f358c787d756a66d2f0a2fdbf21031ef33942a42dec80eb682ced7
          package.json	fbe82a00ce1b8147525cd362fdeca99b0437bcbe	47d35b8410b0b5f96db9df88fcdb1e5d8168cbbbe3ccdf8720fbcba847ee6c85
          tests/fixtures/emit-asoiaf-answer-desk-supervised-delivery-input.ts	84029c4217698a0a19f3c347f8046688d66e01b0	0bc94cd732d43b4723e54e8becb98cffc8177e7135a0b4d435f1cb784ebdbfb2
          tests/narrative/canon/asoiaf-answer-desk-supervised-delivery.test.ts	854d95abfd37da26a06826ece3ba0cd9c9a96a70	db028414048cb4e0721630ba99ec23ccf901e651a7d9e9280515fd7c9e0d8d1b
          tools/asoiaf-answer-desk-supervised-delivery.ts	8a52f8853fdb77ebe58f8af8832480981bdc1873	42c26ebfa43653f30570d800e94503f31a44bb87e2945a1b3f4cf33618539700
          tools/lib/asoiaf-answer-desk-supervised-delivery.ts	e7eed136c6dc3b783b8b26e30ae533568c9128ca	39161cb0e2e0fd976922825c3678ae139e106393e3f7282b5f298e497c7530a1
          EOF
          sed -i 's/^          //' "$RECEIPT_ROOT/permanent-surfaces.tsv"
          : > "$RECEIPT_ROOT/permanent-surface-verification.tsv"
          while IFS=$'\t' read -r file expected_blob expected_sha256; do
            actual_blob="$(git hash-object "$file")"
            actual_sha256="$(sha256sum "$file" | awk '{print $1}')"
            printf '%s\t%s\t%s\n' "$file" "$actual_blob" "$actual_sha256" \
              >> "$RECEIPT_ROOT/permanent-surface-verification.tsv"
            test "$actual_blob" = "$expected_blob"
            test "$actual_sha256" = "$expected_sha256"
          done < "$RECEIPT_ROOT/permanent-surfaces.tsv"

          cut -f1 "$RECEIPT_ROOT/permanent-surfaces.tsv" | sort \
            > "$RECEIPT_ROOT/expected-paths.txt"
          git add -A
          git diff --cached --check
          git diff --cached --name-only "$BASE_SHA" -- | sort \
            > "$RECEIPT_ROOT/actual-paths.txt"
          diff -u "$RECEIPT_ROOT/expected-paths.txt" "$RECEIPT_ROOT/actual-paths.txt"

          if grep -Ei -- '(^|/)[^/]*\.(key|pem|p12|pfx|csr|crt)$' \
            "$RECEIPT_ROOT/expected-paths.txt"; then
            echo 'secret-bearing permanent path' >&2
            exit 1
          fi

          printf '%s\n' preflight > "$RECEIPT_ROOT/stage.txt"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RECEIPT_ROOT/pr-before.json"
          test "$(jq -r .state "$RECEIPT_ROOT/pr-before.json")" = open
          test "$(jq -r .draft "$RECEIPT_ROOT/pr-before.json")" = true
          test "$(jq -r .merged "$RECEIPT_ROOT/pr-before.json")" = false
          test "$(jq -r .base.ref "$RECEIPT_ROOT/pr-before.json")" = "$BASE_BRANCH"
          test "$(jq -r .base.sha "$RECEIPT_ROOT/pr-before.json")" = "$BASE_SHA"
          test "$(jq -r .head.ref "$RECEIPT_ROOT/pr-before.json")" = "$TARGET_BRANCH"
          current_head="$(jq -r .head.sha "$RECEIPT_ROOT/pr-before.json")"
          test -n "$current_head"
          git fetch --force origin "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$current_head"
          git merge-base --is-ancestor "$BASE_SHA" "$current_head"
          printf '%s\n' "$current_head" > "$RECEIPT_ROOT/replaced-head.txt"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restore certificate-authenticated ASOIAF supervised delivery'
          candidate_sha="$(git rev-parse HEAD)"
          test "$(git show -s --format=%P HEAD)" = "$BASE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          printf '%s\n' "$candidate_sha" > "$RECEIPT_ROOT/candidate-sha.txt"

          printf '%s\n' publish > "$RECEIPT_ROOT/stage.txt"
          git push \
            --force-with-lease="refs/heads/$TARGET_BRANCH:$current_head" \
            origin "HEAD:refs/heads/$TARGET_BRANCH"
          git fetch --force origin "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$candidate_sha"
          printf '%s\n' true > "$RECEIPT_ROOT/published.txt"
          printf '%s\n' complete > "$RECEIPT_ROOT/stage.txt"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Finalize publication receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RECEIPT_ROOT"
          test -f "$RECEIPT_ROOT/stage.txt" || printf '%s\n' failed-before-stage > "$RECEIPT_ROOT/stage.txt"
          printf '%s\n' \
            "publisherSha=$GITHUB_SHA" \
            "baseSha=$BASE_SHA" \
            "targetBranch=$TARGET_BRANCH" \
            "published=${{ steps.publish.outputs.published || 'false' }}" \
            > "$RECEIPT_ROOT/publication-boundary.txt"
          find "$RECEIPT_ROOT" -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum \
            | sed "s#  $RECEIPT_ROOT/#  #" > "$RECEIPT_ROOT/SHA256SUMS"

      - name: Upload publication receipt
        if: always()
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-supervised-delivery-rebuild-publication-v3
          path: ${{ runner.temp }}/asoiaf-supervised-delivery-rebuild-publication-v3
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Report bounded publication result
        if: always()
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
          CANDIDATE_SHA: ${{ steps.publish.outputs.candidate_sha }}
          PUBLISHED: ${{ steps.publish.outputs.published }}
        shell: bash
        run: |
          set -euo pipefail
          stage=unknown
          test -f "$RECEIPT_ROOT/stage.txt" && stage="$(cat "$RECEIPT_ROOT/stage.txt")"
          if test "$PUBLISHED" = true; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
              "ASOIAF_SUPERVISED_DELIVERY_REBUILD_PUBLICATION_V3 head=\`$CANDIDATE_SHA\` base=\`$BASE_SHA\` surfaces=\`7\` soleParent=\`true\` carrierFree=\`true\` run=\`$GITHUB_RUN_ID\` artifact=\`${ARTIFACT_ID:-none}\` digest=\`${ARTIFACT_DIGEST:-none}\`. Exact-head permanent qualification remains required."
          else
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
              "ASOIAF_SUPERVISED_DELIVERY_REBUILD_PUBLICATION_V3 refused publisher head \`$GITHUB_SHA\` at stage \`$stage\`; run=\`$GITHUB_RUN_ID\` artifact=\`${ARTIFACT_ID:-none}\`. No recovered candidate or qualification claim is asserted."
          fi
          test "$PUBLISHED" = true
