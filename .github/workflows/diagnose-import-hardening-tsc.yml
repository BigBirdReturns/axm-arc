name: Diagnose import-hardening TypeScript

on:
  push:
    branches: [release/import-canonicalization-hardening]
    paths:
      - '.github/workflows/diagnose-import-hardening-tsc.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Capture exact TypeScript diagnostics
        run: |
          set +e
          npm run typecheck > tsc.log 2>&1
          status=$?
          printf '%s\n' "$status" > tsc.status
          cat tsc.log
          exit 0
      - name: Publish bounded diagnostic record
        run: |
          mkdir -p diagnostics
          cp tsc.log diagnostics/import-hardening-tsc.log
          cp tsc.status diagnostics/import-hardening-tsc.status
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/import-hardening-tsc.log diagnostics/import-hardening-tsc.status
          git commit -m 'Record import-hardening TypeScript diagnostics'
          git push origin HEAD:release/import-canonicalization-hardening
      - uses: actions/upload-artifact@v4
        with:
          name: import-hardening-tsc-diagnostics
          path: |
            tsc.log
            tsc.status
          if-no-files-found: error
          retention-days: 7
