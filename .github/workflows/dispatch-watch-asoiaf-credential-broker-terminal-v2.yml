name: Probe exact ASOIAF credential provider host through indexed observer

on:
  pull_request:
    branches:
      - observer/asoiaf-credential-broker-terminal-v2
    paths:
      - '.observer-trigger/credential-broker-terminal-v2.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexed-provider-host-probe
  cancel-in-progress: true

env:
  CANDIDATE_SHA: 303a564d3c1dc4fff57fba7ef5778d793ffa1eb5

jobs:
  linux_probe:
    if: github.repository == 'BigBirdReturns/axm-arc' && github.event.pull_request.head.ref == 'observer/asoiaf-credential-broker-terminal-v2-trigger'
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    steps:
      - name: Check out exact provider-host candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          show-progress: false

      - name: Bind exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Strict TypeScript
        run: npm run typecheck

      - name: Focused provider and inherited lifecycle
        shell: bash
        run: |
          set -euo pipefail
          npm test -- \
            tests/narrative/canon/asoiaf-answer-credential-provider-host.test.ts \
            tests/narrative/canon/asoiaf-answer-credential-broker.test.ts \
            tests/narrative/canon/asoiaf-answer-credential-deployment.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-transport-enrollment.test.ts

      - name: Exercise synthetic provider-host fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/provider-host-fixture"
          estate="$RUNNER_TEMP/provider-host-estate"
          mkdir -p "$fixture"
          npx vite-node tests/fixtures/emit-asoiaf-answer-credential-provider-host-input.ts "$fixture" "$estate" > "$RUNNER_TEMP/fixture-emission.json"
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          const fixture = path.join(process.env.RUNNER_TEMP, 'provider-host-fixture');
          const read = (name) => JSON.parse(fs.readFileSync(path.join(fixture, name), 'utf8'));
          assert.equal(read('provider-verification.json').ok, true);
          assert.deepEqual(read('provider-verification.json').findings, []);
          assert.equal(read('broker-verification.json').ok, true);
          assert.deepEqual(read('broker-verification.json').findings, []);
          assert.deepEqual(read('provider-status.json').counts, {
            profiles: 1,
            invocations: 2,
            results: 2,
            stateEntries: 1,
          });
          NODE

      - name: Production build
        run: npm run build

  windows_probe:
    if: github.repository == 'BigBirdReturns/axm-arc' && github.event.pull_request.head.ref == 'observer/asoiaf-credential-broker-terminal-v2-trigger'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact provider-host candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          show-progress: false

      - name: Bind exact candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:CANDIDATE_SHA) { throw 'wrong provider-host candidate' }
          if (git status --porcelain) { throw 'candidate worktree is not clean' }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Emit and parse permanent Windows CNG adapter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptPath = Join-Path $env:RUNNER_TEMP 'asoiaf-provider-host.ps1'
          npm run --silent asoiaf:answer-credential-provider-host -- powershell --out $scriptPath
          $scriptText = Get-Content -Raw -LiteralPath $scriptPath
          [void][scriptblock]::Create($scriptText)
          if ($scriptText -match 'Export(?:Pkcs8|RSAPrivateKey|ECPrivateKey|Parameters)') {
            throw 'Windows provider adapter contains a key export operation'
          }
          if ($scriptText -notmatch 'Cert:\\CurrentUser\\My\\') {
            throw 'Windows provider adapter does not bind CurrentUser certificate storage'
          }

      - name: Sign with a non-exportable Windows CNG key
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptPath = Join-Path $env:RUNNER_TEMP 'asoiaf-provider-host.ps1'
          $certificate = New-SelfSignedCertificate `
            -Subject 'CN=ASOIAF Provider Host Indexed Probe' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -KeyExportPolicy NonExportable `
            -NotAfter (Get-Date).AddHours(2)
          try {
            $message = [Text.Encoding]::UTF8.GetBytes('asoiaf-provider-host-indexed-probe')
            $inputPath = Join-Path $env:RUNNER_TEMP 'windows-sign-input.json'
            @{
              command = 'sign'
              thumbprint = $certificate.Thumbprint
              messageBase64 = [Convert]::ToBase64String($message)
            } | ConvertTo-Json | Set-Content -LiteralPath $inputPath -Encoding utf8
            $result = & $scriptPath -InputPath $inputPath | ConvertFrom-Json
            if ($result.algorithm -ne 'rsa-sha256') { throw 'unexpected Windows CNG signature algorithm' }
            $signature = [Convert]::FromBase64String([string]$result.signatureBase64)
            $public = [System.Security.Cryptography.X509Certificates.RSACertificateExtensions]::GetRSAPublicKey($certificate)
            try {
              $verified = $public.VerifyData(
                $message,
                $signature,
                [Security.Cryptography.HashAlgorithmName]::SHA256,
                [Security.Cryptography.RSASignaturePadding]::Pkcs1
              )
            } finally {
              $public.Dispose()
            }
            if (-not $verified) { throw 'Windows CNG signature did not verify' }
            $private = [System.Security.Cryptography.X509Certificates.RSACertificateExtensions]::GetRSAPrivateKey($certificate)
            try {
              $exportBlocked = $false
              try {
                [void]$private.ExportPkcs8PrivateKey()
              } catch {
                $exportBlocked = $true
              }
            } finally {
              $private.Dispose()
            }
            if (-not $exportBlocked) { throw 'qualification key unexpectedly permitted private-key export' }
          } finally {
            Remove-Item -LiteralPath ("Cert:\CurrentUser\My\" + $certificate.Thumbprint) -Force -ErrorAction SilentlyContinue
          }
