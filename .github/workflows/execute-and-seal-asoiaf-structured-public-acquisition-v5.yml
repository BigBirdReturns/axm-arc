name: Execute and seal ASOIAF structured public acquisition v5

on:
  push:
    branches:
      - feature/asoiaf-structured-public-acquisition-v1
    paths:
      - '.github/workflows/execute-and-seal-asoiaf-structured-public-acquisition-v5.yml'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: execute-and-seal-asoiaf-structured-public-acquisition-v5
  cancel-in-progress: false

jobs:
  execute_and_seal:
    if: github.repository == 'BigBirdReturns/axm-arc' && github.ref_name == 'feature/asoiaf-structured-public-acquisition-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact parent branch
        uses: actions/checkout@v4
        with:
          ref: feature/asoiaf-structured-public-acquisition-v1
          fetch-depth: 0
          show-progress: false

      - name: Bind the trigger commit and clean worktree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = 'feature/asoiaf-structured-public-acquisition-v1'
          test -z "$(git status --porcelain)"
          test -f .github/workflows/apply-and-qualify-asoiaf-structured-public-acquisition-v4.yml
          test -f .github/workflows/repair-and-seal-asoiaf-structured-public-acquisition.yml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Execute the staged complete repair and remove every carrier
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path(
              '.github/workflows/apply-and-qualify-asoiaf-structured-public-acquisition-v4.yml'
          )
          text = workflow.read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          if start_marker not in text or end_marker not in text:
              raise SystemExit('structured-acquisition v4 apply block is malformed')
          extracted = text.split(start_marker, 1)[1].split(end_marker, 1)[0]
          script = "\n".join(
              line[10:] if line.startswith('          ') else line
              for line in extracted.splitlines()
          )
          exec(compile(script, '<structured-acquisition-v4-apply>', 'exec'), {})

          for carrier in (
              '.github/workflows/repair-and-seal-asoiaf-structured-public-acquisition.yml',
              '.github/workflows/repair-and-seal-asoiaf-structured-public-acquisition-v2.yml',
              '.github/workflows/repair-and-seal-asoiaf-structured-public-acquisition-v3.yml',
              '.github/workflows/apply-and-qualify-asoiaf-structured-public-acquisition-v4.yml',
              '.github/workflows/execute-and-seal-asoiaf-structured-public-acquisition-v5.yml',
          ):
              Path(carrier).unlink(missing_ok=True)
          PY
          git diff --check
          test ! -e .github/workflows/repair-and-seal-asoiaf-structured-public-acquisition.yml
          test ! -e .github/workflows/repair-and-seal-asoiaf-structured-public-acquisition-v2.yml
          test ! -e .github/workflows/repair-and-seal-asoiaf-structured-public-acquisition-v3.yml
          test ! -e .github/workflows/apply-and-qualify-asoiaf-structured-public-acquisition-v4.yml
          test ! -e .github/workflows/execute-and-seal-asoiaf-structured-public-acquisition-v5.yml

      - name: Strict TypeScript
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/typecheck.log"

      - name: Focused synthetic acquisition qualification
        shell: bash
        run: |
          set -euo pipefail
          npm test -- tests/narrative/canon/asoiaf-structured-public-acquisition.test.ts \
            2>&1 | tee "$RUNNER_TEMP/focused-tests.log"

      - name: Complete Arc regression
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/full-tests.log"

      - name: Production build
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Commit and push the exact qualified candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Qualify policy-bounded ASOIAF structured acquisition'
          candidate_sha="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          git push origin HEAD:feature/asoiaf-structured-public-acquisition-v1
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"

      - name: Build exact qualification artifact
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          root='asoiaf-structured-public-acquisition-qualification'
          mkdir -p "$root"
          cp "$RUNNER_TEMP/typecheck.log" "$root/"
          cp "$RUNNER_TEMP/focused-tests.log" "$root/"
          cp "$RUNNER_TEMP/full-tests.log" "$root/"
          cp "$RUNNER_TEMP/build.log" "$root/"
          printf '%s\n' "$CANDIDATE_SHA" > "$root/candidate-sha.txt"
          git show --stat --oneline --decorate "$CANDIDATE_SHA" > "$root/candidate-stat.txt"
          printf '%s\n' \
            'networkAcquisition=qualified-synthetic-runtime' \
            'liveNetworkInCI=false' \
            'requestIdentity=signed-plan-field' \
            'registeredEndpointsOnly=true' \
            'adapterSourceBinding=required' \
            'credentialBearingHeaders=false' \
            'robotsRequired=true' \
            'hostDelayFloorMilliseconds=1500' \
            'retryAfterHonored=true' \
            'crossOriginRedirects=false' \
            'responseSizeBounded=true' \
            'rawResponseDigest=raw-bytes-sha256' \
            'rawResponseRetained=false' \
            'normalizedRetention=rights-controlled' \
            'cacheReplay=zero-network-valid-receipt' \
            'batchPacer=shared' \
            'collectorAttemptParity=required' \
            'repairCarriersRetained=false' \
            'graphEffect=none' \
            'canonEffect=none' \
            > "$root/structured-acquisition-boundary.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" \
            > "$root/SHA256SUMS"

      - name: Upload exact qualification
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-structured-public-acquisition-qualification
          path: asoiaf-structured-public-acquisition-qualification
          if-no-files-found: error
          retention-days: 30

      - name: Post durable qualification receipt
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/qualification-comment.md"
          cat > "$body" <<EOF
          Structured public acquisition qualification is closed on candidate \`${CANDIDATE_SHA}\`. Strict TypeScript, the focused synthetic acquisition suite, the complete Arc regression suite, and the production build passed. Qualification artifact \`${ARTIFACT_ID}\` has ZIP digest \`${ARTIFACT_DIGEST}\`.

          The qualified runtime binds durable request identity into the signed plan; confines every plan to its registered adapter, atlas source, HTTPS host and path, and credential-free header surface; evaluates robots policy; shares the source host-delay floor across robots, data, retries, redirects, and batch boundaries; honors \`Retry-After\`; refuses cross-origin or unregistered redirects; bounds response size and JSON media; binds the adapter to the raw response byte SHA-256; retains no raw response; preserves collector attempt parity; and issues a new valid zero-network receipt for cache replay. Every disposable repair carrier was removed from the candidate.

          Acquisition remains \`graphEffect=none\` and \`canonEffect=none\`. This qualification does not certify the truth of an ASOIAF proposition and does not permit endpoint availability or normalized reference data to bypass reviewed reconciliation.
          EOF
          gh pr comment 239 --repo BigBirdReturns/axm-arc --body-file "$body"
