name: Export Arc cleanup source

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'agent/arc-source-authority-cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/arc-source-authority-cleanup
          show-progress: false
      - name: Package exact Arc source
        run: |
          mkdir -p source-receipt
          tar --exclude=.git --exclude=node_modules --exclude=source-receipt -czf source-receipt/axm-arc-source.tgz .
          sha256sum source-receipt/axm-arc-source.tgz > source-receipt/axm-arc-source.sha256
          git rev-parse HEAD > source-receipt/branch-head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: arc-cleanup-source
          path: source-receipt
          if-no-files-found: error
          retention-days: 2
