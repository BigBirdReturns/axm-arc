name: Finalize deterministic semantic action objectives

on:
  pull_request:
    paths:
      - '.github/workflows/finalize-action-semantic-objectives.yml'
  push:
    branches:
      - feature/action-semantic-objectives-v1
    paths:
      - '.github/workflows/finalize-action-semantic-objectives.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-deterministic-semantic-action-objectives
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Integrate semantic objective law into canonical simulation and receipts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              return text.replace(old, new)

          schema_path = Path('src/engine/schema.ts')
          schema = schema_path.read_text()
          schema = replace_once(
              schema,
              'import { actionProfileErrors } from "./action/profile.js";\n',
              'import { actionProfileErrors } from "./action/profile.js";\n'
              'import { actionObjectiveProfileErrors } from "./action/objectives.js";\n',
              'schema import',
          )
          schema = replace_once(
              schema,
              '  errors.push(...actionProfileErrors(arc));\n  errors.push(...authoredExperienceErrors(arc));\n',
              '  errors.push(...actionProfileErrors(arc));\n'
              '  errors.push(...actionObjectiveProfileErrors(arc));\n'
              '  errors.push(...authoredExperienceErrors(arc));\n',
              'schema validator',
          )
          schema_path.write_text(schema)

          simulation_path = Path('src/engine/action/simulation.ts')
          simulation = simulation_path.read_text()
          simulation = replace_once(
              simulation,
              'import { compareCodepoints } from "../determinism.js";\n',
              'import { compareCodepoints } from "../determinism.js";\n'
              'import {\n'
              '  actionObjectiveComplete,\n'
              '  initializeSemanticObjectiveState,\n'
              '  semanticObjectiveProgress,\n'
              '  stepSemanticObjective,\n'
              '} from "./objectives.js";\n',
              'simulation import',
          )
          simulation = replace_once(
              simulation,
              '  return { ...state, enemies: spawnWave(spec, state, 0) };\n',
              '  const initialized = { ...state, enemies: spawnWave(spec, state, 0) };\n'
              '  return initializeSemanticObjectiveState(spec, initialized);\n',
              'initial semantic state',
          )
          simulation, count = re.subn(
              r'function objectiveProgress\(spec: ActionEncounterSpec, state: ActionSimulationState\): ActionObjectiveProgress\[\] \{.*?\n\}\n\nfunction terminalResult',
              '''function objectiveProgress(spec: ActionEncounterSpec, state: ActionSimulationState): ActionObjectiveProgress[] {
  const completed = new Set(state.completedObjectiveIds);
  return spec.objectives.map((objective, index) => {
    const isCompleted = completed.has(objective.id);
    const semantic = semanticObjectiveProgress(state, objective, isCompleted);
    if (semantic) return semantic;
    if (isCompleted) {
      return { id: objective.id, defeated: objective.targetDefeats, target: objective.targetDefeats, completed: true };
    }
    if (index !== state.activeObjectiveIndex) {
      return { id: objective.id, defeated: 0, target: objective.targetDefeats, completed: false };
    }
    const living = state.enemies.filter((enemy) => enemy.objectiveId === objective.id && enemy.mode !== "defeated").length;
    return {
      id: objective.id,
      defeated: Math.max(0, objective.enemyCount - living),
      target: objective.targetDefeats,
      completed: false,
    };
  });
}

function terminalResult''',
              simulation,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'objective progress replacement: expected one block, found {count}')
          simulation, count = re.subn(
              r'function advanceWave\(spec: ActionEncounterSpec, state: ActionSimulationState\): ActionSimulationState \{\n  if \(state\.enemies\.some\(\(enemy\) => enemy\.mode !== "defeated"\)\) return state;\n  const objective = spec\.objectives\[state\.activeObjectiveIndex\];\n  if \(!objective\) return state;',
              '''function advanceWave(spec: ActionEncounterSpec, state: ActionSimulationState): ActionSimulationState {
  const objective = spec.objectives[state.activeObjectiveIndex];
  if (!objective || !actionObjectiveComplete(state, objective)) return state;''',
              simulation,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'advance-wave replacement: expected one block, found {count}')
          simulation = replace_once(
              simulation,
              '  state = { ...state, tick: state.tick + 1, player, enemies, stats, events, previousButtons: input.buttons };\n'
              '  state = advanceWave(spec, state);\n',
              '  state = { ...state, tick: state.tick + 1, player, enemies, stats, events };\n'
              '  state = stepSemanticObjective(spec, state, input);\n'
              '  state = { ...state, previousButtons: input.buttons };\n'
              '  state = advanceWave(spec, state);\n',
              'semantic objective step',
          )
          simulation_path.write_text(simulation)

          receipt_path = Path('src/engine/action/receipt.ts')
          receipt = receipt_path.read_text()
          receipt = replace_once(
              receipt,
              '  ACTION_RUNTIME_VERSION,\n',
              '  ACTION_RUNTIME_VERSION,\n  ACTION_SEMANTIC_RUNTIME_VERSION,\n',
              'receipt runtime import',
          )
          receipt = replace_once(
              receipt,
              '  enemiesDefeated: z.number().int().nonnegative(),\n}).strict();\n',
              '  enemiesDefeated: z.number().int().nonnegative(),\n'
              '  objectiveInteractions: z.number().int().nonnegative().optional(),\n'
              '  objectiveHoldTicks: z.number().int().nonnegative().optional(),\n'
              '}).strict();\n',
              'receipt stats schema',
          )
          receipt = replace_once(
              receipt,
              '  completed: z.boolean(),\n}).strict();\n',
              '  completed: z.boolean(),\n'
              '  kind: z.enum(["interact_count", "hold_ticks"]).optional(),\n'
              '  progress: z.number().int().nonnegative().optional(),\n'
              '}).strict();\n',
              'receipt progress schema',
          )
          receipt = replace_once(
              receipt,
              '  runtimeVersion: z.literal(ACTION_RUNTIME_VERSION),\n',
              '  runtimeVersion: z.union([\n'
              '    z.literal(ACTION_RUNTIME_VERSION),\n'
              '    z.literal(ACTION_SEMANTIC_RUNTIME_VERSION),\n'
              '  ]),\n',
              'receipt runtime schema',
          )
          receipt = replace_once(
              receipt,
              '    runtimeVersion: ACTION_RUNTIME_VERSION,\n',
              '    runtimeVersion: spec.runtimeVersion,\n',
              'receipt runtime value',
          )
          receipt_path.write_text(receipt)
          PY
          git diff --check

      - run: npm ci --no-audit --no-fund

      - name: Qualify deterministic semantic objectives and legacy identity
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm test -- \
            tests/action/semantic-objectives.test.ts \
            tests/action/action-profile.test.ts \
            tests/experience/authored-experience.test.ts
          npm test
          npm run build
          if git ls-files -- docs/game | grep -q .; then
            git restore --source=HEAD --staged --worktree -- docs/game
          fi
          git clean -fdx -- docs/game
          git diff --check

      - name: Publish only permanent semantic-objective integration
        shell: bash
        run: |
          set -euo pipefail
          source_head='${{ github.event.pull_request.head.sha || github.sha }}'
          git fetch --no-tags origin feature/action-semantic-objectives-v1
          test "$(git rev-parse origin/feature/action-semantic-objectives-v1)" = "$source_head"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/engine/schema.ts \
            src/engine/action/simulation.ts \
            src/engine/action/receipt.ts
          git diff --cached --check
          git commit -m 'Execute semantic action objectives deterministically'
          git push origin HEAD:feature/action-semantic-objectives-v1
