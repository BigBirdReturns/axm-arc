name: Finalize authored-experience schema integration

on:
  pull_request:
    paths:
      - '.github/workflows/finalize-authored-experience-schema.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-authored-experience-schema
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Integrate the extension validator into canonical Arc validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/engine/schema.ts')
          text = path.read_text()
          import_anchor = 'import { actionProfileErrors } from "./action/profile.js";\n'
          import_replacement = import_anchor + 'import { authoredExperienceErrors } from "./experience/profile.js";\n'
          if text.count(import_anchor) != 1:
              raise SystemExit(f'expected one action-profile import, found {text.count(import_anchor)}')
          text = text.replace(import_anchor, import_replacement)
          validation_anchor = '  errors.push(...actionProfileErrors(arc));\n'
          validation_replacement = validation_anchor + '  errors.push(...authoredExperienceErrors(arc));\n'
          if text.count(validation_anchor) != 1:
              raise SystemExit(f'expected one action-profile validation call, found {text.count(validation_anchor)}')
          path.write_text(text.replace(validation_anchor, validation_replacement))
          PY
          git diff --check
      - run: npm ci --no-audit --no-fund
      - name: Qualify canonical validation and the complete Arc product
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm test -- tests/experience/authored-experience.test.ts tests/action/action-profile.test.ts
          npm test
          npm run build
          if git ls-files -- docs/game | grep -q .; then
            git restore --source=HEAD --staged --worktree -- docs/game
          fi
          git clean -fdx -- docs/game
          git diff --check
      - name: Publish only the canonical schema integration
        shell: bash
        run: |
          set -euo pipefail
          source_head='${{ github.event.pull_request.head.sha || github.sha }}'
          git fetch --no-tags origin feature/authored-experience-contract-v1
          test "$(git rev-parse origin/feature/authored-experience-contract-v1)" = "$source_head"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/engine/schema.ts
          git diff --cached --check
          git commit -m 'Validate authored-experience law with every Arc'
          git push origin HEAD:feature/authored-experience-contract-v1
