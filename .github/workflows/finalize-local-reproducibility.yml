name: Finalize local reproducibility fixture

on:
  push:
    branches: [release/local-estate-replication]
    paths:
      - 'tools/build-relief-connected-fixture.ts'
      - '.github/workflows/finalize-local-reproducibility.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-local-reproducibility-fixture
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Rebuild the deterministic connected-operation fixture
        run: |
          set -euo pipefail
          npm run build:relief-connected-fixture
          grep -F '2026-07-24T00:00:00.000Z' cartridges/relief-circuit-lamp-district.run.json
      - name: Exact product qualification
        run: |
          set -euo pipefail
          npm run typecheck
          npm test -- tests/engine/connected-operation-fixture.test.ts tests/engine/connected-operation.test.ts tests/common-ship/relief-circuit.test.ts
          npm test
          npm run build
          git restore --source=HEAD --staged --worktree -- docs/game 2>/dev/null || true
          git clean -fdx -- docs/game 2>/dev/null || true
          git diff --check
      - name: Publish the rebuilt fixture
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cartridges/relief-circuit-lamp-district.run.json
          if git diff --cached --quiet; then
            echo 'Fixture already exact.'
            exit 0
          fi
          git commit -m 'Regenerate the deterministic connected-operation fixture'
          git push origin HEAD:release/local-estate-replication
