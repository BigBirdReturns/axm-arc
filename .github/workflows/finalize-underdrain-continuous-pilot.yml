name: Finalize continuous Underdrain pilot

on:
  pull_request:
    paths:
      - '.github/workflows/finalize-underdrain-continuous-pilot.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-continuous-underdrain-pilot
  cancel-in-progress: true

env:
  CI: 'true'
  SOURCE_DATE_EPOCH: '0'

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reconcile the final hidden-cause obligation identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/demos/underdrain/arc.ts')
          text = path.read_text()
          old = '          ["keep-water-running", "expose-enzyme-poisoning"],\n'
          new = '          ["keep-water-running", "identify-hidden-drain-cause"],\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one hidden-cause obligation anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check

      - run: npm ci --no-audit --no-fund

      - name: Regenerate the exact authoring estate
        shell: bash
        run: |
          set -euo pipefail
          npx vite-node tools/build-underdrain-authoring.ts
          git diff --check

      - name: Qualify the complete continuous pilot authority
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm test -- \
            tests/demos/underdrain-draft.test.ts \
            tests/action/semantic-objectives.test.ts \
            tests/experience/authored-experience.test.ts
          npm test
          npm run build
          if git ls-files -- docs/game | grep -q .; then
            git restore --source=HEAD --staged --worktree -- docs/game
          fi
          git clean -fdx -- docs/game
          git diff --check

      - name: Publish only the permanent pilot files
        shell: bash
        run: |
          set -euo pipefail
          source_head='${{ github.event.pull_request.head.sha || github.sha }}'
          git fetch --no-tags origin demo/underdrain-authority-v1
          test "$(git rev-parse origin/demo/underdrain-authority-v1)" = "$source_head"
          changed=$(git status --porcelain | awk '{print $2}' | sort)
          expected=$(printf '%s\n' \
            examples/underdrain-draft/SHA256SUMS \
            examples/underdrain-draft/authoring.json \
            src/demos/underdrain/arc.ts \
            | sort)
          test "$changed" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/demos/underdrain/arc.ts \
            examples/underdrain-draft/authoring.json \
            examples/underdrain-draft/SHA256SUMS
          git diff --cached --check
          git commit -m 'Freeze the continuous Underdrain pilot authority'
          git push origin HEAD:demo/underdrain-authority-v1
