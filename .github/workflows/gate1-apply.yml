name: Gate 1 patch applier

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - tools/codex-apply.py
      - .github/workflows/gate1-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'codex/gate1-engine-13'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python tools/codex-apply.py
      - run: rm tools/codex-apply.py .github/workflows/gate1-apply.yml
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Publish verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair Gate 1 engine integration"
          git push origin HEAD:${{ github.head_ref }}
