name: Gate 1 diagnostics

on:
  pull_request:
    paths:
      - 'src/engine/**'
      - 'src/common-ship/**'
      - 'src/dark-tomb/**'
      - 'tools/codex-apply.py'
      - '.github/workflows/gate1-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply pending patch in the diagnostic worktree
        run: |
          if [ -f tools/codex-apply.py ]; then python tools/codex-apply.py; fi
      - name: Capture diagnostics
        run: |
          set +e
          npx tsc --noEmit > gate1-tsc.txt 2>&1
          echo "$?" > gate1-tsc-exit.txt
          npx vitest run > gate1-vitest.txt 2>&1
          echo "$?" > gate1-vitest-exit.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: gate1-diagnostics
          path: |
            gate1-tsc.txt
            gate1-tsc-exit.txt
            gate1-vitest.txt
            gate1-vitest-exit.txt
