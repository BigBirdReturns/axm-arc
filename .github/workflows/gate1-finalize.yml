name: Finalize Gate 1

on:
  push:
    branches:
      - codex/gate1-engine-13
    paths:
      - tools/codex-apply.py
      - .github/workflows/gate1-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/gate1-engine-13
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply final documentation patch
        run: python tools/codex-apply.py
      - name: Remove temporary finalization files
        run: |
          rm tools/codex-apply.py
          rm .github/workflows/gate1-finalize.yml
      - name: Install exact dependencies
        run: npm ci
      - name: Verify final candidate
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Publish final candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Gate 1 documentation and receipts"
          git push origin HEAD:codex/gate1-engine-13
