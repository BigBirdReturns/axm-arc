name: Gate 3 application integration

on:
  push:
    branches: [codex/gate3-lamp-district]
    paths:
      - 'tools/apply-gate3-app.py'
      - '.github/workflows/gate3-app-apply.yml'
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'tools/apply-gate3-app.py'
      - '.github/workflows/gate3-app-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'codex/gate3-lamp-district' || github.ref_name == 'codex/gate3-lamp-district'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/gate3-lamp-district
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python tools/apply-gate3-app.py
      - run: rm tools/apply-gate3-app.py .github/workflows/gate3-app-apply.yml
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Publish verified application integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire Lamp District and Dark Tomb Forge into the player"
          git push origin HEAD:codex/gate3-lamp-district
