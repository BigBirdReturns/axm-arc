name: Gate 3 Lamp District materialization

on:
  push:
    branches: [codex/gate3-lamp-district]
    paths:
      - 'tools/materialize-lamp-district.py'
      - '.github/workflows/gate3-materialize.yml'
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'tools/materialize-lamp-district.py'
      - '.github/workflows/gate3-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'codex/gate3-lamp-district' || github.ref_name == 'codex/gate3-lamp-district'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/gate3-lamp-district
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python tools/materialize-lamp-district.py
      - run: npm ci
      - run: npm run build:dark-tomb-reference
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Publish generated canonical source and artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize the canonical Lamp District source and Arc"
          git push origin HEAD:codex/gate3-lamp-district
