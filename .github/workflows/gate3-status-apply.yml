name: Gate 3 status reconciliation

on:
  push:
    branches: [codex/gate3-lamp-district]
    paths:
      - 'tools/apply-gate3-status.py'
      - '.github/workflows/gate3-status-apply.yml'
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'tools/apply-gate3-status.py'
      - '.github/workflows/gate3-status-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'codex/gate3-lamp-district' || github.ref_name == 'codex/gate3-lamp-district'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/gate3-lamp-district
          fetch-depth: 0
      - run: python tools/apply-gate3-status.py
      - run: rm tools/apply-gate3-status.py .github/workflows/gate3-status-apply.yml
      - name: Publish reconciled release status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reconcile Gate 3 release status and commands"
          git push origin HEAD:codex/gate3-lamp-district
