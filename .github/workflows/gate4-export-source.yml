name: Gate 4 Arc source export

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/gate4-export-source.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - run: git rev-parse HEAD > gate4-arc-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: gate4-arc-source
          path: |
            .
            !.git/**
            !node_modules/**
          include-hidden-files: true
          retention-days: 7
