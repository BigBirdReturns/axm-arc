name: Gate 5 source export

on:
  push:
    branches: [codex/gate5-relief-circuit-prep]
    paths:
      - '.github/workflows/gate5-source-export.yml'
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - '.github/workflows/gate5-source-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Record exact source identity
        run: git rev-parse HEAD > gate5-source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: gate5-arc-source
          path: |
            .
            !node_modules
            !dist
          include-hidden-files: true
          retention-days: 7
