name: Gate 7A clean-room finalization

on:
  push:
    branches: [gate7/clean-room-orchard]
    paths:
      - '.github/workflows/gate7-clean-room-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build deterministic clean-room artifacts
        run: npm run build:clean-room-reference
      - name: TypeScript
        run: npm run typecheck
      - name: Focused clean-room acceptance
        run: npm test -- tests/clean-room/orchard-at-low-tide.test.ts
      - name: Complete Arc regression suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Publish exact generated artifacts
        run: |
          git restore --source=HEAD --staged --worktree dist docs/game 2>/dev/null || true
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cartridges/clean-room
          git commit -m "Publish Gate 7A clean-room artifacts"
          git push origin HEAD:gate7/clean-room-orchard
