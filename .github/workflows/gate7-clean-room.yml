name: Gate 7A clean-room cartridge

on:
  pull_request:
    paths:
      - 'src/clean-room/**'
      - 'tools/build-clean-room-reference.ts'
      - 'cartridges/clean-room/**'
      - 'tests/clean-room/**'
      - 'docs/GATE7_CLEAN_ROOM_ACCEPTANCE.md'
      - 'package.json'
      - '.github/workflows/gate7-clean-room.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clean-room:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Record exact candidate
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git diff --check
          mkdir -p gate7-clean-room-receipt
          printf '%s\n' "$CANDIDATE_SHA" > gate7-clean-room-receipt/arc-candidate-sha.txt
      - name: Rebuild exact clean-room artifacts
        run: |
          npm run build:clean-room-reference | tee gate7-clean-room-receipt/build-artifacts.log
          git diff --exit-code -- cartridges/clean-room
      - name: TypeScript
        run: npm run typecheck | tee gate7-clean-room-receipt/typecheck.log
      - name: Focused clean-room acceptance
        run: npm test -- tests/clean-room/orchard-at-low-tide.test.ts | tee gate7-clean-room-receipt/focused-tests.log
      - name: Complete Arc regression suite
        run: npm test | tee gate7-clean-room-receipt/vitest.log
      - name: Production build
        run: npm run build | tee gate7-clean-room-receipt/build.log
      - name: Upload Gate 7A receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate7a-clean-room-receipt
          path: |
            gate7-clean-room-receipt
            cartridges/clean-room/manifest.json
          if-no-files-found: warn
          retention-days: 30
