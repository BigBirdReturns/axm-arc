name: Godscar implementation workspace

on:
  push:
    branches:
      - agent/godscar-bootstrap
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Arc main
        uses: actions/checkout@v4
        with:
          ref: main
          path: axm-arc
      - name: Check out World main
        uses: actions/checkout@v4
        with:
          repository: BigBirdReturns/axm-world
          ref: main
          path: axm-world
      - name: Install Arc dependencies
        working-directory: axm-arc
        run: npm ci
      - name: Install World dependencies
        working-directory: axm-world
        run: npm ci
      - name: Remove git metadata
        run: find . -name .git -type d -prune -exec rm -rf {} +
      - name: Upload implementation workspace
        uses: actions/upload-artifact@v4
        with:
          name: godscar-implementation-workspace
          path: |
            axm-arc
            axm-world
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
