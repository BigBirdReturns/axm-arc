name: Import and canonicalization hardening

on:
  pull_request:
    paths:
      - 'src/engine/bounded-json.ts'
      - 'src/engine/save.ts'
      - 'src/engine/portable-run.ts'
      - 'tests/engine/bounded-json*.test.ts'
      - 'tests/engine/cart1-conformance-vectors.test.ts'
      - 'docs/CART1_CANONICALIZATION.md'
      - 'docs/IMPORT_RESOURCE_LIMITS.md'
      - 'docs/conformance/cart1-v1-vectors.json'
      - '.github/workflows/import-hardening.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  import-hardening:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Record exact candidate
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          mkdir -p import-hardening-receipt
          printf '%s\n' "$CANDIDATE_SHA" > import-hardening-receipt/candidate-sha.txt
          git diff --check
      - name: TypeScript
        run: npm run typecheck | tee import-hardening-receipt/typecheck.log
      - name: Bounded parser, fuzz, save, portable-run, and cart1 contracts
        run: npm test -- tests/engine/bounded-json.test.ts tests/engine/bounded-json-fuzz.test.ts tests/engine/cart1-conformance-vectors.test.ts tests/engine/save.test.ts tests/engine/portable-run.test.ts | tee import-hardening-receipt/focused-tests.log
      - name: Complete Arc regression suite
        run: npm test | tee import-hardening-receipt/vitest.log
      - name: Production build
        run: npm run build | tee import-hardening-receipt/build.log
      - name: Upload hardening receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-canonicalization-hardening-receipt
          path: import-hardening-receipt
          if-no-files-found: warn
          retention-days: 30
