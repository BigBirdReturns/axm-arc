name: Materialize ASOIAF answer credential deployment v2

on:
  pull_request:
    branches:
      - feature/asoiaf-answer-desk-transport-enrollment-v1
    paths:
      - '.github/workflows/materialize-asoiaf-answer-credential-deployment-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-asoiaf-answer-credential-deployment-v2
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.repository == 'BigBirdReturns/axm-arc'
      && (
        github.event_name == 'workflow_dispatch'
        || github.event.pull_request.head.ref == 'feature/asoiaf-answer-credential-deployment-v1'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_SHA: 9ef3e7ab44cf48496b28c24011dff15c3bc53ae0
      BRANCH: feature/asoiaf-answer-credential-deployment-v1
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      ARCHIVE_SHA256: aa693ca82fb7cf4b6b68d0664db70aa61cf030c4affd6c13c0ccc47d548ce239
      ARCHIVE_BYTES: '39631'
      BASE64_CHARACTERS: '52844'
    steps:
      - name: Check out exact construction head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          show-progress: false

      - name: Reconstruct, verify, and commit six ordinary deployment surfaces
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          test "$(git show "$BASE_SHA:package.json" | git hash-object --stdin)" = '9aa51290926ad74dbbca4c6e89f856838d0a08af'

          segments="$RUNNER_TEMP/deployment-segments"
          mkdir -p "$segments"
          cat > "$RUNNER_TEMP/segment-ledger.tsv" <<'EOF'
          00	8daf8f402a57caaaec51490c4e50f8af4ab5a883	9000	3cd2073fe847569d7a0b3a9574a726799f7561cb95b4d1eb06c27d9d6a940ea9
          01	b2d875fdab2fe8b537e58acc8ab90dca41797279	9000	e150d4dd7079a480cbd7c463236c6ce66e29170ac1e9ecd1a4aa321babfe0832
          02	878e0cc24d764f408dc752fc9602bc525bc761f7	9000	02543bddc1fbe98c3b8f36b7147be99d10aee3f9ace3f0e725b627689319063b
          03	d87b49ef824435552af554847ec25fb6483c90b0	9000	7e864ebd8ab074f3334457341011746d811404de77b031561c0174e8ab592984
          04	89cc4a88523c93904d58e9f2af2d68260c2c56d3	9000	8b489a77e42852629c03306028e568ed13d495d25e6dc77524325115b8955749
          05	cbeb2f7dcca82885f7d7180de749069bfd6cc0d9	7844	43b7847e9ea036f4ce45869dd16c9a7829d99b7bc262ac804d2c00566cf93eba
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/segment-ledger.tsv"

          encoded="$RUNNER_TEMP/deployment-candidate.b64"
          : > "$encoded"
          while IFS=$'\t' read -r sequence blob expected_length expected_digest; do
            target="$segments/$sequence.txt"
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq .content \
              | tr -d '\n' \
              | base64 -d \
              > "$target"
            test "$(wc -c < "$target" | tr -d ' ')" = "$expected_length"
            test "$(sha256sum "$target" | awk '{print $1}')" = "$expected_digest"
            cat "$target" >> "$encoded"
          done < "$RUNNER_TEMP/segment-ledger.tsv"
          test "$(wc -c < "$encoded" | tr -d ' ')" = "$BASE64_CHARACTERS"

          archive="$RUNNER_TEMP/asoiaf-answer-credential-deployment-candidate.zip"
          base64 -d "$encoded" > "$archive"
          test "$(wc -c < "$archive" | tr -d ' ')" = "$ARCHIVE_BYTES"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "$ARCHIVE_SHA256"
          unzip -t "$archive"

          cat > "$RUNNER_TEMP/source-ledger.tsv" <<'EOF'
          .github/workflows/asoiaf-answer-credential-deployment.yml	fd41d1b749d1b4356d675a7855fdcefc570b378db86489764cb8d165e0569753	70528e237995605146c7783f68b9ef1e8a6e5183
          docs/ASOIAF_ANSWER_TRANSPORT_CREDENTIAL_DEPLOYMENT.md	ac47160dfb5f34ca913f872ffb4f68d7a3f5d13e59ba925b3fdc8561823da263	1e6b75c710750241dee0ca7b3df01b8b10a0d483
          package.json	01f41b513d7c57727e0606da093f35ac4fb4ea88d93dbc2a47f318792862d71b	933941ddb04cee35ce46ed0288f73d20d3eee0e7
          tests/fixtures/emit-asoiaf-answer-credential-deployment-input.ts	ab685fe8faeb3fa07a3c4882e01123c34b31491f82f8614db9c3df92b221dbde	44078ff735e45bf1f7afdd195625f570041a5352
          tests/narrative/canon/asoiaf-answer-credential-deployment.test.ts	93d5d073ae46e68349ad09747dd3ef1b9dedde9d623e5d1ba75c3a4378a70a09	f75b591cbc668e61a37dca0b13bd6361f68bd999
          tools/asoiaf-answer-credential-deployment.ts	8d06efc8cbff89e9c0f51b23c12ac47a2626c8e1df5b6a70ee2277d112485dbe	56d6f0b833b77d0751e4d990273fdf4bf54aee95
          tools/lib/asoiaf-answer-credential-deployment.ts	f10451e479e326dfb60c95764e2f7dcad44a82deb8813dddacd149fd0f1cdbd4	eaba4409e3e6cb7f03242f9720ef6acf9d1b08d8
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/source-ledger.tsv"
          cut -f1 "$RUNNER_TEMP/source-ledger.tsv" | sort > "$RUNNER_TEMP/archive-expected-paths.txt"
          zipinfo -1 "$archive" | grep -v '/$' | sort > "$RUNNER_TEMP/archive-actual-paths.txt"
          diff -u "$RUNNER_TEMP/archive-expected-paths.txt" "$RUNNER_TEMP/archive-actual-paths.txt"

          unpack="$RUNNER_TEMP/deployment-candidate"
          mkdir -p "$unpack"
          unzip -q "$archive" -d "$unpack"
          while IFS=$'\t' read -r file expected_sha expected_blob; do
            source_file="$unpack/$file"
            test -f "$source_file"
            test "$(sha256sum "$source_file" | awk '{print $1}')" = "$expected_sha"
            test "$(git hash-object "$source_file")" = "$expected_blob"
            if [ "$file" = '.github/workflows/asoiaf-answer-credential-deployment.yml' ]; then
              continue
            fi
            mkdir -p "$(dirname "$file")"
            cp "$source_file" "$file"
          done < "$RUNNER_TEMP/source-ledger.tsv"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          {
            grep -v '^.github/workflows/asoiaf-answer-credential-deployment.yml' "$RUNNER_TEMP/archive-expected-paths.txt"
            printf '%s\n' '.github/workflows/materialize-asoiaf-answer-credential-deployment-v1.yml'
          } | sort > "$RUNNER_TEMP/expected-construction-paths.txt"
          git diff --cached --name-only "$BASE_SHA" -- | sort > "$RUNNER_TEMP/actual-construction-paths.txt"
          diff -u "$RUNNER_TEMP/expected-construction-paths.txt" "$RUNNER_TEMP/actual-construction-paths.txt"
          while IFS=$'\t' read -r file _ expected_blob; do
            if [ "$file" = '.github/workflows/asoiaf-answer-credential-deployment.yml' ]; then
              continue
            fi
            test "$(git hash-object "$file")" = "$expected_blob"
          done < "$RUNNER_TEMP/source-ledger.tsv"
          test "$(git hash-object package.json)" = '933941ddb04cee35ce46ed0288f73d20d3eee0e7'

          git commit -m 'Materialize governed credential deployment sources'
          final_sha="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          git push origin HEAD:"$BRANCH"
          printf '%s\n' "$final_sha"
