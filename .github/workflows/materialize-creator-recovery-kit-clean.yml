name: Materialize creator recovery kit cleanly

# Second push intentionally triggers the one-shot workflow after registration.
on:
  push:
    branches: [release/creator-recovery-kit-clean]
    paths:
      - '.github/workflows/materialize-creator-recovery-kit-clean.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-creator-recovery-kit-clean
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Recover only the creator-kit surface from the stacked branch
        run: |
          set -euo pipefail
          git fetch origin 1d1225ab0c0126f0343572f5a4ac58faf713fe24
          git checkout FETCH_HEAD -- \
            .github/workflows/creator-recovery-kit.yml \
            creator-kit/CREATE_YOUR_FIRST_CARTRIDGE.md \
            creator-kit/ERROR_CATALOG.json \
            creator-kit/GENERIC_ARC_CONTRACT.md \
            creator-kit/README.md \
            creator-kit/manifest.json \
            package.json \
            tests/clean-room/creator-recovery-kit.test.ts \
            tools/build-creator-recovery-kit.ts \
            tools/creator-kit-cli.ts \
            vite.creator-kit.config.ts
          rm .github/workflows/materialize-creator-recovery-kit-clean.yml
          git diff --check
      - run: npm ci --no-audit --no-fund
      - name: Qualify the standalone creator product
        run: |
          set -euo pipefail
          npm run typecheck
          npm test -- tests/clean-room/creator-recovery-kit.test.ts
          npm test
          npm run build:creator-recovery-kit
          node creator-kit/release/bin/rodoh-cartridge.mjs validate --file creator-kit/release/examples/orchard-at-low-tide/orchard-at-low-tide.source.arc.json
          node creator-kit/release/bin/rodoh-cartridge.mjs simulate --file creator-kit/release/examples/orchard-at-low-tide/orchard-at-low-tide.source.arc.json --seeds 16 --max-cycles 80
          if node creator-kit/release/bin/rodoh-cartridge.mjs validate --file creator-kit/release/examples/orchard-at-low-tide/orchard-at-low-tide.invalid.arc.json; then
            echo 'Malformed fixture was accepted.' >&2
            exit 1
          fi
          rm -rf creator-kit/dist creator-kit/release
          git diff --check
      - name: Publish the clean creator-kit candidate
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/creator-recovery-kit.yml creator-kit package.json tests/clean-room/creator-recovery-kit.test.ts tools/build-creator-recovery-kit.ts tools/creator-kit-cli.ts vite.creator-kit.config.ts
          git rm --cached .github/workflows/materialize-creator-recovery-kit-clean.yml 2>/dev/null || true
          git commit -m 'Ship the offline creator recovery kit'
          git push origin HEAD:release/creator-recovery-kit-clean
