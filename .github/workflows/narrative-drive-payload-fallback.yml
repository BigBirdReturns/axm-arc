name: Narrative Drive payload fallback

on:
  push:
    branches:
      - agent/narrative-rails-polish-staging
    paths:
      - '.github/workflows/narrative-drive-payload-fallback.yml'

permissions:
  contents: write

env:
  TARGET_BRANCH: agent/narrative-rails-v0
  DRIVE_ID: 1AXMNarrativePR169Payload20260727
  PAYLOAD_SHA256: e1153e35a93d8cd4262b898edfcab25afe513bb35bf8f69964edd3797821313d

jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve target
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          rm -rf /tmp/target
          git worktree add /tmp/target "origin/$TARGET_BRANCH"
      - name: Download fixed-ID payload when required
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f /tmp/target/src/narrative/succession/qualification-estate.ts ]]; then
            echo 'target already contains polished estate'
            exit 0
          fi
          urls=(
            "https://drive.usercontent.google.com/download?id=$DRIVE_ID&export=download&confirm=t"
            "https://drive.google.com/uc?export=download&id=$DRIVE_ID&confirm=t"
          )
          ok=false
          for url in "${urls[@]}"; do
            if curl --fail --location --retry 2 --max-time 240 "$url" -o /tmp/payload.tgz; then
              actual=$(sha256sum /tmp/payload.tgz | cut -d' ' -f1)
              if [[ "$actual" == "$PAYLOAD_SHA256" ]]; then
                ok=true
                break
              fi
              echo "payload mismatch: $actual"
            fi
          done
          [[ "$ok" == true ]] || exit 1
          rm -rf /tmp/payload
          mkdir -p /tmp/payload
          tar -xzf /tmp/payload.tgz -C /tmp/payload
          cp -a /tmp/payload/overlay/. /tmp/target/
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Qualify and publish
        working-directory: /tmp/target
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm run build
          npm run qualify:narrative-succession
          git config user.name 'AXM Narrative Qualification'
          git config user.email 'noreply@users.noreply.github.com'
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Polish deterministic narrative succession authority'
            git push origin "HEAD:$TARGET_BRANCH"
          fi
