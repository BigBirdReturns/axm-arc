name: Probe exact ASOIAF credential provider host candidate

on:
  pull_request:
    branches:
      - observer/asoiaf-answer-credential-provider-host-probe-v1
    paths:
      - '.observer/provider-host-probe-v1.txt'

permissions:
  contents: read

concurrency:
  group: asoiaf-answer-credential-provider-host-probe-v1-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: 303a564d3c1dc4fff57fba7ef5778d793ffa1eb5

jobs:
  linux-probe:
    if: github.repository == 'BigBirdReturns/axm-arc'
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    steps:
      - name: Check out exact provider-host candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          show-progress: false

      - name: Bind exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify operator registration
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent asoiaf:answer-credential-provider-host -- help > "$RUNNER_TEMP/provider-help.txt"
          grep -q 'ASOIAF device-local credential provider host' "$RUNNER_TEMP/provider-help.txt"
          grep -q 'synthetic-proof' "$RUNNER_TEMP/provider-help.txt"
          grep -q 'windows-transport' "$RUNNER_TEMP/provider-help.txt"
          grep -q 'verify' "$RUNNER_TEMP/provider-help.txt"

      - name: Strict TypeScript
        run: npm run typecheck

      - name: Focused provider and inherited answer-stack qualification
        shell: bash
        run: |
          set -euo pipefail
          npm test -- \
            tests/narrative/canon/asoiaf-answer-credential-provider-host.test.ts \
            tests/narrative/canon/asoiaf-answer-credential-broker.test.ts \
            tests/narrative/canon/asoiaf-answer-credential-deployment.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-transport-enrollment.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-transport-operations.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-transport.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-exchange.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-worker.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-estate.test.ts \
            tests/narrative/canon/asoiaf-answer-work-lease.test.ts \
            tests/narrative/canon/asoiaf-answer-work-order.test.ts \
            tests/narrative/canon/asoiaf-reviewed-answer-packet.test.ts \
            tests/narrative/canon/asoiaf-research-question-dossier.test.ts \
            tests/narrative/canon/asoiaf-external-reconciliation-packets.test.ts

      - name: Exercise complete synthetic provider-host lifecycle
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/provider-host-fixture"
          estate="$RUNNER_TEMP/provider-host-estate"
          mkdir -p "$fixture"
          npx vite-node tests/fixtures/emit-asoiaf-answer-credential-provider-host-input.ts "$fixture" "$estate" > "$RUNNER_TEMP/fixture-emission.json"
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          const fixture = path.join(process.env.RUNNER_TEMP, 'provider-host-fixture');
          const estate = path.join(process.env.RUNNER_TEMP, 'provider-host-estate');
          const read = (name) => JSON.parse(fs.readFileSync(path.join(fixture, name), 'utf8'));
          const expected = read('expected.json');
          const providerVerification = read('provider-verification.json');
          const brokerVerification = read('broker-verification.json');
          const providerStatus = read('provider-status.json');
          assert.equal(providerVerification.ok, true);
          assert.deepEqual(providerVerification.findings, []);
          assert.equal(brokerVerification.ok, true);
          assert.deepEqual(brokerVerification.findings, []);
          assert.deepEqual(providerStatus.counts, {
            profiles: 1,
            invocations: 2,
            results: 2,
            stateEntries: 1,
          });
          assert.deepEqual(expected.providerCounts, providerStatus.counts);
          for (const [first, replay] of [
            ['provider-profile-first.json', 'provider-profile-replay.json'],
            ['possession-provider-prepare-first.json', 'possession-provider-prepare-replay.json'],
            ['possession-provider-result-first.json', 'possession-provider-result-replay.json'],
            ['possession-broker-admission-first.json', 'possession-broker-admission-replay.json'],
            ['transport-provider-prepare-first.json', 'transport-provider-prepare-replay.json'],
            ['transport-provider-result-first.json', 'transport-provider-result-replay.json'],
            ['transport-broker-admission-first.json', 'transport-broker-admission-replay.json'],
          ]) {
            assert.equal(read(first).replayed, false, first);
            assert.equal(read(replay).replayed, true, replay);
          }
          const possession = read('possession-provider-result-first.json');
          const transport = read('transport-provider-result-first.json');
          assert.equal(possession.result.output.kind, 'possession-proof');
          assert.equal(transport.result.output.kind, 'transport-result');
          assert.equal(transport.result.output.statement.rawResponseRetained, false);
          assert.equal(transport.result.privateKeyRetained, false);
          assert.equal(transport.result.rawProviderSelectorRetained, false);
          assert.equal(transport.result.providerSecretRetained, false);
          assert.equal(fs.existsSync(path.join(fixture, 'ephemeral-material')), false);
          assert.equal(fs.existsSync(path.join(estate, '.transaction-lock')), false);
          NODE

      - name: Complete Arc regression
        run: npm test

      - name: Production build
        run: npm run build

  windows-cng-probe:
    if: github.repository == 'BigBirdReturns/axm-arc'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact provider-host candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          show-progress: false

      - name: Bind exact candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:CANDIDATE_SHA) { throw 'wrong provider-host candidate' }
          if (git status --porcelain) { throw 'candidate worktree is not clean' }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Emit and parse permanent Windows CNG adapter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptPath = Join-Path $env:RUNNER_TEMP 'asoiaf-provider-host.ps1'
          npm run --silent asoiaf:answer-credential-provider-host -- powershell --out $scriptPath
          $scriptText = Get-Content -Raw -LiteralPath $scriptPath
          [void][scriptblock]::Create($scriptText)
          if ($scriptText -match 'Export(?:Pkcs8|RSAPrivateKey|ECPrivateKey|Parameters)') {
            throw 'Windows provider adapter contains a key export operation'
          }
          if ($scriptText -notmatch 'Cert:\\CurrentUser\\My\\') {
            throw 'Windows provider adapter does not bind CurrentUser certificate storage'
          }

      - name: Sign with one non-exportable Windows CNG certificate key
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptPath = Join-Path $env:RUNNER_TEMP 'asoiaf-provider-host.ps1'
          $certificate = New-SelfSignedCertificate `
            -Subject 'CN=ASOIAF Provider Host Probe' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -KeyExportPolicy NonExportable `
            -NotAfter (Get-Date).AddHours(2)
          try {
            $message = [Text.Encoding]::UTF8.GetBytes('asoiaf-provider-host-windows-cng-probe')
            $inputPath = Join-Path $env:RUNNER_TEMP 'windows-sign-input.json'
            @{
              command = 'sign'
              thumbprint = $certificate.Thumbprint
              messageBase64 = [Convert]::ToBase64String($message)
            } | ConvertTo-Json | Set-Content -LiteralPath $inputPath -Encoding utf8
            $result = & $scriptPath -InputPath $inputPath | ConvertFrom-Json
            if ($result.algorithm -ne 'rsa-sha256') { throw 'unexpected Windows CNG signature algorithm' }
            $signature = [Convert]::FromBase64String([string]$result.signatureBase64)
            $public = [System.Security.Cryptography.X509Certificates.RSACertificateExtensions]::GetRSAPublicKey($certificate)
            try {
              $verified = $public.VerifyData(
                $message,
                $signature,
                [Security.Cryptography.HashAlgorithmName]::SHA256,
                [Security.Cryptography.RSASignaturePadding]::Pkcs1
              )
            } finally {
              $public.Dispose()
            }
            if (-not $verified) { throw 'Windows CNG signature did not verify' }
            $private = [System.Security.Cryptography.X509Certificates.RSACertificateExtensions]::GetRSAPrivateKey($certificate)
            try {
              $exportBlocked = $false
              try {
                [void]$private.ExportPkcs8PrivateKey()
              } catch {
                $exportBlocked = $true
              }
            } finally {
              $private.Dispose()
            }
            if (-not $exportBlocked) { throw 'qualification key unexpectedly permitted private-key export' }
            if ([string]$result.certificateFingerprint -notmatch '^sha256:[a-f0-9]{64}$') {
              throw 'adapter returned an invalid certificate fingerprint'
            }
          } finally {
            Remove-Item -LiteralPath ("Cert:\CurrentUser\My\" + $certificate.Thumbprint) -Force -ErrorAction SilentlyContinue
          }
