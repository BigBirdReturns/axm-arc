name: Observe exact ASOIAF credential provider host candidate v2

on:
  pull_request:
    branches:
      - observer/asoiaf-answer-credential-provider-host-probe-v2
    paths:
      - '.observer-trigger/provider-host-probe-v2.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observe-asoiaf-answer-credential-provider-host-probe-v2
  cancel-in-progress: true

jobs:
  schedule_probe:
    if: github.repository == 'BigBirdReturns/axm-arc' && github.event.pull_request.head.ref == 'observer/asoiaf-answer-credential-provider-host-probe-v2-trigger'
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm observer scheduling
        shell: bash
        run: |
          set -euo pipefail
          test '${{ github.event.pull_request.base.ref }}' = 'observer/asoiaf-answer-credential-provider-host-probe-v2'
          test '${{ github.event.pull_request.head.ref }}' = 'observer/asoiaf-answer-credential-provider-host-probe-v2-trigger'
          printf '%s\n' 'provider-host observer scheduling is live'
