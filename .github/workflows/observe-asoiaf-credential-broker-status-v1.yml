name: Observe ASOIAF credential broker status v1

on:
  push:
    branches:
      - observer/asoiaf-credential-broker-status-v1
    paths:
      - '.github/workflows/observe-asoiaf-credential-broker-status-v1.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

jobs:
  observe:
    if: github.repository == 'BigBirdReturns/axm-arc' && github.ref_name == 'observer/asoiaf-credential-broker-status-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_PR: '265'
      TARGET_WORKFLOW: ASOIAF answer credential broker
      MARKER: ASOIAF_CREDENTIAL_BROKER_STATUS_PROBE_V1
      OBSERVER_BRANCH: observer/asoiaf-credential-broker-status-v1
    steps:
      - name: Inspect exact PR and workflow state
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pr="$RUNNER_TEMP/pr.json"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$TARGET_PR" > "$pr"
          head_sha="$(jq -r '.head.sha' "$pr")"
          head_ref="$(jq -r '.head.ref' "$pr")"
          base_ref="$(jq -r '.base.ref' "$pr")"
          state="$(jq -r '.state' "$pr")"
          draft="$(jq -r '.draft' "$pr")"
          merged="$(jq -r '.merged' "$pr")"
          files="$RUNNER_TEMP/files.txt"
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$TARGET_PR/files?per_page=100" --jq '.[].filename' | sort > "$files"
          runs="$RUNNER_TEMP/runs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$head_sha&per_page=100" > "$runs"
          permanent="$(jq -c --arg name "$TARGET_WORKFLOW" --arg head "$head_sha" '[.workflow_runs[] | select(.name == $name and .head_sha == $head)] | sort_by(.run_number) | last // {}' "$runs")"
          run_id="$(jq -r '.id // "none"' <<<"$permanent")"
          run_status="$(jq -r '.status // "absent"' <<<"$permanent")"
          conclusion="$(jq -r '.conclusion // "none"' <<<"$permanent")"
          artifact_id=none
          artifact_digest=none
          artifact_size=none
          if [ "$run_id" != none ]; then
            artifacts="$RUNNER_TEMP/artifacts.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > "$artifacts"
            artifact_id="$(jq -r '[.artifacts[] | select(.name == "asoiaf-answer-credential-broker-qualification" and .expired == false)] | sort_by(.created_at) | last | .id // "none"' "$artifacts")"
            artifact_digest="$(jq -r '[.artifacts[] | select(.name == "asoiaf-answer-credential-broker-qualification" and .expired == false)] | sort_by(.created_at) | last | .digest // "none"' "$artifacts")"
            artifact_size="$(jq -r '[.artifacts[] | select(.name == "asoiaf-answer-credential-broker-qualification" and .expired == false)] | sort_by(.created_at) | last | .size_in_bytes // "none"' "$artifacts")"
          fi
          active="$(jq '[.workflow_runs[] | select(.status != "completed")] | length' "$runs")"
          failed="$(jq '[.workflow_runs[] | select(.status == "completed" and (.conclusion | IN("failure","cancelled","timed_out","action_required","stale","startup_failure")))] | length' "$runs")"
          terminal_comment="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$TARGET_PR/comments?per_page=100" --jq '[.[] | select(.body | contains("ASOIAF_CREDENTIAL_BROKER_TERMINAL_RECEIPT_V1"))] | length' | tail -1)"
          body="$RUNNER_TEMP/status.md"
          {
            echo "$MARKER"
            echo
            echo "PR state: \`$state\`; draft: \`$draft\`; merged: \`$merged\`."
            echo "Head: \`$head_ref\` at \`$head_sha\`; base: \`$base_ref\`."
            echo "Changed files: \`$(wc -l < "$files")\`."
            sed 's/^/- `/' "$files" | sed 's/$/`/'
            echo
            echo "Permanent workflow: run \`$run_id\`; status \`$run_status\`; conclusion \`$conclusion\`."
            echo "Exact-head active workflows: \`$active\`; failed workflows: \`$failed\`."
            echo "Artifact: \`$artifact_id\`; digest \`$artifact_digest\`; bytes \`$artifact_size\`."
            echo "Terminal receipt count: \`${terminal_comment:-0}\`."
          } > "$body"
          existing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$TARGET_PR/comments?per_page=100" --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -1)"
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" --raw-field body="$(cat "$body")" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$TARGET_PR/comments" --raw-field body="$(cat "$body")" >/dev/null
          fi

      - name: Retire status observer
        if: always()
        shell: bash
        run: |
          git push origin --delete "$OBSERVER_BRANCH" || true
