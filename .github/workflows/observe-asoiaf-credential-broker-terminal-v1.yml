name: Observe ASOIAF credential broker terminal qualification v1

on:
  push:
    branches:
      - observer/asoiaf-credential-broker-terminal-v1
    paths:
      - '.github/workflows/observe-asoiaf-credential-broker-terminal-v1.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: observe-asoiaf-credential-broker-terminal-v1
  cancel-in-progress: false

jobs:
  observe:
    if: github.repository == 'BigBirdReturns/axm-arc' && github.ref_name == 'observer/asoiaf-credential-broker-terminal-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TARGET_PR: '265'
      TARGET_BRANCH: feature/asoiaf-answer-credential-broker-v1
      TARGET_BASE: feature/asoiaf-answer-credential-deployment-v1
      PERMANENT_WORKFLOW: ASOIAF answer credential broker
      ARTIFACT_NAME: asoiaf-answer-credential-broker-qualification
      RECEIPT_MARKER: ASOIAF_CREDENTIAL_BROKER_TERMINAL_RECEIPT_V1
      OBSERVER_BRANCH: observer/asoiaf-credential-broker-terminal-v1
    steps:
      - name: Check out observer transaction
        uses: actions/checkout@v4
        with:
          ref: observer/asoiaf-credential-broker-terminal-v1
          fetch-depth: 1
          show-progress: false

      - name: Wait for one stable carrier-free qualified head
        id: settle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected="$RUNNER_TEMP/expected-paths.txt"
          cat > "$expected" <<'EOF'
          .github/workflows/asoiaf-answer-credential-broker.yml
          docs/ASOIAF_ANSWER_CREDENTIAL_BROKER.md
          package.json
          tests/fixtures/emit-asoiaf-answer-credential-broker-input.ts
          tests/narrative/canon/asoiaf-answer-credential-broker.test.ts
          tools/asoiaf-answer-credential-broker.ts
          tools/lib/asoiaf-answer-credential-broker.ts
          EOF
          sort -o "$expected" "$expected"

          stable_head=''
          stable_count=0
          for attempt in $(seq 1 240); do
            pr="$RUNNER_TEMP/pr.json"
            gh api "repos/$GITHUB_REPOSITORY/pulls/$TARGET_PR" > "$pr"
            state="$(jq -r '.state' "$pr")"
            draft="$(jq -r '.draft' "$pr")"
            merged="$(jq -r '.merged' "$pr")"
            head_branch="$(jq -r '.head.ref' "$pr")"
            base_branch="$(jq -r '.base.ref' "$pr")"
            head_sha="$(jq -r '.head.sha' "$pr")"
            if [ "$state" != open ] || [ "$draft" != true ] || [ "$merged" != false ] \
              || [ "$head_branch" != "$TARGET_BRANCH" ] || [ "$base_branch" != "$TARGET_BASE" ]; then
              echo "target PR is outside the bounded draft stack" >&2
              exit 1
            fi

            actual="$RUNNER_TEMP/actual-paths.txt"
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$TARGET_PR/files?per_page=100" \
              --jq '.[].filename' | sort > "$actual"
            if ! diff -u "$expected" "$actual" >/dev/null; then
              stable_head=''
              stable_count=0
              sleep 20
              continue
            fi

            runs="$RUNNER_TEMP/runs.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$head_sha&per_page=100" \
              > "$runs"
            permanent_count="$(jq --arg name "$PERMANENT_WORKFLOW" \
              '[.workflow_runs[] | select(.name == $name and .head_sha == $ENV.head and .status == "completed" and .conclusion == "success")] | length' \
              --argjson ENV "$(jq -n --arg head "$head_sha" '{head:$head}')" "$runs" 2>/dev/null || true)"
            if [ -z "$permanent_count" ] || [ "$permanent_count" = 0 ]; then
              permanent_count="$(jq --arg name "$PERMANENT_WORKFLOW" --arg head "$head_sha" \
                '[.workflow_runs[] | select(.name == $name and .head_sha == $head and .status == "completed" and .conclusion == "success")] | length' \
                "$runs")"
            fi
            active_count="$(jq '[.workflow_runs[] | select(.status != "completed")] | length' "$runs")"
            bad_count="$(jq '[.workflow_runs[] | select(.status == "completed" and (.conclusion | IN("failure","cancelled","timed_out","action_required","stale","startup_failure")))] | length' "$runs")"
            if [ "$permanent_count" -lt 1 ] || [ "$active_count" -ne 0 ] || [ "$bad_count" -ne 0 ]; then
              stable_head=''
              stable_count=0
              sleep 20
              continue
            fi

            if [ "$stable_head" = "$head_sha" ]; then
              stable_count=$((stable_count + 1))
            else
              stable_head="$head_sha"
              stable_count=1
            fi
            if [ "$stable_count" -lt 2 ]; then
              sleep 20
              continue
            fi

            run_id="$(jq -r --arg name "$PERMANENT_WORKFLOW" --arg head "$head_sha" \
              '[.workflow_runs[] | select(.name == $name and .head_sha == $head and .status == "completed" and .conclusion == "success")] | sort_by(.run_number) | last | .id' \
              "$runs")"
            test "$run_id" != null
            echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
            cp "$pr" "$RUNNER_TEMP/settled-pr.json"
            cp "$runs" "$RUNNER_TEMP/settled-runs.json"
            exit 0
          done
          echo 'credential broker did not reach a stable terminal head' >&2
          exit 1

      - name: Download and independently verify qualification custody
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.settle.outputs.head_sha }}
          RUN_ID: ${{ steps.settle.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/artifacts.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" > "$metadata"
          artifact_id="$(jq -r --arg name "$ARTIFACT_NAME" \
            '[.artifacts[] | select(.name == $name and .expired == false)] | sort_by(.created_at) | last | .id' \
            "$metadata")"
          artifact_digest="$(jq -r --arg name "$ARTIFACT_NAME" \
            '[.artifacts[] | select(.name == $name and .expired == false)] | sort_by(.created_at) | last | .digest' \
            "$metadata")"
          artifact_size="$(jq -r --arg name "$ARTIFACT_NAME" \
            '[.artifacts[] | select(.name == $name and .expired == false)] | sort_by(.created_at) | last | .size_in_bytes' \
            "$metadata")"
          test "$artifact_id" != null
          test "$artifact_digest" != null

          archive="$RUNNER_TEMP/broker-qualification.zip"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$archive"
          unzip -t "$archive"
          actual_digest="sha256:$(sha256sum "$archive" | awk '{print $1}')"
          test "$actual_digest" = "$artifact_digest"
          unpack="$RUNNER_TEMP/broker-artifact"
          mkdir -p "$unpack"
          unzip -q "$archive" -d "$unpack"
          sums="$(find "$unpack" -type f -name SHA256SUMS -print -quit)"
          test -n "$sums"
          artifact_root="$(dirname "$sums")"
          (
            cd "$artifact_root"
            sha256sum -c SHA256SUMS
          ) | tee "$RUNNER_TEMP/internal-sha256.log"
          candidate="$(find "$artifact_root" -type f -name candidate-sha.txt -print -quit)"
          test -n "$candidate"
          test "$(tr -d '\r\n' < "$candidate")" = "$HEAD_SHA"

          verification="$(find "$artifact_root" -type f -name broker-verification.json -print -quit)"
          test -n "$verification"
          test "$(jq -r '.ok' "$verification")" = true
          test "$(jq '[.findings[] | select(.severity == "error")] | length' "$verification")" = 0

          if find "$artifact_root" -type f \
            \( -iname '*.key' -o -iname '*.crt' -o -iname '*.pem' -o -iname '*.csr' -o -iname '*.p12' -o -iname '*.pfx' \) \
            | grep -q .; then
            echo 'qualification artifact contains forbidden credential material' >&2
            exit 1
          fi
          if grep -RIEq \
            --exclude='full-tests.log' \
            --exclude='focused-tests.log' \
            --exclude='build.log' \
            --exclude='typecheck.log' \
            'BEGIN (RSA |EC |ENCRYPTED )?PRIVATE KEY|BEGIN CERTIFICATE( REQUEST)?|provider(Pin|Password|Token|Secret|Session)[[:space:]]*[":=]|pkcs11:[^[:space:]"'"']+' \
            "$artifact_root"; then
            echo 'qualification artifact contains forbidden credential or provider-secret content' >&2
            exit 1
          fi

          focused_log="$(find "$artifact_root" -type f -name focused-tests.log -print -quit)"
          full_log="$(find "$artifact_root" -type f -name full-tests.log -print -quit)"
          build_log="$(find "$artifact_root" -type f -name build.log -print -quit)"
          test -n "$focused_log"
          test -n "$full_log"
          test -n "$build_log"
          FOCUSED_LOG="$focused_log" FULL_LOG="$full_log" BUILD_LOG="$build_log" python - <<'PY' > "$RUNNER_TEMP/totals.env"
          import os
          import re
          from pathlib import Path

          def totals(target: str) -> tuple[int, int]:
              text = Path(target).read_text(encoding='utf-8', errors='replace')
              files = re.findall(r'Test Files\s+(\d+) passed', text)
              tests = re.findall(r'Tests\s+(\d+) passed', text)
              if not files or not tests:
                  raise SystemExit(f'cannot parse vitest totals from {target}')
              return int(files[-1]), int(tests[-1])

          focused_files, focused_tests = totals(os.environ['FOCUSED_LOG'])
          full_files, full_tests = totals(os.environ['FULL_LOG'])
          build = Path(os.environ['BUILD_LOG']).read_text(encoding='utf-8', errors='replace')
          modules = re.findall(r'(\d+) modules transformed', build)
          if not modules:
              raise SystemExit('cannot parse build module total')
          print(f'focused_files={focused_files}')
          print(f'focused_tests={focused_tests}')
          print(f'full_files={full_files}')
          print(f'full_tests={full_tests}')
          print(f'build_modules={modules[-1]}')
          PY
          cat "$RUNNER_TEMP/totals.env" >> "$GITHUB_OUTPUT"
          file_count="$(find "$artifact_root" -type f | wc -l)"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$artifact_digest" >> "$GITHUB_OUTPUT"
          echo "artifact_size=$artifact_size" >> "$GITHUB_OUTPUT"
          echo "artifact_files=$file_count" >> "$GITHUB_OUTPUT"

      - name: Publish authoritative PR body and terminal receipt
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.settle.outputs.head_sha }}
          RUN_ID: ${{ steps.settle.outputs.run_id }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact_digest }}
          ARTIFACT_SIZE: ${{ steps.artifact.outputs.artifact_size }}
          ARTIFACT_FILES: ${{ steps.artifact.outputs.artifact_files }}
          FOCUSED_FILES: ${{ steps.artifact.outputs.focused_files }}
          FOCUSED_TESTS: ${{ steps.artifact.outputs.focused_tests }}
          FULL_FILES: ${{ steps.artifact.outputs.full_files }}
          FULL_TESTS: ${{ steps.artifact.outputs.full_tests }}
          BUILD_MODULES: ${{ steps.artifact.outputs.build_modules }}
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(jq -r --arg head "$HEAD_SHA" \
            '[.workflow_runs[] | select(.head_sha == $head and .status == "completed" and .conclusion == "success") | "`\(.name)` `\(.id)`"] | unique | sort | join(", ")' \
            "$RUNNER_TEMP/settled-runs.json")"
          body="$RUNNER_TEMP/pr-body.md"
          cat > "$body" <<EOF
          This stacked draft implements the device-local credential-use boundary above terminally qualified credential deployment PR #264. PR #265 remains open, draft, mergeable, unmerged, and carrier-free on exact head \`${HEAD_SHA}\`, based directly on deployment head \`7bdd92d75b4328dc9d5adb47c4e30d39b8f1f359\`. Its final diff contains exactly seven permanent surfaces:

          \`\`\`text
          .github/workflows/asoiaf-answer-credential-broker.yml
          docs/ASOIAF_ANSWER_CREDENTIAL_BROKER.md
          package.json
          tests/fixtures/emit-asoiaf-answer-credential-broker-input.ts
          tests/narrative/canon/asoiaf-answer-credential-broker.test.ts
          tools/asoiaf-answer-credential-broker.ts
          tools/lib/asoiaf-answer-credential-broker.ts
          \`\`\`

          The broker binds one exact active deployment projection to one local policy. Its actors are the deployment verifier, local broker operator, provider or hardware adapter, deployed credential key, device agent, and lower authenticated transport. The broker itself cannot generate, export, approve, issue, install, activate, register, route, schedule, review, reconcile, or render a credential or answer-work transition.

          Policies permit only \`npipe://\`, \`unix://\`, or \`loopback-https://\` endpoints, bounded provider classes and operations, bounded invocation and proof ages, and bounded response metadata. A binding fixes the exact deployment state, plan, activation, device, device-agent verification key, opaque key reference, provider class and handle digest, public key, certificate, issuer, service, principal, role, and validity limit. New invocation creation fails after deployment state changes, so the broker never silently follows rotation or rollback.

          A \`prove-possession\` invocation carries digest-only challenge and context custody. The deployed private key signs the exact canonical invocation, and the broker verifies the public signature against deployment's retained public SPKI. A \`mutual-tls-request\` invocation requires a fresh proof from the same binding and fixes the credential-free HTTPS target, request digest and bytes, lower idempotency-key digest, server certificate and issuer pins, and response ceiling.

          The provider performs the network operation outside the estate. The retained result statement binds the invocation, possession proof, device, provider, digest-only handle, certificate, lower request and response identities, observed server pins, HTTP result, response digest and bytes, provider-receipt digest, and times. The registered device agent signs that complete statement. The broker verifies the signature before retaining the result.

          Policy, binding, invocation, proof, result, and state objects are content-addressed and immutable under exact replay. Every object retains \`authority=none\`, \`graphEffect=none\`, \`canonEffect=none\`, and \`answerEffect=none\`. Certificates, private keys, private-key paths, raw handles, provider PINs, passwords, tokens, sessions, secrets, and raw response bodies are excluded.

          Permanent exact-head workflow run \`${RUN_ID}\` passed operator registration, strict TypeScript, ${FOCUSED_TESTS} focused tests across ${FOCUSED_FILES} files, the complete governed-deployment, possession-proof, device-agent-attestation, and exact-replay lifecycle, the complete Arc regression with ${FULL_TESTS} tests across ${FULL_FILES} files, and the production build with ${BUILD_MODULES} modules transformed.

          Qualification artifact \`${ARTIFACT_ID}\` contains ${ARTIFACT_FILES} files, is ${ARTIFACT_SIZE} bytes, and has ZIP digest \`${ARTIFACT_DIGEST}\`. Independent inspection reproduced that digest, passed ZIP integrity and every internal \`SHA256SUMS\` entry, confirmed candidate head \`${HEAD_SHA}\`, confirmed zero broker-verification errors, and found no certificate, CSR, PEM, private-key, PKCS#12, raw-handle, PIN, password, token, session, or provider-secret material.

          The exact-head successful workflow matrix is: ${matrix}.

          The evidence tier is exact-head implementation, active-deployment binding, cryptographic possession and device-agent attestation qualification, exact replay, complete inherited enrollment and deployment verification, repository regression, production build, companion workflow success, and independently inspected artifact custody. The venue is this draft directly above PR #264. The target is use of an already active non-exportable credential rather than key generation, certificate issuance, deployment, transport registration, scheduling, or ASOIAF truth. The upside is an unbroken custody chain from governed enrollment and active deployment through exact provider use and lower transport references. The downside is provider-specific native execution outside this module, device-agent key custody, explicit rebinding after every deployment-state change, and append-only invocation growth. The failure mode is trusting a provider assertion without cryptographic proof, following a rotated credential silently, retaining secret material, accepting a wrong server pin, replaying changed payloads under one idempotency key, or treating successful credential use as task authority.

          The control question is whether every credential use can identify the exact governed enrollment, active deployment state, device, provider, opaque key reference, local policy, binding, idempotent invocation, credential-key proof, device-agent attestation, and lower transport request and response while no broker object acquires private-key, enrollment, deployment, transport-registration, task, research, review, graph, canon, or answer authority.
          EOF
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$TARGET_PR" \
            --raw-field body="$(cat "$body")" >/dev/null

          existing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$TARGET_PR/comments?per_page=100" \
            --jq ".[] | select(.body | contains(\"$RECEIPT_MARKER\")) | .id" | head -1)"
          receipt="$RUNNER_TEMP/terminal-receipt.md"
          cat > "$receipt" <<EOF
          ${RECEIPT_MARKER}

          Credential broker qualification is terminal on exact carrier-free head \`${HEAD_SHA}\`. Permanent run \`${RUN_ID}\` passed strict TypeScript, ${FOCUSED_TESTS} focused tests across ${FOCUSED_FILES} files, ${FULL_TESTS} complete regression tests across ${FULL_FILES} files, and a ${BUILD_MODULES}-module production build. Artifact \`${ARTIFACT_ID}\` is ${ARTIFACT_SIZE} bytes with ZIP digest \`${ARTIFACT_DIGEST}\`; independent verification passed ZIP integrity, all internal hashes, candidate binding, broker reconstruction, and the secret-material scan.
          EOF
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" \
              --raw-field body="$(cat "$receipt")" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$TARGET_PR/comments" \
              --raw-field body="$(cat "$receipt")" >/dev/null
          fi

      - name: Retire observer branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete "$OBSERVER_BRANCH"

      - name: Post bounded observer failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment "$TARGET_PR" --repo "$GITHUB_REPOSITORY" --body \
            "Credential-broker terminal observer failed in run \`${GITHUB_RUN_ID}\`. It issued no terminal qualification receipt and did not modify the implementation branch."
