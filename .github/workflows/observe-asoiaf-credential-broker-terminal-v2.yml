name: Observe terminal ASOIAF credential broker qualification v2

on:
  push:
    branches:
      - observer/asoiaf-credential-broker-terminal-v2
    paths:
      - '.github/workflows/observe-asoiaf-credential-broker-terminal-v2.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: observe-asoiaf-credential-broker-terminal-v2
  cancel-in-progress: false

jobs:
  observe:
    if: github.repository == 'BigBirdReturns/axm-arc' && github.ref_name == 'observer/asoiaf-credential-broker-terminal-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      TARGET_PR: '265'
      TARGET_BRANCH: feature/asoiaf-answer-credential-broker-v1
      TARGET_BASE: feature/asoiaf-answer-credential-deployment-v1
      TARGET_SHA: d7b6c36a2c518d2ea3dfdbf02a8a69c95175e891
      TARGET_WORKFLOW: asoiaf-answer-credential-broker.yml
      TARGET_WORKFLOW_NAME: ASOIAF answer credential broker
      TARGET_ARTIFACT: asoiaf-answer-credential-broker-qualification
      TERMINAL_MARKER: ASOIAF_CREDENTIAL_BROKER_TERMINAL_RECEIPT_V1
    steps:
      - name: Check out observer transaction
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          show-progress: false

      - name: Verify exact carrier-free target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/broker-observer"
          mkdir -p "$root"

          gh api "repos/$GITHUB_REPOSITORY/pulls/$TARGET_PR" > "$root/pr.json"
          test "$(jq -r .state "$root/pr.json")" = open
          test "$(jq -r .draft "$root/pr.json")" = true
          test "$(jq -r .merged "$root/pr.json")" = false
          test "$(jq -r .head.ref "$root/pr.json")" = "$TARGET_BRANCH"
          test "$(jq -r .head.sha "$root/pr.json")" = "$TARGET_SHA"
          test "$(jq -r .base.ref "$root/pr.json")" = "$TARGET_BASE"

          page=1
          : > "$root/files.ndjson"
          while :; do
            gh api "repos/$GITHUB_REPOSITORY/pulls/$TARGET_PR/files?per_page=100&page=$page" > "$root/files-$page.json"
            count="$(jq 'length' "$root/files-$page.json")"
            jq -c '.[]' "$root/files-$page.json" >> "$root/files.ndjson"
            [ "$count" -lt 100 ] && break
            page=$((page + 1))
          done
          jq -s 'map(.filename) | sort' "$root/files.ndjson" > "$root/actual-paths.json"
          cat > "$root/expected-paths.json" <<'JSON'
          [
            ".github/workflows/asoiaf-answer-credential-broker.yml",
            "docs/ASOIAF_ANSWER_CREDENTIAL_BROKER.md",
            "package.json",
            "tests/fixtures/emit-asoiaf-answer-credential-broker-input.ts",
            "tests/narrative/canon/asoiaf-answer-credential-broker.test.ts",
            "tools/asoiaf-answer-credential-broker.ts",
            "tools/lib/asoiaf-answer-credential-broker.ts"
          ]
          JSON
          jq -S . "$root/expected-paths.json" > "$root/expected-paths.sorted.json"
          jq -S . "$root/actual-paths.json" > "$root/actual-paths.sorted.json"
          diff -u "$root/expected-paths.sorted.json" "$root/actual-paths.sorted.json"
          if jq -e '.[] | select(test("repair|diagnos|observer|payload|materializ|bootstrap|carrier"; "i"))' "$root/actual-paths.json" >/dev/null; then
            echo 'temporary carrier remains in target diff' >&2
            exit 1
          fi

      - name: Obtain one successful exact-head permanent workflow
        id: permanent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/broker-observer"
          attempt=0
          selected=''
          while [ "$attempt" -lt 4 ]; do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW/runs?per_page=100" > "$root/workflow-runs.json"
            selected="$(jq -r --arg sha "$TARGET_SHA" '
              [.workflow_runs[]
                | select(.head_sha == $sha and .status == "completed" and .conclusion == "success")]
              | sort_by(.run_number, .run_attempt)
              | last
              | .id // empty
            ' "$root/workflow-runs.json")"
            if [ -n "$selected" ]; then
              break
            fi

            active="$(jq -r --arg sha "$TARGET_SHA" '
              [.workflow_runs[] | select(.head_sha == $sha and (.status == "queued" or .status == "in_progress"))]
              | sort_by(.run_number, .run_attempt)
              | last
              | .id // empty
            ' "$root/workflow-runs.json")"
            if [ -z "$active" ]; then
              gh workflow run "$TARGET_WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "$TARGET_BRANCH"
            fi

            for _ in $(seq 1 60); do
              sleep 10
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW/runs?per_page=100" > "$root/workflow-runs.json"
              selected="$(jq -r --arg sha "$TARGET_SHA" '
                [.workflow_runs[]
                  | select(.head_sha == $sha and .status == "completed" and .conclusion == "success")]
                | sort_by(.run_number, .run_attempt)
                | last
                | .id // empty
              ' "$root/workflow-runs.json")"
              [ -n "$selected" ] && break 2
              active="$(jq -r --arg sha "$TARGET_SHA" '
                [.workflow_runs[] | select(.head_sha == $sha and (.status == "queued" or .status == "in_progress"))]
                | length
              ' "$root/workflow-runs.json")"
              [ "$active" -gt 0 ] && continue
              break
            done

            failed="$(jq -r --arg sha "$TARGET_SHA" '
              [.workflow_runs[]
                | select(.head_sha == $sha and .status == "completed" and .conclusion != "success")]
              | sort_by(.run_number, .run_attempt)
              | last
              | .id // empty
            ' "$root/workflow-runs.json")"
            if [ -n "$failed" ]; then
              set +e
              gh run view "$failed" --repo "$GITHUB_REPOSITORY" --log > "$root/failed-$failed.log" 2>&1
              set -e
              if grep -Eqi 'Service Unavailable|Failed to resolve action download info|The hosted runner|internal server error' "$root/failed-$failed.log"; then
                gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$failed/rerun-failed-jobs" || true
              else
                tail -240 "$root/failed-$failed.log" >&2
                exit 1
              fi
            fi
            attempt=$((attempt + 1))
          done
          test -n "$selected"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$selected" > "$root/permanent-run.json"
          test "$(jq -r .head_sha "$root/permanent-run.json")" = "$TARGET_SHA"
          test "$(jq -r .conclusion "$root/permanent-run.json")" = success
          echo "run_id=$selected" >> "$GITHUB_OUTPUT"

      - name: Wait for a stable successful exact-head companion matrix
        id: matrix
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/broker-observer"
          stable=0
          while [ "$stable" -lt 3 ]; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=$TARGET_BRANCH&per_page=100" > "$root/all-runs.json"
            jq --arg sha "$TARGET_SHA" '
              [.workflow_runs[] | select(.head_sha == $sha)]
              | sort_by(.name, .run_number, .run_attempt)
              | group_by(.name)
              | map(last)
            ' "$root/all-runs.json" > "$root/latest-runs.json"
            test "$(jq 'length' "$root/latest-runs.json")" -ge 10
            active="$(jq '[.[] | select(.status != "completed")] | length' "$root/latest-runs.json")"
            if [ "$active" -gt 0 ]; then
              stable=0
              sleep 15
              continue
            fi
            failed="$(jq '[.[] | select(.conclusion != "success")] | length' "$root/latest-runs.json")"
            if [ "$failed" -gt 0 ]; then
              jq -r '.[] | select(.conclusion != "success") | [.name,.id,.conclusion] | @tsv' "$root/latest-runs.json" >&2
              exit 1
            fi
            stable=$((stable + 1))
            [ "$stable" -lt 3 ] && sleep 10
          done
          jq -r '.[] | [.name,.id,.conclusion] | @tsv' "$root/latest-runs.json" > "$root/companion-matrix.tsv"
          echo "workflow_count=$(jq 'length' "$root/latest-runs.json")" >> "$GITHUB_OUTPUT"

      - name: Independently verify the exact qualification artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.permanent.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/broker-observer"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" > "$root/artifacts.json"
          jq -c --arg name "$TARGET_ARTIFACT" '
            [.artifacts[] | select(.name == $name and .expired == false)]
            | sort_by(.created_at)
            | last // empty
          ' "$root/artifacts.json" > "$root/artifact.json"
          test -s "$root/artifact.json"
          artifact_id="$(jq -r .id "$root/artifact.json")"
          artifact_digest="$(jq -r .digest "$root/artifact.json")"
          artifact_bytes="$(jq -r .size_in_bytes "$root/artifact.json")"
          test -n "$artifact_id"
          test "$artifact_digest" != null

          zip="$root/qualification.zip"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            --output "$zip"
          calculated="sha256:$(sha256sum "$zip" | awk '{print $1}')"
          test "$calculated" = "$artifact_digest"
          unzip -t "$zip"
          unpack="$root/unpacked"
          mkdir -p "$unpack"
          unzip -q "$zip" -d "$unpack"
          sums="$(find "$unpack" -type f -name SHA256SUMS -print -quit)"
          test -n "$sums"
          artifact_root="$(dirname "$sums")"
          (
            cd "$artifact_root"
            sha256sum -c SHA256SUMS
          ) > "$root/internal-sha256.log"
          candidate="$(find "$artifact_root" -type f -name candidate-sha.txt -print -quit)"
          test -n "$candidate"
          test "$(tr -d '\r\n' < "$candidate")" = "$TARGET_SHA"

          if find "$artifact_root" -type f \
            \( -iname '*.key' -o -iname '*.crt' -o -iname '*.pem' -o -iname '*.csr' -o -iname '*.p12' -o -iname '*.pfx' \) \
            | grep -q .; then
            echo 'qualification artifact contains a forbidden credential path' >&2
            exit 1
          fi
          if grep -RIEq \
            --exclude='full-tests.log' \
            --exclude='focused-tests.log' \
            --exclude='build.log' \
            --exclude='typecheck.log' \
            'BEGIN (RSA |EC |ENCRYPTED )?PRIVATE KEY|BEGIN CERTIFICATE( REQUEST)?|provider(Pin|Password|Token|Secret|Session)[[:space:]]*[":=]|pkcs11:[^[:space:]"'"']+' \
            "$artifact_root"; then
            echo 'qualification artifact contains forbidden credential material' >&2
            exit 1
          fi

          ARTIFACT_ROOT="$artifact_root" python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          root = Path(os.environ['ARTIFACT_ROOT'])
          ansi = re.compile(r'\x1b\[[0-9;]*m')

          def text(name: str) -> str:
              candidates = list(root.rglob(name))
              if not candidates:
                  raise SystemExit(f'missing artifact file {name}')
              return ansi.sub('', candidates[0].read_text(encoding='utf-8', errors='replace'))

          focused = text('focused-tests.log')
          full = text('full-tests.log')
          build = text('build.log')
          focused_tests = [int(value) for value in re.findall(r'Tests\s+(\d+) passed', focused)]
          focused_files = [int(value) for value in re.findall(r'Test Files\s+(\d+) passed', focused)]
          full_tests = [int(value) for value in re.findall(r'Tests\s+(\d+) passed', full)]
          full_files = [int(value) for value in re.findall(r'Test Files\s+(\d+) passed', full)]
          modules = [int(value) for value in re.findall(r'(\d+) modules transformed', build)]
          if not focused_tests or not focused_files or not full_tests or not full_files or not modules:
              raise SystemExit('qualification totals are not parseable')
          if focused_tests[-1] < 100 or focused_files[-1] != 13:
              raise SystemExit(f'unexpected focused totals: {focused_files[-1]} files, {focused_tests[-1]} tests')
          if full_tests[-1] < 1080 or full_files[-1] < 133:
              raise SystemExit(f'unexpected regression totals: {full_files[-1]} files, {full_tests[-1]} tests')
          if modules[-1] != 189:
              raise SystemExit(f'unexpected module transform count: {modules[-1]}')

          verification_files = list(root.rglob('broker-verification.json'))
          if len(verification_files) != 1:
              raise SystemExit('broker verification receipt is absent or duplicated')
          verification = json.loads(verification_files[0].read_text(encoding='utf-8'))
          if verification.get('ok') is not True or verification.get('findings') != []:
              raise SystemExit('broker verification is not clean')

          status_files = list(root.rglob('broker-status.json'))
          if len(status_files) != 1:
              raise SystemExit('broker status receipt is absent or duplicated')
          status = json.loads(status_files[0].read_text(encoding='utf-8'))
          expected_counts = {
              'policies': 1,
              'bindings': 1,
              'invocations': 2,
              'proofs': 1,
              'transportResults': 1,
              'stateEntries': 1,
          }
          if status.get('counts') != expected_counts:
              raise SystemExit(f'unexpected broker counts: {status.get("counts")}')

          summary = {
              'focusedFiles': focused_files[-1],
              'focusedTests': focused_tests[-1],
              'regressionFiles': full_files[-1],
              'regressionTests': full_tests[-1],
              'modulesTransformed': modules[-1],
              'counts': expected_counts,
          }
          Path(os.environ['RUNNER_TEMP']).joinpath('broker-observer', 'qualification-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$artifact_digest" >> "$GITHUB_OUTPUT"
          echo "artifact_bytes=$artifact_bytes" >> "$GITHUB_OUTPUT"

      - name: Publish authoritative PR body and terminal receipt
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.permanent.outputs.run_id }}
          WORKFLOW_COUNT: ${{ steps.matrix.outputs.workflow_count }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact_digest }}
          ARTIFACT_BYTES: ${{ steps.artifact.outputs.artifact_bytes }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/broker-observer"
          focused_files="$(jq -r .focusedFiles "$root/qualification-summary.json")"
          focused_tests="$(jq -r .focusedTests "$root/qualification-summary.json")"
          regression_files="$(jq -r .regressionFiles "$root/qualification-summary.json")"
          regression_tests="$(jq -r .regressionTests "$root/qualification-summary.json")"
          modules="$(jq -r .modulesTransformed "$root/qualification-summary.json")"
          body="$root/pr-body.md"
          cat > "$body" <<EOF
          This stacked draft is terminally qualified on exact carrier-free head \`${TARGET_SHA}\`, directly above credential-deployment head \`7bdd92d75b4328dc9d5adb47c4e30d39b8f1f359\`. It remains open, draft, mergeable, unmerged, and limited to exactly seven permanent surfaces:

          \`\`\`text
          .github/workflows/asoiaf-answer-credential-broker.yml
          docs/ASOIAF_ANSWER_CREDENTIAL_BROKER.md
          package.json
          tests/fixtures/emit-asoiaf-answer-credential-broker-input.ts
          tests/narrative/canon/asoiaf-answer-credential-broker.test.ts
          tools/asoiaf-answer-credential-broker.ts
          tools/lib/asoiaf-answer-credential-broker.ts
          \`\`\`

          No repair, diagnostic, observer, payload, materializer, certificate, CSR, private key, PKCS#12 container, raw provider handle, provider PIN, password, token, session, generated estate, or workflow-run receipt remains in the final diff.

          The object is the device-local credential-use boundary above governed enrollment and device-bound deployment. Enrollment determines which leaf may exist. Deployment determines which device and non-exportable provider key are active. The broker binds one exact deployment projection to a local policy and permits an external provider to prove possession or perform one pinned mutual-TLS request without exporting the credential or allowing the broker to select a different deployment.

          A broker policy fixes one device, service, local-only endpoint, permitted provider classes and operations, invocation lifetime, possession-proof age, response ceiling, and device-agent verification key. Endpoints are restricted to \`npipe://\`, \`unix://\`, or \`loopback-https://\`. A deployment binding re-runs the qualified deployment verifier and fixes the exact state, plan, activation, device, agent key, opaque key reference, provider class, digest-only handle, public key, certificate and issuer fingerprints, service, principal, actor role, and validity limit. Rotation or rollback requires a new binding rather than silently retargeting an existing invocation.

          The broker supports \`prove-possession\` and \`mutual-tls-request\`. A possession invocation carries digest-only challenge and context custody. The deployed credential signs the exact canonical invocation, and the broker verifies the public signature against the deployment SPKI. A mutual-TLS invocation requires a fresh proof from the same binding and fixes the credential-free HTTPS target, request digest and byte count, lower idempotency-key digest, expected server certificate and issuer fingerprints, and response ceiling.

          The provider performs network use outside this module. The retained transport statement binds the possession proof, deployment binding, device, provider, handle digest, certificate, target, lower request and response identities, observed server pins, HTTP result, response digest and byte count, provider-receipt digest, and operation times. The registered device agent signs that complete statement. The broker verifies the signature before retaining the result. Neither a provider success message nor a generic agent assertion can replace the credential-key proof and device-agent attestation.

          Policy, binding, invocation, proof, transport result, and state objects are content-addressed and immutable under exact replay. Idempotency keys are retained only as SHA-256 digests. Reusing one key with changed policy, binding, operation, payload, schedule, or operator custody is refused. The estate structurally retains \`certificateRetained=false\`, \`privateKeyRetained=false\`, \`privateKeyPathRetained=false\`, \`rawProviderHandleRetained=false\`, \`providerSecretRetained=false\`, \`rawResponseRetained=false\`, \`authority=none\`, \`graphEffect=none\`, \`canonEffect=none\`, and \`answerEffect=none\`.

          Permanent exact-head workflow run \`${RUN_ID}\` passed operator registration, strict TypeScript, ${focused_tests} focused tests across ${focused_files} files, the complete governed deployment, binding, possession, mutual-TLS attestation, and exact-replay lifecycle, the complete Arc regression with ${regression_tests} tests across ${regression_files} files, and the production build with ${modules} modules transformed. Final broker reconstruction proved one policy, one exact deployment binding, two invocations, one possession proof, one transport result, and one deterministic state entry, with zero verifier findings.

          Qualification artifact \`${ARTIFACT_ID}\` is ${ARTIFACT_BYTES} bytes with ZIP digest \`${ARTIFACT_DIGEST}\`. Independent download reproduced that digest, passed ZIP integrity, validated every internal \`SHA256SUMS\` entry, confirmed candidate head \`${TARGET_SHA}\`, confirmed the focused, full-regression, and build totals, and found no certificate, CSR, private-key, PKCS#12, raw-handle, PIN, password, token, session, provider-secret, or raw-response material. The stable exact-head companion matrix contained ${WORKFLOW_COUNT} successful latest workflow results and no failed or active latest result.

          The evidence tier is exact-head implementation, active-deployment binding qualification, credential-key possession proof, device-agent transport attestation, exact replay, complete repository regression, production build, stable companion success, and independently inspected artifact custody. The venue is this draft directly above terminally qualified deployment PR #264. The target is use of an already governed and active non-exportable credential rather than key generation, issuance, deployment, transport registration, scheduling, or ASOIAF truth. The upside is an unbroken chain from governed issuance and deployment through exact provider use and lower transport identities. The downside is provider-specific execution outside this module, device-agent key custody, explicit rebinding after deployment changes, and append-only invocation growth. The failure mode is trusting a provider assertion without cryptographic proof, following a rotated credential silently, retaining secret material, accepting the wrong server pin, replaying changed payloads under one idempotency key, or treating successful credential use as task authority.

          The control question is whether every credential use can identify the exact governed enrollment, active deployment state, device, provider, opaque key reference, local policy, binding, idempotent invocation, credential-key proof, device-agent attestation, and lower transport request and response while no broker object acquires private-key, enrollment, deployment, transport-registration, task, research, review, graph, canon, or answer authority.
          EOF
          sed -i 's/^          //' "$body"
          gh pr edit "$TARGET_PR" --repo "$GITHUB_REPOSITORY" --body-file "$body"

          comments="$root/comments.json"
          gh api "repos/$GITHUB_REPOSITORY/issues/$TARGET_PR/comments?per_page=100" > "$comments"
          if ! jq -e --arg marker "$TERMINAL_MARKER" '.[] | select(.body | contains($marker))' "$comments" >/dev/null; then
            receipt="$root/terminal-receipt.md"
            cat > "$receipt" <<EOF
          ${TERMINAL_MARKER}

          Credential broker qualification is terminal on exact carrier-free head \`${TARGET_SHA}\`. Permanent run \`${RUN_ID}\` passed ${focused_tests} focused tests across ${focused_files} files, ${regression_tests} complete regression tests across ${regression_files} files, and a ${modules}-module production build. Artifact \`${ARTIFACT_ID}\` is ${ARTIFACT_BYTES} bytes with independently reproduced ZIP digest \`${ARTIFACT_DIGEST}\`; ZIP integrity, internal \`SHA256SUMS\`, candidate-head binding, broker reconstruction, and the credential-secret scan all passed. The exact-head latest companion matrix contains ${WORKFLOW_COUNT} successful workflows and no active or failed latest result.

          The broker retained one policy, one exact deployment binding, two invocations, one verified credential possession proof, one device-agent-attested transport result, and one deterministic state entry. It retained no certificate, private key, raw provider handle, provider secret, or raw response and acquired no transport-registration, task, graph, canon, review, or answer authority.
          EOF
            sed -i 's/^          //' "$receipt"
            gh pr comment "$TARGET_PR" --repo "$GITHUB_REPOSITORY" --body-file "$receipt"
          fi

      - name: Retire observer branches
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            observer/asoiaf-credential-broker-status-v1 \
            observer/asoiaf-credential-broker-terminal-v1 \
            observer/asoiaf-credential-broker-terminal-v2; do
            encoded="${branch//\//%2F}"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$encoded" || true
          done

      - name: Publish bounded observer failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr comment "$TARGET_PR" --repo "$GITHUB_REPOSITORY" --body \
            "Credential-broker terminal observer v2 failed in workflow run \`${GITHUB_RUN_ID}\`. The target branch remains open and draft, and no terminal qualification claim is made by this observer."
