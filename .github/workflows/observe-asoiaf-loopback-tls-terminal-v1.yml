name: Observe exact ASOIAF loopback TLS qualification v1

on:
  push:
    branches:
      - observer/asoiaf-loopback-tls-terminal-v1
    paths:
      - '.github/workflows/observe-asoiaf-loopback-tls-terminal-v1.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: observe-asoiaf-loopback-tls-terminal-v1
  cancel-in-progress: false

jobs:
  observe:
    if: github.repository == 'BigBirdReturns/axm-arc'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TARGET_SHA: 0534e419b420fc0c26604bedd650db8f0dbf691e
      TARGET_BRANCH: feature/asoiaf-answer-credential-broker-loopback-tls-v1
      TARGET_BASE: feature/asoiaf-answer-credential-broker-service-v1
      TARGET_WORKFLOW: asoiaf-answer-credential-broker-loopback-tls.yml
      TARGET_PR: '282'
      TERMINAL_MARKER: ASOIAF_LOOPBACK_TLS_TERMINAL_RECEIPT_V1
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out observer transaction
        uses: actions/checkout@v4
        with:
          ref: observer/asoiaf-loopback-tls-terminal-v1
          fetch-depth: 1
          show-progress: false

      - name: Resolve exact permanent push run
        id: run
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/observer"
          mkdir -p "$root"
          run_id=''
          for _ in $(seq 1 180); do
            gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW/runs" \
              -f branch="$TARGET_BRANCH" \
              -f event=push \
              -f per_page=100 \
              > "$root/runs.json"
            jq -c --arg sha "$TARGET_SHA" '
              .workflow_runs
              | map(select(.head_sha == $sha and .event == "push"))
              | sort_by(.run_number)
              | last // empty
            ' "$root/runs.json" > "$root/run.json"
            if [ -s "$root/run.json" ]; then
              run_id="$(jq -r '.id' "$root/run.json")"
              status="$(jq -r '.status' "$root/run.json")"
              if [ "$status" = 'completed' ]; then
                break
              fi
            fi
            sleep 20
          done
          test -n "$run_id"
          test "$(jq -r '.head_sha' "$root/run.json")" = "$TARGET_SHA"
          test "$(jq -r '.status' "$root/run.json")" = 'completed'
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$(jq -r '.html_url' "$root/run.json")" >> "$GITHUB_OUTPUT"
          echo "conclusion=$(jq -r '.conclusion' "$root/run.json")" >> "$GITHUB_OUTPUT"

      - name: Capture exact jobs and failure evidence
        id: jobs
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/observer"
          run_id='${{ steps.run.outputs.run_id }}'
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
            > "$root/jobs.json"
          jq -r '.jobs[] | [.name, .status, .conclusion, (.id|tostring)] | @tsv' \
            "$root/jobs.json" > "$root/jobs.tsv"
          cat "$root/jobs.tsv"
          if [ '${{ steps.run.outputs.conclusion }}' != 'success' ]; then
            {
              echo 'TEMP_LOOPBACK_TLS_TERMINAL_OBSERVER_V1'
              echo
              echo "Exact target \`$TARGET_SHA\` reached terminal workflow run \`${run_id}\` with conclusion \`${{ steps.run.outputs.conclusion }}\`."
              echo
              echo 'Jobs:'
              echo '```text'
              cat "$root/jobs.tsv"
              echo '```'
            } > "$root/failure-comment.md"
            gh pr comment "$TARGET_PR" --repo "$GITHUB_REPOSITORY" \
              --body-file "$root/failure-comment.md"
            exit 1
          fi
          for name in linux-qualify windows-qualify combine; do
            test "$(jq -r --arg name "$name" '.jobs[] | select(.name == $name) | .conclusion' "$root/jobs.json")" = 'success'
          done

      - name: Verify final pull-request topology
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/observer"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$TARGET_PR" > "$root/pr.json"
          jq -e \
            --arg sha "$TARGET_SHA" \
            --arg base "$TARGET_BASE" \
            '.state == "open"
             and .draft == true
             and .merged == false
             and .head.sha == $sha
             and .base.ref == $base' \
            "$root/pr.json" >/dev/null
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$TARGET_PR/files?per_page=100" \
            --jq '.[].filename' | sort > "$root/actual-files.txt"
          cat > "$root/expected-files.txt" <<'FILES'
          .github/workflows/asoiaf-answer-credential-broker-loopback-tls.yml
          docs/ASOIAF_ANSWER_CREDENTIAL_BROKER_LOOPBACK_TLS.md
          package.json
          tests/fixtures/emit-asoiaf-answer-credential-broker-loopback-tls-input.ts
          tests/narrative/canon/asoiaf-answer-credential-broker-loopback-tls.test.ts
          tools/asoiaf-answer-credential-broker-loopback-tls.ts
          tools/lib/asoiaf-answer-credential-broker-loopback-tls.ts
          FILES
          diff -u "$root/expected-files.txt" "$root/actual-files.txt"

      - name: Download and independently verify all platform artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/observer"
          run_id='${{ steps.run.outputs.run_id }}'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" \
            > "$root/artifacts.json"
          for name in \
            asoiaf-answer-credential-broker-loopback-tls-linux \
            asoiaf-answer-credential-broker-loopback-tls-windows \
            asoiaf-answer-credential-broker-loopback-tls-qualification; do
            jq -e --arg name "$name" '
              [.artifacts[] | select(.name == $name and .expired == false)] | length == 1
            ' "$root/artifacts.json" >/dev/null
            id="$(jq -r --arg name "$name" '.artifacts[] | select(.name == $name) | .id' "$root/artifacts.json")"
            expected_digest="$(jq -r --arg name "$name" '.artifacts[] | select(.name == $name) | .digest' "$root/artifacts.json")"
            curl --fail --location --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" \
              -o "$root/$name.zip"
            actual_digest="sha256:$(sha256sum "$root/$name.zip" | awk '{print $1}')"
            test "$actual_digest" = "$expected_digest"
            unzip -t "$root/$name.zip" >/dev/null
            mkdir -p "$root/$name"
            unzip -q "$root/$name.zip" -d "$root/$name"
          done

          combined='asoiaf-answer-credential-broker-loopback-tls-qualification'
          combined_id="$(jq -r --arg name "$combined" '.artifacts[] | select(.name == $name) | .id' "$root/artifacts.json")"
          combined_digest="$(jq -r --arg name "$combined" '.artifacts[] | select(.name == $name) | .digest' "$root/artifacts.json")"
          combined_size="$(jq -r --arg name "$combined" '.artifacts[] | select(.name == $name) | .size_in_bytes' "$root/artifacts.json")"
          linux_id="$(jq -r '.artifacts[] | select(.name == "asoiaf-answer-credential-broker-loopback-tls-linux") | .id' "$root/artifacts.json")"
          linux_digest="$(jq -r '.artifacts[] | select(.name == "asoiaf-answer-credential-broker-loopback-tls-linux") | .digest' "$root/artifacts.json")"
          linux_size="$(jq -r '.artifacts[] | select(.name == "asoiaf-answer-credential-broker-loopback-tls-linux") | .size_in_bytes' "$root/artifacts.json")"
          windows_id="$(jq -r '.artifacts[] | select(.name == "asoiaf-answer-credential-broker-loopback-tls-windows") | .id' "$root/artifacts.json")"
          windows_digest="$(jq -r '.artifacts[] | select(.name == "asoiaf-answer-credential-broker-loopback-tls-windows") | .digest' "$root/artifacts.json")"
          windows_size="$(jq -r '.artifacts[] | select(.name == "asoiaf-answer-credential-broker-loopback-tls-windows") | .size_in_bytes' "$root/artifacts.json")"
          echo "combined_id=$combined_id" >> "$GITHUB_OUTPUT"
          echo "combined_digest=$combined_digest" >> "$GITHUB_OUTPUT"
          echo "combined_size=$combined_size" >> "$GITHUB_OUTPUT"
          echo "linux_id=$linux_id" >> "$GITHUB_OUTPUT"
          echo "linux_digest=$linux_digest" >> "$GITHUB_OUTPUT"
          echo "linux_size=$linux_size" >> "$GITHUB_OUTPUT"
          echo "windows_id=$windows_id" >> "$GITHUB_OUTPUT"
          echo "windows_digest=$windows_digest" >> "$GITHUB_OUTPUT"
          echo "windows_size=$windows_size" >> "$GITHUB_OUTPUT"

      - name: Verify combined internal custody and qualification totals
        id: ledger
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/observer"
          combined="$root/asoiaf-answer-credential-broker-loopback-tls-qualification"
          sums="$(find "$combined" -type f -name SHA256SUMS -print -quit)"
          candidate="$(find "$combined" -type f -name candidate-sha.txt -print -quit)"
          test -n "$sums"
          test -n "$candidate"
          artifact_root="$(dirname "$sums")"
          test "$(tr -d '\r\n' < "$candidate")" = "$TARGET_SHA"
          (cd "$artifact_root" && sha256sum -c SHA256SUMS) \
            | tee "$root/internal-sha256-verification.log"

          focused="$(find "$artifact_root" -type f -name focused-tests.log -print -quit)"
          full="$(find "$artifact_root" -type f -name full-tests.log -print -quit)"
          build="$(find "$artifact_root" -type f -name build.log -print -quit)"
          expected="$(find "$artifact_root" -type f -name expected.json -print -quit)"
          verification="$(find "$artifact_root" -type f -name listener-verification.json -print -quit)"
          test -n "$focused"
          test -n "$full"
          test -n "$build"
          test -n "$expected"
          test -n "$verification"

          python - "$focused" "$full" "$build" "$expected" "$verification" "$root/totals.json" <<'PY'
          import json, re, sys
          from pathlib import Path
          focused, full, build, expected, verification, output = map(Path, sys.argv[1:])
          def totals(path):
              text = path.read_text(errors='replace')
              files = re.findall(r'Test Files\s+(\d+) passed', text)
              tests = re.findall(r'Tests\s+(\d+) passed', text)
              if not files or not tests:
                  raise SystemExit(f'cannot parse Vitest totals from {path}')
              return int(files[-1]), int(tests[-1])
          focused_files, focused_tests = totals(focused)
          full_files, full_tests = totals(full)
          build_text = build.read_text(errors='replace')
          modules = re.findall(r'(\d+) modules transformed', build_text)
          if not modules:
              raise SystemExit('cannot parse production build module total')
          expected_data = json.loads(expected.read_text())
          verification_data = json.loads(verification.read_text())
          if verification_data.get('ok') is not True:
              raise SystemExit('listener verification did not pass')
          errors = [x for x in verification_data.get('findings', []) if x.get('severity') == 'error']
          if errors:
              raise SystemExit('listener verification retained errors')
          required_listener = {
              'policies': 1,
              'sessions': 3,
              'ready': 3,
              'stopped': 2,
              'recovered': 1,
              'activeSessions': 0,
              'preparedSessions': 0,
          }
          if expected_data.get('listenerCounts') != required_listener:
              raise SystemExit('listener lifecycle counts differ from qualification law')
          payload = {
              'focusedFiles': focused_files,
              'focusedTests': focused_tests,
              'fullFiles': full_files,
              'fullTests': full_tests,
              'modulesTransformed': int(modules[-1]),
              'listenerCounts': expected_data['listenerCounts'],
              'serviceCounts': expected_data['serviceCounts'],
              'providerCounts': expected_data['providerCounts'],
              'brokerCounts': expected_data['brokerCounts'],
              'transportOperationsCounts': expected_data['transportOperationsCounts'],
              'unauthorizedClientRejected': expected_data['unauthorizedClientRejected'],
              'exactReplay': expected_data['executeReplay'],
          }
          Path(output).write_text(json.dumps(payload, indent=2) + '\n')
          PY

          if find "$artifact_root" -type f \
            \( -iname '*.key' -o -iname '*.crt' -o -iname '*.pem' -o -iname '*.csr' -o -iname '*.p12' -o -iname '*.pfx' \) \
            | grep -q .; then
            echo 'terminal artifact contains a forbidden credential path' >&2
            exit 1
          fi
          patterns="$root/secret-patterns.txt"
          cat > "$patterns" <<'PATTERNS'
          BEGIN (RSA |EC |ENCRYPTED )?PRIVATE KEY
          BEGIN CERTIFICATE( REQUEST)?
          "(clientPrivateKeyPem|credentialPrivateKeyPem|deviceAgentPrivateKeyPem|serverPrivateKey|clientPrivateKey|credentialCertificateThumbprint|deviceAgentCertificateThumbprint|requestBodyBase64|responseBodyBase64|payload)"[[:space:]]*:
          provider(Pin|Password|Token|Secret|Session)[[:space:]]*["=:]
          pkcs11:[^[:space:]"']+
          PATTERNS
          if grep -RIEq \
            --exclude='full-tests.log' \
            --exclude='focused-tests.log' \
            --exclude='windows-focused-tests.log' \
            --exclude='build.log' \
            --exclude='typecheck.log' \
            --exclude='windows-typecheck.log' \
            -f "$patterns" "$artifact_root"; then
            echo 'terminal artifact contains forbidden credential, payload, or raw-body content' >&2
            exit 1
          fi
          echo "focused_files=$(jq -r '.focusedFiles' "$root/totals.json")" >> "$GITHUB_OUTPUT"
          echo "focused_tests=$(jq -r '.focusedTests' "$root/totals.json")" >> "$GITHUB_OUTPUT"
          echo "full_files=$(jq -r '.fullFiles' "$root/totals.json")" >> "$GITHUB_OUTPUT"
          echo "full_tests=$(jq -r '.fullTests' "$root/totals.json")" >> "$GITHUB_OUTPUT"
          echo "modules=$(jq -r '.modulesTransformed' "$root/totals.json")" >> "$GITHUB_OUTPUT"

      - name: Publish authoritative PR ledger and terminal receipt
        env:
          RUN_ID: ${{ steps.run.outputs.run_id }}
          RUN_URL: ${{ steps.run.outputs.run_url }}
          LINUX_ID: ${{ steps.artifacts.outputs.linux_id }}
          LINUX_DIGEST: ${{ steps.artifacts.outputs.linux_digest }}
          LINUX_SIZE: ${{ steps.artifacts.outputs.linux_size }}
          WINDOWS_ID: ${{ steps.artifacts.outputs.windows_id }}
          WINDOWS_DIGEST: ${{ steps.artifacts.outputs.windows_digest }}
          WINDOWS_SIZE: ${{ steps.artifacts.outputs.windows_size }}
          COMBINED_ID: ${{ steps.artifacts.outputs.combined_id }}
          COMBINED_DIGEST: ${{ steps.artifacts.outputs.combined_digest }}
          COMBINED_SIZE: ${{ steps.artifacts.outputs.combined_size }}
          FOCUSED_FILES: ${{ steps.ledger.outputs.focused_files }}
          FOCUSED_TESTS: ${{ steps.ledger.outputs.focused_tests }}
          FULL_FILES: ${{ steps.ledger.outputs.full_files }}
          FULL_TESTS: ${{ steps.ledger.outputs.full_tests }}
          MODULES: ${{ steps.ledger.outputs.modules }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/observer"
          cat > "$root/pr-body.md" <<EOF
          This stacked draft adds the governed loopback mutual-TLS listener above the qualified authenticated broker service. The object is an endpoint-admission and runtime-lifecycle plane. Its actors are the retained broker-service policy, transport certificate operator, endpoint-lease operator, listener-policy operator, authenticated client, loopback listener process, broker-service dispatcher, provider host, native credential provider, and transport availability observer. The listener does not issue certificates, create deployments, select provider work, schedule answer work, review evidence, reconcile canon, mutate the graph, or render answers.

          The exact carrier-free candidate is \`$TARGET_SHA\`, directly above base \`$TARGET_BASE\`. The final diff contains exactly seven permanent surfaces: the read-only cross-platform workflow, operating contract, package registration, qualification fixture, focused suite, command-line operator, and typed listener core. No repair, diagnostic, private-key, certificate, generated-estate, or workflow-receipt carrier remains in the diff.

          A listener policy binds one exact broker-service policy to one exact loopback endpoint lease, admitted server certificate, admitted client certificate, accepted client CA, literal loopback address, explicit port, and bounded wire, response, and session ceilings. The TLS peer certificate and public-key fingerprints must equal the service client identity and signing key already retained by the parent policy. The signed broker-service envelope remains independently mandatory. Chain-valid mutual TLS cannot substitute for request custody, and a valid signed request cannot substitute for the admitted TLS peer.

          Each prepared session is content addressed and idempotent. Runtime validates transient server certificate, matching private key, and client CA before binding. A successful bind receives a \`ready\` receipt. Normal closure receives a \`stopped\` receipt. Restart recovery receives a \`recovered\` receipt only after a later session successfully binds the exact endpoint, proving the prior runtime no longer owns it. TLS sockets are explicitly owned and destroyed before server settlement, so graceful shutdown cannot leave a false active session or retained runtime lock.

          Permanent push workflow run \`$RUN_ID\` passed Linux and Windows qualification on the same exact candidate. The focused matrix passed $FOCUSED_TESTS tests across $FOCUSED_FILES files. The complete Arc regression passed $FULL_TESTS tests across $FULL_FILES files. The production build passed with $MODULES modules transformed. The retained lifecycle contains one policy, three sessions, three ready receipts, two stopped receipts, one recovered receipt, no active session, and no prepared session. The wrong same-CA client was rejected, exact signed-request replay reused the original request and receipt, and the pinned availability observation passed.

          Linux artifact \`$LINUX_ID\` is $LINUX_SIZE bytes with ZIP digest \`$LINUX_DIGEST\`. Windows artifact \`$WINDOWS_ID\` is $WINDOWS_SIZE bytes with ZIP digest \`$WINDOWS_DIGEST\`. Combined artifact \`$COMBINED_ID\` is $COMBINED_SIZE bytes with ZIP digest \`$COMBINED_DIGEST\`. The observer independently reproduced all three ZIP digests, verified ZIP integrity, verified the combined internal \`SHA256SUMS\` ledger and candidate binding, reconstructed qualification totals, and rejected certificate, CSR, PEM, private-key, PKCS#12, raw-payload, raw-body, and provider-secret material.

          Every listener policy, session, lifecycle receipt, state projection, and availability observation retains \`authority=none\`, \`graphEffect=none\`, \`canonEffect=none\`, and \`answerEffect=none\`. The evidence tier is exact-head typed implementation, real loopback mutual-TLS execution, signed request admission, replay, lifecycle and restart recovery, Linux and Windows qualification, complete regression, production build, and independently verified artifact custody. The venue is this open draft PR. The target is loopback endpoint admission and runtime lifecycle rather than certificate issuance, deployment, provider selection, task execution, or ASOIAF truth. The upside is a complete public chain from endpoint lease and certificate admissions through authenticated peer, signed request, provider result, lifecycle settlement, and availability. The downside is transient certificate handling, local port ownership, append-only lifecycle growth, and separate operating-system service installation. The failure mode is accepting the wrong peer, binding beyond loopback, executing payload bytes outside the signed digest, leaving sockets or locks after closure, fabricating recovery without successful bind, retaining secret material, or treating endpoint availability as task authority.

          The control question is whether every loopback TLS request can identify the exact broker-service policy, endpoint lease, server and client certificate admissions, listener policy, prepared session, authenticated peer, signed request, provider result, lifecycle receipt, and availability observation while no listener object acquires certificate issuance, deployment, scheduling, research, review, graph, canon, or answer authority.
          EOF
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$TARGET_PR" \
            --input <(jq -n --rawfile body "$root/pr-body.md" '{body: $body}') \
            > "$root/pr-update.json"

          existing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$TARGET_PR/comments?per_page=100" \
            --jq --arg marker "$TERMINAL_MARKER" '[.[] | select(.body | contains($marker))] | length')"
          if [ "$existing" = '0' ]; then
            cat > "$root/terminal-comment.md" <<EOF
          $TERMINAL_MARKER

          PR #282 is terminally qualified on exact carrier-free head \`$TARGET_SHA\`. Permanent push workflow run \`$RUN_ID\` passed Linux and Windows qualification, $FOCUSED_TESTS focused tests across $FOCUSED_FILES files, the complete $FULL_TESTS-test regression across $FULL_FILES files, and the $MODULES-module production build. Combined artifact \`$COMBINED_ID\` is $COMBINED_SIZE bytes with ZIP digest \`$COMBINED_DIGEST\`; its internal checksum ledger, candidate binding, lifecycle totals, and secret exclusions were independently verified.

          The object is a governed loopback mutual-TLS endpoint and runtime-lifecycle plane. It authenticates the exact TLS peer and separately requires the exact signed broker-service request. Three sessions produced three ready, two stopped, and one bind-before-recover receipt, with no active session or retained runtime lock. The wrong same-CA client was refused, and exact replay reused the original service request, terminal receipt, and provider result.

          The evidence tier is exact-head execution and independently verified artifact custody. The venue is open draft PR #282. The target is loopback endpoint admission and lifecycle rather than certificate issuance, deployment, provider selection, scheduling, research, review, graph, canon, answer authority, or ASOIAF truth. The upside is complete peer, request, provider, lifecycle, and availability provenance. The downside is transient credential handling, port ownership, and append-only lifecycle growth. The failure mode is accepting the wrong peer, retaining a secret, leaving sockets or locks after closure, fabricating recovery without successful bind, or treating availability as task authority.

          The control question is whether every loopback TLS request can disclose the endpoint lease, certificate admissions, listener policy, session, authenticated peer, signed request, provider result, lifecycle receipt, and availability observation while no listener object acquires the authority of the underlying task.
          EOF
            gh pr comment "$TARGET_PR" --repo "$GITHUB_REPOSITORY" \
              --body-file "$root/terminal-comment.md"
          fi

      - name: Delete successful observer branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete observer/asoiaf-loopback-tls-terminal-v1

      - name: Publish bounded observer failure
        if: failure()
        shell: bash
        run: |
          root="$RUNNER_TEMP/observer"
          existing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$TARGET_PR/comments?per_page=100" \
            --jq '[.[] | select(.body | contains("TEMP_LOOPBACK_TLS_TERMINAL_OBSERVER_V1"))] | length' 2>/dev/null || echo 0)"
          if [ "$existing" = '0' ]; then
            {
              echo 'TEMP_LOOPBACK_TLS_TERMINAL_OBSERVER_V1'
              echo
              echo "The terminal observer did not admit target \`$TARGET_SHA\`. No terminal qualification claim is issued."
              if [ -f "$root/run.json" ]; then
                echo "Observed run: \`$(jq -r '.id' "$root/run.json")\`; status \`$(jq -r '.status' "$root/run.json")\`; conclusion \`$(jq -r '.conclusion' "$root/run.json")\`."
              fi
              if [ -f "$root/jobs.tsv" ]; then
                echo
                echo 'Jobs:'
                echo '```text'
                cat "$root/jobs.tsv"
                echo '```'
              fi
            } > "$root/observer-failure.md"
            gh pr comment "$TARGET_PR" --repo "$GITHUB_REPOSITORY" \
              --body-file "$root/observer-failure.md" || true
          fi
