name: Observe exact ASOIAF loopback TLS qualification v2

on:
  push:
    branches:
      - observer/asoiaf-loopback-tls-terminal-v1
    paths:
      - '.github/workflows/observe-asoiaf-loopback-tls-terminal-v2.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: observe-asoiaf-loopback-tls-terminal-v2
  cancel-in-progress: false

jobs:
  observe:
    if: github.repository == 'BigBirdReturns/axm-arc'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TARGET_SHA: 0534e419b420fc0c26604bedd650db8f0dbf691e
      TARGET_BRANCH: feature/asoiaf-answer-credential-broker-loopback-tls-v1
      TARGET_BASE: feature/asoiaf-answer-credential-broker-service-v1
      TARGET_WORKFLOW: asoiaf-answer-credential-broker-loopback-tls.yml
      TARGET_PR: '282'
      TERMINAL_MARKER: ASOIAF_LOOPBACK_TLS_TERMINAL_RECEIPT_V1
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out observer transaction
        uses: actions/checkout@v4
        with:
          ref: observer/asoiaf-loopback-tls-terminal-v1
          fetch-depth: 1
          show-progress: false

      - name: Wait for exact permanent push run
        id: run
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/observer-v2"
          mkdir -p "$root"
          run_id=''
          for _ in $(seq 1 180); do
            gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW/runs" \
              -f branch="$TARGET_BRANCH" \
              -f event=push \
              -f per_page=100 > "$root/runs.json"
            jq -c --arg sha "$TARGET_SHA" '
              .workflow_runs
              | map(select(.head_sha == $sha and .event == "push"))
              | sort_by(.run_number)
              | last // empty
            ' "$root/runs.json" > "$root/run.json"
            if [ -s "$root/run.json" ]; then
              run_id="$(jq -r '.id' "$root/run.json")"
              [ "$(jq -r '.status' "$root/run.json")" = completed ] && break
            fi
            sleep 20
          done
          test -n "$run_id"
          test "$(jq -r '.head_sha' "$root/run.json")" = "$TARGET_SHA"
          test "$(jq -r '.status' "$root/run.json")" = completed
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$(jq -r '.html_url' "$root/run.json")" >> "$GITHUB_OUTPUT"
          echo "conclusion=$(jq -r '.conclusion' "$root/run.json")" >> "$GITHUB_OUTPUT"

      - name: Require successful platform jobs
        id: jobs
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/observer-v2"
          run_id='${{ steps.run.outputs.run_id }}'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
            > "$root/jobs.json"
          jq -r '.jobs[] | [.name, .status, .conclusion, (.id|tostring)] | @tsv' \
            "$root/jobs.json" > "$root/jobs.tsv"
          cat "$root/jobs.tsv"
          test '${{ steps.run.outputs.conclusion }}' = success
          for name in linux-qualify windows-qualify combine; do
            test "$(jq -r --arg name "$name" '.jobs[] | select(.name == $name) | .conclusion' "$root/jobs.json")" = success
          done

      - name: Require exact seven-surface draft topology
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/observer-v2"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$TARGET_PR" > "$root/pr.json"
          jq -e --arg sha "$TARGET_SHA" --arg base "$TARGET_BASE" '
            .state == "open"
            and .draft == true
            and .merged == false
            and .head.sha == $sha
            and .base.ref == $base
          ' "$root/pr.json" >/dev/null
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$TARGET_PR/files?per_page=100" \
            --jq '.[].filename' | sort > "$root/actual-files.txt"
          cat > "$root/expected-files.txt" <<'FILES'
          .github/workflows/asoiaf-answer-credential-broker-loopback-tls.yml
          docs/ASOIAF_ANSWER_CREDENTIAL_BROKER_LOOPBACK_TLS.md
          package.json
          tests/fixtures/emit-asoiaf-answer-credential-broker-loopback-tls-input.ts
          tests/narrative/canon/asoiaf-answer-credential-broker-loopback-tls.test.ts
          tools/asoiaf-answer-credential-broker-loopback-tls.ts
          tools/lib/asoiaf-answer-credential-broker-loopback-tls.ts
          FILES
          diff -u "$root/expected-files.txt" "$root/actual-files.txt"

      - name: Reproduce artifact ZIP digests and internal custody
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/observer-v2"
          run_id='${{ steps.run.outputs.run_id }}'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" \
            > "$root/artifacts.json"
          names=(
            asoiaf-answer-credential-broker-loopback-tls-linux
            asoiaf-answer-credential-broker-loopback-tls-windows
            asoiaf-answer-credential-broker-loopback-tls-qualification
          )
          for name in "${names[@]}"; do
            jq -e --arg name "$name" '
              [.artifacts[] | select(.name == $name and .expired == false)] | length == 1
            ' "$root/artifacts.json" >/dev/null
            id="$(jq -r --arg name "$name" '.artifacts[] | select(.name == $name) | .id' "$root/artifacts.json")"
            expected="$(jq -r --arg name "$name" '.artifacts[] | select(.name == $name) | .digest' "$root/artifacts.json")"
            curl --fail --location --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" \
              -o "$root/$name.zip"
            actual="sha256:$(sha256sum "$root/$name.zip" | awk '{print $1}')"
            test "$actual" = "$expected"
            unzip -t "$root/$name.zip" >/dev/null
            mkdir -p "$root/$name"
            unzip -q "$root/$name.zip" -d "$root/$name"
          done

          combined=asoiaf-answer-credential-broker-loopback-tls-qualification
          combined_root="$root/$combined"
          sums="$(find "$combined_root" -type f -name SHA256SUMS -print -quit)"
          candidate="$(find "$combined_root" -type f -name candidate-sha.txt -print -quit)"
          test -n "$sums"
          test -n "$candidate"
          artifact_root="$(dirname "$sums")"
          test "$(tr -d '\r\n' < "$candidate")" = "$TARGET_SHA"
          (cd "$artifact_root" && sha256sum -c SHA256SUMS) \
            | tee "$root/internal-sha256-verification.log"

          for name in "${names[@]}"; do
            key="${name##*-}"
            id="$(jq -r --arg name "$name" '.artifacts[] | select(.name == $name) | .id' "$root/artifacts.json")"
            digest="$(jq -r --arg name "$name" '.artifacts[] | select(.name == $name) | .digest' "$root/artifacts.json")"
            size="$(jq -r --arg name "$name" '.artifacts[] | select(.name == $name) | .size_in_bytes' "$root/artifacts.json")"
            if [ "$name" = "$combined" ]; then key=combined; fi
            echo "${key}_id=$id" >> "$GITHUB_OUTPUT"
            echo "${key}_digest=$digest" >> "$GITHUB_OUTPUT"
            echo "${key}_size=$size" >> "$GITHUB_OUTPUT"
          done
          echo "artifact_root=$artifact_root" >> "$GITHUB_OUTPUT"

      - name: Reconstruct test, build, lifecycle, and secret ledger
        id: ledger
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/observer-v2"
          artifact_root='${{ steps.artifacts.outputs.artifact_root }}'
          focused="$(find "$artifact_root" -type f -name focused-tests.log -print -quit)"
          full="$(find "$artifact_root" -type f -name full-tests.log -print -quit)"
          build="$(find "$artifact_root" -type f -name build.log -print -quit)"
          expected="$(find "$artifact_root" -type f -path '*/fixture/expected.json' -print -quit)"
          verification="$(find "$artifact_root" -type f -path '*/fixture/listener-verification.json' -print -quit)"
          test -n "$focused" && test -n "$full" && test -n "$build"
          test -n "$expected" && test -n "$verification"
          python - "$focused" "$full" "$build" "$expected" "$verification" "$root/totals.json" <<'PY'
          import json, re, sys
          from pathlib import Path
          focused, full, build, expected, verification, output = map(Path, sys.argv[1:])
          ansi = re.compile(r'\x1b\[[0-?]*[ -/]*[@-~]')
          def text(path):
              return ansi.sub('', path.read_text(errors='replace'))
          def totals(path):
              value = text(path)
              files = re.findall(r'Test Files\s+(\d+) passed', value)
              tests = re.findall(r'Tests\s+(\d+) passed', value)
              if not files or not tests:
                  raise SystemExit(f'cannot parse test totals from {path}')
              return int(files[-1]), int(tests[-1])
          focused_files, focused_tests = totals(focused)
          full_files, full_tests = totals(full)
          modules = re.findall(r'(\d+) modules transformed', text(build))
          if not modules:
              raise SystemExit('cannot parse build total')
          expected_data = json.loads(expected.read_text())
          verification_data = json.loads(verification.read_text())
          if verification_data.get('ok') is not True:
              raise SystemExit('listener verification failed')
          if [x for x in verification_data.get('findings', []) if x.get('severity') == 'error']:
              raise SystemExit('listener verification retained errors')
          required = {
              'policies': 1,
              'sessions': 3,
              'ready': 3,
              'stopped': 2,
              'recovered': 1,
              'activeSessions': 0,
              'preparedSessions': 0,
          }
          if expected_data.get('listenerCounts') != required:
              raise SystemExit('listener lifecycle counts differ')
          result = {
              'focusedFiles': focused_files,
              'focusedTests': focused_tests,
              'fullFiles': full_files,
              'fullTests': full_tests,
              'modules': int(modules[-1]),
              'listenerCounts': required,
              'serviceCounts': expected_data['serviceCounts'],
              'providerCounts': expected_data['providerCounts'],
              'brokerCounts': expected_data['brokerCounts'],
              'transportOperationsCounts': expected_data['transportOperationsCounts'],
              'unauthorizedClientRejected': expected_data['unauthorizedClientRejected'],
              'exactReplay': expected_data['executeReplay'],
          }
          Path(output).write_text(json.dumps(result, indent=2) + '\n')
          PY

          if find "$artifact_root" -type f \
            \( -iname '*.key' -o -iname '*.crt' -o -iname '*.pem' -o -iname '*.csr' -o -iname '*.p12' -o -iname '*.pfx' \) \
            | grep -q .; then
            echo 'artifact retained a forbidden credential path' >&2
            exit 1
          fi
          patterns="$root/secret-patterns.txt"
          cat > "$patterns" <<'PATTERNS'
          BEGIN (RSA |EC |ENCRYPTED )?PRIVATE KEY
          BEGIN CERTIFICATE( REQUEST)?
          "(clientPrivateKeyPem|credentialPrivateKeyPem|deviceAgentPrivateKeyPem|serverPrivateKey|clientPrivateKey|credentialCertificateThumbprint|deviceAgentCertificateThumbprint|requestBodyBase64|responseBodyBase64|payload)"[[:space:]]*:
          provider(Pin|Password|Token|Secret|Session)[[:space:]]*["=:]
          pkcs11:[^[:space:]"']+
          PATTERNS
          if grep -RIEq \
            --exclude='full-tests.log' \
            --exclude='focused-tests.log' \
            --exclude='windows-focused-tests.log' \
            --exclude='build.log' \
            --exclude='typecheck.log' \
            --exclude='windows-typecheck.log' \
            -f "$patterns" "$artifact_root"; then
            echo 'artifact retained forbidden secret, payload, or raw-body content' >&2
            exit 1
          fi
          for key in focusedFiles focusedTests fullFiles fullTests modules; do
            snake="$(echo "$key" | sed -E 's/([A-Z])/_\L\1/g')"
            echo "$snake=$(jq -r ".$key" "$root/totals.json")" >> "$GITHUB_OUTPUT"
          done

      - name: Post immutable terminal receipt
        env:
          RUN_ID: ${{ steps.run.outputs.run_id }}
          RUN_URL: ${{ steps.run.outputs.run_url }}
          LINUX_ID: ${{ steps.artifacts.outputs.linux_id }}
          LINUX_DIGEST: ${{ steps.artifacts.outputs.linux_digest }}
          LINUX_SIZE: ${{ steps.artifacts.outputs.linux_size }}
          WINDOWS_ID: ${{ steps.artifacts.outputs.windows_id }}
          WINDOWS_DIGEST: ${{ steps.artifacts.outputs.windows_digest }}
          WINDOWS_SIZE: ${{ steps.artifacts.outputs.windows_size }}
          COMBINED_ID: ${{ steps.artifacts.outputs.combined_id }}
          COMBINED_DIGEST: ${{ steps.artifacts.outputs.combined_digest }}
          COMBINED_SIZE: ${{ steps.artifacts.outputs.combined_size }}
          FOCUSED_FILES: ${{ steps.ledger.outputs.focused_files }}
          FOCUSED_TESTS: ${{ steps.ledger.outputs.focused_tests }}
          FULL_FILES: ${{ steps.ledger.outputs.full_files }}
          FULL_TESTS: ${{ steps.ledger.outputs.full_tests }}
          MODULES: ${{ steps.ledger.outputs.modules }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/observer-v2"
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$TARGET_PR/comments?per_page=100" \
            > "$root/comments.json"
          existing="$(jq --arg marker "$TERMINAL_MARKER" '[.[] | select(.body | contains($marker))] | length' "$root/comments.json")"
          if [ "$existing" = 0 ]; then
            cat > "$root/terminal.md" <<EOF
          $TERMINAL_MARKER

          PR #282 is terminally qualified on exact carrier-free head \`$TARGET_SHA\`. Permanent push workflow run \`$RUN_ID\` passed Linux and Windows qualification, $FOCUSED_TESTS focused tests across $FOCUSED_FILES files, the complete $FULL_TESTS-test regression across $FULL_FILES files, and the $MODULES-module production build.

          Linux artifact \`$LINUX_ID\` is $LINUX_SIZE bytes with ZIP digest \`$LINUX_DIGEST\`. Windows artifact \`$WINDOWS_ID\` is $WINDOWS_SIZE bytes with ZIP digest \`$WINDOWS_DIGEST\`. Combined artifact \`$COMBINED_ID\` is $COMBINED_SIZE bytes with ZIP digest \`$COMBINED_DIGEST\`. The observer independently reproduced all three ZIP digests, verified ZIP integrity, the combined internal checksum ledger, exact candidate binding, lifecycle totals, regression and build totals, and secret exclusions.

          The object is a governed loopback mutual-TLS endpoint and runtime-lifecycle plane. It separately authenticates the exact TLS peer and exact signed broker-service request. Three sessions produced three ready, two stopped, and one bind-before-recover receipt, with no active session or retained runtime lock. The wrong same-CA client was refused, exact replay reused the original request and receipt, and pinned availability passed.

          The evidence tier is exact-head execution and independently verified artifact custody. The venue is open draft PR #282. The target is loopback endpoint admission and lifecycle rather than certificate issuance, deployment, provider selection, scheduling, research, review, graph, canon, answer authority, or ASOIAF truth. The upside is complete peer, request, provider, lifecycle, and availability provenance. The downside is transient credential handling, port ownership, and append-only lifecycle growth. The failure mode is accepting the wrong peer, retaining a secret, leaving sockets or locks after closure, fabricating recovery without successful bind, or treating availability as task authority.

          The control question is whether every loopback TLS request can disclose the endpoint lease, certificate admissions, listener policy, session, authenticated peer, signed request, provider result, lifecycle receipt, and availability observation while no listener object acquires the authority of the underlying task.
          EOF
            gh pr comment "$TARGET_PR" --repo "$GITHUB_REPOSITORY" \
              --body-file "$root/terminal.md"
          fi

      - name: Delete successful observer branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete observer/asoiaf-loopback-tls-terminal-v1

      - name: Post bounded observer failure
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          root="$RUNNER_TEMP/observer-v2"
          {
            echo 'TEMP_LOOPBACK_TLS_TERMINAL_OBSERVER_V2'
            echo
            echo "The observer did not admit exact target \`$TARGET_SHA\`. No terminal qualification claim is issued."
            if [ -f "$root/run.json" ]; then
              echo "Observed run \`$(jq -r '.id' "$root/run.json")\`, status \`$(jq -r '.status' "$root/run.json")\`, conclusion \`$(jq -r '.conclusion' "$root/run.json")\`."
            fi
            if [ -f "$root/jobs.tsv" ]; then
              echo
              echo 'Jobs:'
              echo '```text'
              cat "$root/jobs.tsv"
              echo '```'
            fi
          } > "$root/failure.md"
          gh pr comment "$TARGET_PR" --repo "$GITHUB_REPOSITORY" \
            --body-file "$root/failure.md" || true
