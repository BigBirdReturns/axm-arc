name: Parity source export

on:
  push:
    branches:
      - agent/parity-source-export
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Package exact source
        run: |
          tar --exclude=.git -czf axm-arc-source.tgz .
          sha256sum axm-arc-source.tgz > axm-arc-source.sha256
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: axm-arc-source
          path: |
            axm-arc-source.tgz
            axm-arc-source.sha256
          if-no-files-found: error
          retention-days: 1
