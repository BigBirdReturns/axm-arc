name: Probe ASOIAF Windows actor capability enforcement v7

on:
  pull_request:
    branches:
      - feature/asoiaf-answer-actor-capability-broker-v1
    paths:
      - '.github/workflows/probe-asoiaf-answer-actor-capability-windows-v6.yml'
      - 'diagnostics/actor-capability-windows-probe-v1/patch-host-profile-environment.mjs'
      - 'diagnostics/actor-capability-windows-probe-v1/host.cpp'
      - 'diagnostics/actor-capability-windows-probe-v1/adapter.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: probe-asoiaf-answer-actor-capability-windows-v7
  cancel-in-progress: true

jobs:
  probe:
    if: github.repository == 'BigBirdReturns/axm-arc' && github.event.pull_request.head.ref == 'diagnostic/actor-capability-windows-kernel-probe-v1'
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      PRODUCT_PARENT: 202fd8cfb03ec038ae0da2bfedb0bc5727b12e7d
    steps:
      - name: Check out exact diagnostic head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Bind exact parent and disposable surfaces
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git merge-base HEAD $env:PRODUCT_PARENT) -ne $env:PRODUCT_PARENT) {
            throw 'diagnostic head is not rooted at the terminal capability broker'
          }
          $expected = @(
            '.github/workflows/probe-asoiaf-answer-actor-capability-windows-v6.yml'
            'diagnostics/actor-capability-windows-probe-v1/adapter.js'
            'diagnostics/actor-capability-windows-probe-v1/host.cpp'
            'diagnostics/actor-capability-windows-probe-v1/patch-host-profile-environment.mjs'
          ) | Sort-Object
          $actual = @(git diff --name-only $env:PRODUCT_PARENT HEAD) | Sort-Object
          if (Compare-Object $expected $actual) { throw 'diagnostic path ledger differs' }
          git diff --check $env:PRODUCT_PARENT HEAD
          git rev-parse HEAD | Set-Content -NoNewline "$env:RUNNER_TEMP/candidate-sha.txt"
          $env:PRODUCT_PARENT | Set-Content -NoNewline "$env:RUNNER_TEMP/product-parent.txt"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compile fixed host and static native control
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'windows-capability-probe-v7'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $original = Join-Path $env:GITHUB_WORKSPACE 'diagnostics/actor-capability-windows-probe-v1/host.cpp'
          $patched = Join-Path $root 'host-profile-environment.cpp'
          $patcher = Join-Path $env:GITHUB_WORKSPACE 'diagnostics/actor-capability-windows-probe-v1/patch-host-profile-environment.mjs'
          & node $patcher $original $patched
          if ($LASTEXITCODE -ne 0) { throw "source transformation failed with $LASTEXITCODE" }
          Copy-Item $patched "$env:RUNNER_TEMP/patched-host-source.cpp"

          $nativeSource = Join-Path $root 'native-control.cpp'
          @'
          #define UNICODE
          #define _UNICODE
          #define _WIN32_WINNT 0x0A00
          #include <windows.h>
          #include <fstream>
          #include <iostream>
          #include <iterator>
          #include <string>

          DWORD WINAPI worker_probe(LPVOID parameter) {
            *static_cast<DWORD*>(parameter) = 42;
            return 0;
          }

          int wmain() {
            const std::string input(
                (std::istreambuf_iterator<char>(std::cin)),
                std::istreambuf_iterator<char>());
            const bool input_received = !input.empty();

            std::ofstream allowed("native-allowed.txt", std::ios::binary | std::ios::trunc);
            allowed << "allowed";
            const bool allowed_write = static_cast<bool>(allowed);
            allowed.close();

            DWORD worker_value = 0;
            HANDLE thread = CreateThread(nullptr, 0, worker_probe, &worker_value, 0, nullptr);
            const bool thread_created = thread != nullptr;
            bool thread_waited = false;
            if (thread) {
              thread_waited = WaitForSingleObject(thread, 5000) == WAIT_OBJECT_0;
              CloseHandle(thread);
            }

            wchar_t secret[2]{};
            SetLastError(ERROR_SUCCESS);
            const DWORD secret_length = GetEnvironmentVariableW(
                L"AXM_WINDOWS_PROBE_SECRET", secret, 2);
            const bool secret_present = secret_length != 0 || GetLastError() != ERROR_ENVVAR_NOT_FOUND;

            const bool worker_ok = thread_created && thread_waited && worker_value == 42;
            std::cout
                << "{\"format\":\"axm-windows-native-control/1\","
                << "\"nativeStarted\":true,"
                << "\"inputReceived\":" << (input_received ? "true" : "false") << ","
                << "\"allowedWrite\":" << (allowed_write ? "true" : "false") << ","
                << "\"workerThreadSucceeded\":" << (worker_ok ? "true" : "false") << ","
                << "\"workerValue\":" << worker_value << ","
                << "\"secretPresent\":" << (secret_present ? "true" : "false")
                << "}\n";
            return input_received && allowed_write && worker_ok && !secret_present ? 0 : 1;
          }
          '@ | Set-Content -Encoding utf8 $nativeSource

          $hostExecutable = Join-Path $root 'host.exe'
          $nativeExecutable = Join-Path $root 'native-control.exe'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
          if (-not $installation) { throw 'Visual Studio C++ toolchain not found' }
          $vcvars = Join-Path $installation 'VC/Auxiliary/Build/vcvars64.bat'
          $command = @(
            "call `"$vcvars`""
            "cl.exe /nologo /std:c++20 /EHsc /W4 /DWIN32_LEAN_AND_MEAN /Fe:`"$hostExecutable`" `"$patched`""
            "cl.exe /nologo /std:c++20 /EHsc /W4 /MT /DWIN32_LEAN_AND_MEAN /Fe:`"$nativeExecutable`" `"$nativeSource`""
            "dumpbin.exe /dependents `"$nativeExecutable`" > `"$env:RUNNER_TEMP/native-dependencies.txt`""
            "dumpbin.exe /dependents `"$((Get-Command node).Source)`" > `"$env:RUNNER_TEMP/node-dependencies.txt`""
          ) -join ' && '
          & $env:ComSpec /d /s /c $command 2>&1 | Tee-Object "$env:RUNNER_TEMP/compile.log"
          if ($LASTEXITCODE -ne 0) { throw "C++ compilation failed with $LASTEXITCODE" }
          if (-not (Test-Path $hostExecutable) -or -not (Test-Path $nativeExecutable)) {
            throw 'compiled diagnostic executable missing'
          }
          (Get-FileHash -Algorithm SHA256 $original).Hash.ToLowerInvariant() | Set-Content -NoNewline "$env:RUNNER_TEMP/original-host-source-sha256.txt"
          (Get-FileHash -Algorithm SHA256 $patched).Hash.ToLowerInvariant() | Set-Content -NoNewline "$env:RUNNER_TEMP/patched-host-source-sha256.txt"
          (Get-FileHash -Algorithm SHA256 $hostExecutable).Hash.ToLowerInvariant() | Set-Content -NoNewline "$env:RUNNER_TEMP/host-binary-sha256.txt"
          (Get-FileHash -Algorithm SHA256 $nativeExecutable).Hash.ToLowerInvariant() | Set-Content -NoNewline "$env:RUNNER_TEMP/native-binary-sha256.txt"

      - name: Exercise native control and staged Node startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'windows-capability-probe-v7'
          $app = Join-Path $root 'app'
          $outside = Join-Path $root 'outside'
          New-Item -ItemType Directory -Force -Path $app, $outside | Out-Null

          $nodeCopy = Join-Path $app 'node.exe'
          Copy-Item (Get-Command node).Source $nodeCopy
          $nativeCopy = Join-Path $app 'native-control.exe'
          Copy-Item (Join-Path $root 'native-control.exe') $nativeCopy
          $nativeArgument = Join-Path $app 'native-argument.txt'
          'native-control' | Set-Content -NoNewline $nativeArgument
          $minimal = Join-Path $app 'minimal.js'
          @'
          'use strict';
          let input = '';
          process.stdin.setEncoding('utf8');
          process.stdin.on('data', (chunk) => input += chunk);
          process.stdin.on('end', () => {
            require('node:fs').writeFileSync('minimal-allowed.txt', 'allowed');
            process.stdout.write(`${JSON.stringify({
              format: 'axm-windows-node-minimal/1',
              nodeStarted: true,
              inputReceived: input.length > 0,
              allowedWrite: true,
              secretPresent: Object.prototype.hasOwnProperty.call(process.env, 'AXM_WINDOWS_PROBE_SECRET'),
              environmentKeys: Object.keys(process.env).sort(),
            })}\n`);
          });
          '@ | Set-Content -Encoding utf8 $minimal
          $adapter = Join-Path $app 'adapter.js'
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'diagnostics/actor-capability-windows-probe-v1/adapter.js') $adapter

          $external = Join-Path $outside 'holder-only.txt'
          'holder-only' | Set-Content -NoNewline $external
          $userSid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          & icacls.exe $external '/inheritance:r' '/grant:r' "*${userSid}:(R,W)" | Tee-Object "$env:RUNNER_TEMP/external-acl.log"
          if ($LASTEXITCODE -ne 0) { throw 'failed to establish holder-only external file ACL' }

          $hostExecutable = Join-Path $root 'host.exe'
          $eventStart = Get-Date

          function Invoke-CapabilityProbe {
            param(
              [Parameter(Mandatory = $true)][string]$Name,
              [Parameter(Mandatory = $true)][string]$Application,
              [Parameter(Mandatory = $true)][string]$Script,
              [Parameter(Mandatory = $true)][UInt64]$MemoryLimit
            )
            $work = Join-Path $root "work-$Name"
            New-Item -ItemType Directory -Force -Path $work | Out-Null
            $receipt = Join-Path $root "$Name-host-receipt.json"
            $stdout = Join-Path $work "$Name-child-result.json"
            $stderr = Join-Path $work "$Name-child-stderr.txt"
            $profileSuffix = $Name -replace '[^A-Za-z0-9]', ''
            $profile = "AXM.Probe.$env:GITHUB_RUN_ID.$profileSuffix"
            $arguments = @(
              '--profile', $profile,
              '--application', $Application,
              '--script', $Script,
              '--app-directory', $app,
              '--work-directory', $work,
              '--external-file', $external,
              '--receipt', $receipt,
              '--stdout', $stdout,
              '--stderr', $stderr,
              '--memory-limit', $MemoryLimit.ToString(),
              '--timeout-ms', '30000'
            )

            $exit = $null
            $env:AXM_WINDOWS_PROBE_SECRET = 'must-not-cross-process-boundary'
            try {
              & $hostExecutable @arguments 2>&1 | Tee-Object "$env:RUNNER_TEMP/$Name-host.log"
              $exit = $LASTEXITCODE
            } finally {
              Remove-Item Env:AXM_WINDOWS_PROBE_SECRET -ErrorAction SilentlyContinue
              foreach ($entry in @(
                @{ Source = $receipt; Target = "$Name-host-receipt.json" },
                @{ Source = $stdout; Target = "$Name-child-result.json" },
                @{ Source = $stderr; Target = "$Name-child-stderr.txt" }
              )) {
                if (Test-Path $entry.Source) {
                  Copy-Item $entry.Source (Join-Path $env:RUNNER_TEMP $entry.Target)
                }
              }
            }
            if ($null -eq $exit) { throw "$Name capability host did not return an exit code" }
            $receiptObject = if (Test-Path $receipt) {
              Get-Content $receipt -Raw | ConvertFrom-Json
            } else { $null }
            $exitHex = if ($null -ne $receiptObject) {
              '0x{0:X8}' -f [uint32]$receiptObject.processExitCode
            } else { $null }
            [pscustomobject]@{
              name = $Name
              hostExit = $exit
              memoryLimitBytes = $MemoryLimit
              receiptPath = $receipt
              stdoutPath = $stdout
              stderrPath = $stderr
              receipt = $receiptObject
              processExitHex = $exitHex
            }
          }

          function Assert-KernelReceipt {
            param($Probe)
            if ($null -eq $Probe.receipt) { throw "$($Probe.name) host receipt missing" }
            foreach ($name in @(
              'profileCreated','processCreatedSuspended','processInJob','tokenIsAppContainer',
              'appContainerSidExact','activeProcessLimitExact','killOnJobClose','memoryLimitExact',
              'childProcessRestricted','kernelAttestedBeforeInput','inputReleasedAfterAttestation'
            )) {
              if ($Probe.receipt.$name -ne $true) {
                throw "$($Probe.name) host receipt assertion failed: $name"
              }
            }
            if ([uint64]$Probe.receipt.memoryLimitBytes -ne [uint64]$Probe.memoryLimitBytes) {
              throw "$($Probe.name) memory limit differs"
            }
            if ($Probe.receipt.timedOut -ne $false) { throw "$($Probe.name) timed out" }
            if ($Probe.receipt.networkConnectionAccepted -ne $false) {
              throw "$($Probe.name) host accepted a forbidden loopback connection"
            }
          }

          $native = Invoke-CapabilityProbe -Name 'native-512m' -Application $nativeCopy -Script $nativeArgument -MemoryLimit 536870912
          Assert-KernelReceipt $native
          if ($native.hostExit -ne 0 -or $native.receipt.processExitCode -ne 0) {
            throw "static native AppContainer control failed: $($native.processExitHex)"
          }
          $nativeChild = Get-Content $native.stdoutPath -Raw | ConvertFrom-Json
          if ($nativeChild.nativeStarted -ne $true -or $nativeChild.inputReceived -ne $true -or
              $nativeChild.allowedWrite -ne $true -or $nativeChild.workerThreadSucceeded -ne $true -or
              $nativeChild.workerValue -ne 42 -or $nativeChild.secretPresent -ne $false) {
            throw 'static native AppContainer control assertions failed'
          }
          if ((Get-Content (Join-Path (Split-Path $native.stdoutPath) 'native-allowed.txt') -Raw) -ne 'allowed') {
            throw 'static native AppContainer work output missing'
          }

          $minimal512 = Invoke-CapabilityProbe -Name 'node-minimal-512m' -Application $nodeCopy -Script $minimal -MemoryLimit 536870912
          Assert-KernelReceipt $minimal512
          $selectedMinimal = $minimal512
          $selectedMemory = [uint64]536870912
          $minimal2g = $null
          if ($minimal512.hostExit -ne 0 -or $minimal512.receipt.processExitCode -ne 0) {
            $minimal2g = Invoke-CapabilityProbe -Name 'node-minimal-2g' -Application $nodeCopy -Script $minimal -MemoryLimit 2147483648
            Assert-KernelReceipt $minimal2g
            $selectedMinimal = $minimal2g
            $selectedMemory = [uint64]2147483648
          }

          $full = $null
          if ($selectedMinimal.hostExit -eq 0 -and $selectedMinimal.receipt.processExitCode -eq 0) {
            $minimalChild = Get-Content $selectedMinimal.stdoutPath -Raw | ConvertFrom-Json
            if ($minimalChild.nodeStarted -ne $true -or $minimalChild.inputReceived -ne $true -or
                $minimalChild.allowedWrite -ne $true -or $minimalChild.secretPresent -ne $false) {
              throw 'minimal Node AppContainer assertions failed'
            }
            $full = Invoke-CapabilityProbe -Name 'node-full' -Application $nodeCopy -Script $adapter -MemoryLimit $selectedMemory
            Assert-KernelReceipt $full
          }

          $matrix = [ordered]@{
            format = 'axm-windows-capability-runtime-matrix/1'
            candidateSha = (Get-Content "$env:RUNNER_TEMP/candidate-sha.txt" -Raw)
            productParent = $env:PRODUCT_PARENT
            native512m = [ordered]@{
              hostExit = $native.hostExit
              processExitCode = $native.receipt.processExitCode
              processExitHex = $native.processExitHex
              stdoutBytes = $native.receipt.stdoutBytes
              stderrBytes = $native.receipt.stderrBytes
            }
            nodeMinimal512m = [ordered]@{
              hostExit = $minimal512.hostExit
              processExitCode = $minimal512.receipt.processExitCode
              processExitHex = $minimal512.processExitHex
              stdoutBytes = $minimal512.receipt.stdoutBytes
              stderrBytes = $minimal512.receipt.stderrBytes
            }
            nodeMinimal2g = if ($null -eq $minimal2g) { $null } else { [ordered]@{
              hostExit = $minimal2g.hostExit
              processExitCode = $minimal2g.receipt.processExitCode
              processExitHex = $minimal2g.processExitHex
              stdoutBytes = $minimal2g.receipt.stdoutBytes
              stderrBytes = $minimal2g.receipt.stderrBytes
            }}
            nodeFull = if ($null -eq $full) { $null } else { [ordered]@{
              hostExit = $full.hostExit
              memoryLimitBytes = $selectedMemory
              processExitCode = $full.receipt.processExitCode
              processExitHex = $full.processExitHex
              stdoutBytes = $full.receipt.stdoutBytes
              stderrBytes = $full.receipt.stderrBytes
            }}
          }

          $events = Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $eventStart } -ErrorAction SilentlyContinue |
            Where-Object { $_.LevelDisplayName -in @('Error','Critical') -or $_.ProviderName -in @('Application Error','Windows Error Reporting','SideBySide') } |
            Select-Object TimeCreated, ProviderName, Id, LevelDisplayName, Message
          $events | Format-List | Out-String -Width 4096 | Set-Content "$env:RUNNER_TEMP/application-events.txt"

          if ($null -eq $full) {
            $matrix.classification = 'native-control-passed-node-loader-failed'
            $matrix | ConvertTo-Json -Depth 8 | Set-Content "$env:RUNNER_TEMP/probe-matrix.json"
            throw "Node failed before minimal JavaScript startup under both tested ceilings; native AppContainer control passed. 512 MiB=$($minimal512.processExitHex); 2 GiB=$($minimal2g.processExitHex)"
          }
          if ($full.hostExit -ne 0 -or $full.receipt.processExitCode -ne 0) {
            $matrix.classification = 'node-minimal-passed-full-adapter-failed'
            $matrix | ConvertTo-Json -Depth 8 | Set-Content "$env:RUNNER_TEMP/probe-matrix.json"
            throw "Node started but the complete adapter failed: $($full.processExitHex)"
          }

          $child = Get-Content $full.stdoutPath -Raw | ConvertFrom-Json
          if ($child.inputReceived -ne $true -or $child.allowedWrite -ne $true -or $child.allowedReadBack -ne $true) { throw 'admitted execution failed' }
          if ($child.externalReadDenied -ne $true -or $child.externalWriteDenied -ne $true) { throw 'filesystem escape was not denied' }
          if ($child.networkDenied -ne $true -or $child.networkConnected -ne $false) { throw 'loopback networking was not denied' }
          if ($child.childProcessDenied -ne $true) { throw 'child process creation was not denied' }
          if ($child.workerThreadSucceeded -ne $true -or $child.workerValue -ne 42) { throw 'worker thread execution failed' }
          if ($child.secretPresent -ne $false) { throw 'parent secret crossed into sandbox environment' }
          $expectedEnvironment = @('AXM_PROBE_PORT','LANG','LOCALAPPDATA','NODE_DISABLE_COLORS','SystemRoot','TEMP','TMP','WINDIR') | Sort-Object
          if (Compare-Object $expectedEnvironment (@($child.environmentKeys) | Sort-Object)) { throw 'sandbox environment differs from exact allowlist' }
          if ((Get-Content $external -Raw) -ne 'holder-only') { throw 'external file was modified' }
          if ((Get-Content (Join-Path (Split-Path $full.stdoutPath) 'allowed.txt') -Raw) -ne 'allowed') { throw 'allowed work output missing' }

          $matrix.classification = 'full-boundary-qualified'
          $matrix.selectedMemoryLimitBytes = $selectedMemory
          $matrix | ConvertTo-Json -Depth 8 | Set-Content "$env:RUNNER_TEMP/probe-matrix.json"

      - name: Retain checksum-sealed diagnostic receipt
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'actor-capability-windows-kernel-probe-v7'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $names = @(
            'candidate-sha.txt','product-parent.txt','compile.log','external-acl.log',
            'original-host-source-sha256.txt','patched-host-source-sha256.txt','host-binary-sha256.txt',
            'native-binary-sha256.txt','patched-host-source.cpp','native-dependencies.txt',
            'node-dependencies.txt','probe-matrix.json','application-events.txt',
            'native-512m-host.log','native-512m-host-receipt.json','native-512m-child-result.json','native-512m-child-stderr.txt',
            'node-minimal-512m-host.log','node-minimal-512m-host-receipt.json','node-minimal-512m-child-result.json','node-minimal-512m-child-stderr.txt',
            'node-minimal-2g-host.log','node-minimal-2g-host-receipt.json','node-minimal-2g-child-result.json','node-minimal-2g-child-stderr.txt',
            'node-full-host.log','node-full-host-receipt.json','node-full-child-result.json','node-full-child-stderr.txt'
          )
          foreach ($name in $names) {
            $source = Join-Path $env:RUNNER_TEMP $name
            if (Test-Path $source) { Copy-Item $source (Join-Path $root $name) }
          }
          @(
            'evidenceTier=live-windows-appcontainer-job-object-runtime-matrix'
            'productAuthority=none'
            'diagnosticAncestryAdmissible=false'
            'appContainerCapabilities=none'
            'appContainerProfileEnvironment=exact'
            'nativeControl=static-msvc-runtime'
            'nodeStartup=minimal-then-complete'
            'jobActiveProcessLimit=1'
            'jobKillOnClose=true'
            'childProcessPolicy=restricted'
            'inputRelease=after-kernel-query'
            'rawTaskInputRetained=false'
            'rawTaskOutputRetained=false'
            'graphEffect=none'
            'canonEffect=none'
            'answerEffect=none'
          ) | Set-Content (Join-Path $root 'probe-boundary.txt')
          $files = Get-ChildItem -Recurse -File $root | Where-Object Name -ne 'SHA256SUMS' | Sort-Object FullName
          $lines = foreach ($file in $files) {
            $relative = [IO.Path]::GetRelativePath((Resolve-Path $root), $file.FullName).Replace('\','/')
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            "$hash  $relative"
          }
          $lines | Set-Content (Join-Path $root 'SHA256SUMS')

      - name: Upload Windows kernel capability probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actor-capability-windows-kernel-probe-v7
          path: actor-capability-windows-kernel-probe-v7
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
