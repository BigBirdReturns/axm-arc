name: Probe ASOIAF Windows actor capability enforcement v7

on:
  pull_request:
    branches:
      - feature/asoiaf-answer-actor-capability-broker-v1
    paths:
      - '.github/workflows/probe-asoiaf-answer-actor-capability-windows-v7.yml'
      - 'diagnostics/actor-capability-windows-probe-v1/patch-host-profile-environment.mjs'
      - 'diagnostics/actor-capability-windows-probe-v1/host.cpp'
      - 'diagnostics/actor-capability-windows-probe-v1/native-adapter.cpp'
      - 'diagnostics/actor-capability-windows-probe-v1/adapter.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: probe-asoiaf-answer-actor-capability-windows-v7
  cancel-in-progress: true

jobs:
  probe:
    if: github.repository == 'BigBirdReturns/axm-arc' && github.event.pull_request.head.ref == 'diagnostic/actor-capability-windows-kernel-probe-v1'
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      PRODUCT_PARENT: 202fd8cfb03ec038ae0da2bfedb0bc5727b12e7d
    steps:
      - name: Check out exact diagnostic head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Bind exact parent and disposable surfaces
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git merge-base HEAD $env:PRODUCT_PARENT) -ne $env:PRODUCT_PARENT) {
            throw 'diagnostic head is not rooted at the terminal capability broker'
          }
          $expected = @(
            '.github/workflows/probe-asoiaf-answer-actor-capability-windows-v7.yml'
            'diagnostics/actor-capability-windows-probe-v1/adapter.js'
            'diagnostics/actor-capability-windows-probe-v1/host.cpp'
            'diagnostics/actor-capability-windows-probe-v1/native-adapter.cpp'
            'diagnostics/actor-capability-windows-probe-v1/patch-host-profile-environment.mjs'
          ) | Sort-Object
          $actual = @(git diff --name-only $env:PRODUCT_PARENT HEAD) | Sort-Object
          if (Compare-Object $expected $actual) { throw 'diagnostic path ledger differs' }
          git diff --check $env:PRODUCT_PARENT HEAD
          git rev-parse HEAD | Set-Content -NoNewline "$env:RUNNER_TEMP/candidate-sha.txt"
          $env:PRODUCT_PARENT | Set-Content -NoNewline "$env:RUNNER_TEMP/product-parent.txt"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate host, compile native pair, and retain PE dependency ledgers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'windows-capability-probe-v7'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $originalHost = Join-Path $env:GITHUB_WORKSPACE 'diagnostics/actor-capability-windows-probe-v1/host.cpp'
          $patchedHost = Join-Path $root 'host-profile-environment.cpp'
          $patcher = Join-Path $env:GITHUB_WORKSPACE 'diagnostics/actor-capability-windows-probe-v1/patch-host-profile-environment.mjs'
          & node $patcher $originalHost $patchedHost
          if ($LASTEXITCODE -ne 0) { throw "source transformation failed with $LASTEXITCODE" }
          Copy-Item $patchedHost "$env:RUNNER_TEMP/patched-host-source.cpp"

          $adapterSource = Join-Path $env:GITHUB_WORKSPACE 'diagnostics/actor-capability-windows-probe-v1/native-adapter.cpp'
          $hostExecutable = Join-Path $root 'host.exe'
          $adapterExecutable = Join-Path $root 'native-adapter.exe'
          $nodeExecutable = (Get-Command node).Source
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
          if (-not $installation) { throw 'Visual Studio C++ toolchain not found' }
          $vcvars = Join-Path $installation 'VC/Auxiliary/Build/vcvars64.bat'
          $commands = @(
            "cl.exe /nologo /std:c++20 /EHsc /W4 /DWIN32_LEAN_AND_MEAN /Fe:`"$hostExecutable`" `"$patchedHost`"",
            "cl.exe /nologo /std:c++20 /EHsc /W4 /MT /DWIN32_LEAN_AND_MEAN /Fe:`"$adapterExecutable`" `"$adapterSource`" /link /APPCONTAINER",
            "dumpbin.exe /dependents `"$nodeExecutable`" > `"$env:RUNNER_TEMP/node-dependents.txt`"",
            "dumpbin.exe /dependents `"$adapterExecutable`" > `"$env:RUNNER_TEMP/native-adapter-dependents.txt`"",
            "dumpbin.exe /headers `"$adapterExecutable`" > `"$env:RUNNER_TEMP/native-adapter-headers.txt`""
          ) -join ' && '
          & $env:ComSpec /d /s /c "call `"$vcvars`" && $commands" 2>&1 | Tee-Object "$env:RUNNER_TEMP/compile.log"
          if ($LASTEXITCODE -ne 0) { throw "native compilation or dependency inspection failed with $LASTEXITCODE" }
          if (-not (Test-Path $hostExecutable)) { throw 'compiled host missing' }
          if (-not (Test-Path $adapterExecutable)) { throw 'compiled native adapter missing' }

          $binary = [IO.File]::ReadAllBytes($adapterExecutable)
          if ($binary.Length -lt 512) { throw 'native adapter PE image is truncated' }
          $peOffset = [BitConverter]::ToInt32($binary, 0x3c)
          if ($peOffset -lt 0 -or $peOffset + 96 -gt $binary.Length) { throw 'native adapter PE offset is invalid' }
          if ([Text.Encoding]::ASCII.GetString($binary, $peOffset, 4) -ne "PE`0`0") { throw 'native adapter PE signature is invalid' }
          $optionalHeader = $peOffset + 24
          $magic = [BitConverter]::ToUInt16($binary, $optionalHeader)
          if ($magic -notin @(0x10b, 0x20b)) { throw 'native adapter optional-header magic is unsupported' }
          $dllCharacteristics = [BitConverter]::ToUInt16($binary, $optionalHeader + 0x46)
          ('0x{0:X4}' -f $dllCharacteristics) | Set-Content -NoNewline "$env:RUNNER_TEMP/native-adapter-dll-characteristics.txt"
          if (($dllCharacteristics -band 0x1000) -eq 0) {
            throw 'native adapter PE image lacks IMAGE_DLLCHARACTERISTICS_APPCONTAINER'
          }

          (Get-FileHash -Algorithm SHA256 $originalHost).Hash.ToLowerInvariant() | Set-Content -NoNewline "$env:RUNNER_TEMP/original-host-source-sha256.txt"
          (Get-FileHash -Algorithm SHA256 $patchedHost).Hash.ToLowerInvariant() | Set-Content -NoNewline "$env:RUNNER_TEMP/patched-host-source-sha256.txt"
          (Get-FileHash -Algorithm SHA256 $adapterSource).Hash.ToLowerInvariant() | Set-Content -NoNewline "$env:RUNNER_TEMP/native-adapter-source-sha256.txt"
          (Get-FileHash -Algorithm SHA256 $hostExecutable).Hash.ToLowerInvariant() | Set-Content -NoNewline "$env:RUNNER_TEMP/host-binary-sha256.txt"
          (Get-FileHash -Algorithm SHA256 $adapterExecutable).Hash.ToLowerInvariant() | Set-Content -NoNewline "$env:RUNNER_TEMP/native-adapter-binary-sha256.txt"

      - name: Exercise exact Windows kernel boundary with native threaded adapter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'windows-capability-probe-v7'
          $app = Join-Path $root 'app'
          $work = Join-Path $root 'work'
          $outside = Join-Path $root 'outside'
          New-Item -ItemType Directory -Force -Path $app, $work, $outside | Out-Null

          $nativeAdapter = Join-Path $app 'native-adapter.exe'
          Copy-Item (Join-Path $root 'native-adapter.exe') $nativeAdapter
          $ignoredArgument = Join-Path $app 'ignored-argument.js'
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'diagnostics/actor-capability-windows-probe-v1/adapter.js') $ignoredArgument
          $external = Join-Path $outside 'holder-only.txt'
          'holder-only' | Set-Content -NoNewline $external
          $userSid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          & icacls.exe $external '/inheritance:r' '/grant:r' "*${userSid}:(R,W)" | Tee-Object "$env:RUNNER_TEMP/external-acl.log"
          if ($LASTEXITCODE -ne 0) { throw 'failed to establish holder-only external file ACL' }

          $receipt = Join-Path $root 'host-receipt.json'
          $stdout = Join-Path $work 'child-result.json'
          $stderr = Join-Path $work 'child-stderr.txt'
          $profile = "AXM.NativeProbe.$env:GITHUB_RUN_ID"
          $hostExecutable = Join-Path $root 'host.exe'
          $hostArguments = @(
            '--profile', $profile,
            '--application', $nativeAdapter,
            '--script', $ignoredArgument,
            '--app-directory', $app,
            '--work-directory', $work,
            '--external-file', $external,
            '--receipt', $receipt,
            '--stdout', $stdout,
            '--stderr', $stderr,
            '--memory-limit', '536870912',
            '--timeout-ms', '30000'
          )

          $hostExit = $null
          $env:AXM_WINDOWS_PROBE_SECRET = 'must-not-cross-process-boundary'
          try {
            & $hostExecutable @hostArguments 2>&1 | Tee-Object "$env:RUNNER_TEMP/host.log"
            $hostExit = $LASTEXITCODE
          } finally {
            Remove-Item Env:AXM_WINDOWS_PROBE_SECRET -ErrorAction SilentlyContinue
            foreach ($entry in @(
              @{ Source = $receipt; Target = 'host-receipt.json' },
              @{ Source = $stdout; Target = 'child-result.json' },
              @{ Source = $stderr; Target = 'child-stderr.txt' }
            )) {
              if (Test-Path $entry.Source) {
                Copy-Item $entry.Source (Join-Path $env:RUNNER_TEMP $entry.Target)
              }
            }
          }
          if ($null -eq $hostExit) { throw 'capability host did not return an exit code' }
          if ($hostExit -ne 0) { throw "capability host failed with $hostExit" }

          $hostReceipt = Get-Content $receipt -Raw | ConvertFrom-Json
          $child = Get-Content $stdout -Raw | ConvertFrom-Json
          foreach ($name in @(
            'profileCreated','processCreatedSuspended','processInJob','tokenIsAppContainer',
            'appContainerSidExact','activeProcessLimitExact','killOnJobClose','memoryLimitExact',
            'childProcessRestricted','kernelAttestedBeforeInput','inputReleasedAfterAttestation'
          )) {
            if ($hostReceipt.$name -ne $true) { throw "host receipt assertion failed: $name" }
          }
          if ($hostReceipt.memoryLimitBytes -ne 536870912) { throw 'memory limit differs' }
          if ($hostReceipt.timedOut -ne $false -or $hostReceipt.processExitCode -ne 0) { throw 'native adapter did not complete normally' }
          if ($hostReceipt.networkConnectionAccepted -ne $false) { throw 'host accepted a forbidden loopback connection' }
          if ($hostReceipt.rawTaskInputRetained -ne $false -or $hostReceipt.rawTaskOutputRetained -ne $false) { throw 'raw custody declaration differs' }
          if ($hostReceipt.authority -ne 'none') { throw 'host receipt acquired authority' }

          if ($child.format -ne 'axm-windows-capability-probe-result/2') { throw 'wrong native child result format' }
          if ($child.adapterKind -ne 'native-static-threaded') { throw 'wrong adapter kind' }
          foreach ($name in @(
            'inputReceived','allowedWrite','allowedReadBack','externalReadDenied',
            'externalWriteDenied','networkDenied','childProcessDenied','workerThreadSucceeded'
          )) {
            if ($child.$name -ne $true) { throw "native child assertion failed: $name" }
          }
          if ($child.networkConnected -ne $false) { throw 'native adapter connected to loopback' }
          if ($child.workerValue -ne 42) { throw 'native worker thread result differs' }
          if ($child.secretPresent -ne $false) { throw 'parent secret crossed into native adapter environment' }
          $expectedEnvironment = @('AXM_PROBE_PORT','LANG','LOCALAPPDATA','NODE_DISABLE_COLORS','SystemRoot','TEMP','TMP','WINDIR') | Sort-Object
          if (Compare-Object $expectedEnvironment (@($child.environmentKeys) | Sort-Object)) { throw 'native adapter environment differs from exact allowlist' }
          if ((Get-Content $external -Raw) -ne 'holder-only') { throw 'external file was modified' }
          if ((Get-Content (Join-Path $work 'allowed.txt') -Raw) -ne 'allowed') { throw 'allowed work output missing' }

      - name: Retain checksum-sealed diagnostic receipt
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'actor-capability-windows-kernel-probe-v7'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          foreach ($name in @(
            'candidate-sha.txt','product-parent.txt','compile.log','host.log','external-acl.log',
            'original-host-source-sha256.txt','patched-host-source-sha256.txt',
            'native-adapter-source-sha256.txt','host-binary-sha256.txt','native-adapter-binary-sha256.txt',
            'node-dependents.txt','native-adapter-dependents.txt','native-adapter-headers.txt',
            'native-adapter-dll-characteristics.txt','patched-host-source.cpp',
            'host-receipt.json','child-result.json','child-stderr.txt'
          )) {
            $source = Join-Path $env:RUNNER_TEMP $name
            if (Test-Path $source) { Copy-Item $source (Join-Path $root $name) }
          }
          @(
            'evidenceTier=live-windows-native-appcontainer-job-object-probe'
            'productAuthority=none'
            'diagnosticAncestryAdmissible=false'
            'adapterKind=native-static-threaded'
            'nodeBootstrapQualified=false'
            'peAppContainerRequired=true'
            'appContainerCapabilities=none'
            'appContainerProfileEnvironment=exact'
            'jobActiveProcessLimit=1'
            'jobKillOnClose=true'
            'childProcessPolicy=restricted'
            'inputRelease=after-kernel-query'
            'rawTaskInputRetained=false'
            'rawTaskOutputRetained=false'
            'graphEffect=none'
            'canonEffect=none'
            'answerEffect=none'
          ) | Set-Content (Join-Path $root 'probe-boundary.txt')
          $files = Get-ChildItem -Recurse -File $root | Where-Object Name -ne 'SHA256SUMS' | Sort-Object FullName
          $lines = foreach ($file in $files) {
            $relative = [IO.Path]::GetRelativePath((Resolve-Path $root), $file.FullName).Replace('\','/')
            $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLowerInvariant()
            "$hash  $relative"
          }
          $lines | Set-Content (Join-Path $root 'SHA256SUMS')

      - name: Upload Windows native kernel capability probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actor-capability-windows-kernel-probe-v7
          path: actor-capability-windows-kernel-probe-v7
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
