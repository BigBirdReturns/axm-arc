name: Arc product parity

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/game/**'
      - 'src/i18n/**'
      - 'src/godscar/**'
      - 'src/dark-tomb/**'
      - 'src/common-ship/**'
      - 'src/source-planes/**'
      - 'src/arcs/**'
      - 'cartridges/**'
      - 'tools/build-godscar-reference.ts'
      - 'tools/build-dark-tomb-reference.ts'
      - 'tests/game/**'
      - 'tests/i18n/**'
      - 'tests/sim/**'
      - 'tests/godscar/**'
      - 'tests/dark-tomb/**'
      - 'tests/common-ship/**'
      - 'tests/source-planes/**'
      - 'docs/**'
      - 'README.md'
      - 'STATUS.md'
      - 'RECONCILIATION.md'
      - '.github/workflows/product-parity.yml'

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record exact candidate identity
        run: git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Rebuild canonical creator artifacts
        run: |
          npm run build:godscar-reference
          npm run build:dark-tomb-reference
          git diff --exit-code -- \
            cartridges/kind-gods-of-ilyon.pocket.json \
            cartridges/kind-gods-of-ilyon.arc.json \
            cartridges/lamp-district.tomb.json \
            cartridges/lamp-district.arc.json
      - name: Authoring, campaign, and source-plane parity
        run: >-
          npm test --
          tests/game/product-parity.test.ts
          tests/game/authoring-audit.test.ts
          tests/game/godscar-guided.test.ts
          tests/game/godscar-forge.test.ts
          tests/game/dark-tomb-forge.test.ts
          tests/game/sensory-prefs.test.ts
          tests/game/designer-edit.test.ts
          tests/game/designer-storage.test.ts
          tests/game/workshop.test.ts
          tests/game/workshop-playtest.test.ts
          tests/i18n/locale.test.ts
          tests/sim/first-charter-campaign.test.ts
          tests/sim/karazhan-sim.test.ts
          tests/sim/ilyon-campaign.test.ts
          tests/sim/lamp-district-campaign.test.ts
          tests/godscar/godscar.test.ts
          tests/dark-tomb/dark-tomb.test.ts
          tests/dark-tomb/lamp-district.test.ts
          tests/common-ship/common-ship.test.ts
          tests/source-planes/registry.test.ts
      - run: npm test
      - run: npm run build
