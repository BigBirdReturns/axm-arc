name: Publish and seal ASOIAF credential deployment v1

on:
  push:
    branches:
      - observer/asoiaf-deployment-publisher-v1
    paths:
      - '.github/workflows/publish-asoiaf-credential-deployment-v1.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: publish-asoiaf-credential-deployment-v1
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'BigBirdReturns/axm-arc'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ENROLLMENT_PR: '260'
      PAYLOAD_ISSUE: '261'
      ENROLLMENT_BRANCH: feature/asoiaf-answer-desk-transport-enrollment-v1
      DEPLOYMENT_BRANCH: feature/asoiaf-answer-credential-deployment-v1
      DRIVE_FILE_ID: 1C_rsL6BgMXJnY9eSblaXO2rtuP9SjFDL
      TERMINAL_MARKER: ASOIAF_CREDENTIAL_DEPLOYMENT_TERMINAL_RECEIPT_V1
    steps:
      - name: Check out publisher custody
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Wait for terminal governed enrollment
        id: enrollment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/enrollment-paths.txt" <<'EOF'
          .github/workflows/asoiaf-answer-desk-transport-enrollment.yml
          docs/ASOIAF_ANSWER_DESK_TRANSPORT_ENROLLMENT.md
          package.json
          tests/fixtures/emit-asoiaf-answer-desk-transport-enrollment-input.ts
          tests/narrative/canon/asoiaf-answer-desk-transport-enrollment.test.ts
          tools/asoiaf-answer-desk-transport-enrollment.ts
          tools/lib/asoiaf-answer-desk-transport-enrollment.ts
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/enrollment-paths.txt"
          sort -o "$RUNNER_TEMP/enrollment-paths.txt" "$RUNNER_TEMP/enrollment-paths.txt"

          ready=false
          for attempt in $(seq 1 240); do
            gh api "repos/$GITHUB_REPOSITORY/pulls/$ENROLLMENT_PR" > "$RUNNER_TEMP/enrollment-pr.json"
            gh api "repos/$GITHUB_REPOSITORY/issues/$ENROLLMENT_PR/comments?per_page=100" > "$RUNNER_TEMP/enrollment-comments.json"
            gh api "repos/$GITHUB_REPOSITORY/issues/$PAYLOAD_ISSUE" > "$RUNNER_TEMP/payload-issue.json"
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$ENROLLMENT_PR/files?per_page=100" --slurp \
              | jq -r 'add | map(.filename) | sort | .[]' > "$RUNNER_TEMP/enrollment-actual-paths.txt"

            enrollment_sha="$(jq -r .head.sha "$RUNNER_TEMP/enrollment-pr.json")"
            terminal_receipt="$(jq '[.[] | select((.body // "") | test("ASOIAF_ENROLLMENT_TERMINAL_RECEIPT_V[0-9]+"))] | length' "$RUNNER_TEMP/enrollment-comments.json")"
            if \
              test "$(jq -r .state "$RUNNER_TEMP/enrollment-pr.json")" = open \
              && test "$(jq -r .draft "$RUNNER_TEMP/enrollment-pr.json")" = true \
              && test "$(jq -r .merged "$RUNNER_TEMP/enrollment-pr.json")" = false \
              && test "$(jq -r .head.ref "$RUNNER_TEMP/enrollment-pr.json")" = "$ENROLLMENT_BRANCH" \
              && test "$(jq -r .state "$RUNNER_TEMP/payload-issue.json")" = closed \
              && test "$terminal_receipt" -gt 0 \
              && diff -u "$RUNNER_TEMP/enrollment-paths.txt" "$RUNNER_TEMP/enrollment-actual-paths.txt"; then
              ready=true
              break
            fi
            sleep 15
          done
          if test "$ready" != true; then
            gh pr comment "$ENROLLMENT_PR" --repo "$GITHUB_REPOSITORY" --body \
              'Credential-deployment publisher timed out before terminal governed enrollment custody. No deployment implementation or PR was published.'
            exit 1
          fi
          echo "enrollment_sha=$enrollment_sha" >> "$GITHUB_OUTPUT"

      - name: Download and validate the sealed seven-surface deployment candidate
        id: candidate
        env:
          ENROLLMENT_SHA: ${{ steps.enrollment.outputs.enrollment_sha }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/asoiaf-answer-credential-deployment-candidate.zip"
          curl -fL --retry 6 --retry-all-errors --connect-timeout 20 \
            "https://drive.google.com/uc?export=download&id=$DRIVE_FILE_ID" \
            -o "$archive"
          archive_sha="sha256:$(sha256sum "$archive" | awk '{print $1}')"
          archive_bytes="$(stat -c '%s' "$archive")"
          unzip -t "$archive"

          unpack="$RUNNER_TEMP/deployment-candidate"
          mkdir -p "$unpack"
          unzip -q "$archive" -d "$unpack"
          candidate="$(find "$unpack" -type f -name MANIFEST.json -printf '%h\n' | head -n1)"
          test -n "$candidate"
          test -d "$candidate/source"
          (cd "$candidate" && sha256sum -c SHA256SUMS)
          manifest="$candidate/MANIFEST.json"

          test "$(jq -r .format "$manifest")" = 'axm-asoiaf-answer-credential-deployment-candidate/1'
          test "$(jq -r .repository "$manifest")" = "$GITHUB_REPOSITORY"
          test "$(jq -r .permanentSurfaceCount "$manifest")" = '7'
          test "$(jq -r '.intendedBranch // .branch' "$manifest")" = "$DEPLOYMENT_BRANCH"

          cat > "$RUNNER_TEMP/deployment-paths.txt" <<'EOF'
          .github/workflows/asoiaf-answer-credential-deployment.yml
          docs/ASOIAF_ANSWER_TRANSPORT_CREDENTIAL_DEPLOYMENT.md
          package.json
          tests/fixtures/emit-asoiaf-answer-credential-deployment-input.ts
          tests/narrative/canon/asoiaf-answer-credential-deployment.test.ts
          tools/asoiaf-answer-credential-deployment.ts
          tools/lib/asoiaf-answer-credential-deployment.ts
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/deployment-paths.txt"
          sort -o "$RUNNER_TEMP/deployment-paths.txt" "$RUNNER_TEMP/deployment-paths.txt"
          jq -r '.permanentSurfaces[].path' "$manifest" | sort > "$RUNNER_TEMP/manifest-paths.txt"
          diff -u "$RUNNER_TEMP/deployment-paths.txt" "$RUNNER_TEMP/manifest-paths.txt"

          while IFS=$'\t' read -r file expected_sha expected_blob; do
            source_file="$candidate/source/$file"
            test -f "$source_file"
            test "sha256:$(sha256sum "$source_file" | awk '{print $1}')" = "$expected_sha"
            test "$(git hash-object "$source_file")" = "$expected_blob"
          done < <(jq -r '.permanentSurfaces[] | [.path,.sha256,.gitBlobSha1] | @tsv' "$manifest")

          CANDIDATE="$candidate" ENROLLMENT_SHA="$ENROLLMENT_SHA" python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          candidate = Path(os.environ['CANDIDATE'])
          enrollment = json.loads(subprocess.check_output(
              ['git', 'show', f'{os.environ["ENROLLMENT_SHA"]}:package.json'],
              text=True,
          ))
          deployment = json.loads((candidate / 'source/package.json').read_text())
          expected = dict(enrollment)
          expected_scripts = dict(enrollment['scripts'])
          expected_scripts['asoiaf:answer-credential-deployment'] = 'vite-node tools/asoiaf-answer-credential-deployment.ts --'
          expected['scripts'] = expected_scripts
          if deployment != expected:
              raise SystemExit('deployment package differs from enrollment by more than the exact operator registration')
          PY

          if find "$candidate/source" -type f \( -name '*.key' -o -name '*.crt' -o -name '*.pem' -o -name '*.csr' -o -name '*.p12' -o -name '*.pfx' \) | grep -q .; then
            echo 'deployment candidate contains secret-bearing paths' >&2
            exit 1
          fi
          if grep -R -I -E -- '-----BEGIN (CERTIFICATE|PRIVATE KEY|RSA PRIVATE KEY|EC PRIVATE KEY|CERTIFICATE REQUEST)-----|pkcs11:|providerPin|privateKeyBytes|rawHardwareKeyReference|rawKeyHandle' "$candidate/source"; then
            echo 'deployment candidate contains forbidden credential material' >&2
            exit 1
          fi

          echo "candidate_root=$candidate" >> "$GITHUB_OUTPUT"
          echo "archive_sha=$archive_sha" >> "$GITHUB_OUTPUT"
          echo "archive_bytes=$archive_bytes" >> "$GITHUB_OUTPUT"

      - name: Publish one exact deployment implementation commit
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          ENROLLMENT_SHA: ${{ steps.enrollment.outputs.enrollment_sha }}
          CANDIDATE_ROOT: ${{ steps.candidate.outputs.candidate_root }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$ENROLLMENT_BRANCH" "$DEPLOYMENT_BRANCH" 2>/dev/null || git fetch origin "$ENROLLMENT_BRANCH"
          existing="$(git ls-remote --heads origin "$DEPLOYMENT_BRANCH" | awk '{print $1}')"
          if test -n "$existing" && test "$existing" != "$ENROLLMENT_SHA"; then
            git checkout --detach "$existing"
            complete=true
            while IFS=$'\t' read -r file _ expected_blob; do
              if ! test -f "$file" || test "$(git hash-object "$file")" != "$expected_blob"; then
                complete=false
              fi
            done < <(jq -r '.permanentSurfaces[] | [.path,.sha256,.gitBlobSha1] | @tsv' "$CANDIDATE_ROOT/MANIFEST.json")
            if test "$complete" != true; then
              echo "existing deployment branch $existing is neither the enrollment head nor the sealed candidate" >&2
              exit 1
            fi
            final_sha="$existing"
          else
            git checkout -B "$DEPLOYMENT_BRANCH" "$ENROLLMENT_SHA"
            while IFS=$'\t' read -r file _ expected_blob; do
              source_file="$CANDIDATE_ROOT/source/$file"
              mkdir -p "$(dirname "$file")"
              cp "$source_file" "$file"
              test "$(git hash-object "$file")" = "$expected_blob"
            done < <(jq -r '.permanentSurfaces[] | [.path,.sha256,.gitBlobSha1] | @tsv' "$CANDIDATE_ROOT/MANIFEST.json")
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git diff --cached --check
            git diff --cached --name-only "$ENROLLMENT_SHA" -- | sort > "$RUNNER_TEMP/deployment-actual-paths.txt"
            diff -u "$RUNNER_TEMP/deployment-paths.txt" "$RUNNER_TEMP/deployment-actual-paths.txt"
            git commit -m 'Deploy governed ASOIAF transport credentials'
            final_sha="$(git rev-parse HEAD)"
            git push --force-with-lease=refs/heads/$DEPLOYMENT_BRANCH:${existing:-$ENROLLMENT_SHA} origin HEAD:"$DEPLOYMENT_BRANCH" 2>/dev/null \
              || git push origin HEAD:"$DEPLOYMENT_BRANCH"
          fi
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"

      - name: Open or refresh the draft deployment PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.publish.outputs.final_sha }}
          ARCHIVE_SHA: ${{ steps.candidate.outputs.archive_sha }}
          ARCHIVE_BYTES: ${{ steps.candidate.outputs.archive_bytes }}
        shell: bash
        run: |
          set -euo pipefail
          pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --state all --head "$DEPLOYMENT_BRANCH" --json number --jq '.[0].number // empty')"
          if test -z "$pr_number"; then
            gh pr create --repo "$GITHUB_REPOSITORY" --draft \
              --base "$ENROLLMENT_BRANCH" --head "$DEPLOYMENT_BRANCH" \
              --title 'Deploy governed ASOIAF answer transport credentials' \
              --body "This stacked draft deploys already governed transport certificates to already existing device-bound keys. Exact-head qualification is in progress. Sealed source candidate: \`$ARCHIVE_SHA\`, ${ARCHIVE_BYTES} bytes. No certificate, private key, raw provider handle, PIN, token, task, graph, canon, review, answer, or runtime-transport authority is carried by the deployment plane." >/dev/null
            pr_number="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$DEPLOYMENT_BRANCH" --json number --jq '.[0].number')"
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" > "$RUNNER_TEMP/deployment-pr.json"
          test "$(jq -r .state "$RUNNER_TEMP/deployment-pr.json")" = open
          test "$(jq -r .draft "$RUNNER_TEMP/deployment-pr.json")" = true
          test "$(jq -r .merged "$RUNNER_TEMP/deployment-pr.json")" = false
          test "$(jq -r .base.ref "$RUNNER_TEMP/deployment-pr.json")" = "$ENROLLMENT_BRANCH"
          test "$(jq -r .head.sha "$RUNNER_TEMP/deployment-pr.json")" = "$FINAL_SHA"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Wait for stable successful exact-head deployment qualification
        id: runs
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.publish.outputs.final_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          workflow_name="$(git show "$FINAL_SHA:.github/workflows/asoiaf-answer-credential-deployment.yml" | sed -n 's/^name:[[:space:]]*//p' | head -n1)"
          test -n "$workflow_name"
          ready=false
          for attempt in $(seq 1 260); do
            gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs" -f head_sha="$FINAL_SHA" -f per_page=100 > "$RUNNER_TEMP/deployment-runs.json"
            failures="$(jq --arg sha "$FINAL_SHA" '[.workflow_runs[] | select(.head_sha == $sha and (.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "action_required"))] | length' "$RUNNER_TEMP/deployment-runs.json")"
            if test "$failures" != 0; then
              gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Credential-deployment qualification found a failed exact-head workflow on \`$FINAL_SHA\`. No terminal qualification claim is made."
              exit 1
            fi
            run_id="$(jq -r --arg sha "$FINAL_SHA" --arg name "$workflow_name" '[.workflow_runs[] | select(.head_sha == $sha and .name == $name and .status == "completed" and .conclusion == "success")] | sort_by(.run_number) | last | .id // empty' "$RUNNER_TEMP/deployment-runs.json")"
            pending="$(jq --arg sha "$FINAL_SHA" '[.workflow_runs[] | select(.head_sha == $sha and (.status == "queued" or .status == "in_progress" or .status == "requested" or .status == "waiting" or .status == "pending"))] | length' "$RUNNER_TEMP/deployment-runs.json")"
            if test -n "$run_id" && test "$pending" = 0; then ready=true; break; fi
            sleep 15
          done
          if test "$ready" != true; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Credential-deployment publisher timed out waiting for stable exact-head qualification on \`$FINAL_SHA\`."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Independently verify the deployment qualification artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.publish.outputs.final_sha }}
          RUN_ID: ${{ steps.runs.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/deployment-artifacts.json"
          jq -c '[.artifacts[] | select(.expired == false and (.name | test("credential.*deployment.*qualification"; "i")))] | sort_by(.created_at) | last // empty' "$RUNNER_TEMP/deployment-artifacts.json" > "$RUNNER_TEMP/deployment-artifact.json"
          test -s "$RUNNER_TEMP/deployment-artifact.json"
          artifact_id="$(jq -r .id "$RUNNER_TEMP/deployment-artifact.json")"
          artifact_digest="$(jq -r .digest "$RUNNER_TEMP/deployment-artifact.json")"
          artifact_size="$(jq -r .size_in_bytes "$RUNNER_TEMP/deployment-artifact.json")"
          zip="$RUNNER_TEMP/deployment-qualification.zip"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$zip"
          test "sha256:$(sha256sum "$zip" | awk '{print $1}')" = "$artifact_digest"
          unzip -t "$zip"
          unpack="$RUNNER_TEMP/deployment-artifact"
          mkdir -p "$unpack"
          unzip -q "$zip" -d "$unpack"
          root="$(find "$unpack" -type f -name SHA256SUMS -printf '%h\n' | head -n1)"
          test -n "$root"
          candidate_file="$(find "$root" -type f -name candidate-sha.txt -print -quit)"
          test -n "$candidate_file"
          test "$(tr -d '\r\n' < "$candidate_file")" = "$FINAL_SHA"
          (cd "$root" && sha256sum -c SHA256SUMS) | tee "$RUNNER_TEMP/deployment-artifact-hashes.log"
          if find "$root" -type f \( -name '*.key' -o -name '*.crt' -o -name '*.pem' -o -name '*.csr' -o -name '*.p12' -o -name '*.pfx' \) | grep -q .; then exit 1; fi
          if grep -R -I -E -- '-----BEGIN (CERTIFICATE|PRIVATE KEY|RSA PRIVATE KEY|EC PRIVATE KEY|CERTIFICATE REQUEST)-----|pkcs11:|providerPin|privateKeyBytes|rawHardwareKeyReference|rawKeyHandle' "$root"; then exit 1; fi
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$artifact_digest" >> "$GITHUB_OUTPUT"
          echo "artifact_size=$artifact_size" >> "$GITHUB_OUTPUT"

      - name: Publish authoritative deployment record
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          FINAL_SHA: ${{ steps.publish.outputs.final_sha }}
          RUN_ID: ${{ steps.runs.outputs.run_id }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact_digest }}
          ARTIFACT_SIZE: ${{ steps.artifact.outputs.artifact_size }}
          ARCHIVE_SHA: ${{ steps.candidate.outputs.archive_sha }}
          ARCHIVE_BYTES: ${{ steps.candidate.outputs.archive_bytes }}
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/deployment-body.md"
          cat > "$body" <<EOF
          This stacked draft deploys an already governed, externally issued transport certificate to an already existing device-bound key. The exact qualified head is \`${FINAL_SHA}\`, based directly on terminal enrollment branch \`${ENROLLMENT_BRANCH}\`. The final diff contains exactly seven permanent surfaces: workflow, operating documentation, package registration, qualification fixture, focused suite, operator, and typed deployment core.

          A device record binds platform class, trust domain, permitted provider classes, and the device-agent verification key. An opaque key reference retains provider class, provider key identity, public SPKI and fingerprint, custody class, and a SHA-256 digest of the opaque handle. Raw handles, private keys, provider PINs, passwords, tokens, sessions, and provider configuration paths are excluded.

          A deployment plan binds the exact device, key reference, service, governed enrollment policy and request, issuance order and receipt, optional runtime-admission link, certificate and issuer fingerprints, public-key fingerprint, usage, principal, actor role, predecessor activation, and bounded installation, activation, rollback, and retirement schedule. Successor deployment must preserve device, service, usage, principal, and role, identify the exact predecessor certificate, activation, and deployment plan, use a different certificate, and activate during the predecessor overlap interval.

          Installation transiently verifies issuer signature, extended-key usage, certificate and issuer fingerprints, certificate-to-key public-key parity, validity, schedule, and provider/device custody. The device agent signs a canonical installation statement. Activation requires two independent signatures over the same challenge-bound statement: the credential key proves possession of the issued leaf key, and the device agent binds that proof to the device, provider, installation, service, predecessor, activation time, and rollback deadline. A provider success string cannot replace either signature.

          Rollback is append-only, predecessor-specific, and bounded by the rollback deadline. It returns projected service state to the named predecessor activation without deleting the successor installation or activation. The deterministic state projection is rebuilt from append-only device, key, plan, installation, activation, and rollback records.

          The sealed source candidate is ${ARCHIVE_BYTES} bytes with digest \`${ARCHIVE_SHA}\`. Permanent exact-head workflow run \`${RUN_ID}\` passed operator registration, strict TypeScript, the focused deployment and inherited stack suites, the complete command-line predecessor-to-successor lifecycle and exact replay, the complete repository regression, and the production build. Qualification artifact \`${ARTIFACT_ID}\` is ${ARTIFACT_SIZE} bytes with ZIP digest \`${ARTIFACT_DIGEST}\`; independent download, ZIP integrity, internal \`SHA256SUMS\`, exact-head binding, and secret-material scans passed.

          The deployment plane does not generate, export, approve, issue, enroll, admit, register, route, or use credentials for an answer-work task. The evidence tier is typed deployment implementation, device-agent and credential-key proof custody, exact replay, exact-head workflow qualification, independent artifact verification, complete regression, and production build. The control question is whether every active transport credential can disclose which governed enrollment, externally issued leaf, device, non-exportable key reference, provider, signed installation, credential-key proof, device-agent attestation, predecessor, rollback window, and deterministic state produced it while the deployment plane remains unable to acquire issuer, transport, task, graph, canon, review, or answer authority.
          EOF
          sed -i 's/^          //' "$body"
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$body"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body \
            "ASOIAF_CREDENTIAL_DEPLOYMENT_TERMINAL_RECEIPT_V1\n\nCredential deployment is terminally qualified on exact head \`$FINAL_SHA\`. Permanent workflow run \`$RUN_ID\` and the stable exact-head workflow matrix passed. Artifact \`$ARTIFACT_ID\` is $ARTIFACT_SIZE bytes with ZIP digest \`$ARTIFACT_DIGEST\`; independent artifact integrity, internal hash, exact-head, and secret-material verification passed. The PR remains open, draft, unmerged, and stacked directly on terminal governed enrollment."

      - name: Remove the disposable publisher branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/observer/asoiaf-deployment-publisher-v1"
