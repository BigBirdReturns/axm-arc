name: Pulse terminal ASOIAF credential broker observer v2

on:
  push:
    branches:
      - observer/asoiaf-credential-broker-terminal-v2
    paths:
      - '.github/workflows/pulse-asoiaf-credential-broker-terminal-v2.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pulse-asoiaf-credential-broker-terminal-v2
  cancel-in-progress: true

jobs:
  pulse:
    if: github.repository == 'BigBirdReturns/axm-arc' && github.ref_name == 'observer/asoiaf-credential-broker-terminal-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Publish observer pulse and dispatch full observer
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_PR: '265'
          TARGET_SHA: d7b6c36a2c518d2ea3dfdbf02a8a69c95175e891
        shell: bash
        run: |
          set -euo pipefail
          gh pr comment "$TARGET_PR" --repo "$GITHUB_REPOSITORY" --body \
            "ASOIAF_CREDENTIAL_BROKER_OBSERVER_PULSE_V1\n\nObserver pulse workflow \`${GITHUB_RUN_ID}\` is active for exact target head \`${TARGET_SHA}\`. It is dispatching the full terminal observer; this pulse makes no qualification claim."
          gh workflow run observe-asoiaf-credential-broker-terminal-v2.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref observer/asoiaf-credential-broker-terminal-v2
