name: Pulse structural loopback TLS Windows fixture repair

on:
  push:
    branches:
      - observer/asoiaf-loopback-tls-terminal-v1
    paths:
      - '.github/workflows/pulse-loopback-tls-windows-npx-repair.yml'

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write

jobs:
  pulse:
    if: github.repository == 'BigBirdReturns/axm-arc'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_WORKFLOW: _temp-repair-loopback-tls-windows-npx.yml
      TARGET_BRANCH: feature/asoiaf-answer-credential-broker-loopback-tls-v1
      TARGET_SHA: 43b0547765b4e9aed77eef2b1171375f58dfe798
    steps:
      - name: Publish exact repair status
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/pulse"
          mkdir -p "$root"
          run_id=''
          for _ in $(seq 1 90); do
            gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW/runs" \
              -f branch="$TARGET_BRANCH" \
              -f event=push \
              -f per_page=100 > "$root/runs.json"
            jq -c --arg sha "$TARGET_SHA" '
              .workflow_runs
              | map(select(.head_sha == $sha and .event == "push"))
              | sort_by(.run_number)
              | last // empty
            ' "$root/runs.json" > "$root/run.json"
            if [ -s "$root/run.json" ]; then
              run_id="$(jq -r '.id' "$root/run.json")"
              [ "$(jq -r '.status' "$root/run.json")" = completed ] && break
            fi
            sleep 10
          done
          test -n "$run_id"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
            > "$root/jobs.json"
          {
            echo 'TEMP_LOOPBACK_TLS_WINDOWS_FIXTURE_REPAIR_V7_PULSE'
            echo
            echo "Repair run \`$run_id\` on \`$TARGET_SHA\`: status \`$(jq -r '.status' "$root/run.json")\`, conclusion \`$(jq -r '.conclusion' "$root/run.json")\`."
            echo
            echo 'Jobs:'
            echo '```text'
            jq -r '.jobs[] | [.name, .status, (.conclusion // "pending"), (.id|tostring)] | @tsv' "$root/jobs.json"
            echo '```'
          } > "$root/comment.md"
          gh pr comment 282 --repo "$GITHUB_REPOSITORY" --body-file "$root/comment.md"
