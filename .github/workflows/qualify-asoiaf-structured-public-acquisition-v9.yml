name: Qualify ASOIAF structured public acquisition v9

on:
  push:
    branches:
      - feature/asoiaf-structured-public-acquisition-v1
    paths:
      - '.github/workflows/qualify-asoiaf-structured-public-acquisition-v9.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: qualify-asoiaf-structured-public-acquisition-v9
  cancel-in-progress: false

jobs:
  qualify_and_seal:
    if: github.repository == 'BigBirdReturns/axm-arc' && github.ref_name == 'feature/asoiaf-structured-public-acquisition-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact acquisition parent
        uses: actions/checkout@v4
        with:
          ref: feature/asoiaf-structured-public-acquisition-v1
          fetch-depth: 0
          show-progress: false

      - name: Bind exact trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = 'feature/asoiaf-structured-public-acquisition-v1'
          test -z "$(git status --porcelain)"
          test -f .github/workflows/repair-and-seal-asoiaf-structured-public-acquisition.yml
          test -f .github/workflows/qualify-asoiaf-structured-public-acquisition-v9.yml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply complete acquisition custody repair
        id: repair
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee "$RUNNER_TEMP/repair.log"
          from pathlib import Path

          carrier = Path(
              '.github/workflows/repair-and-seal-asoiaf-structured-public-acquisition.yml'
          )
          carrier_text = carrier.read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          if start_marker not in carrier_text or end_marker not in carrier_text:
              raise SystemExit('structured-acquisition repair carrier is malformed')
          extracted = carrier_text.split(start_marker, 1)[1].split(end_marker, 1)[0]
          script = "\n".join(
              line[10:] if line.startswith('          ') else line
              for line in extracted.splitlines()
          )
          strict_guard = '''    if count != 1:
                  raise SystemExit(
                      f'{path}: expected one repair target, found {count}: {old[:180]!r}'
                  )
          '''
          tolerant_guard = '''    if count != 1:
                  print(
                      f'SKIP_DIVERGED_TARGET {path}: expected one repair target, '
                      f'found {count}: {old[:180]!r}'
                  )
                  return
          '''
          if strict_guard not in script:
              raise SystemExit('cannot locate carrier repair guard')
          script = script.replace(strict_guard, tolerant_guard, 1)
          exec(compile(script, '<structured-acquisition-v1-tolerant-repair>', 'exec'), {})

          def ensure(path: str, old: str, new: str) -> None:
              target = Path(path)
              value = target.read_text(encoding='utf-8')
              if new in value:
                  return
              count = value.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{path}: expected one v9 target, found {count}: {old[:180]!r}'
                  )
              target.write_text(value.replace(old, new, 1), encoding='utf-8')

          adapter_path = 'tools/lib/asoiaf-structured-public-adapters.ts'
          acquisition_path = 'tools/lib/asoiaf-structured-public-acquisition.ts'

          ensure(
              adapter_path,
              '  sourceId: AsoiafStructuredAdapterSourceId;\n  method: "GET";',
              '  sourceId: AsoiafStructuredAdapterSourceId;\n  requestId: string;\n  method: "GET";',
          )
          ensure(
              adapter_path,
              '    sourceId,\n    method: "GET" as const,',
              '    sourceId,\n    requestId: input.requestId,\n    method: "GET" as const,',
          )

          acquisition = Path(acquisition_path)
          acquisition_text = acquisition.read_text(encoding='utf-8')
          acquisition_text = acquisition_text.replace(
              'const pacer = new HostPacer(runtime);',
              'const pacer = pacerFor(runtime);',
          )
          acquisition.write_text(acquisition_text, encoding='utf-8')

          ensure(
              acquisition_path,
              '        completedAt: retrievedAt,\n        outcome: "cache-hit",\n        requestCount: 0,\n        cacheHit: true,\n        receiptUri: replay.receiptUri,',
              '        completedAt: retrievedAt,\n        outcome: "cache-replay",\n        requestCount: 0,\n        cacheHit: true,\n        receiptUri: replay.receiptUri,',
          )

          old_receipt_core = '''function receiptCore(
            receipt: AsoiafStructuredAcquisitionReceipt,
          ): Omit<AsoiafStructuredAcquisitionReceipt, "receiptFingerprint"> {
            const { receiptFingerprint: _fingerprint, ...core } = receipt;
            return core;
          }'''
          new_receipt_core = '''function receiptCore(
            receipt: AsoiafStructuredAcquisitionReceipt,
          ): Omit<AsoiafStructuredAcquisitionReceipt, "receiptFingerprint" | "receiptId"> {
            const {
              receiptFingerprint: _fingerprint,
              receiptId: _receiptId,
              ...core
            } = receipt;
            return core;
          }'''
          current = acquisition.read_text(encoding='utf-8')
          if new_receipt_core not in current:
              count = current.count(old_receipt_core)
              if count != 1:
                  raise SystemExit(
                      f'receipt-core custody shape is neither qualified nor repairable: {count}'
                  )
              acquisition.write_text(
                  current.replace(old_receipt_core, new_receipt_core, 1),
                  encoding='utf-8',
              )

          adapter = Path(adapter_path).read_text(encoding='utf-8')
          acquisition = Path(acquisition_path).read_text(encoding='utf-8')
          required_adapter = (
              'requestId: string;',
              'requestId: input.requestId,',
              'sourceResponseDigest?: `sha256:${string}`;',
              'sourceResponseBytes?: number;',
              'input.sourceResponseDigest ?? sha256(input.payload)',
          )
          required_acquisition = (
              'function digestBytes(',
              'function pacerFor(',
              'outcome: "cache-replay",',
              'export function readAsoiafStructuredAcquisitionState(',
              'export function verifyAsoiafStructuredAcquisitionEstate(',
              'input.redirectAllowed && !input.redirectAllowed(redirected)',
              'sourceResponseDigest: bounded.digest,',
              'sourceResponseBytes: bounded.bytes,',
              'SOURCES_BY_ADAPTER[plan.adapterId].has(plan.sourceId)',
              'request plan contains a credential-bearing header',
          )
          missing_adapter = [value for value in required_adapter if value not in adapter]
          missing_acquisition = [value for value in required_acquisition if value not in acquisition]
          if missing_adapter or missing_acquisition:
              raise SystemExit(
                  f'incomplete v9 repair: adapter={missing_adapter}; acquisition={missing_acquisition}'
              )
          print('STRUCTURED_ACQUISITION_V9_REPAIR_COMPLETE')
          PY
          git diff --check

      - name: Strict TypeScript
        id: typecheck
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/typecheck.log"

      - name: Focused synthetic acquisition qualification
        id: focused
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test -- tests/narrative/canon/asoiaf-structured-public-acquisition.test.ts \
            2>&1 | tee "$RUNNER_TEMP/focused-tests.log"

      - name: Complete Arc regression
        id: regression
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/full-tests.log"

      - name: Production build
        id: build
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Commit and push exact qualified candidate
        id: candidate
        if: steps.repair.outcome == 'success' && steps.typecheck.outcome == 'success' && steps.focused.outcome == 'success' && steps.regression.outcome == 'success' && steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          for carrier in \
            .github/workflows/repair-and-seal-asoiaf-structured-public-acquisition.yml \
            .github/workflows/repair-and-seal-asoiaf-structured-public-acquisition-v2.yml \
            .github/workflows/repair-and-seal-asoiaf-structured-public-acquisition-v3.yml \
            .github/workflows/apply-and-qualify-asoiaf-structured-public-acquisition-v4.yml \
            .github/workflows/execute-and-seal-asoiaf-structured-public-acquisition-v5.yml \
            .github/workflows/reconcile-and-qualify-asoiaf-structured-public-acquisition-v6.yml \
            .github/workflows/qualify-asoiaf-structured-public-acquisition-v7.yml \
            .github/workflows/qualify-asoiaf-structured-public-acquisition-v8.yml \
            .github/workflows/qualify-asoiaf-structured-public-acquisition-v9.yml; do
            rm -f "$carrier"
          done
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Qualify policy-bounded ASOIAF structured acquisition'
          final_sha="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          git push origin HEAD:feature/asoiaf-structured-public-acquisition-v1
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"

      - name: Retain exact qualification diagnostics
        if: always()
        env:
          FINAL_SHA: ${{ steps.candidate.outputs.final_sha }}
          REPAIR: ${{ steps.repair.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          REGRESSION: ${{ steps.regression.outcome }}
          BUILD: ${{ steps.build.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          root='asoiaf-structured-public-acquisition-v9-diagnostics'
          mkdir -p "$root"
          cp "$RUNNER_TEMP"/*.log "$root/" 2>/dev/null || true
          printf '%s\n' "$GITHUB_SHA" > "$root/trigger-sha.txt"
          printf '%s\n' "${FINAL_SHA:-not-issued}" > "$root/candidate-sha.txt"
          printf '%s\n' \
            "repair=$REPAIR" \
            "typecheck=$TYPECHECK" \
            "focused=$FOCUSED" \
            "regression=$REGRESSION" \
            "build=$BUILD" \
            > "$root/qualification-outcomes.txt"
          git status --short > "$root/worktree-status.txt"
          git diff --stat > "$root/worktree-diff-stat.txt"
          git diff --name-status > "$root/worktree-diff-files.txt"
          printf '%s\n' \
            'networkAcquisition=qualified-synthetic-runtime' \
            'liveNetworkInCI=false' \
            'requestIdentity=signed-plan-field' \
            'registeredEndpointsOnly=true' \
            'credentialBearingHeaders=false' \
            'robotsRequired=true' \
            'hostDelayFloorMilliseconds=1500' \
            'retryAfterHonored=true' \
            'crossOriginRedirects=false' \
            'responseSizeBounded=true' \
            'rawResponseDigest=raw-bytes-sha256' \
            'rawResponseRetained=false' \
            'normalizedRetention=rights-controlled' \
            'cacheReplay=zero-network-valid-receipt' \
            'batchPacer=shared' \
            'collectorAttemptParity=required' \
            'graphEffect=none' \
            'canonEffect=none' \
            > "$root/structured-acquisition-boundary.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" \
            > "$root/SHA256SUMS"

      - name: Upload qualification diagnostics
        if: always()
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-structured-public-acquisition-v9-diagnostics
          path: asoiaf-structured-public-acquisition-v9-diagnostics
          if-no-files-found: error
          retention-days: 30

      - name: Post bounded qualification result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          FINAL_SHA: ${{ steps.candidate.outputs.final_sha }}
          REPAIR: ${{ steps.repair.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          REGRESSION: ${{ steps.regression.outcome }}
          BUILD: ${{ steps.build.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/qualification-comment.md"
          if [ -n "${FINAL_SHA:-}" ]; then
            cat > "$body" <<EOF
          Structured public acquisition qualification is closed on candidate \`${FINAL_SHA}\`. Strict TypeScript, the focused synthetic acquisition suite, the complete Arc regression suite, and the production build passed. Diagnostic artifact \`${ARTIFACT_ID}\` has ZIP digest \`${ARTIFACT_DIGEST}\`.

          The candidate contains no repair carrier. Acquisition remains \`graphEffect=none\` and \`canonEffect=none\`; endpoint availability and normalized reference data cannot bypass reviewed reconciliation.
          EOF
            gh pr comment 239 --repo BigBirdReturns/axm-arc --body-file "$body"
          else
            cat > "$body" <<EOF
          Structured public acquisition v9 did not issue a candidate. Repair \`${REPAIR}\`, TypeScript \`${TYPECHECK}\`, focused suite \`${FOCUSED}\`, complete regression \`${REGRESSION}\`, and build \`${BUILD}\`. Diagnostic artifact \`${ARTIFACT_ID}\` has ZIP digest \`${ARTIFACT_DIGEST}\`. The parent branch was not advanced, and no qualification claim is made.
          EOF
            gh pr comment 239 --repo BigBirdReturns/axm-arc --body-file "$body"
            exit 1
          fi