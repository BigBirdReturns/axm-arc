name: Repair and qualify ASOIAF answer credential broker v1

on:
  push:
    branches:
      - feature/asoiaf-answer-credential-broker-v1
    paths:
      - '.github/workflows/repair-and-qualify-asoiaf-answer-credential-broker-v1.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: repair-and-qualify-asoiaf-answer-credential-broker-v1
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'BigBirdReturns/axm-arc' && github.ref_name == 'feature/asoiaf-answer-credential-broker-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact broker head
        uses: actions/checkout@v4
        with:
          ref: feature/asoiaf-answer-credential-broker-v1
          fetch-depth: 0
          show-progress: false

      - name: Bind exact repair head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

      - name: Apply source-boundary and fixture repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          cli = Path('tools/asoiaf-answer-credential-broker.ts')
          text = cli.read_text(encoding='utf-8')
          text = text.replace(
              '  type AsoiafAnswerCredentialProviderClass,\n} from "./lib/asoiaf-answer-credential-broker.js";\n',
              '} from "./lib/asoiaf-answer-credential-broker.js";\nimport type {\n  AsoiafAnswerCredentialProviderClass,\n} from "./lib/asoiaf-answer-credential-deployment.js";\n',
              1,
          )
          cli.write_text(text, encoding='utf-8')

          fixture = Path('tests/fixtures/emit-asoiaf-answer-credential-broker-input.ts')
          ftext = fixture.read_text(encoding='utf-8')
          start = ftext.find('function npm(')
          if start >= 0:
              end = ftext.find('\nfunction read<', start)
              if end < 0:
                  raise SystemExit('cannot locate end of unused npm helper')
              ftext = ftext[:start] + ftext[end + 1:]
          fixture.write_text(ftext, encoding='utf-8')

          final_cli = cli.read_text(encoding='utf-8')
          final_fixture = fixture.read_text(encoding='utf-8')
          if 'type AsoiafAnswerCredentialProviderClass,\n} from "./lib/asoiaf-answer-credential-broker.js"' in final_cli:
              raise SystemExit('credential provider type remains imported from broker')
          if 'from "./lib/asoiaf-answer-credential-deployment.js"' not in final_cli:
              raise SystemExit('credential provider type deployment import is absent')
          if 'function npm(' in final_fixture:
              raise SystemExit('unused fixture helper remains')
          PY
          git diff --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Strict TypeScript
        id: typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/typecheck.log"

      - name: Focused broker lifecycle
        id: focused
        shell: bash
        run: |
          set -o pipefail
          npm test -- \
            tests/narrative/canon/asoiaf-answer-credential-broker.test.ts \
            tests/narrative/canon/asoiaf-answer-credential-deployment.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-transport-enrollment.test.ts \
            2>&1 | tee "$RUNNER_TEMP/focused.log"

      - name: Commit exact carrier-free repair
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/asoiaf-answer-credential-broker.ts \
            tests/fixtures/emit-asoiaf-answer-credential-broker-input.ts
          git rm .github/workflows/repair-and-qualify-asoiaf-answer-credential-broker-v1.yml
          git diff --cached --check
          git commit -m 'Qualify credential broker source boundaries'
          git push origin HEAD:feature/asoiaf-answer-credential-broker-v1

      - name: Publish bounded failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/broker-repair-failure.md"
          {
            echo 'Credential-broker repair did not issue a candidate. No qualification claim is made.'
            echo
            echo '### Strict TypeScript tail'
            echo '```text'
            tail -120 "$RUNNER_TEMP/typecheck.log" 2>/dev/null || true
            echo '```'
            echo
            echo '### Focused lifecycle tail'
            echo '```text'
            tail -180 "$RUNNER_TEMP/focused.log" 2>/dev/null || true
            echo '```'
          } > "$body"
          gh pr comment 265 --repo "$GITHUB_REPOSITORY" --body-file "$body"
