name: Repair and qualify ASOIAF answer credential broker v2

on:
  pull_request:
    branches:
      - feature/asoiaf-answer-credential-deployment-v1
    paths:
      - '.github/workflows/repair-and-qualify-asoiaf-answer-credential-broker-v2.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: repair-and-qualify-asoiaf-answer-credential-broker-v2
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'BigBirdReturns/axm-arc' && github.event.pull_request.head.ref == 'feature/asoiaf-answer-credential-broker-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact broker head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Bind exact repair head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"

      - name: Repair deployment-fixture key custody paths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          fixture = Path('tests/fixtures/emit-asoiaf-answer-credential-broker-input.ts')
          text = fixture.read_text(encoding='utf-8')

          start = text.find('function npm(')
          if start >= 0:
              end = text.find('\nfunction read<', start)
              if end < 0:
                  raise SystemExit('cannot locate end of unused npm helper')
              text = text[:start] + text[end + 1:]

          replacements = {
              'path.join(materialDirectory, "initial-client-key.pem")':
                  'path.join(materialDirectory, "deployment-initial.key")',
              'path.join(materialDirectory, "device-agent-key.pem")':
                  'path.join(materialDirectory, "device-agent.key")',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'missing fixture path target: {old}')

          fixture.write_text(text, encoding='utf-8')
          final = fixture.read_text(encoding='utf-8')
          if 'function npm(' in final:
              raise SystemExit('unused fixture helper remains')
          if 'initial-client-key.pem' in final or 'device-agent-key.pem' in final:
              raise SystemExit('stale fixture key path remains')
          if 'deployment-initial.key' not in final or 'device-agent.key' not in final:
              raise SystemExit('qualified deployment key paths are absent')
          PY
          git diff --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Strict TypeScript
        id: typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/typecheck.log"

      - name: Focused broker lifecycle
        id: focused
        shell: bash
        run: |
          set -o pipefail
          npm test -- \
            tests/narrative/canon/asoiaf-answer-credential-broker.test.ts \
            tests/narrative/canon/asoiaf-answer-credential-deployment.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-transport-enrollment.test.ts \
            2>&1 | tee "$RUNNER_TEMP/focused.log"

      - name: Commit exact carrier-free repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/fixtures/emit-asoiaf-answer-credential-broker-input.ts
          git rm -f \
            .github/workflows/repair-and-qualify-asoiaf-answer-credential-broker-v1.yml \
            .github/workflows/repair-and-qualify-asoiaf-answer-credential-broker-v2.yml
          git diff --cached --check
          git commit -m 'Qualify credential broker fixture custody'
          git push origin HEAD:feature/asoiaf-answer-credential-broker-v1

      - name: Publish bounded failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/broker-repair-v2-failure.md"
          {
            echo 'Credential-broker repair v2 did not issue a candidate. No qualification claim is made.'
            echo
            echo '### Strict TypeScript tail'
            echo '```text'
            tail -120 "$RUNNER_TEMP/typecheck.log" 2>/dev/null || true
            echo '```'
            echo
            echo '### Focused lifecycle tail'
            echo '```text'
            tail -220 "$RUNNER_TEMP/focused.log" 2>/dev/null || true
            echo '```'
          } > "$body"
          gh pr comment 265 --repo "$GITHUB_REPOSITORY" --body-file "$body"
