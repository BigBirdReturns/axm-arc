name: Repair and qualify ASOIAF credential provider host v1

on:
  push:
    branches:
      - feature/asoiaf-answer-credential-provider-host-v1
    paths:
      - '.github/workflows/repair-and-qualify-asoiaf-answer-credential-provider-host-v1.yml'
  pull_request:
    branches:
      - feature/asoiaf-answer-credential-broker-v1
    paths:
      - '.github/workflows/repair-and-qualify-asoiaf-answer-credential-provider-host-v1.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: repair-and-qualify-asoiaf-answer-credential-provider-host-v1
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'BigBirdReturns/axm-arc' && (github.ref_name == 'feature/asoiaf-answer-credential-provider-host-v1' || github.event.pull_request.head.ref == 'feature/asoiaf-answer-credential-provider-host-v1')
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out exact provider-host head
        uses: actions/checkout@v4
        with:
          ref: feature/asoiaf-answer-credential-provider-host-v1
          fetch-depth: 0
          show-progress: false

      - name: Bind exact repair input
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          echo "TRIGGER_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Apply bounded source and workflow repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          fixture = Path('tests/fixtures/emit-asoiaf-answer-credential-provider-host-input.ts')
          text = fixture.read_text(encoding='utf-8')
          if 'import crypto from "node:crypto";' not in text:
              text = text.replace(
                  'import fs from "node:fs";\n',
                  'import crypto from "node:crypto";\nimport { execFileSync } from "node:child_process";\nimport fs from "node:fs";\n',
                  1,
              )
          old_run = '''function run(command: string, args: string[], output?: string): unknown {
            const stdout = Bun.spawnSync([command, ...args], {
              cwd: process.cwd(),
              env: process.env,
              stdout: "pipe",
              stderr: "inherit",
            });
            if (stdout.exitCode !== 0) {
              throw new Error(`${command} ${args.join(" ")} exited ${stdout.exitCode}`);
            }
            const text = new TextDecoder().decode(stdout.stdout).trim();
            if (output) fs.writeFileSync(output, text ? `${text}\n` : "", "utf8");
            return text ? JSON.parse(text) : null;
          }
          '''
          new_run = '''function run(command: string, args: string[], output?: string): unknown {
            const stdout = execFileSync(command, args, {
              cwd: process.cwd(),
              encoding: "utf8",
              env: process.env,
              stdio: ["ignore", "pipe", "inherit"],
            }).trim();
            if (output) fs.writeFileSync(output, stdout ? `${stdout}\n` : "", "utf8");
            return stdout ? JSON.parse(stdout) : null;
          }
          '''
          if old_run in text:
              text = text.replace(old_run, new_run, 1)
          elif new_run not in text:
              raise SystemExit('provider fixture process launcher is not repairable')
          fixture.write_text(text, encoding='utf-8')

          core = Path('tools/lib/asoiaf-answer-credential-provider-host.ts')
          source = core.read_text(encoding='utf-8')
          old_narrow = '''  if (brokerInvocation.operation === "mutual-tls-request") {
            const origin = new URL(brokerInvocation.request.targetUrl).origin;
            if (!profile.allowedTargetOrigins.includes(origin)) {
              throw new Error(`credential provider target origin ${origin} is outside profile policy`);
            }
            if (brokerInvocation.request.maxResponseBytes > profile.maxResponseBytes) {
              throw new Error("credential provider invocation response ceiling exceeds profile");
            }
          }
          '''
          new_narrow = '''  if (brokerInvocation.operation === "mutual-tls-request") {
            if (brokerInvocation.request.kind !== "mutual-tls") {
              throw new Error("credential provider mutual-TLS operation lacks a mutual-TLS request");
            }
            const origin = new URL(brokerInvocation.request.targetUrl).origin;
            if (!profile.allowedTargetOrigins.includes(origin)) {
              throw new Error(`credential provider target origin ${origin} is outside profile policy`);
            }
            if (brokerInvocation.request.maxResponseBytes > profile.maxResponseBytes) {
              throw new Error("credential provider invocation response ceiling exceeds profile");
            }
          }
          '''
          if old_narrow in source:
              source = source.replace(old_narrow, new_narrow, 1)
          elif new_narrow not in source:
              raise SystemExit('provider mutual-TLS narrowing target is not repairable')
          source = source.replace(
              '$response = $http.Send($request, [System.Net.Http.HttpCompletionOption]::ResponseHeadersRead)',
              '$response = $http.SendAsync($request, [System.Net.Http.HttpCompletionOption]::ResponseHeadersRead).GetAwaiter().GetResult()',
              1,
          )
          core.write_text(source, encoding='utf-8')

          workflow = Path('.github/workflows/asoiaf-answer-credential-provider-host.yml')
          yaml = workflow.read_text(encoding='utf-8')
          yaml = yaml.replace(
              '$public = $certificate.GetRSAPublicKey()',
              '$public = [System.Security.Cryptography.X509Certificates.RSACertificateExtensions]::GetRSAPublicKey($certificate)',
              1,
          )
          yaml = yaml.replace(
              '$private = $certificate.GetRSAPrivateKey()',
              '$private = [System.Security.Cryptography.X509Certificates.RSACertificateExtensions]::GetRSAPrivateKey($certificate)',
              1,
          )
          workflow.write_text(yaml, encoding='utf-8')

          checks = {
              fixture: [
                  'import crypto from "node:crypto";',
                  'import { execFileSync } from "node:child_process";',
                  'const stdout = execFileSync(command, args, {',
              ],
              core: [
                  'brokerInvocation.request.kind !== "mutual-tls"',
                  '$http.SendAsync($request, [System.Net.Http.HttpCompletionOption]::ResponseHeadersRead)',
              ],
              workflow: [
                  'RSACertificateExtensions]::GetRSAPublicKey($certificate)',
                  'RSACertificateExtensions]::GetRSAPrivateKey($certificate)',
              ],
          }
          for target, markers in checks.items():
              final = target.read_text(encoding='utf-8')
              for marker in markers:
                  if marker not in final:
                      raise SystemExit(f'{target}: missing repair marker {marker}')
          if 'Bun.spawnSync' in fixture.read_text(encoding='utf-8'):
              raise SystemExit('Bun fixture launcher remains')
          PY
          git diff --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Strict TypeScript
        id: typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/typecheck.log"

      - name: Focused provider-host lifecycle
        id: focused
        shell: bash
        run: |
          set -o pipefail
          npm test -- \
            tests/narrative/canon/asoiaf-answer-credential-provider-host.test.ts \
            tests/narrative/canon/asoiaf-answer-credential-broker.test.ts \
            tests/narrative/canon/asoiaf-answer-credential-deployment.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-transport-enrollment.test.ts \
            2>&1 | tee "$RUNNER_TEMP/focused.log"

      - name: Commit exact carrier-free source repair
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tests/fixtures/emit-asoiaf-answer-credential-provider-host-input.ts \
            tools/lib/asoiaf-answer-credential-provider-host.ts \
            .github/workflows/asoiaf-answer-credential-provider-host.yml
          git rm .github/workflows/repair-and-qualify-asoiaf-answer-credential-provider-host-v1.yml
          git diff --cached --check
          git commit -m 'Qualify credential provider host source boundaries'
          final_sha="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          git push origin HEAD:feature/asoiaf-answer-credential-provider-host-v1
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"

      - name: Dispatch permanent exact-head qualification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run asoiaf-answer-credential-provider-host.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref feature/asoiaf-answer-credential-provider-host-v1

      - name: Publish bounded repair result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.commit.outputs.final_sha }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FINAL_SHA:-}" ]; then
            gh pr comment 270 --repo "$GITHUB_REPOSITORY" --body \
              "Credential provider-host source repair is qualified and carrier-free on exact head \`${FINAL_SHA}\`. Strict TypeScript and the focused provider, broker, deployment, and enrollment lifecycle passed. The permanent Linux and Windows qualification workflow has been explicitly dispatched. This comment is not a terminal full-regression or artifact receipt."
          else
            body="$RUNNER_TEMP/provider-repair-failure.md"
            {
              echo "Credential provider-host source repair did not issue a candidate. TypeScript \`${TYPECHECK}\`; focused lifecycle \`${FOCUSED}\`. No qualification claim is made."
              echo
              echo '### TypeScript tail'
              echo '```text'
              tail -120 "$RUNNER_TEMP/typecheck.log" 2>/dev/null || true
              echo '```'
              echo
              echo '### Focused lifecycle tail'
              echo '```text'
              tail -220 "$RUNNER_TEMP/focused.log" 2>/dev/null || true
              echo '```'
            } > "$body"
            gh pr comment 270 --repo "$GITHUB_REPOSITORY" --body-file "$body"
            exit 1
          fi
