name: Repair and qualify ASOIAF answer desk estate v1

on:
  push:
    branches:
      - feature/asoiaf-answer-desk-estate-v1
    paths:
      - '.github/workflows/repair-and-qualify-asoiaf-answer-desk-estate-v1.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: repair-and-qualify-asoiaf-answer-desk-estate-v1
  cancel-in-progress: false

jobs:
  repair_qualify_and_push:
    if: github.repository == 'BigBirdReturns/axm-arc' && github.ref_name == 'feature/asoiaf-answer-desk-estate-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Check out exact desk-estate parent
        uses: actions/checkout@v4
        with:
          ref: feature/asoiaf-answer-desk-estate-v1
          fetch-depth: 0
          show-progress: false

      - name: Bind exact estate repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = 'feature/asoiaf-answer-desk-estate-v1'
          test -z "$(git status --porcelain)"
          test -f tools/lib/asoiaf-answer-desk-estate.ts
          test -f tools/lib/asoiaf-answer-work-lease.ts
          test -f tests/narrative/canon/asoiaf-answer-desk-estate.test.ts

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Repair rendered availability and cross-scope fixture
        id: repair
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee "$RUNNER_TEMP/repair.log"
          from pathlib import Path

          core = Path('tools/lib/asoiaf-answer-work-lease.ts')
          text = core.read_text(encoding='utf-8')
          set_anchor = '  const activeItemKeys = new Set<string>();\n'
          terminal_line = '  const terminalItemKeys = new Set<string>();\n'
          if terminal_line not in text:
              if text.count(set_anchor) != 1:
                  raise SystemExit('cannot locate active item set')
              text = text.replace(set_anchor, set_anchor + terminal_line, 1)

          branch_start = '    if (settlement) {\n'
          branch_end = '    if (\n      lease.dossierId !== input.workOrder.dossierId\n'
          rendered_branch = '''    if (settlement) {
              settledLeaseIds.push(lease.leaseId);
              if (
                lease.workOrderId === input.workOrder.workOrderId
                && settlement.outcome === "rendered"
              ) {
                const settlementErrors = validateAsoiafAnswerWorkSettlement(
                  settlement,
                  {
                    lease,
                    beforeWorkOrder: input.workOrder,
                    afterWorkOrder: null,
                  },
                ).filter((entry) => entry.severity === "error");
                if (settlementErrors.length > 0) {
                  throw new Error(
                    `invalid rendered answer work settlement ${settlement.settlementId}`,
                  );
                }
                terminalItemKeys.add(lease.itemKey);
              }
              continue;
            }
'''
          if 'terminalItemKeys.add(lease.itemKey);' not in text:
              if text.count(branch_start) != 1 or text.count(branch_end) != 1:
                  raise SystemExit('cannot locate settlement branch boundaries')
              start = text.index(branch_start)
              end = text.index(branch_end, start)
              text = text[:start] + rendered_branch + text[end:]

          available_start = '  const availableItemIds = openItems\n'
          available_end = '  const blockedItemIds = input.workOrder.items\n'
          available_block = '''  const availableItemIds = openItems
            .filter((item) => {
              const itemKey = asoiafAnswerWorkItemKey(item);
              return !activeItemKeys.has(itemKey) && !terminalItemKeys.has(itemKey);
            })
            .map((item) => item.itemId);
'''
          if '!terminalItemKeys.has(itemKey)' not in text:
              if text.count(available_start) != 1 or text.count(available_end) != 1:
                  raise SystemExit('cannot locate availability projection boundaries')
              start = text.index(available_start)
              end = text.index(available_end, start)
              text = text[:start] + available_block + text[end:]
          core.write_text(text, encoding='utf-8')

          lease_test = Path('tests/narrative/canon/asoiaf-answer-work-lease.test.ts')
          lease_text = lease_test.read_text(encoding='utf-8')
          anchor = '''    expect(settlement.afterWorkOrderId).toBeNull();
            expect(settlement.afterStatus).toBe("rendered");
          '''
          block = '''    expect(settlement.afterWorkOrderId).toBeNull();
            expect(settlement.afterStatus).toBe("rendered");

            const state = buildAsoiafAnswerDeskState({
              workOrder: readyOrder,
              leases: [lease],
              settlements: [settlement],
              asOf: "2026-08-05T05:41:11.000Z",
            });
            expect(state.settledLeaseIds).toEqual([lease.leaseId]);
            expect(state.availableItemIds).not.toContain(renderItem.itemId);
            expect(state.nextAvailableItemId).toBeNull();
            expect(() =>
              claimAsoiafAnswerWorkItem({
                workOrder: readyOrder,
                itemId: renderItem.itemId,
                workerId: "worker:second-renderer",
                claimedAt: "2026-08-05T05:41:12.000Z",
                leaseMilliseconds: 60_000,
                existingLeases: [lease],
                settlements: [settlement],
              }),
            ).toThrow(/terminal settlement/);
          '''
          if 'worker:second-renderer' not in lease_text:
              if lease_text.count(anchor) != 1:
                  raise SystemExit('cannot locate rendered lease assertions')
              lease_test.write_text(lease_text.replace(anchor, block, 1), encoding='utf-8')

          estate_test = Path('tests/narrative/canon/asoiaf-answer-desk-estate.test.ts')
          estate_text = estate_test.read_text(encoding='utf-8')
          import_anchor = '''import {
            buildAsoiafAnswerDeskFixture,
          } from "../../fixtures/asoiaf-answer-desk-fixture.js";
          '''
          import_block = '''import {
            buildAsoiafAnswerDeskFixture,
          } from "../../fixtures/asoiaf-answer-desk-fixture.js";
          import {
            buildAsoiafResearchQuestionDossier,
          } from "../../../tools/lib/asoiaf-research-question-dossier.js";
          '''
          if 'buildAsoiafResearchQuestionDossier,' not in estate_text:
              if estate_text.count(import_anchor) != 1:
                  raise SystemExit('cannot locate estate fixture import')
              estate_text = estate_text.replace(import_anchor, import_block, 1)

          old_helper = '''function buildAsoiafResearchQuestionDossierForEstateTest() {
            const fixture = buildAsoiafAnswerDeskFixture();
            return {
              ...fixture.dossier,
              question: {
                ...fixture.dossier.question,
                questionId: `${fixture.dossier.question.questionId}:other`,
              },
            } as typeof fixture.dossier;
          }
          '''
          new_helper = '''function buildAsoiafResearchQuestionDossierForEstateTest() {
            return buildAsoiafResearchQuestionDossier({
              questionText:
                "Which exact source establishes a separately bounded desk-estate question?",
              createdBy: "researcher:desk-estate-other-question",
              createdAt: "2026-08-05T06:45:00.000Z",
              laneIds: ["entity-resolution"],
              continuityIds: ["book-main"],
              gaps: [
                {
                  kind: "question-unresolved",
                  laneId: "entity-resolution",
                  continuityId: "book-main",
                  detail:
                    "The independently valid dossier remains unresolved and exists only to prove cross-question estate refusal.",
                },
              ],
            });
          }
          '''
          if new_helper not in estate_text:
              if estate_text.count(old_helper) != 1:
                  raise SystemExit('cannot locate invalid cross-scope dossier helper')
              estate_text = estate_text.replace(old_helper, new_helper, 1)
          estate_test.write_text(estate_text, encoding='utf-8')

          repaired = core.read_text(encoding='utf-8')
          for marker in (
              'const terminalItemKeys = new Set<string>();',
              'terminalItemKeys.add(lease.itemKey);',
              '!terminalItemKeys.has(itemKey)',
          ):
              if marker not in repaired:
                  raise SystemExit(f'missing rendered availability marker {marker}')
          if 'questionId: `${fixture.dossier.question.questionId}:other`' in estate_test.read_text(encoding='utf-8'):
              raise SystemExit('invalid cross-scope dossier tamper remains')
          print('ANSWER_DESK_ESTATE_V1_REPAIR_COMPLETE')
          PY
          git diff --check

      - name: Strict TypeScript
        id: typecheck
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/typecheck.log"

      - name: Focused estate and lease qualification
        id: focused
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test -- \
            tests/narrative/canon/asoiaf-answer-desk-estate.test.ts \
            tests/narrative/canon/asoiaf-answer-work-lease.test.ts \
            tests/narrative/canon/asoiaf-answer-work-order.test.ts \
            tests/narrative/canon/asoiaf-reviewed-answer-packet.test.ts \
            2>&1 | tee "$RUNNER_TEMP/focused-tests.log"

      - name: Complete Arc regression
        id: regression
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/full-tests.log"

      - name: Production build
        id: build
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Commit exact estate repair
        id: candidate
        if: steps.repair.outcome == 'success' && steps.typecheck.outcome == 'success' && steps.focused.outcome == 'success' && steps.regression.outcome == 'success' && steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --others --exclude-standard -z \
            | while IFS= read -r -d '' generated; do
                case "$generated" in
                  *.js|*.js.map|*.d.ts) rm -f "$generated" ;;
                esac
              done
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/lib/asoiaf-answer-work-lease.ts \
            tests/narrative/canon/asoiaf-answer-work-lease.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-estate.test.ts
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Repair answer desk rendered and scope custody'
          final_sha="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          git push origin HEAD:feature/asoiaf-answer-desk-estate-v1
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"

      - name: Retain exact estate diagnostics
        if: always()
        env:
          FINAL_SHA: ${{ steps.candidate.outputs.final_sha }}
          REPAIR: ${{ steps.repair.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          REGRESSION: ${{ steps.regression.outcome }}
          BUILD: ${{ steps.build.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          root='asoiaf-answer-desk-estate-repair-v1'
          mkdir -p "$root"
          cp "$RUNNER_TEMP"/*.log "$root/" 2>/dev/null || true
          printf '%s\n' "$GITHUB_SHA" > "$root/trigger-sha.txt"
          printf '%s\n' "${FINAL_SHA:-not-issued}" > "$root/candidate-sha.txt"
          printf '%s\n' \
            "repair=$REPAIR" \
            "typecheck=$TYPECHECK" \
            "focused=$FOCUSED" \
            "regression=$REGRESSION" \
            "build=$BUILD" \
            > "$root/outcomes.txt"
          git status --short > "$root/worktree-status.txt"
          git diff --stat > "$root/worktree-diff-stat.txt"
          git diff > "$root/worktree.patch"
          printf '%s\n' \
            'renderedItemAvailable=false' \
            'terminalRenderReplay=refused' \
            'crossQuestionFixture=independently-valid' \
            'estateScope=one-dossier-one-question' \
            'graphEffect=none' \
            'canonEffect=none' \
            'answerEffect=none' \
            > "$root/estate-repair-boundary.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" \
            > "$root/SHA256SUMS"

      - name: Upload estate diagnostics
        if: always()
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-answer-desk-estate-repair-v1
          path: asoiaf-answer-desk-estate-repair-v1
          if-no-files-found: error
          retention-days: 30

      - name: Post bounded estate result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.candidate.outputs.final_sha }}
          ARTIFACT_ID: ${{ steps.upload.outputs['artifact-id'] }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs['artifact-digest'] }}
          REPAIR: ${{ steps.repair.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          REGRESSION: ${{ steps.regression.outcome }}
          BUILD: ${{ steps.build.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FINAL_SHA:-}" ]; then
            gh pr comment 251 --repo "$GITHUB_REPOSITORY" --body \
              "Answer desk estate rendered and cross-scope custody is repaired and code-qualified on candidate \`${FINAL_SHA}\`. Strict TypeScript, the focused estate and lease suites, the complete Arc regression, and production build passed. Artifact \`${ARTIFACT_ID}\` has ZIP digest \`${ARTIFACT_DIGEST}\`. Connector settlement remains responsible only for removing this repair carrier and adding permanent operator surfaces."
          else
            gh pr comment 251 --repo "$GITHUB_REPOSITORY" --body \
              "Answer desk estate repair v1 did not issue a candidate. Repair \`${REPAIR}\`, TypeScript \`${TYPECHECK}\`, focused \`${FOCUSED}\`, regression \`${REGRESSION}\`, build \`${BUILD}\`. Artifact \`${ARTIFACT_ID}\` has ZIP digest \`${ARTIFACT_DIGEST}\`. No persistent-estate qualification is claimed."
            exit 1
          fi