name: Repair and qualify ASOIAF answer work lease v1

on:
  push:
    branches:
      - feature/asoiaf-answer-work-lease-v1
    paths:
      - '.github/workflows/repair-and-qualify-asoiaf-answer-work-lease-v1.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: repair-and-qualify-asoiaf-answer-work-lease-v1
  cancel-in-progress: false

jobs:
  repair_qualify_and_push:
    if: github.repository == 'BigBirdReturns/axm-arc' && github.ref_name == 'feature/asoiaf-answer-work-lease-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact lease parent
        uses: actions/checkout@v4
        with:
          ref: feature/asoiaf-answer-work-lease-v1
          fetch-depth: 0
          show-progress: false

      - name: Bind exact fixture repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = 'feature/asoiaf-answer-work-lease-v1'
          test -z "$(git status --porcelain)"
          test -f tools/lib/asoiaf-answer-work-lease.ts
          test -f tests/narrative/canon/asoiaf-answer-work-lease.test.ts

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Repair fixture candidate narrowing
        id: repair
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee "$RUNNER_TEMP/repair.log"
          from pathlib import Path

          target = Path('tests/narrative/canon/asoiaf-answer-work-lease.test.ts')
          text = target.read_text(encoding='utf-8')
          old = '''const candidate = ASOIAF_RECALL_ESTATE_PACKETS
            .flatMap((packet) => packet.candidates)
            .find(
              (entry) =>
                entry.sourceHints.includes("AGOT")
                && entry.reconciliationKeys.length > 0,
            );
          if (!candidate) throw new Error("lease fixture requires one AGOT candidate");
          '''
          new = '''const selectedCandidate = ASOIAF_RECALL_ESTATE_PACKETS
            .flatMap((packet) => packet.candidates)
            .find(
              (entry) =>
                entry.sourceHints.includes("AGOT")
                && entry.reconciliationKeys.length > 0,
            );
          if (!selectedCandidate) {
            throw new Error("lease fixture requires one AGOT candidate");
          }
          const candidate = selectedCandidate;
          '''
          if new in text:
              print('LEASE_FIXTURE_NARROWING_ALREADY_REPAIRED')
          else:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one fixture candidate target, found {count}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('LEASE_FIXTURE_NARROWING_REPAIRED')
          PY
          git diff --check

      - name: Strict TypeScript
        id: typecheck
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/typecheck.log"

      - name: Focused lease and lifecycle qualification
        id: focused
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test -- \
            tests/narrative/canon/asoiaf-answer-work-lease.test.ts \
            tests/narrative/canon/asoiaf-answer-work-order.test.ts \
            tests/narrative/canon/asoiaf-reviewed-answer-packet.test.ts \
            2>&1 | tee "$RUNNER_TEMP/focused-tests.log"

      - name: Complete Arc regression
        id: regression
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/full-tests.log"

      - name: Production build
        id: build
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Commit exact fixture repair
        id: candidate
        if: steps.repair.outcome == 'success' && steps.typecheck.outcome == 'success' && steps.focused.outcome == 'success' && steps.regression.outcome == 'success' && steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --others --exclude-standard -z \
            | while IFS= read -r -d '' generated; do
                case "$generated" in
                  *.js|*.js.map|*.d.ts) rm -f "$generated" ;;
                esac
              done
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/narrative/canon/asoiaf-answer-work-lease.test.ts
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Fix answer work lease fixture narrowing'
          final_sha="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          git push origin HEAD:feature/asoiaf-answer-work-lease-v1
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"

      - name: Retain exact lease diagnostics
        if: always()
        env:
          FINAL_SHA: ${{ steps.candidate.outputs.final_sha }}
          REPAIR: ${{ steps.repair.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          REGRESSION: ${{ steps.regression.outcome }}
          BUILD: ${{ steps.build.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          root='asoiaf-answer-work-lease-repair-v1'
          mkdir -p "$root"
          cp "$RUNNER_TEMP"/*.log "$root/" 2>/dev/null || true
          printf '%s\n' "$GITHUB_SHA" > "$root/trigger-sha.txt"
          printf '%s\n' "${FINAL_SHA:-not-issued}" > "$root/candidate-sha.txt"
          printf '%s\n' \
            "repair=$REPAIR" \
            "typecheck=$TYPECHECK" \
            "focused=$FOCUSED" \
            "regression=$REGRESSION" \
            "build=$BUILD" \
            > "$root/outcomes.txt"
          printf '%s\n' \
            'claim=exact-open-item-only' \
            'concurrentLease=refused' \
            'advancement=refreshed-work-order-required' \
            'render=answer-ready-result-reference-required' \
            'honestTerminals=refused-failed-cancelled-expired-stale' \
            'leaseAuthority=none' \
            'settlementAuthority=none' \
            'graphEffect=none' \
            'canonEffect=none' \
            'answerEffect=none' \
            > "$root/lease-boundary.txt"
          git status --short > "$root/worktree-status.txt"
          git diff --stat > "$root/worktree-diff-stat.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" \
            > "$root/SHA256SUMS"

      - name: Upload lease diagnostics
        if: always()
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-answer-work-lease-repair-v1
          path: asoiaf-answer-work-lease-repair-v1
          if-no-files-found: error
          retention-days: 30

      - name: Post bounded lease result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.candidate.outputs.final_sha }}
          ARTIFACT_ID: ${{ steps.upload.outputs['artifact-id'] }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs['artifact-digest'] }}
          REPAIR: ${{ steps.repair.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          REGRESSION: ${{ steps.regression.outcome }}
          BUILD: ${{ steps.build.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FINAL_SHA:-}" ]; then
            gh pr comment 250 --repo "$GITHUB_REPOSITORY" --body \
              "Answer work lease custody is code-qualified on candidate \`${FINAL_SHA}\`. Strict TypeScript, the focused lease and lifecycle suites, the complete Arc regression, and production build passed. Artifact \`${ARTIFACT_ID}\` has ZIP digest \`${ARTIFACT_DIGEST}\`. Connector settlement remains responsible only for removing this repair carrier and adding the permanent operator surfaces."
          else
            gh pr comment 250 --repo "$GITHUB_REPOSITORY" --body \
              "Answer work lease repair v1 did not issue a candidate. Repair \`${REPAIR}\`, TypeScript \`${TYPECHECK}\`, focused \`${FOCUSED}\`, regression \`${REGRESSION}\`, build \`${BUILD}\`. Artifact \`${ARTIFACT_ID}\` has ZIP digest \`${ARTIFACT_DIGEST}\`. No lease or settlement qualification is claimed."
            exit 1
          fi