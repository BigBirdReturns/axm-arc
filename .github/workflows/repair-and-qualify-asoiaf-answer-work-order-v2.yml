name: Repair and qualify ASOIAF answer work order v2

on:
  push:
    branches:
      - feature/asoiaf-answer-work-order-v1
    paths:
      - '.github/workflows/repair-and-qualify-asoiaf-answer-work-order-v2.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: repair-and-qualify-asoiaf-answer-work-order-v2
  cancel-in-progress: false

jobs:
  repair_qualify_and_push:
    if: github.repository == 'BigBirdReturns/axm-arc' && github.ref_name == 'feature/asoiaf-answer-work-order-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact answer-work-order parent
        uses: actions/checkout@v4
        with:
          ref: feature/asoiaf-answer-work-order-v1
          fetch-depth: 0
          show-progress: false

      - name: Bind exact structural repair transaction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = 'feature/asoiaf-answer-work-order-v1'
          test -z "$(git status --porcelain)"
          test -f tools/lib/asoiaf-answer-work-order.ts
          test -f tests/narrative/canon/asoiaf-answer-work-order.test.ts

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Remove duplicate aggregate dossier actions structurally
        id: repair
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee "$RUNNER_TEMP/repair.log"
          from pathlib import Path

          target = Path('tools/lib/asoiaf-answer-work-order.ts')
          text = target.read_text(encoding='utf-8')
          start_marker = '  for (const action of dossier.nextActions) {\n'
          end_marker = '  const openPrerequisites = rawItems\n'
          if text.count(start_marker) != 1:
              raise SystemExit(
                  f'expected one aggregate-loop start, found {text.count(start_marker)}'
              )
          if text.count(end_marker) != 1:
              raise SystemExit(
                  f'expected one assembly boundary, found {text.count(end_marker)}'
              )
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          if end <= start:
              raise SystemExit('aggregate-loop boundary is inverted')
          target.write_text(text[:start] + text[end:], encoding='utf-8')

          repaired = target.read_text(encoding='utf-8')
          if 'for (const action of dossier.nextActions)' in repaired:
              raise SystemExit('aggregate dossier action loop remains')
          for marker in (
              'for (const reference of dossier.recallReferences)',
              'for (const reference of dossier.privateReferences)',
              'for (const reference of dispositionReferences)',
              'for (const gap of dossier.gaps)',
              'const openPrerequisites = rawItems',
              'action: "assemble-reviewed-answer"',
              'action: "verify-reviewed-answer"',
              'action: "render-reviewed-answer"',
          ):
              if marker not in repaired:
                  raise SystemExit(f'missing exact work projection marker: {marker}')
          print('ANSWER_WORK_ORDER_DUPLICATE_PROJECTION_V2_REMOVED')
          PY
          git diff --check

      - name: Strict TypeScript
        id: typecheck
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/typecheck.log"

      - name: Focused answer-work-order qualification
        id: focused
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test -- \
            tests/narrative/canon/asoiaf-answer-work-order.test.ts \
            tests/narrative/canon/asoiaf-reviewed-answer-packet.test.ts \
            tests/narrative/canon/asoiaf-research-question-dossier.test.ts \
            2>&1 | tee "$RUNNER_TEMP/focused-tests.log"

      - name: Complete Arc regression
        id: regression
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/full-tests.log"

      - name: Production build
        id: build
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Commit exact code repair
        id: candidate
        if: steps.repair.outcome == 'success' && steps.typecheck.outcome == 'success' && steps.focused.outcome == 'success' && steps.regression.outcome == 'success' && steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --others --exclude-standard -z \
            | while IFS= read -r -d '' generated; do
                case "$generated" in
                  *.js|*.js.map|*.d.ts) rm -f "$generated" ;;
                esac
              done
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/lib/asoiaf-answer-work-order.ts
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Remove duplicate aggregate answer work'
          final_sha="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          git push origin HEAD:feature/asoiaf-answer-work-order-v1
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"

      - name: Retain exact repair diagnostics
        if: always()
        env:
          FINAL_SHA: ${{ steps.candidate.outputs.final_sha }}
          REPAIR: ${{ steps.repair.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          REGRESSION: ${{ steps.regression.outcome }}
          BUILD: ${{ steps.build.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          root='asoiaf-answer-work-order-repair-v2'
          mkdir -p "$root"
          cp "$RUNNER_TEMP"/*.log "$root/" 2>/dev/null || true
          printf '%s\n' "$GITHUB_SHA" > "$root/trigger-sha.txt"
          printf '%s\n' "${FINAL_SHA:-not-issued}" > "$root/candidate-sha.txt"
          printf '%s\n' \
            "repair=$REPAIR" \
            "typecheck=$TYPECHECK" \
            "focused=$FOCUSED" \
            "regression=$REGRESSION" \
            "build=$BUILD" \
            > "$root/outcomes.txt"
          printf '%s\n' \
            'specificReferenceTasks=authoritative-projection' \
            'specificGapTasks=authoritative-projection' \
            'aggregateDossierNextActions=not-reemitted' \
            'plannerAuthority=none' \
            'graphEffect=none' \
            'canonEffect=none' \
            'answerEffect=none' \
            > "$root/work-order-boundary.txt"
          git status --short > "$root/worktree-status.txt"
          git diff --stat > "$root/worktree-diff-stat.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" \
            > "$root/SHA256SUMS"

      - name: Upload repair diagnostics
        if: always()
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-answer-work-order-repair-v2
          path: asoiaf-answer-work-order-repair-v2
          if-no-files-found: error
          retention-days: 30

      - name: Post bounded repair result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.candidate.outputs.final_sha }}
          ARTIFACT_ID: ${{ steps.upload.outputs['artifact-id'] }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs['artifact-digest'] }}
          REPAIR: ${{ steps.repair.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          REGRESSION: ${{ steps.regression.outcome }}
          BUILD: ${{ steps.build.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FINAL_SHA:-}" ]; then
            gh pr comment 249 --repo "$GITHUB_REPOSITORY" --body \
              "Answer work-order duplicate projection is repaired and code-qualified on candidate \`${FINAL_SHA}\`. Strict TypeScript, the focused lifecycle suite, the complete Arc regression, and production build passed. Artifact \`${ARTIFACT_ID}\` has ZIP digest \`${ARTIFACT_DIGEST}\`. Exact reference and gap tasks now determine lifecycle readiness; the dossier's aggregate next-action projection is not reintroduced as unscoped work. Connector settlement remains responsible only for removing the two repair carriers."
          else
            gh pr comment 249 --repo "$GITHUB_REPOSITORY" --body \
              "Answer work-order repair v2 did not issue a candidate. Repair \`${REPAIR}\`, TypeScript \`${TYPECHECK}\`, focused \`${FOCUSED}\`, regression \`${REGRESSION}\`, build \`${BUILD}\`. Artifact \`${ARTIFACT_ID}\` has ZIP digest \`${ARTIFACT_DIGEST}\`. No lifecycle qualification is claimed."
            exit 1
          fi