name: Repair and qualify ASOIAF research question dossier v2

on:
  push:
    branches:
      - feature/asoiaf-research-question-dossier-v1
    paths:
      - '.github/workflows/repair-and-qualify-asoiaf-research-question-dossier-v2.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: repair-and-qualify-asoiaf-research-question-dossier-v2
  cancel-in-progress: false

jobs:
  repair_qualify_and_push:
    if: github.repository == 'BigBirdReturns/axm-arc' && github.ref_name == 'feature/asoiaf-research-question-dossier-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact research-dossier branch
        uses: actions/checkout@v4
        with:
          ref: feature/asoiaf-research-question-dossier-v1
          fetch-depth: 0
          show-progress: false

      - name: Bind exact v2 repair transaction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = 'feature/asoiaf-research-question-dossier-v1'
          test -z "$(git status --porcelain)"
          test -f .github/workflows/repair-and-qualify-asoiaf-research-question-dossier-v1.yml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Replay and complete dossier integrity repair
        id: repair
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee "$RUNNER_TEMP/repair.log"
          from pathlib import Path

          carrier = Path(
              '.github/workflows/repair-and-qualify-asoiaf-research-question-dossier-v1.yml'
          )
          text = carrier.read_text(encoding='utf-8')
          start = "          python - <<'PY' 2>&1 | tee \"$RUNNER_TEMP/repair.log\"\n"
          end = "\n          PY\n"
          if start not in text or end not in text:
              raise SystemExit('research-dossier v1 repair carrier is malformed')
          extracted = text.split(start, 1)[1].split(end, 1)[0]
          script = "\n".join(
              line[10:] if line.startswith('          ') else line
              for line in extracted.splitlines()
          )
          strict = '''    if count != 1:
                  raise SystemExit(
                      f'{target}: expected one repair target, found {count}: {old[:220]!r}'
                  )
              target.write_text(text.replace(old, new, 1), encoding='utf-8')
          '''
          tolerant = '''    if count != 1:
                  print(
                      f'SKIP_EXACT_TARGET {target}: expected one, found {count}: '
                      f'{old[:220]!r}'
                  )
                  return
              target.write_text(text.replace(old, new, 1), encoding='utf-8')
          '''
          if strict not in script:
              raise SystemExit('cannot locate v1 replace_once guard')
          script = script.replace(strict, tolerant, 1)
          exec(compile(script, '<research-dossier-v1-tolerant-replay>', 'exec'), {})

          module = Path('tools/lib/asoiaf-research-question-dossier.ts')
          tests = Path('tests/narrative/canon/asoiaf-research-question-dossier.test.ts')

          module_text = module.read_text(encoding='utf-8')
          semantic_marker = '''    if (acquisitionReceipt.format !== ASOIAF_STRUCTURED_ACQUISITION_RECEIPT_FORMAT) {
          '''
          semantic_insert = '''    const allowedAdmissionReasons = ADMISSION_REASONS_BY_OUTCOME[admission.outcome];
              if (!allowedAdmissionReasons?.has(admission.reason)) {
                findings.push(finding("structured-admission-reason", "error", reference.referenceId, "structured admission reason is incompatible with its outcome"));
              }
              const requiredAdmissionEffect = ADMISSION_EFFECT_BY_OUTCOME[admission.outcome];
              if (
                !requiredAdmissionEffect
                || !Array.isArray(admission.evidence)
                || !admission.evidence.some((entry) => entry.effect === requiredAdmissionEffect)
              ) {
                findings.push(finding("structured-admission-evidence-effect", "error", reference.referenceId, "structured admission lacks the evidence effect required by its outcome"));
              }
              if (acquisitionReceipt.format !== ASOIAF_STRUCTURED_ACQUISITION_RECEIPT_FORMAT) {
          '''
          if 'structured-admission-evidence-effect' not in module_text:
              if module_text.count(semantic_marker) != 1:
                  raise SystemExit('cannot locate acquisition format boundary for admission semantics')
              module_text = module_text.replace(
                  semantic_marker,
                  semantic_insert,
                  1,
              )
              module.write_text(module_text, encoding='utf-8')

          test_text = tests.read_text(encoding='utf-8')
          invalid_call = 'validateAsoiafResearchQuestionDossier(tampered).map('
          cast_call = (
              'validateAsoiafResearchQuestionDossier('
              'tampered as unknown as AsoiafResearchQuestionDossier).map('
          )
          if invalid_call in test_text:
              test_text = test_text.replace(invalid_call, cast_call)
              tests.write_text(test_text, encoding='utf-8')

          required = {
              module: [
                  'question-identity',
                  'private-reference-identity',
                  'structured-reference-identity',
                  'recall-reference-identity',
                  'gap-identity',
                  'structured-admission-reason',
                  'structured-admission-evidence-effect',
                  'question routing produced no qualified ASOIAF lane',
              ],
              tests: [
                  'detects tampered nested question, reference, and gap identities',
                  'refuses an internally valid admission with incompatible semantics',
                  'refuses a natural-language route with no qualified lane',
                  'tampered as unknown as AsoiafResearchQuestionDossier',
              ],
          }
          for target, markers in required.items():
              content = target.read_text(encoding='utf-8')
              for marker in markers:
                  if marker not in content:
                      raise SystemExit(f'{target}: missing completed repair marker {marker!r}')
          print('ASOIAF_RESEARCH_DOSSIER_V2_REPAIR_COMPLETE')
          PY
          git diff --check

      - name: Strict TypeScript
        id: typecheck
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/typecheck.log"

      - name: Focused research-dossier qualification
        id: focused
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test -- tests/narrative/canon/asoiaf-research-question-dossier.test.ts \
            2>&1 | tee "$RUNNER_TEMP/focused-tests.log"

      - name: Text-free operator smoke
        id: smoke
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          root="$RUNNER_TEMP/research-dossier-smoke"
          mkdir -p "$root"
          question='Who is Varys?'
          npm run --silent asoiaf:research-dossier -- route \
            --question "$question" \
            --continuity book-main \
            --lane entity-resolution \
            | tee "$root/route.json"
          cat > "$root/input.json" <<'JSON'
          {
            "questionText": "Who is Varys?",
            "createdBy": "qualification:repair-v2-smoke",
            "createdAt": "2026-08-04T20:55:00.000Z",
            "laneIds": ["entity-resolution"],
            "continuityIds": ["book-main"],
            "gaps": [
              {
                "kind": "private-source-missing",
                "laneId": "entity-resolution",
                "continuityId": "book-main",
                "sourceId": "local-agot",
                "detail": "No private edition is mounted in this synthetic smoke."
              }
            ]
          }
          JSON
          npm run --silent asoiaf:research-dossier -- build \
            --input "$root/input.json" \
            --out "$root/dossier.json" \
            | tee "$root/build.json"
          npm run --silent asoiaf:research-dossier -- verify \
            --file "$root/dossier.json" \
            | tee "$root/verify.json"
          test "$(jq -r '.ok' "$root/verify.json")" = 'true'
          test "$(jq -r '.question.questionTextRetained' "$root/dossier.json")" = 'false'
          test "$(jq -r '.answerReady' "$root/dossier.json")" = 'false'
          ! grep -Fq "$question" "$root/dossier.json"
          cp "$root/dossier.json" "$RUNNER_TEMP/research-dossier-smoke.json"

      - name: Complete Arc regression
        id: regression
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/full-tests.log"

      - name: Production build
        id: build
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Commit exact qualified repair
        id: candidate
        if: steps.repair.outcome == 'success' && steps.typecheck.outcome == 'success' && steps.focused.outcome == 'success' && steps.smoke.outcome == 'success' && steps.regression.outcome == 'success' && steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git restore --worktree -- docs/game 2>/dev/null || true
          git ls-files --others --exclude-standard -z \
            | while IFS= read -r -d '' generated; do
                case "$generated" in
                  docs/game/*|*.js|*.js.map|*.d.ts) rm -rf "$generated" ;;
                esac
              done
          git diff --check
          git diff --name-only | sort > "$RUNNER_TEMP/candidate-paths.txt"
          cat > "$RUNNER_TEMP/expected-paths.txt" <<'PATHS'
          tests/narrative/canon/asoiaf-research-question-dossier.test.ts
          tools/lib/asoiaf-research-question-dossier.ts
          PATHS
          diff -u "$RUNNER_TEMP/expected-paths.txt" "$RUNNER_TEMP/candidate-paths.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tests/narrative/canon/asoiaf-research-question-dossier.test.ts \
            tools/lib/asoiaf-research-question-dossier.ts
          git diff --cached --check
          git commit -m 'Harden ASOIAF research dossier identity custody'
          final_sha="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          git push origin HEAD:feature/asoiaf-research-question-dossier-v1
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"

      - name: Retain exact v2 diagnostics
        if: always()
        env:
          FINAL_SHA: ${{ steps.candidate.outputs.final_sha }}
          REPAIR: ${{ steps.repair.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          REGRESSION: ${{ steps.regression.outcome }}
          BUILD: ${{ steps.build.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          root='asoiaf-research-question-dossier-repair-v2'
          mkdir -p "$root"
          cp "$RUNNER_TEMP"/*.log "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP/research-dossier-smoke.json" "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP/candidate-paths.txt" "$root/" 2>/dev/null || true
          printf '%s\n' "$GITHUB_SHA" > "$root/trigger-sha.txt"
          printf '%s\n' "${FINAL_SHA:-not-issued}" > "$root/candidate-sha.txt"
          printf '%s\n' \
            "repair=$REPAIR" \
            "typecheck=$TYPECHECK" \
            "focused=$FOCUSED" \
            "smoke=$SMOKE" \
            "regression=$REGRESSION" \
            "build=$BUILD" \
            > "$root/outcomes.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" \
            > "$root/SHA256SUMS"

      - name: Upload v2 diagnostics
        if: always()
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-research-question-dossier-repair-v2
          path: asoiaf-research-question-dossier-repair-v2
          if-no-files-found: error
          retention-days: 30

      - name: Post bounded v2 result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.candidate.outputs.final_sha }}
          ARTIFACT_ID: ${{ steps.upload.outputs['artifact-id'] }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs['artifact-digest'] }}
          REPAIR: ${{ steps.repair.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          REGRESSION: ${{ steps.regression.outcome }}
          BUILD: ${{ steps.build.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FINAL_SHA:-}" ]; then
            gh pr comment 243 --repo "$GITHUB_REPOSITORY" --body \
              "Research dossier integrity repair v2 is qualified and pushed on candidate \`${FINAL_SHA}\`. TypeScript, the expanded focused dossier suite, the text-free operator smoke, the complete Arc regression, and production build passed. Artifact \`${ARTIFACT_ID}\` has ZIP digest \`${ARTIFACT_DIGEST}\`. Nested identities and admission semantics are independently verified."
          else
            gh pr comment 243 --repo "$GITHUB_REPOSITORY" --body \
              "Research dossier repair v2 did not issue a candidate. Repair \`${REPAIR}\`, TypeScript \`${TYPECHECK}\`, focused \`${FOCUSED}\`, smoke \`${SMOKE}\`, regression \`${REGRESSION}\`, build \`${BUILD}\`. Artifact \`${ARTIFACT_ID}\` has ZIP digest \`${ARTIFACT_DIGEST}\`. No dossier qualification is claimed."
            exit 1
          fi