name: Repair and qualify ASOIAF research question dossier v4

on:
  push:
    branches:
      - feature/asoiaf-research-question-dossier-v1
    paths:
      - '.github/workflows/repair-and-qualify-asoiaf-research-question-dossier-v4.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: repair-and-qualify-asoiaf-research-question-dossier-v4
  cancel-in-progress: false

jobs:
  repair_qualify_and_push_code:
    if: github.repository == 'BigBirdReturns/axm-arc' && github.ref_name == 'feature/asoiaf-research-question-dossier-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact dossier parent
        uses: actions/checkout@v4
        with:
          ref: feature/asoiaf-research-question-dossier-v1
          fetch-depth: 0
          show-progress: false

      - name: Bind exact code-only transaction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = 'feature/asoiaf-research-question-dossier-v1'
          test -z "$(git status --porcelain)"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply exact strict-TypeScript repairs
        id: repair
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee "$RUNNER_TEMP/repair.log"
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{path}: expected one target, found {count}: {old!r}'
                  )
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          source = Path('tools/lib/asoiaf-research-question-dossier.ts')
          test = Path('tests/narrative/canon/asoiaf-research-question-dossier.test.ts')
          replace_once(
              source,
              'reference.snippetCharacters !== null',
              'reference.snippetCharacters != null',
          )
          replace_once(
              test,
              'validateAsoiafResearchQuestionDossier(tampered).map(',
              'validateAsoiafResearchQuestionDossier(\n'
              '        tampered as unknown as typeof dossier,\n'
              '      ).map(',
          )
          if source.read_text(encoding='utf-8').count(
              'reference.snippetCharacters != null'
          ) != 1:
              raise SystemExit('snippet narrowing repair is not singular')
          if test.read_text(encoding='utf-8').count(
              'tampered as unknown as typeof dossier'
          ) != 1:
              raise SystemExit('tamper fixture runtime cast is not singular')
          print('ASOIAF_RESEARCH_DOSSIER_V4_REPAIR_COMPLETE')
          PY
          git diff --check

      - name: Strict TypeScript
        id: typecheck
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/typecheck.log"

      - name: Focused research dossier qualification
        id: focused
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test -- tests/narrative/canon/asoiaf-research-question-dossier.test.ts \
            2>&1 | tee "$RUNNER_TEMP/focused-tests.log"

      - name: Text-free operator smoke
        id: smoke
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          root="$RUNNER_TEMP/research-dossier-smoke"
          mkdir -p "$root"
          question='Who is Varys?'
          npm run --silent asoiaf:research-dossier -- route \
            --question "$question" \
            --continuity book-main \
            --lane entity-resolution \
            | tee "$root/route.json"
          test "$(jq -r '.laneIds[0]' "$root/route.json")" = 'entity-resolution'
          cat > "$root/input.json" <<'JSON'
          {
            "questionText": "Who is Varys?",
            "createdBy": "qualification:repair-v4",
            "createdAt": "2026-08-04T20:30:00.000Z",
            "laneIds": ["entity-resolution"],
            "continuityIds": ["book-main"],
            "gaps": [
              {
                "kind": "private-source-missing",
                "laneId": "entity-resolution",
                "continuityId": "book-main",
                "sourceId": "local-agot",
                "detail": "No holder-controlled edition was mounted in the synthetic operator smoke."
              }
            ]
          }
          JSON
          npm run --silent asoiaf:research-dossier -- build \
            --input "$root/input.json" \
            --out "$root/dossier.json" \
            | tee "$root/build.json"
          npm run --silent asoiaf:research-dossier -- verify \
            --file "$root/dossier.json" \
            | tee "$root/verify.json"
          test "$(jq -r '.ok' "$root/verify.json")" = 'true'
          test "$(jq -r '.question.questionTextRetained' "$root/dossier.json")" = 'false'
          test "$(jq -r '.answerReady' "$root/dossier.json")" = 'false'
          test "$(jq -r '.authority' "$root/dossier.json")" = 'none'
          grep -q '"search-private-edition"' "$root/dossier.json"
          grep -q '"close-gap"' "$root/dossier.json"
          ! grep -Fq "$question" "$root/dossier.json"
          cp "$root/dossier.json" "$RUNNER_TEMP/research-dossier-smoke.json"

      - name: Complete Arc regression
        id: regression
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/full-tests.log"

      - name: Production build
        id: build
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Commit and push exact code candidate
        id: candidate
        if: steps.repair.outcome == 'success' && steps.typecheck.outcome == 'success' && steps.focused.outcome == 'success' && steps.smoke.outcome == 'success' && steps.regression.outcome == 'success' && steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --others --exclude-standard -z \
            | while IFS= read -r -d '' generated; do
                case "$generated" in
                  *.js|*.js.map|*.d.ts) rm -f "$generated" ;;
                esac
              done
          git diff --check
          printf '%s\n' \
            tests/narrative/canon/asoiaf-research-question-dossier.test.ts \
            tools/lib/asoiaf-research-question-dossier.ts \
            | sort > "$RUNNER_TEMP/expected-files.txt"
          git diff --name-only | sort > "$RUNNER_TEMP/actual-files.txt"
          diff -u "$RUNNER_TEMP/expected-files.txt" "$RUNNER_TEMP/actual-files.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/lib/asoiaf-research-question-dossier.ts \
            tests/narrative/canon/asoiaf-research-question-dossier.test.ts
          git diff --cached --check
          git commit -m 'Harden ASOIAF research dossier validation'
          final_sha="$(git rev-parse HEAD)"
          git push origin HEAD:feature/asoiaf-research-question-dossier-v1
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"

      - name: Retain exact repair qualification diagnostics
        if: always()
        env:
          FINAL_SHA: ${{ steps.candidate.outputs.final_sha }}
          REPAIR: ${{ steps.repair.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          REGRESSION: ${{ steps.regression.outcome }}
          BUILD: ${{ steps.build.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          root='asoiaf-research-question-dossier-repair-v4'
          mkdir -p "$root"
          cp "$RUNNER_TEMP"/*.log "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP/research-dossier-smoke.json" "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP/expected-files.txt" "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP/actual-files.txt" "$root/" 2>/dev/null || true
          printf '%s\n' "$GITHUB_SHA" > "$root/trigger-sha.txt"
          printf '%s\n' "${FINAL_SHA:-not-issued}" > "$root/candidate-sha.txt"
          printf '%s\n' \
            "repair=$REPAIR" \
            "typecheck=$TYPECHECK" \
            "focused=$FOCUSED" \
            "smoke=$SMOKE" \
            "regression=$REGRESSION" \
            "build=$BUILD" \
            > "$root/outcomes.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" \
            > "$root/SHA256SUMS"

      - name: Upload exact repair qualification diagnostics
        if: always()
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-research-question-dossier-repair-v4
          path: asoiaf-research-question-dossier-repair-v4
          if-no-files-found: error
          retention-days: 30

      - name: Post bounded repair result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.candidate.outputs.final_sha }}
          ARTIFACT_ID: ${{ steps.upload.outputs['artifact-id'] }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs['artifact-digest'] }}
          REPAIR: ${{ steps.repair.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          REGRESSION: ${{ steps.regression.outcome }}
          BUILD: ${{ steps.build.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FINAL_SHA:-}" ]; then
            gh pr comment 243 --repo "$GITHUB_REPOSITORY" --body \
              "Research dossier code is qualified and pushed on candidate \`${FINAL_SHA}\`. Strict TypeScript, the focused dossier suite, the text-free route/build/verify smoke, the complete Arc regression, and production build passed. Artifact \`${ARTIFACT_ID}\` has ZIP digest \`${ARTIFACT_DIGEST}\`. Connector settlement remains responsible only for deleting repair workflows and verifying the exact final head."
          else
            gh pr comment 243 --repo "$GITHUB_REPOSITORY" --body \
              "Research dossier repair v4 did not issue a candidate. Repair \`${REPAIR}\`, TypeScript \`${TYPECHECK}\`, focused \`${FOCUSED}\`, smoke \`${SMOKE}\`, regression \`${REGRESSION}\`, build \`${BUILD}\`. Artifact \`${ARTIFACT_ID}\` has ZIP digest \`${ARTIFACT_DIGEST}\`. No dossier qualification is claimed."
            exit 1
          fi