name: Repair and qualify ASOIAF reviewed answer packet v2

on:
  push:
    branches:
      - feature/asoiaf-reviewed-answer-packet-v1
    paths:
      - '.github/workflows/repair-and-qualify-asoiaf-reviewed-answer-packet-v2.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: repair-and-qualify-asoiaf-reviewed-answer-packet-v2
  cancel-in-progress: false

jobs:
  repair_qualify_and_push:
    if: github.repository == 'BigBirdReturns/axm-arc' && github.ref_name == 'feature/asoiaf-reviewed-answer-packet-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact answer-packet parent
        uses: actions/checkout@v4
        with:
          ref: feature/asoiaf-reviewed-answer-packet-v1
          fetch-depth: 0
          show-progress: false

      - name: Bind exact repair transaction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = 'feature/asoiaf-reviewed-answer-packet-v1'
          test -z "$(git status --porcelain)"
          test -f tools/lib/asoiaf-reviewed-answer-packet.ts
          test -f tests/narrative/canon/asoiaf-reviewed-answer-packet.test.ts

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Repair transaction admission scope structurally
        id: repair
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee "$RUNNER_TEMP/repair.log"
          from pathlib import Path

          target = Path('tools/lib/asoiaf-reviewed-answer-packet.ts')
          text = target.read_text(encoding='utf-8')

          removals = (
              '    || receipt.canonReceipt.reviewComplete !== true\n',
              '    || receipt.canonReceipt.pendingCandidateIds.length !== 0\n',
          )
          for line in removals:
              count = text.count(line)
              if count != 1:
                  raise SystemExit(f'expected one global completion line, found {count}: {line!r}')
              text = text.replace(line, '', 1)

          old_message = (
              '        "answer transaction requires a passed, complete reconciliation '
              'with no pending candidates",\n'
          )
          new_message = (
              '        "answer transaction requires a passed reconciliation receipt '
              'and passed canon receipt",\n'
          )
          count = text.count(old_message)
          if count != 1:
              raise SystemExit(f'expected one transaction message, found {count}')
          text = text.replace(old_message, new_message, 1)
          target.write_text(text, encoding='utf-8')

          repaired = target.read_text(encoding='utf-8')
          for marker in (
              'receipt.canonReceipt.reviewComplete !== true',
              'receipt.canonReceipt.pendingCandidateIds.length !== 0',
              'complete reconciliation with no pending candidates',
          ):
              if marker in repaired:
                  raise SystemExit(f'global completion gate remains: {marker}')
          for marker in (
              'receipt.passed !== true',
              'receipt.canonReceipt === null',
              'receipt.canonReceipt.passed !== true',
              'answer-resolution-evidence',
              'answer-evidence-not-promoted',
              'candidate-outside-dossier',
          ):
              if marker not in repaired:
                  raise SystemExit(f'missing answer custody marker: {marker}')
          print('ANSWER_TRANSACTION_SCOPE_V2_REPAIRED')
          PY
          git diff --check

      - name: Strict TypeScript
        id: typecheck
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/typecheck.log"

      - name: Focused reviewed-answer qualification
        id: focused
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test -- tests/narrative/canon/asoiaf-reviewed-answer-packet.test.ts \
            2>&1 | tee "$RUNNER_TEMP/focused-tests.log"

      - name: Complete Arc regression
        id: regression
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/full-tests.log"

      - name: Production build
        id: build
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Commit exact code repair
        id: candidate
        if: steps.repair.outcome == 'success' && steps.typecheck.outcome == 'success' && steps.focused.outcome == 'success' && steps.regression.outcome == 'success' && steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --others --exclude-standard -z \
            | while IFS= read -r -d '' generated; do
                case "$generated" in
                  *.js|*.js.map|*.d.ts) rm -f "$generated" ;;
                esac
              done
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/lib/asoiaf-reviewed-answer-packet.ts
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Scope answer admission to cited reconciliation decisions'
          final_sha="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          git push origin HEAD:feature/asoiaf-reviewed-answer-packet-v1
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"

      - name: Retain exact repair diagnostics
        if: always()
        env:
          FINAL_SHA: ${{ steps.candidate.outputs.final_sha }}
          REPAIR: ${{ steps.repair.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          REGRESSION: ${{ steps.regression.outcome }}
          BUILD: ${{ steps.build.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          root='asoiaf-reviewed-answer-packet-repair-v2'
          mkdir -p "$root"
          cp "$RUNNER_TEMP"/*.log "$root/" 2>/dev/null || true
          printf '%s\n' "$GITHUB_SHA" > "$root/trigger-sha.txt"
          printf '%s\n' "${FINAL_SHA:-not-issued}" > "$root/candidate-sha.txt"
          printf '%s\n' \
            "repair=$REPAIR" \
            "typecheck=$TYPECHECK" \
            "focused=$FOCUSED" \
            "regression=$REGRESSION" \
            "build=$BUILD" \
            > "$root/outcomes.txt"
          printf '%s\n' \
            'transactionAdmission=passed-reconciliation-custody' \
            'globalWorkOrderCompletion=not-required' \
            'claimDecision=exact-nondeferred-required' \
            'evidencePromotion=exact-required' \
            'primaryStanding=required' \
            'dossierCandidateParity=required' \
            'graphEffect=none' \
            'canonEffect=none' \
            > "$root/answer-boundary.txt"
          git status --short > "$root/worktree-status.txt"
          git diff --stat > "$root/worktree-diff-stat.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" \
            > "$root/SHA256SUMS"

      - name: Upload repair diagnostics
        if: always()
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-reviewed-answer-packet-repair-v2
          path: asoiaf-reviewed-answer-packet-repair-v2
          if-no-files-found: error
          retention-days: 30

      - name: Post bounded repair result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.candidate.outputs.final_sha }}
          ARTIFACT_ID: ${{ steps.upload.outputs['artifact-id'] }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs['artifact-digest'] }}
          REPAIR: ${{ steps.repair.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          REGRESSION: ${{ steps.regression.outcome }}
          BUILD: ${{ steps.build.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FINAL_SHA:-}" ]; then
            gh pr comment 248 --repo "$GITHUB_REPOSITORY" --body \
              "Reviewed-answer transaction scope is repaired and code-qualified on candidate \`${FINAL_SHA}\`. Strict TypeScript, the focused answer suite, the complete Arc regression, and production build passed. Artifact \`${ARTIFACT_ID}\` has ZIP digest \`${ARTIFACT_DIGEST}\`. Transaction admission now requires passed reconciliation custody, while exact non-deferred decisions, promoted primary records, locators, and dossier candidates remain enforced per rendered claim."
          else
            gh pr comment 248 --repo "$GITHUB_REPOSITORY" --body \
              "Reviewed-answer repair v2 did not issue a candidate. Repair \`${REPAIR}\`, TypeScript \`${TYPECHECK}\`, focused \`${FOCUSED}\`, regression \`${REGRESSION}\`, build \`${BUILD}\`. Artifact \`${ARTIFACT_ID}\` has ZIP digest \`${ARTIFACT_DIGEST}\`. No answer qualification is claimed."
            exit 1
          fi