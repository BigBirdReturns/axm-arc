name: Repair and qualify ASOIAF structured admission health v1

on:
  push:
    branches:
      - feature/asoiaf-external-source-health-v1
    paths:
      - '.github/workflows/repair-and-qualify-asoiaf-structured-admission-health-v1.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: repair-and-qualify-asoiaf-structured-admission-health-v1
  cancel-in-progress: false

jobs:
  repair_qualify_and_push:
    if: github.repository == 'BigBirdReturns/axm-arc' && github.ref_name == 'feature/asoiaf-external-source-health-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact source-health branch
        uses: actions/checkout@v4
        with:
          ref: feature/asoiaf-external-source-health-v1
          fetch-depth: 0
          show-progress: false

      - name: Bind exact repair transaction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = 'feature/asoiaf-external-source-health-v1'
          test -z "$(git status --porcelain)"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply exact fixture and runtime repairs
        id: repair
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee "$RUNNER_TEMP/repair.log"
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f'{path}: expected one repair target, found {count}: {old!r}'
                  )
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_path = 'tests/narrative/canon/asoiaf-structured-observation-admission-health.test.ts'
          module_path = 'tools/lib/asoiaf-structured-observation-admission-health.ts'

          replace_once(
              test_path,
              '  const target = path.join(root, "structured-observation-admissions", filename);',
              '  const target = path.join(input.root, "structured-observation-admissions", filename);',
          )
          replace_once(
              test_path,
              '    uri: path.relative(root, target).split(path.sep).join("/"),',
              '    uri: path.relative(input.root, target).split(path.sep).join("/"),',
          )
          replace_once(
              module_path,
              '''  return (
              left.reviewedAt.localeCompare(right.reviewedAt)
              || left.admissionId.localeCompare(right.admissionId)
            );''',
              '''  return (
              String(left.reviewedAt).localeCompare(String(right.reviewedAt))
              || String(left.admissionId).localeCompare(String(right.admissionId))
            );''',
          )
          replace_once(
              module_path,
              '    stateEntryCount: state?.entries.length ?? 0,',
              '    stateEntryCount: (state?.entries ?? []).length,',
          )
          print('STRUCTURED_ADMISSION_HEALTH_REPAIR_COMPLETE')
          PY
          git diff --check

      - name: Strict TypeScript
        id: typecheck
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/typecheck.log"

      - name: Focused admission and source-health qualification
        id: focused
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test -- \
            tests/narrative/canon/asoiaf-structured-observation-admission-health.test.ts \
            tests/narrative/canon/asoiaf-structured-acquisition-source-health.test.ts \
            tests/narrative/canon/asoiaf-external-source-health.test.ts \
            2>&1 | tee "$RUNNER_TEMP/focused-tests.log"

      - name: Read-only operator smoke
        id: smoke
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          estate="$RUNNER_TEMP/structured-admission-health-estate"
          npm run --silent asoiaf:structured-admission:health -- audit \
            --root "$estate" \
            | tee "$RUNNER_TEMP/audit.log"
          npm run --silent asoiaf:structured-admission:health -- verify \
            --root "$estate" \
            | tee "$RUNNER_TEMP/verify.log"
          grep -q '"admissionCount": 0' "$RUNNER_TEMP/audit.log"
          grep -q '"ok": true' "$RUNNER_TEMP/verify.log"
          test ! -e "$estate"

      - name: Complete Arc regression
        id: regression
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/full-tests.log"

      - name: Production build
        id: build
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Commit exact qualified repair
        id: candidate
        if: steps.repair.outcome == 'success' && steps.typecheck.outcome == 'success' && steps.focused.outcome == 'success' && steps.smoke.outcome == 'success' && steps.regression.outcome == 'success' && steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git restore --worktree -- docs/game 2>/dev/null || true
          git ls-files --others --exclude-standard -z \
            | while IFS= read -r -d '' generated; do
                case "$generated" in
                  docs/game/*|*.js|*.js.map|*.d.ts) rm -rf "$generated" ;;
                esac
              done
          git diff --check
          git diff --name-only | sort > "$RUNNER_TEMP/candidate-paths.txt"
          cat > "$RUNNER_TEMP/expected-paths.txt" <<'PATHS'
          tests/narrative/canon/asoiaf-structured-observation-admission-health.test.ts
          tools/lib/asoiaf-structured-observation-admission-health.ts
          PATHS
          diff -u "$RUNNER_TEMP/expected-paths.txt" "$RUNNER_TEMP/candidate-paths.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tests/narrative/canon/asoiaf-structured-observation-admission-health.test.ts \
            tools/lib/asoiaf-structured-observation-admission-health.ts
          git diff --cached --check
          git commit -m 'Repair structured admission health fixture custody'
          final_sha="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          git push origin HEAD:feature/asoiaf-external-source-health-v1
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"

      - name: Retain exact repair diagnostics
        if: always()
        env:
          FINAL_SHA: ${{ steps.candidate.outputs.final_sha }}
          REPAIR: ${{ steps.repair.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          REGRESSION: ${{ steps.regression.outcome }}
          BUILD: ${{ steps.build.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          root='asoiaf-structured-admission-health-repair-v1'
          mkdir -p "$root"
          cp "$RUNNER_TEMP"/*.log "$root/" 2>/dev/null || true
          cp "$RUNNER_TEMP/candidate-paths.txt" "$root/" 2>/dev/null || true
          printf '%s\n' "$GITHUB_SHA" > "$root/trigger-sha.txt"
          printf '%s\n' "${FINAL_SHA:-not-issued}" > "$root/candidate-sha.txt"
          printf '%s\n' \
            "repair=$REPAIR" \
            "typecheck=$TYPECHECK" \
            "focused=$FOCUSED" \
            "smoke=$SMOKE" \
            "regression=$REGRESSION" \
            "build=$BUILD" \
            > "$root/outcomes.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" \
            > "$root/SHA256SUMS"

      - name: Upload repair diagnostics
        if: always()
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-structured-admission-health-repair-v1
          path: asoiaf-structured-admission-health-repair-v1
          if-no-files-found: error
          retention-days: 30

      - name: Post bounded repair result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.candidate.outputs.final_sha }}
          ARTIFACT_ID: ${{ steps.upload.outputs['artifact-id'] }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs['artifact-digest'] }}
          REPAIR: ${{ steps.repair.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          REGRESSION: ${{ steps.regression.outcome }}
          BUILD: ${{ steps.build.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FINAL_SHA:-}" ]; then
            gh pr comment 233 --repo "$GITHUB_REPOSITORY" --body \
              "Structured admission health repair is qualified and pushed on candidate \`${FINAL_SHA}\`. TypeScript, the focused admission and source-health suites, the read-only operator smoke, the complete Arc regression, and production build passed. Artifact \`${ARTIFACT_ID}\` has ZIP digest \`${ARTIFACT_DIGEST}\`."
          else
            gh pr comment 233 --repo "$GITHUB_REPOSITORY" --body \
              "Structured admission health repair did not issue a candidate. Repair \`${REPAIR}\`, TypeScript \`${TYPECHECK}\`, focused \`${FOCUSED}\`, smoke \`${SMOKE}\`, regression \`${REGRESSION}\`, build \`${BUILD}\`. Artifact \`${ARTIFACT_ID}\` has ZIP digest \`${ARTIFACT_DIGEST}\`. No health qualification is claimed."
            exit 1
          fi