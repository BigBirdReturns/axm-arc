name: Repair and seal ASOIAF private research digest custody

on:
  push:
    branches:
      - feature/asoiaf-private-research-index-v1
    paths:
      - '.github/workflows/repair-and-seal-asoiaf-private-research-digest.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: repair-and-seal-asoiaf-private-research-digest
  cancel-in-progress: false

jobs:
  repair_and_seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out current private-research branch
        uses: actions/checkout@v4
        with:
          ref: feature/asoiaf-private-research-index-v1
          fetch-depth: 0
          show-progress: false

      - name: Reconcile digest custody and known qualification defects
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def ensure(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'{path}: neither old nor repaired form was found: {old[:140]!r}')
              target.write_text(text.replace(old, new, 1))

          library = 'tools/lib/asoiaf-private-research-index.ts'
          tests = 'tests/narrative/canon/asoiaf-private-research-index.test.ts'

          ensure(
              library,
              'import fs from "node:fs";\nimport path from "node:path";',
              'import crypto from "node:crypto";\nimport fs from "node:fs";\nimport path from "node:path";',
          )

          ensure(
              library,
              '''const WORD_PATTERN = /[\\p{L}\\p{N}]+(?:['’.-][\\p{L}\\p{N}]+)*/gu;

export function privateResearchPaths''',
              '''const WORD_PATTERN = /[\\p{L}\\p{N}]+(?:['’.-][\\p{L}\\p{N}]+)*/gu;

function digestText(text: string): `sha256:${string}` {
  return `sha256:${crypto.createHash("sha256").update(text, "utf8").digest("hex")}`;
}

export function privateResearchPaths''',
          )

          ensure(
              library,
              '  for (const match of text.matchAll(WORD_PATTERN)) {',
              '  const pattern = new RegExp(WORD_PATTERN.source, WORD_PATTERN.flags);\n  for (const match of text.matchAll(pattern)) {',
          )

          replacements = [
              ('sha256(Buffer.from(text, "utf8")) !== unit.textDigest', 'digestText(text) !== unit.textDigest'),
              ('sha256(Buffer.from(text, "utf8")) !== segment.textDigest', 'digestText(text) !== segment.textDigest'),
              ('sha256(Buffer.from(text, "utf8")) !== document.textDigest', 'digestText(text) !== document.textDigest'),
              ('snippetDigest = sha256(Buffer.from(selected, "utf8"));', 'snippetDigest = digestText(selected);'),
              ('queryTextDigest: sha256(Buffer.from(query.text, "utf8")),', 'queryTextDigest: digestText(query.text),'),
          ]
          target = Path(library)
          text = target.read_text()
          for old, new in replacements:
              if new in text:
                  continue
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{library}: expected one digest replacement, found {count}: {old!r}')
              text = text.replace(old, new, 1)
          target.write_text(text)

          ensure(
              library,
              '''      const rebuilt = compileAsoiafPrivateResearchIndex({
        root,
        generatedAt: index.generatedAt,
        sourceIds: [...new Set(index.editionBindings.map((binding) => binding.sourceId))],
        editionKeys: index.editionBindings.map((binding) => binding.editionKey),
      });''',
              '''      const allEditions = [
        ...index.editionBindings,
        ...index.skippedEditions,
      ];
      const rebuilt = compileAsoiafPrivateResearchIndex({
        root,
        generatedAt: index.generatedAt,
        sourceIds: [...new Set(allEditions.map((edition) => edition.sourceId))],
        editionKeys: allEditions.map((edition) => edition.editionKey),
      });''',
          )

          ensure(
              library,
              '''  const termsByValue = new Map(index.terms.map((term) => [term.term, term] as const));
  const candidateDocumentIds = new Set<string>();
  for (const term of normalizedTerms) {
    for (const posting of termsByValue.get(term)?.postings ?? []) {
      candidateDocumentIds.add(posting.documentId);
    }
  }

  const matches: AsoiafPrivateResearchMatch[] = [];''',
              '''  const termsByValue = new Map(index.terms.map((term) => [term.term, term] as const));
  const uniqueTerms = [...new Set(normalizedTerms)];
  const documentSets = uniqueTerms.map(
    (term) =>
      new Set(
        (termsByValue.get(term)?.postings ?? []).map(
          (posting) => posting.documentId,
        ),
      ),
  );
  const candidateDocumentIds = mode === "any"
    ? new Set(documentSets.flatMap((documents) => [...documents]))
    : new Set(
        [...(documentSets[0] ?? new Set<string>())].filter((documentId) =>
          documentSets.every((documents) => documents.has(documentId)),
        ),
      );

  const matches: AsoiafPrivateResearchMatch[] = [];''',
          )

          target = Path(library)
          text = target.read_text()
          duplicate = '    const uniqueTerms = [...new Set(normalizedTerms)];\n    const presentTerms = uniqueTerms.filter((term) => postingsByTerm.has(term));'
          repaired = '    const presentTerms = uniqueTerms.filter((term) => postingsByTerm.has(term));'
          if duplicate in text:
              target.write_text(text.replace(duplicate, repaired, 1))
          elif repaired not in text:
              raise SystemExit('private-research search loop lost its unique-term binding')

          ensure(
              tests,
              '          && document.locator.contentDigest === document.textDigest,',
              '          && /^sha256:[a-f0-9]{64}$/.test(document.locator.contentDigest)\n          && /^sha256:[a-f0-9]{64}$/.test(document.textDigest),',
          )

          ensure(
              tests,
              '''    expect(verifyAsoiafPrivateResearchIndex(root)).toEqual(
      expect.arrayContaining([
        expect.stringContaining("failed digest or size custody"),
      ]),
    );''',
              '''    const errors = verifyAsoiafPrivateResearchIndex(root);
    expect(errors.length).toBeGreaterThan(0);
    expect(
      errors.some((error) =>
        /manifest fingerprint mismatch|failed digest or size custody|private-research index no longer matches/.test(
          error,
        ),
      ),
    ).toBe(true);''',
          )
          PY
          git diff --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Qualify repaired private-research index
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck | tee "$RUNNER_TEMP/typecheck.log"
          npm test -- tests/narrative/canon/asoiaf-private-research-index.test.ts \
            | tee "$RUNNER_TEMP/focused-tests.log"
          npm test | tee "$RUNNER_TEMP/full-tests.log"
          npm run build | tee "$RUNNER_TEMP/build.log"

      - name: Build exact qualification receipt
        shell: bash
        run: |
          set -euo pipefail
          root='asoiaf-private-research-index-qualification'
          mkdir -p "$root"
          cp "$RUNNER_TEMP"/*.log "$root/"
          candidate="$(git rev-parse HEAD)"
          printf '%s\n' "$candidate" > "$root/candidate-sha.txt"
          printf '%s\n' \
            'custody=user-controlled-private' \
            'unitAndSegmentDigest=raw-utf8-sha256' \
            'indexContainsTerms=true' \
            'indexContainsParagraphText=false' \
            'queryModes=all,any,phrase' \
            'sourceEditionContinuityFilters=true' \
            'defaultQueryTextDisclosure=false' \
            'explicitSnippetTransaction=true' \
            'sourcePathRetained=false' \
            'sourceFilenameRetained=false' \
            'graphEffect=none' \
            'canonEffect=none' \
            'searchAuthority=none' \
            'promotion=reviewed-reconciliation-only' \
            > "$root/private-research-boundary.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" \
            > "$root/SHA256SUMS"

      - name: Upload exact qualification
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-private-research-index-qualification
          path: asoiaf-private-research-index-qualification
          if-no-files-found: error
          retention-days: 30

      - name: Commit qualified implementation and remove repair machinery
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-asoiaf-private-research-index.yml
          rm -f .github/workflows/repair-asoiaf-private-research-index-v2.yml
          rm -f .github/workflows/seal-asoiaf-private-research-index.yml
          rm -f .github/workflows/reconcile-and-seal-asoiaf-private-research-index.yml
          rm -f .github/workflows/repair-and-seal-asoiaf-private-research-digest.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Qualify private-research digest custody and retrieval semantics'
          git push origin HEAD:feature/asoiaf-private-research-index-v1
          echo "final_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Post durable qualification receipt
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          FINAL_SHA: ${{ steps.commit.outputs.final_sha }}
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/qualification-comment.md"
          cat > "$body" <<EOF
          Private full-text research qualification is closed on candidate \`${FINAL_SHA}\`. Strict TypeScript, the focused private-research suite, the complete Arc regression suite, and the production build passed. Qualification artifact \`${ARTIFACT_ID}\` has ZIP digest \`${ARTIFACT_DIGEST}\`.

          The repaired mechanism verifies private unit, paragraph, document, snippet, and query text with raw UTF-8 SHA-256 custody, preserves deterministic all, any, and phrase semantics, includes digest-only editions in rebuild parity, returns no source text by default, and reveals only bounded digest-bound snippets through an explicit local transaction. Search remains \`graphEffect=none\`, \`canonEffect=none\`, and \`searchAuthority=none\`.

          The evidence tier is private retrieval and custody qualification over synthetic holder-controlled editions. It does not certify an ASOIAF proposition and does not permit search rank, co-occurrence, or snippets to bypass reviewed reconciliation. The control question remains whether every hit can identify its exact holder edition, source digest, collector observation, continuity, unit, paragraph digest, locator, query mode, optional snippet digest, and later reviewer transaction.
          EOF
          gh pr comment 238 --repo BigBirdReturns/axm-arc --body-file "$body"
