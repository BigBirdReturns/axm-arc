name: Repair and seal ASOIAF structured public acquisition

on:
  push:
    branches:
      - feature/asoiaf-structured-public-acquisition-v1
    paths:
      - '.github/workflows/repair-and-seal-asoiaf-structured-public-acquisition.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: repair-and-seal-asoiaf-structured-public-acquisition
  cancel-in-progress: false

