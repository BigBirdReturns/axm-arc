            | tee "$RUNNER_TEMP/focused-tests.log"
          npm test | tee "$RUNNER_TEMP/full-tests.log"
          npm run build | tee "$RUNNER_TEMP/build.log"

      - name: Build exact qualification receipt
        shell: bash
        run: |
          set -euo pipefail
          root='asoiaf-structured-public-acquisition-qualification'
          mkdir -p "$root"
          cp "$RUNNER_TEMP"/*.log "$root/"
          candidate="$(git rev-parse HEAD)"
          printf '%s\n' "$candidate" > "$root/candidate-sha.txt"
          printf '%s\n' \
            'networkAcquisition=qualified-synthetic-runtime' \
            'liveNetworkInCI=false' \
            'registeredEndpointsOnly=true' \
            'adapterSourceBinding=required' \
            'credentialBearingHeaders=false' \
            'robotsRequired=true' \
            'hostDelayFloorMilliseconds=1500' \
            'retryAfterHonored=true' \
            'crossOriginRedirects=false' \
            'responseSizeBounded=true' \
            'rawResponseDigest=raw-bytes-sha256' \
            'rawResponseRetained=false' \
            'normalizedRetention=rights-controlled' \
            'cacheReplay=zero-network-valid-receipt' \
            'batchPacer=shared' \
            'collectorAttemptParity=required' \
            'graphEffect=none' \
            'canonEffect=none' \
            > "$root/structured-acquisition-boundary.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" \
            > "$root/SHA256SUMS"

      - name: Upload exact qualification
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-structured-public-acquisition-qualification
          path: asoiaf-structured-public-acquisition-qualification
          if-no-files-found: error
          retention-days: 30

      - name: Commit qualified implementation and remove repair workflow
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-and-seal-asoiaf-structured-public-acquisition.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Qualify structured acquisition policy and receipt custody'
          git push origin HEAD:feature/asoiaf-structured-public-acquisition-v1
          echo "final_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Post durable qualification receipt
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          FINAL_SHA: ${{ steps.commit.outputs.final_sha }}
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/qualification-comment.md"
          cat > "$body" <<EOF
          Structured public acquisition qualification is closed on candidate \`${FINAL_SHA}\`. Strict TypeScript, the focused synthetic acquisition suite, the complete Arc regression suite, and the production build passed. Qualification artifact \`${ARTIFACT_ID}\` has ZIP digest \`${ARTIFACT_DIGEST}\`.

          The qualified runtime confines every signed plan to its registered adapter, atlas source, HTTPS host and path, and credential-free header surface; evaluates robots policy; shares the source host-delay floor across robots, data, retries, redirects, and batch boundaries; honors \`Retry-After\`; refuses cross-origin or unregistered redirects; bounds response size and JSON media; binds the adapter to the raw response byte SHA-256; retains no raw response; preserves collector attempt parity; and issues a new valid zero-network receipt for cache replay. Acquisition remains \`graphEffect=none\` and \`canonEffect=none\`.

          The evidence tier is structured acquisition, normalization, and custody qualification over deterministic synthetic runtimes. It does not certify the truth of an ASOIAF proposition and does not permit endpoint availability or normalized reference data to bypass reviewed reconciliation. The control question remains whether every record can identify its signed plan, robots and pacing law, exact raw response, retained fields and rights rule, collector observation, candidate, receipt, and later reviewer transaction.
          EOF
          gh pr comment 239 --repo BigBirdReturns/axm-arc --body-file "$body"
