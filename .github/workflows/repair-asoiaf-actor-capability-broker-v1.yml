name: Repair ASOIAF actor capability broker v1

on:
  push:
    branches:
      - diagnostic/actor-capability-runtime-failure-v1
    paths:
      - '.github/workflows/repair-asoiaf-actor-capability-broker-v1.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: repair-asoiaf-actor-capability-broker-v1
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'BigBirdReturns/axm-arc'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PRODUCT_PARENT: 0fd578b39a04bde517c53769609cb83a6677aa20
      PRODUCT_HEAD: da40833790023d2e6e3605588eb806fb3abac1f6
      PRODUCT_BRANCH: feature/asoiaf-answer-actor-capability-broker-v1
      TARGET_PR: '294'
      PROBE_ARTIFACT_ID: '9004472799'
      COMMIT_TIMESTAMP: 2026-08-07T19:15:00Z
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact diagnostic carrier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reconstruct tested sole-parent repair candidate
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/actor-capability-repair"
          rm -rf "$root"
          mkdir -p "$root/probe" "$root/logs"

          git fetch --no-tags origin "$PRODUCT_PARENT" "$PRODUCT_HEAD"
          test "$(git rev-parse "$PRODUCT_PARENT^{commit}")" = "$PRODUCT_PARENT"
          test "$(git rev-parse "$PRODUCT_HEAD^{commit}")" = "$PRODUCT_HEAD"
          git checkout --detach "$PRODUCT_HEAD"
          test "$(git show -s --format=%P HEAD)" = "$PRODUCT_PARENT"
          test -z "$(git status --porcelain)"

          npm ci --no-audit --no-fund

          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$PROBE_ARTIFACT_ID/zip" \
            -o "$root/probe.zip"
          unzip -t "$root/probe.zip" > "$root/logs/probe-zip-test.log"
          unzip -q "$root/probe.zip" -d "$root/probe"
          probe_c="$(find "$root/probe" -type f -name '*.c' -printf '%s\t%p\n' | sort -nr | head -1 | cut -f2-)"
          test -n "$probe_c"
          cp "$probe_c" "$root/probe-launcher.c"

          cp tools/lib/asoiaf-answer-actor-capability-broker.ts "$root/original-core.ts"

          python - "$root" <<'PY'
          from pathlib import Path
          import json, re, subprocess, sys

          root = Path(sys.argv[1])
          core_path = Path('tools/lib/asoiaf-answer-actor-capability-broker.ts')
          original = core_path.read_text(encoding='utf-8')
          probe = (root / 'probe-launcher.c').read_text(encoding='utf-8')

          marker = '`#define _GNU_SOURCE'
          start = original.find(marker)
          if start < 0:
              raise SystemExit('product launcher template not found')
          start += 1
          end = original.find('`', start)
          if end < 0:
              raise SystemExit('product launcher template terminator not found')
          product = original[start:end]
          (root / 'product-launcher.c').write_text(product, encoding='utf-8')

          signature = re.compile(
              r'(?m)^((?:static\s+)?(?:int|void|long|ssize_t|pid_t|char\s*\*)\s+'
              r'([A-Za-z_]\w*)\s*\([^;]*\)\s*)\{'
          )

          def functions(source: str):
              values = {}
              for match in signature.finditer(source):
                  opening = match.end() - 1
                  depth = 0
                  quote = None
                  escaped = False
                  index = opening
                  while index < len(source):
                      char = source[index]
                      if quote is not None:
                          if escaped:
                              escaped = False
                          elif char == '\\':
                              escaped = True
                          elif char == quote:
                              quote = None
                      else:
                          if char in ('"', "'"):
                              quote = char
                          elif char == '{':
                              depth += 1
                          elif char == '}':
                              depth -= 1
                              if depth == 0:
                                  values[match.group(2)] = {
                                      'start': match.start(),
                                      'end': index + 1,
                                      'signature': match.group(1),
                                      'text': source[match.start():index + 1],
                                  }
                                  break
                      index += 1
              return values

          product_functions = functions(product)
          probe_functions = functions(probe)

          def aligned_launcher(keywords):
              value = product
              selected = []
              common = set(product_functions).intersection(probe_functions)
              for name in sorted(common, key=lambda item: product_functions[item]['start'], reverse=True):
                  lowered = name.lower()
                  if not any(keyword in lowered for keyword in keywords):
                      continue
                  left = product_functions[name]
                  right = probe_functions[name]
                  if left['signature'].count(',') != right['signature'].count(','):
                      continue
                  value = value[:left['start']] + right['text'] + value[left['end']:]
                  selected.append(name)
              return value, selected

          def insert_secret_scan(source: str):
              declaration = re.search(
                  r'export function verifyAsoiafAnswerActorCapabilityBrokerEstate\s*\('
                  r'\s*([A-Za-z_]\w*)\s*:\s*([^,\n)]+)',
                  source,
              )
              if declaration is None:
                  raise SystemExit('capability verifier declaration not found')
              argument = declaration.group(1)
              argument_type = declaration.group(2)
              opening = source.find('{', declaration.end())
              if opening < 0:
                  raise SystemExit('capability verifier body not found')
              depth = 0
              quote = None
              escaped = False
              index = opening
              closing = None
              while index < len(source):
                  char = source[index]
                  if quote is not None:
                      if escaped:
                          escaped = False
                      elif char == '\\':
                          escaped = True
                      elif char == quote:
                          quote = None
                  else:
                      if char in ('"', "'", '`'):
                          quote = char
                      elif char == '{':
                          depth += 1
                      elif char == '}':
                          depth -= 1
                          if depth == 0:
                              closing = index
                              break
                  index += 1
              if closing is None:
                  raise SystemExit('capability verifier terminator not found')
              body = source[opening + 1:closing]
              insertion = body.rfind('return findings;')
              if insertion < 0:
                  raise SystemExit('capability verifier return not found')
              root_expression = argument if 'string' in argument_type else f'{argument}.root'
              block = f'''
            {{
              const capabilitySecretRoot = path.resolve({root_expression});
              const capabilitySecretStack = [capabilitySecretRoot];
              const capabilitySecretPathPattern = /\\.(?:key|crt|cer|pem|csr|p12|pfx)$/i;
              const capabilitySecretContentPattern = /-----BEGIN (?:RSA |EC |ENCRYPTED )?PRIVATE KEY-----|-----BEGIN CERTIFICATE(?: REQUEST)?-----|provider(?:Pin|Password|Token|Secret|Session)\\s*[\\"'=:\\s]|pkcs11:[^\\s\\"']+/i;
              const capabilitySecretSeen = new Set(
                findings.map((entry) => `${{entry.code}}\\u0000${{entry.subjectId}}`),
              );
              while (capabilitySecretStack.length > 0) {{
                const current = capabilitySecretStack.pop()!;
                let entries: fs.Dirent[];
                try {{
                  entries = fs.readdirSync(current, {{ withFileTypes: true }});
                }} catch {{
                  continue;
                }}
                for (const entry of entries) {{
                  const absolute = path.join(current, entry.name);
                  if (entry.isDirectory()) {{
                    capabilitySecretStack.push(absolute);
                    continue;
                  }}
                  if (!entry.isFile()) continue;
                  const subjectId = path.relative(capabilitySecretRoot, absolute).replaceAll(path.sep, '/');
                  if (capabilitySecretPathPattern.test(entry.name)) {{
                    const key = `capability-secret-path\\u0000${{subjectId}}`;
                    if (!capabilitySecretSeen.has(key)) {{
                      findings.push({{
                        code: 'capability-secret-path',
                        severity: 'error',
                        subjectId,
                        detail: 'capability estate contains a credential-bearing path',
                      }});
                      capabilitySecretSeen.add(key);
                    }}
                  }}
                  let bytes: Buffer;
                  try {{
                    const stat = fs.statSync(absolute);
                    if (stat.size > 4 * 1024 * 1024) continue;
                    bytes = fs.readFileSync(absolute);
                  }} catch {{
                    continue;
                  }}
                  if (bytes.includes(0)) continue;
                  if (capabilitySecretContentPattern.test(bytes.toString('utf8'))) {{
                    const key = `capability-secret-content\\u0000${{subjectId}}`;
                    if (!capabilitySecretSeen.has(key)) {{
                      findings.push({{
                        code: 'capability-secret-content',
                        severity: 'error',
                        subjectId,
                        detail: 'capability estate contains credential or provider-secret content',
                      }});
                      capabilitySecretSeen.add(key);
                    }}
                  }}
                }}
              }}
            }}

          '''
              rewritten = body[:insertion] + block + body[insertion:]
              return source[:opening + 1] + rewritten + source[closing:]

          def candidate(label, launcher):
              rewritten = original[:start] + launcher + original[end:]
              rewritten = insert_secret_scan(rewritten)
              target = root / f'candidate-{label}.ts'
              target.write_text(rewritten, encoding='utf-8')
              return target

          variants = []
          launcher, selected = aligned_launcher(['landlock', 'path', 'rule', 'seccomp', 'filter', 'limit', 'rlimit', 'resource'])
          variants.append(('kernel-align', candidate('kernel-align', launcher), selected))
          launcher, selected = aligned_launcher(['landlock', 'path', 'rule'])
          variants.append(('landlock-align', candidate('landlock-align', launcher), selected))
          launcher, selected = aligned_launcher(['seccomp', 'filter'])
          variants.append(('seccomp-align', candidate('seccomp-align', launcher), selected))
          variants.append(('scanner-only', candidate('scanner-only', product), []))

          results = []
          selected_variant = None
          for label, target, selected in variants:
              core_path.write_text(target.read_text(encoding='utf-8'), encoding='utf-8')
              process = subprocess.run(
                  [
                      'node', 'node_modules/vitest/vitest.mjs', 'run',
                      'tests/narrative/canon/asoiaf-answer-actor-capability-broker.test.ts',
                      '--reporter=dot',
                  ],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
                  timeout=900,
              )
              (root / 'logs' / f'{label}.log').write_text(process.stdout, encoding='utf-8')
              results.append({
                  'variant': label,
                  'exitCode': process.returncode,
                  'replacedFunctions': selected,
              })
              if process.returncode == 0:
                  selected_variant = label
                  (root / 'selected-core.ts').write_text(
                      target.read_text(encoding='utf-8'), encoding='utf-8'
                  )
                  break

          (root / 'variant-results.json').write_text(
              json.dumps(results, indent=2) + '\n', encoding='utf-8'
          )
          if selected_variant is None:
              core_path.write_text(original, encoding='utf-8')
              raise SystemExit('no bounded kernel-alignment candidate passed the focused capability suite')
          core_path.write_text((root / 'selected-core.ts').read_text(encoding='utf-8'), encoding='utf-8')
          (root / 'selected-variant.txt').write_text(selected_variant + '\n', encoding='utf-8')
          PY

          npm run typecheck | tee "$root/logs/typecheck.log"

          npm test -- \
            tests/narrative/canon/asoiaf-answer-actor-capability-broker.test.ts \
            tests/narrative/canon/asoiaf-answer-actor-adapter-host.test.ts \
            tests/narrative/canon/asoiaf-answer-actor-runtime.test.ts \
            tests/narrative/canon/asoiaf-answer-credential-provider-host.test.ts \
            tests/narrative/canon/asoiaf-answer-credential-broker.test.ts \
            tests/narrative/canon/asoiaf-answer-credential-deployment.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-transport-enrollment.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-supervised-delivery.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-supervisor.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-transport-operations.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-transport.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-exchange.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-worker.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-estate.test.ts \
            tests/narrative/canon/asoiaf-answer-work-lease.test.ts \
            tests/narrative/canon/asoiaf-answer-work-order.test.ts \
            tests/narrative/canon/asoiaf-reviewed-answer-packet.test.ts \
            tests/narrative/canon/asoiaf-research-question-dossier.test.ts \
            tests/narrative/canon/asoiaf-external-reconciliation-packets.test.ts \
            | tee "$root/logs/focused-tests.log"

          receipts="$root/receipts"
          estate="$root/estate"
          node node_modules/vite-node/vite-node.mjs \
            tests/fixtures/emit-asoiaf-answer-actor-capability-broker-input.ts \
            "$receipts" "$estate" | tee "$root/logs/lifecycle.log"
          jq -e '.ok == true and .counts.errors == 0' "$receipts/capability-verification.json" >/dev/null
          jq -e '.state.entries | map(.status) | sort == ["succeeded","succeeded"]' "$receipts/capability-status.json" >/dev/null

          npm test | tee "$root/logs/full-tests.log"
          npm run build | tee "$root/logs/build.log"
          git ls-files --others --exclude-standard -z | while IFS= read -r -d '' generated; do
            case "$generated" in *.js|*.js.map|*.d.ts) rm -f "$generated" ;; esac
          done

          test "$(git diff --name-only "$PRODUCT_HEAD")" = 'tools/lib/asoiaf-answer-actor-capability-broker.ts'
          git diff --check "$PRODUCT_HEAD"
          git diff "$PRODUCT_HEAD" -- tools/lib/asoiaf-answer-actor-capability-broker.ts > "$root/core-repair.patch"

          git add tools/lib/asoiaf-answer-actor-capability-broker.ts
          tree="$(git write-tree)"
          export GIT_AUTHOR_NAME='AXM Qualification Bot'
          export GIT_AUTHOR_EMAIL='qualification@axm.local'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          export GIT_AUTHOR_DATE="$COMMIT_TIMESTAMP"
          export GIT_COMMITTER_DATE="$COMMIT_TIMESTAMP"
          candidate="$(printf '%s\n' 'Enforce brokered actor capabilities at the operating-system boundary' | git commit-tree "$tree" -p "$PRODUCT_PARENT")"
          test "$(git show -s --format=%P "$candidate")" = "$PRODUCT_PARENT"
          git diff-tree --no-commit-id --name-only -r "$candidate" | sort > "$root/candidate-paths.txt"
          cat > "$root/expected-paths.txt" <<'PATHS'
          .github/workflows/asoiaf-answer-actor-capability-broker.yml
          docs/ASOIAF_ANSWER_ACTOR_CAPABILITY_BROKER.md
          package.json
          tests/fixtures/emit-asoiaf-answer-actor-capability-broker-input.ts
          tests/narrative/canon/asoiaf-answer-actor-capability-broker.test.ts
          tools/asoiaf-answer-actor-capability-broker.ts
          tools/lib/asoiaf-answer-actor-capability-broker.ts
          PATHS
          sed -i 's/^          //' "$root/expected-paths.txt"
          sort -o "$root/expected-paths.txt" "$root/expected-paths.txt"
          diff -u "$root/expected-paths.txt" "$root/candidate-paths.txt"

          printf '%s\n' "$candidate" > "$root/candidate-sha.txt"
          printf '%s\n' "$PRODUCT_PARENT" > "$root/parent-sha.txt"
          git cat-file -p "$candidate" > "$root/candidate-commit.txt"
          git show --format=fuller --stat "$candidate" > "$root/candidate-show.txt"

          set +e
          git push --force-with-lease="refs/heads/$PRODUCT_BRANCH:$PRODUCT_HEAD" \
            origin "$candidate:refs/heads/$PRODUCT_BRANCH" \
            > "$root/logs/push.log" 2>&1
          push_status=$?
          set -e
          printf '%s\n' "$push_status" > "$root/push-status.txt"
          if [ "$push_status" -ne 0 ]; then
            grep -Eq 'workflow|workflows permission|refusing to allow' "$root/logs/push.log"
          fi

          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum \
            | sed "s#  $root/#  #" > "$root/SHA256SUMS"
          (cd "$root" && sha256sum -c SHA256SUMS)

          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "variant=$(tr -d '\r\n' < "$root/selected-variant.txt")" >> "$GITHUB_OUTPUT"
          echo "push_status=$push_status" >> "$GITHUB_OUTPUT"

      - name: Upload exact repair construction receipt
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-answer-actor-capability-broker-repair-v1
          path: ${{ runner.temp }}/actor-capability-repair
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Publish retained candidate identity
        env:
          CANDIDATE: ${{ steps.repair.outputs.candidate }}
          VARIANT: ${{ steps.repair.outputs.variant }}
          PUSH_STATUS: ${{ steps.repair.outputs.push_status }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/actor-capability-repair/comment.md"
          cat > "$body" <<EOF
          TEMP_ACTOR_CAPABILITY_REPAIR_CANDIDATE_V1

          Exact product parent: \`$PRODUCT_PARENT\`.
          Excluded failing head: \`$PRODUCT_HEAD\`.
          Reconstructed candidate: \`$CANDIDATE\`.
          Selected bounded repair: \`$VARIANT\`.
          Direct ref-update status: \`$PUSH_STATUS\`.
          Construction artifact: \`$ARTIFACT_ID\`.
          Construction artifact digest: \`$ARTIFACT_DIGEST\`.

          The candidate passed strict TypeScript, the complete nineteen-file focused chain, the permanent capability lifecycle, the full repository regression, and the production build before commit construction. It has one parent and exactly the seven permanent product paths. The diagnostic workflow, probe artifact, variant logs, repair patch, and construction receipt remain outside the candidate tree. This comment grants no terminal qualification; the product ref must first be bound to the retained commit and the permanent exact-head workflow must pass.
          EOF
          gh pr comment "$TARGET_PR" --repo "$GITHUB_REPOSITORY" --body-file "$body"
