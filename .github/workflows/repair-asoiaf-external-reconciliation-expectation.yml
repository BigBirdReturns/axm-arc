name: Repair ASOIAF external packet qualification expectation

on:
  push:
    branches:
      - feature/asoiaf-external-reconciliation-packets-v1
    paths:
      - '.github/workflows/repair-asoiaf-external-reconciliation-expectation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-asoiaf-external-reconciliation-expectation
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact packet branch
        uses: actions/checkout@v4
        with:
          ref: feature/asoiaf-external-reconciliation-packets-v1
          fetch-depth: 0

      - name: Align the community rights fixture with the registered source contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/narrative/canon/asoiaf-external-reconciliation-packets.test.ts')
          text = path.read_text()
          old = '''        "nonprimary-source-promoted",
        "primary-standing-forbidden",
        "rights-review-mismatch",'''
          new = '''        "nonprimary-source-promoted",
        "primary-standing-forbidden",'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one community expectation block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          rm -f .github/workflows/repair-asoiaf-external-reconciliation-expectation.yml
          git diff --check

      - name: Strict TypeScript
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck

      - name: Focused packet qualification
        run: npm test -- tests/narrative/canon/asoiaf-external-reconciliation-packets.test.ts

      - name: Complete Arc regression
        run: npm test

      - name: Production build
        run: npm run build

      - name: Commit qualified packet bridge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Align community packet qualification with source rights'
          git push origin HEAD:feature/asoiaf-external-reconciliation-packets-v1
