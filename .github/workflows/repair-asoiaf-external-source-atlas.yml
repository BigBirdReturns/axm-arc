name: Repair ASOIAF external source atlas

on:
  push:
    branches:
      - feature/asoiaf-external-source-atlas-v1
    paths:
      - '.github/workflows/repair-asoiaf-external-source-atlas.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-asoiaf-external-source-atlas
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: feature/asoiaf-external-source-atlas-v1
          fetch-depth: 0

      - name: Apply bounded source repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, expected: int = 1) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), found {count}: {old!r}")
              target.write_text(text.replace(old, new))

          replace(
              "src/narrative/canon/asoiaf/external/catalog.ts",
              "    sourceHintRoutes: [hint],",
              "    sourceHintRoutes: [hint!],",
          )
          replace(
              "src/narrative/canon/asoiaf/external/catalog.ts",
              '["crossref-api", "Crossref works API", "https://api.crossref.org/works", "rest-api", ["publication-history", "scholarly-analogue", "dataset-validation"], "cc0"],',
              '["crossref-api", "Crossref works API", "https://api.crossref.org/works", "rest-api", ["publication-history", "historical-analogue", "dataset-validation"], "cc0"],',
          )
          replace(
              "src/narrative/canon/asoiaf/external/atlas.ts",
              "  AsoiafExternalCollectionStep,\n",
              "  AsoiafExternalCollectionStep,\n  AsoiafExternalContinuity,\n",
          )
          replace(
              "src/narrative/canon/asoiaf/external/atlas.ts",
              "      continuityIds: request.continuityIds\n        ? orderedStrings(request.continuityIds)\n        : undefined,",
              "      continuityIds: request.continuityIds\n        ? (orderedStrings(request.continuityIds) as AsoiafExternalContinuity[])\n        : undefined,",
          )
          replace(
              "src/narrative/canon/asoiaf/external/atlas.ts",
              "  const sourceLaneEdgeCount = sources.reduce(\n    (sum, entry) => sum + sourceLaneIds(entry, lanes).length,\n    0,\n  );",
              "  const sourceLaneEdgeCount = sources.reduce(\n    (sum, entry) => sum + entry.roles.length,\n    0,\n  );",
          )
          replace(
              "src/narrative/canon/asoiaf/external/validate.ts",
              "      && lane.responsePolicy.communityStanding !== \"supporting-only\"",
              "      && lane.responsePolicy.communityStanding === \"not-applicable\"",
          )
          replace(
              "src/narrative/canon/asoiaf/external/validate.ts",
              "      && lane.responsePolicy.communityStanding !== \"provenance-only\"",
              "      && lane.responsePolicy.communityStanding === \"not-applicable\"",
          )
          PY
          rm -f .github/workflows/repair-asoiaf-external-source-atlas.yml
          git diff --check

      - name: Qualify strict TypeScript
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck

      - name: Commit repaired source implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair strict typing and source-lane accounting'
          git push origin HEAD:feature/asoiaf-external-source-atlas-v1
