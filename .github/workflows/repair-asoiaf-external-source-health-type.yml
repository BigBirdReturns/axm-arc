# explicit one-use trigger 2026-08-04
name: Repair ASOIAF external source-health type narrowing

on:
  push:
    branches:
      - feature/asoiaf-external-source-health-v1
    paths:
      - '.github/workflows/repair-asoiaf-external-source-health-type.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-asoiaf-external-source-health-type
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source-health branch
        uses: actions/checkout@v4
        with:
          ref: feature/asoiaf-external-source-health-v1
          fetch-depth: 0

      - name: Remove unreachable retired switch arm
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/lib/asoiaf-external-source-health.ts')
          text = path.read_text()
          old = '''      case "rights-review":
      case "fresh":
      case "retired":
      case "integrity-error":
        break;'''
          new = '''      case "rights-review":
      case "fresh":
      case "integrity-error":
        break;'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one unreachable retired switch arm, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          rm -f .github/workflows/repair-asoiaf-external-source-health-type.yml
          git diff --check

      - name: Strict TypeScript
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck

      - name: Focused source-health qualification
        run: npm test -- tests/narrative/canon/asoiaf-external-source-health.test.ts

      - name: Complete Arc regression
        run: npm test

      - name: Production build
        run: npm run build

      - name: Commit repaired source-health implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair source-health status narrowing'
          git push origin HEAD:feature/asoiaf-external-source-health-v1
