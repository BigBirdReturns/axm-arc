name: Repair ASOIAF local edition intake

on:
  push:
    branches:
      - feature/asoiaf-local-edition-intake-v1
    paths:
      - '.github/workflows/repair-asoiaf-local-edition-intake.yml'
  pull_request:
    branches:
      - feature/asoiaf-external-collector-v1
    paths:
      - '.github/workflows/repair-asoiaf-local-edition-intake.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-asoiaf-local-edition-intake
  cancel-in-progress: false

jobs:
  repair:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact local-edition branch
        uses: actions/checkout@v4
        with:
          ref: feature/asoiaf-local-edition-intake-v1
          fetch-depth: 0

      - name: Apply bounded collector typing and EPUB-heading repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/lib/asoiaf-local-edition-intake.ts')
          text = path.read_text()

          replacements = [
              (
                  'import { collectLocalSource } from "./asoiaf-external-collector.js";',
                  'import {\n  collectLocalSource,\n  type CollectorRunResult,\n} from "./asoiaf-external-collector.js";',
              ),
              (
                  '  type CollectorObservationRecord,\n  type CollectorRunResult,\n} from "./asoiaf-external-estate.js";',
                  '  type CollectorObservationRecord,\n} from "./asoiaf-external-estate.js";',
              ),
              (
                  '''    const markup = entry.bytes.toString("utf8");
    const text = normalizeText(stripMarkup(markup));
    if (!text) continue;
    units.push({
      label: labels.get(memberPath) ?? firstHeading(markup) ?? id,''',
                  '''    const markup = entry.bytes.toString("utf8");
    const heading = firstHeading(markup);
    const bodyMarkup = markup.replace(
      /<h[1-3]\\b[^>]*>[\\s\\S]*?<\\/h[1-3]\\s*>/i,
      " ",
    );
    const text = normalizeText(stripMarkup(bodyMarkup));
    if (!text) continue;
    units.push({
      label: labels.get(memberPath) ?? heading ?? id,''',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one replacement target, found {count}: {old[:80]!r}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          rm -f .github/workflows/repair-asoiaf-local-edition-intake.yml
          git diff --check

      - name: Qualify repaired local-edition intake
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test -- tests/narrative/canon/asoiaf-local-edition-intake.test.ts
          npm test
          npm run build

      - name: Commit qualified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair local-edition typing and EPUB heading segmentation'
          git push origin HEAD:feature/asoiaf-local-edition-intake-v1
