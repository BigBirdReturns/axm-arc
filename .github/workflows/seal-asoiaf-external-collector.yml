name: Seal ASOIAF external collector

on:
  push:
    branches:
      - feature/asoiaf-external-collector-v1
    paths:
      - '.github/workflows/seal-asoiaf-external-collector.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: seal-asoiaf-external-collector-v1
  cancel-in-progress: true

jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact collector branch
        uses: actions/checkout@v4
        with:
          ref: feature/asoiaf-external-collector-v1
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Qualify collector transaction
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test -- tests/narrative/canon/asoiaf-external-collector.test.ts
          estate="$RUNNER_TEMP/collector-estate"
          npm run asoiaf:external:collector -- init --root "$estate"
          npm run asoiaf:external:collector -- verify --root "$estate" \
            | tee "$RUNNER_TEMP/collector-verify.json"
          grep -q '"ok": true' "$RUNNER_TEMP/collector-verify.json"
          npm test
          npm run build

      - name: Post passing receipt and remove seal workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          body=$(cat <<EOF
Collector fanout seal passed at candidate \`$candidate\`.

\`npm run typecheck\`, the focused collector suite, a 219-source CLI estate verification, the complete Arc regression suite, and the production build all passed. The qualified boundary remains graph effect \`none\`, canon effect \`none\`, collector promotion \`intake-only\`, single-threaded public collection, a 1,500 millisecond host-delay floor, holder-controlled local payload non-retention, content-addressed source revisions, and selective CC BY or CC BY-SA public credit.
EOF
          )
          gh api --method POST \
            repos/${GITHUB_REPOSITORY}/issues/231/comments \
            -f body="$body"
          rm -f .github/workflows/seal-asoiaf-external-collector.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Seal ASOIAF external collector qualification'
          git push origin HEAD:feature/asoiaf-external-collector-v1
