name: Seal ASOIAF external reconciliation packets v2

on:
  push:
    branches:
      - feature/asoiaf-external-reconciliation-packets-v1
    paths:
      - '.github/workflows/seal-asoiaf-external-reconciliation-packets-v2.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: seal-asoiaf-external-reconciliation-packets-v2
  cancel-in-progress: true

jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out current packet branch
        uses: actions/checkout@v4
        with:
          ref: feature/asoiaf-external-reconciliation-packets-v1
          fetch-depth: 0

      - name: Synchronize and normalize fixture
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin feature/asoiaf-external-reconciliation-packets-v1
          python - <<'PY'
          from pathlib import Path

          target = Path('tests/narrative/canon/asoiaf-external-reconciliation-packets.test.ts')
          text = target.read_text()
          old = '''      expect.arrayContaining([\n        "nonprimary-source-promoted",\n        "primary-standing-forbidden",\n        "rights-review-mismatch",\n      ]),'''
          new = '''      expect.arrayContaining([\n        "nonprimary-source-promoted",\n        "primary-standing-forbidden",\n      ]),'''
          if old in text:
              target.write_text(text.replace(old, new))
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Qualify reviewed packet transaction
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test -- tests/narrative/canon/asoiaf-external-reconciliation-packets.test.ts
          npm test
          npm run build

      - name: Seal branch and post receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin feature/asoiaf-external-reconciliation-packets-v1
          candidate="$(git rev-parse HEAD)"
          body=$(cat <<EOF
Reviewed external reconciliation-packet seal passed at candidate \`$candidate\`.

Strict TypeScript, the focused packet suite, the complete Arc regression suite, and the production build passed. The transaction requires reviewed collector custody, exact locators, named rights and evidence review, continuity isolation, primary-authority decision evidence, and the existing all-or-nothing canon reconciliation compiler.
EOF
          )
          gh api --method POST \
            repos/${GITHUB_REPOSITORY}/issues/232/comments \
            -f body="$body"
          rm -f .github/workflows/seal-asoiaf-external-reconciliation-packets.yml
          rm -f .github/workflows/seal-asoiaf-external-reconciliation-packets-v2.yml
          rm -f .github/workflows/repair-asoiaf-external-reconciliation-packets.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Seal reviewed external reconciliation packets'
          git push origin HEAD:feature/asoiaf-external-reconciliation-packets-v1
