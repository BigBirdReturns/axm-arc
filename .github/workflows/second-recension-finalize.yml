name: Second Recension Books I-III finalization

on:
  push:
    branches: [codex/second-recension-books-1-3]
    paths:
      - 'tools/second-recension/**'
      - '.github/workflows/second-recension-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: second-recension-books-1-3
  cancel-in-progress: true

jobs:
  finalize:
    if: ${{ hashFiles('tools/second-recension/apply.py') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply the reviewed Second Recension
        run: python tools/second-recension/apply.py
      - run: npm ci
      - name: Rebuild reviewed reference artifacts
        run: |
          npm run build:godscar-reference
          npm run build:dark-tomb-reference
          npm run build:common-ship-reference
          npm run build:relief-connected-fixture
      - name: TypeScript
        run: npm run typecheck
      - name: Second Recension and custody contracts
        run: >-
          npm test --
          tests/godscar/second-recension.test.ts
          tests/godscar/godscar.test.ts
          tests/dark-tomb/dark-tomb.test.ts
          tests/common-ship/common-ship.test.ts
          tests/common-ship/relief-circuit.test.ts
          tests/engine/connected-operation.test.ts
          tests/engine/connected-operation-fixture.test.ts
          tests/source-planes/registry.test.ts
      - name: Complete Arc regression suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Publish the verified candidate
        run: |
          rm -rf tools/second-recension
          git restore --source=HEAD --staged --worktree docs/game || true
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .github/workflows
          git commit -m "Encode Second Recension addenda for Books I-III"
          git push origin HEAD:codex/second-recension-books-1-3
