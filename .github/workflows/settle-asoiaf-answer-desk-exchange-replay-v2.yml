name: Settle ASOIAF answer desk exchange replay v2

on:
  pull_request:
    branches:
      - feature/asoiaf-answer-desk-worker-v1
    paths:
      - '.github/workflows/settle-asoiaf-answer-desk-exchange-replay-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: settle-asoiaf-answer-desk-exchange-replay-v2
  cancel-in-progress: false

jobs:
  settle:
    if: github.repository == 'BigBirdReturns/axm-arc' && github.event.pull_request.head.ref == 'feature/asoiaf-answer-desk-exchange-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact exchange head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Bind exact settlement transaction
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          test -f .github/workflows/repair-and-qualify-asoiaf-answer-desk-exchange-replay-v1.yml
          test -f .github/workflows/diagnose-asoiaf-answer-desk-exchange-replay-v1.yml
          test -f tools/lib/asoiaf-answer-desk-exchange.ts
          test -f tests/narrative/canon/asoiaf-answer-desk-exchange.test.ts

      - name: Apply exact replay repair and align verified classifications
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          repair_path = Path(
              '.github/workflows/repair-and-qualify-asoiaf-answer-desk-exchange-replay-v1.yml'
          )
          workflow = repair_path.read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          if workflow.count(marker) != 1:
              raise SystemExit('cannot locate exact staged replay repair')
          body = workflow.split(marker, 1)[1].split('\n          PY\n', 1)[0]
          exec(textwrap.dedent(body), {})

          test_path = Path('tests/narrative/canon/asoiaf-answer-desk-exchange.test.ts')
          test = test_path.read_text(encoding='utf-8')
          old_missing_head = (
              '    ).toThrow(/advancing settlement requires a refreshed answer work order/);\n'
          )
          new_missing_head = (
              '    ).toThrow(/advancing external result requires a refreshed answer work order/);\n'
          )
          if old_missing_head in test:
              test = test.replace(old_missing_head, new_missing_head, 1)

          old_pending = (
              '        "exchange-assignment-result-missing",\n'
          )
          new_pending = (
              '        "exchange-assignment-pending",\n'
          )
          if old_pending in test:
              test = test.replace(old_pending, new_pending, 1)
          test_path.write_text(test, encoding='utf-8')

          core = Path('tools/lib/asoiaf-answer-desk-exchange.ts').read_text(
              encoding='utf-8'
          )
          final_test = test_path.read_text(encoding='utf-8')
          for required in (
              'const claim: AsoiafAnswerDeskClaimResult = existingLease',
              'const existingAssignments = listJson<AsoiafAnswerExchangeAssignment>',
              'advancing && !afterWorkOrder',
              'const existingResults = listJson<AsoiafAnswerExchangeResult>',
              'const settlement: AsoiafAnswerDeskSettleResult = existingSettlement',
          ):
              if required not in core:
                  raise SystemExit(f'missing final replay marker: {required}')
          if old_missing_head in final_test:
              raise SystemExit('stale missing-head expectation remains')
          if new_missing_head not in final_test:
              raise SystemExit('exchange-specific missing-head expectation is absent')
          if '"exchange-assignment-result-missing",' in final_test:
              raise SystemExit('stale unsettled-assignment classification remains')
          if '"exchange-assignment-pending",' not in final_test:
              raise SystemExit('pending unsettled-assignment classification is absent')
          print('ASOIAF_ANSWER_DESK_EXCHANGE_REPLAY_V2_READY')
          PY
          git diff --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Strict TypeScript
        shell: bash
        run: npm run typecheck

      - name: Focused exchange, worker, estate, lease, answer, dossier, and reconciliation qualification
        shell: bash
        run: |
          set -euo pipefail
          npm test -- \
            tests/narrative/canon/asoiaf-answer-desk-exchange.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-worker.test.ts \
            tests/narrative/canon/asoiaf-answer-desk-estate.test.ts \
            tests/narrative/canon/asoiaf-answer-work-lease.test.ts \
            tests/narrative/canon/asoiaf-answer-work-order.test.ts \
            tests/narrative/canon/asoiaf-reviewed-answer-packet.test.ts \
            tests/narrative/canon/asoiaf-research-question-dossier.test.ts \
            tests/narrative/canon/asoiaf-external-reconciliation-packets.test.ts

      - name: Complete Arc regression
        shell: bash
        run: npm test

      - name: Production build
        shell: bash
        run: npm run build

      - name: Commit exact carrier-free exchange replay
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --others --exclude-standard -z \
            | while IFS= read -r -d '' generated; do
                case "$generated" in
                  *.js|*.js.map|*.d.ts) rm -f "$generated" ;;
                esac
              done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/lib/asoiaf-answer-desk-exchange.ts \
            tests/narrative/canon/asoiaf-answer-desk-exchange.test.ts
          git rm \
            .github/workflows/repair-and-qualify-asoiaf-answer-desk-exchange-replay-v1.yml \
            .github/workflows/diagnose-asoiaf-answer-desk-exchange-replay-v1.yml \
            .github/workflows/settle-asoiaf-answer-desk-exchange-replay-v2.yml
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          test ! -e .github/workflows/repair-and-qualify-asoiaf-answer-desk-exchange-replay-v1.yml
          test ! -e .github/workflows/diagnose-asoiaf-answer-desk-exchange-replay-v1.yml
          test ! -e .github/workflows/settle-asoiaf-answer-desk-exchange-replay-v2.yml
          git commit -m 'Repair external exchange exact replay'
          test -z "$(git status --porcelain)"
          git push origin HEAD:feature/asoiaf-answer-desk-exchange-v1
