name: Settle ASOIAF answer work lease v5

on:
  push:
    branches:
      - feature/asoiaf-answer-work-lease-v1
    paths:
      - '.github/workflows/settle-asoiaf-answer-work-lease-v5.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: repair-and-qualify-asoiaf-answer-work-lease-final
  cancel-in-progress: true

jobs:
  settle:
    if: github.repository == 'BigBirdReturns/axm-arc' && github.ref_name == 'feature/asoiaf-answer-work-lease-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Check out exact settlement parent
        uses: actions/checkout@v4
        with:
          ref: feature/asoiaf-answer-work-lease-v1
          fetch-depth: 0
          show-progress: false

      - name: Bind exact settlement transaction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = 'feature/asoiaf-answer-work-lease-v1'
          test -z "$(git status --porcelain)"
          test -f tools/lib/asoiaf-answer-work-lease.ts
          test -f tests/narrative/canon/asoiaf-answer-work-lease.test.ts

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply exact rendered-terminal projection repair
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          core_path = Path('tools/lib/asoiaf-answer-work-lease.ts')
          core = core_path.read_text(encoding='utf-8')

          set_anchor = '''  const settledLeaseIds: string[] = [];
          const activeItemKeys = new Set<string>();

          for (const lease of input.leases) {
          '''
          set_replacement = '''  const settledLeaseIds: string[] = [];
          const activeItemKeys = new Set<string>();
          const terminalItemKeys = new Set<string>();

          for (const lease of input.leases) {
          '''
          if 'const terminalItemKeys = new Set<string>();' not in core:
              if core.count(set_anchor) != 1:
                  raise SystemExit('cannot locate exact desk-state item-set block')
              core = core.replace(set_anchor, set_replacement, 1)

          settlement_anchor = '''    const settlement = settlementsByLease.get(lease.leaseId);
              if (settlement) {
                settledLeaseIds.push(lease.leaseId);
                continue;
              }
          '''
          settlement_replacement = '''    const settlement = settlementsByLease.get(lease.leaseId);
              if (settlement) {
                settledLeaseIds.push(lease.leaseId);
                if (
                  lease.workOrderId === input.workOrder.workOrderId
                  && settlement.outcome === "rendered"
                ) {
                  const settlementErrors = validateAsoiafAnswerWorkSettlement(
                    settlement,
                    {
                      lease,
                      beforeWorkOrder: input.workOrder,
                      afterWorkOrder: null,
                    },
                  ).filter((entry) => entry.severity === "error");
                  if (settlementErrors.length > 0) {
                    throw new Error(
                      `invalid rendered answer work settlement ${settlement.settlementId}`,
                    );
                  }
                  terminalItemKeys.add(lease.itemKey);
                }
                continue;
              }
          '''
          if 'terminalItemKeys.add(lease.itemKey);' not in core:
              if core.count(settlement_anchor) != 1:
                  raise SystemExit('cannot locate exact settled-lease branch')
              core = core.replace(settlement_anchor, settlement_replacement, 1)

          availability_anchor = '''  const availableItemIds = openItems
              .filter((item) => !activeItemKeys.has(asoiafAnswerWorkItemKey(item)))
              .map((item) => item.itemId);
          '''
          availability_replacement = '''  const availableItemIds = openItems
              .filter((item) => {
                const itemKey = asoiafAnswerWorkItemKey(item);
                return !activeItemKeys.has(itemKey) && !terminalItemKeys.has(itemKey);
              })
              .map((item) => item.itemId);
          '''
          if '!terminalItemKeys.has(itemKey)' not in core:
              if core.count(availability_anchor) != 1:
                  raise SystemExit('cannot locate exact availability projection')
              core = core.replace(availability_anchor, availability_replacement, 1)

          core_path.write_text(core, encoding='utf-8')

          test_path = Path('tests/narrative/canon/asoiaf-answer-work-lease.test.ts')
          test = test_path.read_text(encoding='utf-8')
          test_anchor = '''    expect(settlement.afterWorkOrderId).toBeNull();
              expect(settlement.afterStatus).toBe("rendered");
          '''
          test_replacement = '''    expect(settlement.afterWorkOrderId).toBeNull();
              expect(settlement.afterStatus).toBe("rendered");

              const state = buildAsoiafAnswerDeskState({
                workOrder: readyOrder,
                leases: [lease],
                settlements: [settlement],
                asOf: "2026-08-05T05:41:11.000Z",
              });
              expect(state.settledLeaseIds).toEqual([lease.leaseId]);
              expect(state.availableItemIds).not.toContain(renderItem.itemId);
              expect(state.nextAvailableItemId).toBeNull();
              expect(() =>
                claimAsoiafAnswerWorkItem({
                  workOrder: readyOrder,
                  itemId: renderItem.itemId,
                  workerId: "worker:second-renderer",
                  claimedAt: "2026-08-05T05:41:12.000Z",
                  leaseMilliseconds: 60_000,
                  existingLeases: [lease],
                  settlements: [settlement],
                }),
              ).toThrow(/terminal settlement/);
          '''
          if 'worker:second-renderer' not in test:
              if test.count(test_anchor) != 1:
                  raise SystemExit('cannot locate exact rendered-settlement assertions')
              test = test.replace(test_anchor, test_replacement, 1)
              test_path.write_text(test, encoding='utf-8')

          repaired = core_path.read_text(encoding='utf-8')
          for marker in (
              'const terminalItemKeys = new Set<string>();',
              'settlement.outcome === "rendered"',
              'terminalItemKeys.add(lease.itemKey);',
              '!terminalItemKeys.has(itemKey)',
          ):
              if marker not in repaired:
                  raise SystemExit(f'missing required rendered-terminal marker: {marker}')
          if 'worker:second-renderer' not in test_path.read_text(encoding='utf-8'):
              raise SystemExit('missing rendered terminal replay coverage')
          print('ASOIAF_ANSWER_WORK_LEASE_V5_REPAIRED')
          PY
          git diff --check

      - name: Strict TypeScript
        id: typecheck
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck | tee "$RUNNER_TEMP/typecheck.log"

      - name: Focused lease, lifecycle, and answer qualification
        id: focused
        shell: bash
        run: |
          set -euo pipefail
          npm test -- \
            tests/narrative/canon/asoiaf-answer-work-lease.test.ts \
            tests/narrative/canon/asoiaf-answer-work-order.test.ts \
            tests/narrative/canon/asoiaf-reviewed-answer-packet.test.ts \
            tests/narrative/canon/asoiaf-research-question-dossier.test.ts \
            tests/narrative/canon/asoiaf-external-reconciliation-packets.test.ts \
            | tee "$RUNNER_TEMP/focused-tests.log"

      - name: Complete Arc regression
        id: regression
        shell: bash
        run: |
          set -euo pipefail
          npm test | tee "$RUNNER_TEMP/full-tests.log"

      - name: Production build
        id: build
        shell: bash
        run: |
          set -euo pipefail
          npm run build | tee "$RUNNER_TEMP/build.log"

      - name: Commit exact carrier-free settlement
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --others --exclude-standard -z \
            | while IFS= read -r -d '' generated; do
                case "$generated" in
                  *.js|*.js.map|*.d.ts) rm -f "$generated" ;;
                esac
              done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/lib/asoiaf-answer-work-lease.ts \
            tests/narrative/canon/asoiaf-answer-work-lease.test.ts
          git rm -f --ignore-unmatch \
            .github/workflows/repair-and-qualify-asoiaf-answer-work-lease-v2.yml \
            .github/workflows/repair-and-qualify-asoiaf-answer-work-lease-v3.yml \
            .github/workflows/repair-and-qualify-asoiaf-answer-work-lease-v4.yml \
            .github/workflows/settle-asoiaf-answer-work-lease-v5.yml
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Retire successfully rendered answer work'
          final_sha="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          git push origin HEAD:feature/asoiaf-answer-work-lease-v1
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"

      - name: Retain exact settlement diagnostics
        if: always()
        env:
          FINAL_SHA: ${{ steps.candidate.outputs.final_sha }}
        shell: bash
        run: |
          set -euo pipefail
          root='asoiaf-answer-work-lease-settlement-v5'
          mkdir -p "$root"
          cp "$RUNNER_TEMP"/*.log "$root/" 2>/dev/null || true
          printf '%s\n' "$GITHUB_SHA" > "$root/trigger-sha.txt"
          printf '%s\n' "${FINAL_SHA:-not-issued}" > "$root/final-sha.txt"
          printf '%s\n' \
            'renderedItemAvailable=false' \
            'renderedSettlementValidated=true' \
            'terminalRenderReplay=refused' \
            'repairCarriers=removed' \
            'authority=none' \
            'graphEffect=none' \
            'canonEffect=none' \
            'answerEffect=none' \
            > "$root/settlement-boundary.txt"
          git status --short > "$root/worktree-status.txt"
          find "$root" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed "s#  $root/#  #" \
            > "$root/SHA256SUMS"

      - name: Upload settlement diagnostics
        if: always()
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: asoiaf-answer-work-lease-settlement-v5
          path: asoiaf-answer-work-lease-settlement-v5
          if-no-files-found: error
          retention-days: 30

      - name: Post bounded settlement result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.candidate.outputs.final_sha }}
          ARTIFACT_ID: ${{ steps.upload.outputs['artifact-id'] }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs['artifact-digest'] }}
          REPAIR: ${{ steps.repair.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          REGRESSION: ${{ steps.regression.outcome }}
          BUILD: ${{ steps.build.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${FINAL_SHA:-}" ]; then
            gh pr comment 250 --repo "$GITHUB_REPOSITORY" --body \
              "Rendered answer-work terminal custody is repaired and qualified on exact carrier-free candidate \`${FINAL_SHA}\`. Structurally valid rendered settlements now remove their unchanged render item from desk availability, and terminal replay remains refused. Strict TypeScript, focused lifecycle qualification, complete Arc regression, and production build passed. Artifact \`${ARTIFACT_ID}\` has ZIP digest \`${ARTIFACT_DIGEST}\`."
          else
            gh pr comment 250 --repo "$GITHUB_REPOSITORY" --body \
              "Rendered answer-work settlement v5 did not issue a candidate. Repair \`${REPAIR}\`, TypeScript \`${TYPECHECK}\`, focused \`${FOCUSED}\`, regression \`${REGRESSION}\`, build \`${BUILD}\`. Artifact \`${ARTIFACT_ID}\` has ZIP digest \`${ARTIFACT_DIGEST}\`. No updated lease qualification is claimed."
            exit 1
          fi
