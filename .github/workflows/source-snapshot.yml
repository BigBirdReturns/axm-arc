name: Source snapshot

on:
  push:
    branches:
      - agent/bootstrap-source-download

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out axm-arc implementation
        uses: actions/checkout@v4
        with:
          ref: agent/portable-run-first-charter
          path: axm-arc
      - name: Check out axm-world
        uses: actions/checkout@v4
        with:
          repository: BigBirdReturns/axm-world
          path: axm-world
      - name: Check out clifford-number
        uses: actions/checkout@v4
        with:
          repository: BigBirdReturns/clifford-number
          path: clifford-number
      - name: Install Arc dependencies
        working-directory: axm-arc
        run: npm ci
      - name: Install World dependencies
        working-directory: axm-world
        run: npm ci
      - name: Remove git metadata
        run: find . -name .git -type d -prune -exec rm -rf {} +
      - name: Upload development workspace
        uses: actions/upload-artifact@v4
        with:
          name: rodoh-dev-workspace-current
          path: |
            axm-arc
            axm-world
            clifford-number
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
