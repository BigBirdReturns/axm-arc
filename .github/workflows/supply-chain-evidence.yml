name: Arc supply-chain evidence

on:
  pull_request:
    paths:
      - 'scripts/supply-chain/**'
      - 'tests/release/supply-chain.test.ts'
      - 'docs/SUPPLY_CHAIN_CUSTODY.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/supply-chain-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/supply-chain/**'
      - 'tests/release/supply-chain.test.ts'
      - 'docs/SUPPLY_CHAIN_CUSTODY.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/supply-chain-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  SOURCE_DATE_EPOCH: '0'

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact Arc candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Qualify exact Arc source and product
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          git diff --check
          npm run typecheck
          npm test -- tests/release/supply-chain.test.ts
          npm test
          npm run build
      - name: Assemble deterministic Arc evidence subjects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/artifacts evidence/sbom evidence/attestations
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf evidence/artifacts/axm-arc-game.tar -C docs game
          gzip -n evidence/artifacts/axm-arc-game.tar
          node scripts/supply-chain/generate-cyclonedx.mjs \
            --lock package-lock.json \
            --package package.json \
            --commit '${{ github.event.pull_request.head.sha || github.sha }}' \
            --output evidence/sbom/axm-arc.cdx.json
          LOCK_SHA="$(sha256sum package-lock.json | cut -d' ' -f1)"
          node scripts/supply-chain/generate-provenance.mjs \
            --subject evidence/artifacts/axm-arc-game.tar.gz \
            --output evidence/provenance.intoto.json \
            --repository "$GITHUB_REPOSITORY" \
            --commit '${{ github.event.pull_request.head.sha || github.sha }}' \
            --ref "$GITHUB_REF" \
            --workflow "$GITHUB_WORKFLOW_REF" \
            --invocation "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --node "$(node --version)" \
            --npm "$(npm --version)" \
            --dependency "axm-arc-package-lock=$LOCK_SHA"
          (
            cd evidence
            {
              find artifacts sbom -type f -print0
              printf '%s\0' provenance.intoto.json
            } | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          node scripts/supply-chain/verify-offline-evidence.mjs --root evidence
      - name: Attest Arc build provenance
        if: github.event_name != 'pull_request'
        id: arc-provenance
        uses: actions/attest@v4
        with:
          subject-path: evidence/artifacts/axm-arc-game.tar.gz
      - name: Attest Arc SBOM
        if: github.event_name != 'pull_request'
        id: arc-sbom
        uses: actions/attest@v4
        with:
          subject-path: evidence/artifacts/axm-arc-game.tar.gz
          sbom-path: evidence/sbom/axm-arc.cdx.json
      - name: Preserve and verify offline Arc attestation material
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          cp '${{ steps.arc-provenance.outputs.bundle-path }}' evidence/attestations/axm-arc-build-provenance.jsonl
          cp '${{ steps.arc-sbom.outputs.bundle-path }}' evidence/attestations/axm-arc-sbom.jsonl
          gh attestation trusted-root > evidence/attestations/trusted_root.jsonl
          node scripts/supply-chain/verify-offline-evidence.mjs \
            --root evidence \
            --bundle evidence/attestations/axm-arc-build-provenance.jsonl \
            --trusted-root evidence/attestations/trusted_root.jsonl \
            --repo "$GITHUB_REPOSITORY" \
            --attested-subject artifacts/axm-arc-game.tar.gz \
            --require-signature
      - name: Upload Arc supply-chain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axm-arc-supply-chain-evidence
          path: evidence
          if-no-files-found: error
          retention-days: 30
