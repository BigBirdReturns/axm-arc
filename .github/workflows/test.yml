# The CI floor (train PR 092, RFC_TRAIN_RELEASE): typecheck + unit suite on
# every push/PR. This is the mechanical minimum, not the whole verification
# bar — headless drills stay receipts-not-CI per this repo's own doctrine
# (docs/drills/README.md), run by whoever ships.
#
# No stale-emit purge needed here: the purge exists because local `tsc -b`
# emits .js beside sources that shadow .ts under vitest; a fresh CI checkout
# has no emits to purge.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Record exact candidate identity
        run: git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Materialize persistence custody candidate
        if: github.event_name == 'pull_request' && github.head_ref == 'release/persistence-custody-v1'
        run: |
          set -euo pipefail
          python tools/apply-persistence-custody-v1.py
          git diff --check
      - run: npx tsc --noEmit
      - run: npx vitest run
      - name: Publish verified persistence custody and restore the CI floor
        if: github.event_name == 'pull_request' && github.head_ref == 'release/persistence-custody-v1'
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git fetch origin main
          git restore --source=origin/main --staged --worktree -- .github/workflows/test.yml
          git rm .github/workflows/apply-persistence-custody-trigger.yml
          git rm .github/workflows/apply-persistence-custody-v1.yml
          git rm tools/apply-persistence-custody-v1.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/lib/ledger.ts src/game/lib/raid-night.ts src/game/components/RaidNightScreen.tsx src/i18n/messages.ts
          git commit -m 'Surface and recover every load-bearing browser write'
          git push origin HEAD:"$TARGET_BRANCH"
