# TEMPORARY diagnostic variant for PR #116. This file is restored after the
# compiler output is captured; it is not part of the proposed scoring change.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture TypeScript diagnostics
        id: typecheck
        shell: bash
        run: |
          set +e
          npx tsc --noEmit 2>&1 | tee tsc-errors.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-116-tsc-errors
          path: tsc-errors.txt
          if-no-files-found: error
      - name: Enforce TypeScript result
        if: steps.typecheck.outputs.exit_code != '0'
        run: exit 1
      - run: npx vitest run
