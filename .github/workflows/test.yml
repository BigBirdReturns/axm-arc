# TEMPORARY diagnostic variant for PR #116. This file is restored after the
# failing Vitest output is captured; it is not part of the proposed change.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Capture Vitest diagnostics
        id: vitest
        shell: bash
        run: |
          set +e
          npx vitest run 2>&1 | tee vitest-errors.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload Vitest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-116-vitest-errors
          path: vitest-errors.txt
          if-no-files-found: error
      - name: Enforce Vitest result
        if: steps.vitest.outputs.exit_code != '0'
        run: exit 1
