name: Trigger ASOIAF credential deployment materialization v1

on:
  pull_request:
    branches:
      - feature/asoiaf-answer-desk-transport-enrollment-v1
    paths:
      - '.github/workflows/trigger-asoiaf-answer-credential-deployment-materializer-v1.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: trigger-asoiaf-answer-credential-deployment-materializer-v1
  cancel-in-progress: false

jobs:
  trigger:
    if: github.repository == 'BigBirdReturns/axm-arc' && github.event.pull_request.head.ref == 'feature/asoiaf-answer-credential-deployment-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: feature/asoiaf-answer-credential-deployment-v1
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact deployment construction head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
          show-progress: false

      - name: Delete this trigger and dispatch the retained materializer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -f .github/workflows/materialize-asoiaf-answer-credential-deployment-v1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/trigger-asoiaf-answer-credential-deployment-materializer-v1.yml
          git diff --cached --check
          git commit -m 'Dispatch credential deployment materializer'
          git push origin HEAD:"$BRANCH"
          gh workflow run materialize-asoiaf-answer-credential-deployment-v1.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$BRANCH"
