name: Watch terminal ASOIAF credential broker qualification v2

on:
  pull_request:
    branches:
      - feature/asoiaf-answer-credential-broker-v1
    paths:
      - '.github/workflows/observe-asoiaf-credential-broker-terminal-v2.yml'
      - '.github/workflows/watch-asoiaf-credential-broker-terminal-v2.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: read

concurrency:
  group: watch-asoiaf-credential-broker-terminal-v2
  cancel-in-progress: true

jobs:
  watch:
    if: github.repository == 'BigBirdReturns/axm-arc' && github.event.pull_request.head.ref == 'observer/asoiaf-credential-broker-terminal-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Watch terminal receipt or bounded failure
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_PR: '265'
          TARGET_SHA: d7b6c36a2c518d2ea3dfdbf02a8a69c95175e891
          MARKER: ASOIAF_CREDENTIAL_BROKER_TERMINAL_RECEIPT_V1
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 240); do
            comments="$RUNNER_TEMP/comments.json"
            gh api "repos/$GITHUB_REPOSITORY/issues/$TARGET_PR/comments?per_page=100" > "$comments"
            if jq -e --arg marker "$MARKER" '.[] | select(.body | contains($marker))' "$comments" >/dev/null; then
              gh api "repos/$GITHUB_REPOSITORY/pulls/$TARGET_PR" > "$RUNNER_TEMP/pr.json"
              test "$(jq -r .head.sha "$RUNNER_TEMP/pr.json")" = "$TARGET_SHA"
              exit 0
            fi
            if jq -e '.[] | select(.body | contains("Credential-broker terminal observer v2 failed"))' "$comments" >/dev/null; then
              exit 1
            fi
            sleep 15
          done
          echo 'terminal observer did not publish a bounded outcome' >&2
          exit 1
