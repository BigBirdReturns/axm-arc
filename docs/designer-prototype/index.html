<title>AXM Arc Designer · Roster Workshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="designer.css?v=10">
<link rel="stylesheet" href="workshop.css?v=10">
<style>
  /* ─────────────────────────────────────────────────────────────────
     Theme tokens. designer.css/workshop.css read every color as
     var(--token, fallback), so a whole theme is just this flat map.
     Light is the house default; [data-theme="dark"] swaps the same
     keys. --bar-bg / --bar-fg stay dark in BOTH modes so the top bar
     keeps its white-on-ink treatment regardless of theme.
     ───────────────────────────────────────────────────────────────── */
  :root{
    --accent:#b0623a; --ink:#211e1a; --muted:#6b6457; --dim:#9a9588;
    --rule:#e1dacb; --paper:#f6f2e9; --paper-alt:#ece5d6; --positive:#4a7a52;
    --bar-bg:#211e1a; --bar-fg:#f6f2e9;
    --mono:'IBM Plex Mono', monospace; --display:'Barlow Condensed', sans-serif;
    --body:'Lora', Georgia, serif;
    color-scheme: light;
  }
  :root[data-theme="dark"]{
    --accent:#cd8358; --ink:#ece4d4; --muted:#a59c8b; --dim:#6e675a;
    --rule:#352f27; --paper:#17150f; --paper-alt:#211d16; --positive:#74ad77;
    --bar-bg:#100e0b; --bar-fg:#ece4d4;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--paper);transition:background .25s ease;overflow-x:hidden;}
</style>
<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <rect width="100" height="100" fill="#211e1a"/>
    <rect x="30" y="30" width="40" height="40" rx="6" fill="#b0623a"/>
    <text x="50" y="58" font-family="sans-serif" font-size="22" font-weight="800" fill="#211e1a" text-anchor="middle">AX</text>
  </svg>
</template>
</head>
